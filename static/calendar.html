<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>금융공기업 채용 캘린더</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
  <link rel="apple-touch-icon" href="/static/favicon.svg" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.18/index.global.min.css" />
  <link rel="stylesheet" href="/static/calendar.css" />
</head>
<body>
  <header class="calendar-topbar">
    <div>
      <p class="eyebrow">2026 금융공기업 IT 일정</p>
      <h1>채용 캘린더</h1>
      <p id="calendarUpdatedAt" class="calendar-subtitle">일정 불러오는 중...</p>
    </div>
    <nav class="calendar-top-links" aria-label="페이지 링크">
      <a href="/wiki/page/02-01-%EA%B8%B0%EB%B3%B8-%EC%A0%84%EC%A0%9C%EC%99%80-%EC%9D%BC%EC%A0%95" target="_blank" rel="noopener noreferrer">위키 일정 문서</a>
      <a href="/">플래시카드</a>
      <a id="icsFeedLink" href="/api/calendar/recruitment.ics" target="_blank" rel="noopener noreferrer">ICS 피드</a>
    </nav>
  </header>

  <main class="calendar-layout">
    <section class="calendar-sidebar">
      <article class="calendar-panel">
        <h2>구독</h2>
        <p id="calendarIntro">캘린더 설명 불러오는 중...</p>
        <div class="subscription-actions">
          <a id="icsSubscribeLink" class="primary-link" href="/api/calendar/recruitment.ics" target="_blank" rel="noopener noreferrer">ICS 열기</a>
          <button id="copyIcsLinkBtn" type="button">ICS 링크 복사</button>
        </div>
        <ol id="calendarNotes" class="calendar-notes"></ol>
      </article>

      <article class="calendar-panel">
        <h2>필터</h2>
        <div>
          <p class="section-label">기관</p>
          <div id="institutionFilters" class="filter-chip-group"></div>
        </div>
        <div>
          <p class="section-label">유형</p>
          <div id="eventTypeFilters" class="filter-chip-group"></div>
        </div>
        <div>
          <p class="section-label">상태</p>
          <div id="statusFilters" class="filter-chip-group"></div>
        </div>
        <label class="calendar-toggle">
          <input id="hideApproximateToggle" type="checkbox" />
          예정 월/전후 일정 숨기기
        </label>
      </article>

      <article class="calendar-panel">
        <h2>요약</h2>
        <dl id="calendarCounts" class="calendar-counts"></dl>
      </article>

      <article class="calendar-panel">
        <h2>기관별 현황</h2>
        <div id="dashboardOpen" class="dashboard-list"></div>
        <h3>공고 미확인 기관</h3>
        <div id="dashboardWatch" class="dashboard-list"></div>
      </article>
    </section>

    <section class="calendar-main">
      <article class="calendar-panel">
        <div id="calendar"></div>
      </article>
      <article class="calendar-panel">
        <div class="event-list-header">
          <h2>일정 목록</h2>
          <span id="eventListCount" class="event-list-count"></span>
        </div>
        <div id="eventList" class="event-list"></div>
      </article>
      <article class="calendar-panel event-detail-panel">
        <div class="event-list-header">
          <h2>선택한 일정</h2>
          <span id="selectedEventBadge" class="event-pill" hidden></span>
        </div>
        <div id="selectedEventDetail" class="event-detail-empty">달력이나 목록에서 일정을 누르면 상세와 공고 링크를 보여준다.</div>
      </article>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.18/index.global.min.js"></script>
  <script src="/static/calendar.js"></script>
</body>
</html>
