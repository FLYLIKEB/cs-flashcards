  <circle cx="832" cy="545" r="6" fill="#0ea5e9" class="pulse" style="animation-delay:0.0s"/><text class="focus" x="850" y="553"><tspan x="850" dy="0">오답 원인은 보통 다음 세 가지로 분류한다:</tspan><tspan x="850" dy="18">개념(이론/정의) 부족, 계산 표기</tspan></text><circle cx="832" cy="603" r="6" fill="#0ea5e9" class="pulse" style="animation-delay:0.45s"/><text class="focus" x="850" y="611"><tspan x="850" dy="0">각 오답 항목에 대해 재풀이 날짜와 재풀이에</tspan><tspan x="850" dy="18">소요된 시간을 반드시 기록한다. 이는 &quot;시간</tspan></text><circle cx="832" cy="661" r="6" fill="#0ea5e9" class="pulse" style="animation-delay:0.9s"/><text class="focus" x="850" y="669"><tspan x="850" dy="0">동일 유형의 실수가 반복되면 문제 풀이</tspan><tspan x="850" dy="18">순서(예: 문제 전체를 먼저 훑고 쉬운</tspan></text>
  <rect x="86" y="618" width="1028" height="16" rx="8" fill="#e2e8f0" />
  <rect x="86" y="618" width="640" height="16" rx="8" fill="url(#line)" opacity="0.82">
