an></text><text class="body" x="628" y="340" text-anchor="start"></text><circle cx="700" cy="520" r="24" fill="#ffffff" stroke="#0ea5e9" stroke-width="3"/><text class="label" x="700" y="528" text-anchor="middle"><tspan x="700" dy="0">3</tspan></text><line x1="790" y1="370" x2="860" y2="370" stroke="#0ea5e9" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="790" y1="370" x2="860" y2="370" stroke="#0ea5e9" stroke-width="2" stroke-linecap="round" stroke-dasharray="10 8" opacity="0.5"><animate attributeName="stroke-dashoffset" from="0" to="-72" dur="4s" repeatCount="indefinite"/></line><rect x="860" y="270" width="180" height="200" rx="22" fill="#f0f9ff" stroke="#1d4ed8" stroke-width="2"/><text class="label" x="950" y="304" text-anchor="middle"><tspan x="950" dy="0">재검증</tspan></text><text class="body" x="878" y="340" text-anchor="start"></text><circle cx="950" cy="520" r="24" fill="#ffffff" stroke="#0ea5e9" stroke-width="3"/><text class="label" x="950" y="528" text-anchor="middle"><tspan x="950" dy="0">4</tspan></text><rect x="250" y="562" width="700" height="70" rx="22" fill="#ffffff" stroke="#0ea5e9" stroke-width="2"/><text class="label" x="600" y="596" text-anchor="middle"><tspan x="600" dy="0">풀이 루틴</tspan></text><text class="body" x="268" y="632" text-anchor="start"><tspan x="268" dy="0">오답 분류</tspan><tspan x="268" dy="18">원인 기록</tspan><tspan x="268" dy="18">재풀이</tspan></text>
