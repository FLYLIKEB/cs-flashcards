  <text class="small" x="84" y="86">금융공기업 IT · 페이지 맞춤 SVG</text>
  <text class="title" x="84" y="118" text-anchor="start"><tspan x="84" dy="0">12-04. 실전 오답노트</tspan></text>
  <text class="subtitle" x="84" y="180" text-anchor="start"><tspan x="84" dy="0">오답 원인은 보통 다음 세 가지로 분류한다: 개념(이론/정의) 부족, 계산 표기</tspan><tspan x="84" dy="24">실수(산술/단위/오타 등), 시간 관리 실패(풀다 말고 넘어감 등).</tspan></text>
