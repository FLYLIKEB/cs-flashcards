<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">09-01-01. 스택과 큐 활용 예시</title>
  <desc id="desc">스택과 큐가 대표적으로 쓰이는 문제 유형과 사고 흐름을 비교한 인포그래픽</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#eff6ff"/>
    </linearGradient>
    <style>
      .title { font: 700 34px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .subtitle { font: 500 18px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
      .section { font: 700 25px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .label { font: 700 18px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .body { font: 500 17px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
      .small { font: 600 15px 'Pretendard','Noto Sans KR',sans-serif; fill: #475569; }
      .chipLight { font: 700 14px 'Pretendard','Noto Sans KR',sans-serif; fill: #ffffff; }
      .chipDark { font: 700 14px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
    </style>
  </defs>

  <rect width="1200" height="760" fill="url(#bg)"/>
  <rect x="28" y="28" width="1144" height="704" rx="32" fill="#ffffff" stroke="#dbe4ff" stroke-width="2"/>

  <text x="74" y="94" class="title">스택·큐 활용 예시</text>
  <text x="74" y="132" class="subtitle">문제에서 필요한 처리 순서를 보면 어떤 자료구조를 써야 하는지 빠르게 판단할 수 있다.</text>

  <g transform="translate(62 184)">
    <rect x="0" y="0" width="498" height="492" rx="28" fill="#faf5ff" stroke="#d8b4fe" stroke-width="2"/>
    <rect x="24" y="24" width="140" height="34" rx="17" fill="#6d28d9"/>
    <text x="94" y="46" text-anchor="middle" class="chipLight">STACK 활용</text>
    <text x="24" y="98" class="section">나중 것을 먼저 처리</text>
    <text x="24" y="128" class="body">최근 상태를 바로 꺼내야 하면 스택을 떠올린다.</text>

    <rect x="24" y="166" width="450" height="82" rx="18" fill="#ffffff" stroke="#ddd6fe"/>
    <text x="44" y="194" class="label">괄호 검사</text>
    <text x="44" y="220" class="body">여는 괄호를 push하고 닫는 괄호가 나오면 pop해 짝을 확인한다.</text>

    <rect x="24" y="264" width="450" height="82" rx="18" fill="#ffffff" stroke="#ddd6fe"/>
    <text x="44" y="292" class="label">후위 표기식 계산</text>
    <text x="44" y="318" class="body">숫자는 push, 연산자를 만나면 최근 두 값을 pop해 계산 결과를 다시 push한다.</text>

    <rect x="24" y="362" width="450" height="94" rx="18" fill="#ffffff" stroke="#ddd6fe"/>
    <text x="44" y="390" class="label">DFS · 재귀</text>
    <text x="44" y="416" class="body">가장 최근에 방문한 지점으로 되돌아가며 깊게 탐색하는 흐름이 스택과 맞는다.</text>
    <text x="44" y="440" class="small">키워드: backtracking, call stack, undo</text>
  </g>

  <g transform="translate(640 184)">
    <rect x="0" y="0" width="498" height="492" rx="28" fill="#f0fdfa" stroke="#99f6e4" stroke-width="2"/>
    <rect x="24" y="24" width="140" height="34" rx="17" fill="#0891b2"/>
    <text x="94" y="46" text-anchor="middle" class="chipLight">QUEUE 활용</text>
    <text x="24" y="98" class="section">먼저 온 것을 먼저 처리</text>
    <text x="24" y="128" class="body">도착 순서가 곧 처리 순서라면 큐를 떠올린다.</text>

    <rect x="24" y="166" width="450" height="82" rx="18" fill="#ffffff" stroke="#bae6fd"/>
    <text x="44" y="194" class="label">BFS</text>
    <text x="44" y="220" class="body">먼저 발견한 정점부터 꺼내며 인접 정점을 뒤에 붙여 같은 거리 레벨을 유지한다.</text>

    <rect x="24" y="264" width="450" height="82" rx="18" fill="#ffffff" stroke="#bae6fd"/>
    <text x="44" y="292" class="label">레벨 순회</text>
    <text x="44" y="318" class="body">트리의 앞 레벨을 먼저 처리해야 다음 레벨의 순서가 자연스럽게 이어진다.</text>

    <rect x="24" y="362" width="450" height="94" rx="18" fill="#ffffff" stroke="#bae6fd"/>
    <text x="44" y="390" class="label">비가중치 최단거리</text>
    <text x="44" y="416" class="body">먼저 도착한 경로가 가장 짧기 때문에 큐로 탐색 순서를 지키면 된다.</text>
    <text x="44" y="440" class="small">키워드: level order, shortest steps, waiting line</text>
  </g>

  <g transform="translate(62 694)">
    <rect x="0" y="0" width="1076" height="18" rx="9" fill="#e2e8f0"/>
    <rect x="0" y="0" width="528" height="18" rx="9" fill="#a78bfa"/>
    <rect x="548" y="0" width="528" height="18" rx="9" fill="#67e8f9"/>
  </g>
  <text x="74" y="706" class="small">판단 기준: 최근 상태를 되돌리면 스택, 도착 순서를 보존하면 큐</text>
</svg>
