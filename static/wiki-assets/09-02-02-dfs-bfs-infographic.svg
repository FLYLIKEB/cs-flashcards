<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">09-02-02. DFS·BFS·최단경로 인포그래픽</title>
  <desc id="desc">깊이 우선 탐색, 너비 우선 탐색, 그리고 최단경로 알고리즘 선택 기준을 한 화면에 정리한 SVG</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="dfsGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="bfsGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ede9fe"/>
      <stop offset="100%" stop-color="#ddd6fe"/>
    </linearGradient>
    <linearGradient id="pathGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <style>
      .title { font: 800 34px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .subtitle { font: 500 17px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
      .panelTitle { font: 800 22px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .sectionLabel { font: 700 15px 'Pretendard','Noto Sans KR',sans-serif; fill: #1e293b; }
      .body { font: 500 14px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
      .small { font: 600 12px 'Pretendard','Noto Sans KR',sans-serif; fill: #475569; }
      .chip { font: 700 13px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .node { font: 700 15px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .cardTitle { font: 800 18px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .cardBody { font: 500 13px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
      .complexity { font: 700 12px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f766e; }
    </style>
  </defs>

  <rect width="1200" height="720" fill="url(#bg)"/>
  <rect x="24" y="24" width="1152" height="672" rx="30" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <text class="small" x="72" y="72">그래프 탐색과 최단경로 선택 기준</text>
  <text class="title" x="72" y="116">DFS · BFS · 최단경로</text>
  <text class="subtitle" x="72" y="148">무가중치 최단거리는 BFS, 가중치 조건이 붙으면 Dijkstra · Bellman-Ford · Floyd-Warshall로 분기한다.</text>

  <rect x="56" y="182" width="520" height="478" rx="28" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="600" y="182" width="544" height="478" rx="28" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>

  <text class="panelTitle" x="84" y="220">탐색 방식 비교</text>
  <text class="panelTitle" x="628" y="220">최단경로 알고리즘 선택표</text>

  <rect x="84" y="244" width="224" height="214" rx="22" fill="url(#dfsGrad)" stroke="#60a5fa" stroke-width="2"/>
  <rect x="324" y="244" width="224" height="214" rx="22" fill="url(#bfsGrad)" stroke="#8b5cf6" stroke-width="2"/>

  <text class="cardTitle" x="108" y="278">DFS</text>
  <text class="body" x="108" y="302">한 경로를 끝까지 추적</text>
  <text class="small" x="108" y="322">재귀 또는 스택으로 상태 관리</text>
  <rect x="100" y="336" width="84" height="28" rx="14" fill="#ffffff" opacity="0.92"/>
  <text class="chip" x="142" y="355" text-anchor="middle">순서 1→2→4→6</text>

  <line x1="146" y1="396" x2="214" y2="356" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
  <line x1="214" y1="356" x2="214" y2="416" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
  <line x1="214" y1="416" x2="266" y2="416" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
  <line x1="146" y1="396" x2="214" y2="446" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="6 6"/>
  <line x1="214" y1="356" x2="266" y2="356" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="6 6"/>
  <line x1="214" y1="446" x2="266" y2="416" stroke="#94a3b8" stroke-width="2.5" stroke-dasharray="6 6"/>

  <circle cx="146" cy="396" r="22" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
  <circle cx="214" cy="356" r="22" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
  <circle cx="214" cy="446" r="22" fill="#ffffff" stroke="#94a3b8" stroke-width="2.5"/>
  <circle cx="266" cy="356" r="22" fill="#ffffff" stroke="#94a3b8" stroke-width="2.5"/>
  <circle cx="214" cy="416" r="22" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
  <circle cx="266" cy="416" r="22" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>

  <text class="node" x="146" y="401" text-anchor="middle">1</text>
  <text class="node" x="214" y="361" text-anchor="middle">2</text>
  <text class="node" x="214" y="451" text-anchor="middle">3</text>
  <text class="node" x="266" y="361" text-anchor="middle">5</text>
  <text class="node" x="214" y="421" text-anchor="middle">4</text>
  <text class="node" x="266" y="421" text-anchor="middle">6</text>

  <text class="cardTitle" x="348" y="278">BFS</text>
  <text class="body" x="348" y="302">레벨 단위로 넓게 확장</text>
  <text class="small" x="348" y="322">큐를 사용해 간선 수 최단거리 보장</text>
  <rect x="340" y="336" width="90" height="28" rx="14" fill="#ffffff" opacity="0.92"/>
  <text class="chip" x="385" y="355" text-anchor="middle">거리 0→1→2</text>

  <line x1="386" y1="396" x2="438" y2="356" stroke="#7c3aed" stroke-width="4" stroke-linecap="round"/>
  <line x1="386" y1="396" x2="438" y2="446" stroke="#7c3aed" stroke-width="4" stroke-linecap="round"/>
  <line x1="438" y1="356" x2="490" y2="356" stroke="#7c3aed" stroke-width="4" stroke-linecap="round"/>
  <line x1="438" y1="356" x2="438" y2="416" stroke="#7c3aed" stroke-width="4" stroke-linecap="round"/>
  <line x1="438" y1="446" x2="490" y2="416" stroke="#7c3aed" stroke-width="4" stroke-linecap="round"/>

  <circle cx="386" cy="396" r="22" fill="#ffffff" stroke="#7c3aed" stroke-width="3"/>
  <circle cx="438" cy="356" r="22" fill="#ffffff" stroke="#7c3aed" stroke-width="3"/>
  <circle cx="438" cy="446" r="22" fill="#ffffff" stroke="#7c3aed" stroke-width="3"/>
  <circle cx="490" cy="356" r="22" fill="#ffffff" stroke="#7c3aed" stroke-width="3"/>
  <circle cx="438" cy="416" r="22" fill="#ffffff" stroke="#7c3aed" stroke-width="3"/>
  <circle cx="490" cy="416" r="22" fill="#ffffff" stroke="#7c3aed" stroke-width="3"/>

  <text class="node" x="386" y="401" text-anchor="middle">1</text>
  <text class="node" x="438" y="361" text-anchor="middle">2</text>
  <text class="node" x="438" y="451" text-anchor="middle">3</text>
  <text class="node" x="490" y="361" text-anchor="middle">4</text>
  <text class="node" x="438" y="421" text-anchor="middle">5</text>
  <text class="node" x="490" y="421" text-anchor="middle">6</text>

  <rect x="84" y="486" width="464" height="142" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text class="sectionLabel" x="108" y="518">선택 기준 요약</text>
  <text class="body" x="108" y="546">• 모든 정점 방문 / 백트래킹 필요 → DFS가 자연스럽다.</text>
  <text class="body" x="108" y="572">• 무가중치 그래프 최단거리 → BFS가 정답이다.</text>
  <text class="body" x="108" y="598">• DFS는 깊이, BFS는 레벨을 먼저 기억하면 시험 문제 분기가 빨라진다.</text>

  <rect x="628" y="246" width="488" height="70" rx="18" fill="#ecfeff" stroke="#14b8a6" stroke-width="2"/>
  <text class="sectionLabel" x="654" y="274">1단계: 먼저 간선 조건을 확인</text>
  <text class="body" x="654" y="298">무가중치인지, 비음수 가중치인지, 음수 간선/음수 사이클 여부가 있는지부터 본다.</text>

  <line x1="872" y1="316" x2="872" y2="350" stroke="#14b8a6" stroke-width="3"/>
  <line x1="708" y1="350" x2="1036" y2="350" stroke="#14b8a6" stroke-width="3"/>
  <line x1="708" y1="350" x2="708" y2="370" stroke="#14b8a6" stroke-width="3"/>
  <line x1="872" y1="350" x2="872" y2="370" stroke="#14b8a6" stroke-width="3"/>
  <line x1="1036" y1="350" x2="1036" y2="370" stroke="#14b8a6" stroke-width="3"/>

  <rect x="636" y="370" width="144" height="116" rx="18" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
  <rect x="800" y="370" width="144" height="116" rx="18" fill="#ffffff" stroke="#0ea5e9" stroke-width="2"/>
  <rect x="964" y="370" width="144" height="116" rx="18" fill="#ffffff" stroke="#f97316" stroke-width="2"/>

  <text class="cardTitle" x="708" y="400" text-anchor="middle">BFS</text>
  <text class="cardBody" x="656" y="424">무가중치</text>
  <text class="cardBody" x="656" y="444">단일 시작점</text>
  <text class="cardBody" x="656" y="464">간선 수 기준 최단거리</text>
  <text class="complexity" x="656" y="482">Queue · O(V+E)</text>

  <text class="cardTitle" x="872" y="400" text-anchor="middle">Dijkstra</text>
  <text class="cardBody" x="820" y="424">가중치 ≥ 0</text>
  <text class="cardBody" x="820" y="444">단일 시작점</text>
  <text class="cardBody" x="820" y="464">희소 그래프에 강함</text>
  <text class="complexity" x="820" y="482">PQ · O((V+E) log V)</text>

  <text class="cardTitle" x="1036" y="400" text-anchor="middle">Bellman-Ford</text>
  <text class="cardBody" x="984" y="424">음수 간선 허용</text>
  <text class="cardBody" x="984" y="444">음수 사이클 탐지 가능</text>
  <text class="cardBody" x="984" y="464">느리지만 조건 대응</text>
  <text class="complexity" x="984" y="482">O(V×E)</text>

  <rect x="636" y="510" width="472" height="118" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="660" y="534" width="180" height="70" rx="16" fill="#f8fafc" stroke="#22c55e" stroke-width="2"/>
  <text class="cardTitle" x="750" y="562" text-anchor="middle">Floyd-Warshall</text>
  <text class="cardBody" x="680" y="584">모든 쌍 최단경로</text>
  <text class="complexity" x="680" y="602">작은 정점 수 · O(V³)</text>

  <path d="M 860 570 H 932" fill="none" stroke="url(#pathGrad)" stroke-width="8" stroke-linecap="round" stroke-dasharray="16 10">
    <animate attributeName="stroke-dashoffset" from="0" to="-52" dur="3s" repeatCount="indefinite"/>
  </path>
  <rect x="932" y="534" width="152" height="70" rx="16" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text class="sectionLabel" x="1008" y="562" text-anchor="middle">시험 포인트</text>
  <text class="cardBody" x="950" y="584">정점 수가 작고</text>
  <text class="cardBody" x="950" y="600">모든 쌍이면 선택</text>

  <rect x="72" y="72" width="112" height="26" rx="13" fill="#dbeafe"/>
  <text class="chip" x="128" y="90" text-anchor="middle">09-02-02</text>

  <text class="small" x="72" y="680">같은 그래프라도 DFS는 깊이를, BFS는 레벨을 따라가며 최단경로는 가중치 조건으로 알고리즘이 갈린다.</text>
</svg>
