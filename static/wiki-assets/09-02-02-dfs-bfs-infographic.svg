<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc">
  <title id="title">09-02-02 DFS와 BFS 비교</title>
  <desc id="desc">DFS와 BFS의 탐색 순서, 사용하는 자료구조, 적합한 문제 유형을 분리된 카드와 그래프로 비교한 인포그래픽</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .frame { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .title { font: 800 36px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .subtitle { font: 500 18px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
      .section { font: 800 24px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .cardTitle { font: 800 22px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .body { font: 500 16px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
      .label { font: 700 15px 'Pretendard','Noto Sans KR',sans-serif; fill: #1e293b; }
      .chipText { font: 800 14px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .nodeText { font: 800 16px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .small { font: 600 13px 'Pretendard','Noto Sans KR',sans-serif; fill: #475569; }
      .tableHead { font: 800 16px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .tableBody { font: 500 15px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="860"/>
  <rect class="frame" x="24" y="24" width="1152" height="812" rx="30"/>

  <rect x="64" y="56" width="118" height="32" rx="16" fill="#dbeafe"/>
  <text class="chipText" x="123" y="77" text-anchor="middle">09-02-02</text>
  <text class="title" x="64" y="126">DFS · BFS 탐색 비교</text>
  <text class="subtitle" x="64" y="158">깊이 우선은 한 갈래를 끝까지 파고들고, 너비 우선은 가까운 정점부터 레벨 순서로 확장한다.</text>

  <rect x="64" y="198" width="516" height="382" rx="26" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <rect x="620" y="198" width="516" height="382" rx="26" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>

  <text class="cardTitle" x="96" y="238">DFS: 깊이 우선 탐색</text>
  <text class="body" x="96" y="268">스택 또는 재귀로 현재 경로를 기억하고, 더 갈 수 없을 때 되돌아온다.</text>
  <rect x="96" y="288" width="148" height="34" rx="17" fill="#ffffff" stroke="#bfdbfe"/>
  <text class="chipText" x="170" y="310" text-anchor="middle">방문 예: 1→2→4→6</text>

  <line x1="166" y1="390" x2="254" y2="330" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/>
  <line x1="254" y1="330" x2="254" y2="450" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/>
  <line x1="254" y1="450" x2="342" y2="450" stroke="#2563eb" stroke-width="5" stroke-linecap="round"/>
  <line x1="166" y1="390" x2="254" y2="510" stroke="#94a3b8" stroke-width="3" stroke-dasharray="8 7" stroke-linecap="round"/>
  <line x1="254" y1="330" x2="342" y2="330" stroke="#94a3b8" stroke-width="3" stroke-dasharray="8 7" stroke-linecap="round"/>
  <line x1="254" y1="510" x2="342" y2="450" stroke="#94a3b8" stroke-width="3" stroke-dasharray="8 7" stroke-linecap="round"/>

  <circle cx="166" cy="390" r="28" fill="#ffffff" stroke="#2563eb" stroke-width="4"/>
  <circle cx="254" cy="330" r="28" fill="#ffffff" stroke="#2563eb" stroke-width="4"/>
  <circle cx="254" cy="510" r="28" fill="#ffffff" stroke="#94a3b8" stroke-width="3"/>
  <circle cx="342" cy="330" r="28" fill="#ffffff" stroke="#94a3b8" stroke-width="3"/>
  <circle cx="254" cy="450" r="28" fill="#ffffff" stroke="#2563eb" stroke-width="4"/>
  <circle cx="342" cy="450" r="28" fill="#ffffff" stroke="#2563eb" stroke-width="4"/>

  <text class="nodeText" x="166" y="396" text-anchor="middle">1</text>
  <text class="nodeText" x="254" y="336" text-anchor="middle">2</text>
  <text class="nodeText" x="254" y="516" text-anchor="middle">3</text>
  <text class="nodeText" x="342" y="336" text-anchor="middle">5</text>
  <text class="nodeText" x="254" y="456" text-anchor="middle">4</text>
  <text class="nodeText" x="342" y="456" text-anchor="middle">6</text>

  <rect x="390" y="312" width="156" height="194" rx="18" fill="#ffffff" stroke="#bfdbfe"/>
  <text class="label" x="414" y="346">언제 자연스러운가</text>
  <text class="body" x="414" y="378">• 경로 존재 여부 확인</text>
  <text class="body" x="414" y="408">• 백트래킹 / 완전탐색</text>
  <text class="body" x="414" y="438">• 사이클 검사, 위상 정렬</text>
  <text class="body" x="414" y="468">• 재귀 구조 문제 풀이</text>
  <text class="small" x="414" y="498">핵심 기억: 먼저 깊게 들어간다.</text>

  <text class="cardTitle" x="652" y="238">BFS: 너비 우선 탐색</text>
  <text class="body" x="652" y="268">큐로 같은 거리의 정점을 묶어서 처리하므로 무가중치 최단거리를 바로 구할 수 있다.</text>
  <rect x="652" y="288" width="142" height="34" rx="17" fill="#ffffff" stroke="#ddd6fe"/>
  <text class="chipText" x="723" y="310" text-anchor="middle">거리 레벨: 0→1→2</text>

  <line x1="728" y1="390" x2="816" y2="330" stroke="#7c3aed" stroke-width="5" stroke-linecap="round"/>
  <line x1="728" y1="390" x2="816" y2="510" stroke="#7c3aed" stroke-width="5" stroke-linecap="round"/>
  <line x1="816" y1="330" x2="904" y2="330" stroke="#7c3aed" stroke-width="5" stroke-linecap="round"/>
  <line x1="816" y1="330" x2="816" y2="450" stroke="#7c3aed" stroke-width="5" stroke-linecap="round"/>
  <line x1="816" y1="510" x2="904" y2="450" stroke="#7c3aed" stroke-width="5" stroke-linecap="round"/>

  <circle cx="728" cy="390" r="28" fill="#ffffff" stroke="#7c3aed" stroke-width="4"/>
  <circle cx="816" cy="330" r="28" fill="#ffffff" stroke="#7c3aed" stroke-width="4"/>
  <circle cx="816" cy="510" r="28" fill="#ffffff" stroke="#7c3aed" stroke-width="4"/>
  <circle cx="904" cy="330" r="28" fill="#ffffff" stroke="#7c3aed" stroke-width="4"/>
  <circle cx="816" cy="450" r="28" fill="#ffffff" stroke="#7c3aed" stroke-width="4"/>
  <circle cx="904" cy="450" r="28" fill="#ffffff" stroke="#7c3aed" stroke-width="4"/>

  <text class="nodeText" x="728" y="396" text-anchor="middle">1</text>
  <text class="nodeText" x="816" y="336" text-anchor="middle">2</text>
  <text class="nodeText" x="816" y="516" text-anchor="middle">3</text>
  <text class="nodeText" x="904" y="336" text-anchor="middle">4</text>
  <text class="nodeText" x="816" y="456" text-anchor="middle">5</text>
  <text class="nodeText" x="904" y="456" text-anchor="middle">6</text>

  <rect x="948" y="312" width="156" height="194" rx="18" fill="#ffffff" stroke="#ddd6fe"/>
  <text class="label" x="972" y="346">언제 정답인가</text>
  <text class="body" x="972" y="378">• 무가중치 최단거리</text>
  <text class="body" x="972" y="408">• 최소 이동 횟수 계산</text>
  <text class="body" x="972" y="438">• 레벨 순서 방문 출력</text>
  <text class="body" x="972" y="468">• 가까운 후보부터 확장</text>
  <text class="small" x="972" y="498">핵심 기억: 가까운 곳부터 넓힌다.</text>

  <rect x="64" y="612" width="1072" height="180" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text class="section" x="96" y="652">한눈에 비교</text>

  <line x1="96" y1="678" x2="1104" y2="678" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="338" y1="678" x2="338" y2="772" stroke="#e2e8f0" stroke-width="2"/>
  <line x1="632" y1="678" x2="632" y2="772" stroke="#e2e8f0" stroke-width="2"/>
  <line x1="850" y1="678" x2="850" y2="772" stroke="#e2e8f0" stroke-width="2"/>
  <line x1="96" y1="724" x2="1104" y2="724" stroke="#e2e8f0" stroke-width="2"/>

  <text class="tableHead" x="116" y="708">구분</text>
  <text class="tableHead" x="368" y="708">DFS</text>
  <text class="tableHead" x="662" y="708">BFS</text>
  <text class="tableHead" x="880" y="708">시험에서 바로 찾는 단서</text>

  <text class="tableBody" x="116" y="756">탐색 순서 / 자료구조</text>
  <text class="tableBody" x="368" y="756">깊게 전진, 스택·재귀</text>
  <text class="tableBody" x="662" y="756">레벨 확장, 큐</text>
  <text class="tableBody" x="880" y="756">무가중 최단거리면 BFS, 경로 탐색·백트래킹이면 DFS</text>

  <text class="small" x="64" y="822">같은 그래프라도 DFS는 경로를 깊게 따라가고, BFS는 간선 수가 짧은 정점부터 차례대로 방문한다.</text>
</svg>