<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">14-1. 데이터패스와 제어장치</title>
  <desc id="desc">제어장치가 명령어를 해석해 데이터패스의 PC, 레지스터 파일, ALU, 메모리 접근을 제어하는 관계를 설명하는 SVG</desc>
  <defs>
    <style>
      .title { font: 700 32px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .subtitle { font: 500 18px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
      .section { font: 700 21px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .label { font: 700 18px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .body { font: 500 15px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
      .small { font: 600 13px 'Pretendard','Noto Sans KR',sans-serif; fill: #475569; }
      .tiny { font: 600 12px 'Pretendard','Noto Sans KR',sans-serif; fill: #475569; }
    </style>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowSlate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect width="1200" height="620" fill="#f8fafc"/>
  <rect x="28" y="28" width="1144" height="564" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <text x="72" y="86" class="title">제어장치는 명령을 해석하고, 데이터패스는 실제 값을 움직인다</text>
  <text x="72" y="118" class="subtitle">CPU 설계 문제에서 둘의 역할을 구분하면 fetch-decode-execute 흐름과 hazard 설명이 훨씬 선명해진다.</text>

  <rect x="90" y="160" width="1020" height="118" rx="24" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <text x="114" y="198" class="section">제어장치(Control Unit)</text>
  <text x="114" y="224" class="body">opcode와 상태 비트를 해석해 RegWrite, ALUSrc, MemRead, MemWrite, Branch 같은 제어 신호를 만든다.</text>
  <text x="114" y="248" class="small">즉, 어떤 회로를 언제 열고 닫을지 결정하는 오케스트라 지휘자 역할이다.</text>

  <rect x="90" y="318" width="1020" height="224" rx="24" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="114" y="356" class="section">데이터패스(Datapath)</text>
  <text x="114" y="380" class="small">PC → 명령어 메모리 → 레지스터 파일 → ALU → 데이터 메모리 → 레지스터 기록 흐름으로 실제 데이터가 이동한다.</text>

  <rect x="120" y="424" width="120" height="64" rx="18" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
  <rect x="280" y="424" width="154" height="64" rx="18" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
  <rect x="474" y="424" width="150" height="64" rx="18" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
  <rect x="664" y="424" width="166" height="64" rx="18" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
  <rect x="870" y="424" width="194" height="64" rx="18" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>

  <text x="180" y="451" text-anchor="middle" class="label">PC</text>
  <text x="180" y="472" text-anchor="middle" class="tiny">다음 명령 주소</text>

  <text x="357" y="451" text-anchor="middle" class="label">명령어 메모리</text>
  <text x="357" y="472" text-anchor="middle" class="tiny">instruction fetch</text>

  <text x="549" y="451" text-anchor="middle" class="label">레지스터 파일</text>
  <text x="549" y="472" text-anchor="middle" class="tiny">operand 읽기 / 결과 기록</text>

  <text x="747" y="451" text-anchor="middle" class="label">ALU</text>
  <text x="747" y="472" text-anchor="middle" class="tiny">산술·논리 / 주소 계산</text>

  <text x="967" y="451" text-anchor="middle" class="label">데이터 메모리</text>
  <text x="967" y="472" text-anchor="middle" class="tiny">load/store 시 접근</text>

  <line x1="240" y1="456" x2="280" y2="456" stroke="#475569" stroke-width="4" marker-end="url(#arrowSlate)"/>
  <line x1="434" y1="456" x2="474" y2="456" stroke="#475569" stroke-width="4" marker-end="url(#arrowSlate)"/>
  <line x1="624" y1="456" x2="664" y2="456" stroke="#475569" stroke-width="4" marker-end="url(#arrowSlate)"/>
  <line x1="830" y1="456" x2="870" y2="456" stroke="#475569" stroke-width="4" marker-end="url(#arrowSlate)"/>

  <line x1="967" y1="424" x2="967" y2="404" stroke="#475569" stroke-width="4"/>
  <line x1="967" y1="404" x2="549" y2="404" stroke="#475569" stroke-width="4" marker-end="url(#arrowSlate)"/>
  <text x="720" y="396" class="tiny">WB: 결과가 다시 레지스터 파일로 돌아감</text>

  <line x1="357" y1="278" x2="357" y2="424" stroke="#d97706" stroke-width="4" stroke-dasharray="8 8" marker-end="url(#arrowAmber)"/>
  <line x1="549" y1="278" x2="549" y2="424" stroke="#d97706" stroke-width="4" stroke-dasharray="8 8" marker-end="url(#arrowAmber)"/>
  <line x1="747" y1="278" x2="747" y2="424" stroke="#d97706" stroke-width="4" stroke-dasharray="8 8" marker-end="url(#arrowAmber)"/>
  <line x1="967" y1="278" x2="967" y2="424" stroke="#d97706" stroke-width="4" stroke-dasharray="8 8" marker-end="url(#arrowAmber)"/>

  <text x="382" y="306" class="small">제어 신호</text>
  <text x="566" y="306" class="small">RegWrite</text>
  <text x="764" y="306" class="small">ALUOp / Branch</text>
  <text x="954" y="306" class="small">MemRead / MemWrite</text>

  <rect x="120" y="510" width="944" height="20" rx="10" fill="#dbeafe"/>
  <text x="132" y="524" class="small">핵심 기억법: control은 “무엇을 할지 결정”, datapath는 “값을 어디로 보낼지 실행”한다.</text>
</svg>
