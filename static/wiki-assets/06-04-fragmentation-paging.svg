<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">06-04 단편화와 페이징 비교</title>
  <desc id="desc">내부 단편화, 외부 단편화, 페이징과 세그먼트의 차이를 분리해서 설명하는 SVG</desc>
  <defs>
    <style>
      .title { font: 700 34px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .subtitle { font: 500 17px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
      .section { font: 700 22px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .label { font: 700 17px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .body { font: 500 15px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
      .small { font: 600 13px 'Pretendard','Noto Sans KR',sans-serif; fill: #475569; }
      .chip { font: 700 13px 'Pretendard','Noto Sans KR',sans-serif; fill: #1e293b; }
    </style>
  </defs>

  <rect width="1200" height="760" fill="#f8fafc" />
  <rect x="28" y="28" width="1144" height="704" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />

  <text class="title" x="72" y="92">단편화와 할당 방식 비교</text>
  <text class="subtitle" x="72" y="124">헷갈리는 내부·외부 단편화와 페이징·세그먼트를 두 묶음으로 나눠 본다.</text>

  <rect x="60" y="156" width="500" height="528" rx="24" fill="#f8fafc" stroke="#cbd5e1" />
  <text class="section" x="88" y="198">1) 내부 단편화 vs 외부 단편화</text>
  <text class="body" x="88" y="226">핵심: 낭비가 블록 안에 있으면 내부, 빈 공간이 흩어져 있으면 외부 단편화다.</text>

  <rect x="88" y="254" width="204" height="176" rx="20" fill="#dbeafe" stroke="#60a5fa" stroke-width="2" />
  <text class="label" x="190" y="288" text-anchor="middle">내부 단편화</text>
  <rect x="112" y="316" width="150" height="42" rx="10" fill="#93c5fd" />
  <rect x="220" y="316" width="42" height="42" rx="10" fill="#f59e0b" />
  <text class="chip" x="187" y="343" text-anchor="middle">프로세스가 실제 사용</text>
  <text class="chip" x="241" y="343" text-anchor="middle">낭비</text>
  <text class="body" x="112" y="385">• 고정 크기 블록을 배정했는데</text>
  <text class="body" x="112" y="407">  남은 칸이 블록 내부에 생긴다.</text>

  <rect x="324" y="254" width="204" height="176" rx="20" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2" />
  <text class="label" x="426" y="288" text-anchor="middle">외부 단편화</text>
  <rect x="350" y="318" width="36" height="40" rx="10" fill="#c4b5fd" />
  <rect x="396" y="318" width="88" height="40" rx="10" fill="#8b5cf6" />
  <rect x="494" y="318" width="18" height="40" rx="10" fill="#c4b5fd" />
  <text class="chip" x="439" y="343" text-anchor="middle">사용 중인 큰 블록</text>
  <text class="body" x="350" y="385">• 빈 공간 총합은 충분해도</text>
  <text class="body" x="350" y="407">  연속 공간이 아니면 할당이 어렵다.</text>

  <rect x="88" y="458" width="440" height="196" rx="20" fill="#ffffff" stroke="#cbd5e1" />
  <text class="label" x="112" y="492">시험 답안 한 줄</text>
  <text class="body" x="112" y="525">• 내부 단편화 = 할당된 블록 내부의 남는 공간</text>
  <text class="body" x="112" y="555">• 외부 단편화 = 빈 공간이 분산되어 연속 할당이 안 되는 문제</text>
  <text class="body" x="112" y="585">• 고정 분할·페이징은 내부 단편화와,</text>
  <text class="body" x="112" y="607">  세그먼트·연속 할당은 외부 단편화와 연결해 설명하면 된다.</text>

  <rect x="590" y="156" width="550" height="528" rx="24" fill="#f8fafc" stroke="#cbd5e1" />
  <text class="section" x="618" y="198">2) 페이징 vs 세그먼트</text>
  <text class="body" x="618" y="226">핵심: 페이징은 같은 크기로 잘라 관리하고, 세그먼트는 의미 단위별로 길이가 달라진다.</text>

  <rect x="618" y="258" width="230" height="182" rx="20" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" />
  <text class="label" x="733" y="292" text-anchor="middle">페이징</text>
  <rect x="654" y="324" width="158" height="18" rx="6" fill="#2563eb" />
  <rect x="654" y="352" width="158" height="18" rx="6" fill="#60a5fa" />
  <rect x="654" y="380" width="158" height="18" rx="6" fill="#93c5fd" />
  <text class="body" x="654" y="421">• 고정 크기 페이지/프레임 사용</text>
  <text class="body" x="654" y="443">• 관리가 단순하고 외부 단편화 완화</text>

  <rect x="882" y="258" width="230" height="182" rx="20" fill="#faf5ff" stroke="#a855f7" stroke-width="2" />
  <text class="label" x="997" y="292" text-anchor="middle">세그먼트</text>
  <rect x="918" y="324" width="82" height="18" rx="6" fill="#c084fc" />
  <rect x="918" y="352" width="146" height="18" rx="6" fill="#a855f7" />
  <rect x="918" y="380" width="112" height="18" rx="6" fill="#d8b4fe" />
  <text class="body" x="918" y="421">• 코드·데이터·스택처럼 의미별 분할</text>
  <text class="body" x="918" y="443">• 길이가 달라 외부 단편화 가능</text>

  <rect x="618" y="470" width="494" height="184" rx="20" fill="#ffffff" stroke="#cbd5e1" />
  <text class="label" x="642" y="504">빠른 비교</text>
  <text class="small" x="642" y="536">고정 크기 관리</text>
  <text class="body" x="794" y="536">페이징은 일정한 크기로 잘라 단순하게 관리한다.</text>
  <text class="small" x="642" y="568">논리 단위 보존</text>
  <text class="body" x="794" y="568">세그먼트는 프로그램 의미를 그대로 반영한다.</text>
  <text class="small" x="642" y="600">자주 연결되는 단편화</text>
  <text class="body" x="794" y="600">페이징은 내부, 세그먼트는 외부 단편화와 함께 설명한다.</text>
  <text class="small" x="642" y="632">시험 포인트</text>
  <text class="body" x="794" y="632">"왜 그런 단편화가 생기는가"까지 말하면 답안이 강해진다.</text>
</svg>
