<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">06-02-02. 선점형과 비선점형 인포그래픽</title>
  <desc id="desc">CPU를 강제로 회수할 수 있는지에 따라 비선점형과 선점형을 비교하고, P1·P2 타임라인으로 응답성과 문맥교환 차이를 보여주는 SVG</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="leftPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#eff6ff"/>
    </linearGradient>
    <linearGradient id="rightPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ede9fe"/>
      <stop offset="100%" stop-color="#f5f3ff"/>
    </linearGradient>
    <style>
      .title { font: 700 34px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .subtitle { font: 500 16px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
      .section { font: 700 22px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .label { font: 700 16px 'Pretendard','Noto Sans KR',sans-serif; fill: #1e293b; }
      .body { font: 500 14px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
      .small { font: 600 12px 'Pretendard','Noto Sans KR',sans-serif; fill: #475569; }
      .tick { font: 600 12px 'Pretendard','Noto Sans KR',sans-serif; fill: #64748b; }
      .white { fill: #ffffff; }
      .p1 { fill: #2563eb; }
      .p2 { fill: #8b5cf6; }
      .swap { fill: #f97316; }
      .good { fill: #047857; }
      .warn { fill: #b45309; }
    </style>
  </defs>

  <rect width="1200" height="720" fill="url(#bg)"/>
  <rect x="24" y="24" width="1152" height="672" rx="28" fill="#ffffff" stroke="#cbd5e1"/>

  <text class="small" x="64" y="66">운영체제 · CPU 스케줄링</text>
  <text class="title" x="64" y="108">선점형 vs 비선점형: CPU를 빼앗을 수 있는가?</text>
  <text class="subtitle" x="64" y="140">같은 작업 P1(도착 0, 실행 8)·P2(도착 2, 실행 2)라도, 중간 강제 교체 가능 여부에 따라 응답시간과 문맥교환 수가 달라진다.</text>

  <rect x="64" y="176" width="496" height="336" rx="24" fill="url(#leftPanel)" stroke="#93c5fd"/>
  <rect x="640" y="176" width="496" height="336" rx="24" fill="url(#rightPanel)" stroke="#c4b5fd"/>

  <text class="section" x="96" y="220">비선점형</text>
  <text class="body" x="96" y="246">CPU는 종료 또는 I/O 요청 때만 넘어간다.</text>
  <text class="small" x="96" y="274">긴 작업이 먼저 잡으면 뒤 작업은 Ready여도 기다린다.</text>

  <rect x="96" y="302" width="432" height="48" rx="16" fill="#ffffff" stroke="#bfdbfe"/>
  <text class="label" x="120" y="332">실행 중 P1</text>
  <circle cx="256" cy="326" r="6" fill="#2563eb"/>
  <text class="body" x="272" y="332">P2 도착</text>
  <path d="M 348 326 H 504" stroke="#94a3b8" stroke-width="4" stroke-dasharray="8 8"/>
  <text class="body" x="360" y="332">교체 없음 → P1 계속 실행</text>

  <text class="label" x="96" y="384">타임라인</text>
  <line x1="124" y1="434" x2="500" y2="434" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <rect x="124" y="410" width="300" height="48" rx="14" class="p1"/>
  <rect x="424" y="410" width="76" height="48" rx="14" class="p2"/>
  <text x="274" y="440" text-anchor="middle" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="18" font-weight="700" fill="#ffffff">P1 실행 0~8</text>
  <text x="462" y="440" text-anchor="middle" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="18" font-weight="700" fill="#ffffff">P2 8~10</text>
  <text class="tick" x="120" y="484">0</text>
  <text class="tick" x="196" y="484">2</text>
  <text class="tick" x="420" y="484">8</text>
  <text class="tick" x="496" y="484">10</text>
  <text class="body" x="96" y="502">응답시간: P1=0, P2=8 · 문맥교환 적음 · 구현 단순</text>

  <text class="section" x="672" y="220">선점형</text>
  <text class="body" x="672" y="246">time quantum 만료, 더 높은 우선순위, 더 짧은 잔여시간 도착 시 강제 회수 가능</text>
  <text class="small" x="672" y="274">새 작업이 더 급하면 현재 작업을 중단하고 PCB에 문맥 저장 후 교체한다.</text>

  <rect x="672" y="302" width="432" height="48" rx="16" fill="#ffffff" stroke="#ddd6fe"/>
  <text class="label" x="696" y="332">실행 중 P1</text>
  <circle cx="832" cy="326" r="6" fill="#8b5cf6"/>
  <text class="body" x="848" y="332">P2 도착</text>
  <path d="M 924 326 H 1016" stroke="#f97316" stroke-width="4" stroke-linecap="round"/>
  <polygon points="1016,326 1002,318 1002,334" fill="#f97316"/>
  <text class="body" x="924" y="312">즉시 선점</text>

  <text class="label" x="672" y="384">타임라인</text>
  <line x1="700" y1="434" x2="1076" y2="434" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <rect x="700" y="410" width="76" height="48" rx="14" class="p1"/>
  <rect x="776" y="410" width="76" height="48" rx="14" class="p2"/>
  <rect x="852" y="410" width="224" height="48" rx="14" class="p1"/>
  <rect x="770" y="398" width="12" height="72" rx="6" class="swap"/>
  <rect x="846" y="398" width="12" height="72" rx="6" class="swap"/>
  <text x="738" y="440" text-anchor="middle" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="17" font-weight="700" fill="#ffffff">P1 0~2</text>
  <text x="814" y="440" text-anchor="middle" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="17" font-weight="700" fill="#ffffff">P2 2~4</text>
  <text x="964" y="440" text-anchor="middle" font-family="Pretendard, Noto Sans KR, sans-serif" font-size="18" font-weight="700" fill="#ffffff">P1 4~10</text>
  <text class="tick" x="696" y="484">0</text>
  <text class="tick" x="772" y="484">2</text>
  <text class="tick" x="848" y="484">4</text>
  <text class="tick" x="1072" y="484">10</text>
  <text class="body" x="672" y="502">응답시간: P1=0, P2=0 · 평균 반환시간 개선 가능 · 문맥교환 오버헤드 증가</text>

  <rect x="64" y="540" width="1072" height="124" rx="24" fill="#0f172a"/>
  <text class="section white" x="96" y="580">빠른 판단 기준</text>
  <text class="label white" x="96" y="612">CPU가 아직 안 끝났는데 다른 프로세스로 바뀌었다?</text>
  <text class="body" x="96" y="636" fill="#cbd5e1">→ 선점형이다. 원인은 time quantum 만료, 더 높은 우선순위, 더 짧은 잔여시간 도착일 가능성이 크다.</text>

  <circle cx="744" cy="594" r="8" class="good"/>
  <text class="label white" x="762" y="600">선점형 장점: 응답성↑, 대화형 시스템 적합</text>
  <circle cx="744" cy="626" r="8" class="warn"/>
  <text class="label white" x="762" y="632">주의점: 문맥교환 비용↑, 우선순위 설계 미흡 시 기아 발생</text>

  <text class="small" x="1048" y="664">06-02-02-infographic.svg</text>
</svg>
