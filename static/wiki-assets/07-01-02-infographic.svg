<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">07-01-02. 키와 무결성 SVG 인포그래픽</title>
  <desc id="desc">후보키, 기본키, 외래키와 엔터티 무결성, 참조 무결성, 도메인 무결성의 관계를 학생과 성적 테이블 예시로 설명하는 인포그래픽</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="55%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#ecfeff"/>
    </linearGradient>
    <linearGradient id="keyGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="integrityGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#0f766e"/>
    </marker>
    <style>
      .title { font: 700 34px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .subtitle { font: 500 17px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
      .section { font: 700 21px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .label { font: 700 17px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .body { font: 500 15px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
      .small { font: 600 13px 'Pretendard','Noto Sans KR',sans-serif; fill: #475569; }
      .tiny { font: 600 12px 'Pretendard','Noto Sans KR',sans-serif; fill: #64748b; }
      .white { fill: #ffffff; }
      .center { text-anchor: middle; }
      .mono { font: 700 15px 'SFMono-Regular','Consolas',monospace; }
    </style>
  </defs>

  <rect width="1200" height="720" fill="url(#bg)"/>
  <rect x="28" y="28" width="1144" height="664" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <text class="small" x="76" y="82">데이터베이스 · 07-01-02</text>
  <text class="title" x="76" y="122">키와 무결성</text>
  <text class="subtitle" x="76" y="156">후보키 → 기본키 선택 → 외래키 연결, 그리고 세 가지 무결성 규칙을 한 흐름으로 정리</text>

  <rect x="72" y="192" width="504" height="228" rx="24" fill="#f8fbff" stroke="#93c5fd" stroke-width="2"/>
  <rect x="602" y="192" width="526" height="228" rx="24" fill="#f0fdfa" stroke="#99f6e4" stroke-width="2"/>
  <rect x="72" y="446" width="1056" height="196" rx="24" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>

  <text class="section" x="98" y="226">1) 키 종류</text>
  <text class="section" x="628" y="226">2) 참조 관계</text>
  <text class="section" x="98" y="480">3) 무결성 체크</text>

  <rect x="96" y="248" width="182" height="144" rx="18" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <circle cx="138" cy="289" r="20" fill="#dbeafe"/>
  <path d="M132 289h12M138 283v12" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/>
  <text class="label" x="188" y="282" text-anchor="middle">후보키</text>
  <text class="body" x="114" y="317">• 유일성: 행을 구별</text>
  <text class="body" x="114" y="341">• 최소성: 불필요한 속성 없음</text>
  <text class="tiny" x="114" y="369">예: 학생ID, 주민번호</text>

  <rect x="306" y="248" width="246" height="144" rx="18" fill="url(#keyGrad)" opacity="0.95"/>
  <circle cx="348" cy="289" r="20" fill="#bfdbfe"/>
  <path d="M340 294c0-7 5-12 12-12 6 0 11 5 11 12 0 8-6 13-11 13h-4v9" fill="none" stroke="#1e3a8a" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="label white" x="429" y="282" text-anchor="middle">기본키</text>
  <text class="body white" x="328" y="317">여러 후보키 중 대표 식별자로 선택</text>
  <text class="body white" x="328" y="341">NULL 금지 · 중복 금지</text>
  <text class="tiny white" x="328" y="369">엔터티 무결성과 직접 연결</text>

  <line x1="278" y1="320" x2="306" y2="320" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
  <text class="tiny" x="292" y="308" text-anchor="middle">선택</text>

  <rect x="626" y="248" width="206" height="144" rx="18" fill="#ffffff" stroke="#14b8a6" stroke-width="2"/>
  <text class="label" x="650" y="282">학생</text>
  <rect x="646" y="296" width="166" height="28" rx="8" fill="#dbeafe"/>
  <text class="mono" x="660" y="315" fill="#1e3a8a">PK 학생ID = S101</text>
  <text class="body" x="646" y="349">이름 = 김민수</text>
  <text class="body" x="646" y="372">학년 = 3</text>

  <rect x="894" y="248" width="206" height="144" rx="18" fill="#ffffff" stroke="#14b8a6" stroke-width="2"/>
  <text class="label" x="918" y="282">성적</text>
  <rect x="914" y="296" width="166" height="28" rx="8" fill="#ccfbf1"/>
  <text class="mono" x="928" y="315" fill="#0f766e">FK 학생ID = S101</text>
  <text class="body" x="914" y="349">과목 = DB</text>
  <text class="body" x="914" y="372">점수 = 95</text>

  <line x1="832" y1="320" x2="894" y2="320" stroke="#0f766e" stroke-width="4" marker-end="url(#arrow)"/>
  <text class="tiny" x="862" y="304" text-anchor="middle">참조</text>
  <text class="body" x="636" y="405">외래키는 다른 테이블의 기본키 또는 후보키를 참조해 관계를 만든다.</text>

  <g transform="translate(96 500)">
    <rect width="310" height="116" rx="18" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
    <text class="label" x="24" y="30">엔터티 무결성</text>
    <text class="body" x="24" y="58">기본키는 비어 있으면 안 된다.</text>
    <text class="body" x="24" y="82">기본키는 중복되면 안 된다.</text>
    <rect x="194" y="20" width="92" height="70" rx="12" fill="#fef3c7"/>
    <text class="tiny center" x="240" y="42">학생 테이블</text>
    <text class="mono center" x="240" y="66" fill="#92400e">PK = NULL ✕</text>
  </g>

  <g transform="translate(445 500)">
    <rect width="310" height="116" rx="18" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
    <text class="label" x="24" y="30">참조 무결성</text>
    <text class="body" x="24" y="58">외래키 값은 참조 대상에 존재하거나</text>
    <text class="body" x="24" y="82">NULL 이어야 한다.</text>
    <rect x="198" y="20" width="90" height="70" rx="12" fill="#ffedd5"/>
    <text class="tiny center" x="243" y="42">성적 테이블</text>
    <text class="mono center" x="243" y="66" fill="#9a3412">FK = S999 ✕</text>
  </g>

  <g transform="translate(794 500)">
    <rect width="310" height="116" rx="18" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
    <text class="label" x="24" y="30">도메인 무결성</text>
    <text class="body" x="24" y="58">속성값은 자료형과 허용 범위를</text>
    <text class="body" x="24" y="82">따라야 한다.</text>
    <rect x="204" y="20" width="82" height="70" rx="12" fill="#ffedd5"/>
    <text class="tiny center" x="245" y="42">점수</text>
    <text class="mono center" x="245" y="66" fill="#9a3412">105점 ✕</text>
  </g>

  <path d="M552 320 C585 320 595 320 626 320" fill="none" stroke="#0f766e" stroke-width="5" marker-end="url(#arrow)"/>
  <text class="tiny" x="588" y="306" text-anchor="middle">PK가 관계의 기준</text>

  <rect x="72" y="658" width="1056" height="18" rx="9" fill="#e2e8f0"/>
  <rect x="72" y="658" width="352" height="18" rx="9" fill="#2563eb"/>
  <rect x="424" y="658" width="352" height="18" rx="0" fill="#14b8a6"/>
  <rect x="776" y="658" width="352" height="18" rx="9" fill="#f59e0b"/>
  <text class="tiny" x="248" y="671" text-anchor="middle" fill="#ffffff">후보키·기본키</text>
  <text class="tiny" x="600" y="671" text-anchor="middle" fill="#ffffff">외래키·참조</text>
  <text class="tiny" x="952" y="671" text-anchor="middle" fill="#ffffff">무결성 규칙</text>
</svg>
