<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc">
  <title id="title">07-01-02. 키와 무결성 SVG 인포그래픽</title>
  <desc id="desc">후보키, 기본키, 외래키의 역할과 세 가지 무결성 제약을 넓은 간격과 고대비 카드로 설명하는 인포그래픽</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#eef6ff"/>
    </linearGradient>
    <style>
      .title { font: 700 36px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .subtitle { font: 500 18px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
      .section { font: 700 24px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .cardTitle { font: 700 22px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .label { font: 700 18px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .body { font: 500 17px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
      .small { font: 600 14px 'Pretendard','Noto Sans KR',sans-serif; fill: #475569; }
      .tiny { font: 600 13px 'Pretendard','Noto Sans KR',sans-serif; fill: #64748b; }
      .mono { font: 700 17px 'SFMono-Regular','Consolas',monospace; fill: #0f172a; }
      .center { text-anchor: middle; }
      .white { fill: #ffffff; }
    </style>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#0f766e"/>
    </marker>
  </defs>

  <rect width="1200" height="860" fill="url(#bg)"/>
  <rect x="24" y="24" width="1152" height="812" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <text class="small" x="72" y="78">데이터베이스 · 07-01-02</text>
  <text class="title" x="72" y="124">키와 무결성</text>
  <text class="subtitle" x="72" y="160">후보키에서 기본키를 고르고, 외래키로 관계를 만들며, 무결성 규칙으로 잘못된 값을 막는다.</text>

  <rect x="60" y="196" width="1080" height="270" rx="26" fill="#f8fbff" stroke="#bfdbfe" stroke-width="2"/>
  <text class="section" x="86" y="236">1) 키의 분류와 선택</text>

  <g transform="translate(86 260)">
    <rect width="290" height="176" rx="22" fill="#ffffff" stroke="#60a5fa" stroke-width="2.5"/>
    <rect x="20" y="20" width="86" height="34" rx="17" fill="#dbeafe"/>
    <text class="small center" x="63" y="42">출발점</text>
    <text class="cardTitle" x="20" y="86">후보키</text>
    <text class="body" x="20" y="118">• 각 행을 유일하게 구별한다.</text>
    <text class="body" x="20" y="146">• 속성을 더 빼면 유일성이 깨진다.</text>
    <text class="small" x="20" y="172">예: 학생ID, 주민번호</text>
  </g>

  <g transform="translate(454 260)">
    <rect width="290" height="176" rx="22" fill="#eff6ff" stroke="#2563eb" stroke-width="3"/>
    <rect x="20" y="20" width="96" height="34" rx="17" fill="#2563eb"/>
    <text class="small center white" x="68" y="42">대표 선택</text>
    <text class="cardTitle" x="20" y="86">기본키</text>
    <text class="body" x="20" y="118">• 후보키 중 실제 식별자로 채택</text>
    <text class="body" x="20" y="146">• NULL 금지, 중복 금지</text>
    <text class="small" x="20" y="172">엔터티 무결성의 기준</text>
  </g>

  <g transform="translate(822 260)">
    <rect width="290" height="176" rx="22" fill="#f0fdfa" stroke="#14b8a6" stroke-width="2.5"/>
    <rect x="20" y="20" width="98" height="34" rx="17" fill="#ccfbf1"/>
    <text class="small center" x="69" y="42">관계 연결</text>
    <text class="cardTitle" x="20" y="86">외래키</text>
    <text class="body" x="20" y="118">• 다른 테이블의 기본키/후보키 참조</text>
    <text class="body" x="20" y="146">• 테이블 사이의 관계를 유지</text>
    <text class="small" x="20" y="172">참조 무결성과 직접 연결</text>
  </g>

  <line x1="376" y1="348" x2="454" y2="348" stroke="#2563eb" stroke-width="5" marker-end="url(#arrowBlue)"/>
  <text class="small center" x="415" y="334">후보키 중 하나를 선택</text>
  <line x1="744" y1="348" x2="822" y2="348" stroke="#0f766e" stroke-width="5" marker-end="url(#arrowTeal)"/>
  <text class="small center" x="783" y="334">기본키가 관계의 기준이 됨</text>

  <rect x="60" y="490" width="1080" height="192" rx="26" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text class="section" x="86" y="530">2) 학생-성적 테이블 예시</text>

  <g transform="translate(92 554)">
    <rect width="406" height="104" rx="20" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <text class="label" x="24" y="32">학생 테이블</text>
    <rect x="24" y="48" width="162" height="34" rx="10" fill="#dbeafe"/>
    <text class="mono" x="38" y="71">PK 학생ID = S101</text>
    <text class="body" x="208" y="58">이름 = 김민수</text>
    <text class="body" x="208" y="82">학년 = 3</text>
  </g>

  <g transform="translate(700 554)">
    <rect width="406" height="104" rx="20" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
    <text class="label" x="24" y="32">성적 테이블</text>
    <rect x="24" y="48" width="162" height="34" rx="10" fill="#ccfbf1"/>
    <text class="mono" x="38" y="71">FK 학생ID = S101</text>
    <text class="body" x="208" y="58">과목 = DB</text>
    <text class="body" x="208" y="82">점수 = 95</text>
  </g>

  <line x1="498" y1="606" x2="700" y2="606" stroke="#0f766e" stroke-width="5" marker-end="url(#arrowTeal)"/>
  <text class="small center" x="599" y="590">외래키 값이 기본키 값을 따라가면 관계가 유지된다.</text>

  <rect x="60" y="706" width="1080" height="96" rx="22" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <text class="section" x="86" y="744">3) 시험에서 같이 묶어 기억할 무결성 규칙</text>
  <text class="body" x="86" y="776">엔터티 무결성: 기본키는 비거나 중복될 수 없다.</text>
  <text class="body" x="448" y="776">참조 무결성: 외래키는 존재하는 키를 가리키거나 NULL 이어야 한다.</text>
  <text class="body" x="86" y="800">도메인 무결성: 속성값은 자료형과 허용 범위를 벗어나면 안 된다.</text>
</svg>
