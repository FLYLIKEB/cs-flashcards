<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">09-04 재귀 호출 트리</title>
  <desc id="desc">fib(5) 재귀 호출 트리에서 반복되는 fib(3), fib(2)와 기저 사례 fib(1), fib(0)를 구분해 보여주는 SVG</desc>
  <defs>
    <style>
      text { font-family: "Pretendard", "Noto Sans KR", sans-serif; fill: #0f172a; }
      .title { font-size: 36px; font-weight: 800; }
      .subtitle { font-size: 18px; font-weight: 500; fill: #334155; }
      .section { font-size: 22px; font-weight: 800; }
      .label { font-size: 17px; font-weight: 700; }
      .small { font-size: 14px; font-weight: 600; fill: #475569; }
      .body { font-size: 16px; font-weight: 500; fill: #334155; }
      .edge { stroke: #94a3b8; stroke-width: 3; fill: none; }
      .node { fill: #ffffff; stroke: #94a3b8; stroke-width: 2.5; }
      .repeat { fill: #faf5ff; stroke: #7c3aed; stroke-width: 3; }
      .base { fill: #ecfeff; stroke: #0891b2; stroke-width: 3; }
      .panel { fill: #ffffff; stroke: #dbe4ee; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1200" height="820" fill="#f8fafc"/>
  <rect x="28" y="28" width="1144" height="764" rx="28" fill="#ffffff" stroke="#dbe4ee" stroke-width="2"/>

  <text class="title" x="72" y="96">재귀 호출 트리: 어디서 중복이 생기는가</text>
  <text class="subtitle" x="72" y="134">fib(5)를 순수 재귀로 풀면 같은 하위 문제가 여러 갈래에서 다시 호출된다. 보라색은 반복 계산, 청록색은 더 내려가지 않는 기저 사례다.</text>

  <rect x="924" y="168" width="188" height="142" rx="20" fill="#ffffff" stroke="#dbe4ee" stroke-width="2"/>
  <text class="section" x="948" y="206">범례</text>
  <rect x="948" y="228" width="24" height="24" rx="12" fill="#faf5ff" stroke="#7c3aed" stroke-width="3"/>
  <text class="small" x="986" y="245">반복 계산 노드</text>
  <rect x="948" y="264" width="24" height="24" rx="12" fill="#ecfeff" stroke="#0891b2" stroke-width="3"/>
  <text class="small" x="986" y="281">기저 사례</text>

  <path class="edge" d="M600 218 L390 320 M600 218 L810 320"/>
  <path class="edge" d="M390 320 L260 432 M390 320 L520 432 M810 320 L680 432 M810 320 L940 432"/>
  <path class="edge" d="M260 432 L180 544 M260 432 L340 544 M520 432 L440 544 M520 432 L540 544 M680 432 L680 544 M680 432 L820 544"/>
  <path class="edge" d="M180 544 L140 646 M180 544 L220 646 M440 544 L400 646 M440 544 L480 646 M680 544 L640 646 M680 544 L720 646"/>

  <g>
    <circle class="node" cx="600" cy="218" r="42"/>
    <text class="label" x="600" y="224" text-anchor="middle">fib(5)</text>
  </g>
  <g>
    <circle class="node" cx="390" cy="320" r="38"/>
    <text class="label" x="390" y="326" text-anchor="middle">fib(4)</text>
    <circle class="repeat" cx="810" cy="320" r="38"/>
    <text class="label" x="810" y="326" text-anchor="middle">fib(3)</text>
  </g>
  <g>
    <circle class="repeat" cx="260" cy="432" r="36"/>
    <text class="label" x="260" y="438" text-anchor="middle">fib(3)</text>
    <circle class="repeat" cx="520" cy="432" r="36"/>
    <text class="label" x="520" y="438" text-anchor="middle">fib(2)</text>
    <circle class="repeat" cx="680" cy="432" r="36"/>
    <text class="label" x="680" y="438" text-anchor="middle">fib(2)</text>
    <circle class="base" cx="940" cy="432" r="36"/>
    <text class="label" x="940" y="438" text-anchor="middle">fib(1)</text>
  </g>
  <g>
    <circle class="repeat" cx="180" cy="544" r="32"/>
    <text class="label" x="180" y="550" text-anchor="middle">fib(2)</text>
    <circle class="base" cx="340" cy="544" r="32"/>
    <text class="label" x="340" y="550" text-anchor="middle">fib(1)</text>
    <circle class="base" cx="440" cy="544" r="32"/>
    <text class="label" x="440" y="550" text-anchor="middle">fib(1)</text>
    <circle class="base" cx="540" cy="544" r="32"/>
    <text class="label" x="540" y="550" text-anchor="middle">fib(0)</text>
    <circle class="base" cx="680" cy="544" r="32"/>
    <text class="label" x="680" y="550" text-anchor="middle">fib(1)</text>
    <circle class="base" cx="820" cy="544" r="32"/>
    <text class="label" x="820" y="550" text-anchor="middle">fib(0)</text>
  </g>
  <g>
    <circle class="base" cx="140" cy="646" r="28"/>
    <text class="small" x="140" y="651" text-anchor="middle">fib(1)</text>
    <circle class="base" cx="220" cy="646" r="28"/>
    <text class="small" x="220" y="651" text-anchor="middle">fib(0)</text>
    <circle class="base" cx="400" cy="646" r="28"/>
    <text class="small" x="400" y="651" text-anchor="middle">fib(1)</text>
    <circle class="base" cx="480" cy="646" r="28"/>
    <text class="small" x="480" y="651" text-anchor="middle">fib(0)</text>
    <circle class="base" cx="640" cy="646" r="28"/>
    <text class="small" x="640" y="651" text-anchor="middle">fib(1)</text>
    <circle class="base" cx="720" cy="646" r="28"/>
    <text class="small" x="720" y="651" text-anchor="middle">fib(0)</text>
  </g>

  <rect class="panel" x="72" y="712" width="1056" height="52" rx="18" fill="#f8fafc"/>
  <text class="body" x="98" y="744">핵심: fib(3)과 fib(2)가 여러 번 다시 나온다. 저장 없이 그대로 재귀하면 호출 수가 급격히 늘어나므로 시간 복잡도는 O(2ⁿ)에 가깝다.</text>
</svg>
