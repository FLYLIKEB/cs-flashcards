<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">11-03. 설계-결합도-응집도 인포그래픽</title>
  <desc id="desc">좋은 모듈 설계의 기준인 낮은 결합도와 높은 응집도를 비교하고, 결합도와 응집도의 단계별 유형을 한눈에 정리한 SVG 인포그래픽.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="couplingBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="cohesionBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6366f1"/>
    </marker>
    <style>
      .title { font: 700 34px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .subtitle { font: 500 16px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
      .section { font: 700 21px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .label { font: 700 15px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .body { font: 500 14px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
      .small { font: 600 12px 'Pretendard','Noto Sans KR',sans-serif; fill: #475569; }
      .badge { font: 700 13px 'Pretendard','Noto Sans KR',sans-serif; fill: #ffffff; }
      .rank { font: 700 13px 'Pretendard','Noto Sans KR',sans-serif; fill: #1e293b; }
    </style>
  </defs>

  <rect width="1200" height="720" fill="url(#bg)"/>
  <rect x="28" y="28" width="1144" height="664" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <text x="70" y="90" class="small">금융공기업 IT · 모듈 설계 핵심 암기</text>
  <text x="70" y="130" class="title">11-03. 설계-결합도-응집도</text>
  <text x="70" y="162" class="subtitle">좋은 설계의 기준은 “결합도는 낮게, 응집도는 높게”. 변경 영향은 줄이고, 모듈 책임은 선명하게 만든다.</text>

  <rect x="60" y="195" width="1080" height="120" rx="24" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="88" y="227" class="section">핵심 원리</text>

  <rect x="88" y="248" width="300" height="44" rx="14" fill="#dcfce7" stroke="#22c55e"/>
  <text x="238" y="276" text-anchor="middle" class="label">결합도 ↓ : 모듈 간 의존 최소화</text>
  <rect x="450" y="248" width="300" height="44" rx="14" fill="#dcfce7" stroke="#22c55e"/>
  <text x="600" y="276" text-anchor="middle" class="label">응집도 ↑ : 모듈 내부 책임 집중</text>
  <rect x="812" y="228" width="290" height="72" rx="18" fill="#eef2ff" stroke="#6366f1"/>
  <text x="957" y="255" text-anchor="middle" class="label">결론</text>
  <text x="957" y="278" text-anchor="middle" class="body">변경 용이성↑ · 안정성↑ · 테스트 용이성↑</text>

  <line x1="388" y1="270" x2="450" y2="270" stroke="#6366f1" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="750" y1="270" x2="812" y2="264" stroke="#6366f1" stroke-width="4" marker-end="url(#arrow)"/>

  <g transform="translate(60 345)">
    <rect width="340" height="315" rx="24" fill="#fefefe" stroke="#d1d5db"/>
    <text x="28" y="34" class="section">결합도 유형</text>
    <text x="28" y="57" class="small">낮은 순 → 높은 순</text>
    <rect x="28" y="72" width="284" height="14" rx="7" fill="url(#couplingBar)"/>
    <text x="28" y="108" class="rank">좋음</text>
    <text x="292" y="108" text-anchor="end" class="rank">나쁨</text>

    <g transform="translate(28 124)">
      <rect width="284" height="24" rx="12" fill="#dcfce7"/>
      <text x="14" y="16" class="label">1. 자료 결합</text>
      <text x="108" y="16" class="body">필요한 데이터만 매개변수로 전달</text>
    </g>
    <g transform="translate(28 156)">
      <rect width="284" height="24" rx="12" fill="#ecfccb"/>
      <text x="14" y="16" class="label">2. 스탬프 결합</text>
      <text x="123" y="16" class="body">구조체·레코드 단위 전달</text>
    </g>
    <g transform="translate(28 188)">
      <rect width="284" height="24" rx="12" fill="#fef9c3"/>
      <text x="14" y="16" class="label">3. 제어 결합</text>
      <text x="108" y="16" class="body">플래그 등 제어정보로 흐름 지시</text>
    </g>
    <g transform="translate(28 220)">
      <rect width="284" height="24" rx="12" fill="#ffedd5"/>
      <text x="14" y="16" class="label">4. 외부 결합</text>
      <text x="108" y="16" class="body">외부 규약·인터페이스에 의존</text>
    </g>
    <g transform="translate(28 252)">
      <rect width="284" height="24" rx="12" fill="#fee2e2"/>
      <text x="14" y="16" class="label">5. 공통 결합</text>
      <text x="108" y="16" class="body">전역 데이터·공유 자원 의존</text>
    </g>
    <g transform="translate(28 284)">
      <rect width="284" height="24" rx="12" fill="#fecaca"/>
      <text x="14" y="16" class="label">6. 내용 결합</text>
      <text x="108" y="16" class="body">다른 모듈 내부 구현을 직접 침범</text>
    </g>
  </g>

  <g transform="translate(430 345)">
    <rect width="340" height="315" rx="24" fill="#fefefe" stroke="#d1d5db"/>
    <text x="28" y="34" class="section">응집도 유형</text>
    <text x="28" y="57" class="small">높은 순 → 낮은 순</text>
    <rect x="28" y="72" width="284" height="14" rx="7" fill="url(#cohesionBar)"/>
    <text x="28" y="108" class="rank">나쁨</text>
    <text x="292" y="108" text-anchor="end" class="rank">좋음</text>

    <g transform="translate(28 124)">
      <rect width="284" height="24" rx="12" fill="#dcfce7"/>
      <text x="14" y="16" class="label">1. 기능적 응집</text>
      <text x="123" y="16" class="body">하나의 핵심 기능만 수행</text>
    </g>
    <g transform="translate(28 156)">
      <rect width="284" height="24" rx="12" fill="#ecfccb"/>
      <text x="14" y="16" class="label">2. 순차적 응집</text>
      <text x="123" y="16" class="body">앞 단계 출력이 다음 입력</text>
    </g>
    <g transform="translate(28 188)">
      <rect width="284" height="24" rx="12" fill="#fef9c3"/>
      <text x="14" y="16" class="label">3. 통신적 응집</text>
      <text x="123" y="16" class="body">같은 데이터에 함께 작용</text>
    </g>
    <g transform="translate(28 220)">
      <rect width="284" height="24" rx="12" fill="#ffedd5"/>
      <text x="14" y="16" class="label">4. 절차적 응집</text>
      <text x="123" y="16" class="body">절차 순서만 맞춰 함께 배치</text>
    </g>
    <g transform="translate(28 252)">
      <rect width="284" height="24" rx="12" fill="#fee2e2"/>
      <text x="14" y="16" class="label">5. 시간적 응집</text>
      <text x="123" y="16" class="body">초기화·종료처럼 시점만 동일</text>
    </g>
    <g transform="translate(28 284)">
      <rect width="284" height="24" rx="12" fill="#fecaca"/>
      <text x="14" y="16" class="label">6. 논리/우연적 응집</text>
      <text x="144" y="16" class="body">관련 약하거나 무관한 기능 집합</text>
    </g>
  </g>

  <g transform="translate(800 345)">
    <rect width="340" height="315" rx="24" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="28" y="34" class="section">좋은 설계 예시</text>
    <text x="28" y="57" class="small">금융 시스템: 거래 처리와 보고서 생성 분리</text>

    <rect x="28" y="88" width="124" height="70" rx="16" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="90" y="116" text-anchor="middle" class="label">거래 처리</text>
    <text x="90" y="136" text-anchor="middle" class="body">검증·승인·커밋</text>

    <rect x="188" y="88" width="124" height="70" rx="16" fill="#f5d0fe" stroke="#a855f7"/>
    <text x="250" y="116" text-anchor="middle" class="label">보고서 생성</text>
    <text x="250" y="136" text-anchor="middle" class="body">조회·집계·출력</text>

    <rect x="108" y="194" width="124" height="70" rx="16" fill="#dcfce7" stroke="#22c55e"/>
    <text x="170" y="222" text-anchor="middle" class="label">계좌 모듈</text>
    <text x="170" y="242" text-anchor="middle" class="body">잔액 책임 집중</text>

    <line x1="152" y1="123" x2="188" y2="123" stroke="#64748b" stroke-width="3" stroke-dasharray="8 6"/>
    <text x="170" y="112" text-anchor="middle" class="small">데이터만 전달</text>

    <line x1="90" y1="158" x2="140" y2="194" stroke="#6366f1" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="250" y1="158" x2="200" y2="194" stroke="#6366f1" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="28" y="276" width="284" height="24" rx="12" fill="#e0e7ff"/>
    <text x="170" y="292" text-anchor="middle" class="label">낮은 결합도: 인터페이스로 연결</text>
    <rect x="28" y="244" width="284" height="24" rx="12" fill="#dcfce7"/>
    <text x="170" y="260" text-anchor="middle" class="label">높은 응집도: 모듈마다 책임 1개</text>
  </g>
</svg>
