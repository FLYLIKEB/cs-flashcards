<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="920" viewBox="0 0 1280 920" role="img" aria-labelledby="title desc">
  <title id="title">SELECT WHERE GROUP BY 논리적 실행 순서</title>
  <desc id="desc">FROM, WHERE, GROUP BY, HAVING, SELECT의 논리적 실행 순서와 WHERE와 HAVING의 차이를 설명하는 인포그래픽</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#eefbf3"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#2563eb"/>
    </marker>
    <style>
      .title { font: 700 36px 'Pretendard','Noto Sans KR',sans-serif; fill: #ffffff; }
      .subtitle { font: 500 18px 'Pretendard','Noto Sans KR',sans-serif; fill: #dbeafe; }
      .section { font: 700 24px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .stepNo { font: 700 18px 'Pretendard','Noto Sans KR',sans-serif; fill: #1d4ed8; }
      .stepTitle { font: 700 24px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .body { font: 500 17px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
      .label { font: 700 16px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .small { font: 500 15px 'Pretendard','Noto Sans KR',sans-serif; fill: #475569; }
      .mono { font: 600 17px 'SFMono-Regular','Consolas','Menlo',monospace; fill: #0f172a; }
      .monoSmall { font: 600 15px 'SFMono-Regular','Consolas','Menlo',monospace; fill: #0f172a; }
      .chip { font: 700 15px 'Pretendard','Noto Sans KR',sans-serif; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.6; }
      .blue { fill: #eff6ff; stroke: #93c5fd; stroke-width: 1.6; }
      .green { fill: #f0fdf4; stroke: #86efac; stroke-width: 1.6; }
      .amber { fill: #fffbeb; stroke: #fcd34d; stroke-width: 1.6; }
      .violet { fill: #f5f3ff; stroke: #c4b5fd; stroke-width: 1.6; }
      .slate { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.6; }
      .rule { stroke: #cbd5e1; stroke-width: 1.2; }
      .arrow { stroke: #2563eb; stroke-width: 4; marker-end: url(#arrow); }
      .danger { fill: #fee2e2; stroke: #fca5a5; stroke-width: 1.6; }
      .ok { fill: #dcfce7; stroke: #86efac; stroke-width: 1.6; }
    </style>
  </defs>

  <rect width="1280" height="920" fill="url(#bg)"/>
  <rect x="28" y="28" width="1224" height="864" rx="30" fill="#ffffff" stroke="#dbeafe" stroke-width="2"/>

  <rect x="56" y="52" width="1168" height="118" rx="24" fill="url(#header)"/>
  <text class="title" x="88" y="98">SELECT · WHERE · GROUP BY · HAVING</text>
  <text class="subtitle" x="88" y="128">핵심은 행을 먼저 걸러낸 뒤 묶고, 그룹이 만들어진 다음에 다시 조건을 건다는 점이다.</text>
  <text class="mono" x="88" y="156">SELECT customer_id, SUM(amount) AS total_paid FROM orders WHERE status = 'paid' GROUP BY customer_id;</text>

  <text class="section" x="72" y="214">1. 논리적 실행 순서</text>

  <rect class="slate" x="72" y="236" width="1136" height="184" rx="24"/>

  <rect class="card" x="96" y="270" width="188" height="112" rx="20"/>
  <circle cx="126" cy="304" r="18" fill="#dbeafe"/>
  <text class="stepNo" x="120" y="310">1</text>
  <text class="stepTitle" x="154" y="310">FROM</text>
  <text class="body" x="114" y="338">원본 테이블과 JOIN 대상을</text>
  <text class="body" x="114" y="362">먼저 확정한다.</text>

  <line class="arrow" x1="284" y1="326" x2="332" y2="326"/>

  <rect class="blue" x="332" y="270" width="188" height="112" rx="20"/>
  <circle cx="362" cy="304" r="18" fill="#bfdbfe"/>
  <text class="stepNo" x="356" y="310">2</text>
  <text class="stepTitle" x="390" y="310">WHERE</text>
  <text class="body" x="350" y="338">개별 행 조건으로</text>
  <text class="body" x="350" y="362">먼저 행 수를 줄인다.</text>

  <line class="arrow" x1="520" y1="326" x2="568" y2="326"/>

  <rect class="green" x="568" y="270" width="188" height="112" rx="20"/>
  <circle cx="598" cy="304" r="18" fill="#bbf7d0"/>
  <text class="stepNo" x="592" y="310">3</text>
  <text class="stepTitle" x="626" y="310">GROUP BY</text>
  <text class="body" x="586" y="338">남은 행을 같은 값끼리</text>
  <text class="body" x="586" y="362">그룹으로 묶는다.</text>

  <line class="arrow" x1="756" y1="326" x2="804" y2="326"/>

  <rect class="amber" x="804" y="270" width="188" height="112" rx="20"/>
  <circle cx="834" cy="304" r="18" fill="#fde68a"/>
  <text class="stepNo" x="828" y="310">4</text>
  <text class="stepTitle" x="862" y="310">HAVING</text>
  <text class="body" x="822" y="338">집계가 끝난 그룹만 보고</text>
  <text class="body" x="822" y="362">조건을 다시 건다.</text>

  <line class="arrow" x1="992" y1="326" x2="1040" y2="326"/>

  <rect class="violet" x="1040" y="270" width="144" height="112" rx="20"/>
  <circle cx="1070" cy="304" r="18" fill="#ddd6fe"/>
  <text class="stepNo" x="1064" y="310">5</text>
  <text class="stepTitle" x="1098" y="310">SELECT</text>
  <text class="body" x="1058" y="338">최종 컬럼과</text>
  <text class="body" x="1058" y="362">집계값을 출력한다.</text>

  <text class="small" x="96" y="404">시험에서는 WHERE와 HAVING의 위치를 자주 바꿔 묻는다. WHERE는 행, HAVING은 그룹을 거른다.</text>

  <text class="section" x="72" y="474">2. WHERE와 HAVING 차이</text>

  <rect class="blue" x="72" y="500" width="540" height="260" rx="24"/>
  <text class="stepTitle" x="100" y="544">WHERE: 그룹화 전에 행 필터</text>
  <rect class="card" x="100" y="570" width="484" height="78" rx="16"/>
  <text class="monoSmall" x="120" y="602">WHERE status = 'paid'</text>
  <text class="body" x="120" y="628">pending, cancelled 같은 행이 먼저 제거된다.</text>
  <rect class="ok" x="100" y="668" width="216" height="64" rx="16"/>
  <text class="label" x="118" y="694">남는 행</text>
  <text class="monoSmall" x="118" y="718">(100, 10), (100, 15), (101, 5)</text>
  <rect class="danger" x="336" y="668" width="248" height="64" rx="16"/>
  <text class="label" x="354" y="694">제거되는 행</text>
  <text class="monoSmall" x="354" y="718">(101, 20, pending), (102, NULL, cancelled)</text>

  <rect class="amber" x="640" y="500" width="568" height="260" rx="24"/>
  <text class="stepTitle" x="668" y="544">HAVING: 그룹화 후 그룹 필터</text>
  <rect class="card" x="668" y="570" width="512" height="78" rx="16"/>
  <text class="monoSmall" x="688" y="602">HAVING COUNT(*) &gt;= 2</text>
  <text class="body" x="688" y="628">customer_id별로 묶은 결과를 보고 남길 그룹만 선택한다.</text>
  <rect class="ok" x="668" y="668" width="236" height="64" rx="16"/>
  <text class="label" x="686" y="694">남는 그룹</text>
  <text class="monoSmall" x="686" y="718">customer 100 → 2건</text>
  <rect class="danger" x="924" y="668" width="256" height="64" rx="16"/>
  <text class="label" x="942" y="694">제거되는 그룹</text>
  <text class="monoSmall" x="942" y="718">customer 101 → 1건</text>

  <text class="section" x="72" y="808">3. 기억할 한 줄</text>
  <rect class="card" x="72" y="828" width="1136" height="40" rx="14"/>
  <text class="body" x="96" y="854">FROM으로 대상을 정하고 → WHERE로 행을 줄이고 → GROUP BY로 묶고 → HAVING으로 그룹을 거른 뒤 → SELECT로 보여준다.</text>
</svg>
