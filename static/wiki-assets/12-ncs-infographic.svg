<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="940" viewBox="0 0 1280 940" role="img" aria-labelledby="title desc">
  <title id="title">12. NCS overview infographic</title>
  <desc id="desc">NCS의 학습 목표, 4대 핵심 역량, 실무 연결 포인트를 큰 카드형 레이아웃으로 정리한 인포그래픽</desc>
  <defs>
    <style>
      text { font-family: 'Pretendard','Noto Sans KR',sans-serif; }
      .eyebrow { font-size: 20px; font-weight: 700; letter-spacing: 0.08em; fill: #1d4ed8; }
      .title { font-size: 44px; font-weight: 800; fill: #0f172a; }
      .subtitle { font-size: 21px; font-weight: 500; fill: #334155; }
      .heroTitle { font-size: 28px; font-weight: 800; fill: #eff6ff; }
      .heroBody { font-size: 18px; font-weight: 500; fill: #dbeafe; }
      .sectionTitle { font-size: 28px; font-weight: 800; fill: #0f172a; }
      .cardTitle { font-size: 24px; font-weight: 800; fill: #0f172a; }
      .cardTag { font-size: 16px; font-weight: 700; fill: #1e3a8a; }
      .body { font-size: 17px; font-weight: 500; fill: #334155; }
      .bullet { font-size: 16px; font-weight: 500; fill: #1f2937; }
      .small { font-size: 15px; font-weight: 600; fill: #475569; }
      .heroChip { font-size: 16px; font-weight: 700; fill: #ffffff; }
    </style>
  </defs>

  <rect width="1280" height="940" fill="#f8fbff"/>
  <rect x="30" y="30" width="1220" height="880" rx="32" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <text class="eyebrow" x="88" y="88">NCS LEARNING OVERVIEW</text>
  <text class="title" x="88" y="140">12. NCS</text>
  <text class="subtitle" x="88" y="178">의사소통·수리·문제해결·오답 관리를 한 흐름으로 묶어 시험 성과와 실무 역량을 함께 올리는 학습 지도</text>

  <rect x="88" y="218" width="1104" height="168" rx="28" fill="#0f172a"/>
  <text class="heroTitle" x="128" y="272">핵심 메시지</text>
  <text class="heroBody" x="128" y="316">정답만 찾지 말고 정보 해석, 논리적 분해, 실수 관리 루틴을 같이 훈련한다.</text>
  <text class="heroBody" x="128" y="348">단기: 문제유형을 빠르게 분류하고 풀이 순서를 고정한다.</text>
  <text class="heroBody" x="128" y="380">중기·장기: 오답 원인을 누적 기록해 재학습과 실제 직무 성과로 연결한다.</text>

  <rect x="910" y="248" width="112" height="40" rx="20" fill="#2563eb"/>
  <text class="heroChip" x="966" y="274" text-anchor="middle">의사소통</text>
  <rect x="1040" y="248" width="92" height="40" rx="20" fill="#16a34a"/>
  <text class="heroChip" x="1086" y="274" text-anchor="middle">수리</text>
  <rect x="910" y="302" width="112" height="40" rx="20" fill="#ea580c"/>
  <text class="heroChip" x="966" y="328" text-anchor="middle">문제해결</text>
  <rect x="1040" y="302" width="118" height="40" rx="20" fill="#db2777"/>
  <text class="heroChip" x="1099" y="328" text-anchor="middle">오답관리</text>

  <text class="sectionTitle" x="88" y="452">4대 핵심 역량</text>

  <g transform="translate(88 486)">
    <rect width="520" height="168" rx="24" fill="#eef5ff" stroke="#93c5fd" stroke-width="2"/>
    <rect x="24" y="24" width="90" height="90" rx="22" fill="#2563eb"/>
    <path d="M46 56h46M46 76h46M46 96h30" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
    <text class="cardTitle" x="142" y="56">의사소통</text>
    <text class="cardTag" x="142" y="84">지문 핵심을 짧고 정확하게 압축</text>
    <text class="bullet" x="32" y="136">• 시험: 주제 한 문장 찾기, 강조·부정 어휘 구분</text>
    <text class="bullet" x="32" y="160">• 실무: 보고서 요약, 이메일 핵심 전달, 회의 요지 정리</text>
  </g>

  <g transform="translate(672 486)">
    <rect width="520" height="168" rx="24" fill="#f1fbf3" stroke="#86efac" stroke-width="2"/>
    <rect x="24" y="24" width="90" height="90" rx="22" fill="#16a34a"/>
    <path d="M46 96l18-28 18 14 22-34" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="cardTitle" x="142" y="56">수리</text>
    <text class="cardTag" x="142" y="84">단위·비율·근사값을 빠르게 검증</text>
    <text class="bullet" x="32" y="136">• 시험: 계산 전에 조건과 단위를 먼저 확인</text>
    <text class="bullet" x="32" y="160">• 실무: 예산·비용 검토, 수치 보고서 검증 습관</text>
  </g>

  <g transform="translate(88 684)">
    <rect width="520" height="168" rx="24" fill="#fff5ec" stroke="#fdba74" stroke-width="2"/>
    <rect x="24" y="24" width="90" height="90" rx="22" fill="#ea580c"/>
    <path d="M44 94l20-20 18 16 28-34" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="cardTitle" x="142" y="56">문제해결</text>
    <text class="cardTag" x="142" y="84">분해 → 우선순위 → 가설 검증 순서 유지</text>
    <text class="bullet" x="32" y="136">• 시험: 주어지지 않은 정보는 유효 가정으로 처리</text>
    <text class="bullet" x="32" y="160">• 실무: RCA, 프로세스 개선안 작성과 직접 연결</text>
  </g>

  <g transform="translate(672 684)">
    <rect width="520" height="168" rx="24" fill="#fff1f7" stroke="#f9a8d4" stroke-width="2"/>
    <rect x="24" y="24" width="90" height="90" rx="22" fill="#db2777"/>
    <path d="M50 48h38v48H50zM98 58h22M98 78h22" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="cardTitle" x="142" y="56">실전 오답 관리</text>
    <text class="cardTag" x="142" y="84">실수 원인을 유형화해 재발 방지 루틴으로 전환</text>
    <text class="bullet" x="32" y="136">• 시험: 표현 착오·계산 실수·개념 오류를 분리 기록</text>
    <text class="bullet" x="32" y="160">• 실무: 체크리스트와 재발방지 문서화 습관으로 이어짐</text>
  </g>

  <text class="small" x="88" y="888">학습 흐름: 핵심 역량 이해 → 시험 전략 고정 → 오답노트 누적 → 실무형 역량으로 연결</text>
</svg>
