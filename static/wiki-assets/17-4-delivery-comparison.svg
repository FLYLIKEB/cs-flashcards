<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="880" viewBox="0 0 1280 880" role="img" aria-labelledby="title desc">
  <title id="title">17-4. 전달 보장과 Kafka/RabbitMQ 비교</title>
  <desc id="desc">전달 보장 세 가지와 Kafka, RabbitMQ의 선택 기준을 분리해 보여주는 비교형 SVG</desc>
  <defs>
    <style>
      text { font-family: 'Pretendard', 'Noto Sans KR', sans-serif; fill: #0f172a; }
      .kicker { font-size: 18px; font-weight: 800; letter-spacing: 0.12em; fill: #7c3aed; }
      .title { font-size: 36px; font-weight: 800; }
      .subtitle { font-size: 19px; font-weight: 500; fill: #334155; }
      .section { font-size: 22px; font-weight: 800; }
      .label { font-size: 20px; font-weight: 800; }
      .body { font-size: 17px; font-weight: 500; fill: #334155; }
      .small { font-size: 15px; font-weight: 600; fill: #475569; }
    </style>
  </defs>

  <rect width="1280" height="880" fill="#f8fafc"/>
  <rect x="26" y="26" width="1228" height="828" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <text class="kicker" x="72" y="92">DELIVERY · RETRY · CHOICE</text>
  <text class="title" x="72" y="138">전달 보장과 브로커 선택 기준</text>
  <text class="subtitle" x="72" y="176">손실, 중복, 처리 비용을 먼저 구분하고 나서 Kafka와 RabbitMQ의 목적 차이를 비교한다.</text>

  <rect x="64" y="226" width="1152" height="278" rx="26" fill="#faf5ff" stroke="#d8b4fe" stroke-width="2"/>
  <text class="section" x="96" y="268">1) Delivery semantics</text>

  <rect x="96" y="306" width="340" height="158" rx="22" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text class="label" x="266" y="346" text-anchor="middle">at-most-once</text>
  <text class="body" x="124" y="386">• 재전송보다 속도를 우선</text>
  <text class="body" x="124" y="416">• 실패 시 메시지 손실 가능</text>
  <text class="small" x="124" y="448">예: 일부 로그, 캐시성 알림</text>

  <rect x="470" y="306" width="340" height="158" rx="22" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text class="label" x="640" y="346" text-anchor="middle">at-least-once</text>
  <text class="body" x="498" y="386">• 실패하면 재시도</text>
  <text class="body" x="498" y="416">• 중복 수신 가능 → idempotency 필요</text>
  <text class="small" x="498" y="448">예: 주문 이벤트, 금융 알림</text>

  <rect x="844" y="306" width="340" height="158" rx="22" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text class="label" x="1014" y="346" text-anchor="middle">exactly-once</text>
  <text class="body" x="872" y="386">• 손실과 중복을 모두 강하게 제어</text>
  <text class="body" x="872" y="416">• 트랜잭션, 상태 관리, 비용 증가</text>
  <text class="small" x="872" y="448">주의: 보장 범위를 시스템 경계별로 확인</text>

  <rect x="64" y="534" width="1152" height="278" rx="26" fill="#f8fbff" stroke="#bfdbfe" stroke-width="2"/>
  <text class="section" x="96" y="576">2) Kafka vs RabbitMQ</text>

  <rect x="96" y="614" width="524" height="154" rx="24" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text class="label" x="358" y="654" text-anchor="middle">Kafka</text>
  <text class="body" x="126" y="692">• 로그 기반 스트리밍, topic/partition/offset 중심</text>
  <text class="body" x="126" y="722">• 강점: 높은 처리량, 재처리, partition 내 순서 보장</text>
  <text class="small" x="126" y="752">적합: 거래 이벤트 스트림, 로그 파이프라인, 분석 연계</text>

  <rect x="660" y="614" width="524" height="154" rx="24" fill="#ecfeff" stroke="#14b8a6" stroke-width="2"/>
  <text class="label" x="922" y="654" text-anchor="middle">RabbitMQ</text>
  <text class="body" x="690" y="692">• exchange, queue, routing key 중심의 브로커 라우팅</text>
  <text class="body" x="690" y="722">• 강점: 복잡한 라우팅, 작업 분배, 세밀한 ACK 제어</text>
  <text class="small" x="690" y="752">적합: 업무 비동기 처리, 알림, 작업 큐</text>

  <text class="small" x="72" y="840">실무 팁: 금융권에서는 exactly-once 착각보다, at-least-once + idempotency + DLQ 운영이 더 현실적인 경우가 많다.</text>
</svg>
