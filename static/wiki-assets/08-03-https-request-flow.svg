<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc">
  <title id="title">08-03 TLS handshake and HTTP request flow</title>
  <desc id="desc">TLS 핸드셰이크에서 인증서 검증과 세션 키 합의를 마친 뒤, 암호화된 HTTP 요청과 응답을 주고받는 HTTPS 흐름을 설명하는 도표</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .client { fill: #ecfeff; stroke: #22c55e; stroke-width: 2; }
      .server { fill: #eff6ff; stroke: #3b82f6; stroke-width: 2; }
      .step { fill: #ffffff; stroke: #94a3b8; stroke-width: 2; }
      .tls { fill: #ecfdf5; stroke: #34d399; stroke-width: 2; }
      .http { fill: #fff7ed; stroke: #fb923c; stroke-width: 2; }
      .title { font: 700 32px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .subtitle { font: 500 17px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
      .section { font: 700 22px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .label { font: 700 18px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .body { font: 500 16px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
      .tiny { font: 600 14px 'Pretendard','Noto Sans KR',sans-serif; fill: #475569; }
      .mono { font: 600 15px 'SFMono-Regular','Consolas','Liberation Mono',monospace; fill: #1e293b; }
      .num { font: 700 18px 'Pretendard','Noto Sans KR',sans-serif; fill: #ffffff; }
    </style>
    <marker id="arrowDark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#334155"/>
    </marker>
  </defs>

  <rect class="bg" width="1200" height="860"/>
  <rect x="28" y="28" width="1144" height="804" rx="28" class="panel"/>

  <text class="title" x="72" y="92">HTTPS 요청 흐름</text>
  <text class="subtitle" x="72" y="124">TLS 핸드셰이크로 안전한 채널을 만든 뒤 HTTP 요청과 응답이 그 안에서 오간다.</text>

  <rect x="84" y="168" width="204" height="612" rx="24" class="client"/>
  <text class="section" x="186" y="214" text-anchor="middle">클라이언트</text>
  <text class="body" x="186" y="246" text-anchor="middle">브라우저</text>
  <text class="mono" x="186" y="278" text-anchor="middle">https://example.com</text>

  <rect x="912" y="168" width="204" height="612" rx="24" class="server"/>
  <text class="section" x="1014" y="214" text-anchor="middle">서버</text>
  <text class="body" x="1014" y="246" text-anchor="middle">웹 서버 + 인증서</text>
  <text class="mono" x="1014" y="278" text-anchor="middle">443/TCP</text>

  <line x1="288" y1="320" x2="912" y2="320" stroke="#334155" stroke-width="4" marker-end="url(#arrowDark)"/>
  <rect x="384" y="282" width="432" height="78" rx="18" class="tls"/>
  <circle cx="412" cy="321" r="22" fill="#059669"/>
  <text class="num" x="412" y="327" text-anchor="middle">1</text>
  <text class="label" x="446" y="312">ClientHello</text>
  <text class="body" x="446" y="338">지원 버전·암호군 목록과 SNI, ALPN 정보를 보낸다.</text>

  <line x1="912" y1="430" x2="288" y2="430" stroke="#334155" stroke-width="4" marker-end="url(#arrowDark)"/>
  <rect x="384" y="392" width="432" height="78" rx="18" class="tls"/>
  <circle cx="412" cy="431" r="22" fill="#059669"/>
  <text class="num" x="412" y="437" text-anchor="middle">2</text>
  <text class="label" x="446" y="422">ServerHello + certificate</text>
  <text class="body" x="446" y="448">서버는 선택한 알고리즘과 인증서 체인을 제시한다.</text>

  <rect x="384" y="504" width="432" height="110" rx="18" class="step"/>
  <circle cx="412" cy="559" r="22" fill="#0f172a"/>
  <text class="num" x="412" y="565" text-anchor="middle">3</text>
  <text class="label" x="446" y="548">클라이언트 검증</text>
  <text class="body" x="446" y="574">호스트명, 유효기간, CA 서명, 폐지 여부를 확인하고</text>
  <text class="body" x="446" y="598">ECDHE로 공유 비밀을 만든 뒤 Finished를 주고받는다.</text>

  <line x1="288" y1="686" x2="912" y2="686" stroke="#334155" stroke-width="4" marker-end="url(#arrowDark)"/>
  <rect x="384" y="648" width="432" height="78" rx="18" class="http"/>
  <circle cx="412" cy="687" r="22" fill="#ea580c"/>
  <text class="num" x="412" y="693" text-anchor="middle">4</text>
  <text class="label" x="446" y="678">암호화된 HTTP 요청 / 응답</text>
  <text class="body" x="446" y="704">이제 GET/POST, 쿠키, 응답 본문이 TLS 안에서 보호된다.</text>

  <rect x="324" y="168" width="552" height="104" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text class="tiny" x="348" y="198">HTTP 예시</text>
  <text class="mono" x="348" y="224">GET /index.html</text>
  <text class="mono" x="348" y="246">Host: example.com   If-None-Match: "v3"</text>
  <text class="mono" x="348" y="268">200 OK   ETag: "v3"   Cache-Control: max-age=60</text>

  <text class="tiny" x="72" y="804">핵심 기억: HTTPS는 HTTP + TLS이며, 인증서 검증과 세션 키 합의가 끝난 다음에야 실제 웹 요청이 안전하게 전달된다.</text>
</svg>
