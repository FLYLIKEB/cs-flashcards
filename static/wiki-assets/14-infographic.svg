<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">14. 컴퓨터구조 심화 개요 SVG</title>
  <desc id="desc">컴퓨터구조 심화 페이지의 학습 축을 CPU 설계, 메모리 계층, ISA, 입출력 시스템으로 나누고 시험 답안 연결 포인트를 함께 보여주는 개요 SVG</desc>
  <defs>
    <style>
      text { font-family: "Pretendard", "Noto Sans KR", sans-serif; fill: #0f172a; }
      .eyebrow { font-size: 18px; font-weight: 700; letter-spacing: 0.08em; fill: #475569; }
      .title { font-size: 38px; font-weight: 800; }
      .subtitle { font-size: 19px; font-weight: 500; fill: #334155; }
      .section { font-size: 17px; font-weight: 800; letter-spacing: 0.04em; fill: #1e293b; }
      .cardTitle { font-size: 27px; font-weight: 800; }
      .cardBody { font-size: 17px; font-weight: 500; fill: #334155; }
      .chip { font-size: 15px; font-weight: 700; fill: #1e293b; }
      .small { font-size: 16px; font-weight: 600; fill: #475569; }
      .white { fill: #ffffff; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1200" height="900" fill="#f8fafc"/>
  <rect x="28" y="28" width="1144" height="844" rx="32" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <text x="72" y="88" class="eyebrow">FINANCE IT · COMPUTER ARCHITECTURE OVERVIEW</text>
  <text x="72" y="136" class="title">14. 컴퓨터구조 심화</text>
  <text x="72" y="172" class="subtitle">CPU 실행 구조에서 메모리 계층, ISA, I/O로 이어지는 병목을 단계별로 정리한 학습 개요</text>

  <rect x="72" y="220" width="274" height="598" rx="28" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="104" y="264" class="section">시험에서 먼저 보는 질문</text>
  <rect x="104" y="292" width="210" height="74" rx="18" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/>
  <text x="126" y="324" class="cardBody">어느 지점이 느린가?</text>
  <text x="126" y="348" class="small">CPU · 메모리 · I/O 구분</text>
  <rect x="104" y="388" width="210" height="74" rx="18" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  <text x="126" y="420" class="cardBody">왜 느린가?</text>
  <text x="126" y="444" class="small">해저드 · 캐시 미스 · 인터럽트</text>
  <rect x="104" y="484" width="210" height="74" rx="18" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="126" y="516" class="cardBody">무엇을 줄였는가?</text>
  <text x="126" y="540" class="small">CPI · miss penalty · CPU 점유율</text>
  <rect x="104" y="580" width="210" height="196" rx="18" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text x="126" y="616" class="cardTitle" style="font-size:23px;">답안 프레임</text>
  <text x="126" y="648" class="cardBody">1. 병목 위치를 먼저 말한다</text>
  <text x="126" y="676" class="cardBody">2. 원인 지표를 식과 연결한다</text>
  <text x="126" y="704" class="cardBody">3. 개선 수단을 한 줄로 정리한다</text>
  <text x="126" y="744" class="small">예: 캐시 미스로 AMAT 증가 →</text>
  <text x="126" y="768" class="small">캐시 적중률 개선 또는 penalty 완화</text>

  <rect x="378" y="220" width="458" height="598" rx="28" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="410" y="264" class="section">핵심 개념을 쌓는 4단계</text>

  <rect x="420" y="292" width="374" height="112" rx="24" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <circle cx="462" cy="348" r="22" fill="#2563eb"/>
  <text x="462" y="356" text-anchor="middle" class="white" style="font-size:18px;font-weight:800;">1</text>
  <text x="500" y="336" class="cardTitle">CPU 설계</text>
  <text x="500" y="366" class="cardBody">파이프라인 5단계, 해저드, 분기 예측으로</text>
  <text x="500" y="390" class="cardBody">Instruction Count와 CPI를 해석한다.</text>

  <line x1="607" y1="404" x2="607" y2="434" stroke="#94a3b8" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="420" y="438" width="374" height="112" rx="24" fill="#cffafe" stroke="#0891b2" stroke-width="2"/>
  <circle cx="462" cy="494" r="22" fill="#0891b2"/>
  <text x="462" y="502" text-anchor="middle" class="white" style="font-size:18px;font-weight:800;">2</text>
  <text x="500" y="482" class="cardTitle">메모리 계층</text>
  <text x="500" y="512" class="cardBody">L1/L2 캐시, TLB, DRAM 구조를 통해</text>
  <text x="500" y="536" class="cardBody">AMAT와 체감 지연을 설명한다.</text>

  <line x1="607" y1="550" x2="607" y2="580" stroke="#94a3b8" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="420" y="584" width="374" height="112" rx="24" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <circle cx="462" cy="640" r="22" fill="#7c3aed"/>
  <text x="462" y="648" text-anchor="middle" class="white" style="font-size:18px;font-weight:800;">3</text>
  <text x="500" y="628" class="cardTitle">명령어 세트 ISA</text>
  <text x="500" y="658" class="cardBody">RISC/CISC, 주소 지정 방식, 코드 밀도와</text>
  <text x="500" y="682" class="cardBody">파이프라인 친화성을 함께 비교한다.</text>

  <line x1="607" y1="696" x2="607" y2="726" stroke="#94a3b8" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="420" y="730" width="374" height="56" rx="24" fill="#ffedd5" stroke="#f97316" stroke-width="2"/>
  <text x="448" y="765" class="cardTitle" style="font-size:25px;">4</text>
  <text x="492" y="765" class="cardTitle" style="font-size:25px;">입출력 시스템</text>
  <text x="664" y="765" class="small">인터럽트 · DMA · 저장장치 병목</text>

  <rect x="868" y="220" width="260" height="598" rx="28" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="900" y="264" class="section">기관별 연결 포인트</text>

  <rect x="900" y="292" width="196" height="136" rx="20" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="924" y="328" class="cardTitle" style="font-size:24px;">금융결제원</text>
  <text x="924" y="358" class="cardBody">인터럽트, DMA,</text>
  <text x="924" y="382" class="cardBody">캐시 일관성, 장애 대응</text>
  <text x="924" y="410" class="small">결제 지연 원인을 시스템 관점으로 설명</text>

  <rect x="900" y="450" width="196" height="136" rx="20" fill="#ecfeff" stroke="#67e8f9" stroke-width="2"/>
  <text x="924" y="486" class="cardTitle" style="font-size:24px;">산업은행</text>
  <text x="924" y="516" class="cardBody">파이프라인, 메모리 계층,</text>
  <text x="924" y="540" class="cardBody">RISC/CISC 비교</text>
  <text x="924" y="568" class="small">성능 개선 논리를 묻는 문제에 자주 연결</text>

  <rect x="900" y="608" width="196" height="168" rx="20" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <text x="924" y="644" class="cardTitle" style="font-size:24px;">코스콤</text>
  <text x="924" y="674" class="cardBody">저지연 처리, 캐시,</text>
  <text x="924" y="698" class="cardBody">분기 예측 실패</text>
  <text x="924" y="726" class="small">거래 처리량과 응답시간을 함께 설명</text>
  <text x="924" y="752" class="small">하는 문항에 대비</text>
</svg>
