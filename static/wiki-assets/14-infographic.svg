  <text class="subtitle" x="84" y="180" text-anchor="start"><tspan x="84" dy="0">금융공기업 IT 필기에서 컴퓨터구조는 운영체제 네트워크와 함께 시스템 전반의 성능과</tspan><tspan x="84" dy="24">안정성을 설명하는 핵심 과목입니다. 특히 금융결제원 산업은행 전산 직무에서는 CPU</tspan></text>
