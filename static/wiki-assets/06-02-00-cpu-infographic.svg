<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">06-02. CPU 스케줄링 흐름과 시점 인포그래픽</title>
  <desc id="desc">Ready Queue, Scheduler, Dispatcher, CPU의 역할과 스케줄링이 다시 일어나는 시점을 넓은 간격과 높은 대비로 정리한 CPU 스케줄링 인포그래픽.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .title { font: 700 34px 'Pretendard','Noto Sans KR',sans-serif; fill: #ffffff; }
      .subtitle { font: 500 17px 'Pretendard','Noto Sans KR',sans-serif; fill: #dbeafe; }
      .section { font: 700 22px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .label { font: 700 18px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .body { font: 500 15px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
      .small { font: 600 13px 'Pretendard','Noto Sans KR',sans-serif; fill: #475569; }
      .tiny { font: 600 12px 'Pretendard','Noto Sans KR',sans-serif; fill: #475569; }
      .heroSmall { font: 600 14px 'Pretendard','Noto Sans KR',sans-serif; fill: #bfdbfe; }
    </style>
  </defs>

  <rect width="1200" height="780" fill="url(#bg)"/>
  <rect x="24" y="24" width="1152" height="732" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <rect x="48" y="48" width="1104" height="120" rx="24" fill="url(#hero)"/>
  <text class="heroSmall" x="84" y="84">운영체제 · Ready Queue → Scheduler → Dispatcher → CPU</text>
  <text class="title" x="84" y="124">06-02. CPU 스케줄링</text>
  <text class="subtitle" x="84" y="154">누가 CPU를 받는지 결정하는 역할, 교체가 일어나는 시점, 선점형을 구분하는 핵심 질문을 분리해 정리</text>

  <g transform="translate(60 196)">
    <rect width="522" height="254" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text class="section" x="28" y="38">1. 역할 분담: 선택은 Scheduler, 실행 전환은 Dispatcher</text>
    <text class="body" x="28" y="66">Scheduler는 Ready Queue 후보를 고르고, Dispatcher는 선택 직후 문맥 전환을 수행해 CPU 제어권을 넘긴다.</text>

    <rect x="34" y="110" width="132" height="64" rx="18" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
    <text class="label" x="100" y="142" text-anchor="middle">Ready Queue</text>
    <text class="small" x="100" y="162" text-anchor="middle">실행 대기 프로세스</text>

    <rect x="210" y="110" width="124" height="64" rx="18" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
    <text class="label" x="272" y="142" text-anchor="middle">Scheduler</text>
    <text class="small" x="272" y="162" text-anchor="middle">누가 CPU를 받을지 결정</text>

    <rect x="378" y="110" width="114" height="64" rx="18" fill="#ecfeff" stroke="#06b6d4" stroke-width="2"/>
    <text class="label" x="435" y="142" text-anchor="middle">Dispatcher</text>
    <text class="small" x="435" y="162" text-anchor="middle">문맥 전환 수행</text>

    <line x1="166" y1="142" x2="210" y2="142" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="334" y1="142" x2="378" y2="142" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="210" y="194" width="282" height="34" rx="17" fill="#0f172a"/>
    <text x="351" y="216" text-anchor="middle" style="font: 600 13px 'Pretendard','Noto Sans KR',sans-serif; fill: #f8fafc;">결정 직후 Dispatcher가 레지스터 저장·복원과 모드 전환을 처리</text>
  </g>

  <g transform="translate(606 196)">
    <rect width="534" height="254" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text class="section" x="28" y="38">2. 선택 흐름: Ready Queue에서 CPU까지</text>
    <text class="body" x="28" y="66">도착시간, 실행시간, 우선순위, time quantum을 보고 선택 규칙을 적용한 뒤 간트 차트로 계산을 검증한다.</text>

    <rect x="30" y="96" width="176" height="126" rx="20" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
    <text class="label" x="52" y="124">Ready Queue 예시</text>
    <rect x="50" y="142" width="126" height="18" rx="9" fill="#3b82f6"/>
    <text class="tiny" x="182" y="155" text-anchor="end">P1 · 도착 0 · 실행 7</text>
    <rect x="50" y="170" width="94" height="18" rx="9" fill="#8b5cf6"/>
    <text class="tiny" x="182" y="183" text-anchor="end">P2 · 도착 2 · 실행 3</text>
    <rect x="50" y="198" width="62" height="18" rx="9" fill="#10b981"/>
    <text class="tiny" x="182" y="211" text-anchor="end">P3 · 도착 4 · 실행 2</text>

    <rect x="238" y="104" width="132" height="54" rx="18" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
    <text class="label" x="304" y="136" text-anchor="middle">선택 규칙</text>
    <text class="small" x="304" y="156" text-anchor="middle">FCFS · SJF · RR</text>

    <rect x="404" y="104" width="98" height="104" rx="18" fill="#ecfeff" stroke="#22c55e" stroke-width="2"/>
    <text class="label" x="453" y="136" text-anchor="middle">CPU</text>
    <text class="small" x="453" y="158" text-anchor="middle">실행</text>
    <text class="small" x="453" y="178" text-anchor="middle">문맥 전환</text>
    <text class="small" x="453" y="198" text-anchor="middle">완료/선점</text>

    <line x1="206" y1="159" x2="238" y2="131" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
    <line x1="370" y1="131" x2="404" y2="131" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

    <text class="small" x="30" y="241">간트 차트 예시</text>
    <rect x="30" y="226" width="472" height="18" rx="9" fill="#e2e8f0"/>
    <rect x="30" y="226" width="118" height="18" rx="9" fill="#3b82f6"/>
    <rect x="148" y="226" width="86" height="18" fill="#8b5cf6"/>
    <rect x="234" y="226" width="58" height="18" fill="#10b981"/>
    <rect x="292" y="226" width="122" height="18" fill="#3b82f6"/>
    <text class="tiny" x="89" y="239" text-anchor="middle">P1</text>
    <text class="tiny" x="191" y="239" text-anchor="middle">P2</text>
    <text class="tiny" x="263" y="239" text-anchor="middle">P3</text>
    <text class="tiny" x="353" y="239" text-anchor="middle">P1</text>
  </g>

  <g transform="translate(60 474)">
    <rect width="522" height="238" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text class="section" x="28" y="38">3. 스케줄링이 다시 일어나는 네 가지 시점</text>
    <text class="body" x="28" y="66">비선점형은 보통 종료·자발적 대기에서만 바뀌고, 선점형은 Running → Ready까지 포함해 더 자주 재평가한다.</text>

    <rect x="28" y="96" width="218" height="58" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text class="label" x="46" y="121">Running → Waiting</text>
    <text class="small" x="46" y="141">I/O 요청으로 CPU를 스스로 내려놓음</text>

    <rect x="276" y="96" width="218" height="58" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text class="label" x="294" y="121">Running → Terminated</text>
    <text class="small" x="294" y="141">실행 종료 후 다음 후보를 고름</text>

    <rect x="28" y="168" width="218" height="58" rx="18" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <text class="label" x="46" y="193">Running → Ready</text>
    <text class="small" x="46" y="213">타임 슬라이스 만료·더 높은 우선순위 도착</text>

    <rect x="276" y="168" width="218" height="58" rx="18" fill="#ecfccb" stroke="#84cc16" stroke-width="2"/>
    <text class="label" x="294" y="193">Waiting → Ready</text>
    <text class="small" x="294" y="213">I/O 완료 후 Ready Queue로 복귀</text>
  </g>

  <g transform="translate(606 474)">
    <rect width="534" height="238" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text class="section" x="28" y="38">4. 시험장에서 바로 묻는 체크 질문</text>
    <text class="body" x="28" y="66">문장을 읽을 때 아래 순서로 판단하면 선점형 여부와 계산 포인트를 빠르게 잡을 수 있다.</text>

    <rect x="28" y="96" width="478" height="118" rx="20" fill="#0f172a"/>
    <text x="50" y="126" style="font: 700 18px 'Pretendard','Noto Sans KR',sans-serif; fill: #f8fafc;">핵심 질문</text>
    <text x="50" y="154" style="font: 600 16px 'Pretendard','Noto Sans KR',sans-serif; fill: #e2e8f0;">실행 중인 프로세스가 끝나지 않았는데 CPU가 바뀌었는가?</text>
    <text x="50" y="180" style="font: 500 14px 'Pretendard','Noto Sans KR',sans-serif; fill: #cbd5e1;">예 → 선점형 상황이다. 타임퀀텀 만료, 인터럽트, 더 높은 우선순위 도착을 의심한다.</text>
    <text x="50" y="202" style="font: 500 14px 'Pretendard','Noto Sans KR',sans-serif; fill: #cbd5e1;">아니오 → 종료 또는 자발적 대기 뒤에 다음 작업을 고르는 비선점형 흐름일 가능성이 크다.</text>
  </g>

  <text class="small" x="84" y="744">06-02-00-cpu-infographic.svg · page-specific asset for 06-02-00-CPU-스케줄링.md</text>
</svg>
