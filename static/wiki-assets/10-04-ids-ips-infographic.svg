<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">10-04. IDS·IPS·로그 감사 비교 인포그래픽</title>
  <desc id="desc">IDS는 미러 트래픽을 패시브 탐지하고, IPS는 인라인에서 차단하며, 로그 감사는 여러 장비의 기록을 수집·보존·분석한다는 차이를 세 구역으로 비교한 도식이다.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .frame { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .navy { fill: #0f172a; }
      .slate { fill: #334155; }
      .muted { fill: #475569; }
      .blueFill { fill: #dbeafe; }
      .blueStroke { stroke: #2563eb; }
      .redFill { fill: #fee2e2; }
      .redStroke { stroke: #dc2626; }
      .amberFill { fill: #fef3c7; }
      .amberStroke { stroke: #d97706; }
      .greenFill { fill: #dcfce7; }
      .greenStroke { stroke: #16a34a; }
      .purpleFill { fill: #ede9fe; }
      .purpleStroke { stroke: #7c3aed; }
      .title { font: 700 34px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .subtitle { font: 500 18px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
      .section { font: 700 21px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .label { font: 700 17px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .body { font: 500 15px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
      .small { font: 600 13px 'Pretendard','Noto Sans KR',sans-serif; fill: #475569; }
      .capsule { font: 700 13px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .mono { font: 600 13px 'SFMono-Regular',Consolas,monospace; fill: #334155; }
    </style>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#2563eb" />
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#dc2626" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#d97706" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1200" height="820" />
  <rect class="frame" x="24" y="24" width="1152" height="772" rx="28" />

  <text x="64" y="80" class="small">보안 운영 핵심: 보는 장치 / 막는 장치 / 남기는 기록</text>
  <text x="64" y="124" class="title">10-04. IDS · IPS · 로그 감사</text>
  <text x="64" y="156" class="subtitle">배치 위치와 운영 목적이 다르므로, 같은 보안 이벤트라도 어디서 탐지하고 무엇을 남기는지 구분해야 한다.</text>

  <rect x="64" y="194" width="1072" height="88" rx="22" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2" />
  <text x="92" y="228" class="section">핵심 비교</text>
  <text x="92" y="255" class="body">IDS = 패시브 탐지·알림 / IPS = 인라인 탐지·차단 / 로그 감사 = 기록 보존·상관분석·사후 증빙</text>

  <rect x="64" y="308" width="330" height="324" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" />
  <rect x="88" y="332" width="92" height="30" rx="15" class="purpleFill" />
  <text x="134" y="352" text-anchor="middle" class="capsule">패시브</text>
  <text x="88" y="392" class="section">IDS</text>
  <text x="88" y="420" class="label">미러/SPAN 복제 트래픽만 관찰</text>
  <rect x="88" y="446" width="280" height="62" rx="18" class="blueFill" stroke="#60a5fa" stroke-width="2" />
  <text x="108" y="474" class="body">• 실시간 탐지와 경보 생성</text>
  <text x="108" y="498" class="body">• 수동 대응 또는 별도 절차 연계</text>
  <rect x="88" y="528" width="280" height="76" rx="18" class="purpleFill" stroke="#a78bfa" stroke-width="2" />
  <text x="108" y="556" class="body">탐지 기법</text>
  <text x="108" y="580" class="small">서명 기반: 알려진 패턴 식별</text>
  <text x="108" y="600" class="small">이상 기반: 정상 이탈 행위 포착</text>

  <rect x="434" y="308" width="330" height="324" rx="24" fill="#fff7ed" stroke="#fdba74" stroke-width="2" />
  <rect x="458" y="332" width="92" height="30" rx="15" fill="#fee2e2" />
  <text x="504" y="352" text-anchor="middle" class="capsule">인라인</text>
  <text x="458" y="392" class="section">IPS</text>
  <text x="458" y="420" class="label">실제 트래픽 경로 위에서 즉시 차단</text>
  <rect x="458" y="446" width="282" height="62" rx="18" class="redFill" stroke="#f87171" stroke-width="2" />
  <text x="478" y="474" class="body">• 탐지 후 패킷 차단·세션 종료</text>
  <text x="478" y="498" class="body">• 악성 요청을 내부망 전에 차단</text>
  <rect x="458" y="528" width="282" height="76" rx="18" fill="#ffedd5" stroke="#fb923c" stroke-width="2" />
  <text x="478" y="556" class="body">운영 포인트</text>
  <text x="478" y="580" class="small">가용성 영향이 있으므로 이중화·우회 설계 필요</text>
  <text x="478" y="600" class="small">경계 구간·중요 서버 존 앞에 배치</text>

  <rect x="804" y="308" width="332" height="324" rx="24" fill="#fffbeb" stroke="#fcd34d" stroke-width="2" />
  <rect x="828" y="332" width="112" height="30" rx="15" class="amberFill" />
  <text x="884" y="352" text-anchor="middle" class="capsule">기록·감사</text>
  <text x="828" y="392" class="section">로그 감사</text>
  <text x="828" y="420" class="label">사건 전·중·후 기록을 남기고 연결</text>
  <rect x="828" y="446" width="284" height="62" rx="18" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" />
  <text x="848" y="474" class="body">• 방화벽·서버·DB·앱 로그를 중앙 수집</text>
  <text x="848" y="498" class="body">• SIEM에서 정규화·상관분석 수행</text>
  <rect x="828" y="528" width="284" height="76" rx="18" fill="#ecfccb" stroke="#65a30d" stroke-width="2" />
  <text x="848" y="556" class="body">필수 통제</text>
  <text x="848" y="580" class="small">시간 동기화, 무결성 보장, 보존 정책, 접근통제</text>
  <text x="848" y="600" class="small">사후 분석·책임 추적·규제 증빙 지원</text>

  <rect x="64" y="658" width="1072" height="102" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
  <text x="92" y="692" class="section">배치 차이 한눈에 보기</text>
  <circle cx="156" cy="722" r="24" class="blueFill" stroke="#60a5fa" stroke-width="2" />
  <text x="156" y="728" text-anchor="middle" class="capsule">외부</text>
  <line x1="180" y1="722" x2="500" y2="722" stroke="#2563eb" stroke-width="8" stroke-linecap="round" marker-end="url(#arrowBlue)" />
  <rect x="310" y="692" width="82" height="58" rx="14" class="redFill" stroke="#dc2626" stroke-width="2" />
  <text x="351" y="726" text-anchor="middle" class="label">IPS</text>
  <rect x="258" y="668" width="88" height="34" rx="17" class="purpleFill" stroke="#7c3aed" stroke-width="2" />
  <text x="302" y="690" text-anchor="middle" class="capsule">IDS는 옆에서 관찰</text>
  <line x1="302" y1="702" x2="302" y2="716" stroke="#7c3aed" stroke-width="3" />
  <line x1="302" y1="716" x2="252" y2="716" stroke="#7c3aed" stroke-width="3" stroke-dasharray="6 5" marker-end="url(#arrowBlue)" />
  <rect x="518" y="692" width="120" height="58" rx="14" class="greenFill" stroke="#16a34a" stroke-width="2" />
  <text x="578" y="726" text-anchor="middle" class="label">내부 서비스</text>
  <line x1="638" y1="722" x2="800" y2="722" stroke="#d97706" stroke-width="5" stroke-dasharray="10 7" marker-end="url(#arrowAmber)" />
  <rect x="814" y="692" width="248" height="58" rx="14" class="amberFill" stroke="#d97706" stroke-width="2" />
  <text x="938" y="716" text-anchor="middle" class="label">로그 수집기 / SIEM</text>
  <text x="938" y="738" text-anchor="middle" class="small">탐지 결과와 운영 기록을 장기 보존</text>

  <text x="600" y="784" text-anchor="middle" class="mono">기억법: IDS는 본다 · IPS는 막는다 · 로그 감사는 남기고 증명한다</text>
</svg>