<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">10-03-01. XSS와 SQL Injection 비교 인포그래픽</title>
  <desc id="desc">왼쪽은 XSS가 사용자 브라우저에서 스크립트를 실행시키는 흐름과 종류 및 방어책을, 오른쪽은 SQL Injection이 서버의 데이터베이스 질의를 조작하는 흐름과 패턴 및 방어책을 비교해 보여준다.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#eff6ff"/>
    </linearGradient>
    <linearGradient id="xssGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fee2e2"/>
      <stop offset="100%" stop-color="#fecaca"/>
    </linearGradient>
    <linearGradient id="sqliGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; }
      .title { font-size: 34px; font-weight: 700; fill: #0f172a; }
      .subtitle { font-size: 16px; font-weight: 500; fill: #334155; }
      .section { font-size: 24px; font-weight: 700; }
      .section-red { fill: #991b1b; }
      .section-blue { fill: #1d4ed8; }
      .panel-title { font-size: 18px; font-weight: 700; fill: #0f172a; }
      .label { font-size: 15px; font-weight: 700; fill: #0f172a; }
      .body { font-size: 14px; font-weight: 500; fill: #334155; }
      .tiny { font-size: 12px; font-weight: 600; fill: #475569; }
      .mono { font-size: 13px; font-weight: 700; fill: #7f1d1d; }
      .mono-blue { font-size: 13px; font-weight: 700; fill: #1e3a8a; }
      .chip { font-size: 12px; font-weight: 700; fill: #0f172a; }
    </style>
  </defs>

  <rect width="1200" height="720" fill="#f8fafc"/>
  <rect x="24" y="24" width="1152" height="672" rx="30" fill="url(#bg)" stroke="#cbd5e1"/>

  <text x="70" y="78" class="title">10-03-01. XSS vs SQL Injection</text>
  <text x="70" y="108" class="subtitle">핵심 구분: XSS는 브라우저에서 스크립트가 실행되고, SQL Injection은 서버의 DB 질의 구조가 조작된다.</text>

  <rect x="58" y="138" width="510" height="402" rx="26" fill="url(#xssGrad)" stroke="#fca5a5"/>
  <rect x="632" y="138" width="510" height="402" rx="26" fill="url(#sqliGrad)" stroke="#93c5fd"/>
  <rect x="58" y="560" width="1084" height="104" rx="24" fill="#ffffff" stroke="#cbd5e1"/>

  <text x="86" y="178" class="section section-red">XSS</text>
  <text x="140" y="178" class="subtitle">출력값이 코드로 해석되어 사용자 브라우저에서 실행</text>
  <text x="660" y="178" class="section section-blue">SQL Injection</text>
  <text x="810" y="178" class="subtitle">입력값이 질의 구조에 섞여 서버의 DB 명령이 변형</text>

  <rect x="86" y="206" width="144" height="84" rx="16" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
  <text x="158" y="234" text-anchor="middle" class="label">공격 입력</text>
  <text x="102" y="258" class="mono">&lt;script&gt;...&lt;/script&gt;</text>
  <text x="102" y="277" class="tiny">댓글 · 검색어 · 프로필</text>

  <rect x="270" y="206" width="118" height="84" rx="16" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="329" y="234" text-anchor="middle" class="label">취약 출력</text>
  <text x="292" y="258" class="body">innerHTML</text>
  <text x="292" y="277" class="body">반사 응답</text>

  <rect x="428" y="198" width="112" height="100" rx="18" fill="#ffffff" stroke="#b91c1c" stroke-width="2"/>
  <rect x="442" y="216" width="84" height="52" rx="8" fill="#e2e8f0" stroke="#94a3b8"/>
  <circle cx="452" cy="226" r="4" fill="#ef4444"/>
  <circle cx="466" cy="226" r="4" fill="#f59e0b"/>
  <circle cx="480" cy="226" r="4" fill="#22c55e"/>
  <text x="484" y="286" text-anchor="middle" class="label">브라우저 실행</text>

  <line x1="230" y1="248" x2="270" y2="248" stroke="#dc2626" stroke-width="4" marker-end="url(#arrowRed)"/>
  <line x1="388" y1="248" x2="428" y2="248" stroke="#dc2626" stroke-width="4" marker-end="url(#arrowRed)"/>

  <rect x="86" y="322" width="144" height="76" rx="16" fill="#fff1f2" stroke="#e11d48"/>
  <text x="158" y="348" text-anchor="middle" class="label">Reflected</text>
  <text x="103" y="369" class="tiny">링크 클릭 직후</text>
  <text x="103" y="387" class="tiny">요청값이 즉시 반사</text>

  <rect x="242" y="322" width="144" height="76" rx="16" fill="#fff1f2" stroke="#e11d48"/>
  <text x="314" y="348" text-anchor="middle" class="label">Stored</text>
  <text x="259" y="369" class="tiny">DB·게시판에 저장</text>
  <text x="259" y="387" class="tiny">다수 사용자에게 반복</text>

  <rect x="398" y="322" width="144" height="76" rx="16" fill="#fff1f2" stroke="#e11d48"/>
  <text x="470" y="348" text-anchor="middle" class="label">DOM XSS</text>
  <text x="415" y="369" class="tiny">location.hash 사용</text>
  <text x="415" y="387" class="tiny">JS가 DOM 직접 삽입</text>

  <rect x="86" y="426" width="456" height="88" rx="18" fill="#ffffff" stroke="#fca5a5"/>
  <text x="108" y="454" class="panel-title">핵심 방어</text>
  <text x="108" y="478" class="body">• 문맥별 출력 인코딩  • textContent / createElement 같은 안전한 DOM API</text>
  <text x="108" y="500" class="body">• CSP  • 허용목록 기반 sanitizer  • HttpOnly·Secure·SameSite 쿠키</text>

  <rect x="660" y="206" width="144" height="84" rx="16" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="732" y="234" text-anchor="middle" class="label">공격 입력</text>
  <text x="676" y="258" class="mono-blue">admin' --</text>
  <text x="676" y="277" class="tiny">' OR '1'='1</text>

  <rect x="846" y="206" width="126" height="84" rx="16" fill="#eff6ff" stroke="#0f766e" stroke-width="2"/>
  <text x="909" y="234" text-anchor="middle" class="label">문자열 결합</text>
  <text x="868" y="258" class="body">WHERE id='…'</text>
  <text x="868" y="277" class="body">AND pw='…'</text>

  <ellipse cx="1060" cy="248" rx="56" ry="42" fill="#ffffff" stroke="#1d4ed8" stroke-width="2"/>
  <ellipse cx="1060" cy="238" rx="56" ry="16" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="1060" y="254" text-anchor="middle" class="label">DB 질의 변경</text>
  <text x="1060" y="273" text-anchor="middle" class="tiny">인증 우회 · 조회 · 변조</text>

  <line x1="804" y1="248" x2="846" y2="248" stroke="#2563eb" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <line x1="972" y1="248" x2="1004" y2="248" stroke="#2563eb" stroke-width="4" marker-end="url(#arrowBlue)"/>

  <rect x="660" y="322" width="104" height="76" rx="16" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="712" y="348" text-anchor="middle" class="label">인증 우회</text>
  <text x="677" y="387" class="tiny">항상 참 조건 삽입</text>

  <rect x="778" y="322" width="104" height="76" rx="16" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="830" y="348" text-anchor="middle" class="label">UNION</text>
  <text x="795" y="387" class="tiny">다른 테이블 조회</text>

  <rect x="896" y="322" width="104" height="76" rx="16" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="948" y="348" text-anchor="middle" class="label">Error</text>
  <text x="913" y="387" class="tiny">오류 메시지 노출</text>

  <rect x="1014" y="322" width="104" height="76" rx="16" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="1066" y="348" text-anchor="middle" class="label">Blind / Time</text>
  <text x="1031" y="387" class="tiny">반응·시간으로 추론</text>

  <rect x="660" y="426" width="458" height="88" rx="18" fill="#ffffff" stroke="#93c5fd"/>
  <text x="682" y="454" class="panel-title">핵심 방어</text>
  <text x="682" y="478" class="body">• Prepared Statement / 파라미터 바인딩  • 타입·범위 검증과 허용목록</text>
  <text x="682" y="500" class="body">• 최소 권한 DB 계정  • 내부 오류 숨김  • 동적 SQL 문자열 결합 금지</text>

  <text x="84" y="594" class="panel-title">빠른 비교</text>

  <rect x="82" y="610" width="184" height="34" rx="10" fill="#fee2e2"/>
  <text x="174" y="632" text-anchor="middle" class="chip">공격 대상: 사용자 브라우저</text>
  <rect x="278" y="610" width="200" height="34" rx="10" fill="#dbeafe"/>
  <text x="378" y="632" text-anchor="middle" class="chip">공격 대상: 서버의 DB 질의</text>
  <rect x="490" y="610" width="164" height="34" rx="10" fill="#fef3c7"/>
  <text x="572" y="632" text-anchor="middle" class="chip">실행 위치로 구분</text>
  <rect x="666" y="610" width="194" height="34" rx="10" fill="#dcfce7"/>
  <text x="763" y="632" text-anchor="middle" class="chip">XSS 방어: 인코딩·CSP·안전 DOM</text>
  <rect x="872" y="610" width="244" height="34" rx="10" fill="#e0f2fe"/>
  <text x="994" y="632" text-anchor="middle" class="chip">SQLi 방어: Prepared Statement·최소 권한</text>

  <text x="84" y="680" class="tiny">페이지 포인트: 브라우저에서 코드가 실행되면 XSS, DB 질의가 바뀌면 SQL Injection으로 분류한다.</text>
</svg>
