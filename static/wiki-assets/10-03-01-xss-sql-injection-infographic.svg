<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc">
  <title id="title">10-03-01. XSS와 SQL Injection 비교 요약</title>
  <desc id="desc">XSS와 SQL Injection의 실행 위치, 대표 흐름, 대표 피해, 방어 핵심을 두 개의 큰 패널로 나눠 비교한 인포그래픽이다.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffaf5"/>
      <stop offset="100%" stop-color="#f8fbff"/>
    </linearGradient>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #0f172a; }
      .title { font-size: 34px; font-weight: 700; }
      .subtitle { font-size: 17px; font-weight: 500; fill: #334155; }
      .section { font-size: 28px; font-weight: 700; }
      .sectionNote { font-size: 16px; font-weight: 600; }
      .cardTitle { font-size: 18px; font-weight: 700; }
      .body { font-size: 16px; font-weight: 500; fill: #334155; }
      .small { font-size: 14px; font-weight: 500; fill: #475569; }
      .chip { font-size: 15px; font-weight: 700; }
      .monoRed { font-size: 15px; font-weight: 700; fill: #991b1b; }
      .monoBlue { font-size: 15px; font-weight: 700; fill: #1e3a8a; }
    </style>
  </defs>

  <rect width="1200" height="920" fill="#f8fafc"/>
  <rect x="24" y="24" width="1152" height="872" rx="28" fill="url(#bg)" stroke="#cbd5e1"/>

  <text x="64" y="82" class="title">10-03-01. XSS vs SQL Injection</text>
  <text x="64" y="116" class="subtitle">구분 기준은 실행 위치다. 브라우저에서 코드가 실행되면 XSS, 서버의 DB 질의 구조가 바뀌면 SQL Injection이다.</text>

  <rect x="56" y="148" width="522" height="564" rx="24" fill="#fff1f2" stroke="#fda4af" stroke-width="2"/>
  <rect x="622" y="148" width="522" height="564" rx="24" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>

  <text x="88" y="196" class="section" fill="#9f1239">XSS</text>
  <text x="152" y="196" class="sectionNote" fill="#9f1239">출력값이 코드처럼 해석되어 브라우저에서 실행</text>
  <text x="654" y="196" class="section" fill="#1d4ed8">SQL Injection</text>
  <text x="865" y="196" class="sectionNote" fill="#1d4ed8">입력값이 SQL 문장 구조에 섞여 DB 질의가 변형</text>

  <rect x="88" y="224" width="458" height="118" rx="18" fill="#ffffff" stroke="#f43f5e"/>
  <text x="112" y="256" class="cardTitle">대표 흐름</text>
  <text x="112" y="284" class="body">1) 댓글·검색어·프로필에 스크립트 삽입</text>
  <text x="112" y="310" class="body">2) 서버나 프론트 코드가 값을 그대로 출력</text>
  <text x="112" y="336" class="body">3) 피해자 브라우저가 스크립트를 실행</text>

  <rect x="88" y="362" width="458" height="134" rx="18" fill="#ffffff" stroke="#f43f5e"/>
  <text x="112" y="394" class="cardTitle">시험에서 자주 묻는 유형</text>
  <text x="112" y="422" class="body">• Reflected: 요청 직후 바로 반사</text>
  <text x="112" y="448" class="body">• Stored: 게시판·DB에 저장되어 반복 실행</text>
  <text x="112" y="474" class="body">• DOM XSS: location/hash 등을 JS가 직접 삽입</text>

  <rect x="88" y="516" width="458" height="168" rx="18" fill="#ffffff" stroke="#f43f5e"/>
  <text x="112" y="548" class="cardTitle">핵심 방어</text>
  <text x="112" y="576" class="body">• 문맥별 출력 인코딩(HTML·속성·JS·URL 분리)</text>
  <text x="112" y="602" class="body">• innerHTML 대신 textContent, createElement 사용</text>
  <text x="112" y="628" class="body">• 허용목록 기반 sanitizer와 CSP 병행</text>
  <text x="112" y="654" class="body">• HttpOnly·Secure·SameSite 쿠키로 피해 축소</text>

  <rect x="654" y="224" width="458" height="118" rx="18" fill="#ffffff" stroke="#3b82f6"/>
  <text x="678" y="256" class="cardTitle">대표 흐름</text>
  <text x="678" y="284" class="body">1) 입력값에 작은따옴표·주석·조건식을 섞음</text>
  <text x="678" y="310" class="body">2) 서버가 문자열 결합으로 SQL 문장을 만듦</text>
  <text x="678" y="336" class="body">3) DB가 바뀐 조건을 정상 질의처럼 실행</text>

  <rect x="654" y="362" width="458" height="134" rx="18" fill="#ffffff" stroke="#3b82f6"/>
  <text x="678" y="394" class="cardTitle">시험에서 자주 묻는 유형</text>
  <text x="678" y="422" class="body">• 인증 우회: ' OR '1'='1</text>
  <text x="678" y="448" class="body">• UNION: 다른 테이블 결과를 합쳐 조회</text>
  <text x="678" y="474" class="body">• Error / Blind / Time: 오류·반응·지연으로 추론</text>

  <rect x="654" y="516" width="458" height="168" rx="18" fill="#ffffff" stroke="#3b82f6"/>
  <text x="678" y="548" class="cardTitle">핵심 방어</text>
  <text x="678" y="576" class="body">• Prepared Statement와 파라미터 바인딩 사용</text>
  <text x="678" y="602" class="body">• 타입·범위 검증과 허용목록으로 입력 제한</text>
  <text x="678" y="628" class="body">• 최소 권한 DB 계정으로 피해 범위 축소</text>
  <text x="678" y="654" class="body">• 내부 오류 숨김, 동적 SQL 문자열 결합 금지</text>

  <rect x="56" y="736" width="1088" height="128" rx="22" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="88" y="776" class="cardTitle">빠른 구분 질문</text>

  <rect x="88" y="794" width="226" height="42" rx="12" fill="#ffe4e6" stroke="#fda4af"/>
  <text x="201" y="821" text-anchor="middle" class="chip">브라우저에서 실행되는가?</text>

  <rect x="332" y="794" width="180" height="42" rx="12" fill="#fee2e2" stroke="#fda4af"/>
  <text x="422" y="821" text-anchor="middle" class="chip">예 → XSS</text>

  <rect x="530" y="794" width="236" height="42" rx="12" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="648" y="821" text-anchor="middle" class="chip">DB 질의 구조가 바뀌는가?</text>

  <rect x="784" y="794" width="268" height="42" rx="12" fill="#dbeafe" stroke="#93c5fd"/>
  <text x="918" y="821" text-anchor="middle" class="chip">예 → SQL Injection</text>

  <text x="88" y="874" class="small">예시 입력: <tspan class="monoRed">&lt;script&gt;...&lt;/script&gt;</tspan> 는 XSS 쪽, <tspan class="monoBlue">admin' --</tspan> 와 <tspan class="monoBlue">' OR '1'='1</tspan> 는 SQL Injection 쪽 단서다.</text>
</svg>
