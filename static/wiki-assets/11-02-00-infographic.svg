<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="940" viewBox="0 0 1280 940" role="img" aria-labelledby="title desc">
  <title id="title">11-02. 테스트 핵심 구조</title>
  <desc id="desc">테스트의 목적과 V-모델 대응 관계를 읽기 쉽게 정리한 인포그래픽</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .frame { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .navy { fill: #0f172a; }
      .slate { fill: #334155; }
      .muted { fill: #475569; }
      .blueText { fill: #1d4ed8; }
      .greenText { fill: #047857; }
      .title { font: 700 40px 'Pretendard','Noto Sans KR',sans-serif; }
      .subtitle { font: 500 19px 'Pretendard','Noto Sans KR',sans-serif; }
      .section { font: 700 24px 'Pretendard','Noto Sans KR',sans-serif; }
      .label { font: 700 18px 'Pretendard','Noto Sans KR',sans-serif; }
      .body { font: 500 15px 'Pretendard','Noto Sans KR',sans-serif; }
      .small { font: 600 14px 'Pretendard','Noto Sans KR',sans-serif; }
      .center { text-anchor: middle; }
    </style>
  </defs>

  <rect class="bg" width="1280" height="940" rx="32"/>
  <rect x="24" y="24" width="1232" height="892" rx="28" class="frame"/>

  <text x="72" y="82" class="small muted">소프트웨어공학 · 테스트 요약</text>
  <text x="72" y="130" class="title navy">11-02. 테스트</text>
  <text x="72" y="164" class="subtitle slate">테스트는 결함을 찾는 데서 끝나지 않고, 품질을 평가하고 위험을 줄이며 배포 결정을 돕는다.</text>

  <rect x="56" y="204" width="1168" height="276" rx="26" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="88" y="246" class="section navy">1. 테스트의 목적</text>
  <text x="88" y="274" class="body slate">각 목적은 서로 독립이 아니라, 결함 데이터와 품질 결과를 모아 운영 위험과 릴리스 판단으로 연결된다.</text>

  <rect x="88" y="304" width="250" height="136" rx="22" fill="#dbeafe" stroke="#93c5fd" stroke-width="2"/>
  <circle cx="122" cy="340" r="14" fill="#2563eb"/>
  <text x="150" y="336" class="label navy">결함 발견</text>
  <text x="150" y="362" class="body slate">경계값, 예외 경로,</text>
  <text x="150" y="384" class="body slate">동시성 문제를 조기에 찾는다.</text>
  <text x="150" y="412" class="small blueText">질문: 어디서 실패하는가?</text>

  <rect x="366" y="304" width="250" height="136" rx="22" fill="#e0f2fe" stroke="#7dd3fc" stroke-width="2"/>
  <circle cx="400" cy="340" r="14" fill="#0891b2"/>
  <text x="428" y="336" class="label navy">품질 평가</text>
  <text x="428" y="362" class="body slate">성능, 안정성, 보안,</text>
  <text x="428" y="384" class="body slate">사용성 수준을 확인한다.</text>
  <text x="428" y="412" class="small" fill="#0f766e">질문: 충분히 잘 동작하는가?</text>

  <rect x="644" y="304" width="250" height="136" rx="22" fill="#dcfce7" stroke="#86efac" stroke-width="2"/>
  <circle cx="678" cy="340" r="14" fill="#16a34a"/>
  <text x="706" y="336" class="label navy">위험 감소</text>
  <text x="706" y="362" class="body slate">운영 전 문제를 드러내</text>
  <text x="706" y="384" class="body slate">배포 실패 가능성을 낮춘다.</text>
  <text x="706" y="412" class="small greenText">질문: 운영 리스크가 줄었는가?</text>

  <rect x="922" y="304" width="270" height="136" rx="22" fill="#fef3c7" stroke="#fcd34d" stroke-width="2"/>
  <circle cx="956" cy="340" r="14" fill="#d97706"/>
  <text x="984" y="336" class="label navy">의사결정 지원</text>
  <text x="984" y="362" class="body slate">통과율, 결함 심각도,</text>
  <text x="984" y="384" class="body slate">재현성으로 릴리스 여부를 판단한다.</text>
  <text x="984" y="412" class="small" fill="#b45309">질문: 지금 배포해도 되는가?</text>

  <path d="M338 372 H366" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <polygon points="366,372 352,364 352,380" fill="#94a3b8"/>
  <path d="M616 372 H644" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <polygon points="644,372 630,364 630,380" fill="#94a3b8"/>
  <path d="M894 372 H922" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
  <polygon points="922,372 908,364 908,380" fill="#94a3b8"/>

  <rect x="56" y="510" width="1168" height="374" rx="26" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="88" y="552" class="section navy">2. V-모델: 개발 산출물 ↔ 대응 테스트</text>
  <text x="88" y="580" class="body slate">왼쪽에서 만든 산출물은 오른쪽의 대응 테스트에서 검증된다. 구현에 가까울수록 단위 테스트, 요구사항에 가까울수록 인수 테스트가 대응된다.</text>

  <path d="M404 660 L640 826 L876 660" fill="none" stroke="#cbd5e1" stroke-width="34" stroke-linecap="round" stroke-linejoin="round" opacity="0.65"/>
  <path d="M404 660 L640 826" fill="none" stroke="#2563eb" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M640 826 L876 660" fill="none" stroke="#16a34a" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="176" y="620" width="182" height="68" rx="18" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
  <text x="267" y="648" class="label center navy">요구사항 분석</text>
  <text x="267" y="674" class="body center slate">무엇을 만족해야 하는가</text>

  <rect x="260" y="708" width="182" height="68" rx="18" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
  <text x="351" y="736" class="label center navy">시스템 설계</text>
  <text x="351" y="762" class="body center slate">전체 구조와 제약 정의</text>

  <rect x="372" y="796" width="182" height="68" rx="18" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
  <text x="463" y="824" class="label center navy">상세 설계</text>
  <text x="463" y="850" class="body center slate">모듈과 인터페이스 설계</text>

  <rect x="549" y="736" width="182" height="72" rx="18" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="640" y="766" class="label center navy">구현</text>
  <text x="640" y="792" class="body center slate">코드 작성과 단위 기준점</text>

  <rect x="726" y="796" width="182" height="68" rx="18" fill="#dcfce7" stroke="#4ade80" stroke-width="2"/>
  <text x="817" y="824" class="label center navy">통합 테스트</text>
  <text x="817" y="850" class="body center slate">모듈 연결과 데이터 흐름 확인</text>

  <rect x="838" y="708" width="182" height="68" rx="18" fill="#dcfce7" stroke="#4ade80" stroke-width="2"/>
  <text x="929" y="736" class="label center navy">시스템 테스트</text>
  <text x="929" y="762" class="body center slate">전체 시스템 동작과 품질 확인</text>

  <rect x="922" y="620" width="182" height="68" rx="18" fill="#dcfce7" stroke="#4ade80" stroke-width="2"/>
  <text x="1013" y="648" class="label center navy">인수 테스트</text>
  <text x="1013" y="674" class="body center slate">사용자 요구 충족 여부 판단</text>

  <line x1="360" y1="654" x2="920" y2="654" stroke="#94a3b8" stroke-width="3" stroke-dasharray="8 8"/>
  <line x1="446" y1="742" x2="836" y2="742" stroke="#94a3b8" stroke-width="3" stroke-dasharray="8 8"/>
  <line x1="558" y1="830" x2="724" y2="830" stroke="#94a3b8" stroke-width="3" stroke-dasharray="8 8"/>

  <text x="92" y="642" class="small blueText">개발 관점</text>
  <text x="1058" y="642" class="small greenText">검증 관점</text>
  <text x="640" y="604" class="small center muted">시험 포인트: 개발 산출물이 무엇인지 보이면, 그 산출물을 검증하는 테스트 단계도 함께 떠올린다.</text>
</svg>
