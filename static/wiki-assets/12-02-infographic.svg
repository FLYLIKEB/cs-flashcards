<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">12-02. 수리 인포그래픽</title>
  <desc id="desc">수리 문제를 빠르게 푸는 순서와 핵심 공식, 단위 확인, 근사 계산, 검산 습관을 설명하는 인포그래픽</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#ecfeff"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#94a3b8" flood-opacity="0.18"/>
    </filter>
    <style>
      .title { font: 800 36px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .subtitle { font: 500 18px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
      .section { font: 800 20px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .label { font: 700 16px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .body { font: 500 15px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
      .small { font: 700 13px 'Pretendard','Noto Sans KR',sans-serif; fill: #475569; }
      .formula { font: 700 18px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .white { fill: #ffffff; }
    </style>
  </defs>

  <rect width="1200" height="720" fill="#f8fafc"/>
  <rect x="28" y="28" width="1144" height="664" rx="30" fill="url(#bg)"/>
  <rect x="52" y="52" width="1096" height="616" rx="28" fill="#ffffff" filter="url(#shadow)"/>

  <text x="86" y="96" class="small">NCS 수리 · 자료해석 시간 단축 루틴</text>
  <text x="86" y="138" class="title">12-02. 수리</text>
  <text x="86" y="170" class="subtitle">질문 파악 → 단위 확인 → 식 설정 → 근사 계산 → 검산까지, 계산보다 구조를 먼저 잡는다.</text>

  <rect x="80" y="206" width="300" height="394" rx="24" fill="url(#panel)" stroke="#bfdbfe" stroke-width="2"/>
  <text x="104" y="244" class="section">1. 먼저 읽는 순서</text>

  <circle cx="122" cy="287" r="17" fill="#2563eb"/>
  <text x="122" y="293" text-anchor="middle" class="label white">1</text>
  <text x="150" y="285" class="label">질문을 한 문장으로 바꾸기</text>
  <text x="150" y="307" class="body">“무엇을 구하나?”를 먼저 적어 불필요한 계산 차단</text>

  <circle cx="122" cy="362" r="17" fill="#0ea5e9"/>
  <text x="122" y="368" text-anchor="middle" class="label white">2</text>
  <text x="150" y="360" class="label">표·그래프의 축과 단위 확인</text>
  <text x="150" y="382" class="body">백만원, 천명, %, 기준연도, 0부터 시작하는 축 점검</text>

  <circle cx="122" cy="437" r="17" fill="#14b8a6"/>
  <text x="122" y="443" text-anchor="middle" class="label white">3</text>
  <text x="150" y="435" class="label">필요한 값만 추출</text>
  <text x="150" y="457" class="body">행·열 헤더와 주석을 읽고 필요한 숫자만 남긴다</text>

  <circle cx="122" cy="512" r="17" fill="#22c55e"/>
  <text x="122" y="518" text-anchor="middle" class="label white">4</text>
  <text x="150" y="510" class="label">식 단순화 후 계산</text>
  <text x="150" y="532" class="body">분자·분모 정리, 비율 비교, 단위 통일 후 계산 시작</text>

  <rect x="102" y="555" width="256" height="28" rx="14" fill="#dbeafe"/>
  <text x="230" y="574" text-anchor="middle" class="small">핵심: 계산보다 먼저 기준·단위·질문을 고정</text>

  <rect x="410" y="206" width="382" height="394" rx="28" fill="url(#core)"/>
  <text x="440" y="244" class="section white">2. 계산 엔진</text>
  <text x="440" y="274" class="body white">자주 쓰는 식을 빠르게 꺼내고, 근사값으로 선택지를 줄인다.</text>

  <rect x="440" y="298" width="322" height="74" rx="18" fill="#ffffff" opacity="0.96"/>
  <text x="462" y="325" class="small">증가율</text>
  <text x="462" y="352" class="formula">(새 값 − 기준 값) ÷ 기준 값 × 100</text>

  <rect x="440" y="388" width="152" height="80" rx="18" fill="#ffffff" opacity="0.96"/>
  <text x="462" y="415" class="small">평균</text>
  <text x="462" y="445" class="formula">합계 ÷ 개수</text>

  <rect x="610" y="388" width="152" height="80" rx="18" fill="#ffffff" opacity="0.96"/>
  <text x="632" y="415" class="small">가중평균</text>
  <text x="632" y="445" class="formula">Σ(값×가중치) ÷ Σ가중치</text>

  <rect x="440" y="486" width="322" height="92" rx="18" fill="#082f49" opacity="0.3"/>
  <rect x="452" y="498" width="298" height="68" rx="16" fill="#ffffff" opacity="0.96"/>
  <text x="474" y="523" class="small">시간 절약 규칙</text>
  <text x="474" y="545" class="body">선택지 차이가 크면 근사값으로 2~3개까지 압축</text>
  <text x="474" y="563" class="body">정확 계산은 마지막 후보에만 사용</text>

  <path d="M 792 400 C 834 400, 848 400, 884 400" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" opacity="0.9"/>
  <path d="M 792 400 C 834 400, 848 400, 884 400" fill="none" stroke="#bae6fd" stroke-width="3" stroke-dasharray="10 8" stroke-linecap="round">
    <animate attributeName="stroke-dashoffset" from="0" to="-72" dur="5s" repeatCount="indefinite"/>
  </path>

  <rect x="820" y="206" width="300" height="394" rx="24" fill="url(#panel)" stroke="#99f6e4" stroke-width="2"/>
  <text x="844" y="244" class="section">3. 빠른 판별과 검산</text>

  <rect x="846" y="274" width="248" height="60" rx="18" fill="#dcfce7"/>
  <text x="970" y="298" text-anchor="middle" class="label">① 비율인가, 절대값인가?</text>
  <text x="970" y="319" text-anchor="middle" class="body">요구값 성격을 먼저 구분</text>

  <polygon points="970,338 1028,392 912,392" fill="#bbf7d0"/>
  <text x="970" y="377" text-anchor="middle" class="label">근사 계산으로 후보 축소</text>

  <rect x="846" y="412" width="116" height="82" rx="18" fill="#e0f2fe"/>
  <text x="904" y="438" text-anchor="middle" class="label">단위 점검</text>
  <text x="904" y="460" text-anchor="middle" class="body">천/백만</text>
  <text x="904" y="479" text-anchor="middle" class="body">%/소수</text>

  <rect x="974" y="412" width="120" height="82" rx="18" fill="#ede9fe"/>
  <text x="1034" y="438" text-anchor="middle" class="label">범위 점검</text>
  <text x="1034" y="460" text-anchor="middle" class="body">증가율 부호</text>
  <text x="1034" y="479" text-anchor="middle" class="body">현실성 확인</text>

  <rect x="846" y="512" width="248" height="62" rx="18" fill="#fef3c7"/>
  <text x="970" y="537" text-anchor="middle" class="label">오답 노트 분류</text>
  <text x="970" y="558" text-anchor="middle" class="body">식 설정 실수 / 계산 실수 / 단위 실수</text>

  <rect x="80" y="620" width="1040" height="32" rx="16" fill="#0f172a"/>
  <text x="600" y="641" text-anchor="middle" class="small" fill="#e2e8f0">실무 연결: KPI 증감률 해석 · 예산 배분 · 리포트 검산 · 데이터 QA까지 이어지는 기본 수리 루틴</text>
</svg>
