<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc">
  <title id="title">12-02. 수리 풀이 순서 인포그래픽</title>
  <desc id="desc">수리 문제에서 질문 파악부터 단위 점검, 식 설정, 근사 계산, 검산까지 이어지는 풀이 순서를 단계별로 정리한 인포그래픽</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#ecfeff"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#94a3b8" flood-opacity="0.18"/>
    </filter>
    <style>
      .title { font: 800 38px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .subtitle { font: 500 19px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
      .eyebrow { font: 700 16px 'Pretendard','Noto Sans KR',sans-serif; fill: #1d4ed8; }
      .section { font: 800 24px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .cardTitle { font: 700 18px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .body { font: 500 16px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
      .small { font: 700 14px 'Pretendard','Noto Sans KR',sans-serif; fill: #475569; }
      .stepNum { font: 800 18px 'Pretendard','Noto Sans KR',sans-serif; fill: #ffffff; }
      .whiteTitle { font: 800 24px 'Pretendard','Noto Sans KR',sans-serif; fill: #ffffff; }
      .whiteBody { font: 500 16px 'Pretendard','Noto Sans KR',sans-serif; fill: #e2e8f0; }
    </style>
  </defs>

  <rect width="1200" height="920" fill="#f8fafc"/>
  <rect x="30" y="30" width="1140" height="860" rx="32" fill="url(#bg)"/>
  <rect x="54" y="54" width="1092" height="812" rx="30" fill="#ffffff" filter="url(#shadow)"/>

  <text x="92" y="106" class="eyebrow">NCS 수리 · 문제 풀이 순서</text>
  <text x="92" y="152" class="title">12-02. 계산보다 먼저 구조를 고정한다</text>
  <text x="92" y="188" class="subtitle">질문, 단위, 필요한 값, 식, 근사, 검산 순서를 지키면 계산량이 줄고 실수도 함께 줄어든다.</text>

  <rect x="92" y="226" width="1016" height="126" rx="28" fill="url(#hero)"/>
  <text x="124" y="272" class="whiteTitle">빠른 풀이의 핵심</text>
  <text x="124" y="306" class="whiteBody">문제를 읽자마자 계산부터 시작하지 않는다. 무엇을 구하는지, 어떤 단위를 써야 하는지,</text>
  <text x="124" y="332" class="whiteBody">어느 값만 필요한지를 먼저 확정한 뒤 계산하면 시간 낭비가 크게 줄어든다.</text>

  <rect x="92" y="388" width="650" height="398" rx="28" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="124" y="434" class="section">풀이 순서 6단계</text>
  <line x1="150" y1="472" x2="150" y2="744" stroke="#93c5fd" stroke-width="6" stroke-linecap="round"/>

  <circle cx="150" cy="500" r="22" fill="#2563eb"/>
  <text x="150" y="507" text-anchor="middle" class="stepNum">1</text>
  <text x="188" y="494" class="cardTitle">질문을 한 문장으로 바꾸기</text>
  <text x="188" y="518" class="body">"증가율인가, 절대 차이인가?"처럼 요구값을 먼저 고정한다.</text>

  <circle cx="150" cy="556" r="22" fill="#0ea5e9"/>
  <text x="150" y="563" text-anchor="middle" class="stepNum">2</text>
  <text x="188" y="550" class="cardTitle">표·그래프의 축과 단위 확인</text>
  <text x="188" y="574" class="body">천/백만, %, 기준연도, 축 시작점이 0인지부터 살핀다.</text>

  <circle cx="150" cy="612" r="22" fill="#14b8a6"/>
  <text x="150" y="619" text-anchor="middle" class="stepNum">3</text>
  <text x="188" y="606" class="cardTitle">필요한 숫자만 추출</text>
  <text x="188" y="630" class="body">행·열 헤더와 주석을 읽고 지금 필요한 값만 메모한다.</text>

  <circle cx="150" cy="668" r="22" fill="#22c55e"/>
  <text x="150" y="675" text-anchor="middle" class="stepNum">4</text>
  <text x="188" y="662" class="cardTitle">식을 세우고 단순화</text>
  <text x="188" y="686" class="body">분자·분모를 정리하고 단위를 맞춘 뒤 계산을 시작한다.</text>

  <circle cx="150" cy="724" r="22" fill="#f59e0b"/>
  <text x="150" y="731" text-anchor="middle" class="stepNum">5</text>
  <text x="188" y="718" class="cardTitle">근사값으로 후보 압축</text>
  <text x="188" y="742" class="body">선택지 차이가 크면 2~3개로 먼저 줄이고 마지막만 정확 계산한다.</text>

  <circle cx="150" cy="780" r="22" fill="#ef4444"/>
  <text x="150" y="787" text-anchor="middle" class="stepNum">6</text>
  <text x="188" y="774" class="cardTitle">단위와 범위를 검산</text>
  <text x="188" y="798" class="body">증가율 부호, 단위 표기, 값의 현실성을 마지막에 다시 확인한다.</text>

  <rect x="770" y="388" width="338" height="188" rx="28" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="798" y="434" class="section">시간 절약 규칙</text>
  <text x="798" y="470" class="cardTitle">질문이 먼저, 계산은 나중</text>
  <text x="798" y="496" class="body">문제에서 묻는 값이 바뀌면 같은 표도 다른 식을 써야 한다.</text>
  <text x="798" y="532" class="cardTitle">선택지 차이를 활용</text>
  <text x="798" y="558" class="body">차이가 크면 근사 계산만으로도 오답을 빠르게 제거할 수 있다.</text>

  <rect x="770" y="598" width="338" height="188" rx="28" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="798" y="644" class="section">오답 노트 분류</text>
  <text x="798" y="680" class="cardTitle">식 설정 실수</text>
  <text x="798" y="704" class="body">질문을 잘못 읽어 분모·분자를 바꾼 경우</text>
  <text x="798" y="734" class="cardTitle">계산·단위 실수</text>
  <text x="798" y="758" class="body">반올림, %↔소수, 천↔원 변환을 놓친 경우</text>

  <rect x="92" y="810" width="1016" height="42" rx="21" fill="#0f172a"/>
  <text x="600" y="837" text-anchor="middle" class="small" fill="#e2e8f0">실무 연결: KPI 증감률 해석, 예산 비교, 리포트 검산, 데이터 QA에서 그대로 쓰는 기본 루틴</text>
</svg>
