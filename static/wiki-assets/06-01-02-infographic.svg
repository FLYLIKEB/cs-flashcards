<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="860" viewBox="0 0 1280 860" role="img" aria-labelledby="title desc">
  <title id="title">06-01-02. 스레드와 멀티스레딩 인포그래픽</title>
  <desc id="desc">하나의 프로세스 내부에서 여러 스레드가 공유 자원과 개별 스택을 사용하는 구조, 멀티스레딩의 장점, 동기화 위험을 설명하는 SVG</desc>
  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="panelBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#eef4ff"/>
    </linearGradient>
    <linearGradient id="panelGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4fff7"/>
      <stop offset="100%" stop-color="#ecfdf5"/>
    </linearGradient>
    <linearGradient id="panelRose" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff7f7"/>
      <stop offset="100%" stop-color="#fff1f2"/>
    </linearGradient>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowRose" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <style>
      text { font-family: 'Pretendard', 'Noto Sans KR', sans-serif; fill: #0f172a; }
      .eyebrow { font-size: 16px; font-weight: 700; fill: #475569; }
      .title { font-size: 36px; font-weight: 800; }
      .subtitle { font-size: 18px; font-weight: 500; fill: #334155; }
      .panelTitle { font-size: 24px; font-weight: 800; }
      .panelNote { font-size: 15px; font-weight: 600; fill: #475569; }
      .label { font-size: 18px; font-weight: 700; }
      .body { font-size: 15px; font-weight: 500; fill: #334155; }
      .small { font-size: 13px; font-weight: 700; fill: #475569; }
      .mono { font-size: 13px; font-weight: 700; fill: #1e293b; letter-spacing: 0.5px; }
    </style>
  </defs>

  <rect width="1280" height="860" fill="url(#pageBg)"/>
  <rect x="28" y="28" width="1224" height="804" rx="32" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <text x="72" y="86" class="eyebrow">운영체제 · 06-01-02</text>
  <text x="72" y="132" class="title">스레드와 멀티스레딩</text>
  <text x="72" y="168" class="subtitle">같은 프로세스는 자원을 공유하고, 각 스레드는 자기 스택으로 일을 나눠 처리한다.</text>

  <g transform="translate(64 214)">
    <rect x="0" y="0" width="660" height="560" rx="28" fill="url(#panelBlue)" stroke="#93c5fd" stroke-width="2"/>
    <text x="30" y="42" class="panelTitle">1) 한 프로세스 안의 스레드 구조</text>
    <text x="30" y="69" class="panelNote">코드·데이터·힙은 함께 쓰고, 스택과 실행 문맥은 스레드마다 따로 가진다.</text>

    <rect x="34" y="108" width="228" height="64" rx="18" fill="#dbeafe" stroke="#60a5fa"/>
    <text x="148" y="147" text-anchor="middle" class="label">공유 코드(Code)</text>

    <rect x="34" y="186" width="228" height="64" rx="18" fill="#bfdbfe" stroke="#60a5fa"/>
    <text x="148" y="225" text-anchor="middle" class="label">공유 데이터(Data)</text>

    <rect x="34" y="264" width="228" height="88" rx="18" fill="#c7d2fe" stroke="#818cf8"/>
    <text x="148" y="303" text-anchor="middle" class="label">공유 힙(Heap)</text>
    <text x="148" y="327" text-anchor="middle" class="body">객체, 버퍼, 공용 변수</text>

    <g transform="translate(316 112)">
      <rect x="0" y="0" width="98" height="256" rx="22" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
      <rect x="21" y="42" width="56" height="148" rx="12" fill="#1d4ed8" opacity="0.13"/>
      <rect x="21" y="204" width="56" height="30" rx="10" fill="#2563eb" opacity="0.24"/>
      <text x="49" y="28" text-anchor="middle" class="label">T1</text>
      <text x="49" y="122" text-anchor="middle" class="mono">STACK</text>
      <text x="49" y="222" text-anchor="middle" class="small">계산 수행</text>
    </g>

    <g transform="translate(434 112)">
      <rect x="0" y="0" width="98" height="256" rx="22" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
      <rect x="21" y="58" width="56" height="132" rx="12" fill="#7c3aed" opacity="0.12"/>
      <rect x="21" y="204" width="56" height="30" rx="10" fill="#7c3aed" opacity="0.24"/>
      <text x="49" y="28" text-anchor="middle" class="label">T2</text>
      <text x="49" y="128" text-anchor="middle" class="mono">STACK</text>
      <text x="49" y="222" text-anchor="middle" class="small">입출력 대기</text>
    </g>

    <g transform="translate(552 112)">
      <rect x="0" y="0" width="74" height="256" rx="22" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 8"/>
      <text x="37" y="28" text-anchor="middle" class="label">T3</text>
      <text x="37" y="128" text-anchor="middle" class="mono">STACK</text>
      <text x="37" y="222" text-anchor="middle" class="small">추가 작업</text>
    </g>

    <path d="M 262 140 C 286 140, 292 140, 316 140" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrowBlue)"/>
    <path d="M 262 218 C 330 218, 350 170, 434 170" fill="none" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrowBlue)"/>
    <path d="M 262 306 C 360 306, 420 240, 552 240" fill="none" stroke="#0f766e" stroke-width="3" marker-end="url(#arrowBlue)"/>

    <g transform="translate(32 408)">
      <rect x="0" y="0" width="596" height="122" rx="22" fill="#ffffff" stroke="#bfdbfe"/>
      <text x="24" y="34" class="label">왜 스레드가 가벼운가?</text>
      <text x="24" y="62" class="body">• 같은 프로세스 안이라 코드·데이터·힙을 새로 복사하지 않는다.</text>
      <text x="24" y="86" class="body">• 문맥 전환 시에도 프로세스 전체보다 바꿔야 할 정보가 적다.</text>
      <text x="24" y="110" class="body">• 대신 공유 힙을 함께 만지므로 충돌 방지가 꼭 필요하다.</text>
    </g>
  </g>

  <g transform="translate(748 214)">
    <rect x="0" y="0" width="468" height="254" rx="28" fill="url(#panelGreen)" stroke="#86efac" stroke-width="2"/>
    <text x="28" y="42" class="panelTitle">2) 멀티스레딩의 장점</text>
    <text x="28" y="69" class="panelNote">일을 나눠 응답성을 높이고, 같은 메모리 공간을 재사용해 오버헤드를 줄인다.</text>

    <g transform="translate(28 100)">
      <rect x="0" y="0" width="190" height="122" rx="18" fill="#ffffff" stroke="#bbf7d0"/>
      <text x="18" y="32" class="label">응답성 향상</text>
      <text x="18" y="58" class="body">메인 스레드는 화면·요청을 유지하고</text>
      <text x="18" y="82" class="body">긴 계산은 워커 스레드로 분리한다.</text>
      <circle cx="152" cy="74" r="22" fill="#dcfce7" stroke="#22c55e"/>
      <path d="M 152 61 L 152 74 L 164 82" fill="none" stroke="#15803d" stroke-width="4" stroke-linecap="round"/>
    </g>

    <g transform="translate(246 100)">
      <rect x="0" y="0" width="194" height="122" rx="18" fill="#ffffff" stroke="#bfdbfe"/>
      <text x="18" y="32" class="label">자원 효율</text>
      <text x="18" y="58" class="body">같은 코드와 데이터를 재사용해</text>
      <text x="18" y="82" class="body">프로세스 분리보다 메모리 낭비가 적다.</text>
      <rect x="140" y="52" width="28" height="40" rx="8" fill="#dbeafe" stroke="#2563eb"/>
      <rect x="154" y="44" width="28" height="48" rx="8" fill="#bfdbfe" stroke="#2563eb"/>
    </g>
  </g>

  <g transform="translate(748 492)">
    <rect x="0" y="0" width="468" height="282" rx="28" fill="url(#panelRose)" stroke="#fca5a5" stroke-width="2"/>
    <text x="28" y="42" class="panelTitle">3) 주의: 공유 자원 충돌</text>
    <text x="28" y="69" class="panelNote">동시에 같은 값을 읽고 쓰면 최종 결과가 예상과 달라질 수 있다.</text>

    <rect x="28" y="108" width="120" height="96" rx="18" fill="#ffffff" stroke="#fecaca"/>
    <text x="88" y="138" text-anchor="middle" class="label">Thread A</text>
    <text x="88" y="164" text-anchor="middle" class="body">count 읽기</text>
    <text x="88" y="188" text-anchor="middle" class="body">1 증가 후 저장</text>

    <rect x="174" y="102" width="120" height="108" rx="20" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
    <text x="234" y="136" text-anchor="middle" class="label">공유 변수</text>
    <text x="234" y="164" text-anchor="middle" class="mono">count = 7</text>
    <text x="234" y="188" text-anchor="middle" class="small">두 스레드가 같은 시작값을 봄</text>

    <rect x="320" y="108" width="120" height="96" rx="18" fill="#ffffff" stroke="#fecaca"/>
    <text x="380" y="138" text-anchor="middle" class="label">Thread B</text>
    <text x="380" y="164" text-anchor="middle" class="body">같은 값 읽기</text>
    <text x="380" y="188" text-anchor="middle" class="body">나중에 덮어씀</text>

    <path d="M 148 156 L 174 156" fill="none" stroke="#dc2626" stroke-width="3" marker-end="url(#arrowRose)"/>
    <path d="M 320 156 L 294 156" fill="none" stroke="#dc2626" stroke-width="3" marker-end="url(#arrowRose)"/>

    <rect x="28" y="226" width="412" height="36" rx="18" fill="#ffffff" stroke="#fdba74"/>
    <text x="234" y="249" text-anchor="middle" class="body">실행 순서가 바뀔 때마다 결과가 달라져 버그 재현과 디버깅이 어려워진다.</text>
  </g>

  <text x="72" y="808" class="panelNote">핵심: 스레드는 빠르고 효율적이지만, 공유 자원에는 락·세마포어·원자 연산 같은 동기화 전략이 따라야 한다.</text>
</svg>
