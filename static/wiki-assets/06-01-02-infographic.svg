<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">06-01-02. 스레드와 멀티스레딩 인포그래픽</title>
  <desc id="desc">하나의 프로세스 안에서 코드·데이터·힙을 공유하는 여러 스레드와, 멀티스레딩의 장점 및 동기화 위험을 설명하는 SVG</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="processFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="benefitFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dcfce7"/>
      <stop offset="100%" stop-color="#ecfeff"/>
    </linearGradient>
    <linearGradient id="riskFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fee2e2"/>
      <stop offset="100%" stop-color="#ffedd5"/>
    </linearGradient>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
    <style>
      text { font-family: 'Pretendard','Noto Sans KR',sans-serif; }
      .kicker { font-size: 15px; font-weight: 700; fill: #475569; }
      .title { font-size: 34px; font-weight: 800; fill: #0f172a; }
      .subtitle { font-size: 17px; font-weight: 500; fill: #334155; }
      .section { font-size: 22px; font-weight: 800; fill: #0f172a; }
      .label { font-size: 17px; font-weight: 700; fill: #0f172a; }
      .body { font-size: 15px; font-weight: 500; fill: #334155; }
      .small { font-size: 13px; font-weight: 600; fill: #475569; }
      .tiny { font-size: 12px; font-weight: 700; fill: #64748b; }
      .mono { font-size: 12px; font-weight: 700; fill: #1e293b; letter-spacing: 0.6px; }
    </style>
  </defs>

  <rect width="1200" height="720" fill="url(#bg)"/>
  <rect x="28" y="28" width="1144" height="664" rx="30" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <text x="72" y="82" class="kicker">운영체제 · 06-01-02</text>
  <text x="72" y="126" class="title">스레드와 멀티스레딩</text>
  <text x="72" y="160" class="subtitle">한 프로세스 안에서 자원은 공유하고, 각 스레드는 자기 스택으로 일을 나눠 처리한다.</text>

  <g transform="translate(64 198)">
    <rect x="0" y="0" width="620" height="458" rx="28" fill="url(#processFill)" stroke="#93c5fd" stroke-width="2"/>
    <text x="30" y="40" class="section">1) 프로세스 내부 구조</text>
    <text x="30" y="67" class="small">공유 영역: 코드 · 데이터 · 힙 / 개별 영역: 각 스레드의 스택</text>

    <rect x="32" y="98" width="210" height="56" rx="16" fill="#dbeafe" stroke="#60a5fa"/>
    <text x="137" y="132" text-anchor="middle" class="label">공유 코드(Code)</text>
    <rect x="32" y="166" width="210" height="56" rx="16" fill="#bfdbfe" stroke="#60a5fa"/>
    <text x="137" y="200" text-anchor="middle" class="label">공유 데이터(Data)</text>
    <rect x="32" y="234" width="210" height="72" rx="16" fill="#c7d2fe" stroke="#818cf8"/>
    <text x="137" y="269" text-anchor="middle" class="label">공유 힙(Heap)</text>
    <text x="137" y="290" text-anchor="middle" class="tiny">객체 · 버퍼 · 공용 변수</text>

    <g transform="translate(294 106)">
      <rect x="0" y="0" width="96" height="228" rx="22" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
      <rect x="20" y="28" width="56" height="138" rx="12" fill="#1d4ed8" opacity="0.12"/>
      <rect x="20" y="178" width="56" height="28" rx="10" fill="#2563eb" opacity="0.22"/>
      <text x="48" y="24" text-anchor="middle" class="label">T1</text>
      <text x="48" y="96" text-anchor="middle" class="mono">STACK</text>
      <text x="48" y="195" text-anchor="middle" class="tiny">실행 중</text>
    </g>

    <g transform="translate(410 106)">
      <rect x="0" y="0" width="96" height="228" rx="22" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/>
      <rect x="20" y="48" width="56" height="118" rx="12" fill="#7c3aed" opacity="0.12"/>
      <rect x="20" y="178" width="56" height="28" rx="10" fill="#7c3aed" opacity="0.22"/>
      <text x="48" y="24" text-anchor="middle" class="label">T2</text>
      <text x="48" y="110" text-anchor="middle" class="mono">STACK</text>
      <text x="48" y="195" text-anchor="middle" class="tiny">대기/재개</text>
    </g>

    <g transform="translate(526 106)">
      <rect x="0" y="0" width="64" height="228" rx="22" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 8"/>
      <text x="32" y="24" text-anchor="middle" class="label">T3</text>
      <text x="32" y="110" text-anchor="middle" class="mono">STACK</text>
      <text x="32" y="195" text-anchor="middle" class="tiny">추가 작업</text>
    </g>

    <path d="M 242 126 C 268 126, 268 126, 294 126" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrowBlue)"/>
    <path d="M 242 194 C 326 194, 326 154, 410 154" fill="none" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrowBlue)"/>
    <path d="M 242 270 C 362 270, 362 206, 526 206" fill="none" stroke="#0f766e" stroke-width="3" marker-end="url(#arrowBlue)"/>

    <g transform="translate(30 360)">
      <rect x="0" y="0" width="560" height="72" rx="18" fill="#eff6ff" stroke="#bfdbfe"/>
      <circle cx="36" cy="36" r="10" fill="#2563eb"/>
      <circle cx="192" cy="36" r="10" fill="#7c3aed"/>
      <circle cx="348" cy="36" r="10" fill="#0f766e"/>
      <text x="56" y="41" class="body">같은 프로세스라 생성·전환 비용이 프로세스보다 작다</text>
      <text x="212" y="41" class="body">역할을 나눠 응답성과 처리량을 높인다</text>
      <text x="368" y="41" class="body">대신 공유 힙을 함께 만져 충돌 가능성이 생긴다</text>
    </g>
  </g>

  <g transform="translate(716 198)">
    <rect x="0" y="0" width="420" height="206" rx="28" fill="url(#benefitFill)" stroke="#86efac" stroke-width="2"/>
    <text x="28" y="40" class="section">2) 멀티스레딩의 장점</text>
    <g transform="translate(26 68)">
      <rect x="0" y="0" width="174" height="108" rx="18" fill="#ffffff" stroke="#bbf7d0"/>
      <text x="18" y="30" class="label">응답성 향상</text>
      <text x="18" y="56" class="body">긴 계산은 워커 스레드로 보내고</text>
      <text x="18" y="78" class="body">메인 스레드는 요청·UI를 계속 처리</text>
      <circle cx="144" cy="74" r="20" fill="#dcfce7" stroke="#22c55e"/>
      <path d="M 144 62 L 144 74 L 155 80" fill="none" stroke="#16a34a" stroke-width="4" stroke-linecap="round"/>
    </g>
    <g transform="translate(218 68)">
      <rect x="0" y="0" width="174" height="108" rx="18" fill="#ffffff" stroke="#bfdbfe"/>
      <text x="18" y="30" class="label">자원 효율</text>
      <text x="18" y="56" class="body">코드·데이터·힙을 재사용하므로</text>
      <text x="18" y="78" class="body">프로세스 분리보다 메모리 낭비가 적다</text>
      <rect x="128" y="50" width="28" height="36" rx="8" fill="#dbeafe" stroke="#2563eb"/>
      <rect x="140" y="42" width="28" height="44" rx="8" fill="#bfdbfe" stroke="#2563eb"/>
    </g>
  </g>

  <g transform="translate(716 424)">
    <rect x="0" y="0" width="420" height="232" rx="28" fill="url(#riskFill)" stroke="#fca5a5" stroke-width="2"/>
    <text x="28" y="40" class="section">3) 주의: 동기화 문제</text>
    <text x="28" y="66" class="small">같은 변수를 동시에 읽고 쓰면 경쟁 상태와 데이터 불일치가 생긴다.</text>

    <rect x="28" y="94" width="112" height="84" rx="18" fill="#ffffff" stroke="#fecaca"/>
    <text x="84" y="122" text-anchor="middle" class="label">Thread A</text>
    <text x="84" y="146" text-anchor="middle" class="body">count 읽기</text>
    <text x="84" y="166" text-anchor="middle" class="body">+1 후 저장</text>

    <rect x="280" y="94" width="112" height="84" rx="18" fill="#ffffff" stroke="#fecaca"/>
    <text x="336" y="122" text-anchor="middle" class="label">Thread B</text>
    <text x="336" y="146" text-anchor="middle" class="body">같은 값 읽기</text>
    <text x="336" y="166" text-anchor="middle" class="body">덮어써 버림</text>

    <rect x="160" y="88" width="100" height="96" rx="20" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
    <text x="210" y="120" text-anchor="middle" class="label">공유 변수</text>
    <text x="210" y="147" text-anchor="middle" class="mono">count = 7</text>
    <text x="210" y="166" text-anchor="middle" class="tiny">둘 다 같은 값 기준으로 계산</text>

    <path d="M 140 136 L 160 136" fill="none" stroke="#dc2626" stroke-width="3" marker-end="url(#arrowRed)"/>
    <path d="M 280 136 L 260 136" fill="none" stroke="#dc2626" stroke-width="3" marker-end="url(#arrowRed)"/>

    <rect x="28" y="192" width="364" height="26" rx="13" fill="#ffffff" stroke="#fed7aa"/>
    <rect x="28" y="192" width="220" height="26" rx="13" fill="#fb7185" opacity="0.28">
      <animate attributeName="width" values="220;250;220" dur="3s" repeatCount="indefinite"/>
    </rect>
    <text x="210" y="210" text-anchor="middle" class="small">실행 순서가 매번 달라져 버그 재현·디버깅이 어렵다</text>
  </g>

  <text x="72" y="676" class="small">핵심: 스레드는 가볍고 빠르지만, 공유 자원에는 반드시 동기화 전략이 따라야 한다.</text>
</svg>
