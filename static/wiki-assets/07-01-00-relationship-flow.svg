<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
  <title id="title">07-01. 고객과 계좌 테이블 연결 예시</title>
  <desc id="desc">고객 테이블과 계좌 테이블을 분리하고 고객번호로 연결해 중복 없이 관계를 표현하는 예시</desc>
  <defs>
    <style>
      .title { font: 700 34px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .subtitle { font: 500 18px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
      .section { font: 700 22px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .label { font: 700 17px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .body { font: 500 15px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
      .small { font: 500 13px 'Pretendard','Noto Sans KR',sans-serif; fill: #475569; }
      .emph { font: 700 14px 'Pretendard','Noto Sans KR',sans-serif; fill: #115e59; }
      .warn { font: 700 14px 'Pretendard','Noto Sans KR',sans-serif; fill: #9a3412; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#0f766e" />
    </marker>
  </defs>

  <rect width="1280" height="760" fill="#f8fafc" />
  <rect x="34" y="34" width="1212" height="692" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />

  <text class="title" x="84" y="104">고객 테이블과 계좌 테이블을 왜 분리할까?</text>
  <text class="subtitle" x="84" y="140">고객정보를 계좌마다 반복 저장하지 않고, 고객번호 하나로 여러 계좌를 연결한다.</text>

  <rect x="84" y="188" width="356" height="430" rx="24" fill="#eff6ff" stroke="#93c5fd" stroke-width="2" />
  <text class="section" x="114" y="230">고객 테이블</text>
  <text class="small" x="114" y="256">고객 자체의 고정 정보만 보관</text>

  <rect x="114" y="282" width="296" height="248" rx="18" fill="#ffffff" stroke="#2563eb" stroke-width="2" />
  <rect x="114" y="282" width="296" height="44" rx="18" fill="#dbeafe" />
  <rect x="114" y="304" width="296" height="22" fill="#dbeafe" />
  <line x1="214" y1="282" x2="214" y2="530" stroke="#94a3b8" stroke-width="1.5" />
  <line x1="322" y1="282" x2="322" y2="530" stroke="#94a3b8" stroke-width="1.5" />
  <line x1="114" y1="326" x2="410" y2="326" stroke="#94a3b8" stroke-width="1.5" />
  <line x1="114" y1="390" x2="410" y2="390" stroke="#cbd5e1" stroke-width="1.5" />
  <line x1="114" y1="454" x2="410" y2="454" stroke="#cbd5e1" stroke-width="1.5" />

  <text class="label" x="164" y="312" text-anchor="middle">고객번호</text>
  <text class="label" x="268" y="312" text-anchor="middle">고객명</text>
  <text class="label" x="366" y="312" text-anchor="middle">등급</text>

  <text class="body" x="164" y="370" text-anchor="middle">C001</text>
  <text class="body" x="268" y="370" text-anchor="middle">김민수</text>
  <text class="body" x="366" y="370" text-anchor="middle">VIP</text>
  <text class="body" x="164" y="434" text-anchor="middle">C002</text>
  <text class="body" x="268" y="434" text-anchor="middle">이서연</text>
  <text class="body" x="366" y="434" text-anchor="middle">일반</text>

  <rect x="114" y="552" width="296" height="42" rx="14" fill="#dbeafe" />
  <text class="emph" x="134" y="578">PK 고객번호: 고객을 유일하게 식별</text>

  <rect x="462" y="188" width="356" height="430" rx="24" fill="#ecfeff" stroke="#67e8f9" stroke-width="2" />
  <text class="section" x="492" y="230">계좌 테이블</text>
  <text class="small" x="492" y="256">계좌별 정보와 고객번호만 저장</text>

  <rect x="492" y="282" width="296" height="312" rx="18" fill="#ffffff" stroke="#0f766e" stroke-width="2" />
  <rect x="492" y="282" width="296" height="44" rx="18" fill="#ccfbf1" />
  <rect x="492" y="304" width="296" height="22" fill="#ccfbf1" />
  <line x1="594" y1="282" x2="594" y2="594" stroke="#94a3b8" stroke-width="1.5" />
  <line x1="696" y1="282" x2="696" y2="594" stroke="#94a3b8" stroke-width="1.5" />
  <line x1="492" y1="326" x2="788" y2="326" stroke="#94a3b8" stroke-width="1.5" />
  <line x1="492" y1="390" x2="788" y2="390" stroke="#cbd5e1" stroke-width="1.5" />
  <line x1="492" y1="454" x2="788" y2="454" stroke="#cbd5e1" stroke-width="1.5" />
  <line x1="492" y1="518" x2="788" y2="518" stroke="#cbd5e1" stroke-width="1.5" />

  <text class="label" x="543" y="312" text-anchor="middle">계좌번호</text>
  <text class="label" x="645" y="312" text-anchor="middle">고객번호</text>
  <text class="label" x="742" y="312" text-anchor="middle">잔액</text>

  <text class="body" x="543" y="370" text-anchor="middle">A101</text>
  <text class="body" x="645" y="370" text-anchor="middle">C001</text>
  <text class="body" x="742" y="370" text-anchor="middle">5,000,000</text>
  <text class="body" x="543" y="434" text-anchor="middle">A107</text>
  <text class="body" x="645" y="434" text-anchor="middle">C001</text>
  <text class="body" x="742" y="434" text-anchor="middle">850,000</text>
  <text class="body" x="543" y="498" text-anchor="middle">A204</text>
  <text class="body" x="645" y="498" text-anchor="middle">C002</text>
  <text class="body" x="742" y="498" text-anchor="middle">1,200,000</text>

  <rect x="492" y="616" width="296" height="42" rx="14" fill="#ccfbf1" />
  <text class="emph" x="512" y="636">FK 고객번호:</text>
  <text class="emph" x="512" y="654">고객 테이블의 PK를 참조</text>

  <line x1="410" y1="370" x2="492" y2="370" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)" />
  <line x1="410" y1="370" x2="492" y2="434" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)" />
  <text class="emph" x="448" y="344">C001</text>
  <text class="small" x="430" y="398">한 고객이 여러 계좌를 가질 수 있음</text>

  <rect x="848" y="188" width="338" height="430" rx="24" fill="#fff7ed" stroke="#fdba74" stroke-width="2" />
  <text class="section" x="878" y="230">왜 중복을 줄일까?</text>

  <rect x="878" y="270" width="278" height="110" rx="18" fill="#ffffff" stroke="#fed7aa" stroke-width="1.5" />
  <text class="label" x="900" y="302">잘못된 저장 방식</text>
  <text class="body" x="900" y="330">계좌마다 고객명을 반복 저장하면</text>
  <text class="body" x="900" y="354">이름 변경 시 여러 행을 모두 수정해야 한다.</text>

  <rect x="878" y="404" width="278" height="176" rx="18" fill="#ffffff" stroke="#fdba74" stroke-width="1.5" />
  <text class="label" x="900" y="436">분리 후 얻는 효과</text>
  <text class="body" x="900" y="466">1. 고객정보는 고객 테이블에서</text>
  <text class="body" x="900" y="488">   한 번만 관리</text>
  <text class="body" x="900" y="516">2. 계좌는 고객번호만 저장해 연결</text>
  <text class="body" x="900" y="544">3. 중복 감소, 수정 오류 감소</text>
  <text class="body" x="900" y="566">   관계 파악 쉬움</text>
  <text class="warn" x="900" y="592">반복 저장 대신 키로 연결</text>
  <text class="warn" x="900" y="614">필요한 정보를 조합한다.</text>
</svg>
