<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">14-3. 명령어 세트 인포그래픽</title>
  <desc id="desc">ISA가 정하는 실행 계약, RISC와 CISC의 차이, SIMD와 MIMD 및 Amdahl의 법칙을 구분해 보여주는 인포그래픽</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#eef4ff"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <style>
      .title { font: 700 36px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .subtitle { font: 500 18px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
      .section { font: 700 22px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .label { font: 700 18px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .body { font: 500 16px 'Pretendard','Noto Sans KR',sans-serif; fill: #1e293b; }
      .small { font: 600 14px 'Pretendard','Noto Sans KR',sans-serif; fill: #475569; }
      .chip { font: 700 18px 'Pretendard','Noto Sans KR',sans-serif; fill: #ffffff; }
      .mono { font: 600 16px 'SFMono-Regular','Consolas','Liberation Mono',monospace; fill: #0f172a; }
    </style>
  </defs>

  <rect width="1200" height="780" fill="url(#bg)"/>
  <rect x="28" y="28" width="1144" height="724" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <text class="small" x="72" y="80">컴퓨터구조 · 하드웨어와 소프트웨어가 공유하는 실행 규칙</text>
  <text class="title" x="72" y="122">14-3. 명령어 세트(ISA)</text>
  <text class="subtitle" x="72" y="156">명령어 종류, 피연산자 위치, 예외 복귀 규칙, 병렬 실행의 확장 방식까지 묶어 정의하는 약속</text>

  <rect x="72" y="188" width="1056" height="248" rx="26" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text class="section" x="98" y="226">ISA의 의미: 소프트웨어와 하드웨어 사이의 실행 계약</text>

  <rect x="108" y="264" width="240" height="120" rx="20" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
  <text class="label" x="228" y="298" text-anchor="middle">소프트웨어 관점</text>
  <text class="body" x="132" y="328">• 컴파일러가 어떤 코드를 생성할지</text>
  <text class="body" x="132" y="354">• 운영체제가 예외 후 어떻게 복귀할지</text>

  <rect x="420" y="246" width="360" height="156" rx="24" fill="url(#band)"/>
  <text class="chip" x="600" y="292" text-anchor="middle">ISA = Instruction Set Architecture</text>
  <text class="chip" x="600" y="326" text-anchor="middle">무엇을 실행하고 어디서 읽고</text>
  <text class="chip" x="600" y="356" text-anchor="middle">어디에 저장하는지 정하는 기준</text>

  <rect x="852" y="264" width="240" height="120" rx="20" fill="#ccfbf1" stroke="#14b8a6" stroke-width="2"/>
  <text class="label" x="972" y="298" text-anchor="middle">하드웨어 관점</text>
  <text class="body" x="876" y="328">• CPU가 이해하는 명령어 형식</text>
  <text class="body" x="876" y="354">• 레지스터, 데이터 크기, 예외 규칙</text>

  <rect x="108" y="404" width="984" height="40" rx="14" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5"/>
  <text class="small" x="138" y="430">ISA가 함께 정하는 것: 가능한 연산 종류 · 피연산자 위치 · 주소 지정 방식 · 예외/인터럽트 복귀 규칙</text>

  <rect x="72" y="470" width="520" height="232" rx="26" fill="#eef2ff" stroke="#a5b4fc" stroke-width="2"/>
  <text class="section" x="98" y="508">RISC vs CISC</text>

  <rect x="104" y="534" width="220" height="138" rx="20" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
  <text class="label" x="214" y="568" text-anchor="middle">RISC</text>
  <text class="body" x="128" y="600">• 고정 길이, 단순 명령어</text>
  <text class="body" x="128" y="626">• load/store 구조로 파이프라인 친화</text>
  <text class="body" x="128" y="652">• 예: ARM, RISC-V</text>

  <rect x="340" y="534" width="220" height="138" rx="20" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
  <text class="label" x="450" y="568" text-anchor="middle">CISC</text>
  <text class="body" x="364" y="600">• 다양한 길이, 복잡한 명령어</text>
  <text class="body" x="364" y="626">• 코드 밀도와 하위 호환성 강점</text>
  <text class="body" x="364" y="652">• 예: x86 계열</text>

  <text class="small" x="104" y="692">시험 포인트: RISC는 전력 효율·파이프라인, CISC는 코드 밀도·호환성으로 비교한다.</text>

  <rect x="608" y="470" width="520" height="232" rx="26" fill="#ecfeff" stroke="#67e8f9" stroke-width="2"/>
  <text class="section" x="634" y="508">병렬 처리로 이어지는 확장 관점</text>

  <rect x="640" y="534" width="208" height="108" rx="18" fill="#ffffff" stroke="#0891b2" stroke-width="2"/>
  <text class="label" x="744" y="568" text-anchor="middle">SIMD</text>
  <text class="body" x="664" y="598">하나의 명령으로</text>
  <text class="body" x="664" y="622">여러 데이터에 같은 연산</text>

  <rect x="880" y="534" width="208" height="108" rx="18" fill="#ffffff" stroke="#0891b2" stroke-width="2"/>
  <text class="label" x="984" y="568" text-anchor="middle">MIMD</text>
  <text class="body" x="904" y="598">여러 코어가 서로 다른</text>
  <text class="body" x="904" y="622">명령과 데이터를 처리</text>

  <rect x="640" y="654" width="448" height="30" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
  <text class="mono" x="864" y="675" text-anchor="middle">Speedup = 1 / ((1 - P) + P / N)</text>
  <text class="small" x="640" y="702">Amdahl의 법칙: 병렬화되지 않는 부분이 남아 있으면 코어 수를 늘려도 속도 향상에는 상한이 생긴다.</text>
</svg>
