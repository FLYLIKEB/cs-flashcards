<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" role="img" aria-labelledby="title desc">
  <title id="title">08-02-01. 3-Way Handshake 인포그래픽</title>
  <desc id="desc">TCP 3-Way Handshake의 세 단계 흐름, 시퀀스 번호 증가, 클라이언트와 서버 상태 변화를 넓은 간격으로 보여주는 SVG</desc>
  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="cardBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <marker id="arrowBlue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#2563eb" />
    </marker>
    <marker id="arrowViolet" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#7c3aed" />
    </marker>
    <marker id="arrowTeal" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#0f766e" />
    </marker>
    <style>
      .title { font: 700 34px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .subtitle { font: 500 18px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
      .section { font: 700 22px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .body { font: 500 18px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
      .label { font: 700 18px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .mono { font: 700 17px 'SFMono-Regular','Consolas','Liberation Mono',monospace; fill: #0f172a; }
      .small { font: 600 15px 'Pretendard','Noto Sans KR',sans-serif; fill: #475569; }
      .tiny { font: 500 13px 'Pretendard','Noto Sans KR',sans-serif; fill: #64748b; }
      .pill { font: 700 16px 'Pretendard','Noto Sans KR',sans-serif; fill: #1e293b; }
    </style>
  </defs>

  <rect width="1280" height="900" fill="#e2e8f0" />
  <rect x="24" y="24" width="1232" height="852" rx="32" fill="url(#pageBg)" />
  <rect x="52" y="52" width="1176" height="796" rx="28" fill="url(#cardBg)" stroke="#cbd5e1" />

  <text x="92" y="108" class="small">TCP 연결 수립 · 시간은 위에서 아래로 흐른다</text>
  <text x="92" y="152" class="title">08-02-01. 3-Way Handshake</text>
  <text x="92" y="186" class="subtitle">SYN으로 연결을 요청하고, SYN-ACK으로 번호를 맞춘 뒤, 마지막 ACK로 양측이 ESTABLISHED 상태가 된다.</text>

  <rect x="92" y="228" width="1096" height="438" rx="28" fill="#f8fafc" stroke="#bfdbfe" />
  <text x="160" y="276" class="section">클라이언트</text>
  <text x="922" y="276" class="section">서버</text>

  <rect x="124" y="302" width="216" height="64" rx="18" fill="#dbeafe" stroke="#60a5fa" />
  <text x="232" y="342" text-anchor="middle" class="label">Client Host</text>
  <rect x="940" y="302" width="216" height="64" rx="18" fill="#e0f2fe" stroke="#38bdf8" />
  <text x="1048" y="342" text-anchor="middle" class="label">Server Host</text>

  <line x1="232" y1="382" x2="232" y2="626" stroke="#94a3b8" stroke-width="4" stroke-dasharray="10 10" />
  <line x1="1048" y1="382" x2="1048" y2="626" stroke="#94a3b8" stroke-width="4" stroke-dasharray="10 10" />

  <rect x="388" y="250" width="236" height="120" rx="20" fill="#ffffff" stroke="#cbd5e1" />
  <text x="412" y="284" class="section">클라이언트 상태</text>
  <text x="412" y="318" class="body">CLOSED</text>
  <text x="412" y="346" class="body">↓ SYN 전송</text>
  <text x="412" y="374" class="body">SYN-SENT → ESTABLISHED</text>

  <rect x="656" y="250" width="236" height="120" rx="20" fill="#ffffff" stroke="#cbd5e1" />
  <text x="680" y="284" class="section">서버 상태</text>
  <text x="680" y="318" class="body">LISTEN</text>
  <text x="680" y="346" class="body">↓ SYN 수신 후 응답</text>
  <text x="680" y="374" class="body">SYN-RECEIVED → ESTABLISHED</text>

  <rect x="112" y="402" width="88" height="40" rx="14" fill="#dbeafe" />
  <text x="156" y="428" text-anchor="middle" class="pill">1단계</text>
  <line x1="264" y1="422" x2="1016" y2="422" stroke="#2563eb" stroke-width="8" stroke-linecap="round" marker-end="url(#arrowBlue)" />
  <rect x="434" y="384" width="372" height="76" rx="18" fill="#eff6ff" stroke="#60a5fa" />
  <text x="620" y="415" text-anchor="middle" class="label">SYN</text>
  <text x="620" y="442" text-anchor="middle" class="mono">Seq = x</text>

  <rect x="112" y="492" width="88" height="40" rx="14" fill="#ede9fe" />
  <text x="156" y="518" text-anchor="middle" class="pill">2단계</text>
  <line x1="1016" y1="512" x2="264" y2="512" stroke="#7c3aed" stroke-width="8" stroke-linecap="round" marker-end="url(#arrowViolet)" />
  <rect x="394" y="474" width="452" height="76" rx="18" fill="#f5f3ff" stroke="#a78bfa" />
  <text x="620" y="505" text-anchor="middle" class="label">SYN + ACK</text>
  <text x="620" y="532" text-anchor="middle" class="mono">Seq = y   ·   ACK = x + 1</text>

  <rect x="112" y="582" width="88" height="40" rx="14" fill="#ccfbf1" />
  <text x="156" y="608" text-anchor="middle" class="pill">3단계</text>
  <line x1="264" y1="602" x2="1016" y2="602" stroke="#0f766e" stroke-width="8" stroke-linecap="round" marker-end="url(#arrowTeal)" />
  <rect x="394" y="564" width="452" height="76" rx="18" fill="#ecfeff" stroke="#2dd4bf" />
  <text x="620" y="595" text-anchor="middle" class="label">ACK</text>
  <text x="620" y="622" text-anchor="middle" class="mono">Seq = x + 1   ·   ACK = y + 1</text>

  <rect x="92" y="698" width="520" height="112" rx="22" fill="#eff6ff" stroke="#93c5fd" />
  <text x="120" y="736" class="section">ACK가 왜 +1인가?</text>
  <text x="120" y="770" class="body">SYN은 데이터가 없어도 시퀀스 번호 1을 소비한다고 본다.</text>
  <text x="120" y="798" class="mono">따라서 상대 ISN을 확인할 때 ACK = ISN + 1</text>

  <rect x="640" y="698" width="548" height="112" rx="22" fill="#f0fdf4" stroke="#86efac" />
  <text x="668" y="736" class="section">시험 포인트</text>
  <text x="668" y="770" class="body">문제는 패킷 순서, Seq·ACK 증가 규칙, 상태 전이를 함께 묻는다.</text>
  <text x="668" y="798" class="body">연결 수립은 3단계이고, 마지막 ACK 뒤부터 데이터 전송이 가능하다.</text>

  <text x="92" y="840" class="tiny">08-02-01-3-way-handshake-infographic.svg</text>
</svg>
