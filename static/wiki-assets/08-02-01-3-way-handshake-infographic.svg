<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">08-02-01. 3-Way Handshake 인포그래픽</title>
  <desc id="desc">TCP 3-Way Handshake의 3단계 패킷 흐름, Seq/ACK 규칙, 클라이언트와 서버 상태 전이를 보여주는 SVG</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#ecfeff" />
    </linearGradient>
    <linearGradient id="syn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="synack" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="ack" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f766e" />
      <stop offset="100%" stop-color="#14b8a6" />
    </linearGradient>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7c3aed" />
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e" />
    </marker>
    <style>
      .title { font: 700 34px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .subtitle { font: 500 18px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
      .section { font: 700 20px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .label { font: 700 18px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .body { font: 500 16px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
      .small { font: 600 14px 'Pretendard','Noto Sans KR',sans-serif; fill: #475569; }
      .tiny { font: 500 13px 'Pretendard','Noto Sans KR',sans-serif; fill: #64748b; }
      .mono { font: 700 15px 'SFMono-Regular','Consolas','Liberation Mono',monospace; fill: #0f172a; }
    </style>
  </defs>

  <rect width="1200" height="720" fill="#f8fafc" />
  <rect x="24" y="24" width="1152" height="672" rx="28" fill="url(#bg)" />
  <rect x="48" y="48" width="1104" height="624" rx="24" fill="#ffffff" opacity="0.96" />

  <text x="84" y="104" class="small">TCP 연결 수립 · 시간은 위에서 아래로 흐름</text>
  <text x="84" y="146" class="title">08-02-01. 3-Way Handshake</text>
  <text x="84" y="178" class="subtitle">SYN → SYN-ACK → ACK 순서로 초기 번호를 맞추고, 마지막 ACK 뒤 양측이 ESTABLISHED가 된다.</text>

  <rect x="72" y="214" width="1056" height="332" rx="24" fill="#f8fafc" stroke="#dbeafe" />
  <text x="120" y="256" class="section">클라이언트</text>
  <text x="948" y="256" class="section">서버</text>

  <rect x="96" y="272" width="170" height="52" rx="16" fill="#dbeafe" stroke="#93c5fd" />
  <text x="181" y="304" text-anchor="middle" class="label">Client Host</text>
  <rect x="934" y="272" width="170" height="52" rx="16" fill="#e0f2fe" stroke="#7dd3fc" />
  <text x="1019" y="304" text-anchor="middle" class="label">Server Host</text>

  <line x1="181" y1="334" x2="181" y2="516" stroke="#94a3b8" stroke-width="4" stroke-dasharray="10 10" />
  <line x1="1019" y1="334" x2="1019" y2="516" stroke="#94a3b8" stroke-width="4" stroke-dasharray="10 10" />

  <text x="84" y="362" class="small">1단계</text>
  <line x1="220" y1="356" x2="980" y2="356" stroke="url(#syn)" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow-blue)" />
  <rect x="446" y="324" width="308" height="64" rx="16" fill="#eff6ff" stroke="#93c5fd" />
  <text x="600" y="349" text-anchor="middle" class="label">SYN</text>
  <text x="600" y="372" text-anchor="middle" class="mono">Seq = x</text>

  <text x="84" y="434" class="small">2단계</text>
  <line x1="980" y1="428" x2="220" y2="428" stroke="url(#synack)" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow-purple)" />
  <rect x="410" y="396" width="380" height="64" rx="16" fill="#f5f3ff" stroke="#c4b5fd" />
  <text x="600" y="421" text-anchor="middle" class="label">SYN + ACK</text>
  <text x="600" y="444" text-anchor="middle" class="mono">Seq = y   ·   ACK = x+1</text>

  <text x="84" y="506" class="small">3단계</text>
  <line x1="220" y1="500" x2="980" y2="500" stroke="url(#ack)" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow-teal)" />
  <rect x="402" y="468" width="396" height="64" rx="16" fill="#ecfeff" stroke="#99f6e4" />
  <text x="600" y="493" text-anchor="middle" class="label">ACK</text>
  <text x="600" y="516" text-anchor="middle" class="mono">Seq = x+1   ·   ACK = y+1</text>

  <rect x="72" y="570" width="512" height="78" rx="20" fill="#eff6ff" stroke="#bfdbfe" />
  <text x="96" y="602" class="section">왜 ACK가 +1인가?</text>
  <text x="96" y="626" class="body">SYN 자체가 시퀀스 번호 1을 소비한다고 간주된다.</text>
  <text x="96" y="646" class="mono">따라서 ACK는 상대 ISN + 1</text>

  <rect x="612" y="570" width="516" height="78" rx="20" fill="#f0fdf4" stroke="#bbf7d0" />
  <text x="636" y="602" class="section">시험 포인트</text>
  <text x="636" y="626" class="body">연결 수립은 3단계, 종료는 보통 4단계(FIN/ACK/FIN/ACK)로 구분한다.</text>
  <text x="636" y="646" class="body">문제는 Seq·ACK 증가 규칙과 상태 전이를 자주 묻는다.</text>

  <rect x="296" y="226" width="268" height="116" rx="18" fill="#ffffff" stroke="#cbd5e1" />
  <text x="320" y="254" class="section">클라이언트 상태</text>
  <text x="320" y="282" class="body">CLOSED</text>
  <text x="320" y="306" class="body">↓ SYN 전송</text>
  <text x="320" y="330" class="body">SYN-SENT → ESTABLISHED</text>

  <rect x="636" y="226" width="268" height="116" rx="18" fill="#ffffff" stroke="#cbd5e1" />
  <text x="660" y="254" class="section">서버 상태</text>
  <text x="660" y="282" class="body">LISTEN</text>
  <text x="660" y="306" class="body">↓ SYN 수신 후 응답</text>
  <text x="660" y="330" class="body">SYN-RECEIVED → ESTABLISHED</text>

  <circle cx="181" cy="356" r="10" fill="#2563eb">
    <animate attributeName="opacity" values="1;0.35;1" dur="3s" repeatCount="indefinite" />
  </circle>
  <circle cx="1019" cy="428" r="10" fill="#7c3aed">
    <animate attributeName="opacity" values="0.35;1;0.35" dur="3s" repeatCount="indefinite" />
  </circle>
  <circle cx="181" cy="500" r="10" fill="#0f766e">
    <animate attributeName="opacity" values="0.35;0.35;1;0.35" dur="3s" repeatCount="indefinite" />
  </circle>

  <text x="84" y="688" class="tiny">08-02-01-3-way-handshake-infographic.svg</text>
</svg>
