<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">06-02-01. FCFS · SJF · HRN · RR 인포그래픽</title>
  <desc id="desc">동일한 프로세스 입력에 대해 FCFS, SJF, HRN, RR 스케줄링이 어떤 기준으로 CPU를 선택하고 어떤 간트 차트를 만드는지 비교한다.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .soft { fill: #eef2ff; stroke: #c7d2fe; stroke-width: 1.2; }
      .head { font: 700 30px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .sub { font: 500 16px 'Pretendard','Noto Sans KR',sans-serif; fill: #475569; }
      .label { font: 700 17px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .body { font: 500 14px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
      .tiny { font: 600 12px 'Pretendard','Noto Sans KR',sans-serif; fill: #475569; }
      .mono { font: 700 12px 'SFMono-Regular','Consolas','Liberation Mono',monospace; fill: #1e293b; }
      .white { fill: #ffffff; }
      .axis { stroke: #94a3b8; stroke-width: 1.2; }
      .tick { stroke: #94a3b8; stroke-width: 1; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="720" rx="28" />

  <text class="head" x="60" y="66">FCFS · SJF · HRN · RR 비교</text>
  <text class="sub" x="60" y="96">같은 입력(P1: 0/8, P2: 1/4, P3: 2/2, P4: 3/1)도 선택 기준이 달라지면 실행 순서·평균 대기시간이 달라진다.</text>

  <rect class="panel" x="40" y="120" width="270" height="250" rx="22" />
  <text class="label" x="64" y="152">공통 입력</text>
  <text class="tiny" x="64" y="176">도착시간 / 실행시간</text>

  <rect x="64" y="196" width="54" height="40" rx="12" fill="#2563eb" />
  <rect x="126" y="196" width="118" height="40" rx="12" fill="#dbeafe" />
  <text class="white" x="91" y="221" text-anchor="middle">P1</text>
  <text class="body" x="185" y="221" text-anchor="middle">arrival 0 · burst 8</text>

  <rect x="64" y="244" width="54" height="40" rx="12" fill="#14b8a6" />
  <rect x="126" y="244" width="118" height="40" rx="12" fill="#ccfbf1" />
  <text class="white" x="91" y="269" text-anchor="middle">P2</text>
  <text class="body" x="185" y="269" text-anchor="middle">arrival 1 · burst 4</text>

  <rect x="64" y="292" width="54" height="40" rx="12" fill="#f59e0b" />
  <rect x="126" y="292" width="118" height="40" rx="12" fill="#fef3c7" />
  <text class="white" x="91" y="317" text-anchor="middle">P3</text>
  <text class="body" x="185" y="317" text-anchor="middle">arrival 2 · burst 2</text>

  <rect x="64" y="340" width="54" height="40" rx="12" fill="#ef4444" />
  <rect x="126" y="340" width="118" height="40" rx="12" fill="#fee2e2" />
  <text class="white" x="91" y="365" text-anchor="middle">P4</text>
  <text class="body" x="185" y="365" text-anchor="middle">arrival 3 · burst 1</text>

  <rect class="soft" x="40" y="390" width="270" height="290" rx="22" />
  <text class="label" x="64" y="422">선택 기준 요약</text>

  <circle cx="78" cy="452" r="7" fill="#2563eb" />
  <text class="body" x="96" y="457">FCFS: 먼저 도착한 작업부터, 비선점</text>
  <circle cx="78" cy="493" r="7" fill="#7c3aed" />
  <text class="body" x="96" y="498">SJF: Ready Queue 중 실행시간이 가장 짧은 작업</text>
  <circle cx="78" cy="534" r="7" fill="#0f766e" />
  <text class="body" x="96" y="539">HRN: 응답률 (대기+실행)/실행 이 가장 큰 작업</text>
  <circle cx="78" cy="575" r="7" fill="#dc2626" />
  <text class="body" x="96" y="580">RR: quantum마다 순환, 선점</text>

  <rect x="64" y="603" width="222" height="56" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
  <text class="tiny" x="78" y="626">핵심 비교 포인트</text>
  <text class="body" x="78" y="646">FCFS 7.0 · SJF 5.5 · RR 5.0 평균 대기시간</text>
  <text class="body" x="78" y="664">HRN은 이 예제에서 SJF와 같은 순서가 나온다.</text>

  <rect class="panel" x="334" y="120" width="826" height="128" rx="22" />
  <text class="label" x="360" y="152">4개 알고리즘의 실행 순서</text>
  <text class="tiny" x="360" y="176">같은 입력이더라도 CPU를 넘기는 규칙이 바뀌면 순서가 달라진다.</text>

  <rect x="360" y="192" width="166" height="34" rx="10" fill="#dbeafe" />
  <text class="body" x="443" y="214" text-anchor="middle">FCFS: P1 → P2 → P3 → P4</text>
  <rect x="538" y="192" width="166" height="34" rx="10" fill="#ede9fe" />
  <text class="body" x="621" y="214" text-anchor="middle">SJF: P1 → P4 → P3 → P2</text>
  <rect x="716" y="192" width="166" height="34" rx="10" fill="#ccfbf1" />
  <text class="body" x="799" y="214" text-anchor="middle">HRN: P1 → P4 → P3 → P2</text>
  <rect x="894" y="192" width="240" height="34" rx="10" fill="#fee2e2" />
  <text class="body" x="1014" y="214" text-anchor="middle">RR(q=2): P1 → P2 → P3 → P1 → P4 → P2 → P1</text>

  <rect class="panel" x="334" y="266" width="826" height="184" rx="22" />
  <text class="label" x="360" y="298">간트 차트 비교</text>
  <text class="tiny" x="360" y="322">폭은 실행시간 비례, RR은 q=2로 잘라 반복한다.</text>

  <text class="body" x="360" y="356">FCFS</text>
  <line class="axis" x1="432" y1="352" x2="1092" y2="352" />
  <rect x="432" y="336" width="352" height="32" rx="8" fill="#2563eb" />
  <rect x="784" y="336" width="176" height="32" rx="8" fill="#14b8a6" />
  <rect x="960" y="336" width="88" height="32" rx="8" fill="#f59e0b" />
  <rect x="1048" y="336" width="44" height="32" rx="8" fill="#ef4444" />
  <text class="white" x="608" y="357" text-anchor="middle">P1</text>
  <text class="white" x="872" y="357" text-anchor="middle">P2</text>
  <text class="white" x="1004" y="357" text-anchor="middle">P3</text>
  <text class="white" x="1070" y="357" text-anchor="middle">P4</text>

  <text class="body" x="360" y="406">SJF</text>
  <line class="axis" x1="432" y1="402" x2="1092" y2="402" />
  <rect x="432" y="386" width="352" height="32" rx="8" fill="#2563eb" />
  <rect x="784" y="386" width="44" height="32" rx="8" fill="#ef4444" />
  <rect x="828" y="386" width="88" height="32" rx="8" fill="#f59e0b" />
  <rect x="916" y="386" width="176" height="32" rx="8" fill="#14b8a6" />
  <text class="white" x="608" y="407" text-anchor="middle">P1</text>
  <text class="white" x="806" y="407" text-anchor="middle">P4</text>
  <text class="white" x="872" y="407" text-anchor="middle">P3</text>
  <text class="white" x="1004" y="407" text-anchor="middle">P2</text>

  <text class="body" x="360" y="439">HRN</text>
  <text class="tiny" x="431" y="439">t=8 응답률: P2 2.75, P3 4.00, P4 6.00 → P4 선택</text>

  <g transform="translate(334 468)">
    <rect class="panel" x="0" y="0" width="400" height="212" rx="22" />
    <text class="label" x="26" y="32">HRN 계산 메모</text>
    <rect x="24" y="50" width="352" height="56" rx="14" fill="#ecfeff" stroke="#99f6e4" stroke-width="1.2" />
    <text class="mono" x="40" y="74">Response Ratio = (Waiting + Service) / Service</text>
    <text class="mono" x="40" y="93">= 1 + Waiting / Service</text>
    <rect x="24" y="122" width="108" height="60" rx="14" fill="#ccfbf1" />
    <text class="body" x="78" y="148" text-anchor="middle">P2</text>
    <text class="mono" x="78" y="168" text-anchor="middle">(7+4)/4 = 2.75</text>
    <rect x="146" y="122" width="108" height="60" rx="14" fill="#dbeafe" />
    <text class="body" x="200" y="148" text-anchor="middle">P3</text>
    <text class="mono" x="200" y="168" text-anchor="middle">(6+2)/2 = 4.00</text>
    <rect x="268" y="122" width="108" height="60" rx="14" fill="#fee2e2" />
    <text class="body" x="322" y="148" text-anchor="middle">P4</text>
    <text class="mono" x="322" y="168" text-anchor="middle">(5+1)/1 = 6.00</text>
    <text class="tiny" x="26" y="198">대기시간이 길수록 점수가 올라가 SJF의 기아를 완화한다.</text>
  </g>

  <g transform="translate(752 468)">
    <rect class="panel" x="0" y="0" width="408" height="212" rx="22" />
    <text class="label" x="26" y="32">RR(q=2) Ready Queue 순환</text>
    <text class="tiny" x="26" y="54">각 quantum이 끝나면 미완료 작업은 큐 뒤로 이동한다.</text>

    <circle cx="76" cy="118" r="32" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
    <circle cx="182" cy="118" r="32" fill="#ccfbf1" stroke="#14b8a6" stroke-width="2" />
    <circle cx="288" cy="118" r="32" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" />
    <circle cx="182" cy="176" r="32" fill="#fee2e2" stroke="#ef4444" stroke-width="2" />

    <text class="body" x="76" y="123" text-anchor="middle">P1</text>
    <text class="body" x="182" y="123" text-anchor="middle">P2</text>
    <text class="body" x="288" y="123" text-anchor="middle">P3</text>
    <text class="body" x="182" y="181" text-anchor="middle">P4</text>

    <path d="M108 118 H150" fill="none" stroke="#64748b" stroke-width="2.4" stroke-linecap="round" />
    <path d="M214 118 H256" fill="none" stroke="#64748b" stroke-width="2.4" stroke-linecap="round" />
    <path d="M284 145 C280 168 246 186 214 183" fill="none" stroke="#64748b" stroke-width="2.4" stroke-linecap="round" />
    <path d="M150 183 C118 186 84 168 80 145" fill="none" stroke="#64748b" stroke-width="2.4" stroke-linecap="round" />

    <text class="mono" x="26" y="204">0-2 P1 | 2-4 P2 | 4-6 P3 | 6-8 P1 | 8-9 P4 | 9-11 P2 | 11-15 P1</text>
  </g>

  <g transform="translate(432 448)">
    <line class="tick" x1="0" y1="0" x2="0" y2="-126" />
    <line class="tick" x1="352" y1="0" x2="352" y2="-126" />
    <line class="tick" x1="396" y1="0" x2="396" y2="-76" />
    <line class="tick" x1="484" y1="0" x2="484" y2="-126" />
    <line class="tick" x1="660" y1="0" x2="660" y2="-126" />
    <text class="tiny" x="0" y="18" text-anchor="middle">0</text>
    <text class="tiny" x="352" y="18" text-anchor="middle">8</text>
    <text class="tiny" x="396" y="18" text-anchor="middle">9</text>
    <text class="tiny" x="484" y="18" text-anchor="middle">11</text>
    <text class="tiny" x="660" y="18" text-anchor="middle">15</text>
  </g>

  <text class="tiny" x="60" y="704">06-02-01-fcfs-sjf-hrn-rr-infographic.svg · page-specific scheduler comparison</text>
</svg>
