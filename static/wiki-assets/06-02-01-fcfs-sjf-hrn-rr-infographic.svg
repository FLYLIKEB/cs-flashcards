<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc">
  <title id="title">06-02-01. FCFS · SJF · HRN · RR 핵심 비교</title>
  <desc id="desc">FCFS, SJF, HRN, RR 스케줄링의 선택 기준, 실행 순서, 평균 대기시간을 높은 대비의 카드형 배치로 비교한다.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.6; }
      .soft { fill: #eff6ff; stroke: #bfdbfe; stroke-width: 1.2; }
      .soft-green { fill: #ecfeff; stroke: #99f6e4; stroke-width: 1.2; }
      .soft-amber { fill: #fffbeb; stroke: #fde68a; stroke-width: 1.2; }
      .soft-rose { fill: #fff1f2; stroke: #fda4af; stroke-width: 1.2; }
      .title { font: 700 34px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .subtitle { font: 500 18px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
      .section { font: 700 22px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .label { font: 700 19px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .body { font: 500 16px 'Pretendard','Noto Sans KR',sans-serif; fill: #1e293b; }
      .small { font: 500 14px 'Pretendard','Noto Sans KR',sans-serif; fill: #475569; }
      .mono { font: 700 15px 'SFMono-Regular','Consolas','Liberation Mono',monospace; fill: #0f172a; }
      .white { fill: #ffffff; }
      .muted { fill: #64748b; }
      .chip { font: 700 14px 'Pretendard','Noto Sans KR',sans-serif; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="840" rx="28" />

  <text class="title" x="56" y="68">FCFS · SJF · HRN · RR 핵심 비교</text>
  <text class="subtitle" x="56" y="102">같은 입력(P1 0/8, P2 1/4, P3 2/2, P4 3/1)이라도 선택 기준이 달라지면 실행 순서와 대기시간이 달라진다.</text>

  <rect class="panel" x="40" y="132" width="300" height="202" rx="22" />
  <text class="section" x="64" y="168">공통 입력</text>
  <text class="small" x="64" y="194">도착시간 / 실행시간</text>
  <rect x="64" y="214" width="62" height="36" rx="10" fill="#2563eb" />
  <text class="body white" x="95" y="237" text-anchor="middle">P1</text>
  <text class="body" x="144" y="237">arrival 0 · burst 8</text>
  <rect x="64" y="258" width="62" height="36" rx="10" fill="#0f766e" />
  <text class="body white" x="95" y="281" text-anchor="middle">P2</text>
  <text class="body" x="144" y="281">arrival 1 · burst 4</text>
  <rect x="64" y="302" width="62" height="36" rx="10" fill="#d97706" />
  <text class="body white" x="95" y="325" text-anchor="middle">P3</text>
  <text class="body" x="144" y="325">arrival 2 · burst 2</text>
  <rect x="64" y="346" width="62" height="36" rx="10" fill="#dc2626" />
  <text class="body white" x="95" y="369" text-anchor="middle">P4</text>
  <text class="body" x="144" y="369">arrival 3 · burst 1</text>

  <rect class="panel" x="360" y="132" width="800" height="202" rx="22" />
  <text class="section" x="384" y="168">선택 기준과 성격</text>
  <text class="small" x="384" y="194">암기 포인트를 문장 대신 짧은 기준으로 나눠 배치했다.</text>

  <rect class="soft" x="384" y="216" width="176" height="94" rx="18" />
  <text class="label" x="404" y="244">FCFS</text>
  <text class="chip" x="498" y="244" text-anchor="end" fill="#1d4ed8">비선점</text>
  <text class="body" x="404" y="270">먼저 도착한 작업부터 처리</text>
  <text class="small" x="404" y="294">장점: 단순, 구현 쉬움</text>

  <rect class="panel" x="580" y="216" width="176" height="94" rx="18" fill="#f5f3ff" />
  <text class="label" x="600" y="244">SJF</text>
  <text class="chip" x="694" y="244" text-anchor="end" fill="#6d28d9">비선점</text>
  <text class="body" x="600" y="270">현재 큐에서 가장 짧은 작업</text>
  <text class="small" x="600" y="294">장점: 평균 대기시간 감소</text>

  <rect class="soft-green" x="776" y="216" width="176" height="94" rx="18" />
  <text class="label" x="796" y="244">HRN</text>
  <text class="chip" x="890" y="244" text-anchor="end" fill="#0f766e">비선점</text>
  <text class="body" x="796" y="270">응답률이 가장 큰 작업 선택</text>
  <text class="small" x="796" y="294">기아 완화: 기다릴수록 점수 상승</text>

  <rect class="soft-rose" x="972" y="216" width="164" height="94" rx="18" />
  <text class="label" x="992" y="244">RR</text>
  <text class="chip" x="1116" y="244" text-anchor="end" fill="#b91c1c">선점</text>
  <text class="body" x="992" y="270">time quantum마다 순환</text>
  <text class="small" x="992" y="294">응답성↑, 문맥교환 비용↑</text>

  <rect class="panel" x="40" y="360" width="1120" height="226" rx="22" />
  <text class="section" x="64" y="396">실행 순서와 평균 대기시간</text>
  <text class="small" x="64" y="422">이 예제에서는 HRN과 SJF의 최종 순서가 같지만, 선택 근거는 다르다.</text>

  <rect x="64" y="448" width="242" height="108" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2" />
  <text class="label" x="86" y="478">FCFS</text>
  <text class="mono" x="86" y="506">P1 → P2 → P3 → P4</text>
  <text class="body" x="86" y="534">평균 대기시간 7.0</text>

  <rect x="328" y="448" width="242" height="108" rx="18" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.2" />
  <text class="label" x="350" y="478">SJF</text>
  <text class="mono" x="350" y="506">P1 → P4 → P3 → P2</text>
  <text class="body" x="350" y="534">평균 대기시간 5.5</text>

  <rect x="592" y="448" width="242" height="108" rx="18" fill="#ecfeff" stroke="#99f6e4" stroke-width="1.2" />
  <text class="label" x="614" y="478">HRN</text>
  <text class="mono" x="614" y="506">P1 → P4 → P3 → P2</text>
  <text class="body" x="614" y="534">평균 대기시간 5.5</text>

  <rect x="856" y="448" width="280" height="108" rx="18" fill="#fff1f2" stroke="#fda4af" stroke-width="1.2" />
  <text class="label" x="878" y="478">RR (q=2)</text>
  <text class="mono" x="878" y="506">P1 → P2 → P3 → P1</text>
  <text class="mono" x="878" y="528">→ P4 → P2 → P1</text>
  <text class="body" x="878" y="550">평균 대기시간 5.0</text>

  <rect class="panel" x="40" y="610" width="540" height="186" rx="22" />
  <text class="section" x="64" y="646">HRN 계산 기억법</text>
  <rect class="soft-green" x="64" y="664" width="492" height="52" rx="14" />
  <text class="mono" x="88" y="696">응답률 = (대기시간 + 실행시간) / 실행시간</text>
  <text class="small" x="64" y="742">t=8에서 P2=2.75, P3=4.00, P4=6.00 이므로 P4가 먼저 선택된다.</text>
  <text class="small" x="64" y="766">즉, 오래 기다린 작업의 우선순위를 올려 SJF의 기아 문제를 완화한다.</text>

  <rect class="panel" x="604" y="610" width="556" height="186" rx="22" />
  <text class="section" x="628" y="646">시험장에서 바로 보는 체크 포인트</text>
  <text class="body" x="628" y="680">• FCFS: 도착 순서 그대로, Convoy Effect 주의</text>
  <text class="body" x="628" y="712">• SJF: 그 시점에 Ready Queue에 있는 후보만 비교</text>
  <text class="body" x="628" y="744">• HRN: 선택 시점마다 응답률을 다시 계산</text>
  <text class="body" x="628" y="776">• RR: quantum 종료 시 재삽입 순서와 남은 시간 기록</text>

  <text class="small muted" x="56" y="822">06-02-01-fcfs-sjf-hrn-rr-infographic.svg · readable overview for this page only</text>
</svg>
