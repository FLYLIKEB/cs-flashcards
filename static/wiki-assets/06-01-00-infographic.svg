<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc">
  <title id="title">06-01 프로세스와 스레드 비교 인포그래픽</title>
  <desc id="desc">프로세스와 스레드의 차이, 공유 자원과 개별 자원, PCB와 IPC의 역할을 읽기 쉽게 비교한 SVG 인포그래픽</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="procGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>
    <linearGradient id="threadGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#5b21b6" />
    </linearGradient>
    <style>
      .title { font: 700 34px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .subtitle { font: 500 17px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
      .section { font: 700 24px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .cardTitle { font: 700 20px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .label { font: 700 17px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .body { font: 500 15px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
      .small { font: 600 13px 'Pretendard','Noto Sans KR',sans-serif; fill: #475569; }
      .tiny { font: 600 12px 'Pretendard','Noto Sans KR',sans-serif; fill: #64748b; }
      .light { fill: #ffffff; }
      .center { text-anchor: middle; }
    </style>
  </defs>

  <rect width="1200" height="860" fill="url(#bg)" />
  <rect x="28" y="28" width="1144" height="804" rx="30" fill="#ffffff" stroke="#dbeafe" stroke-width="2" />

  <text class="small" x="72" y="76">운영체제 핵심 비교 · process vs thread</text>
  <text class="title" x="72" y="118">06-01. 프로세스와 스레드</text>
  <text class="subtitle" x="72" y="152">프로세스는 실행 중인 프로그램과 자원의 묶음이고, 스레드는 그 안에서 CPU 작업을 나누어 수행하는 실행 흐름이다.</text>

  <rect x="60" y="190" width="520" height="370" rx="28" fill="#eff6ff" stroke="#93c5fd" stroke-width="2" />
  <rect x="620" y="190" width="520" height="370" rx="28" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2" />

  <rect x="84" y="214" width="184" height="44" rx="22" fill="url(#procGrad)" />
  <text class="label light center" x="176" y="242">프로세스 = 자원 단위</text>
  <text class="section" x="84" y="294">독립 주소 공간을 가진다</text>
  <text class="body" x="84" y="322">프로세스마다 메모리, 열린 파일, PID, 상태 정보가 따로 관리되어 다른 프로세스와 기본적으로 격리된다.</text>

  <rect x="84" y="348" width="300" height="176" rx="22" fill="#ffffff" stroke="#60a5fa" stroke-width="2" />
  <text class="cardTitle" x="108" y="378">프로세스 주소 공간</text>
  <rect x="108" y="394" width="252" height="32" rx="14" fill="#dbeafe" />
  <text class="body center" x="234" y="415">Code</text>
  <rect x="108" y="434" width="252" height="32" rx="14" fill="#bfdbfe" />
  <text class="body center" x="234" y="455">Data</text>
  <rect x="108" y="474" width="252" height="32" rx="14" fill="#93c5fd" />
  <text class="body center" x="234" y="495">Heap / Stack</text>

  <rect x="404" y="348" width="152" height="176" rx="22" fill="#ffffff" stroke="#3b82f6" stroke-width="2" />
  <text class="cardTitle center" x="480" y="378">PCB</text>
  <text class="small center" x="480" y="410">상태</text>
  <text class="small center" x="480" y="436">PID</text>
  <text class="small center" x="480" y="462">PC / 레지스터</text>
  <text class="small center" x="480" y="488">스케줄링 정보</text>
  <text class="tiny center" x="480" y="510">문맥을 저장해 다시 실행한다</text>

  <rect x="644" y="214" width="200" height="44" rx="22" fill="url(#threadGrad)" />
  <text class="label light center" x="744" y="242">스레드 = 실행 흐름 단위</text>
  <text class="section" x="644" y="294">한 프로세스 안에서 분업한다</text>
  <text class="body" x="644" y="322">여러 스레드는 코드·데이터·힙을 공유하지만, 각 스레드는 자신만의 스택과 PC·레지스터를 가진다.</text>

  <rect x="644" y="348" width="472" height="120" rx="22" fill="#ffffff" stroke="#8b5cf6" stroke-width="2" />
  <text class="cardTitle" x="668" y="378">스레드가 함께 쓰는 자원</text>
  <rect x="668" y="394" width="424" height="28" rx="14" fill="#ede9fe" />
  <text class="body center" x="880" y="413">Code</text>
  <rect x="668" y="430" width="424" height="28" rx="14" fill="#ddd6fe" />
  <text class="body center" x="880" y="449">Data / Heap / 열린 파일</text>

  <rect x="670" y="488" width="132" height="90" rx="18" fill="#ffffff" stroke="#7c3aed" stroke-width="2" />
  <text class="label center" x="736" y="518">Thread A</text>
  <text class="small center" x="736" y="545">개별 Stack</text>
  <text class="small center" x="736" y="568">PC / Register</text>

  <rect x="814" y="488" width="132" height="90" rx="18" fill="#ffffff" stroke="#7c3aed" stroke-width="2" />
  <text class="label center" x="880" y="518">Thread B</text>
  <text class="small center" x="880" y="545">개별 Stack</text>
  <text class="small center" x="880" y="568">PC / Register</text>

  <rect x="958" y="488" width="132" height="90" rx="18" fill="#ffffff" stroke="#7c3aed" stroke-width="2" />
  <text class="label center" x="1024" y="518">Thread C</text>
  <text class="small center" x="1024" y="545">개별 Stack</text>
  <text class="small center" x="1024" y="568">PC / Register</text>

  <rect x="60" y="586" width="1080" height="94" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" />
  <text class="cardTitle" x="84" y="620">빠른 비교</text>
  <text class="body" x="84" y="648">프로세스: 생성·전환 비용이 크지만 격리가 강하다</text>
  <text class="body" x="590" y="648">스레드: 생성·전환 비용이 작고 협업이 쉽지만 동기화가 필요하다</text>

  <rect x="60" y="704" width="520" height="92" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" />
  <text class="cardTitle" x="84" y="736">PCB가 중요한 이유</text>
  <text class="body" x="84" y="762">프로세스가 잠시 멈춰도 PCB에 저장된 상태, 프로그램 카운터, 레지스터 값으로 나중에 다시 이어서 실행할 수 있다.</text>

  <rect x="620" y="704" width="520" height="92" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" />
  <text class="cardTitle" x="644" y="736">프로세스 간 통신 IPC</text>
  <text class="body" x="644" y="762">프로세스끼리는 기본 메모리를 공유하지 않으므로 Pipe, Message Queue, Shared Memory, Socket 같은 통신 수단을 사용한다.</text>
  <text class="small" x="644" y="786">주소 공간은 분리되고, 통신은 운영체제가 중개하거나 공유 영역을 통해 이뤄진다.</text>
</svg>
