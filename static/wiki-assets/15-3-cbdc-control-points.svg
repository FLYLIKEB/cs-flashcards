<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">15-3. CBDC 설계 선택과 통제 포인트</title>
  <desc id="desc">CBDC의 계좌형과 토큰형 비교, 핵심 설계 트레이드오프, 운영 통제 체크포인트를 분리해 보여주는 SVG</desc>
  <defs>
    <style>
      text { font-family: 'Pretendard', 'Noto Sans KR', sans-serif; fill: #0f172a; }
      .title { font-size: 34px; font-weight: 800; }
      .subtitle { font-size: 17px; font-weight: 500; fill: #dbeafe; }
      .section { font-size: 23px; font-weight: 800; }
      .label { font-size: 18px; font-weight: 700; }
      .body { font-size: 15px; font-weight: 500; fill: #334155; }
      .small { font-size: 13px; font-weight: 700; fill: #475569; letter-spacing: 0.2px; }
      .white { fill: #ffffff; }
      .mutedWhite { fill: #dbeafe; }
      .center { text-anchor: middle; }
    </style>
  </defs>

  <rect width="1200" height="820" fill="#f8fafc"/>
  <rect x="28" y="28" width="1144" height="764" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <rect x="56" y="52" width="1088" height="118" rx="26" fill="#1e3a8a"/>
  <text x="88" y="94" class="small white">핵심 개념 보강 · 설계 선택 + 정책 통제</text>
  <text x="88" y="132" class="title white">CBDC 설계 선택과 통제 포인트</text>
  <text x="88" y="158" class="subtitle">계좌형과 토큰형을 혼동하지 말고, 설계 트레이드오프와 운영 통제를 함께 묶어 답하면 면접 설명력이 높아집니다.</text>

  <rect x="72" y="200" width="346" height="544" rx="24" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="98" y="238" class="section">형태 구분</text>

  <rect x="96" y="264" width="298" height="190" rx="20" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text x="120" y="294" class="small">ACCOUNT-BASED</text>
  <text x="120" y="322" class="label">중앙원장에 계좌와 잔액이 기록</text>
  <text x="120" y="350" class="body">• 신원확인(KYC)과 계정 관리가 핵심</text>
  <text x="120" y="376" class="body">• 감사추적과 규제준수 설계가 상대적으로 용이</text>
  <text x="120" y="402" class="body">• 다만 프라이버시 기대치가 높으면 설명 부담 증가</text>

  <rect x="96" y="478" width="298" height="190" rx="20" fill="#ecfeff" stroke="#14b8a6" stroke-width="2"/>
  <text x="120" y="508" class="small">TOKEN-BASED</text>
  <text x="120" y="536" class="label">토큰의 유효성과 소유권으로 결제</text>
  <text x="120" y="564" class="body">• 단말 간 이전, 오프라인 결제 시나리오에 유리</text>
  <text x="120" y="590" class="body">• 프라이버시 설계 여지가 있지만 분실·복제 통제가 중요</text>
  <text x="120" y="616" class="body">• 실무에서는 계좌형과 섞인 하이브리드가 흔함</text>

  <rect x="442" y="200" width="330" height="544" rx="24" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="468" y="238" class="section">설계 트레이드오프</text>

  <rect x="468" y="272" width="278" height="92" rx="18" fill="#fef2f2" stroke="#f87171"/>
  <text x="492" y="302" class="label">익명성 ↔ AML/CFT 준수</text>
  <text x="492" y="328" class="body">소액 익명성 범위와 규제 로그 보존 범위를 같이 정해야 함</text>

  <rect x="468" y="386" width="278" height="92" rx="18" fill="#fff7ed" stroke="#fb923c"/>
  <text x="492" y="416" class="label">중앙 통제 ↔ 분산 탄력성</text>
  <text x="492" y="442" class="body">운영 책임은 명확해지지만 장애 복원력과 분산 설계도 필요</text>

  <rect x="468" y="500" width="278" height="92" rx="18" fill="#eef2ff" stroke="#818cf8"/>
  <text x="492" y="530" class="label">최종결제성 ↔ 확장성</text>
  <text x="492" y="556" class="body">실시간 확정성과 대량 처리량을 동시에 만족시키는 구조가 관건</text>

  <rect x="468" y="614" width="278" height="92" rx="18" fill="#ecfdf5" stroke="#34d399"/>
  <text x="492" y="644" class="label">민간 중개 유지 ↔ 공적 화폐 직접 제공</text>
  <text x="492" y="670" class="body">은행 역할을 남길지, 중앙은행 접점을 넓힐지 정책 선택이 필요</text>

  <rect x="796" y="200" width="332" height="544" rx="24" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="822" y="238" class="section">운영·위험 관리 체크</text>

  <rect x="822" y="268" width="280" height="102" rx="18" fill="#ffffff" stroke="#94a3b8"/>
  <text x="846" y="298" class="small">CONTROL A</text>
  <text x="846" y="326" class="label">최종결제성과 유동성 관리</text>
  <text x="846" y="352" class="body">도매 결제 finality, 담보 운용, 중앙은행 유동성 공급 절차</text>

  <rect x="822" y="394" width="280" height="102" rx="18" fill="#ffffff" stroke="#94a3b8"/>
  <text x="846" y="424" class="small">CONTROL B</text>
  <text x="846" y="452" class="label">복구·비상대응 시나리오</text>
  <text x="846" y="478" class="body">백업, 오프라인 모드, 재동기화, 정상화 순서를 사전에 정의</text>

  <rect x="822" y="520" width="280" height="102" rx="18" fill="#ffffff" stroke="#94a3b8"/>
  <text x="846" y="550" class="small">CONTROL C</text>
  <text x="846" y="578" class="label">연동·감사추적·보상체계</text>
  <text x="846" y="604" class="body">API 정합성, 로그 보관기간, 민간 서비스 유인 구조를 점검</text>

  <rect x="822" y="646" width="280" height="72" rx="18" fill="#0f172a"/>
  <text x="962" y="676" class="small white center">면접 한 줄 요약</text>
  <text x="962" y="700" class="body mutedWhite center">“형태·트레이드오프·통제 포인트를 세트로 설명한다.”</text>
</svg>
