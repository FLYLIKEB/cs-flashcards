<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">08-03. HTTP-DNS-TLS 인포그래픽</title>
  <desc id="desc">브라우저가 URL을 입력받아 DNS로 IP를 찾고 TLS로 신뢰와 키를 합의한 뒤 HTTP 요청과 응답을 주고받는 과정을 설명하는 인포그래픽</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="55%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#ecfeff"/>
    </linearGradient>
    <linearGradient id="dnsGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="tlsGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dcfce7"/>
      <stop offset="100%" stop-color="#bbf7d0"/>
    </linearGradient>
    <linearGradient id="httpGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#059669"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#d97706"/>
    </marker>
    <style>
      .title { font: 700 32px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .subtitle { font: 500 16px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
      .section { font: 700 22px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .label { font: 700 16px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .body { font: 500 14px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
      .tiny { font: 600 12px 'Pretendard','Noto Sans KR',sans-serif; fill: #475569; }
      .mono { font: 600 13px 'SFMono-Regular','Consolas','Liberation Mono',monospace; fill: #1e293b; }
    </style>
  </defs>

  <rect width="1200" height="720" fill="url(#bg)"/>
  <rect x="28" y="28" width="1144" height="664" rx="28" fill="#ffffff" stroke="#cbd5e1"/>

  <text class="tiny" x="74" y="78">웹 통신은 ① 이름 해석(DNS) → ② 신뢰/암호화(TLS) → ③ 메시지 교환(HTTP) 순서로 이어진다</text>
  <text class="title" x="74" y="116">08-03. HTTP · DNS · TLS</text>
  <text class="subtitle" x="74" y="146">URL 입력부터 HTTPS 응답 수신까지, 각 프로토콜이 맡는 역할을 한 화면에 정리</text>

  <rect x="70" y="188" width="220" height="450" rx="26" fill="#f8fafc" stroke="#cbd5e1"/>
  <text class="section" x="104" y="230">브라우저</text>
  <rect x="100" y="254" width="160" height="42" rx="12" fill="#e2e8f0"/>
  <circle cx="118" cy="275" r="5" fill="#ef4444"/>
  <circle cx="134" cy="275" r="5" fill="#f59e0b"/>
  <circle cx="150" cy="275" r="5" fill="#22c55e"/>
  <rect x="112" y="320" width="136" height="56" rx="16" fill="#ffffff" stroke="#94a3b8"/>
  <text class="label" x="180" y="344" text-anchor="middle">URL 입력</text>
  <text class="mono" x="180" y="365" text-anchor="middle">https://example.com</text>
  <rect x="112" y="398" width="136" height="76" rx="16" fill="#ffffff" stroke="#94a3b8"/>
  <text class="label" x="180" y="423" text-anchor="middle">Stub resolver</text>
  <text class="body" x="180" y="445" text-anchor="middle">도메인 질의 시작</text>
  <text class="tiny" x="180" y="463" text-anchor="middle">캐시 hit면 즉시 종료</text>
  <rect x="112" y="496" width="136" height="110" rx="16" fill="#ffffff" stroke="#94a3b8"/>
  <text class="label" x="180" y="521" text-anchor="middle">HTTPS 클라이언트</text>
  <text class="body" x="180" y="544" text-anchor="middle">SNI · ALPN 전송</text>
  <text class="body" x="180" y="566" text-anchor="middle">HTTP 요청 생성</text>
  <text class="mono" x="180" y="590" text-anchor="middle">GET /index.html</text>

  <rect x="320" y="188" width="360" height="215" rx="26" fill="url(#dnsGrad)" stroke="#93c5fd"/>
  <text class="section" x="352" y="228">1. DNS: 이름을 IP로 바꾸기</text>
  <text class="tiny" x="352" y="250">stub resolver → recursive resolver → root → TLD → authoritative</text>
  <rect x="350" y="278" width="92" height="56" rx="14" fill="#ffffff" stroke="#60a5fa"/>
  <text class="label" x="396" y="301" text-anchor="middle">Recursive</text>
  <text class="body" x="396" y="320" text-anchor="middle">캐시 확인</text>
  <rect x="468" y="278" width="72" height="56" rx="14" fill="#ffffff" stroke="#60a5fa"/>
  <text class="label" x="504" y="301" text-anchor="middle">Root</text>
  <text class="body" x="504" y="320" text-anchor="middle">.com 안내</text>
  <rect x="562" y="278" width="72" height="56" rx="14" fill="#ffffff" stroke="#60a5fa"/>
  <text class="label" x="598" y="301" text-anchor="middle">TLD</text>
  <text class="body" x="598" y="320" text-anchor="middle">NS 안내</text>
  <rect x="468" y="350" width="166" height="56" rx="14" fill="#ffffff" stroke="#60a5fa"/>
  <text class="label" x="551" y="373" text-anchor="middle">Authoritative NS</text>
  <text class="body" x="551" y="392" text-anchor="middle">A/AAAA, CNAME, MX, TXT</text>
  <line x1="442" y1="306" x2="468" y2="306" stroke="#2563eb" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <line x1="540" y1="306" x2="562" y2="306" stroke="#2563eb" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <line x1="598" y1="334" x2="566" y2="350" stroke="#2563eb" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <line x1="468" y1="378" x2="442" y2="378" stroke="#2563eb" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <text class="body" x="352" y="362">반복 조회로 정답을 모은 뒤</text>
  <text class="body" x="352" y="382">example.com → 93.184.216.34 반환</text>
  <rect x="350" y="346" width="92" height="46" rx="12" fill="#dbeafe" stroke="#60a5fa"/>
  <text class="label" x="396" y="365" text-anchor="middle">TTL</text>
  <text class="tiny" x="396" y="381" text-anchor="middle">캐시 유지시간</text>

  <rect x="320" y="425" width="360" height="213" rx="26" fill="url(#tlsGrad)" stroke="#86efac"/>
  <text class="section" x="352" y="465">2. TLS: 신뢰 확인 + 세션 키 합의</text>
  <text class="tiny" x="352" y="487">공개키 기반 인증서 검증 후, 대칭키로 실제 데이터 암호화</text>
  <path d="M500 538 L500 508 C500 487 517 470 540 470 C563 470 580 487 580 508 L580 538" fill="none" stroke="#059669" stroke-width="12" stroke-linecap="round"/>
  <path d="M486 538 H594 V602 H486 Z" fill="#ffffff" stroke="#10b981" stroke-width="3"/>
  <circle cx="540" cy="566" r="16" fill="#dcfce7" stroke="#059669" stroke-width="3"/>
  <path d="M540 582 V594" fill="none" stroke="#059669" stroke-width="4" stroke-linecap="round"/>
  <rect x="352" y="514" width="120" height="92" rx="16" fill="#ffffff" stroke="#86efac"/>
  <text class="label" x="412" y="539" text-anchor="middle">ClientHello</text>
  <text class="tiny" x="412" y="558" text-anchor="middle">SNI</text>
  <text class="tiny" x="412" y="575" text-anchor="middle">ALPN: h2, http/1.1</text>
  <rect x="608" y="514" width="120" height="92" rx="16" fill="#ffffff" stroke="#86efac"/>
  <text class="label" x="668" y="539" text-anchor="middle">ServerHello</text>
  <text class="tiny" x="668" y="558" text-anchor="middle">인증서 체인</text>
  <text class="tiny" x="668" y="575" text-anchor="middle">ECDHE · Finished</text>
  <line x1="472" y1="548" x2="486" y2="548" stroke="#059669" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <line x1="594" y1="548" x2="608" y2="548" stroke="#059669" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <text class="body" x="540" y="623" text-anchor="middle">인증서 체인 검증 + Forward Secrecy 세션 키 생성</text>

  <rect x="710" y="188" width="420" height="450" rx="26" fill="url(#httpGrad)" stroke="#fcd34d"/>
  <text class="section" x="742" y="228">3. HTTP: 요청/응답 규칙</text>
  <text class="tiny" x="742" y="250">TLS 안에서 애플리케이션 메시지를 주고받으며 상태 코드·헤더·캐시 정책이 적용된다</text>

  <rect x="742" y="282" width="160" height="120" rx="18" fill="#ffffff" stroke="#f59e0b"/>
  <text class="label" x="822" y="307" text-anchor="middle">요청 메시지</text>
  <text class="mono" x="756" y="333">GET /index.html</text>
  <text class="mono" x="756" y="354">Host: example.com</text>
  <text class="mono" x="756" y="375">If-None-Match: "v3"</text>

  <rect x="938" y="282" width="160" height="120" rx="18" fill="#ffffff" stroke="#f59e0b"/>
  <text class="label" x="1018" y="307" text-anchor="middle">응답 메시지</text>
  <text class="mono" x="952" y="333">HTTP/1.1 200 OK</text>
  <text class="mono" x="952" y="354">ETag: "v3"</text>
  <text class="mono" x="952" y="375">Content-Length: 1254</text>

  <line x1="902" y1="342" x2="938" y2="342" stroke="#d97706" stroke-width="4" marker-end="url(#arrowAmber)"/>
  <line x1="938" y1="366" x2="902" y2="366" stroke="#d97706" stroke-width="4" marker-end="url(#arrowAmber)"/>
  <text class="tiny" x="920" y="333" text-anchor="middle">request</text>
  <text class="tiny" x="920" y="389" text-anchor="middle">response</text>

  <rect x="742" y="430" width="164" height="80" rx="16" fill="#fff7ed" stroke="#fdba74"/>
  <text class="label" x="824" y="455" text-anchor="middle">메서드</text>
  <text class="body" x="824" y="478" text-anchor="middle">GET · POST · PUT</text>
  <text class="body" x="824" y="498" text-anchor="middle">PATCH · DELETE</text>

  <rect x="930" y="430" width="168" height="80" rx="16" fill="#fff7ed" stroke="#fdba74"/>
  <text class="label" x="1014" y="455" text-anchor="middle">상태 코드</text>
  <text class="body" x="1014" y="478" text-anchor="middle">2xx 성공 · 3xx 이동</text>
  <text class="body" x="1014" y="498" text-anchor="middle">4xx 요청 오류 · 5xx 서버 오류</text>

  <rect x="742" y="530" width="356" height="82" rx="16" fill="#ffffff" stroke="#fdba74"/>
  <text class="label" x="920" y="555" text-anchor="middle">버전과 성능 포인트</text>
  <text class="body" x="920" y="578" text-anchor="middle">HTTP/1.1 keep-alive · HTTP/2 multiplexing + HPACK</text>
  <text class="body" x="920" y="598" text-anchor="middle">HTTP/3는 QUIC(UDP) 기반으로 연결 재개와 HOL 완화를 노린다</text>

  <line x1="248" y1="348" x2="350" y2="306" stroke="#2563eb" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <line x1="680" y1="532" x2="742" y2="342" stroke="#059669" stroke-width="4" marker-end="url(#arrowGreen)"/>
  <line x1="1098" y1="342" x2="1114" y2="342" stroke="#d97706" stroke-width="4"/>
  <rect x="1020" y="318" width="76" height="48" rx="12" fill="#ffffff" stroke="#f59e0b"/>
  <text class="label" x="1058" y="338" text-anchor="middle">서버</text>
  <text class="tiny" x="1058" y="355" text-anchor="middle">443/TCP</text>

  <text class="tiny" x="74" y="672">핵심 기억: DNS는 위치를 찾고, TLS는 상대를 믿고 비밀을 만든 뒤, HTTP는 그 위에서 요청과 응답을 교환한다.</text>
</svg>
