<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc">
  <title id="title">08-03. HTTP DNS TLS overview infographic</title>
  <desc id="desc">브라우저가 URL을 입력한 뒤 DNS 조회로 IP를 찾고 TLS 핸드셰이크로 신뢰와 세션 키를 만든 다음 HTTP 요청과 응답을 주고받는 전체 흐름을 단계별 카드로 설명하는 인포그래픽</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .dns { fill: #eff6ff; stroke: #60a5fa; stroke-width: 2; }
      .tls { fill: #ecfdf5; stroke: #34d399; stroke-width: 2; }
      .http { fill: #fff7ed; stroke: #fb923c; stroke-width: 2; }
      .browser { fill: #f8fafc; stroke: #94a3b8; stroke-width: 2; }
      .title { font: 700 34px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .subtitle { font: 500 17px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
      .section { font: 700 24px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .label { font: 700 18px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .body { font: 500 16px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
      .tiny { font: 600 14px 'Pretendard','Noto Sans KR',sans-serif; fill: #475569; }
      .mono { font: 600 15px 'SFMono-Regular','Consolas','Liberation Mono',monospace; fill: #1e293b; }
      .num { font: 700 18px 'Pretendard','Noto Sans KR',sans-serif; fill: #ffffff; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#475569"/>
    </marker>
  </defs>

  <rect class="bg" width="1200" height="920"/>
  <rect x="28" y="28" width="1144" height="864" rx="28" class="panel"/>

  <text class="title" x="72" y="92">08-03. HTTP · DNS · TLS</text>
  <text class="subtitle" x="72" y="126">웹 브라우저가 주소를 해석하고, 안전한 연결을 만들고, 실제 데이터를 주고받는 흐름을 한 장에 정리</text>

  <rect x="72" y="162" width="1056" height="118" rx="22" class="browser"/>
  <circle cx="116" cy="220" r="22" fill="#0f172a"/>
  <text class="num" x="116" y="226" text-anchor="middle">0</text>
  <text class="section" x="156" y="205">브라우저 출발점</text>
  <text class="body" x="156" y="236">사용자가 URL을 입력하면 브라우저는 먼저 도메인 이름을 IP 주소로 바꿀지 확인한다.</text>
  <text class="mono" x="156" y="262">https://example.com/products?id=7</text>

  <rect x="72" y="318" width="1056" height="172" rx="24" class="dns"/>
  <circle cx="116" cy="376" r="22" fill="#2563eb"/>
  <text class="num" x="116" y="382" text-anchor="middle">1</text>
  <text class="section" x="156" y="362">DNS: 이름을 IP 주소로 변환</text>
  <text class="body" x="156" y="392">stub resolver가 recursive resolver에 질의하고, 필요하면 root → TLD → authoritative 순서로 답을 모은다.</text>
  <rect x="156" y="418" width="182" height="46" rx="14" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
  <text class="label" x="247" y="447" text-anchor="middle">stub resolver</text>
  <rect x="362" y="418" width="182" height="46" rx="14" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
  <text class="label" x="453" y="447" text-anchor="middle">recursive resolver</text>
  <rect x="568" y="418" width="120" height="46" rx="14" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
  <text class="label" x="628" y="447" text-anchor="middle">root</text>
  <rect x="712" y="418" width="120" height="46" rx="14" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
  <text class="label" x="772" y="447" text-anchor="middle">TLD</text>
  <rect x="856" y="418" width="198" height="46" rx="14" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
  <text class="label" x="955" y="447" text-anchor="middle">authoritative NS</text>
  <line x1="338" y1="441" x2="362" y2="441" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="544" y1="441" x2="568" y2="441" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="688" y1="441" x2="712" y2="441" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="832" y1="441" x2="856" y2="441" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <text class="tiny" x="156" y="480">결과 예시: example.com → 93.184.216.34, TTL 동안 캐시에 저장</text>

  <rect x="72" y="528" width="1056" height="162" rx="24" class="tls"/>
  <circle cx="116" cy="586" r="22" fill="#059669"/>
  <text class="num" x="116" y="592" text-anchor="middle">2</text>
  <text class="section" x="156" y="572">TLS: 서버를 검증하고 세션 키를 합의</text>
  <text class="body" x="156" y="602">ClientHello와 ServerHello, 인증서 체인 검증, ECDHE 키 교환을 거쳐 대칭키를 만든 뒤 암호화 통신을 시작한다.</text>
  <rect x="156" y="626" width="220" height="40" rx="12" fill="#ffffff" stroke="#34d399" stroke-width="2"/>
  <text class="tiny" x="266" y="651" text-anchor="middle">ClientHello: SNI, ALPN, cipher suites</text>
  <rect x="400" y="626" width="220" height="40" rx="12" fill="#ffffff" stroke="#34d399" stroke-width="2"/>
  <text class="tiny" x="510" y="651" text-anchor="middle">ServerHello + certificate chain</text>
  <rect x="644" y="626" width="190" height="40" rx="12" fill="#ffffff" stroke="#34d399" stroke-width="2"/>
  <text class="tiny" x="739" y="651" text-anchor="middle">ECDHE key agreement</text>
  <rect x="858" y="626" width="196" height="40" rx="12" fill="#ffffff" stroke="#34d399" stroke-width="2"/>
  <text class="tiny" x="956" y="651" text-anchor="middle">Finished → encrypted channel</text>

  <rect x="72" y="728" width="1056" height="126" rx="24" class="http"/>
  <circle cx="116" cy="786" r="22" fill="#ea580c"/>
  <text class="num" x="116" y="792" text-anchor="middle">3</text>
  <text class="section" x="156" y="772">HTTP: 요청과 응답 메시지 교환</text>
  <text class="body" x="156" y="802">암호화된 TLS 채널 위에서 GET/POST 같은 요청을 보내고, 상태 코드·헤더·본문이 포함된 응답을 받는다.</text>
  <text class="mono" x="156" y="832">GET /index.html   →   200 OK   /   ETag, Cache-Control, Content-Length</text>

  <text class="tiny" x="72" y="884">핵심 기억: DNS는 위치를 찾고, TLS는 신뢰와 비밀키를 만들고, HTTP는 그 위에서 웹 메시지를 교환한다.</text>
</svg>
