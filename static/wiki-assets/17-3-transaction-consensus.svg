<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">17-3. 분산 트랜잭션과 합의 패턴 비교</title>
  <desc id="desc">2PC, Saga, Consensus의 처리 흐름과 장단점, 사용 시점을 비교하는 인포그래픽</desc>
  <defs>
    <style>
      text { font-family: 'Pretendard', 'Noto Sans KR', sans-serif; fill: #0f172a; }
      .eyebrow { font-size: 15px; font-weight: 700; letter-spacing: 0.08em; fill: #475569; }
      .title { font-size: 34px; font-weight: 800; }
      .subtitle { font-size: 18px; font-weight: 500; fill: #334155; }
      .section { font-size: 21px; font-weight: 800; }
      .label { font-size: 18px; font-weight: 700; }
      .body { font-size: 15px; font-weight: 500; fill: #334155; }
      .small { font-size: 13px; font-weight: 600; fill: #475569; }
    </style>
  </defs>

  <rect width="1200" height="760" fill="#f8fafc"/>
  <rect x="28" y="28" width="1144" height="704" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <text x="72" y="82" class="eyebrow">TRANSACTION / CONSENSUS PATTERNS</text>
  <text x="72" y="122" class="title">2PC · Saga · Consensus 비교</text>
  <text x="72" y="156" class="subtitle">원자 커밋이 필요한가, 최종 일관성이 허용되는가, 복제 상태를 누가 확정하는가를 나눠서 본다.</text>

  <g transform="translate(64 196)">
    <rect width="504" height="244" rx="24" fill="#eef2ff" stroke="#818cf8" stroke-width="2"/>
    <text x="28" y="40" class="section">1) 2PC: 모두 준비되면 한 번에 commit</text>

    <rect x="30" y="78" width="92" height="52" rx="14" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
    <rect x="176" y="78" width="92" height="52" rx="14" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
    <rect x="322" y="78" width="92" height="52" rx="14" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
    <text x="76" y="110" text-anchor="middle" class="label">Coord</text>
    <text x="222" y="110" text-anchor="middle" class="label">P1</text>
    <text x="368" y="110" text-anchor="middle" class="label">P2</text>

    <line x1="122" y1="104" x2="176" y2="104" stroke="#4f46e5" stroke-width="3"/>
    <line x1="268" y1="104" x2="322" y2="104" stroke="#4f46e5" stroke-width="3"/>
    <text x="149" y="92" text-anchor="middle" class="small">prepare</text>
    <text x="295" y="92" text-anchor="middle" class="small">ready / commit</text>
    <text x="28" y="168" class="body">• 장점: 강한 원자성, 커밋 여부가 명확하다.</text>
    <text x="28" y="194" class="body">• 한계: coordinator 장애나 느린 참여자 때문에 blocking과 지연이 커질 수 있다.</text>
    <text x="28" y="220" class="body">• 적합: 강한 정합성이 필수이고 참여자 수가 제한된 핵심 거래.</text>
  </g>

  <g transform="translate(632 196)">
    <rect width="504" height="244" rx="24" fill="#ecfeff" stroke="#06b6d4" stroke-width="2"/>
    <text x="28" y="40" class="section">2) Saga: 로컬 트랜잭션을 연결하고 실패하면 보상</text>

    <rect x="30" y="78" width="90" height="52" rx="14" fill="#ffffff" stroke="#0891b2" stroke-width="2"/>
    <rect x="154" y="78" width="90" height="52" rx="14" fill="#ffffff" stroke="#0891b2" stroke-width="2"/>
    <rect x="278" y="78" width="90" height="52" rx="14" fill="#ffffff" stroke="#0891b2" stroke-width="2"/>
    <rect x="402" y="78" width="72" height="52" rx="14" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>
    <text x="75" y="110" text-anchor="middle" class="label">T1</text>
    <text x="199" y="110" text-anchor="middle" class="label">T2</text>
    <text x="323" y="110" text-anchor="middle" class="label">T3</text>
    <text x="438" y="110" text-anchor="middle" class="label">보상</text>

    <line x1="120" y1="104" x2="154" y2="104" stroke="#0891b2" stroke-width="3"/>
    <line x1="244" y1="104" x2="278" y2="104" stroke="#0891b2" stroke-width="3"/>
    <line x1="368" y1="104" x2="402" y2="104" stroke="#ef4444" stroke-width="3" stroke-dasharray="8 6"/>
    <text x="385" y="92" text-anchor="middle" class="small">failure → compensate</text>

    <text x="28" y="168" class="body">• 장점: 느슨한 결합, 높은 처리량, 비동기 파이프라인과 잘 맞는다.</text>
    <text x="28" y="194" class="body">• 한계: 일시적 불일치가 생기며 보상 로직과 리컨실리에이션이 필수다.</text>
    <text x="28" y="220" class="body">• 적합: 정산, 알림, 분석처럼 최종 일관성을 허용할 수 있는 업무.</text>
  </g>

  <g transform="translate(64 476)">
    <rect width="1072" height="208" rx="24" fill="#fefce8" stroke="#eab308" stroke-width="2"/>
    <text x="28" y="40" class="section">3) Consensus: 여러 복제본이 어떤 값이 정답인지 합의한다</text>

    <rect x="30" y="72" width="170" height="74" rx="16" fill="#ffffff" stroke="#ca8a04" stroke-width="2"/>
    <rect x="246" y="72" width="170" height="74" rx="16" fill="#ffffff" stroke="#ca8a04" stroke-width="2"/>
    <rect x="462" y="72" width="170" height="74" rx="16" fill="#ffffff" stroke="#ca8a04" stroke-width="2"/>
    <text x="115" y="102" text-anchor="middle" class="label">Leader 선출</text>
    <text x="115" y="124" text-anchor="middle" class="body">누가 로그를 제안할지 결정</text>
    <text x="331" y="102" text-anchor="middle" class="label">복제 + ack</text>
    <text x="331" y="124" text-anchor="middle" class="body">과반수 응답으로 안전성 확보</text>
    <text x="547" y="102" text-anchor="middle" class="label">commit 확정</text>
    <text x="547" y="124" text-anchor="middle" class="body">같은 순서로 상태를 적용</text>

    <line x1="200" y1="108" x2="246" y2="108" stroke="#ca8a04" stroke-width="3"/>
    <line x1="416" y1="108" x2="462" y2="108" stroke="#ca8a04" stroke-width="3"/>

    <text x="692" y="94" class="label">언제 쓰나?</text>
    <text x="692" y="122" class="body">• 원장 상태 자체를 여러 노드에 안전하게 복제해야 할 때</text>
    <text x="692" y="148" class="body">• 2PC처럼 한 거래의 원자 커밋을 맞추는 문제와는 결이 다르다</text>
    <text x="692" y="174" class="body">• Saga처럼 업무 단위를 나누는 패턴과도 별개로 상태 복제의 기준점을 준다</text>
  </g>
</svg>
