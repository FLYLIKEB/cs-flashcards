  <text class="small" x="84" y="86">금융공기업 IT · 페이지 맞춤 SVG</text>
  <text class="title" x="84" y="118" text-anchor="start"><tspan x="84" dy="0">15-1. 핀테크 오픈뱅킹 마이데이터</tspan></text>
  <text class="subtitle" x="84" y="180" text-anchor="start"><tspan x="84" dy="0">오픈뱅킹은 은행별로 분산된 계좌 조회 이체 기능을 표준 API로 제공해 핀테크와</tspan><tspan x="84" dy="24">금융기관이 연결되도록 하는 인프라입니다. 사용자는 하나의 서비스에서 여러 금융기관</tspan></text>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ca8a04"/></marker></defs><rect x="90" y="290" width="180" height="130" rx="22" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/><text class="label" x="180" y="324" text-anchor="middle"><tspan x="180" dy="0">고객 동의</tspan></text><text class="body" x="108" y="360" text-anchor="start"></text><line x1="270" y1="355" x2="300" y2="355" stroke="#ca8a04" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="270" y1="355" x2="300" y2="355" stroke="#ca8a04" stroke-width="2" stroke-linecap="round" stroke-dasharray="10 8" opacity="0.5"><animate attributeName="stroke-dashoffset" from="0" to="-72" dur="4s" repeatCount="indefinite"/></line><rect x="300" y="290" width="180" height="130" rx="22" fill="#fefce8" stroke="#0f766e" stroke-width="2"/><text class="label" x="390" y="324" text-anchor="middle"><tspan x="390" dy="0">API 호출</tspan></text><text class="body" x="318" y="360" text-anchor="start"></text><line x1="480" y1="355" x2="510" y2="355" stroke="#ca8a04" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="480" y1="355" x2="510" y2="355" stroke="#ca8a04" stroke-width="2" stroke-linecap="round" stroke-dasharray="10 8" opacity="0.5"><animate attributeName="stroke-dashoffset" from="0" to="-72" dur="4s" repeatCount="indefinite"/></line><rect x="510" y="290" width="180" height="130" rx="22" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/><text class="label" x="600" y="324" text-anchor="middle"><tspan x="600" dy="0">계좌 조회</tspan></text><text class="body" x="528" y="360" text-anchor="start"></text><line x1="690" y1="355" x2="720" y2="355" stroke="#ca8a04" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="690" y1="355" x2="720" y2="355" stroke="#ca8a04" stroke-width="2" stroke-linecap="round" stroke-dasharray="10 8" opacity="0.5"><animate attributeName="stroke-dashoffset" from="0" to="-72" dur="4s" repeatCount="indefinite"/></line><rect x="720" y="290" width="180" height="130" rx="22" fill="#fefce8" stroke="#0f766e" stroke-width="2"/><text class="label" x="810" y="324" text-anchor="middle"><tspan x="810" dy="0">데이터 결합</tspan></text><text class="body" x="738" y="360" text-anchor="start"></text><line x1="900" y1="355" x2="930" y2="355" stroke="#ca8a04" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="900" y1="355" x2="930" y2="355" stroke="#ca8a04" stroke-width="2" stroke-linecap="round" stroke-dasharray="10 8" opacity="0.5"><animate attributeName="stroke-dashoffset" from="0" to="-72" dur="4s" repeatCount="indefinite"/></line><rect x="930" y="290" width="180" height="130" rx="22" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/><text class="label" x="1020" y="324" text-anchor="middle"><tspan x="1020" dy="0">서비스</tspan></text><text class="body" x="948" y="360" text-anchor="start"></text><rect x="90" y="510" width="1020" height="92" rx="26" fill="#ffffff" stroke="#0f766e" stroke-width="2"/><text class="body" x="600" y="558" text-anchor="middle"><tspan x="600" dy="0">검증 기록 감사 추적 장애 대응</tspan></text><line x1="90" y1="463" x2="1110" y2="463" stroke="#ca8a04" stroke-width="2" stroke-dasharray="10 8" opacity="0.4"><animate attributeName="stroke-dashoffset" from="0" to="-70" dur="4s" repeatCount="indefinite"/></line>
