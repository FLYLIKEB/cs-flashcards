<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">15-1. 오픈뱅킹과 핀테크 연결 구조</title>
  <desc id="desc">사용자 동의, 인증 인가, API 게이트웨이, 금융기관 API, 핀테크 서비스 사이의 오픈뱅킹 데이터 흐름을 설명하는 SVG</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fbff" />
      <stop offset="100%" stop-color="#eef8ff" />
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#155e75" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#0369a1" />
    </marker>
    <style>
      text { font-family: 'Pretendard','Noto Sans KR',sans-serif; }
      .eyebrow { font-size: 16px; font-weight: 700; fill: #cbd5e1; }
      .title { font-size: 34px; font-weight: 800; fill: #f8fafc; }
      .subtitle { font-size: 18px; font-weight: 500; fill: #e2e8f0; }
      .section { font-size: 24px; font-weight: 800; fill: #0f172a; }
      .cardTitle { font-size: 21px; font-weight: 800; fill: #0f172a; }
      .cardBody { font-size: 16px; font-weight: 500; fill: #334155; }
      .small { font-size: 15px; font-weight: 600; fill: #475569; }
      .flowLabel { font-size: 15px; font-weight: 800; fill: #0f172a; }
      .pillText { font-size: 14px; font-weight: 700; fill: #0f172a; }
      .summaryLabel { font-size: 17px; font-weight: 800; fill: #0f172a; }
      .summaryBody { font-size: 15px; font-weight: 500; fill: #334155; }
    </style>
  </defs>

  <rect width="1200" height="820" fill="url(#bg)" />
  <rect x="30" y="28" width="1140" height="764" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />

  <rect x="58" y="52" width="1084" height="126" rx="24" fill="url(#hero)" />
  <text class="eyebrow" x="84" y="87">금융공기업 IT · 15-1 페이지 전용 개념도</text>
  <text class="title" x="84" y="126">오픈뱅킹에서 핀테크가 연결되는 방식</text>
  <text class="subtitle" x="84" y="156">핵심은 사용자의 명시적 동의, OAuth2 토큰, 표준 API, 공통 보안 통제를 한 흐름으로 묶는 것이다.</text>

  <text class="section" x="88" y="224">1. 참여 주체와 요청 흐름</text>
  <rect x="74" y="246" width="1052" height="316" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />

  <rect x="104" y="286" width="176" height="194" rx="22" fill="#ecfeff" stroke="#0891b2" stroke-width="2.5" />
  <circle cx="192" cy="334" r="28" fill="#99f6e4" />
  <circle cx="192" cy="324" r="10" fill="#0f766e" />
  <path d="M166 366 C174 344,210 344,218 366" fill="#0f766e" />
  <text class="cardTitle" x="192" y="407" text-anchor="middle">사용자</text>
  <text class="cardBody" x="192" y="433" text-anchor="middle">여러 은행 계좌 조회와</text>
  <text class="cardBody" x="192" y="456" text-anchor="middle">이체 범위를 직접 동의</text>

  <rect x="328" y="286" width="206" height="194" rx="22" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5" />
  <rect x="372" y="312" width="118" height="40" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5" />
  <text class="pillText" x="431" y="338" text-anchor="middle">동의 + 본인인증</text>
  <text class="cardTitle" x="431" y="407" text-anchor="middle">인증 · 인가 서버</text>
  <text class="cardBody" x="431" y="433" text-anchor="middle">authorization code 확인 후</text>
  <text class="cardBody" x="431" y="456" text-anchor="middle">access token 발급</text>

  <rect x="582" y="286" width="206" height="194" rx="22" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5" />
  <rect x="628" y="312" width="114" height="48" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5" />
  <path d="M648 328 H722 M648 340 H722 M648 352 H706" stroke="#2563eb" stroke-width="4" stroke-linecap="round" />
  <text class="cardTitle" x="685" y="407" text-anchor="middle">API Gateway</text>
  <text class="cardBody" x="685" y="433" text-anchor="middle">인증 확인, 라우팅, 호출량 제한,</text>
  <text class="cardBody" x="685" y="456" text-anchor="middle">장애 격리와 공통 로깅 수행</text>

  <rect x="836" y="286" width="248" height="194" rx="22" fill="#fefce8" stroke="#d97706" stroke-width="2.5" />
  <rect x="872" y="314" width="176" height="34" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="1.5" />
  <text class="pillText" x="960" y="336" text-anchor="middle">/accounts · /balances · /transfers</text>
  <text class="cardTitle" x="960" y="407" text-anchor="middle">은행 · 금융기관 API</text>
  <text class="cardBody" x="960" y="433" text-anchor="middle">표준 전문 형식으로 응답하고</text>
  <text class="cardBody" x="960" y="456" text-anchor="middle">기관별 내부 계정을 안전하게 처리</text>

  <line x1="280" y1="382" x2="328" y2="382" stroke="#0ea5e9" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)" />
  <line x1="534" y1="382" x2="582" y2="382" stroke="#0ea5e9" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)" />
  <line x1="788" y1="382" x2="836" y2="382" stroke="#0ea5e9" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)" />
  <text class="flowLabel" x="304" y="364" text-anchor="middle">동의 요청</text>
  <text class="flowLabel" x="558" y="364" text-anchor="middle">토큰 전달</text>
  <text class="flowLabel" x="812" y="364" text-anchor="middle">표준 API 호출</text>

  <path d="M960 504 V532 H986" fill="none" stroke="#7c3aed" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)" />
  <rect x="998" y="506" width="116" height="52" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2" />
  <text class="cardTitle" x="1056" y="538" text-anchor="middle" font-size="18">핀테크 서비스</text>
  <text class="small" x="1056" y="557" text-anchor="middle">한 화면에서 다기관 조회</text>

  <text class="section" x="88" y="616">2. 면접에서 강조할 운영 포인트</text>
  <rect x="74" y="636" width="1052" height="118" rx="24" fill="#eef6ff" stroke="#bfdbfe" stroke-width="1.5" />

  <rect x="96" y="658" width="242" height="74" rx="16" fill="#ffffff" stroke="#93c5fd" />
  <text class="summaryLabel" x="120" y="688">표준화</text>
  <text class="summaryBody" x="120" y="711">응답 코드, 날짜·금액 형식, 재시도 정책을 기관마다 맞춘다.</text>

  <rect x="354" y="658" width="242" height="74" rx="16" fill="#ffffff" stroke="#93c5fd" />
  <text class="summaryLabel" x="378" y="688">토큰 수명주기</text>
  <text class="summaryBody" x="378" y="711">만료, 재발급, 재동의를 분리해 과도한 권한을 막는다.</text>

  <rect x="612" y="658" width="242" height="74" rx="16" fill="#ffffff" stroke="#93c5fd" />
  <text class="summaryLabel" x="636" y="688">감사 가능성</text>
  <text class="summaryBody" x="636" y="711">누가 어떤 scope로 호출했는지 추적 가능해야 한다.</text>

  <rect x="870" y="658" width="232" height="74" rx="16" fill="#ffffff" stroke="#93c5fd" />
  <text class="summaryLabel" x="894" y="688">보안 통제</text>
  <text class="summaryBody" x="894" y="711">TLS, 이상 호출 탐지, 장애 대응을 운영 절차에 넣는다.</text>
</svg>
