<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">13-04 코드 추적표 작성법</title>
  <desc id="desc">코드 출력 문제에서 스코프와 값 복사를 분리해 추적표를 채우는 방법을 단계별로 보여주는 SVG</desc>
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <style>
      text { font-family: "Noto Sans KR", "Apple SD Gothic Neo", sans-serif; }
      .title { font-size: 32px; font-weight: 800; fill: #f8fafc; }
      .subtitle { font-size: 16px; font-weight: 500; fill: #dbeafe; }
      .section { font-size: 22px; font-weight: 800; fill: #0f172a; }
      .label { font-size: 16px; font-weight: 700; fill: #0f172a; }
      .body { font-size: 15px; font-weight: 500; fill: #334155; }
      .mono { font-family: "SFMono-Regular", Consolas, monospace; font-size: 15px; font-weight: 600; fill: #e2e8f0; }
      .monoDark { font-family: "SFMono-Regular", Consolas, monospace; font-size: 15px; font-weight: 600; fill: #0f172a; }
    </style>
  </defs>

  <rect width="1200" height="720" fill="#f8fafc" />
  <rect x="30" y="28" width="1140" height="664" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
  <rect x="30" y="28" width="1140" height="110" rx="28" fill="url(#header)" />
  <rect x="30" y="98" width="1140" height="40" fill="url(#header)" />

  <text class="title" x="68" y="80">코드 추적표 작성법</text>
  <text class="subtitle" x="68" y="112">같은 이름의 전역/지역 변수와 값 복사 인자를 한 표에서 분리해서 적는다.</text>

  <rect x="68" y="170" width="416" height="180" rx="18" fill="#0f172a" />
  <text x="92" y="204" font-size="22" font-weight="800" fill="#f8fafc">예제 코드</text>
  <text class="mono" x="92" y="238">int x = 1;</text>
  <text class="mono" x="92" y="268">void f(int a) { a++; x += a; }</text>
  <text class="mono" x="92" y="298">int main() {</text>
  <text class="mono" x="112" y="328">int x = 3; f(x); printf("%d", x);</text>
  <text class="mono" x="92" y="358">}</text>

  <rect x="510" y="170" width="590" height="180" rx="18" fill="#f8fafc" stroke="#cbd5e1" />
  <text class="section" x="536" y="206">표를 그릴 때 칸을 먼저 정한다</text>
  <text class="body" x="536" y="238">1) line: 지금 어느 줄을 실행하는지 적는다.</text>
  <text class="body" x="536" y="268">2) local x / a: 현재 함수 안에서 보이는 값만 적는다.</text>
  <text class="body" x="536" y="298">3) global x: 전역처럼 별도 저장소를 따로 적는다.</text>
  <text class="body" x="536" y="328">4) output: 실제로 화면에 찍히는 순간만 기록한다.</text>

  <rect x="68" y="386" width="1032" height="248" rx="18" fill="#f8fafc" stroke="#cbd5e1" />
  <text class="section" x="92" y="424">완성된 추적표</text>
  <rect x="92" y="446" width="984" height="40" rx="10" fill="#e2e8f0" />
  <text class="label" x="120" y="472">line</text>
  <text class="label" x="298" y="472">local x / a</text>
  <text class="label" x="552" y="472">global x</text>
  <text class="label" x="770" y="472">output</text>
  <text class="label" x="908" y="472">메모</text>

  <rect x="92" y="486" width="984" height="34" fill="#ffffff" stroke="#dbe4ee" />
  <text class="monoDark" x="120" y="509">main 진입</text>
  <text class="monoDark" x="298" y="509">x = 3</text>
  <text class="monoDark" x="552" y="509">1</text>
  <text class="monoDark" x="770" y="509">-</text>
  <text class="body" x="908" y="509">지역 x 생성</text>

  <rect x="92" y="520" width="984" height="34" fill="#f8fafc" stroke="#dbe4ee" />
  <text class="monoDark" x="120" y="543">f(x) 호출</text>
  <text class="monoDark" x="298" y="543">a = 3</text>
  <text class="monoDark" x="552" y="543">1</text>
  <text class="monoDark" x="770" y="543">-</text>
  <text class="body" x="908" y="543">값 3이 복사됨</text>

  <rect x="92" y="554" width="984" height="34" fill="#ffffff" stroke="#dbe4ee" />
  <text class="monoDark" x="120" y="577">a++</text>
  <text class="monoDark" x="298" y="577">a = 4</text>
  <text class="monoDark" x="552" y="577">1</text>
  <text class="monoDark" x="770" y="577">-</text>
  <text class="body" x="908" y="577">복사본만 증가</text>

  <rect x="92" y="588" width="984" height="34" fill="#f8fafc" stroke="#dbe4ee" />
  <text class="monoDark" x="120" y="611">x += a</text>
  <text class="monoDark" x="298" y="611">a = 4</text>
  <text class="monoDark" x="552" y="611">5</text>
  <text class="monoDark" x="770" y="611">-</text>
  <text class="body" x="908" y="611">전역 x만 변경</text>

  <rect x="92" y="622" width="984" height="34" fill="#ffffff" stroke="#dbe4ee" />
  <text class="monoDark" x="120" y="645">printf</text>
  <text class="monoDark" x="298" y="645">local x = 3</text>
  <text class="monoDark" x="552" y="645">5</text>
  <text class="monoDark" x="770" y="645">3</text>
  <text class="body" x="908" y="645">출력은 지역 x 사용</text>
</svg>
