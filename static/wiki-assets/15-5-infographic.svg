<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980" role="img" aria-labelledby="title desc">
  <title id="title">15-5. 디지털자산 개요 인포그래픽</title>
  <desc id="desc">가상자산 거래 구조, 토큰증권, 규제 통제를 세 개의 큰 카드로 나눠 정리한 SVG</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#eef6ff"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#2563eb"/>
    </marker>
  </defs>
  <style>
    text { font-family: 'Pretendard', 'Noto Sans KR', sans-serif; fill: #0f172a; }
    .eyebrow { font-size: 15px; font-weight: 700; letter-spacing: 0.08em; fill: #bfdbfe; }
    .h1 { font-size: 34px; font-weight: 800; fill: #ffffff; }
    .heroText { font-size: 17px; font-weight: 500; fill: #dbeafe; }
    .section { font-size: 24px; font-weight: 800; }
    .lead { font-size: 15px; font-weight: 500; fill: #334155; }
    .boxTitle { font-size: 18px; font-weight: 800; }
    .body { font-size: 14px; font-weight: 500; fill: #334155; }
    .chipText { font-size: 13px; font-weight: 800; }
    .noteTitle { font-size: 14px; font-weight: 800; }
    .note { font-size: 13px; font-weight: 500; fill: #475569; }
    .white { fill: #ffffff; }
  </style>

  <rect width="1200" height="980" fill="url(#bg)"/>

  <rect x="42" y="34" width="1116" height="156" rx="30" fill="url(#hero)" filter="url(#shadow)"/>
  <text class="eyebrow" x="78" y="76">DIGITAL ASSET OVERVIEW</text>
  <text class="h1" x="78" y="118">15-5. 디지털자산</text>
  <text class="heroText" x="78" y="152">가상자산 거래 인프라, 토큰증권, 규제 통제를 한 장에서 읽되</text>
  <text class="heroText" x="78" y="176">각 블록을 넓게 분리해 리스크와 제도 연결을 바로 파악하도록 재구성했습니다.</text>

  <rect x="818" y="62" width="292" height="96" rx="22" fill="#eff6ff" opacity="0.12"/>
  <circle cx="868" cy="110" r="22" fill="#38bdf8"/>
  <text x="868" y="115" text-anchor="middle" class="chipText white">거래</text>
  <circle cx="944" cy="110" r="22" fill="#8b5cf6"/>
  <text x="944" y="115" text-anchor="middle" class="chipText white">권리</text>
  <circle cx="1020" cy="110" r="22" fill="#14b8a6"/>
  <text x="1020" y="115" text-anchor="middle" class="chipText white">통제</text>
  <path d="M890 110 H922" stroke="#93c5fd" stroke-width="4" stroke-linecap="round"/>
  <path d="M966 110 H998" stroke="#c4b5fd" stroke-width="4" stroke-linecap="round"/>
  <rect x="1056" y="88" width="30" height="44" rx="8" fill="#e2e8f0"/>
  <path d="M1065 100 H1077 M1065 110 H1077 M1065 120 H1073" stroke="#334155" stroke-width="2" stroke-linecap="round"/>

  <rect x="42" y="220" width="1116" height="238" rx="28" fill="#ffffff" filter="url(#shadow)"/>
  <text class="section" x="76" y="264">① 가상자산 거래 구조</text>
  <text class="lead" x="76" y="292">원화 입출금, 거래소, 수탁 지갑, 블록체인, 내부 장부를 분리해서 봐야 운영·보안·컴플라이언스 리스크가 드러납니다.</text>

  <rect x="76" y="326" width="170" height="92" rx="18" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/>
  <text class="boxTitle" x="161" y="356" text-anchor="middle">원화 입출금 계좌</text>
  <text class="body" x="161" y="381" text-anchor="middle">온·오프 램프</text>
  <text class="body" x="161" y="402" text-anchor="middle">AML·제재 점검</text>

  <rect x="286" y="326" width="170" height="92" rx="18" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
  <text class="boxTitle" x="371" y="356" text-anchor="middle">거래소 주문장</text>
  <text class="body" x="371" y="381" text-anchor="middle">매수·매도 매칭</text>
  <text class="body" x="371" y="402" text-anchor="middle">시세조종·유동성 감시</text>

  <rect x="496" y="326" width="170" height="92" rx="18" fill="#dcfce7" stroke="#34d399" stroke-width="2"/>
  <text class="boxTitle" x="581" y="356" text-anchor="middle">지갑 · 수탁</text>
  <text class="body" x="581" y="381" text-anchor="middle">Hot/Cold 분리</text>
  <text class="body" x="581" y="402" text-anchor="middle">멀티시그·HSM</text>

  <rect x="706" y="326" width="170" height="92" rx="18" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  <text class="boxTitle" x="791" y="356" text-anchor="middle">블록체인 네트워크</text>
  <text class="body" x="791" y="381" text-anchor="middle">PoW/PoS 합의</text>
  <text class="body" x="791" y="402" text-anchor="middle">최종성·포크 위험</text>

  <rect x="916" y="326" width="170" height="92" rx="18" fill="#ccfbf1" stroke="#14b8a6" stroke-width="2"/>
  <text class="boxTitle" x="1001" y="356" text-anchor="middle">내부 장부 · 회계</text>
  <text class="body" x="1001" y="381" text-anchor="middle">거래 로그 매칭</text>
  <text class="body" x="1001" y="402" text-anchor="middle">감사 추적성 확보</text>

  <line x1="246" y1="372" x2="286" y2="372" stroke="#2563eb" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="456" y1="372" x2="496" y2="372" stroke="#2563eb" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="666" y1="372" x2="706" y2="372" stroke="#2563eb" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="876" y1="372" x2="916" y2="372" stroke="#2563eb" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>

  <rect x="76" y="430" width="1010" height="18" rx="9" fill="#eff6ff"/>
  <rect x="76" y="430" width="252" height="18" rx="9" fill="#38bdf8" opacity="0.35"/>
  <rect x="338" y="430" width="252" height="18" rx="9" fill="#3b82f6" opacity="0.28"/>
  <rect x="600" y="430" width="252" height="18" rx="9" fill="#14b8a6" opacity="0.28"/>
  <rect x="862" y="430" width="224" height="18" rx="9" fill="#8b5cf6" opacity="0.24"/>
  <text class="noteTitle" x="76" y="453">체크 흐름</text>
  <text class="note" x="154" y="453">사업자 실사 → 키관리·출금 승인 검증 → 온체인 로그/내부 장부 대사 → 해킹·대량출금 비상대응</text>

  <rect x="42" y="484" width="538" height="452" rx="28" fill="#ffffff" filter="url(#shadow)"/>
  <text class="section" x="76" y="528">② 토큰증권(STO)</text>
  <text class="lead" x="76" y="556">기초 권리를 토큰으로 표현해 유통 효율을 높이되, 법적 권리 귀속과 예탁결제 연계를 분리해서 검토해야 합니다.</text>

  <rect x="82" y="592" width="136" height="92" rx="18" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text class="boxTitle" x="150" y="622" text-anchor="middle">기초 권리</text>
  <text class="body" x="150" y="647" text-anchor="middle">지분 · 채권</text>
  <text class="body" x="150" y="668" text-anchor="middle">부동산 수익권</text>

  <line x1="218" y1="638" x2="268" y2="638" stroke="#7c3aed" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>

  <rect x="268" y="592" width="136" height="92" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text class="boxTitle" x="336" y="622" text-anchor="middle">STO 토큰</text>
  <text class="body" x="336" y="647" text-anchor="middle">권리·의무 코딩</text>
  <text class="body" x="336" y="668" text-anchor="middle">분산원장 유통</text>

  <line x1="404" y1="638" x2="454" y2="638" stroke="#0ea5e9" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>

  <rect x="454" y="592" width="86" height="92" rx="18" fill="#dbeafe" stroke="#0ea5e9" stroke-width="2"/>
  <text class="boxTitle" x="497" y="622" text-anchor="middle">제도</text>
  <text class="body" x="497" y="647" text-anchor="middle">공시</text>
  <text class="body" x="497" y="668" text-anchor="middle">보호장치</text>

  <rect x="82" y="718" width="458" height="66" rx="18" fill="#faf5ff" stroke="#d8b4fe"/>
  <text class="noteTitle" x="104" y="746">효익</text>
  <text class="note" x="152" y="746">소액투자, 유동성 확대, 배당·이자·의결권 자동화 가능성</text>
  <text class="noteTitle" x="104" y="770">리스크</text>
  <text class="note" x="152" y="770">증권성 판단, 권리 이전의 법적 확실성, 결제 최종성, 투자자 보호</text>

  <rect x="82" y="804" width="458" height="92" rx="18" fill="#f8fafc" stroke="#cbd5e1"/>
  <text class="noteTitle" x="104" y="832">실무 질문</text>
  <text class="note" x="104" y="855">1) 토큰이 어떤 권리를 정확히 대표하는가</text>
  <text class="note" x="104" y="876">2) 전자증권·예탁결제 시스템과 어떤 방식으로 연결되는가</text>

  <rect x="620" y="484" width="538" height="452" rx="28" fill="#ffffff" filter="url(#shadow)"/>
  <text class="section" x="654" y="528">③ 규제·통제 프레임워크</text>
  <text class="lead" x="654" y="556">혁신 수용과 이용자 보호의 균형을 위해 규제, 시장감시, 수탁통제를 병렬로 운영해야 합니다.</text>

  <rect x="654" y="598" width="470" height="72" rx="18" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text class="boxTitle" x="678" y="626">AML / KYC / Travel Rule</text>
  <text class="body" x="678" y="650">고객확인, 지갑 주소 모니터링, 의심거래보고, 제재 대응</text>

  <rect x="654" y="690" width="470" height="72" rx="18" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text class="boxTitle" x="678" y="718">시장감시 · 사고대응</text>
  <text class="body" x="678" y="742">시세조종, 대량 출금, 운영중단 징후를 탐지하고 즉시 보고</text>

  <rect x="654" y="782" width="470" height="72" rx="18" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text class="boxTitle" x="678" y="810">수탁 통제 · 감사로그</text>
  <text class="body" x="678" y="834">권한분리, 백업·복구, 출금 승인, 로그 보관으로 자산 이동을 통제</text>

  <rect x="654" y="876" width="470" height="40" rx="14" fill="#eff6ff" stroke="#bfdbfe"/>
  <text class="note" x="678" y="901">면접 답변 팁: 디지털자산은 투자상품이 아니라 결제·자본시장·보안·규제가 교차하는 인프라라고 설명</text>
</svg>
