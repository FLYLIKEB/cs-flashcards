<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">15-5. 디지털자산 인포그래픽</title>
  <desc id="desc">가상자산 거래 인프라, 토큰증권, 규제·통제 프레임워크를 한 화면에 정리한 SVG</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="55%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#ecfeff"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="stoGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowDark" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#0f766e"/>
    </marker>
    <style>
      text { font-family: 'Pretendard','Noto Sans KR',sans-serif; }
      .eyebrow { font-size: 15px; font-weight: 700; letter-spacing: 0.08em; fill: #bfdbfe; }
      .h1 { font-size: 35px; font-weight: 800; fill: #ffffff; }
      .heroBody { font-size: 16px; font-weight: 500; fill: #dbeafe; }
      .section { font-size: 22px; font-weight: 800; fill: #0f172a; }
      .label { font-size: 18px; font-weight: 800; fill: #0f172a; }
      .body { font-size: 14px; font-weight: 500; fill: #334155; }
      .small { font-size: 13px; font-weight: 700; fill: #475569; }
      .chip { font-size: 12px; font-weight: 700; fill: #0f172a; }
      .white { fill: #ffffff; }
    </style>
  </defs>

  <rect width="1200" height="760" fill="url(#bg)"/>

  <rect x="40" y="32" width="1120" height="150" rx="32" fill="url(#hero)" filter="url(#shadow)"/>
  <text class="eyebrow" x="78" y="72">DIGITAL ASSET MAP</text>
  <text class="h1" x="78" y="115">15-5. 디지털자산</text>
  <text class="heroBody" x="78" y="148">가상자산 거래 인프라, STO 권리구조, AML·시장감시·수탁 통제를 함께 봐야</text>
  <text class="heroBody" x="78" y="171">금융공기업 관점의 리스크와 제도 연계를 설명할 수 있습니다.</text>

  <g transform="translate(770 56)">
    <rect x="0" y="0" width="336" height="102" rx="24" fill="#eff6ff" opacity="0.12"/>
    <circle cx="50" cy="51" r="22" fill="#38bdf8" opacity="0.9"/>
    <text class="small white" x="50" y="56" text-anchor="middle">거래</text>
    <circle cx="125" cy="51" r="22" fill="#8b5cf6" opacity="0.9"/>
    <text class="small white" x="125" y="56" text-anchor="middle">권리</text>
    <circle cx="200" cy="51" r="22" fill="#14b8a6" opacity="0.9"/>
    <text class="small white" x="200" y="56" text-anchor="middle">통제</text>
    <path d="M72 51 H103" stroke="#93c5fd" stroke-width="4" stroke-linecap="round"/>
    <path d="M147 51 H178" stroke="#c4b5fd" stroke-width="4" stroke-linecap="round"/>
    <path d="M222 51 H290" stroke="#5eead4" stroke-width="4" stroke-linecap="round"/>
    <rect x="286" y="31" width="34" height="40" rx="9" fill="#e2e8f0"/>
    <path d="M297 43 h12 M297 51 h12 M297 59 h9" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
  </g>

  <rect x="40" y="206" width="700" height="514" rx="28" fill="#ffffff" filter="url(#shadow)"/>
  <text class="section" x="72" y="246">① 가상자산 거래 구조</text>
  <text class="body" x="72" y="271">주문장·지갑·수탁·블록체인·원화계좌가 분리되어 있어 각 지점마다 다른 운영·보안·컴플라이언스 리스크가 발생합니다.</text>

  <rect x="82" y="315" width="150" height="98" rx="20" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
  <text class="label" x="157" y="348" text-anchor="middle">원화 입출금</text>
  <text class="body" x="157" y="372" text-anchor="middle">온·오프 램프</text>
  <text class="body" x="157" y="392" text-anchor="middle">AML·제재 민감</text>

  <rect x="294" y="315" width="150" height="98" rx="20" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/>
  <text class="label" x="369" y="348" text-anchor="middle">거래소 주문장</text>
  <text class="body" x="369" y="372" text-anchor="middle">매수·매도 매칭</text>
  <text class="body" x="369" y="392" text-anchor="middle">시세조종 감시</text>

  <rect x="506" y="315" width="150" height="98" rx="20" fill="#dcfce7" stroke="#34d399" stroke-width="2"/>
  <text class="label" x="581" y="348" text-anchor="middle">지갑 · 수탁</text>
  <text class="body" x="581" y="372" text-anchor="middle">Hot/Cold 분리</text>
  <text class="body" x="581" y="392" text-anchor="middle">멀티시그 · HSM</text>

  <rect x="294" y="477" width="150" height="98" rx="20" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  <text class="label" x="369" y="510" text-anchor="middle">블록체인</text>
  <text class="body" x="369" y="534" text-anchor="middle">PoW / PoS 합의</text>
  <text class="body" x="369" y="554" text-anchor="middle">최종성 · 포크 위험</text>

  <rect x="506" y="477" width="150" height="98" rx="20" fill="#ccfbf1" stroke="#14b8a6" stroke-width="2"/>
  <text class="label" x="581" y="510" text-anchor="middle">내부 장부</text>
  <text class="body" x="581" y="534" text-anchor="middle">거래로그 매칭</text>
  <text class="body" x="581" y="554" text-anchor="middle">회계 · 감사 추적</text>

  <line x1="232" y1="364" x2="294" y2="364" stroke="#2563eb" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="444" y1="364" x2="506" y2="364" stroke="#2563eb" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="581" y1="413" x2="581" y2="477" stroke="#0f766e" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowDark)"/>
  <line x1="506" y1="526" x2="444" y2="526" stroke="#0f766e" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowDark)"/>
  <line x1="369" y1="477" x2="369" y2="413" stroke="#0f766e" stroke-width="4" stroke-linecap="round" marker-end="url(#arrowDark)"/>

  <circle cx="369" cy="526" r="92" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="7 9" opacity="0.28"/>
  <circle cx="369" cy="526" r="92" fill="none" stroke="#8b5cf6" stroke-width="2" stroke-dasharray="7 9" opacity="0.65">
    <animateTransform attributeName="transform" attributeType="XML" type="rotate" from="0 369 526" to="360 369 526" dur="16s" repeatCount="indefinite"/>
  </circle>

  <rect x="82" y="615" width="616" height="70" rx="18" fill="#f8fafc" stroke="#cbd5e1"/>
  <text class="small" x="106" y="642">핵심 실무 체크</text>
  <text class="body" x="106" y="665">거래소·수탁 실사 → 키관리·출금 승인 검증 → 온체인 로그와 내부 장부 정합성 점검 → 해킹·대량출금 비상대응 준비</text>

  <rect x="772" y="206" width="388" height="242" rx="28" fill="#ffffff" filter="url(#shadow)"/>
  <text class="section" x="804" y="246">② 토큰증권(STO)</text>
  <text class="body" x="804" y="271">기존 증권의 권리관계를 토큰으로 표현하되, 법적 권리 귀속과 예탁결제 연계가 핵심입니다.</text>

  <rect x="806" y="308" width="120" height="102" rx="20" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text class="label" x="866" y="342" text-anchor="middle">기초 권리</text>
  <text class="body" x="866" y="366" text-anchor="middle">지분 · 채권</text>
  <text class="body" x="866" y="386" text-anchor="middle">부동산 수익권</text>

  <rect x="965" y="308" width="120" height="102" rx="20" fill="url(#stoGrad)"/>
  <text class="label white" x="1025" y="342" text-anchor="middle">STO 토큰</text>
  <text class="body white" x="1025" y="366" text-anchor="middle">권리·의무 코딩</text>
  <text class="body white" x="1025" y="386" text-anchor="middle">분산원장 유통</text>

  <path d="M926 359 H965" stroke="#7c3aed" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>

  <rect x="806" y="426" width="279" height="1" fill="#e2e8f0"/>
  <rect x="806" y="440" width="88" height="28" rx="14" fill="#ede9fe"/>
  <text class="chip" x="850" y="459" text-anchor="middle">효익</text>
  <text class="body" x="904" y="459">소액투자 · 유동성 · 자동화된 배당/이자/의결권</text>
  <rect x="806" y="480" width="88" height="28" rx="14" fill="#dbeafe"/>
  <text class="chip" x="850" y="499" text-anchor="middle">검토</text>
  <text class="body" x="904" y="499">증권성 · 공시 · 투자자 보호 · 소유권 이전의 법적 확실성</text>
  <rect x="806" y="520" width="88" height="28" rx="14" fill="#ccfbf1"/>
  <text class="chip" x="850" y="539" text-anchor="middle">연계</text>
  <text class="body" x="904" y="539">전자증권 · 예탁결제 시스템과 인터페이스 설계 필요</text>

  <rect x="772" y="474" width="388" height="246" rx="28" fill="#ffffff" filter="url(#shadow)"/>
  <text class="section" x="804" y="514">③ 규제·통제 프레임워크</text>
  <text class="body" x="804" y="539">혁신 수용과 이용자 보호 사이의 균형을 맞추는 금융공기업형 체크포인트입니다.</text>

  <rect x="806" y="566" width="320" height="48" rx="16" fill="#fef3c7" stroke="#f59e0b"/>
  <text class="label" x="826" y="595">AML / KYC / Travel Rule</text>
  <text class="body" x="1092" y="595" text-anchor="end">고객확인 · 주소 모니터링 · STR</text>

  <rect x="806" y="624" width="320" height="48" rx="16" fill="#fee2e2" stroke="#ef4444"/>
  <text class="label" x="826" y="653">시장감시 · 사고대응</text>
  <text class="body" x="1092" y="653" text-anchor="end">시세조종 · 대량출금 탐지 · 보고</text>

  <rect x="806" y="682" width="320" height="48" rx="16" fill="#dcfce7" stroke="#22c55e"/>
  <text class="label" x="826" y="711">수탁 통제 · 감사로그</text>
  <text class="body" x="1092" y="711" text-anchor="end">권한분리 · 백업복구 · 장부검증</text>
</svg>
