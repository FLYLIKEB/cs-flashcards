<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc">
  <title id="title">09-02-02 최단경로 알고리즘 선택표</title>
  <desc id="desc">무가중치 여부, 음수 간선 여부, 단일 시작점인지 모든 쌍인지에 따라 BFS, Dijkstra, Bellman-Ford, Floyd-Warshall을 고르는 결정표</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .frame { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .title { font: 800 36px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .subtitle { font: 500 18px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
      .section { font: 800 23px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .label { font: 700 16px 'Pretendard','Noto Sans KR',sans-serif; fill: #1e293b; }
      .body { font: 500 15px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
      .algoTitle { font: 800 21px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .small { font: 600 13px 'Pretendard','Noto Sans KR',sans-serif; fill: #475569; }
      .chipText { font: 800 14px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .metric { font: 700 14px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f766e; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="840"/>
  <rect class="frame" x="24" y="24" width="1152" height="792" rx="30"/>

  <rect x="64" y="56" width="118" height="32" rx="16" fill="#ccfbf1"/>
  <text class="chipText" x="123" y="77" text-anchor="middle">09-02-02</text>
  <text class="title" x="64" y="126">최단경로 알고리즘 선택</text>
  <text class="subtitle" x="64" y="158">문제 문장을 보면 먼저 간선 조건을 확인하고, 그다음 시작점 범위를 보면 후보가 빠르게 좁혀진다.</text>

  <rect x="86" y="206" width="1028" height="88" rx="22" fill="#ecfeff" stroke="#14b8a6" stroke-width="2"/>
  <text class="section" x="118" y="244">1단계: 간선 가중치부터 확인</text>
  <text class="body" x="118" y="274">무가중치인지, 가중치가 모두 0 이상인지, 음수 간선 또는 음수 사이클 검사가 필요한지를 먼저 구분한다.</text>

  <line x1="600" y1="294" x2="600" y2="334" stroke="#14b8a6" stroke-width="4"/>
  <line x1="224" y1="334" x2="976" y2="334" stroke="#14b8a6" stroke-width="4"/>
  <line x1="224" y1="334" x2="224" y2="366" stroke="#14b8a6" stroke-width="4"/>
  <line x1="600" y1="334" x2="600" y2="366" stroke="#14b8a6" stroke-width="4"/>
  <line x1="976" y1="334" x2="976" y2="366" stroke="#14b8a6" stroke-width="4"/>

  <rect x="118" y="366" width="212" height="178" rx="22" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <rect x="494" y="366" width="212" height="178" rx="22" fill="#eff6ff" stroke="#0ea5e9" stroke-width="2"/>
  <rect x="870" y="366" width="212" height="178" rx="22" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>

  <text class="algoTitle" x="224" y="406" text-anchor="middle">BFS</text>
  <text class="label" x="146" y="438">조건</text>
  <text class="body" x="146" y="464">• 간선 가중치가 없음</text>
  <text class="body" x="146" y="490">• 간선 수 기준 최단거리</text>
  <text class="body" x="146" y="516">• 단일 시작점 거리 계산</text>
  <text class="metric" x="146" y="536">Queue · O(V + E)</text>

  <text class="algoTitle" x="600" y="406" text-anchor="middle">Dijkstra</text>
  <text class="label" x="522" y="438">조건</text>
  <text class="body" x="522" y="464">• 모든 가중치가 0 이상</text>
  <text class="body" x="522" y="490">• 단일 시작점 문제</text>
  <text class="body" x="522" y="516">• 희소 그래프에서 자주 사용</text>
  <text class="metric" x="522" y="536">PQ · O((V + E) log V)</text>

  <text class="algoTitle" x="976" y="406" text-anchor="middle">Bellman-Ford</text>
  <text class="label" x="898" y="438">조건</text>
  <text class="body" x="898" y="464">• 음수 간선 허용</text>
  <text class="body" x="898" y="490">• 음수 사이클 탐지 가능</text>
  <text class="body" x="898" y="516">• 속도보다 조건 대응이 우선</text>
  <text class="metric" x="898" y="536">O(V × E)</text>

  <rect x="86" y="584" width="1028" height="172" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text class="section" x="118" y="622">2단계: 시작점 범위를 확인</text>
  <text class="body" x="118" y="650">단일 시작점이면 BFS, Dijkstra, Bellman-Ford 중 하나를 고른다. 모든 정점 쌍의 거리표가 필요하면 Floyd-Warshall을 검토한다.</text>

  <rect x="126" y="674" width="308" height="56" rx="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text class="label" x="280" y="708" text-anchor="middle">단일 시작점 → BFS / Dijkstra / Bellman-Ford</text>

  <line x1="434" y1="702" x2="536" y2="702" stroke="#16a34a" stroke-width="5" stroke-linecap="round"/>

  <rect x="536" y="650" width="518" height="104" rx="22" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text class="algoTitle" x="572" y="690">Floyd-Warshall</text>
  <text class="body" x="572" y="718">모든 쌍 최단경로가 필요하고 정점 수가 작을 때 적합하다.</text>
  <text class="metric" x="572" y="740">거리 행렬 기반 · O(V³)</text>

  <text class="small" x="64" y="792">시험에서 “무가중”, “음수 간선”, “모든 쌍” 같은 표현이 보이면 해당 칸의 알고리즘으로 바로 연결한다.</text>
</svg>