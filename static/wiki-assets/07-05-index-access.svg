<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">07-05. B+Tree와 인덱스 접근 방식</title>
  <desc id="desc">B+Tree가 루트에서 리프까지 내려간 뒤 리프 간 순차 연결로 범위 검색에 유리한 이유와 Hash, 클러스터드 인덱스와의 차이를 정리한 SVG</desc>
  <defs>
    <style>
      text { font-family: "Noto Sans KR", "Apple SD Gothic Neo", sans-serif; fill: #0f172a; }
      .eyebrow { font-size: 20px; font-weight: 700; letter-spacing: 0.08em; fill: #166534; }
      .title { font-size: 40px; font-weight: 800; }
      .subtitle { font-size: 22px; font-weight: 500; fill: #334155; }
      .panelTitle { font-size: 27px; font-weight: 800; }
      .body { font-size: 19px; font-weight: 500; fill: #334155; }
      .label { font-size: 18px; font-weight: 800; }
      .small { font-size: 18px; font-weight: 600; fill: #475569; }
      .em { font-weight: 800; fill: #0f172a; }
    </style>
  </defs>

  <rect width="1200" height="800" fill="#f8fafc"/>
  <rect x="28" y="28" width="1144" height="744" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <text x="72" y="86" class="eyebrow">INDEX ACCESS · PAGE 07-05</text>
  <text x="72" y="136" class="title">B+Tree는 왜 범위 검색에 강한가</text>
  <text x="72" y="174" class="subtitle">한 번 리프에 도달하면 옆 리프를 연속 스캔할 수 있어 BETWEEN·ORDER BY에서 이점이 커진다.</text>

  <rect x="64" y="214" width="650" height="514" rx="26" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text x="96" y="260" class="panelTitle">B+Tree 접근 흐름</text>

  <rect x="322" y="296" width="120" height="54" rx="16" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="382" y="331" class="label" text-anchor="middle">Root</text>

  <rect x="170" y="404" width="124" height="54" rx="16" fill="#ffffff" stroke="#22c55e" stroke-width="2"/>
  <rect x="322" y="404" width="124" height="54" rx="16" fill="#ffffff" stroke="#22c55e" stroke-width="2"/>
  <rect x="474" y="404" width="124" height="54" rx="16" fill="#ffffff" stroke="#22c55e" stroke-width="2"/>
  <text x="232" y="439" class="label" text-anchor="middle">Internal A-M</text>
  <text x="384" y="439" class="label" text-anchor="middle">Internal N-T</text>
  <text x="536" y="439" class="label" text-anchor="middle">Internal U-Z</text>

  <line x1="382" y1="350" x2="232" y2="404" stroke="#15803d" stroke-width="3"/>
  <line x1="382" y1="350" x2="384" y2="404" stroke="#15803d" stroke-width="3"/>
  <line x1="382" y1="350" x2="536" y2="404" stroke="#15803d" stroke-width="3"/>

  <rect x="110" y="546" width="156" height="82" rx="16" fill="#ffffff" stroke="#65a30d" stroke-width="2"/>
  <rect x="284" y="546" width="156" height="82" rx="16" fill="#ffffff" stroke="#65a30d" stroke-width="2"/>
  <rect x="458" y="546" width="156" height="82" rx="16" fill="#ffffff" stroke="#65a30d" stroke-width="2"/>
  <text x="188" y="580" class="label" text-anchor="middle">Leaf 10-19</text>
  <text x="188" y="610" class="body" text-anchor="middle">포인터 + 순차 링크</text>
  <text x="362" y="580" class="label" text-anchor="middle">Leaf 20-29</text>
  <text x="362" y="610" class="body" text-anchor="middle">포인터 + 순차 링크</text>
  <text x="536" y="580" class="label" text-anchor="middle">Leaf 30-39</text>
  <text x="536" y="610" class="body" text-anchor="middle">포인터 + 순차 링크</text>

  <line x1="232" y1="458" x2="188" y2="546" stroke="#15803d" stroke-width="3"/>
  <line x1="384" y1="458" x2="362" y2="546" stroke="#15803d" stroke-width="3"/>
  <line x1="536" y1="458" x2="536" y2="546" stroke="#15803d" stroke-width="3"/>
  <line x1="266" y1="587" x2="284" y2="587" stroke="#1d4ed8" stroke-width="4"/>
  <line x1="440" y1="587" x2="458" y2="587" stroke="#1d4ed8" stroke-width="4"/>
  <text x="362" y="670" class="small" text-anchor="middle">예: 20~35를 찾으면 Leaf 20-29를 찾은 뒤 옆 리프로 이동하며 연속 읽기를 수행한다.</text>

  <rect x="742" y="214" width="394" height="232" rx="24" fill="#fffbeb" stroke="#f59e0b" stroke-width="2"/>
  <text x="774" y="260" class="panelTitle">Hash와 비교</text>
  <text x="774" y="304" class="body">• <tspan class="em">Hash</tspan>는 key → bucket으로 바로 가므로 = 조건은 빠르다.</text>
  <text x="774" y="340" class="body">• 하지만 버킷 사이에 정렬 순서가 없어 범위 검색은 약하다.</text>
  <text x="774" y="376" class="body">• 즉, <tspan class="em">동등 검색</tspan>은 Hash, <tspan class="em">범위·정렬</tspan>은 B+Tree가 유리하다.</text>

  <rect x="742" y="478" width="394" height="224" rx="24" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text x="774" y="524" class="panelTitle">Clustered와 비교</text>
  <text x="774" y="568" class="body">• <tspan class="em">Clustered</tspan>는 저장 순서가 키 순서와 가까워 범위 읽기가 빠르다.</text>
  <text x="774" y="604" class="body">• 대신 중간 삽입·갱신 때 재배치 비용이 생길 수 있다.</text>
  <text x="774" y="640" class="body">• 논클러스터드는 별도 인덱스가 포인터로 원본 레코드를 찾는다.</text>
</svg>
