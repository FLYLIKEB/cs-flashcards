<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc">
  <title id="title">07-04. 트랜잭션과 회복 인포그래픽</title>
  <desc id="desc">트랜잭션 흐름, ACID 약속, WAL 기반 복구 판단을 세 구역으로 나누어 설명하는 개요 SVG</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fbff" />
      <stop offset="100%" stop-color="#eef6ff" />
    </linearGradient>
    <style>
      .title { font: 700 34px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .subtitle { font: 500 18px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
      .section { font: 700 22px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .label { font: 700 17px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .body { font: 500 15px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
      .small { font: 500 13px 'Pretendard','Noto Sans KR',sans-serif; fill: #475569; }
      .chip { font: 700 16px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .mono { font: 600 14px 'SFMono-Regular','Consolas',monospace; fill: #0f172a; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb" />
    </marker>
  </defs>

  <rect width="1200" height="840" fill="url(#bg)" />
  <rect x="24" y="24" width="1152" height="792" rx="28" fill="#ffffff" stroke="#cbd5e1" />

  <text class="small" x="56" y="68">금융공기업 IT · 데이터베이스</text>
  <text class="title" x="56" y="112">07-04. 트랜잭션과 회복</text>
  <text class="subtitle" x="56" y="146">핵심은 전부 성공 또는 전부 취소, 그리고 장애가 나도 로그를 기준으로 다시 맞추는 것이다.</text>

  <rect x="48" y="182" width="350" height="584" rx="24" fill="#f8fafc" stroke="#bfdbfe" />
  <text class="section" x="72" y="220">1. 트랜잭션 흐름</text>
  <text class="small" x="72" y="244">은행 이체는 하나의 논리적 작업으로 묶여야 한다.</text>

  <rect x="78" y="276" width="290" height="86" rx="18" fill="#ecfeff" stroke="#0f766e" stroke-width="2" />
  <text class="label" x="102" y="308">BEGIN</text>
  <text class="body" x="102" y="332">A=1000원, B=500원에서 시작</text>
  <text class="body" x="102" y="354">트랜잭션 T1이 두 계좌를 함께 관리</text>

  <line x1="223" y1="362" x2="223" y2="396" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)" />

  <rect x="78" y="404" width="290" height="98" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2" />
  <text class="label" x="102" y="438">출금 후 중간 상태</text>
  <text class="body" x="102" y="462">A에서 100원 차감되었더라도</text>
  <text class="body" x="102" y="484">입금이 끝나기 전에는 확정 상태가 아니다</text>

  <line x1="223" y1="502" x2="223" y2="536" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)" />

  <rect x="78" y="544" width="290" height="98" rx="18" fill="#f0fdf4" stroke="#16a34a" stroke-width="2" />
  <text class="label" x="102" y="578">입금 완료 후 최종 판단</text>
  <text class="body" x="102" y="602">B에도 100원 입금되면 COMMIT</text>
  <text class="body" x="102" y="624">중간 장애나 규칙 위반이면 ROLLBACK</text>

  <rect x="78" y="664" width="290" height="78" rx="18" fill="#fef2f2" stroke="#dc2626" stroke-width="2" />
  <text class="label" x="102" y="696">원자성 기억 문장</text>
  <text class="body" x="102" y="720">둘 중 하나라도 실패하면</text>
  <text class="body" x="102" y="740">A 차감과 B 입금을 모두 취소한다</text>

  <rect x="424" y="182" width="350" height="584" rx="24" fill="#f8fafc" stroke="#c7d2fe" />
  <text class="section" x="448" y="220">2. ACID 약속</text>
  <text class="small" x="448" y="244">시험에서는 약어 하나씩 짧게 끊어 설명하면 된다.</text>

  <rect x="452" y="278" width="294" height="92" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" />
  <text class="chip" x="476" y="312">A · Atomicity</text>
  <text class="body" x="476" y="336">부분 반영을 남기지 않고 전부 성공 또는 전부 취소</text>
  <text class="body" x="476" y="358">이체에서 출금과 입금은 항상 같이 묶인다</text>

  <rect x="452" y="390" width="294" height="92" rx="18" fill="#ecfccb" stroke="#65a30d" stroke-width="2" />
  <text class="chip" x="476" y="424">C · Consistency</text>
  <text class="body" x="476" y="448">제약조건과 업무 규칙을 깨지 않는 상태 유지</text>
  <text class="body" x="476" y="470">잔액 합계와 무결성 규칙이 맞아야 한다</text>

  <rect x="452" y="502" width="294" height="92" rx="18" fill="#ede9fe" stroke="#7c3aed" stroke-width="2" />
  <text class="chip" x="476" y="536">I · Isolation</text>
  <text class="body" x="476" y="560">다른 트랜잭션이 중간 결과를 읽지 못하게 차단</text>
  <text class="body" x="476" y="582">격리 수준이 높을수록 일관성은 강하지만 느려질 수 있다</text>

  <rect x="452" y="614" width="294" height="112" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="2" />
  <text class="chip" x="476" y="648">D · Durability</text>
  <text class="body" x="476" y="672">COMMIT 이후 결과는 장애가 나도 유지되어야 한다</text>
  <text class="body" x="476" y="694">지속성을 지키기 위해 로그와 복구 절차를 사용한다</text>
  <text class="small" x="476" y="716">→ 아래 복구 절차와 연결</text>

  <rect x="800" y="182" width="352" height="584" rx="24" fill="#f8fafc" stroke="#a7f3d0" />
  <text class="section" x="824" y="220">3. 회복 흐름</text>
  <text class="small" x="824" y="244">WAL은 데이터보다 로그를 먼저 디스크에 기록하라는 규칙이다.</text>

  <rect x="828" y="278" width="296" height="88" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" />
  <text class="label" x="852" y="312">WAL 선기록</text>
  <text class="mono" x="852" y="336">L1: A -100   L2: B +100</text>
  <text class="body" x="852" y="358">변경 전 로그가 먼저 남아야 장애 후 판단이 가능하다</text>

  <line x1="976" y1="366" x2="976" y2="400" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)" />

  <rect x="828" y="408" width="296" height="88" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="2" />
  <text class="label" x="852" y="442">장애 시 확인 순서</text>
  <text class="body" x="852" y="466">1) 체크포인트 이후 로그 범위 확인</text>
  <text class="body" x="852" y="488">2) 커밋 기록 존재 여부 판단</text>

  <line x1="976" y1="496" x2="976" y2="530" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)" />

  <rect x="828" y="538" width="136" height="112" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
  <text class="label" x="852" y="572">COMMIT 있음</text>
  <text class="body" x="852" y="596">REDO</text>
  <text class="body" x="852" y="618">완료됐지만 디스크 반영이</text>
  <text class="body" x="852" y="640">빠졌을 수 있는 변경 재적용</text>

  <rect x="988" y="538" width="136" height="112" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="2" />
  <text class="label" x="1012" y="572">COMMIT 없음</text>
  <text class="body" x="1012" y="596">UNDO</text>
  <text class="body" x="1012" y="618">끝나지 못한 변경을</text>
  <text class="body" x="1012" y="640">이전 값으로 되돌림</text>

  <rect x="828" y="670" width="296" height="56" rx="18" fill="#e2e8f0" stroke="#94a3b8" />
  <text class="body" x="852" y="704">Checkpoint는 복구 때 뒤져야 하는 로그 범위를 줄여 준다.</text>

  <text class="small" x="56" y="794">자산: 07-04-infographic.svg · 한 장 요약: 트랜잭션 흐름, ACID, WAL 복구 판단</text>
</svg>
