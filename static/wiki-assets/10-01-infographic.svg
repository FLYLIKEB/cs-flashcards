<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">10-01. 암호화와 해시</title>
  <desc id="desc">암호화는 키로 복호화 가능한 기밀성 보호 흐름이고, 해시는 일방향 요약으로 무결성을 확인하는 흐름임을 비교하는 인포그래픽.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#fff7ed"/>
    </linearGradient>
    <linearGradient id="encPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="hashPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffedd5"/>
      <stop offset="100%" stop-color="#fed7aa"/>
    </linearGradient>
    <linearGradient id="digest" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#db2777"/>
    </linearGradient>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#ea580c"/>
    </marker>
    <style>
      text { font-family: "Pretendard", "Noto Sans KR", sans-serif; }
      .eyebrow { font-size: 15px; font-weight: 700; fill: #475569; }
      .title { font-size: 34px; font-weight: 800; fill: #0f172a; }
      .subtitle { font-size: 18px; font-weight: 500; fill: #334155; }
      .sectionTitle { font-size: 24px; font-weight: 800; fill: #0f172a; }
      .sectionBody { font-size: 16px; font-weight: 500; fill: #334155; }
      .cardTitle { font-size: 20px; font-weight: 800; fill: #0f172a; }
      .cardText { font-size: 15px; font-weight: 600; fill: #334155; }
      .tiny { font-size: 13px; font-weight: 700; fill: #475569; letter-spacing: 0.08em; }
      .pill { font-size: 15px; font-weight: 800; fill: #0f172a; }
      .mono { font-size: 15px; font-weight: 700; fill: #111827; font-family: "SFMono-Regular", Consolas, monospace; }
    </style>
  </defs>

  <rect width="1200" height="720" fill="#f8fafc"/>
  <rect x="24" y="24" width="1152" height="672" rx="32" fill="url(#bg)"/>
  <rect x="48" y="46" width="1104" height="628" rx="28" fill="#ffffff" opacity="0.92"/>

  <text x="84" y="88" class="eyebrow">SECURITY CORE • CONFIDENTIALITY vs INTEGRITY</text>
  <text x="84" y="128" class="title">10-01. 암호화와 해시</text>
  <text x="84" y="162" class="subtitle">암호화는 키가 있으면 되돌릴 수 있는 보호이고, 해시는 되돌리기 어려운 요약으로 변경 여부를 확인한다.</text>

  <rect x="74" y="200" width="510" height="320" rx="28" fill="url(#encPanel)" stroke="#93c5fd"/>
  <rect x="616" y="200" width="510" height="320" rx="28" fill="url(#hashPanel)" stroke="#fdba74"/>

  <text x="104" y="242" class="sectionTitle">암호화: 기밀성</text>
  <text x="104" y="268" class="sectionBody">원문을 숨기고, 올바른 키를 가진 주체만 복호화한다.</text>

  <rect x="108" y="302" width="120" height="74" rx="18" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
  <text x="168" y="334" text-anchor="middle" class="cardTitle">평문</text>
  <text x="168" y="356" text-anchor="middle" class="cardText">고객정보</text>

  <rect x="262" y="286" width="126" height="106" rx="22" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <rect x="306" y="264" width="38" height="34" rx="12" fill="none" stroke="#2563eb" stroke-width="10"/>
  <circle cx="325" cy="330" r="10" fill="#2563eb"/>
  <rect x="320" y="338" width="10" height="20" rx="5" fill="#2563eb"/>
  <text x="325" y="377" text-anchor="middle" class="tiny">KEY</text>

  <rect x="420" y="302" width="132" height="74" rx="18" fill="#1d4ed8"/>
  <text x="486" y="334" text-anchor="middle" class="cardTitle" fill="#ffffff">암호문</text>
  <text x="486" y="356" text-anchor="middle" class="mono" fill="#dbeafe">7F A2 91 ...</text>

  <line x1="228" y1="339" x2="262" y2="339" stroke="#2563eb" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <line x1="388" y1="339" x2="420" y2="339" stroke="#2563eb" stroke-width="4" marker-end="url(#arrowBlue)"/>

  <rect x="136" y="416" width="392" height="78" rx="20" fill="#ffffff" opacity="0.92" stroke="#bfdbfe"/>
  <text x="160" y="446" class="pill">대칭키</text>
  <text x="160" y="470" class="cardText">같은 키로 암·복호화 • 빠르지만 키 분배가 과제</text>
  <text x="342" y="446" class="pill">공개키</text>
  <text x="342" y="470" class="cardText">키 쌍 사용 • 배포와 인증에 유리하지만 느림</text>

  <text x="646" y="242" class="sectionTitle">해시: 무결성</text>
  <text x="646" y="268" class="sectionBody">입력을 고정 길이 요약값으로 바꿔서 변경 여부를 빠르게 확인한다.</text>

  <rect x="652" y="302" width="130" height="74" rx="18" fill="#ffffff" stroke="#fb923c" stroke-width="2"/>
  <text x="717" y="334" text-anchor="middle" class="cardTitle">원문</text>
  <text x="717" y="356" text-anchor="middle" class="cardText">message.txt</text>

  <circle cx="871" cy="339" r="58" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
  <text x="871" y="332" text-anchor="middle" class="cardTitle">HASH</text>
  <text x="871" y="356" text-anchor="middle" class="tiny">ONE WAY</text>

  <rect x="968" y="302" width="118" height="74" rx="18" fill="url(#digest)"/>
  <text x="1027" y="332" text-anchor="middle" class="cardTitle" fill="#ffffff">요약값</text>
  <text x="1027" y="356" text-anchor="middle" class="mono" fill="#fdf2f8">9c4e...1ab</text>

  <line x1="782" y1="339" x2="813" y2="339" stroke="#ea580c" stroke-width="4" marker-end="url(#arrowOrange)"/>
  <line x1="929" y1="339" x2="968" y2="339" stroke="#ea580c" stroke-width="4" marker-end="url(#arrowOrange)"/>

  <path d="M710 436 C770 390, 830 390, 890 436" fill="none" stroke="#9a3412" stroke-width="3" stroke-dasharray="7 7"/>
  <text x="800" y="457" text-anchor="middle" class="cardText">해시값은 같으면 입력 동일 가능성↑, 다르면 반드시 변경</text>
  <text x="800" y="480" text-anchor="middle" class="cardText">원문 복원은 어렵다 · preimage / second / collision 저항성 중요</text>

  <rect x="78" y="548" width="1044" height="96" rx="24" fill="#0f172a"/>
  <rect x="100" y="570" width="220" height="52" rx="18" fill="#1e293b" stroke="#334155"/>
  <text x="210" y="592" text-anchor="middle" class="pill" fill="#93c5fd">비밀번호 저장</text>
  <text x="210" y="612" text-anchor="middle" class="cardText" fill="#e2e8f0">단순 해시 금지 → salt + KDF(Argon2, bcrypt)</text>

  <rect x="344" y="570" width="214" height="52" rx="18" fill="#1e293b" stroke="#334155"/>
  <text x="451" y="592" text-anchor="middle" class="pill" fill="#fdba74">TLS 실무</text>
  <text x="451" y="612" text-anchor="middle" class="cardText" fill="#e2e8f0">공개키로 세션키 교환 후 대칭키로 데이터 암호화</text>

  <rect x="582" y="570" width="228" height="52" rx="18" fill="#1e293b" stroke="#334155"/>
  <text x="696" y="592" text-anchor="middle" class="pill" fill="#c4b5fd">HMAC</text>
  <text x="696" y="612" text-anchor="middle" class="cardText" fill="#e2e8f0">공유키 기반 무결성+인증, 부인방지는 약함</text>

  <rect x="834" y="570" width="266" height="52" rx="18" fill="#1e293b" stroke="#334155"/>
  <text x="967" y="592" text-anchor="middle" class="pill" fill="#86efac">전자서명</text>
  <text x="967" y="612" text-anchor="middle" class="cardText" fill="#e2e8f0">개인키 서명 / 공개키 검증 → 무결성·인증·부인방지</text>
</svg>
