  <text class="small" x="84" y="86">금융공기업 IT · 페이지 맞춤 SVG</text>
  <text class="title" x="84" y="118" text-anchor="start"><tspan x="84" dy="0">10-01. 암호화와 해시</tspan></text>
  <text class="subtitle" x="84" y="180" text-anchor="start"><tspan x="84" dy="0">암호화는 복호화를 전제로 데이터를 보호한다. 즉, 적절한 키(또는 키 쌍)를 가진</tspan><tspan x="84" dy="24">주체는 원문을 복원할 수 있다. 기밀성(confidentiality)을 주된 목표로</tspan></text>
