<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="960" viewBox="0 0 1280 960" role="img" aria-labelledby="title desc">
  <title id="title">10-01. 암호화와 해시 비교</title>
  <desc id="desc">암호화와 해시를 목적, 결과, 복원 가능성, 대표 사용처 기준으로 나눠 비교하고, 비밀번호 저장과 TLS 하이브리드 방식을 함께 정리한 SVG.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="55%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#fff7ed"/>
    </linearGradient>
    <style>
      text { font-family: "Pretendard", "Noto Sans KR", sans-serif; fill: #0f172a; }
      .eyebrow { font-size: 16px; font-weight: 800; letter-spacing: 0.08em; fill: #475569; }
      .title { font-size: 38px; font-weight: 800; }
      .subtitle { font-size: 19px; font-weight: 500; fill: #334155; }
      .panelTitle { font-size: 28px; font-weight: 800; }
      .panelBody { font-size: 17px; font-weight: 600; fill: #334155; }
      .chip { font-size: 15px; font-weight: 800; letter-spacing: 0.08em; }
      .rowLabel { font-size: 17px; font-weight: 800; fill: #334155; }
      .rowValue { font-size: 17px; font-weight: 600; fill: #0f172a; }
      .miniTitle { font-size: 18px; font-weight: 800; }
      .miniBody { font-size: 16px; font-weight: 600; fill: #334155; }
      .footerTitle { font-size: 18px; font-weight: 800; fill: #e2e8f0; }
      .footerBody { font-size: 16px; font-weight: 600; fill: #cbd5e1; }
    </style>
  </defs>

  <rect width="1280" height="960" fill="#f8fafc"/>
  <rect x="26" y="26" width="1228" height="908" rx="34" fill="url(#bg)"/>
  <rect x="54" y="54" width="1172" height="852" rx="30" fill="#ffffff" opacity="0.96"/>

  <text x="90" y="102" class="eyebrow">SECURITY BASICS • CONFIDENTIALITY vs INTEGRITY</text>
  <text x="90" y="144" class="title">10-01. 암호화와 해시</text>
  <text x="90" y="180" class="subtitle">시험에서는 “복호화가 필요한가?”와 “변경 여부만 확인하면 되는가?”를 먼저 구분하면 실수가 줄어든다.</text>

  <rect x="88" y="226" width="510" height="470" rx="30" fill="#eff6ff" stroke="#60a5fa" stroke-width="2.5"/>
  <rect x="682" y="226" width="510" height="470" rx="30" fill="#fff7ed" stroke="#fb923c" stroke-width="2.5"/>

  <rect x="114" y="252" width="112" height="34" rx="17" fill="#dbeafe"/>
  <text x="170" y="274" text-anchor="middle" class="chip" fill="#1d4ed8">ENCRYPTION</text>
  <text x="114" y="322" class="panelTitle">암호화 = 기밀성 보호</text>
  <text x="114" y="354" class="panelBody">키가 있는 주체만 원문을 다시 볼 수 있도록 데이터를 숨긴다.</text>

  <rect x="708" y="252" width="84" height="34" rx="17" fill="#ffedd5"/>
  <text x="750" y="274" text-anchor="middle" class="chip" fill="#c2410c">HASH</text>
  <text x="708" y="322" class="panelTitle">해시 = 무결성 확인</text>
  <text x="708" y="354" class="panelBody">입력을 고정 길이 요약값으로 바꿔 바뀌었는지 빠르게 확인한다.</text>

  <rect x="114" y="390" width="458" height="64" rx="18" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="138" y="416" class="rowLabel">입력 → 처리</text>
  <text x="138" y="440" class="rowValue">평문 + 키 → 암호문</text>

  <rect x="114" y="472" width="458" height="64" rx="18" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="138" y="498" class="rowLabel">결과</text>
  <text x="138" y="522" class="rowValue">내용을 숨긴 상태로 저장·전송</text>

  <rect x="114" y="554" width="458" height="64" rx="18" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="138" y="580" class="rowLabel">복원 가능성</text>
  <text x="138" y="604" class="rowValue">올바른 키가 있으면 복호화 가능</text>

  <rect x="114" y="636" width="458" height="64" rx="18" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="138" y="662" class="rowLabel">대표 사용처</text>
  <text x="138" y="686" class="rowValue">TLS 데이터 보호, 파일 암호화, DB 민감정보 보호</text>

  <rect x="708" y="390" width="458" height="64" rx="18" fill="#ffffff" stroke="#fed7aa"/>
  <text x="732" y="416" class="rowLabel">입력 → 처리</text>
  <text x="732" y="440" class="rowValue">원문 → 일방향 요약값</text>

  <rect x="708" y="472" width="458" height="64" rx="18" fill="#ffffff" stroke="#fed7aa"/>
  <text x="732" y="498" class="rowLabel">결과</text>
  <text x="732" y="522" class="rowValue">짧고 고정 길이인 fingerprint 생성</text>

  <rect x="708" y="554" width="458" height="64" rx="18" fill="#ffffff" stroke="#fed7aa"/>
  <text x="732" y="580" class="rowLabel">복원 가능성</text>
  <text x="732" y="604" class="rowValue">원문 복원이 매우 어려워야 안전</text>

  <rect x="708" y="636" width="458" height="64" rx="18" fill="#ffffff" stroke="#fed7aa"/>
  <text x="732" y="662" class="rowLabel">대표 사용처</text>
  <text x="732" y="686" class="rowValue">파일 무결성 확인, 비밀번호 검증용 KDF의 입력 재료</text>

  <rect x="88" y="724" width="1104" height="158" rx="28" fill="#0f172a"/>

  <rect x="118" y="754" width="330" height="96" rx="22" fill="#1e293b" stroke="#334155"/>
  <text x="144" y="786" class="footerTitle">비밀번호 저장</text>
  <text x="144" y="814" class="footerBody">복호화할 필요가 없으므로 암호화보다</text>
  <text x="144" y="838" class="footerBody">salt + KDF(Argon2, bcrypt) 기반 해시가 적합하다.</text>

  <rect x="476" y="754" width="330" height="96" rx="22" fill="#1e293b" stroke="#334155"/>
  <text x="502" y="786" class="footerTitle">TLS 실무</text>
  <text x="502" y="814" class="footerBody">공개키로 세션키를 안전하게 교환한 뒤</text>
  <text x="502" y="838" class="footerBody">대칭키로 실제 데이터를 빠르게 암호화한다.</text>

  <rect x="834" y="754" width="330" height="96" rx="22" fill="#1e293b" stroke="#334155"/>
  <text x="860" y="786" class="footerTitle">암기 기준</text>
  <text x="860" y="814" class="footerBody">되돌려 읽어야 하면 암호화,</text>
  <text x="860" y="838" class="footerBody">같은지 비교만 하면 해시를 먼저 떠올린다.</text>
</svg>
