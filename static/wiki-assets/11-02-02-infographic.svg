  <text class="title" x="84" y="118" text-anchor="start"><tspan x="84" dy="0">11-02-02. 단위-통합-인수테스트</tspan></text>
  <text class="subtitle" x="84" y="180" text-anchor="start"><tspan x="84" dy="0">단위 테스트는 가장 작은 개발 단위가 의도대로 동작하는지 검증한다. 금융공기업</tspan><tspan x="84" dy="24">환경에서는 회계 거래 로직의 정확성이 특히 중요하다.</tspan></text>
