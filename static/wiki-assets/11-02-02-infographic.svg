<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980" role="img" aria-labelledby="title desc">
  <title id="title">11-02-02 단위·통합·시스템·인수 테스트 인포그래픽</title>
  <desc id="desc">단위, 통합, 시스템, 인수 테스트의 범위와 관점 차이, 통합 방식, 회귀 테스트와 스모크 테스트의 차이를 읽기 쉽게 정리한 SVG</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <style>
      text { font-family: 'Pretendard', 'Noto Sans KR', sans-serif; fill: #0f172a; }
      .eyebrow { font-size: 16px; font-weight: 700; letter-spacing: 0.12em; fill: #475569; }
      .title { font-size: 36px; font-weight: 800; }
      .subtitle { font-size: 18px; font-weight: 500; fill: #334155; }
      .panel-title { font-size: 22px; font-weight: 800; }
      .panel-note { font-size: 14px; font-weight: 500; fill: #475569; }
      .level { font-size: 24px; font-weight: 800; }
      .row-label { font-size: 13px; font-weight: 700; fill: #475569; letter-spacing: 0.04em; }
      .body { font-size: 16px; font-weight: 500; fill: #1e293b; }
      .small { font-size: 14px; font-weight: 500; fill: #334155; }
      .chip { font-size: 13px; font-weight: 700; fill: #1e293b; }
    </style>
  </defs>

  <rect width="1200" height="980" fill="url(#bg)"/>
  <rect x="28" y="28" width="1144" height="924" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <text x="72" y="88" class="eyebrow">TEST LEVEL OVERVIEW</text>
  <text x="72" y="132" class="title">단위 → 통합 → 시스템 → 인수 테스트</text>
  <text x="72" y="168" class="subtitle">아래로 내려갈수록 검증 범위는 넓어지고, 관점은 개발자 중심에서 사용자·운영·규제 중심으로 이동한다.</text>

  <g transform="translate(64 214)">
    <rect x="0" y="0" width="632" height="668" rx="28" fill="#f8fafc" stroke="#dbeafe"/>
    <text x="28" y="42" class="panel-title">테스트 레벨 사다리</text>
    <text x="28" y="68" class="panel-note">각 단계가 무엇을 검증하는지 한 줄로 비교한다.</text>

    <g transform="translate(28 98)">
      <rect x="0" y="0" width="576" height="118" rx="22" fill="#dbeafe" stroke="#60a5fa"/>
      <text x="24" y="42" class="level">1. 단위 테스트</text>
      <text x="24" y="68" class="row-label">범위</text>
      <text x="88" y="68" class="body">함수, 메서드, 클래스 같은 가장 작은 개발 단위</text>
      <text x="24" y="92" class="row-label">관점</text>
      <text x="88" y="92" class="small">개발자가 로직·경계값·예외 처리를 빠르게 확인</text>
      <text x="24" y="112" class="row-label">핵심 질문</text>
      <text x="118" y="112" class="small">이 함수가 입력 조건대로 정확히 계산되는가?</text>
      <rect x="458" y="18" width="92" height="28" rx="14" fill="#ffffff"/>
      <text x="504" y="37" text-anchor="middle" class="chip">Mock / Stub</text>
    </g>

    <g transform="translate(28 238)">
      <rect x="0" y="0" width="576" height="128" rx="22" fill="#e0e7ff" stroke="#818cf8"/>
      <text x="24" y="42" class="level">2. 통합 테스트</text>
      <text x="24" y="68" class="row-label">범위</text>
      <text x="88" y="68" class="body">서비스, DB, 외부 API처럼 연결된 모듈 사이의 인터페이스</text>
      <text x="24" y="92" class="row-label">관점</text>
      <text x="88" y="92" class="small">데이터 흐름, 트랜잭션 경계, 연동 실패 처리 검증</text>
      <text x="24" y="116" class="row-label">핵심 질문</text>
      <text x="118" y="116" class="small">모듈을 연결했을 때 요청·응답·롤백이 기대대로 이어지는가?</text>
      <rect x="446" y="18" width="104" height="28" rx="14" fill="#ffffff"/>
      <text x="498" y="37" text-anchor="middle" class="chip">Driver / Stub</text>
    </g>

    <g transform="translate(28 388)">
      <rect x="0" y="0" width="576" height="128" rx="22" fill="#ede9fe" stroke="#a78bfa"/>
      <text x="24" y="42" class="level">3. 시스템 테스트</text>
      <text x="24" y="68" class="row-label">범위</text>
      <text x="88" y="68" class="body">완성된 전체 시스템의 기능, 성능, 보안, 복구 시나리오</text>
      <text x="24" y="92" class="row-label">관점</text>
      <text x="88" y="92" class="small">테스터·품질·운영이 SLA와 비기능 요구사항을 함께 확인</text>
      <text x="24" y="116" class="row-label">핵심 질문</text>
      <text x="118" y="116" class="small">실서비스 수준 부하와 장애 상황에서도 시스템 전체가 버티는가?</text>
      <rect x="468" y="18" width="82" height="28" rx="14" fill="#ffffff"/>
      <text x="509" y="37" text-anchor="middle" class="chip">RTO / RPO</text>
    </g>

    <g transform="translate(28 538)">
      <rect x="0" y="0" width="576" height="102" rx="22" fill="#fae8ff" stroke="#e879f9"/>
      <text x="24" y="42" class="level">4. 인수 테스트</text>
      <text x="24" y="68" class="row-label">범위</text>
      <text x="88" y="68" class="body">업무 담당자, 고객, 규제 기준이 요구하는 인수 조건</text>
      <text x="24" y="92" class="row-label">핵심 질문</text>
      <text x="118" y="92" class="small">이 서비스를 실제 운영·업무 절차에 올려도 되는가?</text>
      <rect x="490" y="18" width="60" height="28" rx="14" fill="#ffffff"/>
      <text x="520" y="37" text-anchor="middle" class="chip">UAT</text>
    </g>
  </g>

  <g transform="translate(724 214)">
    <rect x="0" y="0" width="412" height="316" rx="28" fill="#fff7ed" stroke="#fdba74"/>
    <text x="28" y="42" class="panel-title">통합 테스트 방식</text>
    <text x="28" y="68" class="panel-note">Driver·Stub 사용 위치를 이해하면 표 구분이 쉬워진다.</text>

    <g transform="translate(28 98)">
      <rect x="0" y="0" width="168" height="76" rx="18" fill="#ffffff" stroke="#fdba74"/>
      <text x="16" y="28" class="level" style="font-size:20px;">빅뱅 통합</text>
      <text x="16" y="50" class="small">모든 모듈을 한 번에 결합</text>
      <text x="16" y="68" class="small">원인 추적은 가장 어렵다.</text>

      <rect x="188" y="0" width="168" height="76" rx="18" fill="#ffffff" stroke="#fdba74"/>
      <text x="204" y="28" class="level" style="font-size:20px;">상향식 통합</text>
      <text x="204" y="50" class="small">하위 모듈부터 차례로 결합</text>
      <text x="204" y="68" class="small">상위 대체용 Driver가 필요할 수 있다.</text>

      <rect x="0" y="98" width="168" height="92" rx="18" fill="#ffffff" stroke="#fdba74"/>
      <text x="16" y="126" class="level" style="font-size:20px;">하향식 통합</text>
      <text x="16" y="148" class="small">상위 흐름부터 먼저 검증</text>
      <text x="16" y="166" class="small">하위 대체용 Stub이 필요할 수 있다.</text>
      <text x="16" y="184" class="small">초기 화면·API 흐름 확인에 유리</text>

      <rect x="188" y="98" width="168" height="92" rx="18" fill="#ffffff" stroke="#fdba74"/>
      <text x="204" y="126" class="level" style="font-size:20px;">샌드위치 통합</text>
      <text x="204" y="148" class="small">상향식과 하향식을 병행</text>
      <text x="204" y="166" class="small">병렬 진행은 쉽지만 관리가 복잡</text>
      <text x="204" y="184" class="small">복합 서비스에서 자주 사용</text>
    </g>
  </g>

  <g transform="translate(724 556)">
    <rect x="0" y="0" width="412" height="326" rx="28" fill="#f0fdf4" stroke="#86efac"/>
    <text x="28" y="42" class="panel-title">회귀 테스트 vs 스모크 테스트</text>
    <text x="28" y="68" class="panel-note">둘 다 배포 안정성을 돕지만, 깊이와 시점이 다르다.</text>

    <g transform="translate(28 100)">
      <rect x="0" y="0" width="356" height="86" rx="18" fill="#ffffff" stroke="#bbf7d0"/>
      <text x="18" y="28" class="level" style="font-size:20px;">회귀 테스트</text>
      <text x="18" y="50" class="body">기능 변경 이후 기존 기능이 깨지지 않았는지 다시 확인</text>
      <text x="18" y="72" class="small">범위: 영향 모듈 전체 또는 핵심 업무 시나리오까지 심층 검증</text>

      <rect x="0" y="104" width="356" height="86" rx="18" fill="#ffffff" stroke="#bbf7d0"/>
      <text x="18" y="132" class="level" style="font-size:20px;">스모크 테스트</text>
      <text x="18" y="154" class="body">빌드·배포 직후 핵심 기능이 최소한 동작하는지 빠르게 점검</text>
      <text x="18" y="176" class="small">범위: 로그인, 잔액조회, 송금 API 같은 대표 경로 중심 얕은 확인</text>

      <rect x="0" y="208" width="356" height="86" rx="18" fill="#dcfce7" stroke="#86efac"/>
      <text x="18" y="236" class="row-label">기억 포인트</text>
      <text x="18" y="258" class="body">회귀는 “변경 영향 확인”, 스모크는 “다음 테스트로 넘어가도 되는지 확인”이다.</text>
      <text x="18" y="280" class="small">금융 서비스에서는 둘 다 자동화해 빠른 실패 감지와 릴리스 안전성을 높인다.</text>
    </g>
  </g>

  <text x="72" y="922" class="small">요약: 단위는 로직 정확성, 통합은 연결 품질, 시스템은 전체 요구사항, 인수는 실제 업무 채택 가능성을 검증한다.</text>
</svg>
