<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">13-01-02. 서브쿼리 실행 직관</title>
  <desc id="desc">비상관 서브쿼리는 한 번 실행되어 집합을 만들고, 상관 서브쿼리는 바깥 행마다 조건을 다시 확인할 수 있음을 비교하는 SVG</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#0f766e"/>
    </marker>
  </defs>
  <style>
    text { font-family: "Noto Sans KR", "Apple SD Gothic Neo", sans-serif; fill: #0f172a; }
    .eyebrow { font-size: 17px; font-weight: 700; fill: #475569; }
    .title { font-size: 34px; font-weight: 800; }
    .subtitle { font-size: 18px; font-weight: 500; fill: #334155; }
    .section { font-size: 22px; font-weight: 800; }
    .label { font-size: 18px; font-weight: 700; }
    .body { font-size: 16px; font-weight: 500; fill: #334155; }
    .small { font-size: 14px; font-weight: 600; fill: #475569; }
    .mono { font-size: 15px; font-weight: 700; fill: #1e293b; font-family: "SFMono-Regular", "Menlo", monospace; }
    .pill { font-size: 14px; font-weight: 800; fill: #ffffff; }
  </style>

  <rect width="1200" height="820" fill="#f8fafc"/>
  <rect x="28" y="28" width="1144" height="764" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <text x="72" y="82" class="eyebrow">데이터베이스 · SUBQUERY</text>
  <text x="72" y="126" class="title">서브쿼리 실행 직관</text>
  <text x="72" y="160" class="subtitle">비상관은 한 번 구한 집합을 쓰고, 상관은 바깥 행과 연결되어 행마다 다시 판정될 수 있다.</text>

  <rect x="64" y="196" width="500" height="458" rx="24" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/>
  <rect x="636" y="196" width="500" height="458" rx="24" fill="#ecfeff" stroke="#67e8f9" stroke-width="2"/>

  <text x="88" y="236" class="section">1) 비상관 서브쿼리</text>
  <text x="660" y="236" class="section">2) 상관 서브쿼리</text>

  <rect x="88" y="262" width="452" height="70" rx="16" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
  <rect x="660" y="262" width="452" height="70" rx="16" fill="#ffffff" stroke="#a5f3fc" stroke-width="1.5"/>
  <text x="108" y="288" class="mono">SELECT customer_id FROM orders WHERE amount &gt; 100</text>
  <text x="680" y="288" class="mono">WHERE EXISTS (SELECT 1 FROM orders o</text>
  <text x="680" y="312" class="mono">  WHERE o.customer_id = c.customer_id AND o.amount &gt; 100)</text>

  <rect x="110" y="360" width="408" height="74" rx="18" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <circle cx="146" cy="397" r="20" fill="#15803d"/>
  <text x="146" y="403" text-anchor="middle" class="pill">1</text>
  <text x="178" y="390" class="label">안쪽 쿼리를 먼저 한 번 실행</text>
  <text x="178" y="414" class="body">orders에서 amount &gt; 100인 customer_id만 뽑는다.</text>

  <rect x="110" y="468" width="408" height="74" rx="18" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <circle cx="146" cy="505" r="20" fill="#15803d"/>
  <text x="146" y="511" text-anchor="middle" class="pill">2</text>
  <text x="178" y="498" class="label">중간 결과 집합 생성</text>
  <text x="178" y="522" class="body">예: {1} 을 만들어 바깥 쿼리에 넘긴다.</text>

  <rect x="110" y="576" width="408" height="56" rx="18" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <circle cx="146" cy="604" r="20" fill="#15803d"/>
  <text x="146" y="610" text-anchor="middle" class="pill">3</text>
  <text x="178" y="598" class="label">바깥 쿼리가 customers를 필터링</text>
  <text x="178" y="620" class="body">customer_id IN {1} 이므로 Kim만 남는다.</text>

  <line x1="314" y1="434" x2="314" y2="468" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="314" y1="542" x2="314" y2="576" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="682" y="360" width="408" height="74" rx="18" fill="#ffffff" stroke="#0891b2" stroke-width="2"/>
  <circle cx="718" cy="397" r="20" fill="#0f766e"/>
  <text x="718" y="403" text-anchor="middle" class="pill">1</text>
  <text x="750" y="390" class="label">바깥 쿼리가 고객 한 행을 읽음</text>
  <text x="750" y="414" class="body">예: Kim → Lee → Park 순서로 후보를 본다.</text>

  <rect x="682" y="468" width="408" height="74" rx="18" fill="#ffffff" stroke="#0891b2" stroke-width="2"/>
  <circle cx="718" cy="505" r="20" fill="#0f766e"/>
  <text x="718" y="511" text-anchor="middle" class="pill">2</text>
  <text x="750" y="498" class="label">각 고객마다 안쪽 조건을 다시 확인</text>
  <text x="750" y="522" class="body">해당 고객의 주문 중 amount &gt; 100 이 있는지 검사한다.</text>

  <rect x="682" y="576" width="408" height="56" rx="18" fill="#ffffff" stroke="#0891b2" stroke-width="2"/>
  <circle cx="718" cy="604" r="20" fill="#0f766e"/>
  <text x="718" y="610" text-anchor="middle" class="pill">3</text>
  <text x="750" y="598" class="label">행별 판정 결과</text>
  <text x="750" y="620" class="body">Kim 통과 / Lee 제외 / Park 제외</text>

  <line x1="886" y1="434" x2="886" y2="468" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="886" y1="542" x2="886" y2="576" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="64" y="682" width="1072" height="96" rx="22" fill="#0f172a"/>
  <text x="92" y="712" class="label" fill="#f8fafc">실무·시험 체크</text>
  <text x="92" y="738" class="body" fill="#cbd5e1">비상관은 “먼저 한 번 구한 결과를 활용”, 상관은 “바깥 행마다 다시 확인 가능”으로 기억한다.</text>
  <text x="92" y="761" class="body" fill="#cbd5e1">결과가 같아도 IN과 EXISTS는 실행 계획이 달라질 수 있고, NOT IN은 NULL 처리에 특히 주의한다.</text>
</svg>
