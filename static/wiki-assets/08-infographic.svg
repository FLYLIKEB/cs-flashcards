<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">08. 네트워크 개요 인포그래픽</title>
  <desc id="desc">네트워크 페이지의 핵심 주제인 OSI 7계층, TCP와 UDP, HTTP·DNS·TLS, 라우팅과 서브넷을 네 개의 카드로 정리한 인포그래픽</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fbff" />
      <stop offset="100%" stop-color="#eef6ff" />
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <style>
      .title { font: 700 34px sans-serif; fill: #0f172a; }
      .subtitle { font: 500 17px sans-serif; fill: #334155; }
      .eyebrow { font: 700 13px sans-serif; fill: #0b5cab; letter-spacing: 0.08em; }
      .cardTitle { font: 700 24px sans-serif; fill: #0f172a; }
      .cardLead { font: 600 14px sans-serif; fill: #1e40af; }
      .label { font: 700 16px sans-serif; fill: #0f172a; }
      .body { font: 500 14px sans-serif; fill: #334155; }
      .tiny { font: 600 12px sans-serif; fill: #475569; }
      .footerTitle { font: 700 18px sans-serif; fill: #ffffff; }
      .footerText { font: 500 14px sans-serif; fill: #dbeafe; }
      .pill { font: 700 12px sans-serif; fill: #075985; }
    </style>
  </defs>

  <rect width="1200" height="900" fill="#dbe7f5" />
  <rect x="24" y="24" width="1152" height="852" rx="32" fill="url(#bg)" />
  <rect x="56" y="52" width="1088" height="176" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
  <rect x="88" y="84" width="220" height="32" rx="16" fill="#dbeafe" />
  <text class="pill" x="198" y="105" text-anchor="middle">금융공기업 IT · 네트워크 메인</text>
  <text class="title" x="88" y="154">08. 네트워크를 4개의 시험 축으로 나누어 보기</text>
  <text class="subtitle" x="88" y="190">문제는 보통 계층, 전송 방식, 웹 보안 절차, 경로 계산 중 어디를 묻는지부터 구분하면 빠르게 풀린다.</text>
  <rect x="842" y="88" width="256" height="104" rx="22" fill="url(#hero)" />
  <text x="870" y="123" font-family="sans-serif" font-size="16" font-weight="700" fill="#e0f2fe">빠른 분류법</text>
  <text x="870" y="151" font-family="sans-serif" font-size="25" font-weight="700" fill="#ffffff">계층 → 전송 → 웹 보안 → 경로</text>
  <text x="870" y="176" font-family="sans-serif" font-size="14" font-weight="500" fill="#dbeafe">시험 문장을 읽을 때 이 순서로 분류</text>

  <rect x="56" y="258" width="510" height="248" rx="26" fill="#ffffff" stroke="#93c5fd" stroke-width="2" />
  <text class="eyebrow" x="88" y="298">AXIS 1</text>
  <text class="cardTitle" x="88" y="332">OSI 7계층 / TCP-IP 묶음</text>
  <text class="cardLead" x="88" y="356">기능이 어느 계층에 속하는지 구별하는 파트</text>
  <rect x="88" y="382" width="212" height="38" rx="12" fill="#dbeafe" />
  <text class="label" x="104" y="406">상위 계층 7~5</text>
  <text class="body" x="220" y="406">응용 · 표현 · 세션</text>
  <rect x="88" y="430" width="212" height="38" rx="12" fill="#dcfce7" />
  <text class="label" x="104" y="454">전송 계층 4</text>
  <text class="body" x="220" y="454">TCP · UDP · 포트</text>
  <rect x="88" y="478" width="212" height="38" rx="12" fill="#fef3c7" />
  <text class="label" x="104" y="502">하위 계층 3~1</text>
  <text class="body" x="220" y="502">IP · Ethernet · 물리 신호</text>
  <rect x="324" y="382" width="210" height="134" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text class="label" x="344" y="410">시험 포인트</text>
  <text class="body" x="344" y="438">• 라우팅은 3계층</text>
  <text class="body" x="344" y="464">• 포트 번호는 4계층</text>
  <text class="body" x="344" y="490">• HTTP는 7계층</text>

  <rect x="634" y="258" width="510" height="248" rx="26" fill="#ffffff" stroke="#7dd3fc" stroke-width="2" />
  <text class="eyebrow" x="666" y="298">AXIS 2</text>
  <text class="cardTitle" x="666" y="332">TCP vs UDP</text>
  <text class="cardLead" x="666" y="356">신뢰성을 택할지, 지연 감소를 택할지 비교하는 파트</text>
  <rect x="666" y="382" width="218" height="116" rx="18" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5" />
  <text class="label" x="688" y="410">TCP</text>
  <text class="body" x="688" y="438">• 연결형, 3-way handshake</text>
  <text class="body" x="688" y="464">• 재전송 · ACK · 순서 보장</text>
  <text class="body" x="688" y="490">• 웹, 파일전송처럼 신뢰성 중시</text>
  <rect x="902" y="382" width="210" height="116" rx="18" fill="#ecfeff" stroke="#22d3ee" stroke-width="1.5" />
  <text class="label" x="924" y="410">UDP</text>
  <text class="body" x="924" y="438">• 비연결형, 작은 헤더</text>
  <text class="body" x="924" y="464">• 순서 · 재전송 보장 없음</text>
  <text class="body" x="924" y="490">• DNS, VoIP, 스트리밍에 적합</text>

  <rect x="56" y="536" width="510" height="248" rx="26" fill="#ffffff" stroke="#67e8f9" stroke-width="2" />
  <text class="eyebrow" x="88" y="576">AXIS 3</text>
  <text class="cardTitle" x="88" y="610">HTTP · DNS · TLS</text>
  <text class="cardLead" x="88" y="634">웹 접속 순서를 단계별로 묻는 파트</text>
  <rect x="88" y="656" width="142" height="92" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text class="label" x="110" y="684">1 DNS</text>
  <text class="body" x="110" y="710">이름을 IP로 변환</text>
  <text class="tiny" x="110" y="732">A · AAAA · CNAME</text>
  <rect x="240" y="656" width="142" height="92" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text class="label" x="262" y="684">2 TLS</text>
  <text class="body" x="262" y="710">인증서 확인, 키 교환</text>
  <text class="tiny" x="262" y="732">기밀성 · 무결성 · 인증</text>
  <rect x="392" y="656" width="142" height="92" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text class="label" x="414" y="684">3 HTTP</text>
  <text class="body" x="414" y="710">GET/POST와 상태 코드</text>
  <text class="tiny" x="414" y="732">헤더 · 쿠키 · Host</text>
  <path d="M 230 702 H 240" stroke="#0891b2" stroke-width="3" />
  <path d="M 382 702 H 392" stroke="#0891b2" stroke-width="3" />

  <rect x="634" y="536" width="510" height="248" rx="26" fill="#ffffff" stroke="#93c5fd" stroke-width="2" />
  <text class="eyebrow" x="666" y="576">AXIS 4</text>
  <text class="cardTitle" x="666" y="610">라우팅 · 서브넷</text>
  <text class="cardLead" x="666" y="634">경로 선택과 주소 범위 계산을 묻는 파트</text>
  <rect x="666" y="656" width="206" height="94" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5" />
  <text class="label" x="688" y="684">라우팅 테이블</text>
  <text class="body" x="688" y="710">0.0.0.0/0 → 기본 게이트웨이</text>
  <text class="body" x="688" y="734">가장 구체적인 목적지 경로 선택</text>
  <rect x="892" y="656" width="220" height="94" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
  <text class="label" x="914" y="684">CIDR 예시</text>
  <text class="body" x="914" y="710">192.168.1.10/28</text>
  <text class="body" x="914" y="734">네트워크 .0 / 브로드캐스트 .15</text>

  <rect x="56" y="810" width="1088" height="42" rx="18" fill="#0f172a" />
  <text class="footerTitle" x="82" y="837">시험 직전 한 줄:</text>
  <text class="footerText" x="222" y="837">어느 계층 문제인지 먼저 구분하고, 그다음 전송 방식·웹 절차·경로 계산으로 좁히면 된다.</text>
</svg>
