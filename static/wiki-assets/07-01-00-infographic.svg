<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="920" viewBox="0 0 1280 920" role="img" aria-labelledby="title desc">
  <title id="title">07-01. 관계형 데이터베이스 기본 SVG 인포그래픽</title>
  <desc id="desc">릴레이션, 튜플, 속성, 스키마와 인스턴스, 기본키와 외래키, 무결성 제약을 고객과 계좌 예시로 설명하는 인포그래픽</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fbff" />
      <stop offset="100%" stop-color="#eefbf7" />
    </linearGradient>
    <style>
      .title { font: 700 38px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .subtitle { font: 500 18px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
      .section { font: 700 23px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .label { font: 700 17px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .body { font: 500 15px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
      .small { font: 500 13px 'Pretendard','Noto Sans KR',sans-serif; fill: #475569; }
      .chip { font: 700 13px 'Pretendard','Noto Sans KR',sans-serif; fill: #115e59; }
      .note { font: 700 14px 'Pretendard','Noto Sans KR',sans-serif; fill: #92400e; }
      .footer { font: 600 13px 'Pretendard','Noto Sans KR',sans-serif; fill: #e2e8f0; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#0f766e" />
    </marker>
  </defs>

  <rect width="1280" height="920" fill="#e2e8f0" />
  <rect x="28" y="28" width="1224" height="864" rx="34" fill="url(#bg)" />
  <rect x="56" y="56" width="1168" height="808" rx="28" fill="#ffffff" />

  <text class="title" x="92" y="118">07-01. 관계형 데이터베이스 기본</text>
  <text class="subtitle" x="92" y="154">표로 저장하고, 키와 제약으로 연결하면 중복을 줄이면서 정확성을 지킬 수 있다.</text>

  <rect x="84" y="196" width="500" height="474" rx="26" fill="#f8fafc" stroke="#bfdbfe" stroke-width="2" />
  <rect x="604" y="196" width="280" height="474" rx="26" fill="#f8fafc" stroke="#99f6e4" stroke-width="2" />
  <rect x="904" y="196" width="292" height="474" rx="26" fill="#f8fafc" stroke="#fde68a" stroke-width="2" />

  <text class="section" x="114" y="240">1. 릴레이션의 구성요소</text>
  <text class="body" x="114" y="270">릴레이션은 표 전체, 튜플은 한 행, 속성은 열 이름이다.</text>

  <rect x="114" y="300" width="440" height="274" rx="22" fill="#ffffff" stroke="#0f766e" stroke-width="2.5" />
  <rect x="114" y="300" width="440" height="46" rx="22" fill="#ccfbf1" />
  <rect x="114" y="324" width="440" height="22" fill="#ccfbf1" />
  <line x1="246" y1="300" x2="246" y2="574" stroke="#94a3b8" stroke-width="1.5" />
  <line x1="398" y1="300" x2="398" y2="574" stroke="#94a3b8" stroke-width="1.5" />
  <line x1="114" y1="346" x2="554" y2="346" stroke="#94a3b8" stroke-width="1.5" />
  <line x1="114" y1="404" x2="554" y2="404" stroke="#cbd5e1" stroke-width="1.5" />
  <line x1="114" y1="462" x2="554" y2="462" stroke="#cbd5e1" stroke-width="1.5" />
  <line x1="114" y1="520" x2="554" y2="520" stroke="#cbd5e1" stroke-width="1.5" />

  <text class="label" x="180" y="330" text-anchor="middle">고객번호</text>
  <text class="label" x="322" y="330" text-anchor="middle">고객명</text>
  <text class="label" x="476" y="330" text-anchor="middle">등급</text>

  <text class="body" x="180" y="385" text-anchor="middle">C001</text>
  <text class="body" x="322" y="385" text-anchor="middle">김민수</text>
  <text class="body" x="476" y="385" text-anchor="middle">VIP</text>
  <text class="body" x="180" y="443" text-anchor="middle">C002</text>
  <text class="body" x="322" y="443" text-anchor="middle">이서연</text>
  <text class="body" x="476" y="443" text-anchor="middle">일반</text>
  <text class="body" x="180" y="501" text-anchor="middle">C003</text>
  <text class="body" x="322" y="501" text-anchor="middle">박준호</text>
  <text class="body" x="476" y="501" text-anchor="middle">우수</text>

  <rect x="137" y="355" width="394" height="36" rx="11" fill="#14b8a6" opacity="0.14" />
  <text class="chip" x="98" y="378">튜플</text>
  <line x1="110" y1="373" x2="132" y2="373" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arrow)" />

  <rect x="138" y="307" width="88" height="28" rx="10" fill="#0ea5e9" opacity="0.16" />
  <text class="chip" x="182" y="291" text-anchor="middle">속성</text>
  <line x1="182" y1="295" x2="182" y2="304" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arrow)" />

  <text class="chip" x="364" y="286">릴레이션 = 고객 테이블 전체</text>
  <line x1="432" y1="291" x2="526" y2="291" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arrow)" />

  <rect x="114" y="594" width="440" height="52" rx="16" fill="#e0f2fe" />
  <text class="small" x="136" y="614">시험에서는 테이블↔릴레이션, 행↔튜플,</text>
  <text class="small" x="136" y="634">열↔속성을 바꿔 묻는 경우가 많다.</text>

  <text class="section" x="634" y="240">2. 스키마와 인스턴스</text>
  <text class="body" x="634" y="270">설계도는 스키마,</text>
  <text class="body" x="634" y="292">현재 저장된 실제 값은 인스턴스다.</text>

  <rect x="634" y="308" width="220" height="176" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2" />
  <text class="label" x="654" y="338">스키마</text>
  <text class="body" x="654" y="366">고객(고객번호 PK,</text>
  <text class="body" x="654" y="388">고객명, 등급)</text>
  <text class="body" x="654" y="414">계좌(계좌번호 PK,</text>
  <text class="body" x="654" y="436">고객번호 FK, 잔액)</text>
  <text class="small" x="654" y="462">속성 이름·자료형·제약조건을</text>
  <text class="small" x="654" y="480">정의한 설계도</text>

  <line x1="744" y1="500" x2="744" y2="538" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)" />

  <rect x="634" y="554" width="220" height="110" rx="18" fill="#ecfeff" stroke="#14b8a6" stroke-width="2" />
  <text class="label" x="654" y="584">인스턴스</text>
  <text class="body" x="654" y="612">C001, 김민수, VIP</text>
  <text class="body" x="654" y="636">A101, C001, 5,000,000</text>
  <text class="small" x="654" y="656">지금 이 순간 저장된 실제 값</text>

  <text class="section" x="934" y="240">3. 키와 무결성</text>
  <text class="body" x="934" y="270">기본키는 행을 구분하고,</text>
  <text class="body" x="934" y="292">외래키는 다른 표와 연결한다.</text>

  <rect x="934" y="320" width="232" height="124" rx="18" fill="#ffffff" stroke="#0f766e" stroke-width="2" />
  <rect x="934" y="320" width="232" height="38" rx="18" fill="#dcfce7" />
  <text class="label" x="954" y="345">고객 테이블</text>
  <text class="body" x="954" y="378">PK 고객번호 = C001</text>
  <text class="body" x="954" y="404">고객명 = 김민수</text>
  <text class="body" x="954" y="430">등급 = VIP</text>

  <rect x="934" y="484" width="232" height="124" rx="18" fill="#ffffff" stroke="#0f766e" stroke-width="2" />
  <rect x="934" y="484" width="232" height="38" rx="18" fill="#fef3c7" />
  <text class="label" x="954" y="509">계좌 테이블</text>
  <text class="body" x="954" y="542">PK 계좌번호 = A101</text>
  <text class="body" x="954" y="568">FK 고객번호 = C001</text>
  <text class="body" x="954" y="594">잔액 = 5,000,000</text>

  <line x1="1050" y1="444" x2="1050" y2="484" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)" />
  <text class="chip" x="1050" y="468" text-anchor="middle">같은 고객번호로 연결</text>

  <rect x="84" y="706" width="1112" height="118" rx="24" fill="#0f172a" />
  <text class="section" x="114" y="746" fill="#f8fafc">무결성 제약 한 번에 보기</text>

  <rect x="114" y="764" width="320" height="42" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
  <text class="footer" x="134" y="790">엔터티 무결성: 기본키는 NULL이면 안 된다.</text>

  <rect x="452" y="764" width="338" height="42" rx="14" fill="#1e293b" stroke="#34d399" stroke-width="1.5" />
  <text class="footer" x="472" y="790">참조 무결성: 외래키는 존재하는 기본키만 참조한다.</text>

  <rect x="808" y="764" width="358" height="42" rx="14" fill="#1e293b" stroke="#fbbf24" stroke-width="1.5" />
  <text class="footer" x="828" y="790">도메인 무결성: 속성값은 정해진 범위와 형식을 지킨다.</text>

  <rect x="946" y="630" width="208" height="30" rx="15" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5" />
  <text class="note" x="1050" y="650" text-anchor="middle">핵심: 중복 저장보다 연결이 우선</text>
</svg>
