<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">07. 데이터베이스 학습 지도 인포그래픽</title>
  <desc id="desc">관계형 모델, 키와 무결성, 정규화, SQL, 트랜잭션, 인덱스와 동시성을 하나의 데이터베이스 학습 지도로 연결한 SVG</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="hub" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
    </marker>
    <style>
      .title { font: 700 36px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .subtitle { font: 500 17px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
      .section { font: 700 20px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .label { font: 700 15px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .body { font: 500 14px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
      .small { font: 600 12px 'Pretendard','Noto Sans KR',sans-serif; fill: #475569; }
      .hubTitle { font: 700 28px 'Pretendard','Noto Sans KR',sans-serif; fill: #ffffff; }
      .hubBody { font: 500 15px 'Pretendard','Noto Sans KR',sans-serif; fill: #dbeafe; }
    </style>
  </defs>

  <rect width="1200" height="720" fill="url(#bg)"/>
  <rect x="32" y="32" width="1136" height="656" rx="32" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <text class="small" x="80" y="84">금융공기업 IT · 데이터베이스 단원 한눈에 보기</text>
  <text class="title" x="80" y="124">07. 데이터베이스</text>
  <text class="subtitle" x="80" y="156">관계형 모델 위에 키·정규화·SQL·회복·인덱스를 쌓아 설계, 질의, 무결성, 성능을 함께 이해한다.</text>

  <circle cx="600" cy="395" r="150" fill="#dbeafe" opacity="0.5"/>
  <circle cx="600" cy="395" r="118" fill="url(#hub)"/>
  <ellipse cx="600" cy="335" rx="56" ry="16" fill="#bfdbfe" opacity="0.95"/>
  <rect x="544" y="335" width="112" height="76" rx="10" fill="#93c5fd" opacity="0.9"/>
  <ellipse cx="600" cy="411" rx="56" ry="16" fill="#60a5fa" opacity="0.95"/>
  <ellipse cx="600" cy="335" rx="56" ry="16" fill="none" stroke="#eff6ff" stroke-width="2"/>
  <ellipse cx="600" cy="411" rx="56" ry="16" fill="none" stroke="#dbeafe" stroke-width="2"/>
  <text class="hubTitle" x="600" y="470" text-anchor="middle">관계형 DB</text>
  <text class="hubBody" x="600" y="494" text-anchor="middle">구조화된 데이터 저장 · 조회 · 보호</text>

  <path d="M 600 245 C 600 215, 600 198, 600 174" fill="none" stroke="url(#line)" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M 493 288 C 420 250, 370 223, 318 196" fill="none" stroke="url(#line)" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M 707 288 C 780 250, 830 223, 882 196" fill="none" stroke="url(#line)" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M 495 503 C 420 540, 370 568, 318 595" fill="none" stroke="url(#line)" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M 600 545 C 600 575, 600 592, 600 616" fill="none" stroke="url(#line)" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M 705 503 C 780 540, 830 568, 882 595" fill="none" stroke="url(#line)" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g transform="translate(430 188)">
    <rect x="0" y="0" width="340" height="112" rx="24" fill="#ecfeff" stroke="#06b6d4" stroke-width="2"/>
    <text class="section" x="170" y="34" text-anchor="middle">관계형 모델 기본</text>
    <text class="body" x="24" y="62">릴레이션 = 테이블 구조, 튜플 = 행, 속성 = 열</text>
    <text class="body" x="24" y="86">스키마가 형태를 정하고 인스턴스가 실제 값을 담는다</text>
    <rect x="248" y="48" width="68" height="20" rx="6" fill="#bae6fd"/>
    <rect x="248" y="72" width="68" height="20" rx="6" fill="#cffafe"/>
    <line x1="270" y1="48" x2="270" y2="92" stroke="#0891b2" stroke-width="1.5"/>
    <line x1="293" y1="48" x2="293" y2="92" stroke="#0891b2" stroke-width="1.5"/>
    <line x1="248" y1="68" x2="316" y2="68" stroke="#0891b2" stroke-width="1.5"/>
  </g>

  <g transform="translate(124 122)">
    <rect x="0" y="0" width="300" height="150" rx="24" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
    <text class="section" x="150" y="34" text-anchor="middle">키와 무결성</text>
    <rect x="26" y="56" width="94" height="34" rx="12" fill="#dcfce7"/>
    <text class="label" x="73" y="78" text-anchor="middle">후보키</text>
    <rect x="136" y="56" width="64" height="34" rx="12" fill="#bbf7d0"/>
    <text class="label" x="168" y="78" text-anchor="middle">기본키</text>
    <rect x="216" y="56" width="58" height="34" rx="12" fill="#dcfce7"/>
    <text class="label" x="245" y="78" text-anchor="middle">외래키</text>
    <path d="M 150 106 L 182 122 L 176 136 L 150 148 L 124 136 L 118 122 Z" fill="#86efac" stroke="#16a34a" stroke-width="2"/>
    <text class="body" x="196" y="126">유일성 · 최소성 · 참조 무결성</text>
  </g>

  <g transform="translate(776 122)">
    <rect x="0" y="0" width="300" height="150" rx="24" fill="#fefce8" stroke="#eab308" stroke-width="2"/>
    <text class="section" x="150" y="34" text-anchor="middle">정규화</text>
    <path d="M 38 118 H 252" fill="none" stroke="#ca8a04" stroke-width="4" stroke-linecap="round"/>
    <circle cx="62" cy="118" r="16" fill="#fde68a"/><text class="label" x="62" y="123" text-anchor="middle">1</text>
    <circle cx="126" cy="118" r="16" fill="#fde68a"/><text class="label" x="126" y="123" text-anchor="middle">2</text>
    <circle cx="190" cy="118" r="16" fill="#fde68a"/><text class="label" x="190" y="123" text-anchor="middle">3</text>
    <circle cx="254" cy="118" r="16" fill="#fde68a"/><text class="label" x="254" y="123" text-anchor="middle">B</text>
    <text class="small" x="44" y="82">원자값</text>
    <text class="small" x="93" y="82">부분 종속 제거</text>
    <text class="small" x="171" y="82">이행 종속 제거</text>
    <text class="small" x="238" y="82">결정자=후보키</text>
  </g>

  <g transform="translate(108 500)">
    <rect x="0" y="0" width="320" height="140" rx="24" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
    <text class="section" x="160" y="34" text-anchor="middle">SQL 질의</text>
    <rect x="24" y="54" width="272" height="58" rx="16" fill="#1e293b"/>
    <text x="40" y="79" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#93c5fd">SELECT dept, COUNT(*)</text>
    <text x="40" y="98" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#cbd5e1">FROM emp GROUP BY dept;</text>
    <text class="body" x="24" y="128">SELECT · JOIN · GROUP BY · 서브쿼리 결과 해석이 핵심</text>
  </g>

  <g transform="translate(430 546)">
    <rect x="0" y="0" width="340" height="124" rx="24" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
    <text class="section" x="170" y="34" text-anchor="middle">트랜잭션과 회복</text>
    <rect x="24" y="52" width="54" height="28" rx="10" fill="#fed7aa"/><text class="label" x="51" y="71" text-anchor="middle">A</text>
    <rect x="86" y="52" width="54" height="28" rx="10" fill="#fed7aa"/><text class="label" x="113" y="71" text-anchor="middle">C</text>
    <rect x="148" y="52" width="54" height="28" rx="10" fill="#fed7aa"/><text class="label" x="175" y="71" text-anchor="middle">I</text>
    <rect x="210" y="52" width="54" height="28" rx="10" fill="#fed7aa"/><text class="label" x="237" y="71" text-anchor="middle">D</text>
    <path d="M 284 50 v46 h26" fill="none" stroke="#ea580c" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>
    <text class="body" x="24" y="102">로그 기록 → 체크포인트 → REDO/UNDO로 장애 복구</text>
  </g>

  <g transform="translate(776 500)">
    <rect x="0" y="0" width="300" height="140" rx="24" fill="#fdf2f8" stroke="#ec4899" stroke-width="2"/>
    <text class="section" x="150" y="34" text-anchor="middle">인덱스와 동시성</text>
    <circle cx="74" cy="88" r="14" fill="#fbcfe8" stroke="#db2777" stroke-width="2"/>
    <circle cx="48" cy="112" r="12" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
    <circle cx="74" cy="112" r="12" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
    <circle cx="100" cy="112" r="12" fill="#fce7f3" stroke="#db2777" stroke-width="2"/>
    <line x1="74" y1="102" x2="48" y2="100" stroke="#db2777" stroke-width="2"/>
    <line x1="74" y1="102" x2="74" y2="100" stroke="#db2777" stroke-width="2"/>
    <line x1="74" y1="102" x2="100" y2="100" stroke="#db2777" stroke-width="2"/>
    <rect x="160" y="62" width="48" height="24" rx="8" fill="#fbcfe8"/>
    <rect x="198" y="86" width="48" height="24" rx="8" fill="#f9a8d4"/>
    <text class="small" x="172" y="78">Lock</text>
    <text class="small" x="208" y="102">Wait</text>
    <text class="body" x="24" y="128">B-Tree 범위 검색 + 락/격리 수준으로 성능과 일관성 관리</text>
  </g>

  <text class="small" x="80" y="670">핵심 흐름: 모델 정의 → 무결성 확보 → 중복 제거 → 질의 작성 → 회복/성능 최적화</text>
</svg>
