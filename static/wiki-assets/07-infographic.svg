<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc">
  <title id="title">07. 데이터베이스 학습 지도 인포그래픽</title>
  <desc id="desc">데이터베이스 단원의 핵심 주제를 고대비 카드형 학습 지도로 정리한 SVG. 관계형 모델을 기반으로 키와 무결성, 정규화, SQL, 트랜잭션과 회복, 인덱스와 동시성을 연결한다.</desc>
  <defs>
    <style>
      .title { font: 700 38px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .subtitle { font: 500 18px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
      .eyebrow { font: 700 13px 'Pretendard','Noto Sans KR',sans-serif; fill: #475569; letter-spacing: 0.08em; }
      .hubTitle { font: 700 34px 'Pretendard','Noto Sans KR',sans-serif; fill: #ffffff; }
      .hubBody { font: 500 17px 'Pretendard','Noto Sans KR',sans-serif; fill: #dbeafe; }
      .cardTitle { font: 700 21px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .cardBody { font: 500 16px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
      .badge { font: 700 13px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .footer { font: 600 14px 'Pretendard','Noto Sans KR',sans-serif; fill: #475569; }
    </style>
    <linearGradient id="pageBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="hubBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="860" fill="url(#pageBg)"/>
  <rect x="28" y="28" width="1144" height="804" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <text class="eyebrow" x="72" y="82">FINANCE IT · DATABASE OVERVIEW</text>
  <text class="title" x="72" y="126">07. 데이터베이스</text>
  <text class="subtitle" x="72" y="160">관계형 모델을 바탕으로 무결성, 중복 제거, 질의 처리, 회복, 성능 최적화를 한 흐름으로 묶어 이해한다.</text>

  <rect x="72" y="194" width="1056" height="124" rx="26" fill="url(#hubBg)"/>
  <text class="hubTitle" x="600" y="242" text-anchor="middle">
    <tspan x="600" dy="0">관계형 DB = 구조화된 데이터를 안전하게 저장하고</tspan>
    <tspan x="600" dy="38">필요한 결과로 꺼내는 체계</tspan>
  </text>
  <text class="hubBody" x="600" y="298" text-anchor="middle">설계 → 무결성 → 질의 → 회복 → 성능 순서로 연결해서 기억한다.</text>

  <g transform="translate(72 352)">
    <rect x="0" y="0" width="500" height="176" rx="24" fill="#ecfeff" stroke="#0891b2" stroke-width="2.5"/>
    <rect x="24" y="24" width="118" height="30" rx="15" fill="#bae6fd"/>
    <text class="badge" x="83" y="44" text-anchor="middle">관계형 모델 기본</text>
    <text class="cardTitle" x="24" y="84">테이블 구조를 읽는 기본 용어부터 잡는다.</text>
    <text class="cardBody" x="24" y="116">• 릴레이션은 테이블 구조다.</text>
    <text class="cardBody" x="24" y="142">• 튜플은 행, 속성은 열이다.</text>
    <text class="cardBody" x="24" y="168">• 스키마와 인스턴스를 구분한다.</text>
  </g>

  <g transform="translate(628 352)">
    <rect x="0" y="0" width="500" height="176" rx="24" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
    <rect x="24" y="24" width="106" height="30" rx="15" fill="#bbf7d0"/>
    <text class="badge" x="77" y="44" text-anchor="middle">키와 무결성</text>
    <text class="cardTitle" x="24" y="84">키는 식별용, 무결성은 규칙 유지용으로 본다.</text>
    <text class="cardBody" x="24" y="116">• 기본키는 중복과 NULL을 허용하지 않는다.</text>
    <text class="cardBody" x="24" y="142">• 외래키는 참조 관계를 유지한다.</text>
    <text class="cardBody" x="24" y="168">• 유일성·최소성도 함께 묶어 암기한다.</text>
  </g>

  <g transform="translate(72 548)">
    <rect x="0" y="0" width="500" height="176" rx="24" fill="#fefce8" stroke="#ca8a04" stroke-width="2.5"/>
    <rect x="24" y="24" width="92" height="30" rx="15" fill="#fde68a"/>
    <text class="badge" x="70" y="44" text-anchor="middle">정규화</text>
    <text class="cardTitle" x="24" y="84">이상현상을 줄이도록 종속을 정리한다.</text>
    <text class="cardBody" x="24" y="116">• 1NF는 원자값만 저장한다.</text>
    <text class="cardBody" x="24" y="142">• 2NF·3NF는 부분·이행 종속을 제거한다.</text>
    <text class="cardBody" x="24" y="168">• BCNF는 모든 결정자가 후보키여야 한다.</text>
  </g>

  <g transform="translate(628 548)">
    <rect x="0" y="0" width="500" height="176" rx="24" fill="#eef2ff" stroke="#4f46e5" stroke-width="2.5"/>
    <rect x="24" y="24" width="160" height="30" rx="15" fill="#c7d2fe"/>
    <text class="badge" x="104" y="44" text-anchor="middle">SQL · 회복 · 성능</text>
    <text class="cardTitle" x="24" y="84">질의 결과와 시스템 안정성을 함께 확인한다.</text>
    <text class="cardBody" x="24" y="116">• SELECT, JOIN, GROUP BY로 결과를 만든다.</text>
    <text class="cardBody" x="24" y="142">• ACID와 로그 복구로 장애 대응을 본다.</text>
    <text class="cardBody" x="24" y="168">• B-Tree, 락, 격리 수준으로 성능을 관리한다.</text>
  </g>

  <g transform="translate(72 744)">
    <rect x="0" y="0" width="1056" height="52" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    <text class="footer" x="36" y="33">학습 연결선: 모델 정의 → 키/무결성 확보 → 정규화로 중복 제거 → SQL/회복 이해 → 인덱스/동시성으로 성능 관리</text>
  </g>
</svg>
