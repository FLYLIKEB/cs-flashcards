  <text class="title" x="84" y="118" text-anchor="start"><tspan x="84" dy="0">17-1. 클라우드 기초</tspan></text>
  <text class="subtitle" x="84" y="180" text-anchor="start"><tspan x="84" dy="0">클라우드 전환의 장점은 탄력성, 빠른 배포, 관리형 서비스 활용이고, 위험은 데이터</tspan><tspan x="84" dy="24">보호, 공급자 종속, 장애 전파, 권한 오남용이다. 따라서 계정 권한, 네트워크</tspan></text>
