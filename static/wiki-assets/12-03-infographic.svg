<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc">
  <title id="title">12-03 문제해결 인포그래픽</title>
  <desc id="desc">문장형 조건을 표와 기호로 바꾸고, 확정 조건과 가능 조건을 분리한 뒤, 가능한 경우를 줄이고 반례로 후보를 제거하는 문제해결 절차를 설명한다.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#eef4ff"/>
    </linearGradient>
    <style>
      .title { font: 700 38px sans-serif; fill: #0f172a; }
      .subtitle { font: 500 18px sans-serif; fill: #334155; }
      .section { font: 700 22px sans-serif; fill: #0f172a; }
      .label { font: 700 16px sans-serif; fill: #0f172a; }
      .body { font: 500 15px sans-serif; fill: #334155; }
      .small { font: 500 13px sans-serif; fill: #475569; }
      .mono { font: 600 15px monospace; fill: #0f172a; }
      .monoSmall { font: 600 13px monospace; fill: #0f172a; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .softBlue { fill: #dbeafe; }
      .softAmber { fill: #fef3c7; }
      .softGreen { fill: #dcfce7; }
      .softRed { fill: #fee2e2; }
      .softSlate { fill: #e2e8f0; }
      .ink { fill: #0f172a; }
      .divider { stroke: #cbd5e1; stroke-width: 1.5; }
      .flow { stroke: #2563eb; stroke-width: 4; stroke-linecap: round; }
      .arrow { fill: #2563eb; }
    </style>
  </defs>

  <rect width="1200" height="920" fill="url(#bg)"/>
  <rect x="28" y="28" width="1144" height="864" rx="28" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>

  <text x="72" y="88" class="small">NCS 문제해결 · 조건 정리 → 경우 축소 → 반례 검증</text>
  <text x="72" y="132" class="title">12-03. 문제해결</text>
  <text x="72" y="164" class="subtitle">머릿속 추측 대신 조건을 적어 두고, 확정 조건과 분기 조건을 분리해 후보를 줄이는 풀이 루틴</text>

  <rect x="64" y="206" width="332" height="294" rx="24" class="card"/>
  <text x="88" y="244" class="section">1. 조건을 문장에서 표기로 바꾼다</text>
  <text x="88" y="276" class="label">예시 조건</text>
  <text x="88" y="304" class="body">• A는 파랑이 아니다</text>
  <text x="88" y="332" class="body">• B는 빨강 또는 초록이다</text>
  <text x="88" y="360" class="body">• C가 초록이면 B는 파랑이다</text>
  <rect x="88" y="386" width="284" height="78" rx="16" class="softBlue"/>
  <text x="108" y="416" class="mono">A ≠ Blue</text>
  <text x="108" y="442" class="mono">B ∈ {Red, Green}</text>
  <text x="108" y="468" class="mono">C = Green → B = Blue</text>
  <text x="88" y="490" class="small">긴 문장을 짧은 기호와 표로 바꾸면 누락과 착각이 줄어든다.</text>

  <rect x="434" y="206" width="332" height="294" rx="24" class="card"/>
  <text x="458" y="244" class="section">2. 확정 조건과 가능 조건을 분리한다</text>
  <rect x="458" y="276" width="128" height="36" rx="12" class="softBlue"/>
  <text x="522" y="299" text-anchor="middle" class="label">확정 조건</text>
  <rect x="606" y="276" width="136" height="36" rx="12" class="softAmber"/>
  <text x="674" y="299" text-anchor="middle" class="label">가능 조건</text>
  <rect x="458" y="328" width="284" height="58" rx="16" class="card"/>
  <text x="478" y="352" class="small">항상 적용</text>
  <text x="478" y="376" class="body">A ≠ Blue, 색은 중복 없이 하나씩 사용</text>
  <rect x="458" y="402" width="284" height="72" rx="16" class="card"/>
  <text x="478" y="426" class="small">케이스마다 확인</text>
  <text x="478" y="450" class="body">B = Red 또는 Green</text>
  <text x="478" y="472" class="body">C = Green 이면 B = Blue</text>
  <text x="458" y="492" class="small">섞어 쓰면 임시 가정을 확정 사실처럼 착각하기 쉽다.</text>

  <rect x="804" y="206" width="332" height="294" rx="24" class="card"/>
  <text x="828" y="244" class="section">3. 경우의 수를 줄이며 후보를 남긴다</text>
  <text x="828" y="276" class="small">순열 6개를 만든 뒤 조건 위배 항목을 바로 지운다.</text>
  <rect x="828" y="296" width="62" height="34" rx="10" class="softSlate"/>
  <rect x="896" y="296" width="112" height="34" rx="10" class="softSlate"/>
  <rect x="1014" y="296" width="98" height="34" rx="10" class="softSlate"/>
  <text x="859" y="318" text-anchor="middle" class="label">번호</text>
  <text x="952" y="318" text-anchor="middle" class="label">A,B,C</text>
  <text x="1063" y="318" text-anchor="middle" class="label">판정</text>

  <rect x="828" y="342" width="284" height="30" rx="10" class="softRed"/>
  <text x="846" y="362" class="monoSmall">1   R,B,G</text>
  <text x="1063" y="362" text-anchor="middle" class="small">② 위배</text>

  <rect x="828" y="380" width="284" height="30" rx="10" class="softGreen"/>
  <text x="846" y="400" class="monoSmall">2   R,G,B</text>
  <text x="1063" y="400" text-anchor="middle" class="small">유지</text>

  <rect x="828" y="418" width="284" height="30" rx="10" class="softRed"/>
  <text x="846" y="438" class="monoSmall">3   B,R,G</text>
  <text x="1063" y="438" text-anchor="middle" class="small">① 위배</text>

  <rect x="828" y="456" width="284" height="30" rx="10" class="softGreen"/>
  <text x="846" y="476" class="monoSmall">5   G,R,B</text>
  <text x="1063" y="476" text-anchor="middle" class="small">유지</text>

  <text x="828" y="498" class="small">남는 후보가 여러 개면 반례와 추가 조건으로 마지막 확인을 한다.</text>

  <rect x="64" y="532" width="1072" height="184" rx="24" fill="#0f172a"/>
  <text x="92" y="572" class="section" fill="#ffffff">4. 시험장에서 쓰는 고정 풀이 흐름</text>

  <rect x="102" y="604" width="168" height="72" rx="20" class="softBlue"/>
  <text x="186" y="632" text-anchor="middle" class="label">1) 조건 추출</text>
  <text x="186" y="656" text-anchor="middle" class="small">밑줄 치고 한 줄씩 분리</text>

  <rect x="306" y="604" width="168" height="72" rx="20" class="softAmber"/>
  <text x="390" y="632" text-anchor="middle" class="label">2) 재표현</text>
  <text x="390" y="656" text-anchor="middle" class="small">표·기호·간단한 도식으로 변환</text>

  <rect x="510" y="604" width="168" height="72" rx="20" class="softBlue"/>
  <text x="594" y="632" text-anchor="middle" class="label">3) 조건 분리</text>
  <text x="594" y="656" text-anchor="middle" class="small">확정 조건과 분기 조건 구분</text>

  <rect x="714" y="604" width="168" height="72" rx="20" class="softGreen"/>
  <text x="798" y="632" text-anchor="middle" class="label">4) 후보 제거</text>
  <text x="798" y="656" text-anchor="middle" class="small">경우의 수를 하나씩 지우기</text>

  <rect x="918" y="604" width="168" height="72" rx="20" class="softGreen"/>
  <text x="1002" y="632" text-anchor="middle" class="label">5) 반례 검증</text>
  <text x="1002" y="656" text-anchor="middle" class="small">유일성·최대/최소 요구 재확인</text>

  <line x1="270" y1="640" x2="306" y2="640" class="flow"/>
  <polygon points="306,640 294,634 294,646" class="arrow"/>
  <line x1="474" y1="640" x2="510" y2="640" class="flow"/>
  <polygon points="510,640 498,634 498,646" class="arrow"/>
  <line x1="678" y1="640" x2="714" y2="640" class="flow"/>
  <polygon points="714,640 702,634 702,646" class="arrow"/>
  <line x1="882" y1="640" x2="918" y2="640" class="flow"/>
  <polygon points="918,640 906,634 906,646" class="arrow"/>

  <rect x="64" y="744" width="1072" height="112" rx="24" class="card"/>
  <text x="92" y="782" class="section">빠른 체크포인트</text>
  <text x="92" y="812" class="body">• 모든 조건을 빠짐없이 추출했는가</text>
  <text x="92" y="838" class="body">• ‘또는’이 포함적 의미인지, 배타적 의미인지 확인했는가</text>
  <text x="574" y="812" class="body">• 확정 조건과 임시 가정을 섞지 않았는가</text>
  <text x="574" y="838" class="body">• 남은 후보를 반례와 문제 요구사항으로 최종 검증했는가</text>

  <text x="1088" y="876" text-anchor="end" class="small">12-03-infographic.svg</text>
</svg>
