<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc">
  <title id="title">17-3. 분산 시스템 이론 인포그래픽</title>
  <desc id="desc">CAP와 PACELC의 선택 기준, CP와 AP 설계 방향, 금융 시스템 운영 원칙을 요약한 인포그래픽</desc>
  <defs>
    <style>
      text { font-family: 'Pretendard', 'Noto Sans KR', sans-serif; fill: #0f172a; }
      .eyebrow { font-size: 15px; font-weight: 700; letter-spacing: 0.08em; fill: #475569; }
      .title { font-size: 36px; font-weight: 800; }
      .subtitle { font-size: 18px; font-weight: 500; fill: #334155; }
      .section { font-size: 22px; font-weight: 800; }
      .label { font-size: 18px; font-weight: 700; }
      .body { font-size: 15px; font-weight: 500; fill: #334155; }
      .small { font-size: 13px; font-weight: 600; fill: #475569; }
      .mono { font-size: 24px; font-weight: 800; letter-spacing: 0.06em; }
    </style>
  </defs>

  <rect width="1200" height="860" fill="#f8fafc"/>
  <rect x="28" y="28" width="1144" height="804" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <text x="72" y="82" class="eyebrow">DISTRIBUTED SYSTEM THEORY</text>
  <text x="72" y="124" class="title">17-3. 분산 시스템 이론</text>
  <text x="72" y="160" class="subtitle">장애가 생기면 CAP에서 C/A를 고르고, 평상시에는 PACELC로 지연과 일관성의 균형을 정한다.</text>

  <g transform="translate(64 198)">
    <rect width="516" height="286" rx="24" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
    <text x="28" y="40" class="section">1) CAP: 분할 상황의 우선순위 결정</text>

    <polygon points="258,88 124,224 392,224" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
    <circle cx="258" cy="88" r="42" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
    <circle cx="124" cy="224" r="40" fill="#dcfce7" stroke="#16a34a" stroke-width="2.5"/>
    <circle cx="392" cy="224" r="40" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>

    <text x="258" y="96" text-anchor="middle" class="mono">P</text>
    <text x="124" y="232" text-anchor="middle" class="mono">C</text>
    <text x="392" y="232" text-anchor="middle" class="mono">A</text>
    <text x="258" y="28" text-anchor="middle" class="small">Partition tolerance</text>
    <text x="124" y="276" text-anchor="middle" class="small">Consistency</text>
    <text x="392" y="276" text-anchor="middle" class="small">Availability</text>

    <rect x="150" y="118" width="216" height="72" rx="16" fill="#312e81"/>
    <text x="258" y="145" text-anchor="middle" font-size="15" font-weight="800" fill="#ffffff">분할이 오면 P는 사실상 유지해야 한다</text>
    <text x="258" y="167" text-anchor="middle" font-size="14" font-weight="700" fill="#c7d2fe">그래서 장애 시점에는</text>
    <text x="258" y="185" text-anchor="middle" font-size="14" font-weight="700" fill="#c7d2fe">C 또는 A 중 우선순위를 선택한다</text>

    <rect x="22" y="78" width="140" height="82" rx="18" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
    <text x="92" y="104" text-anchor="middle" class="label">CP 선택</text>
    <text x="92" y="126" text-anchor="middle" class="body">합의 · 리더 복제</text>
    <text x="92" y="146" text-anchor="middle" class="body">핵심 원장 정합성 우선</text>

    <rect x="354" y="78" width="140" height="82" rx="18" fill="#ffffff" stroke="#dc2626" stroke-width="2"/>
    <text x="424" y="104" text-anchor="middle" class="label">AP 선택</text>
    <text x="424" y="126" text-anchor="middle" class="body">응답성 · 가용성 유지</text>
    <text x="424" y="146" text-anchor="middle" class="body">사후 정합화 허용</text>

    <path d="M 162 122 C 184 118, 206 112, 222 104" fill="none" stroke="#16a34a" stroke-width="3"/>
    <path d="M 354 122 C 332 118, 310 112, 294 104" fill="none" stroke="#dc2626" stroke-width="3"/>
  </g>

  <g transform="translate(604 198)">
    <rect width="532" height="286" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <text x="28" y="40" class="section">2) PACELC: 평상시에도 trade-off가 남는다</text>

    <rect x="28" y="66" width="476" height="84" rx="18" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
    <text x="52" y="96" class="label">Partition 있을 때 (P/E)</text>
    <text x="52" y="120" class="body">장애 구간에서는 Availability 와 Consistency 중 어느 쪽을 지킬지 결정한다.</text>
    <text x="52" y="141" class="body">즉 CAP의 선택이 그대로 드러나는 순간이다.</text>

    <rect x="28" y="168" width="476" height="106" rx="18" fill="#ecfeff" stroke="#06b6d4" stroke-width="2"/>
    <text x="52" y="198" class="label">Else: 분할이 없을 때 (L/C)</text>
    <text x="52" y="222" class="body">평상시에는 낮은 지연과 강한 일관성 사이의 비용을 맞춘다.</text>
    <text x="52" y="243" class="body">복제 거리가 길고 확인 단계가 많을수록 응답은 느려지지만 정합성은 강해진다.</text>

    <rect x="52" y="250" width="164" height="14" rx="7" fill="#38bdf8"/>
    <rect x="216" y="250" width="132" height="14" rx="7" fill="#cbd5e1"/>
    <rect x="348" y="250" width="128" height="14" rx="7" fill="#1d4ed8"/>
    <text x="52" y="294" class="small">빠른 응답이 중요한 서비스</text>
    <text x="468" y="294" text-anchor="end" class="small">정합성 증명이 중요한 원장 시스템</text>
  </g>

  <g transform="translate(64 516)">
    <rect width="1072" height="276" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="28" y="40" class="section">3) 설계 힌트: 시스템 특성에 따라 선택지를 조합한다</text>

    <g transform="translate(28 66)">
      <rect width="312" height="170" rx="20" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
      <text x="20" y="30" class="label">CP 성향 시스템</text>
      <text x="20" y="58" class="body">• 합의와 quorum으로 이중 기록을 막는다</text>
      <text x="20" y="84" class="body">• 계좌 잔액, 주문 원장처럼</text>
      <text x="20" y="104" class="body">  오류 비용이 큰 업무에 적합하다</text>
      <text x="20" y="130" class="body">• 운영 포인트: 리더 전환 시간과 타임아웃</text>
    </g>

    <g transform="translate(380 66)">
      <rect width="312" height="170" rx="20" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
      <text x="20" y="30" class="label">AP / 최종 일관성 성향</text>
      <text x="20" y="58" class="body">• 우선 응답하고 나중에 동기화·보상한다</text>
      <text x="20" y="84" class="body">• 알림, 통계, 분석처럼</text>
      <text x="20" y="104" class="body">  처리량이 중요한 업무에 적합하다</text>
      <text x="20" y="130" class="body">• 운영 포인트: 재시도, 멱등성 키, 보상 로직</text>
    </g>

    <g transform="translate(732 66)">
      <rect width="312" height="170" rx="20" fill="#fefce8" stroke="#eab308" stroke-width="2"/>
      <text x="20" y="30" class="label">공통 안전장치</text>
      <text x="20" y="58" class="body">• 타임아웃, 회로 차단기, 벡프레셔</text>
      <text x="20" y="84" class="body">  로 장애 전파를 늦춘다</text>
      <text x="20" y="104" class="body">• 거래 ID, 감사 로그, 재처리 경로를 남긴다</text>
      <text x="20" y="130" class="body">• 금융권은 허용 불일치 시간부터 정한다</text>
    </g>
  </g>
</svg>
