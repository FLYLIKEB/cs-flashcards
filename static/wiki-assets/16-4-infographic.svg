<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc">
  <title id="title">16-4. 주요 모델과 딥러닝 개요</title>
  <desc id="desc">전통적 머신러닝, 비지도 학습, 딥러닝의 역할과 선택 흐름을 읽기 쉽게 나눈 페이지 전용 SVG</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <style>
      text { font-family: 'Pretendard', 'Noto Sans KR', sans-serif; }
      .eyebrow { font-size: 15px; font-weight: 700; fill: #475569; }
      .title { font-size: 34px; font-weight: 800; fill: #0f172a; }
      .subtitle { font-size: 18px; font-weight: 500; fill: #334155; }
      .section { font-size: 22px; font-weight: 800; fill: #0f172a; }
      .cardTitle { font-size: 18px; font-weight: 800; fill: #0f172a; }
      .body { font-size: 16px; font-weight: 500; fill: #334155; }
      .small { font-size: 15px; font-weight: 600; fill: #475569; }
      .chip { font-size: 15px; font-weight: 800; fill: #ffffff; }
      .step { font-size: 17px; font-weight: 800; fill: #0f172a; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1200" height="920" fill="#f8fafc"/>
  <rect x="24" y="24" width="1152" height="872" rx="28" fill="url(#bg)" stroke="#dbe4f0"/>

  <text x="64" y="76" class="eyebrow">금융공기업 IT · 16-4 페이지 핵심 시야</text>
  <text x="64" y="122" class="title">주요 모델과 딥러닝은 데이터 구조와 설명 요구로 고른다</text>
  <text x="64" y="156" class="subtitle">작고 구조화된 문제는 단순 모델에서 시작하고, 구조 발견은 비지도 학습으로, 복잡한 표현 학습은 딥러닝으로 확장한다.</text>

  <rect x="56" y="196" width="328" height="416" rx="26" fill="#ffffff" stroke="#99f6e4" stroke-width="2"/>
  <rect x="80" y="220" width="126" height="34" rx="17" fill="#0f766e"/>
  <text x="143" y="242" text-anchor="middle" class="chip">전통적 ML</text>
  <text x="80" y="286" class="section">구조화 데이터의 기본 출발점</text>
  <text x="80" y="320" class="cardTitle">선형·로지스틱 회귀</text>
  <text x="80" y="346" class="body">• 해석이 쉬워 베이스라인으로 적합</text>
  <text x="80" y="372" class="body">• 규제 대응과 설명 자료 작성에 유리</text>
  <line x1="80" y1="392" x2="360" y2="392" stroke="#d1fae5" stroke-width="2"/>
  <text x="80" y="426" class="cardTitle">트리·앙상블</text>
  <text x="80" y="452" class="body">• Decision Tree: 규칙이 직관적</text>
  <text x="80" y="478" class="body">• Random Forest: 분산 감소에 강함</text>
  <text x="80" y="504" class="body">• Gradient Boosting: 금융 데이터에서 강세</text>
  <line x1="80" y1="524" x2="360" y2="524" stroke="#d1fae5" stroke-width="2"/>
  <text x="80" y="558" class="cardTitle">SVM</text>
  <text x="80" y="584" class="body">• 마진 최대화로 고차원 분류 대응</text>
  <text x="80" y="610" class="body">• 데이터가 매우 커지면 학습 비용이 부담</text>

  <rect x="436" y="196" width="328" height="416" rx="26" fill="#ffffff" stroke="#fdba74" stroke-width="2"/>
  <rect x="460" y="220" width="136" height="34" rx="17" fill="#ea580c"/>
  <text x="528" y="242" text-anchor="middle" class="chip">비지도 학습</text>
  <text x="460" y="286" class="section">라벨 없이 구조를 찾고 줄인다</text>
  <text x="460" y="320" class="cardTitle">K-means 군집화</text>
  <text x="460" y="346" class="body">• 비슷한 관측치를 묶어 패턴을 본다</text>
  <text x="460" y="372" class="body">• 빠르지만 k 선택과 스케일에 민감</text>
  <line x1="460" y1="392" x2="740" y2="392" stroke="#fed7aa" stroke-width="2"/>
  <text x="460" y="426" class="cardTitle">PCA 차원 축소</text>
  <text x="460" y="452" class="body">• 분산이 큰 축을 남겨 정보를 압축</text>
  <text x="460" y="478" class="body">• 시각화, 노이즈 감소, 전처리에 유용</text>
  <line x1="460" y1="498" x2="740" y2="498" stroke="#fed7aa" stroke-width="2"/>
  <text x="460" y="532" class="cardTitle">이상치 탐지</text>
  <text x="460" y="558" class="body">• Isolation Forest, LOF로 초기 필터링</text>
  <text x="460" y="584" class="body">• 운영 중 모니터링 경보에도 활용 가능</text>
  <g transform="translate(606 334)">
    <circle cx="0" cy="0" r="56" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
    <circle cx="-20" cy="-10" r="12" fill="#fb923c"/>
    <circle cx="19" cy="-16" r="12" fill="#facc15"/>
    <circle cx="10" cy="18" r="12" fill="#60a5fa"/>
    <circle cx="46" cy="34" r="7" fill="#94a3b8"/>
  </g>
  <text x="606" y="612" text-anchor="middle" class="small">오른쪽 회색 점은 이상치 예시</text>

  <rect x="816" y="196" width="328" height="416" rx="26" fill="#ffffff" stroke="#a5b4fc" stroke-width="2"/>
  <rect x="840" y="220" width="112" height="34" rx="17" fill="#4f46e5"/>
  <text x="896" y="242" text-anchor="middle" class="chip">딥러닝</text>
  <text x="840" y="286" class="section">복잡한 비선형 표현을 스스로 학습</text>
  <text x="840" y="320" class="cardTitle">신경망 기본 구조</text>
  <rect x="844" y="344" width="58" height="124" rx="18" fill="#eef2ff" stroke="#818cf8" stroke-width="2"/>
  <rect x="920" y="330" width="58" height="152" rx="18" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  <rect x="996" y="330" width="58" height="152" rx="18" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  <rect x="1072" y="360" width="50" height="92" rx="18" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <line x1="902" y1="406" x2="920" y2="406" stroke="#6366f1" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="978" y1="406" x2="996" y2="406" stroke="#6366f1" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1054" y1="406" x2="1072" y2="406" stroke="#6366f1" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="873" y="500" text-anchor="middle" class="small">입력층</text>
  <text x="949" y="500" text-anchor="middle" class="small">은닉층</text>
  <text x="1025" y="500" text-anchor="middle" class="small">은닉층</text>
  <text x="1097" y="500" text-anchor="middle" class="small">출력층</text>
  <text x="840" y="544" class="body">• 손실 함수 → 역전파 → 경사하강법으로 학습</text>
  <text x="840" y="570" class="body">• CNN: 이미지 · RNN/LSTM: 순차 · Transformer: 긴 문맥</text>
  <text x="840" y="596" class="body">• 성능은 높지만 데이터·연산·설명 부담이 큼</text>

  <line x1="384" y1="404" x2="436" y2="404" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="764" y1="404" x2="816" y2="404" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="600" y="388" text-anchor="middle" class="small">데이터 복잡도와 표현 요구가 커질수록 우측으로 이동</text>

  <rect x="56" y="648" width="1088" height="208" rx="26" fill="#ffffff" stroke="#d7deea" stroke-width="2"/>
  <text x="80" y="694" class="section">실무 선택 흐름: 단순 모델에서 시작하고 필요할 때만 복잡도를 올린다</text>

  <rect x="80" y="726" width="236" height="88" rx="20" fill="#ecfeff" stroke="#14b8a6" stroke-width="2"/>
  <text x="104" y="758" class="step">1. 구조화 데이터 + 설명 중요</text>
  <text x="104" y="786" class="body">회귀·로지스틱 회귀·트리로</text>
  <text x="104" y="810" class="body">먼저 베이스라인을 만든다.</text>

  <rect x="364" y="726" width="236" height="88" rx="20" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
  <text x="388" y="758" class="step">2. 숨은 구조를 먼저 확인</text>
  <text x="388" y="786" class="body">군집화·차원 축소·이상치 탐지로</text>
  <text x="388" y="810" class="body">데이터 품질과 패턴을 본다.</text>

  <rect x="648" y="726" width="236" height="88" rx="20" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="672" y="758" class="step">3. 비정형 + 표현 학습 필요</text>
  <text x="672" y="786" class="body">CNN, Transformer 같은</text>
  <text x="672" y="810" class="body">딥러닝을 검토한다.</text>

  <rect x="932" y="726" width="188" height="88" rx="20" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="956" y="758" class="step">최종 점검</text>
  <text x="956" y="786" class="body">성능 상승 폭이 작다면</text>
  <text x="956" y="810" class="body">설명가능성이 높은 모델 유지</text>

  <line x1="316" y1="770" x2="364" y2="770" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="600" y1="770" x2="648" y2="770" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="884" y1="770" x2="932" y2="770" stroke="#64748b" stroke-width="3" marker-end="url(#arrow)"/>
</svg>
