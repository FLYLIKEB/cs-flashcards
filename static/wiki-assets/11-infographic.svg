<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">11. 소프트웨어공학 인포그래픽</title>
  <desc id="desc">소프트웨어공학 / 개발방법론 / 테스트 / 설계 원칙</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f3e8ff" />
      <stop offset="100%" stop-color="#fdf2f8" />
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.12" />
    </filter>
    <style>
      .title { font: 700 34px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .subtitle { font: 500 16px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
      .section { font: 700 18px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .chip { font: 700 15px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .body { font: 500 18px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
      .node { font: 700 17px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .focus { font: 500 16px 'Pretendard','Noto Sans KR',sans-serif; fill: #1e293b; }
      .small { font: 600 13px 'Pretendard','Noto Sans KR',sans-serif; fill: #475569; }
      .float1 { animation: float1 7s ease-in-out infinite; }
      .float2 { animation: float2 8s ease-in-out infinite; }
      .float3 { animation: float3 9s ease-in-out infinite; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: center; }
      @keyframes float1 { 0%,100% { transform: translateY(0px); } 50% { transform: translateY(-8px); } }
      @keyframes float2 { 0%,100% { transform: translateY(-2px); } 50% { transform: translateY(7px); } }
      @keyframes float3 { 0%,100% { transform: translateY(2px); } 50% { transform: translateY(-6px); } }
      @keyframes pulse { 0%,100% { opacity: .55; transform: scale(1); } 50% { opacity: 1; transform: scale(1.35); } }
    </style>
  </defs>
  <rect width="1200" height="720" fill="#f8fafc" />
  <rect x="32" y="30" width="1136" height="660" rx="34" fill="url(#bg)" opacity="0.55" />
  <rect x="48" y="46" width="1104" height="628" rx="30" fill="white" filter="url(#shadow)" />
  <rect x="48" y="46" width="1104" height="628" rx="30" fill="url(#bg)" opacity="0.16" />
  <text class="small" x="88" y="92">금융공기업 IT · SVG 인포그래픽</text>
  <text class="title" x="88" y="116"><tspan x="88" dy="0">11. 소프트웨어공학</tspan></text>
  <text class="subtitle" x="88" y="198"><tspan x="88" dy="0">소프트웨어공학은 소프트웨어를 체계적으로 개발 운영하기 위한 원리와 방법을</tspan><tspan x="88" dy="24">다루는 과목이다. 금융공기업 IT 필기에서는 깊은 구현 지식보다 개념 구분,</tspan></text>
  <g class="float1"><rect x="90" y="126" width="170" height="42" rx="21" fill="#f3e8ff" stroke="#7c3aed" stroke-opacity="0.18"/><text class="chip" x="175" y="152" text-anchor="middle">소프트웨어공학</text></g><g class="float2"><rect x="300" y="126" width="170" height="42" rx="21" fill="#fdf2f8" stroke="#7c3aed" stroke-opacity="0.18"/><text class="chip" x="385" y="152" text-anchor="middle">개발방법론</text></g><g class="float3"><rect x="510" y="126" width="170" height="42" rx="21" fill="#f3e8ff" stroke="#7c3aed" stroke-opacity="0.18"/><text class="chip" x="595" y="152" text-anchor="middle">테스트</text></g><g class="float1"><rect x="720" y="126" width="170" height="42" rx="21" fill="#fdf2f8" stroke="#7c3aed" stroke-opacity="0.18"/><text class="chip" x="805" y="152" text-anchor="middle">설계 원칙</text></g>
  <rect x="82" y="244" width="1036" height="2" rx="1" fill="url(#line)" opacity="0.35" />
  <rect x="86" y="278" width="300" height="370" rx="28" fill="#f3e8ff" opacity="0.42" />
  <rect x="450" y="258" width="300" height="190" rx="28" fill="#fdf2f8" opacity="0.38" />
  <rect x="782" y="278" width="300" height="370" rx="28" fill="#fdf2f8" opacity="0.42" />
  <text class="section" x="108" y="314">핵심 키워드</text>
  <text class="section" x="474" y="296">개념 연결 흐름</text>
  <text class="section" x="804" y="314">실전 포인트</text>
  <path d="M 180 410 C 260 480, 390 480, 470 410 S 680 340, 760 410" fill="none" stroke="url(#line)" stroke-width="6" stroke-linecap="round" opacity="0.85" stroke-dasharray="10 12">
    <animate attributeName="stroke-dashoffset" from="0" to="-220" dur="8s" repeatCount="indefinite" />
  </path>
  <circle cx="182" cy="408" r="10" fill="#7c3aed">
    <animateMotion dur="8s" repeatCount="indefinite" rotate="auto">
      <mpath href="#route" />
    </animateMotion>
  </circle>
  <path id="route" d="M 180 410 C 260 480, 390 480, 470 410 S 680 340, 760 410" fill="none" />
  <g><circle cx="180" cy="345" r="58" fill="white" stroke="#7c3aed" stroke-width="3" opacity="0.96"/><circle cx="180" cy="345" r="66" fill="none" stroke="#ec4899" stroke-opacity="0.35" stroke-width="2.5" stroke-dasharray="10 8"><animate attributeName="stroke-dashoffset" from="0" to="-180" dur="7s" begin="0.0s" repeatCount="indefinite" /></circle><text class="node" x="180" text-anchor="middle" y="337"><tspan x="180" text-anchor="middle" dy="0">챕터 전체 개요</tspan></text></g><g><circle cx="470" cy="345" r="58" fill="white" stroke="#7c3aed" stroke-width="3" opacity="0.96"/><circle cx="470" cy="345" r="66" fill="none" stroke="#ec4899" stroke-opacity="0.35" stroke-width="2.5" stroke-dasharray="10 8"><animate attributeName="stroke-dashoffset" from="0" to="-180" dur="7s" begin="0.7s" repeatCount="indefinite" /></circle><text class="node" x="470" text-anchor="middle" y="337"><tspan x="470" text-anchor="middle" dy="0">하위 페이지 링크</tspan></text></g><g><circle cx="760" cy="345" r="58" fill="white" stroke="#7c3aed" stroke-width="3" opacity="0.96"/><circle cx="760" cy="345" r="66" fill="none" stroke="#ec4899" stroke-opacity="0.35" stroke-width="2.5" stroke-dasharray="10 8"><animate attributeName="stroke-dashoffset" from="0" to="-180" dur="7s" begin="1.4s" repeatCount="indefinite" /></circle><text class="node" x="760" text-anchor="middle" y="337"><tspan x="760" text-anchor="middle" dy="0">기출 출제 경향 및 시험</tspan><tspan x="760" text-anchor="middle" dy="18">포인트</tspan></text></g>
  <text class="body" x="108" y="362"><tspan x="108" dy="0">소프트웨어공학</tspan></text>
  <text class="body" x="108" y="454"><tspan x="108" dy="0">개발방법론</tspan></text>
  <text class="body" x="108" y="546"><tspan x="108" dy="0">테스트</tspan></text>
  <circle cx="832" cy="545" r="6" fill="#ec4899" class="pulse" style="animation-delay:0.0s"/><text class="focus" x="850" y="553"><tspan x="850" dy="0">개발방법론: 폭포수, 애자일, 나선형,</tspan><tspan x="850" dy="18">스크럼, 칸반, UP, RAD, XP</tspan></text><circle cx="832" cy="603" r="6" fill="#ec4899" class="pulse" style="animation-delay:0.45s"/><text class="focus" x="850" y="611"><tspan x="850" dy="0">테스트: V-모델, 테스트 레벨, 블랙박스</tspan><tspan x="850" dy="18">화이트박스 기법</tspan></text><circle cx="832" cy="661" r="6" fill="#ec4899" class="pulse" style="animation-delay:0.9s"/><text class="focus" x="850" y="669"><tspan x="850" dy="0">설계: 결합도와 응집도, 좋은 모듈 설계</tspan><tspan x="850" dy="18">기준</tspan></text>
  <rect x="86" y="618" width="1028" height="16" rx="8" fill="#e2e8f0" />
  <rect x="86" y="618" width="640" height="16" rx="8" fill="url(#line)" opacity="0.82">
    <animate attributeName="width" values="420;860;420" dur="10s" repeatCount="indefinite" />
  </rect>
  <circle cx="726" cy="626" r="12" fill="#ec4899" class="pulse" />
  <text class="small" x="88" y="666">asset: 11-infographic.svg</text>
  <text class="small" x="1116" y="666" text-anchor="end">소프트웨어공학</text>
</svg>