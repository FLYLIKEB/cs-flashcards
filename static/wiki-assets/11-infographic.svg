  <text class="title" x="84" y="118" text-anchor="start"><tspan x="84" dy="0">11. 소프트웨어공학</tspan></text>
  <text class="subtitle" x="84" y="180" text-anchor="start"><tspan x="84" dy="0">소프트웨어공학은 소프트웨어를 체계적으로 개발 운영하기 위한 원리와 방법을 다루는</tspan><tspan x="84" dy="24">과목이다. 금융공기업 IT 필기에서는 깊은 구현 지식보다 개념 구분, 절차 순서,</tspan></text>
