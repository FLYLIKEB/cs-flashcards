<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">13-01. SQL 기본 인포그래픽</title>
  <desc id="desc">SELECT 문의 작성 순서, 절의 역할 묶음, WHERE와 HAVING 구분 규칙을 읽기 쉽게 정리한 인포그래픽</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .soft { fill: #eef2ff; stroke: #c7d2fe; stroke-width: 2; }
      .mint { fill: #ecfeff; stroke: #a5f3fc; stroke-width: 2; }
      .green { fill: #f0fdf4; stroke: #86efac; stroke-width: 2; }
      .amber { fill: #fffbeb; stroke: #fcd34d; stroke-width: 2; }
      .rose { fill: #fff1f2; stroke: #fecdd3; stroke-width: 2; }
      .ink { fill: #0f172a; }
      .muted { fill: #334155; }
      .subtle { fill: #475569; }
      .title { font: 700 34px 'Pretendard','Noto Sans KR',sans-serif; }
      .subtitle { font: 500 18px 'Pretendard','Noto Sans KR',sans-serif; }
      .section { font: 700 22px 'Pretendard','Noto Sans KR',sans-serif; }
      .label { font: 700 17px 'Pretendard','Noto Sans KR',sans-serif; }
      .body { font: 500 15px 'Pretendard','Noto Sans KR',sans-serif; }
      .small { font: 500 13px 'Pretendard','Noto Sans KR',sans-serif; }
      .mono { font: 600 19px 'SFMono-Regular','Consolas','Menlo',monospace; }
      .monoSm { font: 600 16px 'SFMono-Regular','Consolas','Menlo',monospace; }
      .chip { font: 700 13px 'Pretendard','Noto Sans KR',sans-serif; }
      .num { font: 700 18px 'Pretendard','Noto Sans KR',sans-serif; fill: #ffffff; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="900" rx="28"/>
  <rect class="panel" x="28" y="28" width="1144" height="844" rx="30"/>

  <text class="small subtle" x="72" y="80">데이터베이스 · SELECT 기본 절 · 시험 대비 핵심</text>
  <text class="title ink" x="72" y="126">13-01. SQL 기본</text>
  <text class="subtitle muted" x="72" y="160">문장을 읽는 순서와 실제로 평가되는 순서를 분리해서 보면 SQL이 훨씬 쉬워진다.</text>

  <rect class="panel" x="72" y="196" width="448" height="324" rx="24"/>
  <text class="section ink" x="104" y="236">1) 겉으로 보이는 작성 순서</text>
  <text class="body muted" x="104" y="266">시험에서는 절 이름을 정확히 쓰고, 각 절이 무엇을 담당하는지 짝지어 기억하면 된다.</text>

  <rect x="104" y="292" width="384" height="188" rx="20" fill="#0f172a"/>
  <text class="mono" x="132" y="334" fill="#93c5fd">SELECT <tspan fill="#f8fafc">customer_id, SUM(amount)</tspan></text>
  <text class="mono" x="132" y="366" fill="#86efac">FROM <tspan fill="#f8fafc">orders</tspan></text>
  <text class="mono" x="132" y="398" fill="#fca5a5">WHERE <tspan fill="#f8fafc">order_date &gt;= '2023-01-01'</tspan></text>
  <text class="mono" x="132" y="430" fill="#fde68a">GROUP BY <tspan fill="#f8fafc">customer_id</tspan></text>
  <text class="mono" x="132" y="462" fill="#c4b5fd">HAVING <tspan fill="#f8fafc">SUM(amount) &gt; 1000</tspan></text>

  <rect class="soft" x="552" y="196" width="576" height="324" rx="24"/>
  <text class="section ink" x="584" y="236">2) 절의 역할을 네 묶음으로 이해하기</text>
  <text class="body muted" x="584" y="266">비슷한 역할끼리 묶으면 WHERE와 HAVING, SELECT와 ORDER BY의 차이가 선명해진다.</text>

  <rect class="green" x="584" y="294" width="248" height="90" rx="18"/>
  <circle cx="620" cy="339" r="18" fill="#16a34a"/>
  <text class="num" x="620" y="345" text-anchor="middle">A</text>
  <text class="label ink" x="650" y="330">데이터 원천 선택</text>
  <text class="body subtle" x="650" y="354">FROM, JOIN</text>
  <text class="small subtle" x="650" y="374">어느 테이블과 관계를 읽을지 정한다.</text>

  <rect class="rose" x="848" y="294" width="248" height="90" rx="18"/>
  <circle cx="884" cy="339" r="18" fill="#e11d48"/>
  <text class="num" x="884" y="345" text-anchor="middle">B</text>
  <text class="label ink" x="914" y="330">행 단위 필터</text>
  <text class="body subtle" x="914" y="354">WHERE</text>
  <text class="small subtle" x="914" y="374">집계 전에 개별 행을 먼저 줄인다.</text>

  <rect class="amber" x="584" y="398" width="248" height="90" rx="18"/>
  <circle cx="620" cy="443" r="18" fill="#d97706"/>
  <text class="num" x="620" y="449" text-anchor="middle">C</text>
  <text class="label ink" x="650" y="434">그룹화와 집계</text>
  <text class="body subtle" x="650" y="458">GROUP BY, HAVING</text>
  <text class="small subtle" x="650" y="478">묶은 뒤 집계 결과를 조건으로 거른다.</text>

  <rect class="mint" x="848" y="398" width="248" height="90" rx="18"/>
  <circle cx="884" cy="443" r="18" fill="#0891b2"/>
  <text class="num" x="884" y="449" text-anchor="middle">D</text>
  <text class="label ink" x="914" y="434">출력 정리</text>
  <text class="body subtle" x="914" y="458">SELECT, ORDER BY, LIMIT</text>
  <text class="small subtle" x="914" y="478">보여줄 열과 정렬, 개수를 마무리한다.</text>

  <rect class="panel" x="72" y="552" width="1056" height="272" rx="24"/>
  <text class="section ink" x="104" y="592">3) 시험에서 자주 틀리는 포인트</text>

  <rect class="soft" x="104" y="620" width="308" height="164" rx="18"/>
  <text class="label ink" x="128" y="654">WHERE와 HAVING을 섞지 않기</text>
  <text class="body subtle" x="128" y="684">• WHERE: 개별 주문 행 필터</text>
  <text class="body subtle" x="128" y="710">• HAVING: 고객별 합계 같은 그룹 결과 필터</text>
  <text class="monoSm" x="128" y="748" fill="#1d4ed8">WHERE amount &gt; 1000   ✕</text>
  <text class="monoSm" x="128" y="772" fill="#0f766e">HAVING SUM(amount) &gt; 1000   ○</text>

  <rect class="green" x="446" y="620" width="308" height="164" rx="18"/>
  <text class="label ink" x="470" y="654">GROUP BY 규칙 기억하기</text>
  <text class="body subtle" x="470" y="684">• 비집계 컬럼은 보통 GROUP BY에 포함</text>
  <text class="body subtle" x="470" y="710">• COUNT, SUM, AVG는 그룹 안에서 계산</text>
  <text class="body subtle" x="470" y="736">• SELECT * 습관은 집계 쿼리에서 특히 위험</text>

  <rect class="amber" x="788" y="620" width="308" height="164" rx="18"/>
  <text class="label ink" x="812" y="654">NULL과 결과 정렬</text>
  <text class="body subtle" x="812" y="684">• NULL 비교는 IS NULL / IS NOT NULL</text>
  <text class="body subtle" x="812" y="710">• ORDER BY는 가장 마지막에 결과를 정렬</text>
  <text class="body subtle" x="812" y="736">• LIMIT/OFFSET은 정렬 뒤 잘라내기 단계</text>

  <text class="small subtle" x="72" y="850">13-01-00-sql-infographic.svg · 작성 순서와 절의 역할을 한 장으로 요약</text>
</svg>
