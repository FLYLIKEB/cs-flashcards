<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="860" viewBox="0 0 1280 860" role="img" aria-labelledby="title desc">
  <title id="title">14-4. 입출력 시스템 개요</title>
  <desc id="desc">CPU와 장치 사이에서 입출력 병목이 생기는 이유와 폴링, 인터럽트, DMA 선택 기준을 요약한 인포그래픽</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#eef4ff"/>
    </linearGradient>
    <style>
      .title { font: 700 36px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .subtitle { font: 500 18px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
      .section { font: 700 24px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .label { font: 700 20px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .body { font: 500 17px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
      .small { font: 600 15px 'Pretendard','Noto Sans KR',sans-serif; fill: #475569; }
      .tiny { font: 600 13px 'Pretendard','Noto Sans KR',sans-serif; fill: #475569; }
      .chip { font: 700 14px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .white { fill: #ffffff; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1280" height="860" fill="url(#bg)"/>
  <rect x="28" y="28" width="1224" height="804" rx="30" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <text class="small" x="72" y="82">금융공기업 IT · 운영체제 핵심 시각화</text>
  <text class="title" x="72" y="126">14-4. 입출력 시스템</text>
  <text class="subtitle" x="72" y="160">느린 장치와 큰 전송량이 CPU 진행을 늦출 때, 폴링·인터럽트·DMA 중 어느 경로를 택하느냐가 처리량과 응답시간을 바꾼다.</text>

  <g transform="translate(72 210)">
    <text class="section" x="0" y="0">1) 왜 I/O가 전체 성능을 묶는가</text>
    <rect x="0" y="26" width="1136" height="208" rx="26" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

    <rect x="34" y="68" width="190" height="88" rx="20" fill="#1d4ed8"/>
    <text class="label white" x="129" y="110" text-anchor="middle">CPU</text>
    <text class="small white" x="129" y="136" text-anchor="middle">계산은 빠르지만</text>

    <line x1="224" y1="112" x2="308" y2="112" stroke="#94a3b8" stroke-width="8" stroke-linecap="round"/>
    <text class="chip" x="266" y="98" text-anchor="middle">속도 차이</text>

    <rect x="308" y="56" width="270" height="112" rx="22" fill="#f97316"/>
    <text class="label white" x="443" y="102" text-anchor="middle">I/O 장치</text>
    <text class="small white" x="443" y="128" text-anchor="middle">디스크 · 네트워크 · 외부 장치</text>

    <line x1="578" y1="112" x2="654" y2="112" stroke="#94a3b8" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/>

    <rect x="678" y="50" width="132" height="118" rx="20" fill="#e0e7ff" stroke="#818cf8" stroke-width="1.5"/>
    <text class="label" x="744" y="92" text-anchor="middle">CPU 유휴</text>
    <text class="body" x="744" y="120" text-anchor="middle">대기 시간 증가</text>

    <rect x="830" y="50" width="132" height="118" rx="20" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
    <text class="label" x="896" y="92" text-anchor="middle">큐 적체</text>
    <text class="body" x="896" y="120" text-anchor="middle">I/O wait 상승</text>

    <rect x="982" y="50" width="120" height="118" rx="20" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
    <text class="label" x="1042" y="92" text-anchor="middle">지연 변동</text>
    <text class="body" x="1042" y="120" text-anchor="middle">응답시간 흔들림</text>

    <line x1="44" y1="196" x2="1092" y2="196" stroke="#dbe3ef" stroke-width="1.5"/>
    <text class="body" x="42" y="222">핵심 관찰: CPU 사용률만 보면 문제를 놓친다. I/O wait, 장치 큐 길이, 평균과 꼬리 지연시간을 함께 봐야 병목 위치가 드러난다.</text>
  </g>

  <g transform="translate(72 494)">
    <text class="section" x="0" y="0">2) 어떤 상황에서 어떤 I/O 방식이 맞는가</text>

    <rect x="0" y="26" width="360" height="244" rx="24" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <rect x="24" y="50" width="88" height="34" rx="17" fill="#dbeafe"/>
    <text class="chip" x="68" y="73" text-anchor="middle">폴링</text>
    <text class="label" x="24" y="116">CPU가 직접 반복 확인</text>
    <text class="body" x="24" y="152">• 짧고 매우 자주 확인해야 할 때 단순하다</text>
    <text class="body" x="24" y="184">• 장치가 늦으면 busy waiting으로 CPU를 묶는다</text>
    <text class="body" x="24" y="216">• 답안 키워드: 단순성, 예측 가능, CPU 낭비</text>

    <rect x="388" y="26" width="360" height="244" rx="24" fill="#ecfdf5" stroke="#86efac" stroke-width="1.5"/>
    <rect x="412" y="50" width="110" height="34" rx="17" fill="#dcfce7"/>
    <text class="chip" x="467" y="73" text-anchor="middle">인터럽트</text>
    <text class="label" x="412" y="116">이벤트가 생기면 CPU를 깨움</text>
    <text class="body" x="412" y="152">• 평소에는 CPU가 다른 일을 계속할 수 있다</text>
    <text class="body" x="412" y="184">• 너무 잦으면 ISR·문맥 전환 비용이 커진다</text>
    <text class="body" x="412" y="216">• 답안 키워드: 이벤트 기반, 효율, 오버헤드</text>

    <rect x="776" y="26" width="360" height="244" rx="24" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/>
    <rect x="800" y="50" width="76" height="34" rx="17" fill="#fde68a"/>
    <text class="chip" x="838" y="73" text-anchor="middle">DMA</text>
    <text class="label" x="800" y="116">큰 데이터는 메모리로 직접 전송</text>
    <text class="body" x="800" y="152">• CPU는 시작 조건만 설정하고 빠진다</text>
    <text class="body" x="800" y="184">• 대용량 전송에서 처리량과 CPU 여유가 좋아진다</text>
    <text class="body" x="800" y="216">• 답안 키워드: 직접 전송, 대량 I/O, 일관성 관리</text>
  </g>
</svg>