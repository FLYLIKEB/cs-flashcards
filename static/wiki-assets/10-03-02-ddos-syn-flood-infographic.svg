<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="920" viewBox="0 0 1280 920" role="img" aria-labelledby="title desc">
  <title id="title">10-03-02. DDoS, 스머프, SYN Flood 비교 인포그래픽</title>
  <desc id="desc">DDoS의 공통 구조, 스머프의 ICMP 반사 증폭, SYN Flood의 half-open 자원 고갈, 그리고 핵심 방어 포인트를 비교하는 SVG 인포그래픽</desc>
  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="55%" stop-color="#fff7ed"/>
      <stop offset="100%" stop-color="#fef2f2"/>
    </linearGradient>
    <linearGradient id="panelBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <marker id="arrowRed" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#c2410c"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#1d4ed8"/>
    </marker>
    <marker id="arrowSlate" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#475569"/>
    </marker>
    <style>
      .eyebrow { font: 700 18px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
      .title { font: 700 38px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .subtitle { font: 500 18px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
      .section { font: 700 24px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .label { font: 700 18px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .body { font: 500 17px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
      .small { font: 600 15px 'Pretendard','Noto Sans KR',sans-serif; fill: #475569; }
      .tiny { font: 700 14px 'Pretendard','Noto Sans KR',sans-serif; fill: #475569; }
      .invLabel { font: 700 18px 'Pretendard','Noto Sans KR',sans-serif; fill: #ffffff; }
      .invBody { font: 500 16px 'Pretendard','Noto Sans KR',sans-serif; fill: #e2e8f0; }
    </style>
  </defs>

  <rect width="1280" height="920" fill="#dbe4ee"/>
  <rect x="24" y="24" width="1232" height="872" rx="30" fill="url(#pageBg)"/>
  <rect x="44" y="44" width="1192" height="832" rx="26" fill="#ffffff" opacity="0.92"/>

  <text class="eyebrow" x="84" y="92">네트워크 보안 · 가용성 공격 비교</text>
  <text class="title" x="84" y="140">DDoS · 스머프 · SYN Flood</text>
  <text class="subtitle" x="84" y="178">무차별 대량 트래픽, ICMP 반사 증폭, TCP 연결 대기 고갈이 어떻게 다른지 한 장에서 비교한다.</text>

  <rect x="72" y="212" width="352" height="350" rx="24" fill="url(#panelBg)" stroke="#cbd5e1" stroke-width="2"/>
  <text class="section" x="98" y="250">1. DDoS 공통 구조</text>
  <text class="body" x="98" y="284">여러 봇이 한 서비스로 동시에 몰려 정상 사용자의 대역폭과</text>
  <text class="body" x="98" y="309">연결 기회를 빼앗는 가장 넓은 개념의 가용성 공격이다.</text>

  <circle cx="144" cy="372" r="24" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
  <circle cx="212" cy="334" r="24" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
  <circle cx="220" cy="418" r="24" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
  <circle cx="292" cy="374" r="24" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
  <text class="tiny" x="144" y="377" text-anchor="middle">봇</text>
  <text class="tiny" x="212" y="339" text-anchor="middle">봇</text>
  <text class="tiny" x="220" y="423" text-anchor="middle">봇</text>
  <text class="tiny" x="292" y="379" text-anchor="middle">봇</text>

  <line x1="166" y1="372" x2="258" y2="466" stroke="#c2410c" stroke-width="4" marker-end="url(#arrowRed)"/>
  <line x1="234" y1="334" x2="288" y2="458" stroke="#c2410c" stroke-width="4" marker-end="url(#arrowRed)"/>
  <line x1="242" y1="418" x2="300" y2="482" stroke="#c2410c" stroke-width="4" marker-end="url(#arrowRed)"/>
  <line x1="314" y1="374" x2="312" y2="456" stroke="#c2410c" stroke-width="4" marker-end="url(#arrowRed)"/>

  <rect x="248" y="456" width="100" height="78" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text class="label" x="298" y="489" text-anchor="middle">서비스</text>
  <text class="tiny" x="298" y="511" text-anchor="middle">대상 서버</text>

  <text class="small" x="98" y="522">• 특징: 다수 출발지, 대량 요청, 정상 사용자 접속 저하</text>
  <text class="small" x="98" y="546">• 대응: 분산 처리, 필터링, 스케일링, 조기 탐지</text>

  <rect x="464" y="212" width="352" height="350" rx="24" fill="url(#panelBg)" stroke="#fdba74" stroke-width="2"/>
  <text class="section" x="490" y="250">2. 스머프(Smurf) 증폭</text>
  <text class="body" x="490" y="284">작은 ICMP Echo Request를 브로드캐스트에 뿌리고,</text>
  <text class="body" x="490" y="309">여러 호스트의 Echo Reply를 희생자에게 몰아준다.</text>

  <circle cx="558" cy="382" r="38" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
  <text class="label" x="558" y="376" text-anchor="middle">공격자</text>
  <text class="tiny" x="558" y="400" text-anchor="middle">출발지 IP = 희생자 위조</text>

  <rect x="642" y="346" width="96" height="72" rx="18" fill="#ffedd5" stroke="#f97316" stroke-width="2.5"/>
  <text class="label" x="690" y="376" text-anchor="middle">브로드</text>
  <text class="label" x="690" y="398" text-anchor="middle">캐스트</text>

  <circle cx="762" cy="322" r="24" fill="#ecfeff" stroke="#0891b2" stroke-width="2.5"/>
  <circle cx="760" cy="442" r="24" fill="#ecfeff" stroke="#0891b2" stroke-width="2.5"/>
  <circle cx="718" cy="382" r="24" fill="#ecfeff" stroke="#0891b2" stroke-width="2.5"/>
  <text class="tiny" x="762" y="327" text-anchor="middle">호스트</text>
  <text class="tiny" x="760" y="447" text-anchor="middle">호스트</text>
  <text class="tiny" x="718" y="387" text-anchor="middle">호스트</text>

  <rect x="640" y="468" width="118" height="64" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text class="label" x="699" y="495" text-anchor="middle">희생자</text>
  <text class="tiny" x="699" y="517" text-anchor="middle">여러 Reply 동시 수신</text>

  <line x1="596" y1="382" x2="642" y2="382" stroke="#c2410c" stroke-width="4" marker-end="url(#arrowRed)"/>
  <text class="tiny" x="620" y="366" text-anchor="middle">작은 요청 1개</text>
  <line x1="738" y1="366" x2="748" y2="336" stroke="#1d4ed8" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <line x1="738" y1="382" x2="736" y2="382" stroke="#1d4ed8" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <line x1="738" y1="398" x2="748" y2="428" stroke="#1d4ed8" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <line x1="762" y1="346" x2="722" y2="468" stroke="#1d4ed8" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <line x1="718" y1="406" x2="704" y2="468" stroke="#1d4ed8" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <line x1="760" y1="418" x2="716" y2="468" stroke="#1d4ed8" stroke-width="4" marker-end="url(#arrowBlue)"/>

  <text class="small" x="490" y="522">• 특징: 브로드캐스트 + 반사 응답 때문에 트래픽이 증폭됨</text>
  <text class="small" x="490" y="546">• 대응: directed broadcast 차단, ICMP 응답 제한, 스푸핑 방지</text>

  <rect x="856" y="212" width="352" height="350" rx="24" fill="url(#panelBg)" stroke="#93c5fd" stroke-width="2"/>
  <text class="section" x="882" y="250">3. SYN Flood 자원 고갈</text>
  <text class="body" x="882" y="284">SYN만 대량 전송해 서버가 SYN-ACK 후 ACK를 기다리는</text>
  <text class="body" x="882" y="309">half-open 상태를 backlog 큐에 계속 쌓이게 만든다.</text>

  <rect x="894" y="352" width="112" height="74" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="2.5"/>
  <text class="label" x="950" y="382" text-anchor="middle">공격자</text>
  <text class="tiny" x="950" y="404" text-anchor="middle">SYN 반복 전송</text>

  <rect x="1080" y="346" width="98" height="88" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2.5"/>
  <text class="label" x="1129" y="380" text-anchor="middle">서버</text>
  <text class="tiny" x="1129" y="402" text-anchor="middle">SYN-ACK 전송 후 대기</text>

  <line x1="1006" y1="372" x2="1080" y2="372" stroke="#c2410c" stroke-width="4" marker-end="url(#arrowRed)"/>
  <text class="tiny" x="1044" y="356" text-anchor="middle">SYN</text>
  <line x1="1080" y1="410" x2="1006" y2="410" stroke="#1d4ed8" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <text class="tiny" x="1044" y="432" text-anchor="middle">SYN-ACK</text>
  <text class="tiny" x="1044" y="454" text-anchor="middle">ACK가 오지 않아 대기 유지</text>

  <rect x="896" y="474" width="254" height="56" rx="16" fill="#eff6ff" stroke="#60a5fa" stroke-width="2.5"/>
  <rect x="906" y="484" width="46" height="36" rx="10" fill="#dc2626" opacity="0.86"/>
  <rect x="958" y="484" width="46" height="36" rx="10" fill="#dc2626" opacity="0.86"/>
  <rect x="1010" y="484" width="46" height="36" rx="10" fill="#dc2626" opacity="0.86"/>
  <rect x="1062" y="484" width="46" height="36" rx="10" fill="#dc2626" opacity="0.86"/>
  <rect x="1114" y="484" width="26" height="36" rx="10" fill="#fca5a5"/>
  <text class="tiny" x="919" y="507">대기</text>
  <text class="tiny" x="971" y="507">대기</text>
  <text class="tiny" x="1023" y="507">대기</text>
  <text class="tiny" x="1075" y="507">대기</text>
  <text class="tiny" x="1127" y="507">거의 만원</text>

  <text class="small" x="882" y="522">• 특징: 증폭보다 상태 자원 소모가 핵심, 정상 연결 수락 실패</text>
  <text class="small" x="882" y="546">• 대응: SYN cookies, backlog 튜닝, rate limit, 방화벽/로드밸런서</text>

  <rect x="72" y="594" width="1136" height="246" rx="24" fill="#0f172a"/>
  <text class="section" x="98" y="638" fill="#ffffff">4. 빠른 비교와 방어 포인트</text>

  <rect x="98" y="664" width="336" height="142" rx="18" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text class="invLabel" x="122" y="698">DDoS 일반</text>
  <text class="invBody" x="122" y="728">• 신호: 트래픽 급증, 다수 출발지</text>
  <text class="invBody" x="122" y="754">• 병목: 대역폭, 애플리케이션 처리량</text>
  <text class="invBody" x="122" y="780">• 대응: 필터링, 흡수, 오토스케일, CDN</text>

  <rect x="472" y="664" width="336" height="142" rx="18" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text class="invLabel" x="496" y="698">스머프</text>
  <text class="invBody" x="496" y="728">• 신호: ICMP reply 급증, 브로드캐스트 흔적</text>
  <text class="invBody" x="496" y="754">• 병목: 반사 응답이 희생자에게 집중</text>
  <text class="invBody" x="496" y="780">• 대응: directed broadcast 차단, 응답 제한</text>

  <rect x="846" y="664" width="336" height="142" rx="18" fill="#111827" stroke="#334155" stroke-width="2"/>
  <text class="invLabel" x="870" y="698">SYN Flood</text>
  <text class="invBody" x="870" y="728">• 신호: SYN 많고 ACK 적음, half-open 급증</text>
  <text class="invBody" x="870" y="754">• 병목: backlog 큐와 연결 상태 테이블</text>
  <text class="invBody" x="870" y="780">• 대응: SYN cookies, backlog 확장, rate limit</text>

  <line x1="98" y1="822" x2="1182" y2="822" stroke="#334155" stroke-width="2"/>
  <text class="small" x="98" y="854" fill="#cbd5e1">핵심: 스머프는 작은 요청을 여러 ICMP 응답으로 증폭하고, SYN Flood는 ACK를 보내지 않아 half-open 대기 자원을 고갈시킨다.</text>
</svg>
