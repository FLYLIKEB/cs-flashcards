<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">09-04. 동적계획법과 재귀 인포그래픽</title>
  <desc id="desc">피보나치 예시로 재귀 호출 트리, 메모이제이션 캐시, 탭뷸레이션 테이블, 기저 조건과 중복 부분 문제를 설명하는 SVG</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="memoGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ede9fe"/>
      <stop offset="100%" stop-color="#ddd6fe"/>
    </linearGradient>
    <linearGradient id="tabGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dcfce7"/>
      <stop offset="100%" stop-color="#bbf7d0"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: "Pretendard", "Noto Sans KR", sans-serif; }
      .title { font-size: 34px; font-weight: 800; fill: #0f172a; }
      .subtitle { font-size: 17px; font-weight: 500; fill: #334155; }
      .section { font-size: 20px; font-weight: 800; fill: #0f172a; }
      .label { font-size: 16px; font-weight: 700; fill: #0f172a; }
      .body { font-size: 15px; font-weight: 500; fill: #334155; }
      .small { font-size: 13px; font-weight: 600; fill: #475569; }
      .tiny { font-size: 12px; font-weight: 700; fill: #475569; }
      .treeLine { stroke: #94a3b8; stroke-width: 2.5; fill: none; }
      .repeatLine { stroke: #8b5cf6; stroke-width: 3; fill: none; }
      .node { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .repeatNode { fill: #f5f3ff; stroke: #8b5cf6; stroke-width: 2.5; }
      .baseNode { fill: #ecfeff; stroke: #06b6d4; stroke-width: 2.5; }
      .panel { fill: #ffffff; stroke: #dbe4ee; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1200" height="720" fill="url(#bg)"/>
  <rect x="28" y="28" width="1144" height="664" rx="28" fill="#ffffff" stroke="#dbe4ee" stroke-width="2"/>

  <text class="small" x="72" y="78">알고리즘 핵심 비교 · 재귀 → 메모이제이션 → 탭뷸레이션</text>
  <text class="title" x="72" y="120">09-04. 동적계획법과 재귀</text>
  <text class="subtitle" x="72" y="154">같은 하위 문제를 반복 호출하면 비효율적이다. 기저 조건을 세우고 결과를 저장하면 피보나치 같은 문제를 O(n)으로 줄일 수 있다.</text>

  <rect class="panel" x="58" y="190" width="430" height="470" rx="24"/>
  <text class="section" x="84" y="228">1) 순수 재귀 호출 트리</text>
  <text class="body" x="84" y="252">fib(5) = fib(4) + fib(3)</text>
  <text class="small" x="84" y="274">보라색은 반복 계산되는 하위 문제, 청록색은 기저 사례</text>

  <path class="treeLine" d="M274 320 L184 388 M274 320 L364 388 M184 388 L128 456 M184 388 L240 456 M364 388 L308 456 M364 388 L420 456 M128 456 L96 522 M128 456 L160 522 M240 456 L208 522 M240 456 L272 522"/>
  <path class="repeatLine" d="M308 456 L332 522 M308 456 L396 522 M420 456 L452 522 M420 456 L484 522" opacity="0.8"/>

  <g>
    <circle class="node" cx="274" cy="320" r="34"/>
    <text class="label" x="274" y="315" text-anchor="middle">fib(5)</text>
    <text class="tiny" x="274" y="334" text-anchor="middle">루트 호출</text>
  </g>
  <g>
    <circle class="node" cx="184" cy="388" r="32"/>
    <text class="label" x="184" y="384" text-anchor="middle">fib(4)</text>
    <circle class="repeatNode" cx="364" cy="388" r="32"/>
    <text class="label" x="364" y="384" text-anchor="middle">fib(3)</text>
  </g>
  <g>
    <circle class="repeatNode" cx="128" cy="456" r="30"/>
    <text class="label" x="128" y="452" text-anchor="middle">fib(3)</text>
    <circle class="repeatNode" cx="240" cy="456" r="30"/>
    <text class="label" x="240" y="452" text-anchor="middle">fib(2)</text>
    <circle class="repeatNode" cx="308" cy="456" r="30"/>
    <text class="label" x="308" y="452" text-anchor="middle">fib(2)</text>
    <circle class="baseNode" cx="420" cy="456" r="30"/>
    <text class="label" x="420" y="452" text-anchor="middle">fib(1)</text>
  </g>
  <g>
    <circle class="repeatNode" cx="96" cy="522" r="25"/>
    <text class="tiny" x="96" y="526" text-anchor="middle">fib(2)</text>
    <circle class="baseNode" cx="160" cy="522" r="25"/>
    <text class="tiny" x="160" y="526" text-anchor="middle">fib(1)</text>
    <circle class="baseNode" cx="208" cy="522" r="25"/>
    <text class="tiny" x="208" y="526" text-anchor="middle">fib(1)</text>
    <circle class="baseNode" cx="272" cy="522" r="25"/>
    <text class="tiny" x="272" y="526" text-anchor="middle">fib(0)</text>
    <circle class="baseNode" cx="332" cy="522" r="25"/>
    <text class="tiny" x="332" y="526" text-anchor="middle">fib(1)</text>
    <circle class="baseNode" cx="396" cy="522" r="25"/>
    <text class="tiny" x="396" y="526" text-anchor="middle">fib(0)</text>
    <circle class="baseNode" cx="452" cy="522" r="25"/>
    <text class="tiny" x="452" y="526" text-anchor="middle">fib(1)</text>
    <circle class="baseNode" cx="484" cy="522" r="25"/>
    <text class="tiny" x="484" y="526" text-anchor="middle">fib(0)</text>
  </g>

  <rect x="84" y="568" width="378" height="70" rx="16" fill="#faf5ff" stroke="#c4b5fd" stroke-width="2"/>
  <text class="label" x="104" y="594">문제점</text>
  <text class="body" x="104" y="617">fib(3), fib(2)가 여러 번 다시 나타난다.</text>
  <text class="body" x="104" y="636">시간 복잡도: O(2ⁿ), 스택 깊이: O(n)</text>

  <path d="M504 340 H574" stroke="#64748b" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <text class="small" x="514" y="328">반복 호출 결과를 저장</text>

  <rect x="592" y="190" width="250" height="470" rx="24" fill="url(#memoGrad)" stroke="#c4b5fd" stroke-width="2"/>
  <text class="section" x="618" y="228">2) 메모이제이션</text>
  <text class="body" x="618" y="252">Top-down DP: 재귀는 유지하고 캐시에 저장</text>

  <rect x="618" y="282" width="198" height="72" rx="16" fill="#ffffff" opacity="0.95"/>
  <text class="label" x="638" y="308">기저 조건</text>
  <text class="body" x="638" y="331">if n &lt;= 1: return n</text>
  <text class="body" x="638" y="349">종료 조건이 없으면 무한 호출</text>

  <rect x="618" y="378" width="198" height="176" rx="16" fill="#ffffff" opacity="0.95"/>
  <text class="label" x="638" y="404">memo 캐시</text>
  <rect x="638" y="420" width="42" height="42" rx="10" fill="#ede9fe" stroke="#8b5cf6"/>
  <rect x="688" y="420" width="42" height="42" rx="10" fill="#ede9fe" stroke="#8b5cf6"/>
  <rect x="738" y="420" width="42" height="42" rx="10" fill="#ede9fe" stroke="#8b5cf6"/>
  <text class="tiny" x="659" y="438" text-anchor="middle">2</text>
  <text class="label" x="659" y="452" text-anchor="middle">1</text>
  <text class="tiny" x="709" y="438" text-anchor="middle">3</text>
  <text class="label" x="709" y="452" text-anchor="middle">2</text>
  <text class="tiny" x="759" y="438" text-anchor="middle">4</text>
  <text class="label" x="759" y="452" text-anchor="middle">3</text>
  <text class="body" x="638" y="486">같은 fib(3), fib(2)를 다시 만나면</text>
  <text class="body" x="638" y="507">계산 대신 저장값을 즉시 반환</text>
  <text class="body" x="638" y="536">시간 복잡도: O(n)</text>

  <rect x="618" y="574" width="198" height="58" rx="16" fill="#ffffff" opacity="0.95"/>
  <text class="small" x="638" y="599">판단 기준</text>
  <text class="body" x="638" y="619">중복 부분 문제 + 최적 부분 구조</text>

  <path d="M858 340 H928" stroke="#64748b" stroke-width="4" fill="none" marker-end="url(#arrow)"/>
  <text class="small" x="870" y="328">상태를 표로 바꾸기</text>

  <rect x="946" y="190" width="196" height="470" rx="24" fill="url(#tabGrad)" stroke="#86efac" stroke-width="2"/>
  <text class="section" x="972" y="228">3) 탭뷸레이션</text>
  <text class="body" x="972" y="252">Bottom-up DP: 작은 상태부터 채움</text>

  <rect x="972" y="282" width="144" height="168" rx="16" fill="#ffffff" opacity="0.95"/>
  <text class="label" x="994" y="308">fib 테이블</text>
  <line x1="994" y1="322" x2="1094" y2="322" stroke="#bbf7d0" stroke-width="2"/>
  <text class="tiny" x="1004" y="346">i</text>
  <text class="tiny" x="1044" y="346">0</text>
  <text class="tiny" x="1078" y="346">1</text>
  <text class="tiny" x="1004" y="374">dp[i]</text>
  <text class="tiny" x="1044" y="374">0</text>
  <text class="tiny" x="1078" y="374">1</text>
  <line x1="994" y1="390" x2="1094" y2="390" stroke="#bbf7d0" stroke-width="2"/>
  <text class="tiny" x="1004" y="418">i=2 → 1</text>
  <text class="tiny" x="1004" y="438">i=3 → 2</text>

  <rect x="972" y="472" width="144" height="84" rx="16" fill="#ffffff" opacity="0.95"/>
  <text class="label" x="994" y="498">전이식</text>
  <text class="body" x="994" y="521">dp[i] = dp[i-1]</text>
  <text class="body" x="994" y="541">       + dp[i-2]</text>

  <rect x="972" y="578" width="144" height="54" rx="16" fill="#ffffff" opacity="0.95"/>
  <text class="small" x="994" y="600">장점</text>
  <text class="body" x="994" y="619">스택 없이 O(n),</text>
  <text class="body" x="994" y="637">공간 최적화는 O(1)</text>

  <rect x="592" y="86" width="550" height="74" rx="18" fill="#0f172a"/>
  <text x="620" y="114" font-size="17" font-weight="800" fill="#ffffff">핵심 체크리스트</text>
  <text class="small" x="620" y="138" fill="#cbd5e1">① 상태 정의 ② 점화식 도출 ③ 기저 사례 설정 ④ Top-down / Bottom-up 선택 ⑤ 시간·공간 복잡도 계산</text>
</svg>
