<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">09-04. 동적계획법과 재귀 개요</title>
  <desc id="desc">재귀, 메모이제이션, 탭뷸레이션을 피보나치 예시 기준으로 비교하고 DP 판단 기준과 복잡도 차이를 정리한 개요 SVG</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <style>
      text { font-family: "Pretendard", "Noto Sans KR", sans-serif; fill: #0f172a; }
      .eyebrow { font-size: 18px; font-weight: 700; fill: #334155; }
      .title { font-size: 38px; font-weight: 800; }
      .subtitle { font-size: 19px; font-weight: 500; fill: #334155; }
      .section { font-size: 24px; font-weight: 800; }
      .label { font-size: 18px; font-weight: 700; }
      .body { font-size: 16px; font-weight: 500; fill: #334155; }
      .small { font-size: 14px; font-weight: 600; fill: #475569; }
      .metric { font-size: 15px; font-weight: 700; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .chip { stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="1200" height="760" fill="url(#bg)"/>
  <rect x="28" y="28" width="1144" height="704" rx="28" fill="#ffffff" stroke="#dbe4ee" stroke-width="2"/>

  <text class="eyebrow" x="72" y="86">알고리즘 핵심 비교 · 재귀에서 DP로 넘어가는 기준</text>
  <text class="title" x="72" y="132">09-04. 동적계획법과 재귀</text>
  <text class="subtitle" x="72" y="170">같은 하위 문제가 반복되면 재귀만으로는 느리다. 기저 조건을 먼저 세우고, 저장 방식에 따라 Top-down 또는 Bottom-up DP를 고른다.</text>

  <rect class="card" x="64" y="214" width="332" height="320" rx="24"/>
  <rect x="88" y="242" width="104" height="34" rx="17" fill="#dbeafe" class="chip" stroke="#3b82f6"/>
  <text class="small" x="140" y="264" text-anchor="middle">순수 재귀</text>
  <text class="section" x="88" y="312">1) 큰 문제를 같은 모양의</text>
  <text class="section" x="88" y="344">작은 문제로 분해</text>
  <text class="body" x="88" y="384">• 호출 예: fib(5) → fib(4) + fib(3)</text>
  <text class="body" x="88" y="414">• 반드시 기저 조건이 있어야 종료된다</text>
  <text class="body" x="88" y="444">• fib(3), fib(2)처럼 같은 하위 문제가 반복된다</text>
  <rect x="88" y="470" width="284" height="42" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
  <text class="metric" x="108" y="496">시간 O(2ⁿ) · 스택 깊이 O(n)</text>

  <rect class="card" x="434" y="214" width="332" height="320" rx="24"/>
  <rect x="458" y="242" width="142" height="34" rx="17" fill="#ede9fe" class="chip" stroke="#8b5cf6"/>
  <text class="small" x="529" y="264" text-anchor="middle">메모이제이션</text>
  <text class="section" x="458" y="312">2) 재귀 호출은 유지하고</text>
  <text class="section" x="458" y="344">결과만 캐시에 저장</text>
  <text class="body" x="458" y="384">• 이미 계산한 fib(3), fib(2)는 즉시 재사용</text>
  <text class="body" x="458" y="414">• 구현은 재귀 코드와 잘 어울리는 Top-down 방식</text>
  <text class="body" x="458" y="444">• 캐시는 배열이나 해시로 관리한다</text>
  <rect x="458" y="470" width="284" height="42" rx="14" fill="#faf5ff" stroke="#c4b5fd" stroke-width="1.5"/>
  <text class="metric" x="478" y="496">시간 O(n) · 캐시 공간 O(n)</text>

  <rect class="card" x="804" y="214" width="332" height="320" rx="24"/>
  <rect x="828" y="242" width="126" height="34" rx="17" fill="#dcfce7" class="chip" stroke="#16a34a"/>
  <text class="small" x="891" y="264" text-anchor="middle">탭뷸레이션</text>
  <text class="section" x="828" y="312">3) 작은 상태부터 표를</text>
  <text class="section" x="828" y="344">채우는 Bottom-up DP</text>
  <text class="body" x="828" y="384">• dp[0], dp[1]에서 시작해 순서대로 계산</text>
  <text class="body" x="828" y="414">• 호출 스택이 없어 반복문 구현이 단순하다</text>
  <text class="body" x="828" y="444">• 필요하면 최근 두 값만 남겨 O(1) 공간으로 축소</text>
  <rect x="828" y="470" width="284" height="42" rx="14" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
  <text class="metric" x="848" y="496">시간 O(n) · 표 공간 O(n) 또는 O(1)</text>

  <rect class="card" x="64" y="566" width="500" height="126" rx="24"/>
  <text class="section" x="88" y="608">DP 적용 판단 기준</text>
  <text class="body" x="88" y="642">• 최적 부분 구조: 큰 문제 해답이 작은 문제 해답으로 조립된다</text>
  <text class="body" x="88" y="670">• 중복 부분 문제: 동일한 하위 문제가 여러 경로에서 다시 등장한다</text>

  <rect class="card" x="596" y="566" width="540" height="126" rx="24"/>
  <text class="section" x="620" y="608">구현 체크리스트</text>
  <text class="body" x="620" y="642">1. 상태 정의  2. 점화식 도출  3. 기저 사례 설정</text>
  <text class="body" x="620" y="670">4. Top-down / Bottom-up 선택  5. 시간·공간 복잡도 확인</text>
</svg>
