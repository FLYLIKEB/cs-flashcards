<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1120" viewBox="0 0 1200 1120" role="img" aria-labelledby="title desc">
  <title id="title">11-01. 개발방법론 핵심 흐름 인포그래픽</title>
  <desc id="desc">폭포수, 애자일, 나선형 모델의 흐름과 선택 기준, 스크럼·칸반·UP·RAD·XP의 핵심 연결점을 분리해 보여주는 고가독성 인포그래픽</desc>
  <defs>
    <style>
      text { font-family: "Noto Sans KR", "Apple SD Gothic Neo", sans-serif; fill: #0f172a; }
      .title { font-size: 34px; font-weight: 800; }
      .subtitle { font-size: 17px; font-weight: 500; fill: #334155; }
      .section { font-size: 24px; font-weight: 800; }
      .label { font-size: 17px; font-weight: 700; }
      .body { font-size: 15px; font-weight: 500; fill: #334155; }
      .small { font-size: 13px; font-weight: 600; fill: #475569; }
      .chipText { font-size: 14px; font-weight: 700; }
      .cardTitle { font-size: 19px; font-weight: 800; }
      .cardBody { font-size: 14px; font-weight: 500; fill: #334155; }
      .white { fill: #ffffff; }
    </style>
  </defs>

  <rect width="1200" height="1120" fill="#f8fafc"/>
  <rect x="32" y="28" width="1136" height="120" rx="28" fill="#e0f2fe"/>
  <text class="title" x="68" y="78">11-01. 개발방법론</text>
  <text class="subtitle" x="68" y="108">순차 진행, 반복 피드백, 위험 관리라는 세 축으로 방법론을 구분하면 비교가 쉬워진다.</text>

  <rect x="770" y="50" width="110" height="34" rx="17" fill="#dbeafe"/>
  <text class="chipText" x="825" y="72" text-anchor="middle">안정 요구</text>
  <rect x="892" y="50" width="110" height="34" rx="17" fill="#bbf7d0"/>
  <text class="chipText" x="947" y="72" text-anchor="middle">빠른 피드백</text>
  <rect x="1014" y="50" width="120" height="34" rx="17" fill="#ede9fe"/>
  <text class="chipText" x="1074" y="72" text-anchor="middle">위험 우선</text>
  <rect x="770" y="96" width="364" height="30" rx="15" fill="#0f172a"/>
  <text class="small" x="952" y="116" text-anchor="middle" fill="#e2e8f0">선택 기준: 요구 변경 빈도 · 규제/감사 · 팀 성숙도 · 프로젝트 위험</text>

  <rect x="40" y="172" width="350" height="500" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text class="section" x="68" y="214">폭포수 모델</text>
  <text class="body" x="68" y="242">
    <tspan x="68" dy="0">단계를 순서대로 통과하며</tspan>
    <tspan x="68" dy="20">문서와 승인 절차를 중시한다.</tspan>
  </text>

  <rect x="68" y="286" width="294" height="46" rx="14" fill="#dbeafe"/>
  <text class="label" x="215" y="315" text-anchor="middle">요구사항 분석</text>
  <line x1="215" y1="332" x2="215" y2="352" stroke="#2563eb" stroke-width="3"/>
  <polygon points="215,363 207,350 223,350" fill="#2563eb"/>
  <rect x="68" y="366" width="294" height="46" rx="14" fill="#bfdbfe"/>
  <text class="label" x="215" y="395" text-anchor="middle">설계</text>
  <line x1="215" y1="412" x2="215" y2="432" stroke="#2563eb" stroke-width="3"/>
  <polygon points="215,443 207,430 223,430" fill="#2563eb"/>
  <rect x="68" y="446" width="294" height="46" rx="14" fill="#93c5fd"/>
  <text class="label" x="215" y="475" text-anchor="middle">구현</text>
  <line x1="215" y1="492" x2="215" y2="512" stroke="#2563eb" stroke-width="3"/>
  <polygon points="215,523 207,510 223,510" fill="#2563eb"/>
  <rect x="68" y="526" width="294" height="46" rx="14" fill="#60a5fa"/>
  <text class="label white" x="215" y="555" text-anchor="middle">테스트</text>
  <line x1="215" y1="572" x2="215" y2="592" stroke="#2563eb" stroke-width="3"/>
  <polygon points="215,603 207,590 223,590" fill="#2563eb"/>
  <rect x="68" y="606" width="294" height="46" rx="14" fill="#1d4ed8"/>
  <text class="label white" x="215" y="635" text-anchor="middle">운영 · 유지보수</text>

  <text class="label" x="68" y="698">언제 유리한가</text>
  <text class="body" x="68" y="726">
    <tspan x="68" dy="0">• 요구사항이 안정적이고 계약·감사 문서가 중요한 프로젝트</tspan>
    <tspan x="68" dy="22">• 단계별 승인과 산출물 관리가 필요한 금융·공공 환경</tspan>
  </text>
  <text class="label" x="68" y="790">주의할 점</text>
  <text class="body" x="68" y="818">
    <tspan x="68" dy="0">• 후반부에 변경이 생기면</tspan>
    <tspan x="68" dy="22">수정 비용이 급격히 커진다.</tspan>
  </text>

  <rect x="424" y="172" width="350" height="500" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text class="section" x="452" y="214">애자일 · 스크럼 · 칸반</text>
  <text class="body" x="452" y="242">
    <tspan x="452" dy="0">짧은 반복 주기마다 결과물을 확인하고</tspan>
    <tspan x="452" dy="20">피드백을 바로 다음 반복에 반영한다.</tspan>
  </text>

  <circle cx="598" cy="418" r="112" fill="#ecfeff" stroke="#0891b2" stroke-width="3"/>
  <path d="M598 306 A112 112 0 0 1 701 382" fill="none" stroke="#0ea5e9" stroke-width="10" stroke-linecap="round"/>
  <polygon points="691,370 713,384 688,392" fill="#0ea5e9"/>
  <path d="M701 382 A112 112 0 0 1 648 506" fill="none" stroke="#22c55e" stroke-width="10" stroke-linecap="round"/>
  <polygon points="638,492 659,516 666,488" fill="#22c55e"/>
  <path d="M648 506 A112 112 0 0 1 495 462" fill="none" stroke="#f59e0b" stroke-width="10" stroke-linecap="round"/>
  <polygon points="504,450 482,466 510,473" fill="#f59e0b"/>
  <path d="M495 462 A112 112 0 0 1 520 334" fill="none" stroke="#8b5cf6" stroke-width="10" stroke-linecap="round"/>
  <polygon points="529,347 512,323 505,351" fill="#8b5cf6"/>

  <text class="label" x="598" y="362" text-anchor="middle">계획</text>
  <text class="label" x="665" y="416" text-anchor="middle">개발</text>
  <text class="label" x="598" y="474" text-anchor="middle">검토</text>
  <text class="label" x="530" y="416" text-anchor="middle">회고</text>

  <rect x="452" y="558" width="140" height="48" rx="14" fill="#e0f2fe"/>
  <text class="label" x="522" y="587" text-anchor="middle">스크럼</text>
  <text class="small" x="522" y="604" text-anchor="middle">스프린트 · 백로그 · 리뷰</text>
  <rect x="606" y="558" width="140" height="48" rx="14" fill="#dcfce7"/>
  <text class="label" x="676" y="587" text-anchor="middle">칸반</text>
  <text class="small" x="676" y="604" text-anchor="middle">흐름 시각화 · WIP 제한</text>

  <text class="label" x="452" y="698">언제 유리한가</text>
  <text class="body" x="452" y="726">
    <tspan x="452" dy="0">• 요구사항 변화가 잦고</tspan>
    <tspan x="452" dy="22">사용자 피드백이 빠르게 필요한 프로젝트</tspan>
    <tspan x="452" dy="22">• 동작 결과물을 자주 배포하며</tspan>
    <tspan x="452" dy="22">점진적으로 품질을 높일 때</tspan>
  </text>
  <text class="label" x="452" y="834">주의할 점</text>
  <text class="body" x="452" y="862">
    <tspan x="452" dy="0">• 범위 통제, 추적성, 승인 이력을</tspan>
    <tspan x="452" dy="22">별도 장치로 보완해야 한다.</tspan>
  </text>

  <rect x="808" y="172" width="352" height="500" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text class="section" x="836" y="214">나선형 모델</text>
  <text class="body" x="836" y="242">
    <tspan x="836" dy="0">반복 자체보다 위험 식별과 완화 순서를 먼저 설계하는</tspan>
    <tspan x="836" dy="20">고위험 프로젝트용 접근이다.</tspan>
  </text>

  <path d="M988 332 C1048 332 1072 378 1072 416 C1072 478 1016 530 952 530 C868 530 822 458 822 402 C822 312 902 262 996 262" fill="none" stroke="#7c3aed" stroke-width="8" stroke-linecap="round"/>
  <circle cx="996" cy="262" r="8" fill="#1d4ed8"/>
  <circle cx="1072" cy="416" r="8" fill="#ef4444"/>
  <circle cx="952" cy="530" r="8" fill="#16a34a"/>
  <circle cx="822" cy="402" r="8" fill="#f59e0b"/>
  <text class="label" x="996" y="244" text-anchor="middle">계획 수립</text>
  <text class="label" x="1098" y="421">위험 분석</text>
  <text class="label" x="952" y="558" text-anchor="middle">개발 · 검증</text>
  <text class="label" x="742" y="408">고객 평가</text>

  <rect x="842" y="576" width="284" height="40" rx="20" fill="#ede9fe"/>
  <text class="label" x="984" y="602" text-anchor="middle">프로토타입으로 불확실성 축소</text>

  <text class="label" x="836" y="698">언제 유리한가</text>
  <text class="body" x="836" y="726">
    <tspan x="836" dy="0">• 대규모 연동, 높은 보안 요구,</tspan>
    <tspan x="836" dy="22">성능 리스크가 큰 프로젝트</tspan>
    <tspan x="836" dy="22">• 기술 타당성과 사업성을</tspan>
    <tspan x="836" dy="22">반복마다 검증해야 하는 과제</tspan>
  </text>
  <text class="label" x="836" y="834">주의할 점</text>
  <text class="body" x="836" y="862">
    <tspan x="836" dy="0">• 위험 분석 활동이 많아</tspan>
    <tspan x="836" dy="22">관리 비용과 일정 부담이 커질 수 있다.</tspan>
  </text>

  <rect x="40" y="708" width="1120" height="372" rx="28" fill="#0f172a"/>
  <text x="68" y="752" font-size="24" font-weight="800" fill="#f8fafc">대표 실천/파생 방법론 요약</text>
  <text class="small" x="68" y="778" fill="#cbd5e1">상위 접근(폭포수·애자일·나선형) 위에 실무 프레임워크와 실천 기법이 얹힌다.</text>

  <rect x="68" y="804" width="250" height="224" rx="20" fill="#e0f2fe"/>
  <text class="cardTitle" x="90" y="840">스크럼</text>
  <text class="cardBody" x="90" y="868">
    <tspan x="90" dy="0">• 스프린트 단위</tspan>
    <tspan x="90" dy="22">  계획·개발·리뷰·회고</tspan>
    <tspan x="90" dy="22">• 역할: 제품 책임자,</tspan>
    <tspan x="90" dy="22">  스크럼 마스터, 개발팀</tspan>
    <tspan x="90" dy="22">• 팀 단위 반복 개발 운영</tspan>
    <tspan x="90" dy="22">  프레임워크</tspan>
  </text>

  <rect x="340" y="804" width="250" height="224" rx="20" fill="#dcfce7"/>
  <text class="cardTitle" x="362" y="840">칸반</text>
  <text class="cardBody" x="362" y="868">
    <tspan x="362" dy="0">• To Do / Doing / Done</tspan>
    <tspan x="362" dy="22">  흐름을 시각화</tspan>
    <tspan x="362" dy="22">• WIP 제한으로 병목과</tspan>
    <tspan x="362" dy="22">  대기시간을 제어</tspan>
    <tspan x="362" dy="22">• 운영·유지보수 업무에 적합</tspan>
  </text>

  <rect x="612" y="804" width="250" height="224" rx="20" fill="#ede9fe"/>
  <text class="cardTitle" x="634" y="840">UP · RAD</text>
  <text class="cardBody" x="634" y="868">
    <tspan x="634" dy="0">• UP: 유스케이스·아키텍처 중심</tspan>
    <tspan x="634" dy="22">• RAD: 빠른 프로토타입</tspan>
    <tspan x="634" dy="22">  과 사용자 참여</tspan>
    <tspan x="634" dy="22">• 장기 구조 검증과</tspan>
    <tspan x="634" dy="22">  단기 화면 개발에 활용</tspan>
  </text>

  <rect x="884" y="804" width="250" height="224" rx="20" fill="#fee2e2"/>
  <text class="cardTitle" x="906" y="840">XP</text>
  <text class="cardBody" x="906" y="868">
    <tspan x="906" dy="0">• TDD · 짝 프로그래밍 · CI</tspan>
    <tspan x="906" dy="22">• 리팩터링과 단순 설계로</tspan>
    <tspan x="906" dy="22">  변경 대응성 강화</tspan>
    <tspan x="906" dy="22">• 팀 규율과 테스트 문화가 핵심</tspan>
  </text>
</svg>
