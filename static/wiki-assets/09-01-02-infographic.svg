<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc">
  <title id="title">09-01-02. 연결리스트 구조와 포인터 변경</title>
  <desc id="desc">연결리스트의 노드 구조, 순차 접근, 삽입과 삭제에서 포인터가 어떻게 바뀌는지 분리해 보여주는 SVG</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="nodeFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <marker id="blueArrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#2563eb"/>
    </marker>
    <marker id="redArrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M1 1 L11 6 L1 11 Z" fill="#dc2626"/>
    </marker>
    <style>
      text { font-family: 'Pretendard', 'Noto Sans KR', sans-serif; fill: #0f172a; }
      .eyebrow { font-size: 18px; font-weight: 700; fill: #1d4ed8; }
      .title { font-size: 34px; font-weight: 800; }
      .subtitle { font-size: 18px; font-weight: 500; fill: #334155; }
      .section { font-size: 22px; font-weight: 800; }
      .label { font-size: 17px; font-weight: 700; }
      .body { font-size: 16px; font-weight: 500; fill: #334155; }
      .small { font-size: 14px; font-weight: 600; fill: #475569; }
      .chip { font-size: 14px; font-weight: 800; fill: #1d4ed8; }
      .mono { font-size: 15px; font-weight: 700; fill: #1e293b; }
    </style>
  </defs>

  <rect width="1200" height="840" fill="url(#bg)"/>
  <rect x="28" y="28" width="1144" height="784" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <text class="eyebrow" x="72" y="82">선형 자료구조 · singly linked list</text>
  <text class="title" x="72" y="124">09-01-02. 연결리스트</text>
  <text class="subtitle" x="72" y="158">핵심은 노드 연결이다. 순차 접근은 느리지만, 삽입과 삭제는 포인터만 다시 잇는다.</text>

  <rect x="64" y="194" width="1072" height="188" rx="24" fill="#f8fafc" stroke="#dbeafe" stroke-width="2"/>
  <text class="section" x="92" y="230">1. 노드 구조와 head → tail → null</text>
  <text class="small" x="92" y="256">각 노드는 data와 next를 가진다. 마지막 노드의 next는 null이며, tail은 마지막 노드를 가리킨다.</text>

  <rect x="110" y="292" width="82" height="58" rx="16" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
  <text class="label" x="151" y="327" text-anchor="middle">head</text>

  <rect x="238" y="278" width="190" height="88" rx="20" fill="url(#nodeFill)" stroke="#2563eb" stroke-width="2"/>
  <line x1="333" y1="278" x2="333" y2="366" stroke="#2563eb" stroke-width="2"/>
  <text class="label" x="286" y="313" text-anchor="middle">data</text>
  <text class="body" x="286" y="338" text-anchor="middle">A</text>
  <text class="label" x="381" y="313" text-anchor="middle">next</text>
  <text class="body" x="381" y="338" text-anchor="middle">다음 노드 주소</text>

  <rect x="500" y="278" width="190" height="88" rx="20" fill="url(#nodeFill)" stroke="#2563eb" stroke-width="2"/>
  <line x1="595" y1="278" x2="595" y2="366" stroke="#2563eb" stroke-width="2"/>
  <text class="label" x="548" y="313" text-anchor="middle">data</text>
  <text class="body" x="548" y="338" text-anchor="middle">B</text>
  <text class="label" x="643" y="313" text-anchor="middle">next</text>
  <text class="body" x="643" y="338" text-anchor="middle">다음 노드 주소</text>

  <rect x="762" y="278" width="190" height="88" rx="20" fill="url(#nodeFill)" stroke="#2563eb" stroke-width="2"/>
  <line x1="857" y1="278" x2="857" y2="366" stroke="#2563eb" stroke-width="2"/>
  <text class="label" x="810" y="313" text-anchor="middle">data</text>
  <text class="body" x="810" y="338" text-anchor="middle">C</text>
  <text class="label" x="905" y="313" text-anchor="middle">next</text>
  <text class="body" x="905" y="338" text-anchor="middle">null</text>

  <rect x="994" y="292" width="82" height="58" rx="16" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  <text class="label" x="1035" y="327" text-anchor="middle">tail</text>

  <line x1="192" y1="321" x2="238" y2="321" stroke="#2563eb" stroke-width="4" marker-end="url(#blueArrow)"/>
  <line x1="428" y1="321" x2="500" y2="321" stroke="#2563eb" stroke-width="4" marker-end="url(#blueArrow)"/>
  <line x1="690" y1="321" x2="762" y2="321" stroke="#2563eb" stroke-width="4" marker-end="url(#blueArrow)"/>
  <line x1="952" y1="321" x2="994" y2="321" stroke="#8b5cf6" stroke-width="4" marker-end="url(#blueArrow)"/>

  <rect x="64" y="406" width="516" height="340" rx="24" fill="#fefefe" stroke="#bfdbfe" stroke-width="2"/>
  <text class="section" x="92" y="442">2. 순차 접근: 원하는 칸까지 앞에서부터 따라간다</text>
  <text class="small" x="92" y="468">배열처럼 index로 바로 점프하지 못한다. 4번째 원소를 찾으려면 1 → 2 → 3 → 4 순서로 방문한다.</text>
  <text class="chip" x="92" y="502">접근 흐름</text>

  <rect x="104" y="528" width="92" height="58" rx="18" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/>
  <rect x="230" y="528" width="92" height="58" rx="18" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/>
  <rect x="356" y="528" width="92" height="58" rx="18" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/>
  <rect x="482" y="528" width="92" height="58" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
  <text class="label" x="150" y="563" text-anchor="middle">1번째</text>
  <text class="label" x="276" y="563" text-anchor="middle">2번째</text>
  <text class="label" x="402" y="563" text-anchor="middle">3번째</text>
  <text class="label" x="528" y="563" text-anchor="middle">4번째</text>
  <line x1="196" y1="557" x2="230" y2="557" stroke="#2563eb" stroke-width="4" marker-end="url(#blueArrow)"/>
  <line x1="322" y1="557" x2="356" y2="557" stroke="#2563eb" stroke-width="4" marker-end="url(#blueArrow)"/>
  <line x1="448" y1="557" x2="482" y2="557" stroke="#2563eb" stroke-width="4" marker-end="url(#blueArrow)"/>

  <rect x="92" y="616" width="460" height="98" rx="18" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text class="label" x="116" y="646">시험 문장</text>
  <text class="body" x="116" y="676">연결리스트는 임의 접근이 불가능하므로, i번째 원소 접근은</text>
  <text class="body" x="116" y="700">head부터 순차 탐색해야 해서 O(n)이다.</text>

  <rect x="606" y="406" width="530" height="340" rx="24" fill="#fefefe" stroke="#c7d2fe" stroke-width="2"/>
  <text class="section" x="634" y="442">3. 삽입·삭제: 포인터 연결만 다시 잇는다</text>
  <text class="small" x="634" y="468">노드 자체를 크게 이동시키지 않고 next가 가리키는 대상만 바꾼다.</text>

  <text class="chip" x="634" y="504">중간 삽입</text>
  <rect x="646" y="526" width="84" height="54" rx="16" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/>
  <rect x="780" y="526" width="84" height="54" rx="16" fill="#fde68a" stroke="#f59e0b" stroke-width="2"/>
  <rect x="914" y="526" width="84" height="54" rx="16" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/>
  <text class="label" x="688" y="560" text-anchor="middle">A</text>
  <text class="label" x="822" y="560" text-anchor="middle">NEW</text>
  <text class="label" x="956" y="560" text-anchor="middle">B</text>
  <line x1="730" y1="553" x2="780" y2="553" stroke="#2563eb" stroke-width="4" marker-end="url(#blueArrow)"/>
  <line x1="864" y1="553" x2="914" y2="553" stroke="#2563eb" stroke-width="4" marker-end="url(#blueArrow)"/>
  <text class="mono" x="646" y="610">1) new.next = curr.next</text>
  <text class="mono" x="646" y="636">2) curr.next = new</text>

  <text class="chip" x="634" y="676">중간 삭제</text>
  <rect x="646" y="688" width="84" height="54" rx="16" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/>
  <rect x="780" y="688" width="84" height="54" rx="16" fill="#fee2e2" stroke="#ef4444" stroke-width="2" stroke-dasharray="8 6"/>
  <rect x="914" y="688" width="84" height="54" rx="16" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/>
  <text class="label" x="688" y="722" text-anchor="middle">prev</text>
  <text class="label" x="822" y="722" text-anchor="middle">curr</text>
  <text class="label" x="956" y="722" text-anchor="middle">next</text>
  <line x1="730" y1="715" x2="914" y2="715" stroke="#dc2626" stroke-width="4" marker-end="url(#redArrow)"/>
  <text class="mono" x="1012" y="706">prev.next</text>
  <text class="mono" x="1012" y="730">= curr.next</text>

  <rect x="64" y="772" width="1072" height="24" rx="12" fill="#eff6ff"/>
  <text class="small" x="80" y="789">요약: 연결리스트는 접근은 느리지만, 연결 대상만 바꾸는 삽입·삭제에서는 강점을 가진다.</text>
</svg>
