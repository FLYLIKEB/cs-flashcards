<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">11-03. 결합도·응집도 개선 방향 예시</title>
  <desc id="desc">거래 처리, 보고서 생성, 계좌 모듈을 예시로 나쁜 구조와 개선된 구조를 좌우로 비교해 낮은 결합도와 높은 응집도가 어떻게 구현되는지 보여주는 SVG 다이어그램.</desc>
  <defs>
    <style>
      .title { font: 700 34px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .subtitle { font: 500 17px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
      .section { font: 700 24px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .label { font: 700 17px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .body { font: 500 15px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
      .small { font: 600 14px 'Pretendard','Noto Sans KR',sans-serif; fill: #475569; }
      .chip { font: 700 14px 'Pretendard','Noto Sans KR',sans-serif; fill: #ffffff; }
    </style>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="1200" height="760" fill="#f8fafc"/>
  <rect x="28" y="28" width="1144" height="704" rx="30" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <text x="72" y="88" class="small">금융 시스템 예시 · 개선 전후 비교</text>
  <text x="72" y="132" class="title">좋은 설계로 바꾸는 방법</text>
  <text x="72" y="166" class="subtitle">나쁜 구조는 기능이 뒤섞이고 직접 의존이 많다. 좋은 구조는 책임을 분리하고 데이터만 주고받는다.</text>

  <g transform="translate(60 210)">
    <rect width="500" height="442" rx="28" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
    <text x="30" y="42" class="section">개선 전</text>
    <rect x="30" y="62" width="104" height="28" rx="14" fill="#dc2626"/>
    <text x="82" y="81" text-anchor="middle" class="chip">높은 결합도</text>
    <rect x="146" y="62" width="104" height="28" rx="14" fill="#f97316"/>
    <text x="198" y="81" text-anchor="middle" class="chip">낮은 응집도</text>

    <rect x="36" y="132" width="180" height="84" rx="18" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="126" y="162" text-anchor="middle" class="label">거래 처리 모듈</text>
    <text x="126" y="186" text-anchor="middle" class="body">검증·승인·커밋</text>
    <text x="126" y="206" text-anchor="middle" class="body">+ 보고서 집계까지 수행</text>

    <rect x="286" y="132" width="180" height="84" rx="18" fill="#f5d0fe" stroke="#a855f7"/>
    <text x="376" y="162" text-anchor="middle" class="label">보고서 모듈</text>
    <text x="376" y="186" text-anchor="middle" class="body">전역 상태를 직접 읽고</text>
    <text x="376" y="206" text-anchor="middle" class="body">거래 흐름까지 간섭</text>

    <rect x="160" y="280" width="180" height="84" rx="18" fill="#fee2e2" stroke="#ef4444"/>
    <text x="250" y="310" text-anchor="middle" class="label">공유 전역 데이터</text>
    <text x="250" y="334" text-anchor="middle" class="body">잔액·로그·상태 플래그</text>
    <text x="250" y="354" text-anchor="middle" class="body">여러 모듈이 함께 수정</text>

    <line x1="216" y1="174" x2="286" y2="174" stroke="#dc2626" stroke-width="4" marker-end="url(#arrowRed)"/>
    <line x1="376" y1="216" x2="292" y2="280" stroke="#dc2626" stroke-width="4" marker-end="url(#arrowRed)"/>
    <line x1="126" y1="216" x2="208" y2="280" stroke="#dc2626" stroke-width="4" marker-end="url(#arrowRed)"/>

    <rect x="30" y="388" width="440" height="34" rx="12" fill="#fee2e2"/>
    <text x="250" y="410" text-anchor="middle" class="label">문제: 변경 영향이 넓고 책임 경계가 흐려진다.</text>
  </g>

  <g transform="translate(640 210)">
    <rect width="500" height="442" rx="28" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
    <text x="30" y="42" class="section">개선 후</text>
    <rect x="30" y="62" width="104" height="28" rx="14" fill="#16a34a"/>
    <text x="82" y="81" text-anchor="middle" class="chip">낮은 결합도</text>
    <rect x="146" y="62" width="104" height="28" rx="14" fill="#2563eb"/>
    <text x="198" y="81" text-anchor="middle" class="chip">높은 응집도</text>

    <rect x="30" y="132" width="188" height="84" rx="18" fill="#dbeafe" stroke="#3b82f6"/>
    <text x="124" y="162" text-anchor="middle" class="label">거래 처리 모듈</text>
    <text x="124" y="186" text-anchor="middle" class="body">입력 검증·승인·커밋만 담당</text>
    <text x="124" y="206" text-anchor="middle" class="body">순차적 응집 유지</text>

    <rect x="282" y="132" width="188" height="84" rx="18" fill="#f5d0fe" stroke="#a855f7"/>
    <text x="376" y="162" text-anchor="middle" class="label">보고서 모듈</text>
    <text x="376" y="186" text-anchor="middle" class="body">로그 조회·집계·출력만 담당</text>
    <text x="376" y="206" text-anchor="middle" class="body">거래 로직과 분리</text>

    <rect x="156" y="280" width="188" height="84" rx="18" fill="#dcfce7" stroke="#16a34a"/>
    <text x="250" y="310" text-anchor="middle" class="label">계좌/로그 인터페이스</text>
    <text x="250" y="334" text-anchor="middle" class="body">필요한 데이터만 전달</text>
    <text x="250" y="354" text-anchor="middle" class="body">자료 결합 유지</text>

    <line x1="124" y1="216" x2="214" y2="280" stroke="#2563eb" stroke-width="4" marker-end="url(#arrowBlue)"/>
    <line x1="376" y1="216" x2="286" y2="280" stroke="#2563eb" stroke-width="4" marker-end="url(#arrowBlue)"/>

    <rect x="30" y="388" width="440" height="34" rx="12" fill="#dcfce7"/>
    <text x="250" y="410" text-anchor="middle" class="label">효과: 수정 범위 축소, 재사용성 향상, 테스트 분리 용이.</text>
  </g>
</svg>
