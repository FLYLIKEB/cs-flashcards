<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc">
  <title id="title">07. 데이터베이스 학습 흐름 요약</title>
  <desc id="desc">데이터베이스 문제를 풀 때 떠올릴 핵심 처리 순서를 5단계 흐름으로 정리한 SVG. 모델링, 무결성, 정규화, SQL과 트랜잭션, 인덱스와 동시성으로 이어진다.</desc>
  <defs>
    <style>
      .title { font: 700 34px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .subtitle { font: 500 18px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
      .stepLabel { font: 700 15px 'Pretendard','Noto Sans KR',sans-serif; fill: #1e293b; }
      .stepTitle { font: 700 22px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .stepBody { font: 500 16px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
      .footer { font: 600 14px 'Pretendard','Noto Sans KR',sans-serif; fill: #475569; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1200" height="540" fill="#f8fafc"/>
  <rect x="28" y="28" width="1144" height="484" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <text class="title" x="72" y="106">데이터베이스 문제 풀이 흐름</text>
  <text class="subtitle" x="72" y="140">허브 개념도를 본 뒤에는 아래 순서로 개념을 꿰면 설계·질의·회복 문제가 한 줄로 연결된다.</text>

  <path d="M 236 304 H 316" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M 452 304 H 532" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M 668 304 H 748" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <path d="M 884 304 H 964" fill="none" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g transform="translate(72 194)">
    <rect x="0" y="0" width="164" height="196" rx="24" fill="#ecfeff" stroke="#0891b2" stroke-width="2.5"/>
    <rect x="22" y="20" width="54" height="28" rx="14" fill="#bae6fd"/>
    <text class="stepLabel" x="49" y="39" text-anchor="middle">1단계</text>
    <text class="stepTitle" x="22" y="84">모델링</text>
    <text class="stepBody" x="22" y="120">릴레이션</text>
    <text class="stepBody" x="22" y="146">튜플·속성</text>
    <text class="stepBody" x="22" y="172">스키마 구분</text>
  </g>

  <g transform="translate(288 194)">
    <rect x="0" y="0" width="164" height="196" rx="24" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
    <rect x="22" y="20" width="54" height="28" rx="14" fill="#bbf7d0"/>
    <text class="stepLabel" x="49" y="39" text-anchor="middle">2단계</text>
    <text class="stepTitle" x="22" y="84">무결성</text>
    <text class="stepBody" x="22" y="120">후보키·기본키</text>
    <text class="stepBody" x="22" y="146">외래키 연결</text>
    <text class="stepBody" x="22" y="172">참조 규칙 확인</text>
  </g>

  <g transform="translate(504 194)">
    <rect x="0" y="0" width="164" height="196" rx="24" fill="#fefce8" stroke="#ca8a04" stroke-width="2.5"/>
    <rect x="22" y="20" width="54" height="28" rx="14" fill="#fde68a"/>
    <text class="stepLabel" x="49" y="39" text-anchor="middle">3단계</text>
    <text class="stepTitle" x="22" y="84">정규화</text>
    <text class="stepBody" x="22" y="120">1NF 원자값</text>
    <text class="stepBody" x="22" y="146">2·3NF 종속 제거</text>
    <text class="stepBody" x="22" y="172">BCNF 확장</text>
  </g>

  <g transform="translate(720 194)">
    <rect x="0" y="0" width="164" height="196" rx="24" fill="#fff7ed" stroke="#ea580c" stroke-width="2.5"/>
    <rect x="22" y="20" width="54" height="28" rx="14" fill="#fed7aa"/>
    <text class="stepLabel" x="49" y="39" text-anchor="middle">4단계</text>
    <text class="stepTitle" x="22" y="84">처리</text>
    <text class="stepBody" x="22" y="120">SQL 결과 예측</text>
    <text class="stepBody" x="22" y="146">ACID 이해</text>
    <text class="stepBody" x="22" y="172">로그 복구 연결</text>
  </g>

  <g transform="translate(936 194)">
    <rect x="0" y="0" width="164" height="196" rx="24" fill="#fdf2f8" stroke="#db2777" stroke-width="2.5"/>
    <rect x="22" y="20" width="54" height="28" rx="14" fill="#fbcfe8"/>
    <text class="stepLabel" x="49" y="39" text-anchor="middle">5단계</text>
    <text class="stepTitle" x="22" y="84">최적화</text>
    <text class="stepBody" x="22" y="120">B-Tree 인덱스</text>
    <text class="stepBody" x="22" y="146">락·격리 수준</text>
    <text class="stepBody" x="22" y="172">성능과 일관성</text>
  </g>

  <text class="footer" x="72" y="452">복습 팁: 용어 정의형 문제는 1~3단계, SQL/회복/동시성 문제는 4~5단계까지 이어서 떠올리면 연결이 쉬워진다.</text>
</svg>
