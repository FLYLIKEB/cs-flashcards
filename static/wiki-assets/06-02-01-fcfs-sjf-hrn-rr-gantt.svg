<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">06-02-01. FCFS · SJF · HRN · RR 간트 차트</title>
  <desc id="desc">같은 입력에서 FCFS, SJF, HRN, RR이 만드는 간트 차트를 세로로 쌓아 보여준다. RR은 q=2 기준이다.</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .title { font: 700 34px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .subtitle { font: 500 18px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
      .section { font: 700 20px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .body { font: 500 16px 'Pretendard','Noto Sans KR',sans-serif; fill: #1e293b; }
      .small { font: 500 14px 'Pretendard','Noto Sans KR',sans-serif; fill: #475569; }
      .white { fill: #ffffff; }
      .axis { stroke: #94a3b8; stroke-width: 1.4; }
      .tick { stroke: #94a3b8; stroke-width: 1.2; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="900" rx="28" />
  <text class="title" x="56" y="70">예제 입력의 간트 차트 비교</text>
  <text class="subtitle" x="56" y="104">폭은 실행시간에 비례한다. RR은 time quantum q=2라서 실행 구간이 여러 번 끊어진다.</text>

  <rect class="panel" x="40" y="138" width="1120" height="706" rx="24" />

  <text class="section" x="84" y="194">FCFS</text>
  <text class="small" x="84" y="218">도착 순서 그대로: P1 → P2 → P3 → P4</text>
  <line class="axis" x1="220" y1="198" x2="1060" y2="198" />
  <rect x="220" y="170" width="448" height="38" rx="10" fill="#2563eb" />
  <rect x="668" y="170" width="224" height="38" rx="10" fill="#0f766e" />
  <rect x="892" y="170" width="112" height="38" rx="10" fill="#d97706" />
  <rect x="1004" y="170" width="56" height="38" rx="10" fill="#dc2626" />
  <text class="body white" x="444" y="194" text-anchor="middle">P1</text>
  <text class="body white" x="780" y="194" text-anchor="middle">P2</text>
  <text class="body white" x="948" y="194" text-anchor="middle">P3</text>
  <text class="body white" x="1032" y="194" text-anchor="middle">P4</text>

  <text class="section" x="84" y="320">SJF</text>
  <text class="small" x="84" y="344">t=8에서 P2, P3, P4 중 실행시간이 가장 짧은 P4부터 선택</text>
  <line class="axis" x1="220" y1="324" x2="1060" y2="324" />
  <rect x="220" y="296" width="448" height="38" rx="10" fill="#2563eb" />
  <rect x="668" y="296" width="56" height="38" rx="10" fill="#dc2626" />
  <rect x="724" y="296" width="112" height="38" rx="10" fill="#d97706" />
  <rect x="836" y="296" width="224" height="38" rx="10" fill="#0f766e" />
  <text class="body white" x="444" y="320" text-anchor="middle">P1</text>
  <text class="body white" x="696" y="320" text-anchor="middle">P4</text>
  <text class="body white" x="780" y="320" text-anchor="middle">P3</text>
  <text class="body white" x="948" y="320" text-anchor="middle">P2</text>

  <text class="section" x="84" y="446">HRN</text>
  <text class="small" x="84" y="470">t=8 응답률: P2 2.75, P3 4.00, P4 6.00 → P4 선택</text>
  <line class="axis" x1="220" y1="450" x2="1060" y2="450" />
  <rect x="220" y="422" width="448" height="38" rx="10" fill="#2563eb" />
  <rect x="668" y="422" width="56" height="38" rx="10" fill="#dc2626" />
  <rect x="724" y="422" width="112" height="38" rx="10" fill="#d97706" />
  <rect x="836" y="422" width="224" height="38" rx="10" fill="#0f766e" />
  <text class="body white" x="444" y="446" text-anchor="middle">P1</text>
  <text class="body white" x="696" y="446" text-anchor="middle">P4</text>
  <text class="body white" x="780" y="446" text-anchor="middle">P3</text>
  <text class="body white" x="948" y="446" text-anchor="middle">P2</text>

  <text class="section" x="84" y="572">RR (q=2)</text>
  <text class="small" x="84" y="596">quantum마다 순환: P1 → P2 → P3 → P1 → P4 → P2 → P1</text>
  <line class="axis" x1="220" y1="576" x2="1060" y2="576" />
  <rect x="220" y="548" width="112" height="38" rx="10" fill="#2563eb" />
  <rect x="332" y="548" width="112" height="38" rx="10" fill="#0f766e" />
  <rect x="444" y="548" width="112" height="38" rx="10" fill="#d97706" />
  <rect x="556" y="548" width="112" height="38" rx="10" fill="#2563eb" />
  <rect x="668" y="548" width="56" height="38" rx="10" fill="#dc2626" />
  <rect x="724" y="548" width="112" height="38" rx="10" fill="#0f766e" />
  <rect x="836" y="548" width="224" height="38" rx="10" fill="#2563eb" />
  <text class="body white" x="276" y="572" text-anchor="middle">P1</text>
  <text class="body white" x="388" y="572" text-anchor="middle">P2</text>
  <text class="body white" x="500" y="572" text-anchor="middle">P3</text>
  <text class="body white" x="612" y="572" text-anchor="middle">P1</text>
  <text class="body white" x="696" y="572" text-anchor="middle">P4</text>
  <text class="body white" x="780" y="572" text-anchor="middle">P2</text>
  <text class="body white" x="948" y="572" text-anchor="middle">P1</text>

  <g transform="translate(220 628)">
    <line class="tick" x1="0" y1="0" x2="0" y2="-480" />
    <line class="tick" x1="112" y1="0" x2="112" y2="-102" />
    <line class="tick" x1="224" y1="0" x2="224" y2="-606" />
    <line class="tick" x1="336" y1="0" x2="336" y2="-102" />
    <line class="tick" x1="448" y1="0" x2="448" y2="-354" />
    <line class="tick" x1="504" y1="0" x2="504" y2="-102" />
    <line class="tick" x1="616" y1="0" x2="616" y2="-102" />
    <line class="tick" x1="840" y1="0" x2="840" y2="-480" />
    <text class="small" x="0" y="24" text-anchor="middle">0</text>
    <text class="small" x="112" y="24" text-anchor="middle">2</text>
    <text class="small" x="224" y="24" text-anchor="middle">4</text>
    <text class="small" x="336" y="24" text-anchor="middle">6</text>
    <text class="small" x="448" y="24" text-anchor="middle">8</text>
    <text class="small" x="504" y="24" text-anchor="middle">9</text>
    <text class="small" x="616" y="24" text-anchor="middle">11</text>
    <text class="small" x="840" y="24" text-anchor="middle">15</text>
  </g>

  <rect x="84" y="706" width="1016" height="96" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
  <text class="body" x="108" y="740">읽는 법</text>
  <text class="small" x="108" y="766">• FCFS/SJF/HRN은 한 번 잡은 작업을 끝까지 실행하는 비선점 예시다.</text>
  <text class="small" x="108" y="790">• RR은 같은 총 실행시간이라도 구간이 잘게 나뉘므로 응답성이 좋아지고 계산은 더 복잡해진다.</text>

  <text class="small" x="56" y="872">06-02-01-fcfs-sjf-hrn-rr-gantt.svg · page-specific gantt timelines</text>
</svg>
