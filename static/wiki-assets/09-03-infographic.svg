<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">09-03. 정렬 비교 요약</title>
  <desc id="desc">퀵, 병합, 힙, 삽입 정렬의 평균 시간, 최악 시간, 안정성, 추가 공간과 적합한 사용 상황을 읽기 쉽게 비교한 인포그래픽이다.</desc>
  <defs>
    <style>
      text { font-family: 'Pretendard', 'Noto Sans KR', sans-serif; fill: #0f172a; }
      .eyebrow { font-size: 18px; font-weight: 700; fill: #475569; }
      .title { font-size: 36px; font-weight: 800; }
      .subtitle { font-size: 18px; font-weight: 500; fill: #334155; }
      .section { font-size: 23px; font-weight: 800; }
      .label { font-size: 21px; font-weight: 800; }
      .body { font-size: 17px; font-weight: 500; fill: #334155; }
      .small { font-size: 15px; font-weight: 600; fill: #475569; }
      .mono { font-size: 17px; font-weight: 700; fill: #1e293b; }
      .cellHead { font-size: 15px; font-weight: 700; fill: #475569; }
    </style>
  </defs>

  <rect width="1200" height="760" fill="#f8fafc"/>
  <rect x="28" y="28" width="1144" height="704" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <text class="eyebrow" x="72" y="84">자료구조 · 알고리즘 · 시간복잡도 비교</text>
  <text class="title" x="72" y="128">정렬 알고리즘을 고를 때 보는 4가지</text>
  <text class="subtitle" x="72" y="162">평균/최악 시간만 보지 말고 안정성, 추가 공간, 데이터 특성까지 함께 판단한다.</text>

  <rect x="72" y="206" width="1056" height="60" rx="18" fill="#e2e8f0"/>
  <text class="cellHead" x="104" y="244">알고리즘</text>
  <text class="cellHead" x="286" y="244">평균 시간</text>
  <text class="cellHead" x="460" y="244">최악 시간</text>
  <text class="cellHead" x="622" y="244">안정성</text>
  <text class="cellHead" x="766" y="244">추가 공간</text>
  <text class="cellHead" x="936" y="244">언제 기억할까</text>

  <rect x="72" y="284" width="1056" height="88" rx="22" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text class="label" x="104" y="336">Quick</text>
  <text class="mono" x="286" y="336">O(n log n)</text>
  <text class="mono" x="460" y="336">O(n²)</text>
  <text class="body" x="622" y="336">기본 구현은 불안정</text>
  <text class="body" x="766" y="336">재귀 스택 O(log n) 평균</text>
  <text class="body" x="936" y="324">평균 성능이 좋아 실무에서 자주 쓴다.</text>
  <text class="small" x="936" y="347">단, pivot이 한쪽으로 치우치면 최악 O(n²).</text>

  <rect x="72" y="388" width="1056" height="88" rx="22" fill="#ecfeff" stroke="#67e8f9" stroke-width="2"/>
  <text class="label" x="104" y="440">Merge</text>
  <text class="mono" x="286" y="440">O(n log n)</text>
  <text class="mono" x="460" y="440">O(n log n)</text>
  <text class="body" x="622" y="440">안정</text>
  <text class="body" x="766" y="440">추가 배열 O(n)</text>
  <text class="body" x="936" y="428">최악도 일정하고 다중 키 정렬에 강하다.</text>
  <text class="small" x="936" y="451">외부 정렬, stable sort 설명용으로 자주 등장.</text>

  <rect x="72" y="492" width="1056" height="88" rx="22" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/>
  <text class="label" x="104" y="544">Heap</text>
  <text class="mono" x="286" y="544">O(n log n)</text>
  <text class="mono" x="460" y="544">O(n log n)</text>
  <text class="body" x="622" y="544">불안정</text>
  <text class="body" x="766" y="544">제자리 가능, 추가 O(1)</text>
  <text class="body" x="936" y="532">메모리는 아끼지만 접근 패턴 때문에</text>
  <text class="small" x="936" y="555">실제 체감 성능은 퀵·병합보다 덜 유리할 수 있다.</text>

  <rect x="72" y="596" width="1056" height="88" rx="22" fill="#fefce8" stroke="#facc15" stroke-width="2"/>
  <text class="label" x="104" y="648">Insertion</text>
  <text class="mono" x="286" y="648">O(n²)</text>
  <text class="mono" x="460" y="648">O(n²)</text>
  <text class="body" x="622" y="648">안정</text>
  <text class="body" x="766" y="648">추가 O(1)</text>
  <text class="body" x="936" y="636">거의 정렬된 입력, 작은 배열에서 강하다.</text>
  <text class="small" x="936" y="659">퀵정렬의 작은 구간 마무리용으로도 자주 결합된다.</text>

  <rect x="72" y="702" width="1056" height="1" fill="#e2e8f0"/>
</svg>
