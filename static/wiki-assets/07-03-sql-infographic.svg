  <text class="body" x="108" y="546"><tspan x="108" dy="0">SQL 기본 문법과 실행 흐름을</tspan><tspan x="108" dy="20">정리한다</tspan></text>
  <circle cx="832" cy="545" r="6" fill="#14b8a6" class="pulse" style="animation-delay:0.0s"/><text class="focus" x="850" y="553"><tspan x="850" dy="0">SELECT는 조회, WHERE는 조건,</tspan><tspan x="850" dy="18">GROUP BY는 그룹화다. 시험 답안 예:</tspan></text><circle cx="832" cy="603" r="6" fill="#14b8a6" class="pulse" style="animation-delay:0.45s"/><text class="focus" x="850" y="611"><tspan x="850" dy="0">HAVING은 그룹 조건, ORDER BY는</tspan><tspan x="850" dy="18">정렬이다. 시험 답안 예: &quot;HAVING은</tspan></text><circle cx="832" cy="661" r="6" fill="#14b8a6" class="pulse" style="animation-delay:0.9s"/><text class="focus" x="850" y="669"><tspan x="850" dy="0">JOIN은 테이블 간 관련 행을 결합한다.</tspan><tspan x="850" dy="18">시험 답안 예: &quot;JOIN은 두 개 이상의</tspan></text>
