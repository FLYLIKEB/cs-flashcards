<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc">
  <title id="title">07-03 SQL 실행 순서와 절 역할 인포그래픽</title>
  <desc id="desc">SQL의 작성 순서, 실제 실행 순서 8단계, WHERE와 HAVING 차이, JOIN과 GROUP BY 해석 포인트를 정리한 인포그래픽</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .title { font: 700 34px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .subtitle { font: 500 18px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
      .section { font: 700 22px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .label { font: 700 18px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .body { font: 500 15px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
      .small { font: 500 13px 'Pretendard','Noto Sans KR',sans-serif; fill: #475569; }
      .chipText { font: 700 14px 'Pretendard','Noto Sans KR',sans-serif; fill: #1d4ed8; }
      .stepNo { font: 700 16px 'Pretendard','Noto Sans KR',sans-serif; fill: #ffffff; }
      .sql { font: 600 16px 'SFMono-Regular',Consolas,'Liberation Mono',monospace; fill: #e2e8f0; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="920" />
  <rect x="28" y="28" width="1144" height="864" rx="28" class="card" />

  <text x="68" y="90" class="title">07-03. SQL</text>
  <text x="68" y="122" class="subtitle">작성 순서와 실행 순서를 분리해서 기억하면 WHERE, HAVING, GROUP BY 문제를 훨씬 안정적으로 푼다.</text>

  <rect x="68" y="154" width="1064" height="92" rx="20" fill="#dbeafe" stroke="#93c5fd" stroke-width="2" />
  <text x="92" y="188" class="section">작성 순서</text>
  <text x="92" y="214" class="body">문장을 쓰는 순서는 SELECT부터 시작하지만, 데이터는 FROM부터 준비된다.</text>
  <g transform="translate(330 176)">
    <rect x="0" y="0" width="92" height="34" rx="17" fill="#ffffff" stroke="#60a5fa" /><text x="46" y="22" text-anchor="middle" class="chipText">SELECT</text>
    <rect x="106" y="0" width="82" height="34" rx="17" fill="#ffffff" stroke="#60a5fa" /><text x="147" y="22" text-anchor="middle" class="chipText">FROM</text>
    <rect x="202" y="0" width="90" height="34" rx="17" fill="#ffffff" stroke="#60a5fa" /><text x="247" y="22" text-anchor="middle" class="chipText">WHERE</text>
    <rect x="306" y="0" width="112" height="34" rx="17" fill="#ffffff" stroke="#60a5fa" /><text x="362" y="22" text-anchor="middle" class="chipText">GROUP BY</text>
    <rect x="432" y="0" width="98" height="34" rx="17" fill="#ffffff" stroke="#60a5fa" /><text x="481" y="22" text-anchor="middle" class="chipText">HAVING</text>
    <rect x="544" y="0" width="108" height="34" rx="17" fill="#ffffff" stroke="#60a5fa" /><text x="598" y="22" text-anchor="middle" class="chipText">ORDER BY</text>
  </g>

  <rect x="68" y="274" width="330" height="344" rx="24" fill="#0f172a" />
  <text x="92" y="314" class="section" fill="#ffffff">예시 쿼리</text>
  <text x="92" y="342" class="small" fill="#94a3b8">활성 고객의 주문 수를 집계해 5건 이상만 출력</text>
  <text x="92" y="382" class="sql">SELECT c.customer_id, c.name,</text>
  <text x="92" y="408" class="sql">       COUNT(o.order_id) AS order_count</text>
  <text x="92" y="434" class="sql">FROM customers c</text>
  <text x="92" y="460" class="sql">JOIN orders o ON c.customer_id =</text>
  <text x="92" y="486" class="sql">     o.customer_id</text>
  <text x="92" y="512" class="sql">WHERE c.active = TRUE</text>
  <text x="92" y="538" class="sql">GROUP BY c.customer_id, c.name</text>
  <text x="92" y="564" class="sql">HAVING COUNT(o.order_id) &gt;= 5</text>
  <text x="92" y="590" class="sql">ORDER BY order_count DESC;</text>

  <rect x="92" y="622" width="282" height="66" rx="16" fill="#1e293b" stroke="#475569" stroke-width="2" />
  <text x="110" y="650" class="body" fill="#e2e8f0">채점 포인트:</text>
  <text x="110" y="674" class="small" fill="#cbd5e1">WHERE는 행을, HAVING은 집계가 끝난 그룹을 걸러낸다.</text>

  <text x="430" y="304" class="section">실행 순서 8단계</text>
  <text x="430" y="330" class="body">왼쪽에서 오른쪽, 위에서 아래 순서로 읽는다.</text>

  <g transform="translate(430 356)">
    <g transform="translate(0 0)">
      <rect x="0" y="0" width="160" height="150" rx="20" fill="#eff6ff" stroke="#93c5fd" stroke-width="2" />
      <circle cx="30" cy="30" r="18" fill="#2563eb" /><text x="30" y="36" text-anchor="middle" class="stepNo">1</text>
      <text x="30" y="68" class="label">FROM</text>
      <text x="30" y="94" class="body">기준 테이블을 선택한다.</text>
      <text x="30" y="116" class="small">예: customers</text>
      <text x="30" y="136" class="small">서브쿼리도 이 단계에서 준비</text>
    </g>
    <g transform="translate(178 0)">
      <rect x="0" y="0" width="160" height="150" rx="20" fill="#ecfeff" stroke="#67e8f9" stroke-width="2" />
      <circle cx="30" cy="30" r="18" fill="#0891b2" /><text x="30" y="36" text-anchor="middle" class="stepNo">2</text>
      <text x="30" y="68" class="label">JOIN</text>
      <text x="30" y="94" class="body">관련 행을 결합한다.</text>
      <text x="30" y="116" class="small">예: customers ⨝ orders</text>
      <text x="30" y="136" class="small">조인 조건이 결과 행 수를 좌우</text>
    </g>
    <g transform="translate(356 0)">
      <rect x="0" y="0" width="160" height="150" rx="20" fill="#f0fdf4" stroke="#86efac" stroke-width="2" />
      <circle cx="30" cy="30" r="18" fill="#16a34a" /><text x="30" y="36" text-anchor="middle" class="stepNo">3</text>
      <text x="30" y="68" class="label">WHERE</text>
      <text x="30" y="94" class="body">개별 행을 먼저 줄인다.</text>
      <text x="30" y="116" class="small">예: active = TRUE</text>
      <text x="30" y="136" class="small">집계 함수는 여기서 못 쓴다.</text>
    </g>
    <g transform="translate(534 0)">
      <rect x="0" y="0" width="160" height="150" rx="20" fill="#fffbeb" stroke="#fcd34d" stroke-width="2" />
      <circle cx="30" cy="30" r="18" fill="#d97706" /><text x="30" y="36" text-anchor="middle" class="stepNo">4</text>
      <text x="30" y="68" class="label">GROUP BY</text>
      <text x="30" y="94" class="body">남은 행을 묶어 그룹을 만든다.</text>
      <text x="30" y="116" class="small">예: customer_id, name</text>
      <text x="30" y="136" class="small">집계 기준이 여기서 확정</text>
    </g>

    <g transform="translate(0 176)">
      <rect x="0" y="0" width="160" height="150" rx="20" fill="#fff7ed" stroke="#fdba74" stroke-width="2" />
      <circle cx="30" cy="30" r="18" fill="#ea580c" /><text x="30" y="36" text-anchor="middle" class="stepNo">5</text>
      <text x="30" y="68" class="label">HAVING</text>
      <text x="30" y="94" class="body">그룹 조건을 적용한다.</text>
      <text x="30" y="116" class="small">예: COUNT(order_id) ≥ 5</text>
      <text x="30" y="136" class="small">집계 결과를 기준으로 판별</text>
    </g>
    <g transform="translate(178 176)">
      <rect x="0" y="0" width="160" height="150" rx="20" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2" />
      <circle cx="30" cy="30" r="18" fill="#7c3aed" /><text x="30" y="36" text-anchor="middle" class="stepNo">6</text>
      <text x="30" y="68" class="label">SELECT</text>
      <text x="30" y="94" class="body">보여줄 컬럼을 계산한다.</text>
      <text x="30" y="116" class="small">id, name, COUNT(...)</text>
      <text x="30" y="136" class="small">별칭과 표현식 결과가 확정</text>
    </g>
    <g transform="translate(356 176)">
      <rect x="0" y="0" width="160" height="150" rx="20" fill="#fdf2f8" stroke="#f9a8d4" stroke-width="2" />
      <circle cx="30" cy="30" r="18" fill="#db2777" /><text x="30" y="36" text-anchor="middle" class="stepNo">7</text>
      <text x="30" y="68" class="label">ORDER BY</text>
      <text x="30" y="94" class="body">정렬 기준을 적용한다.</text>
      <text x="30" y="116" class="small">예: order_count DESC</text>
      <text x="30" y="136" class="small">오름차순이 기본값</text>
    </g>
    <g transform="translate(534 176)">
      <rect x="0" y="0" width="160" height="150" rx="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" />
      <circle cx="30" cy="30" r="18" fill="#475569" /><text x="30" y="36" text-anchor="middle" class="stepNo">8</text>
      <text x="30" y="68" class="label">LIMIT / OFFSET</text>
      <text x="30" y="94" class="body">필요한 개수만 남긴다.</text>
      <text x="30" y="116" class="small">상위 N개, 페이지 분할</text>
      <text x="30" y="136" class="small">맨 마지막에 잘라낸다.</text>
    </g>
  </g>

  <line x1="510" y1="430" x2="590" y2="430" stroke="#94a3b8" stroke-width="3" />
  <line x1="688" y1="430" x2="768" y2="430" stroke="#94a3b8" stroke-width="3" />
  <line x1="866" y1="430" x2="946" y2="430" stroke="#94a3b8" stroke-width="3" />
  <line x1="1024" y1="514" x2="1024" y2="548" stroke="#94a3b8" stroke-width="3" />
  <line x1="946" y1="606" x2="866" y2="606" stroke="#94a3b8" stroke-width="3" />
  <line x1="768" y1="606" x2="688" y2="606" stroke="#94a3b8" stroke-width="3" />
  <line x1="590" y1="606" x2="510" y2="606" stroke="#94a3b8" stroke-width="3" />

  <rect x="68" y="724" width="514" height="124" rx="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" />
  <text x="92" y="760" class="section">WHERE vs HAVING</text>
  <text x="92" y="790" class="body">WHERE: GROUP BY 이전에 개별 행을 줄인다. 그래서 COUNT 같은 집계 함수는 쓸 수 없다.</text>
  <text x="92" y="816" class="body">HAVING: GROUP BY 이후에 묶인 그룹을 걸러낸다. 따라서 COUNT, SUM 같은 집계 조건이 가능하다.</text>

  <rect x="606" y="724" width="526" height="124" rx="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" />
  <text x="630" y="760" class="section">JOIN과 GROUP BY 해석 포인트</text>
  <text x="630" y="790" class="body">JOIN은 행을 늘리거나 결합하는 단계이고, GROUP BY는 그 행들을 같은 기준으로 다시 묶는 단계다.</text>
  <text x="630" y="816" class="body">문제에서 결과 행 수가 왜 바뀌는지 묻는다면 조인 조건과 그룹 기준을 따로 설명하면 된다.</text>

  <text x="68" y="874" class="small">07-03-sql-infographic.svg · SQL 문장을 읽을 때의 작성 순서와 실제 처리 순서를 넉넉한 간격으로 재구성</text>
</svg>
