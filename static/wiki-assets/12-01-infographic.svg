<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">12-01. 의사소통 독해 판단 루틴 인포그래픽</title>
  <desc id="desc">질문 유형 분류, 주제문과 근거 분리, 선지 검증 순서를 통해 의사소통 문제를 푸는 루틴을 설명하는 SVG</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="themeFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="evidenceFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dcfce7"/>
      <stop offset="100%" stop-color="#bbf7d0"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <style>
      .title { font: 800 34px sans-serif; fill: #0f172a; }
      .subtitle { font: 600 18px sans-serif; fill: #334155; }
      .section { font: 800 24px sans-serif; fill: #0f172a; }
      .label { font: 700 18px sans-serif; fill: #0f172a; }
      .body { font: 500 16px/1.45 sans-serif; fill: #334155; }
      .small { font: 600 14px sans-serif; fill: #334155; }
      .tiny { font: 700 13px sans-serif; fill: #e2e8f0; letter-spacing: 0.08em; }
      .chip { font: 700 15px sans-serif; fill: #0f172a; }
      .num { font: 800 18px sans-serif; fill: #ffffff; }
      .darkSection { font: 800 23px sans-serif; fill: #ffffff; }
      .darkBody { font: 500 15px/1.45 sans-serif; fill: #e2e8f0; }
    </style>
  </defs>

  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect x="28" y="28" width="1144" height="844" rx="30" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="56" y="54" width="1088" height="116" rx="24" fill="url(#header)"/>
  <text class="tiny" x="88" y="94">NCS 의사소통 · 독해형 문제 풀이</text>
  <text class="title" x="88" y="132">문제 요구를 먼저 잡고, 주제문·근거로 선지를 검증한다</text>
  <text class="subtitle" x="88" y="166">질문 유형 분류 → 지문 스키밍 → 근거 문장 확인 → 과장·반례 선지 제거</text>

  <rect x="68" y="202" width="320" height="388" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="110" cy="244" r="20" fill="#2563eb"/>
  <text class="num" x="110" y="251" text-anchor="middle">1</text>
  <text class="section" x="142" y="252">질문 유형 먼저 표시</text>
  <text class="small" x="92" y="286">문제가 무엇을 묻는지 먼저 적어 두면 읽을 범위가 줄어든다.</text>

  <rect x="92" y="312" width="92" height="44" rx="14" fill="#dbeafe" stroke="#60a5fa"/>
  <text class="chip" x="138" y="340" text-anchor="middle">요지</text>
  <rect x="194" y="312" width="92" height="44" rx="14" fill="#dcfce7" stroke="#4ade80"/>
  <text class="chip" x="240" y="340" text-anchor="middle">세부</text>
  <rect x="92" y="368" width="92" height="44" rx="14" fill="#fef3c7" stroke="#f59e0b"/>
  <text class="chip" x="138" y="396" text-anchor="middle">추론</text>
  <rect x="194" y="368" width="120" height="44" rx="14" fill="#fee2e2" stroke="#f87171"/>
  <text class="chip" x="254" y="396" text-anchor="middle">어휘·어법</text>

  <rect x="92" y="436" width="272" height="126" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="6 6"/>
  <text class="label" x="114" y="466">빠른 체크</text>
  <text class="body" x="114" y="494">• 요지 / 세부 / 추론 / 어휘 문제인지 표시</text>
  <text class="body" x="114" y="520">• 질문 키워드와 맞는 문단만 우선 스캔</text>
  <text class="body" x="114" y="546">• 문제 요구와 무관한 정보는 잠시 보류</text>

  <rect x="440" y="202" width="320" height="388" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="482" cy="244" r="20" fill="#2563eb"/>
  <text class="num" x="482" y="251" text-anchor="middle">2</text>
  <text class="section" x="514" y="252">주제문과 근거를 분리</text>
  <text class="small" x="464" y="286">문단의 주장과 그 이유를 다른 역할로 읽어야 선지가 덜 흔들린다.</text>

  <rect x="464" y="314" width="272" height="116" rx="20" fill="url(#themeFill)" stroke="#60a5fa" stroke-width="2"/>
  <text class="label" x="600" y="344" text-anchor="middle">주제문</text>
  <text class="body" x="488" y="372">• 문단의 주장, 결론, 요약</text>
  <text class="body" x="488" y="398">• 첫문장·마지막문장 후보부터 확인</text>
  <rect x="488" y="406" width="224" height="16" rx="8" fill="#ffffff" opacity="0.96"/>
  <text class="small" x="600" y="418" text-anchor="middle">요지 문제의 직접 단서</text>

  <rect x="464" y="448" width="272" height="116" rx="20" fill="url(#evidenceFill)" stroke="#4ade80" stroke-width="2"/>
  <text class="label" x="600" y="478" text-anchor="middle">근거</text>
  <text class="body" x="488" y="506">• 데이터, 사례, 이유 설명</text>
  <text class="body" x="488" y="532">• 숫자·연도·인용구를 표시해 두기</text>
  <rect x="488" y="540" width="224" height="16" rx="8" fill="#ffffff" opacity="0.96"/>
  <text class="small" x="600" y="552" text-anchor="middle">세부·추론 판단 재료</text>

  <rect x="812" y="202" width="320" height="388" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="854" cy="244" r="20" fill="#2563eb"/>
  <text class="num" x="854" y="251" text-anchor="middle">3</text>
  <text class="section" x="886" y="252">선지 검증 필터</text>
  <text class="small" x="836" y="286">근거가 없거나 과장된 표현은 먼저 지우고 남은 선지를 비교한다.</text>

  <rect x="836" y="316" width="272" height="74" rx="18" fill="#ffffff" stroke="#94a3b8"/>
  <text class="label" x="858" y="344">직접 근거가 있는가?</text>
  <text class="body" x="858" y="370">지문 문장으로 바로 확인 가능한지 본다.</text>

  <rect x="836" y="406" width="272" height="74" rx="18" fill="#ffffff" stroke="#94a3b8"/>
  <text class="label" x="858" y="434">과장 표현은 없는가?</text>
  <text class="body" x="858" y="460">항상·절대·모두·전혀 같은 단어를 경계한다.</text>

  <rect x="836" y="496" width="272" height="74" rx="18" fill="#ffffff" stroke="#94a3b8"/>
  <text class="label" x="858" y="524">반례가 생기지 않는가?</text>
  <text class="body" x="858" y="550">문맥을 뒤집는 예외가 없는지 마지막으로 본다.</text>

  <path d="M 388 396 C 412 396, 420 396, 440 396" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M 760 396 C 784 396, 792 396, 812 396" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="68" y="626" width="1064" height="214" rx="28" fill="#0f172a"/>
  <text class="darkSection" x="98" y="668">문제 유형별 핵심 전략</text>
  <text class="darkBody" x="98" y="696">한 화면에서 끝내기보다 유형마다 무엇을 먼저 볼지 분리해서 기억하면 정답률이 안정된다.</text>

  <rect x="92" y="722" width="236" height="90" rx="20" fill="#1e40af"/>
  <text class="label" x="118" y="754" fill="#ffffff">요지 · 주제</text>
  <text class="darkBody" x="118" y="780">주제문을 먼저 찾고 첫문장과</text>
  <text class="darkBody" x="118" y="802">마지막문장을 서로 대조한다.</text>

  <rect x="344" y="722" width="236" height="90" rx="20" fill="#166534"/>
  <text class="label" x="370" y="754" fill="#ffffff">세부사항</text>
  <text class="darkBody" x="370" y="780">숫자, 사례, 연도처럼 바로</text>
  <text class="darkBody" x="370" y="802">대조할 수 있는 근거를 찾는다.</text>

  <rect x="596" y="722" width="236" height="90" rx="20" fill="#9a3412"/>
  <text class="label" x="622" y="754" fill="#ffffff">추론</text>
  <text class="darkBody" x="622" y="780">지문이 허용하는 범위까지만</text>
  <text class="darkBody" x="622" y="802">연결하고 바깥 확장은 막는다.</text>

  <rect x="848" y="722" width="236" height="90" rx="20" fill="#7c2d12"/>
  <text class="label" x="874" y="754" fill="#ffffff">어휘 · 어법</text>
  <text class="darkBody" x="874" y="780">문맥으로 의미를 확인하고</text>
  <text class="darkBody" x="874" y="802">표면 단어만 보고 판단하지 않는다.</text>
</svg>
