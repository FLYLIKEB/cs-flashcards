<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">12-01. 의사소통 독해 판단 루틴 인포그래픽</title>
  <desc id="desc">질문 유형 분류, 주제문과 근거 분리, 선지 검증 순서를 통해 의사소통 문제를 푸는 루틴을 설명하는 SVG</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="themeFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="evidenceFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dcfce7"/>
      <stop offset="100%" stop-color="#bbf7d0"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <style>
      .title { font: 800 34px sans-serif; fill: #0f172a; }
      .subtitle { font: 500 16px sans-serif; fill: #334155; }
      .section { font: 700 22px sans-serif; fill: #0f172a; }
      .label { font: 700 17px sans-serif; fill: #0f172a; }
      .body { font: 500 15px sans-serif; fill: #334155; }
      .small { font: 600 13px sans-serif; fill: #475569; }
      .tiny { font: 700 12px sans-serif; fill: #64748b; letter-spacing: 0.08em; }
      .chip { font: 700 14px sans-serif; fill: #1e293b; }
      .num { font: 800 18px sans-serif; fill: white; }
    </style>
  </defs>

  <rect width="1200" height="720" fill="url(#bg)"/>
  <rect x="28" y="28" width="1144" height="664" rx="30" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="56" y="54" width="1088" height="92" rx="24" fill="url(#header)"/>
  <text class="tiny" x="88" y="90">NCS 의사소통 · 독해형 문제 풀이</text>
  <text class="title" x="88" y="124">문제 요구를 먼저 잡고, 주제문·근거로 선지를 검증한다</text>
  <text class="subtitle" x="88" y="170">질문 유형 분류 → 지문 스키밍 → 근거 문장 확인 → 과장·반례 선지 제거</text>

  <rect x="68" y="188" width="250" height="332" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="104" cy="225" r="18" fill="#2563eb"/>
  <text class="num" x="104" y="232" text-anchor="middle">1</text>
  <text class="section" x="132" y="232">질문 유형 먼저 표시</text>
  <text class="small" x="92" y="264">문제가 무엇을 묻는지 한두 단어로 표시</text>

  <rect x="92" y="286" width="94" height="46" rx="16" fill="#dbeafe" stroke="#60a5fa"/>
  <text class="chip" x="139" y="315" text-anchor="middle">요지</text>
  <rect x="200" y="286" width="94" height="46" rx="16" fill="#dcfce7" stroke="#4ade80"/>
  <text class="chip" x="247" y="315" text-anchor="middle">세부</text>
  <rect x="92" y="346" width="94" height="46" rx="16" fill="#fef3c7" stroke="#f59e0b"/>
  <text class="chip" x="139" y="375" text-anchor="middle">추론</text>
  <rect x="200" y="346" width="94" height="46" rx="16" fill="#fee2e2" stroke="#f87171"/>
  <text class="chip" x="247" y="375" text-anchor="middle">어휘·어법</text>
  <rect x="92" y="406" width="202" height="84" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="6 6"/>
  <text class="label" x="112" y="434">핵심 표시</text>
  <text class="body" x="112" y="460">• 요지/목적/근거/추론 여부</text>
  <text class="body" x="112" y="482">• 문제 요구와 맞는 위치만 읽기</text>

  <rect x="342" y="188" width="516" height="332" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="378" cy="225" r="18" fill="#2563eb"/>
  <text class="num" x="378" y="232" text-anchor="middle">2</text>
  <text class="section" x="406" y="232">지문을 두 층으로 분리</text>
  <text class="small" x="366" y="264">문단의 주제문과 근거를 섞지 않고 읽는다</text>

  <rect x="372" y="286" width="200" height="198" rx="22" fill="url(#themeFill)" stroke="#60a5fa" stroke-width="2"/>
  <text class="label" x="472" y="320" text-anchor="middle">주제문</text>
  <text class="body" x="394" y="352">• 문단의 주장, 결론</text>
  <text class="body" x="394" y="378">• 첫문장·요약문 후보 확인</text>
  <text class="body" x="394" y="404">• 요지 문제의 직접 단서</text>
  <rect x="394" y="426" width="156" height="38" rx="12" fill="#ffffff" opacity="0.95"/>
  <text class="chip" x="472" y="450" text-anchor="middle">답으로 연결되는 문장</text>

  <rect x="626" y="286" width="200" height="198" rx="22" fill="url(#evidenceFill)" stroke="#4ade80" stroke-width="2"/>
  <text class="label" x="726" y="320" text-anchor="middle">근거</text>
  <text class="body" x="648" y="352">• 데이터, 사례, 이유 설명</text>
  <text class="body" x="648" y="378">• 숫자·연도·인용구 체크</text>
  <text class="body" x="648" y="404">• 세부·추론 문제의 판단 재료</text>
  <rect x="648" y="426" width="156" height="38" rx="12" fill="#ffffff" opacity="0.95"/>
  <text class="chip" x="726" y="450" text-anchor="middle">주장을 받치는 문장</text>

  <line x1="572" y1="385" x2="626" y2="385" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
  <text class="small" x="599" y="372" text-anchor="middle">분리해서 읽기</text>

  <rect x="882" y="188" width="250" height="332" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="918" cy="225" r="18" fill="#2563eb"/>
  <text class="num" x="918" y="232" text-anchor="middle">3</text>
  <text class="section" x="946" y="232">선지 검증 필터</text>
  <text class="small" x="906" y="264">근거가 없거나 과장되면 우선 제거</text>

  <rect x="906" y="288" width="202" height="58" rx="16" fill="#ffffff" stroke="#94a3b8"/>
  <text class="label" x="928" y="314">직접 근거 존재?</text>
  <text class="body" x="928" y="336">지문 문장으로 확인 가능한가</text>

  <rect x="906" y="360" width="202" height="58" rx="16" fill="#ffffff" stroke="#94a3b8"/>
  <text class="label" x="928" y="386">과장 표현 경계</text>
  <text class="body" x="928" y="408">항상·절대·모두·전혀</text>

  <rect x="906" y="432" width="202" height="58" rx="16" fill="#ffffff" stroke="#94a3b8"/>
  <text class="label" x="928" y="458">반례 가능성 확인</text>
  <text class="body" x="928" y="480">문맥상 뒤집히는 경우는 없는가</text>

  <path d="M 318 354 C 332 354, 336 354, 342 354" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M 858 354 C 872 354, 876 354, 882 354" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="68" y="546" width="1064" height="118" rx="24" fill="#0f172a"/>
  <text class="section" x="98" y="582" fill="#ffffff">문제 유형별 핵심 전략</text>

  <rect x="92" y="600" width="160" height="40" rx="14" fill="#1e40af"/>
  <text class="chip" x="172" y="625" text-anchor="middle" fill="#ffffff">요지</text>
  <text class="body" x="262" y="625" fill="#e2e8f0">주제문 찾기 · 첫문장/마지막문장 대조</text>

  <rect x="528" y="600" width="160" height="40" rx="14" fill="#166534"/>
  <text class="chip" x="608" y="625" text-anchor="middle" fill="#ffffff">세부·추론</text>
  <text class="body" x="698" y="625" fill="#e2e8f0">숫자·사례 확인, 지문 밖 확장 금지</text>

  <rect x="776" y="600" width="160" height="40" rx="14" fill="#9a3412"/>
  <text class="chip" x="856" y="625" text-anchor="middle" fill="#ffffff">어휘·어법</text>
  <text class="body" x="946" y="625" fill="#e2e8f0">문맥으로 의미 확인 · 표면 단어만 보지 않기</text>

  <text class="small" x="98" y="654" fill="#cbd5e1">체크포인트: 질문 유형 분류 → 주제문 표시 → 근거 하이라이트 → 과장·반례 선지 제거</text>
</svg>
