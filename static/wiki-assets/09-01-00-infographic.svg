<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">09-01. 선형 자료구조 인포그래픽</title>
  <desc id="desc">배열, 연결리스트, 스택, 큐를 선형 순서와 접근 방식, 삽입 삭제 특성으로 비교하는 페이지 전용 SVG</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .card { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .title { font: 700 34px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .subtitle { font: 500 17px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
      .section { font: 700 22px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .label { font: 700 16px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .body { font: 500 14px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
      .small { font: 600 12px 'Pretendard','Noto Sans KR',sans-serif; fill: #475569; }
      .chip { font: 700 15px 'Pretendard','Noto Sans KR',sans-serif; fill: #1e293b; }
      .metric { font: 700 18px 'Pretendard','Noto Sans KR',sans-serif; fill: #1d4ed8; }
    </style>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669"/>
    </marker>
  </defs>

  <rect class="bg" width="1200" height="720"/>
  <rect x="34" y="34" width="1132" height="652" rx="28" fill="#e2e8f0"/>
  <rect x="46" y="46" width="1108" height="628" rx="26" fill="#ffffff"/>

  <text class="small" x="84" y="92">자료구조 핵심 비교 · 순서, 접근, 삽입/삭제, 사용 상황</text>
  <text class="title" x="84" y="130">09-01. 선형 자료구조</text>
  <text class="subtitle" x="84" y="164">데이터가 한 줄 순서로 이어지지만, 접근 방식과 넣고 빼는 비용은 구조마다 다르다.</text>

  <rect x="84" y="188" width="1032" height="76" rx="20" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
  <text class="section" x="112" y="220">공통점: 모든 원소가 1차원 순서를 가진다</text>
  <line x1="174" y1="238" x2="1018" y2="238" stroke="#2563eb" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
  <circle cx="210" cy="238" r="15" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <circle cx="370" cy="238" r="15" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <circle cx="530" cy="238" r="15" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <circle cx="690" cy="238" r="15" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <circle cx="850" cy="238" r="15" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text class="small" x="202" y="243">0</text>
  <text class="small" x="362" y="243">1</text>
  <text class="small" x="522" y="243">2</text>
  <text class="small" x="682" y="243">3</text>
  <text class="small" x="842" y="243">4</text>
  <text class="body" x="1040" y="243">앞뒤 관계가 분명</text>

  <rect class="card" x="84" y="286" width="510" height="286" rx="24"/>
  <text class="section" x="112" y="324">배열 vs 연결리스트</text>

  <rect x="112" y="344" width="218" height="200" rx="18" fill="#f8fafc" stroke="#cbd5e1"/>
  <text class="label" x="132" y="372">배열 Array</text>
  <text class="metric" x="132" y="396">인덱스 접근 O(1)</text>
  <rect x="132" y="414" width="36" height="42" rx="8" fill="#dbeafe" stroke="#60a5fa"/>
  <rect x="172" y="414" width="36" height="42" rx="8" fill="#dbeafe" stroke="#60a5fa"/>
  <rect x="212" y="414" width="36" height="42" rx="8" fill="#93c5fd" stroke="#2563eb"/>
  <rect x="252" y="414" width="36" height="42" rx="8" fill="#dbeafe" stroke="#60a5fa"/>
  <rect x="292" y="414" width="36" height="42" rx="8" fill="#dbeafe" stroke="#60a5fa"/>
  <text class="small" x="145" y="439">0</text>
  <text class="small" x="185" y="439">1</text>
  <text class="small" x="225" y="439">2</text>
  <text class="small" x="265" y="439">3</text>
  <text class="small" x="305" y="439">4</text>
  <line x1="252" y1="400" x2="252" y2="372" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow-blue)"/>
  <text class="body" x="132" y="486">• 연속 메모리 → 캐시 친화적</text>
  <text class="body" x="132" y="508">• 중간 삽입/삭제는 뒤 원소 이동 O(n)</text>
  <text class="body" x="132" y="530">• 자주 찾는 데이터, 고정 크기에 적합</text>

  <rect x="348" y="344" width="218" height="200" rx="18" fill="#f8fafc" stroke="#cbd5e1"/>
  <text class="label" x="368" y="372">연결리스트 Linked List</text>
  <text class="metric" x="368" y="396">포인터 재연결 O(1)*</text>
  <rect x="370" y="420" width="48" height="34" rx="8" fill="#dcfce7" stroke="#34d399"/>
  <rect x="444" y="420" width="48" height="34" rx="8" fill="#bbf7d0" stroke="#10b981"/>
  <rect x="518" y="420" width="48" height="34" rx="8" fill="#dcfce7" stroke="#34d399"/>
  <line x1="418" y1="437" x2="444" y2="437" stroke="#059669" stroke-width="3" marker-end="url(#arrow-green)"/>
  <line x1="492" y1="437" x2="518" y2="437" stroke="#059669" stroke-width="3" marker-end="url(#arrow-green)"/>
  <rect x="444" y="476" width="48" height="34" rx="8" fill="#fef3c7" stroke="#f59e0b"/>
  <line x1="468" y1="476" x2="468" y2="454" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrow-slate)"/>
  <text class="small" x="436" y="530">*위치를 이미 알고 있을 때</text>
  <text class="body" x="368" y="486">• 임의 접근은 head부터 따라가며 O(n)</text>
  <text class="body" x="368" y="508">• 삽입/삭제가 잦고 크기 변화가 큰 경우 유리</text>

  <rect class="card" x="620" y="286" width="496" height="138" rx="24"/>
  <text class="section" x="648" y="324">스택 Stack</text>
  <text class="metric" x="648" y="348">LIFO · push / pop / peek</text>
  <rect x="684" y="360" width="92" height="24" rx="6" fill="#fde68a" stroke="#f59e0b"/>
  <rect x="684" y="388" width="92" height="24" rx="6" fill="#fcd34d" stroke="#f59e0b"/>
  <rect x="684" y="416" width="92" height="24" rx="6" fill="#fbbf24" stroke="#f59e0b"/>
  <line x1="812" y1="372" x2="812" y2="344" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrow-slate)"/>
  <line x1="838" y1="344" x2="838" y2="372" stroke="#dc2626" stroke-width="3" marker-end="url(#arrow-slate)"/>
  <text class="label" x="796" y="392">top</text>
  <text class="body" x="870" y="372">최근에 넣은 값이</text>
  <text class="body" x="870" y="394">가장 먼저 나온다.</text>
  <text class="body" x="870" y="418">예: 괄호 검사, DFS, 실행 취소</text>

  <rect class="card" x="620" y="434" width="496" height="138" rx="24"/>
  <text class="section" x="648" y="472">큐 Queue</text>
  <text class="metric" x="648" y="496">FIFO · enqueue / dequeue / front</text>
  <rect x="690" y="510" width="62" height="34" rx="8" fill="#ddd6fe" stroke="#8b5cf6"/>
  <rect x="756" y="510" width="62" height="34" rx="8" fill="#c4b5fd" stroke="#8b5cf6"/>
  <rect x="822" y="510" width="62" height="34" rx="8" fill="#a78bfa" stroke="#7c3aed"/>
  <rect x="888" y="510" width="62" height="34" rx="8" fill="#ddd6fe" stroke="#8b5cf6"/>
  <line x1="660" y1="527" x2="690" y2="527" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrow-slate)"/>
  <line x1="950" y1="527" x2="980" y2="527" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrow-slate)"/>
  <path d="M 950 550 A 120 36 0 0 1 690 550" fill="none" stroke="#a78bfa" stroke-width="3" stroke-dasharray="7 7"/>
  <text class="label" x="650" y="520">front</text>
  <text class="label" x="985" y="520">rear</text>
  <text class="body" x="648" y="558">원형 큐는 (rear + 1) % capacity 로 이동해 앞 삭제 O(n) 이동을 피한다.</text>

  <rect class="card" x="84" y="592" width="1032" height="64" rx="22"/>
  <text class="section" x="112" y="630">선택 기준</text>
  <rect x="250" y="606" width="184" height="34" rx="17" fill="#dbeafe"/>
  <text class="chip" x="342" y="629" text-anchor="middle">자주 찾기 → 배열</text>
  <rect x="450" y="606" width="232" height="34" rx="17" fill="#dcfce7"/>
  <text class="chip" x="566" y="629" text-anchor="middle">중간 삽입/삭제 → 리스트</text>
  <rect x="698" y="606" width="176" height="34" rx="17" fill="#fef3c7"/>
  <text class="chip" x="786" y="629" text-anchor="middle">되돌리기/DFS → 스택</text>
  <rect x="890" y="606" width="184" height="34" rx="17" fill="#ede9fe"/>
  <text class="chip" x="982" y="629" text-anchor="middle">대기열/BFS → 큐</text>
</svg>
