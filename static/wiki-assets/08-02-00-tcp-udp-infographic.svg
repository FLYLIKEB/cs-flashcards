<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1320" viewBox="0 0 1200 1320" role="img" aria-labelledby="title desc">
  <title id="title">08-02. TCP 신뢰성 흐름</title>
  <desc id="desc">TCP의 연결 설정, 데이터 전송과 ACK, 손실 시 재전송, 연결 종료와 TIME_WAIT 이유를 단계별로 설명하는 SVG이다.</desc>
  <defs>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1d4ed8" />
    </marker>
    <marker id="arrowSlate" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569" />
    </marker>
    <style>
      .title { font: 700 34px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .subtitle { font: 500 18px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
      .section { font: 700 24px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .label { font: 700 18px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .small { font: 600 15px 'Pretendard','Noto Sans KR',sans-serif; fill: #475569; }
      .tiny { font: 600 14px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
      .tcp { fill: #1d4ed8; }
    </style>
  </defs>

  <rect width="1200" height="1320" fill="#f8fafc"/>
  <rect x="32" y="32" width="1136" height="1256" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <text x="72" y="92" class="small">Transport layer reliability flow · handshake · ACK · retransmission · TIME_WAIT</text>
  <text x="72" y="132" class="title">TCP는 왜 신뢰적인가?</text>
  <text x="72" y="168" class="subtitle">연결을 먼저 만들고, 순서 번호와 ACK로 도착 여부를 확인하며, 손실 시 재전송하고, 종료 뒤에는 TIME_WAIT으로 늦게 온 패킷까지 격리한다.</text>

  <rect x="72" y="214" width="1048" height="286" rx="26" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="102" y="254" class="section tcp">1. 연결 설정: 3-way handshake</text>
  <text x="102" y="282" class="small">연결형 프로토콜이라서 전송 전에 양쪽 준비 상태를 먼저 맞춘다.</text>
  <rect x="118" y="314" width="172" height="54" rx="18" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
  <rect x="902" y="314" width="172" height="54" rx="18" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
  <text x="204" y="347" text-anchor="middle" class="label">Client</text>
  <text x="988" y="347" text-anchor="middle" class="label">Server</text>
  <line x1="204" y1="372" x2="204" y2="470" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="988" y1="372" x2="988" y2="470" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 6"/>

  <rect x="316" y="382" width="560" height="32" rx="16" fill="#dbeafe"/>
  <text x="596" y="403" text-anchor="middle" class="tiny">1) SYN: 클라이언트가 연결을 요청</text>
  <line x1="226" y1="430" x2="966" y2="430" stroke="#1d4ed8" stroke-width="4" marker-end="url(#arrowBlue)"/>

  <rect x="316" y="430" width="560" height="32" rx="16" fill="#dbeafe"/>
  <text x="596" y="451" text-anchor="middle" class="tiny">2) SYN + ACK: 서버가 수락하고 응답을 확인</text>
  <line x1="966" y1="478" x2="226" y2="478" stroke="#1d4ed8" stroke-width="4" marker-end="url(#arrowBlue)"/>

  <rect x="316" y="478" width="560" height="32" rx="16" fill="#dbeafe"/>
  <text x="596" y="499" text-anchor="middle" class="tiny">3) ACK: 양쪽 모두 전송 준비 완료</text>
  <line x1="226" y1="526" x2="966" y2="526" stroke="#1d4ed8" stroke-width="4" marker-end="url(#arrowBlue)"/>

  <rect x="72" y="530" width="1048" height="500" rx="26" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="102" y="570" class="section tcp">2. 데이터 전송: 순서 번호 + ACK + 재전송</text>
  <text x="102" y="598" class="small">시퀀스 번호로 순서를 관리하고, ACK가 없으면 RTO 뒤에 손실 구간을 다시 보낸다.</text>
  <rect x="118" y="630" width="172" height="54" rx="18" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
  <rect x="902" y="630" width="172" height="54" rx="18" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
  <text x="204" y="663" text-anchor="middle" class="label">송신자</text>
  <text x="988" y="663" text-anchor="middle" class="label">수신자</text>

  <rect x="336" y="700" width="520" height="32" rx="16" fill="#dbeafe"/>
  <text x="596" y="721" text-anchor="middle" class="tiny">손실 예시: 첫 전송 중 일부 세그먼트가 중간에서 사라질 수 있음</text>
  <line x1="226" y1="748" x2="966" y2="748" stroke="#93c5fd" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#arrowBlue)"/>
  <circle cx="640" cy="748" r="18" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="640" y="754" text-anchor="middle" class="tiny" fill="#991b1b">손실</text>

  <rect x="336" y="786" width="520" height="32" rx="16" fill="#e0f2fe"/>
  <text x="596" y="807" text-anchor="middle" class="tiny">정상 전송: seq=1200~1399 데이터 전송</text>
  <line x1="226" y1="854" x2="966" y2="854" stroke="#1d4ed8" stroke-width="4" marker-end="url(#arrowBlue)"/>

  <rect x="336" y="872" width="520" height="32" rx="16" fill="#f1f5f9"/>
  <text x="596" y="893" text-anchor="middle" class="tiny">ACK=1400: 다음 바이트를 기대</text>
  <line x1="966" y1="940" x2="226" y2="940" stroke="#475569" stroke-width="4" marker-end="url(#arrowSlate)"/>

  <rect x="336" y="958" width="520" height="32" rx="16" fill="#dbeafe"/>
  <text x="596" y="979" text-anchor="middle" class="tiny">RTO 경과 후 손실 구간 재전송 → 결국 ACK로 복구</text>
  <line x1="226" y1="1026" x2="966" y2="1026" stroke="#1d4ed8" stroke-width="4" stroke-dasharray="12 8" marker-end="url(#arrowBlue)"/>

  <rect x="72" y="1056" width="1048" height="190" rx="26" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="102" y="1096" class="section tcp">3. 연결 종료 후 TIME_WAIT</text>
  <text x="102" y="1124" class="small">연결을 닫은 뒤에도 잠시 소켓을 유지해 지연 패킷과 마지막 ACK 문제를 처리한다.</text>
  <line x1="180" y1="1164" x2="430" y2="1164" stroke="#1d4ed8" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <line x1="430" y1="1194" x2="180" y2="1194" stroke="#1d4ed8" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <text x="305" y="1154" text-anchor="middle" class="tiny">FIN</text>
  <text x="305" y="1218" text-anchor="middle" class="tiny">ACK</text>
  <line x1="500" y1="1164" x2="750" y2="1164" stroke="#1d4ed8" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <line x1="750" y1="1194" x2="500" y2="1194" stroke="#1d4ed8" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <text x="625" y="1154" text-anchor="middle" class="tiny">FIN</text>
  <text x="625" y="1218" text-anchor="middle" class="tiny">마지막 ACK</text>
  <circle cx="900" cy="1180" r="46" fill="#ffffff" stroke="#60a5fa" stroke-width="3"/>
  <text x="900" y="1172" text-anchor="middle" class="label tcp">TIME</text>
  <text x="900" y="1196" text-anchor="middle" class="label tcp">WAIT</text>
  <rect x="958" y="1138" width="136" height="84" rx="18" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="974" y="1164" class="tiny">핵심 이유</text>
  <text x="974" y="1188" class="tiny">• 지연 패킷 혼입 방지</text>
  <text x="974" y="1212" class="tiny">• 마지막 ACK 재전송 대비</text>
</svg>
