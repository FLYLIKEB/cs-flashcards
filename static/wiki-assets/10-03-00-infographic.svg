<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="940" viewBox="0 0 1200 940" role="img" aria-labelledby="title desc">
  <title id="title">10-03. 웹·네트워크 공격 개요</title>
  <desc id="desc">웹과 네트워크 공격의 주요 공격면, 침해 대상, 방어 계층을 분리해 보여주는 가독성 중심 SVG</desc>
  <defs>
    <style>
      text { font-family: 'Pretendard', 'Noto Sans KR', sans-serif; fill: #0f172a; }
      .eyebrow { font-size: 14px; font-weight: 700; letter-spacing: 0.12em; fill: #475569; }
      .title { font-size: 34px; font-weight: 800; }
      .subtitle { font-size: 18px; font-weight: 500; fill: #334155; }
      .section { font-size: 22px; font-weight: 800; }
      .cardTitle { font-size: 18px; font-weight: 800; }
      .body { font-size: 15px; font-weight: 500; fill: #334155; }
      .small { font-size: 14px; font-weight: 600; fill: #475569; }
      .impact { font-size: 17px; font-weight: 800; }
      .center { text-anchor: middle; }
    </style>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#dc2626" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#2563eb" />
    </marker>
  </defs>

  <rect width="1200" height="940" fill="#f8fafc" />
  <rect x="24" y="24" width="1152" height="892" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />

  <text class="eyebrow" x="64" y="74">ATTACK SURFACE MAP · VECTOR → CIA → DEFENSE</text>
  <text class="title" x="64" y="118">10-03. 웹·네트워크 공격</text>
  <text class="subtitle" x="64" y="152">공격은 입력·요청·세션 같은 진입점에서 시작되고, 기밀성·무결성·가용성을 흔든다.</text>
  <text class="subtitle" x="64" y="178">방어는 코드 수준 통제와 네트워크 계층 통제를 함께 설계해야 한다.</text>

  <rect x="56" y="214" width="340" height="520" rx="24" fill="#fff7ed" stroke="#fdba74" stroke-width="2" />
  <text class="section" x="84" y="254">① 대표 공격 벡터</text>
  <text class="small" x="84" y="280">입력값, 상태 변경 요청, 외부 URL 호출,</text>
  <text class="small" x="84" y="300">업로드 지점이 핵심 노출면이다.</text>

  <rect x="84" y="322" width="284" height="72" rx="18" fill="#ffffff" stroke="#f97316" stroke-width="2" />
  <circle cx="116" cy="358" r="12" fill="#dc2626" />
  <text class="cardTitle" x="140" y="348">XSS</text>
  <text class="body" x="140" y="368">출력 지점에 스크립트 주입</text>
  <text class="body" x="140" y="386">→ 세션 탈취, 화면 변조</text>

  <rect x="84" y="410" width="284" height="72" rx="18" fill="#ffffff" stroke="#f97316" stroke-width="2" />
  <circle cx="116" cy="446" r="12" fill="#dc2626" />
  <text class="cardTitle" x="140" y="436">SQL Injection</text>
  <text class="body" x="140" y="456">쿼리 구조 변조</text>
  <text class="body" x="140" y="474">→ 인증 우회, 데이터 유출·변경</text>

  <rect x="84" y="498" width="284" height="72" rx="18" fill="#ffffff" stroke="#f97316" stroke-width="2" />
  <circle cx="116" cy="534" r="12" fill="#dc2626" />
  <text class="cardTitle" x="140" y="524">CSRF</text>
  <text class="body" x="140" y="544">로그인된 사용자의 상태 변경 요청</text>
  <text class="body" x="140" y="562">→ 공격자가 대신 발생</text>

  <rect x="84" y="586" width="284" height="72" rx="18" fill="#ffffff" stroke="#f97316" stroke-width="2" />
  <circle cx="116" cy="622" r="12" fill="#dc2626" />
  <text class="cardTitle" x="140" y="612">SSRF</text>
  <text class="body" x="140" y="632">서버가 내부망·메타데이터 URL 호출</text>
  <text class="body" x="140" y="650">→ 내부 서비스·자격정보 노출</text>

  <rect x="84" y="674" width="284" height="60" rx="18" fill="#ffffff" stroke="#f97316" stroke-width="2" />
  <circle cx="116" cy="704" r="12" fill="#dc2626" />
  <text class="cardTitle" x="140" y="696">파일 업로드 취약점</text>
  <text class="body" x="140" y="718">웹쉘 업로드·경로 조작 → 원격 코드 실행</text>

  <rect x="430" y="214" width="338" height="520" rx="24" fill="#fffbeb" stroke="#f59e0b" stroke-width="2" />
  <text class="section center" x="599" y="254">② 침해되는 핵심 자산</text>
  <text class="small center" x="599" y="280">시험 답안은 CIA 축으로 정리하면 빠르게 구조화된다.</text>

  <rect x="474" y="314" width="250" height="104" rx="20" fill="#ffffff" stroke="#f59e0b" stroke-width="2" />
  <text class="impact center" x="599" y="350">기밀성 (Confidentiality)</text>
  <text class="body center" x="599" y="376">세션 토큰, 자격증명,</text>
  <text class="body center" x="599" y="398">내부 메타데이터, 패킷 정보 유출</text>

  <rect x="474" y="434" width="250" height="104" rx="20" fill="#ffffff" stroke="#f59e0b" stroke-width="2" />
  <text class="impact center" x="599" y="470">무결성 (Integrity)</text>
  <text class="body center" x="599" y="496">쿼리, 요청, 업로드 파일,</text>
  <text class="body center" x="599" y="518">화면 내용이 변조되거나 악용됨</text>

  <rect x="474" y="554" width="250" height="104" rx="20" fill="#ffffff" stroke="#f59e0b" stroke-width="2" />
  <text class="impact center" x="599" y="590">가용성 (Availability)</text>
  <text class="body center" x="599" y="616">대량 요청, 자원 고갈, 서비스 중단으로</text>
  <text class="body center" x="599" y="638">정상 사용이 어려워짐</text>

  <line x1="396" y1="358" x2="474" y2="366" stroke="#dc2626" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-red)" />
  <line x1="396" y1="446" x2="474" y2="486" stroke="#dc2626" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-red)" />
  <line x1="396" y1="534" x2="474" y2="486" stroke="#dc2626" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-red)" />
  <line x1="396" y1="622" x2="474" y2="366" stroke="#dc2626" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-red)" />
  <line x1="396" y1="704" x2="474" y2="606" stroke="#dc2626" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-red)" />

  <rect x="802" y="214" width="342" height="520" rx="24" fill="#eff6ff" stroke="#93c5fd" stroke-width="2" />
  <text class="section" x="830" y="254">③ 대응 계층</text>
  <text class="small" x="830" y="280">코드 수정이 1차 방어이고, 네트워크 장비와 정책이</text>
  <text class="small" x="830" y="300">2차 방어를 맡는다.</text>

  <rect x="830" y="324" width="286" height="96" rx="18" fill="#ffffff" stroke="#60a5fa" stroke-width="2" />
  <text class="cardTitle" x="854" y="356">코드 수준 통제</text>
  <text class="body" x="854" y="380">입력 검증, 출력 인코딩, Prepared Statement,</text>
  <text class="body" x="854" y="402">CSRF 토큰, 업로드 저장 정책, URL 차단</text>

  <rect x="830" y="438" width="286" height="96" rx="18" fill="#ffffff" stroke="#60a5fa" stroke-width="2" />
  <text class="cardTitle" x="854" y="470">네트워크·운영 통제</text>
  <text class="body" x="854" y="494">Firewall, WAF, IDS/IPS, VPN, 최소 권한,</text>
  <text class="body" x="854" y="516">로그 모니터링, 정책 튜닝, 백업·복구 절차</text>

  <rect x="830" y="552" width="286" height="120" rx="18" fill="#ffffff" stroke="#60a5fa" stroke-width="2" />
  <text class="cardTitle" x="854" y="584">기억할 답안 프레임</text>
  <text class="body" x="854" y="608">1. 공격 벡터: 어디서 입력·요청이 들어오는가?</text>
  <text class="body" x="854" y="632">2. 침해 자산: CIA 중 무엇이 깨지는가?</text>
  <text class="body" x="854" y="656">3. 방어책: 코드·설정·운영 통제를 어떻게 묶는가?</text>

  <line x1="724" y1="366" x2="830" y2="372" stroke="#2563eb" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-blue)" />
  <line x1="724" y1="486" x2="830" y2="486" stroke="#2563eb" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-blue)" />
  <line x1="724" y1="606" x2="830" y2="612" stroke="#2563eb" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow-blue)" />

  <rect x="56" y="744" width="1088" height="132" rx="24" fill="#0f172a" />
  <text x="88" y="784" style="font-size:22px;font-weight:800;fill:#f8fafc;">시험장에서 한 줄로 쓰는 정리</text>
  <text x="88" y="818" style="font-size:18px;font-weight:600;fill:#e2e8f0;">웹 공격은 입력·세션·URL 호출 같은 진입점을 악용해 CIA를 흔들고,</text>
  <text x="88" y="846" style="font-size:18px;font-weight:600;fill:#e2e8f0;">방어는 안전한 코드 작성과 네트워크 통제를 함께 묶을 때 효과가 커진다.</text>
</svg>
