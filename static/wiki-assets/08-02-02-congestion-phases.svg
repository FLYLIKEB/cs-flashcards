<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">08-02-02. TCP 혼잡제어 단계와 손실 반응</title>
  <desc id="desc">Slow Start, Congestion Avoidance, Fast Retransmit, Fast Recovery, Timeout 이후 재시작을 분리해 보여주는 SVG</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fffaf5"/>
      <stop offset="100%" stop-color="#f8fbff"/>
    </linearGradient>
    <style>
      text { font-family: 'Pretendard', 'Noto Sans KR', sans-serif; fill: #0f172a; }
      .eyebrow { font-size: 15px; font-weight: 700; letter-spacing: 0.08em; fill: #475569; }
      .title { font-size: 34px; font-weight: 800; }
      .subtitle { font-size: 18px; font-weight: 500; fill: #334155; }
      .section { font-size: 22px; font-weight: 800; }
      .body { font-size: 16px; font-weight: 500; fill: #334155; }
      .small { font-size: 14px; font-weight: 600; fill: #475569; }
      .tiny { font-size: 13px; font-weight: 600; fill: #64748b; }
      .axis { stroke: #475569; stroke-width: 2.2; }
      .grid { stroke: #cbd5e1; stroke-width: 1; stroke-dasharray: 6 7; }
    </style>
  </defs>

  <rect width="1200" height="820" fill="url(#bg)"/>
  <rect x="24" y="24" width="1152" height="772" rx="30" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <text class="eyebrow" x="72" y="78">TCP CONGESTION CONTROL PHASES</text>
  <text class="title" x="72" y="120">cwnd 변화와 혼잡 신호 반응</text>
  <text class="subtitle" x="72" y="154">Slow Start는 빠르게 키우고, Congestion Avoidance는 천천히 키우며, 손실이 오면 줄인다.</text>

  <rect x="64" y="196" width="1072" height="276" rx="26" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text class="section" x="96" y="234">1) cwnd 그래프를 먼저 읽기</text>

  <line class="axis" x1="120" y1="418" x2="1080" y2="418"/>
  <line class="axis" x1="120" y1="418" x2="120" y2="248"/>
  <text class="small" x="88" y="254">cwnd</text>
  <text class="small" x="1044" y="448">RTT</text>

  <line class="grid" x1="292" y1="248" x2="292" y2="418"/>
  <line class="grid" x1="560" y1="248" x2="560" y2="418"/>
  <line class="grid" x1="770" y1="248" x2="770" y2="418"/>
  <line class="grid" x1="950" y1="248" x2="950" y2="418"/>

  <polyline fill="none" stroke="#2563eb" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" points="120,406 170,392 220,364 270,308 320,308 380,296 440,284 500,270 560,258 620,268 680,278 740,290 800,350 860,338 920,324 980,406 1040,406"/>
  <line x1="320" y1="246" x2="320" y2="418" stroke="#0f766e" stroke-width="2" stroke-dasharray="7 7"/>
  <text class="small" x="320" y="236" text-anchor="middle">ssthresh 도달</text>

  <circle cx="800" cy="350" r="8" fill="#dc2626"/>
  <text class="small" x="800" y="378" text-anchor="middle">dup ACK 3개</text>
  <circle cx="980" cy="406" r="8" fill="#b91c1c"/>
  <text class="small" x="980" y="434" text-anchor="middle">timeout</text>

  <rect x="148" y="266" width="122" height="36" rx="12" fill="#dbeafe"/>
  <text class="small" x="209" y="289" text-anchor="middle">Slow Start</text>
  <rect x="396" y="236" width="190" height="36" rx="12" fill="#dcfce7"/>
  <text class="small" x="491" y="259" text-anchor="middle">Congestion Avoidance</text>
  <rect x="690" y="308" width="170" height="36" rx="12" fill="#ffedd5"/>
  <text class="small" x="775" y="331" text-anchor="middle">Fast Recovery</text>
  <rect x="980" y="446" width="120" height="34" rx="12" fill="#fee2e2"/>
  <text class="small" x="1040" y="468" text-anchor="middle">1 MSS부터 재시작</text>

  <rect x="64" y="500" width="246" height="244" rx="24" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text class="section" x="92" y="540">2) Slow Start</text>
  <text class="body" x="92" y="574">• 초기 cwnd를 작게 두고 시작</text>
  <text class="body" x="92" y="602">• ACK가 잘 오면 RTT마다 빠르게 증가</text>
  <text class="body" x="92" y="630">• 대역폭을 빠르게 탐색</text>
  <text class="body" x="92" y="658">• ssthresh에 닿으면 다음 단계로 전환</text>
  <rect x="92" y="684" width="190" height="38" rx="14" fill="#2563eb"/>
  <text x="187" y="708" text-anchor="middle" style="font-family:'Pretendard','Noto Sans KR',sans-serif;font-size:15px;font-weight:700;fill:#ffffff;">지수 증가 구간</text>

  <rect x="330" y="500" width="246" height="244" rx="24" fill="#ecfdf5" stroke="#86efac" stroke-width="2"/>
  <text class="section" x="358" y="540">3) Congestion Avoidance</text>
  <text class="body" x="358" y="574">• cwnd를 선형적으로 증가</text>
  <text class="body" x="358" y="602">• AIMD의 additive increase 구간</text>
  <text class="body" x="358" y="630">• 큐가 차기 전에 완만하게 조절</text>
  <text class="body" x="358" y="658">• 안정 구간이지만 손실은 계속 감시</text>
  <rect x="358" y="684" width="184" height="38" rx="14" fill="#16a34a"/>
  <text x="450" y="708" text-anchor="middle" style="font-family:'Pretendard','Noto Sans KR',sans-serif;font-size:15px;font-weight:700;fill:#ffffff;">선형 증가 구간</text>

  <rect x="596" y="500" width="246" height="244" rx="24" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <text class="section" x="624" y="540">4) dup ACK 3개</text>
  <text class="body" x="624" y="574">• 일부 세그먼트 손실 신호</text>
  <text class="body" x="624" y="602">• Fast Retransmit으로 즉시 재전송</text>
  <text class="body" x="624" y="630">• ssthresh = 현재 cwnd / 2</text>
  <text class="body" x="624" y="658">• Reno 계열은 Fast Recovery로 이어짐</text>
  <rect x="624" y="684" width="188" height="38" rx="14" fill="#ea580c"/>
  <text x="718" y="708" text-anchor="middle" style="font-family:'Pretendard','Noto Sans KR',sans-serif;font-size:15px;font-weight:700;fill:#ffffff;">절반 수준으로 감소</text>

  <rect x="862" y="500" width="274" height="244" rx="24" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
  <text class="section" x="890" y="540">5) Timeout</text>
  <text class="body" x="890" y="574">• 더 심한 혼잡 또는 광범위 손실 신호</text>
  <text class="body" x="890" y="602">• cwnd를 1 MSS 수준으로 크게 축소</text>
  <text class="body" x="890" y="630">• ssthresh는 보통 절반 수준으로 재설정</text>
  <text class="body" x="890" y="658">• 다시 Slow Start부터 시작</text>
  <rect x="890" y="684" width="214" height="38" rx="14" fill="#dc2626"/>
  <text x="997" y="708" text-anchor="middle" style="font-family:'Pretendard','Noto Sans KR',sans-serif;font-size:15px;font-weight:700;fill:#ffffff;">가장 강한 감속 신호</text>

  <text class="tiny" x="72" y="780">요약: dup ACK는 부분 손실, timeout은 심한 혼잡 신호로 보는 것이 시험 답안의 핵심이다.</text>
</svg>
