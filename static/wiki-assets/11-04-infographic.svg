<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">11-04. 형상관리 변경 통제 흐름</title>
  <desc id="desc">산출물 식별부터 기준선 확정, 변경요청, 영향분석, 승인과 구현, 검증과 배포까지의 형상관리 흐름과 감사 포인트를 보여주는 SVG</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 34px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .subtitle { font: 500 18px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
      .section { font: 700 22px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .label { font: 700 18px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .body { font: 500 15px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
      .small { font: 600 14px 'Pretendard','Noto Sans KR',sans-serif; fill: #475569; }
    </style>
  </defs>

  <rect width="1200" height="760" fill="url(#bg)"/>
  <rect x="28" y="28" width="1144" height="704" rx="30" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <text class="small" x="72" y="82">소프트웨어공학 · 형상관리 핵심 흐름</text>
  <text class="title" x="72" y="124">Baseline 이후 변경은 기록·승인·검증을 거쳐 반영한다</text>
  <text class="subtitle" x="72" y="158">금융권 시험에서는 기준선 정의, 변경 절차, 승인 이력, 롤백 계획, 감사추적의 연결을 한 번에 설명할 수 있어야 한다.</text>

  <rect x="64" y="196" width="1072" height="252" rx="28" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text class="section" x="92" y="236">변경 통제 메인 흐름</text>
  <line x1="150" y1="324" x2="1050" y2="324" stroke="#94a3b8" stroke-width="6" stroke-linecap="round" marker-end="url(#arrow)"/>

  <g>
    <circle cx="170" cy="324" r="24" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
    <text class="label" x="170" y="330" text-anchor="middle">1</text>
    <rect x="92" y="364" width="156" height="44" rx="14" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.5"/>
    <text class="label" x="170" y="391" text-anchor="middle">산출물 식별</text>
    <text class="small" x="170" y="430" text-anchor="middle">요구사항·설계</text>
    <text class="small" x="170" y="450" text-anchor="middle">코드·테스트 등록</text>
  </g>

  <g>
    <circle cx="350" cy="324" r="24" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
    <text class="label" x="350" y="330" text-anchor="middle">2</text>
    <rect x="272" y="364" width="156" height="44" rx="14" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5"/>
    <text class="label" x="350" y="391" text-anchor="middle">Baseline 확정</text>
    <text class="small" x="350" y="430" text-anchor="middle">검증·공식 승인</text>
    <text class="small" x="350" y="450" text-anchor="middle">기준 버전 고정</text>
  </g>

  <g>
    <circle cx="530" cy="324" r="24" fill="#e0f2fe" stroke="#0891b2" stroke-width="3"/>
    <text class="label" x="530" y="330" text-anchor="middle">3</text>
    <rect x="452" y="364" width="156" height="44" rx="14" fill="#ecfeff" stroke="#67e8f9" stroke-width="1.5"/>
    <text class="label" x="530" y="391" text-anchor="middle">변경 요청</text>
    <text class="small" x="530" y="430" text-anchor="middle">CR 등록 후</text>
    <text class="small" x="530" y="450" text-anchor="middle">사유·범위 명시</text>
  </g>

  <g>
    <circle cx="710" cy="324" r="24" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
    <text class="label" x="710" y="330" text-anchor="middle">4</text>
    <rect x="632" y="364" width="156" height="44" rx="14" fill="#f0fdf4" stroke="#86efac" stroke-width="1.5"/>
    <text class="label" x="710" y="391" text-anchor="middle">영향분석·승인</text>
    <text class="small" x="710" y="430" text-anchor="middle">CCB/CAB가</text>
    <text class="small" x="710" y="450" text-anchor="middle">범위·리스크 판단</text>
  </g>

  <g>
    <circle cx="890" cy="324" r="24" fill="#fef3c7" stroke="#d97706" stroke-width="3"/>
    <text class="label" x="890" y="330" text-anchor="middle">5</text>
    <rect x="812" y="364" width="156" height="44" rx="14" fill="#fffbeb" stroke="#fbbf24" stroke-width="1.5"/>
    <text class="label" x="890" y="391" text-anchor="middle">구현·검증·배포</text>
    <text class="small" x="890" y="430" text-anchor="middle">테스트 결과</text>
    <text class="small" x="890" y="450" text-anchor="middle">릴리스 태깅 확인</text>
  </g>

  <g>
    <circle cx="1030" cy="324" r="24" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/>
    <text class="label" x="1030" y="330" text-anchor="middle">6</text>
    <rect x="952" y="364" width="156" height="44" rx="14" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="1.5"/>
    <text class="label" x="1030" y="391" text-anchor="middle">이력 추적</text>
    <text class="small" x="1030" y="430" text-anchor="middle">누가·언제</text>
    <text class="small" x="1030" y="450" text-anchor="middle">무엇·왜 기록</text>
  </g>

  <rect x="64" y="482" width="520" height="204" rx="26" fill="#f8fbff" stroke="#93c5fd" stroke-width="2"/>
  <text class="section" x="92" y="522">시험 답안에 꼭 넣을 기준선 설명</text>
  <rect x="92" y="546" width="464" height="72" rx="18" fill="#dbeafe" stroke="#60a5fa" stroke-width="1.5"/>
  <text class="label" x="116" y="572">Baseline</text>
  <text class="body" x="116" y="594">검증되어 공식 승인된 산출물의 특정 버전이며,</text>
  <text class="body" x="116" y="614">이후 변경은 통제 절차를 따라야 하는 기준점.</text>
  <text class="small" x="92" y="644">답안 키워드: 공식 승인 · 기준 버전 · 변경요청 · 영향분석 · 승인 · 검증</text>
  <text class="small" x="92" y="668">관리 대상: 요구사항 명세서, 설계서, 소스코드, 테스트케이스, 배포 패키지</text>

  <rect x="612" y="482" width="524" height="204" rx="26" fill="#fffaf5" stroke="#fdba74" stroke-width="2"/>
  <text class="section" x="640" y="522">금융권에서 강조되는 감사 포인트</text>
  <rect x="640" y="546" width="468" height="112" rx="20" fill="#ffffff" stroke="#fed7aa" stroke-width="1.5"/>
  <text class="label" x="668" y="576">감사추적 체크리스트</text>
  <text class="body" x="668" y="604">• 누가(who) 변경했는지</text>
  <text class="body" x="668" y="628">• 언제(when) 반영했는지</text>
  <text class="body" x="890" y="604">• 무엇을(what) 바꿨는지</text>
  <text class="body" x="890" y="628">• 왜(why) 승인되었는지</text>
  <text class="small" x="640" y="674">운영 배포 전에는 승인 이력, 회귀 테스트 결과,</text>
  <text class="small" x="640" y="694">롤백 계획까지 함께 남겨야 한다.</text>
</svg>
