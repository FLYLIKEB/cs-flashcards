<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">11-04. 형상관리와 비용산정 인포그래픽</title>
  <desc id="desc">기준선 기반 형상관리 절차와 COCOMO, FP, Man-Month, Brooks 법칙을 함께 설명하는 SVG</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="55%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#fef3c7"/>
    </linearGradient>
    <linearGradient id="baselineGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="costGlow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 34px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .subtitle { font: 500 17px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
      .section { font: 700 22px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .label { font: 700 17px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .body { font: 500 15px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
      .small { font: 600 13px 'Pretendard','Noto Sans KR',sans-serif; fill: #475569; }
      .tiny { font: 600 12px 'Pretendard','Noto Sans KR',sans-serif; fill: #64748b; }
    </style>
  </defs>

  <rect width="1200" height="720" fill="url(#bg)"/>
  <rect x="28" y="28" width="1144" height="664" rx="32" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <text class="small" x="72" y="78">소프트웨어공학 · 금융공기업 시험 포인트</text>
  <text class="title" x="72" y="118">11-04. 형상관리와 비용산정</text>
  <text class="subtitle" x="72" y="154">왼쪽은 기준선 중심의 변경 통제, 오른쪽은 프로젝트 규모·인력·품질 요구를 반영한 비용 추정 모델을 요약한다.</text>

  <rect x="60" y="190" width="520" height="360" rx="28" fill="#f8fbff" stroke="#93c5fd" stroke-width="2"/>
  <text class="section" x="88" y="228">형상관리: Baseline 이후 변경은 승인 절차를 거친다</text>

  <rect x="88" y="258" width="138" height="84" rx="20" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text class="label" x="157" y="290" text-anchor="middle">산출물 식별</text>
  <text class="body" x="157" y="314" text-anchor="middle">요구사항·설계·코드</text>
  <text class="tiny" x="157" y="332" text-anchor="middle">버전·태그·해시 기록</text>

  <rect x="254" y="246" width="132" height="108" rx="24" fill="url(#baselineGlow)" opacity="0.95"/>
  <text class="label" x="320" y="286" text-anchor="middle" fill="#ffffff">Baseline</text>
  <text class="body" x="320" y="308" text-anchor="middle" fill="#e0f2fe">검증·공식 승인된</text>
  <text class="body" x="320" y="328" text-anchor="middle" fill="#e0f2fe">기준 버전</text>

  <rect x="414" y="258" width="138" height="84" rx="20" fill="#ecfeff" stroke="#0f766e" stroke-width="2"/>
  <text class="label" x="483" y="290" text-anchor="middle">추적·감사</text>
  <text class="body" x="483" y="314" text-anchor="middle">누가·언제·무엇·왜</text>
  <text class="tiny" x="483" y="332" text-anchor="middle">승인 이력·롤백 계획</text>

  <line x1="226" y1="300" x2="254" y2="300" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="386" y1="300" x2="414" y2="300" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="92" y="392" width="456" height="128" rx="24" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
  <text class="label" x="118" y="424">변경 통제 흐름</text>
  <line x1="144" y1="458" x2="492" y2="458" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <circle cx="154" cy="458" r="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <circle cx="244" cy="458" r="16" fill="#e0f2fe" stroke="#0891b2" stroke-width="2"/>
  <circle cx="334" cy="458" r="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <circle cx="424" cy="458" r="16" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text class="tiny" x="154" y="491" text-anchor="middle">CR</text>
  <text class="tiny" x="244" y="491" text-anchor="middle">영향분석</text>
  <text class="tiny" x="334" y="491" text-anchor="middle">승인</text>
  <text class="tiny" x="424" y="491" text-anchor="middle">반영·검증</text>
  <text class="body" x="124" y="513">변경요청 → 영향분석 → CCB/CAB 승인 → 구현 → 테스트 → 릴리스 태깅</text>

  <rect x="620" y="190" width="520" height="360" rx="28" fill="#fffaf5" stroke="#fdba74" stroke-width="2"/>
  <text class="section" x="648" y="228">비용산정: 규모와 환경을 숫자로 바꿔 예산·일정을 추정</text>

  <rect x="648" y="254" width="142" height="126" rx="22" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
  <text class="label" x="719" y="286" text-anchor="middle">COCOMO</text>
  <text class="body" x="719" y="312" text-anchor="middle">KLOC 등 규모</text>
  <text class="body" x="719" y="332" text-anchor="middle">경험식 계수 적용</text>
  <text class="tiny" x="719" y="356" text-anchor="middle">프로젝트 특성은 EAF로 조정</text>

  <rect x="808" y="254" width="142" height="126" rx="22" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text class="label" x="879" y="286" text-anchor="middle">Function Point</text>
  <text class="body" x="879" y="312" text-anchor="middle">EI·EO·EQ·ILF·EIF</text>
  <text class="body" x="879" y="332" text-anchor="middle">기능 수를 점수화</text>
  <text class="tiny" x="879" y="356" text-anchor="middle">요구사항 중심 규모 추정</text>

  <rect x="968" y="254" width="142" height="126" rx="22" fill="#f8fafc" stroke="#475569" stroke-width="2"/>
  <text class="label" x="1039" y="286" text-anchor="middle">Man-Month</text>
  <text class="body" x="1039" y="312" text-anchor="middle">인력 수 × 기간(월)</text>
  <text class="body" x="1039" y="332" text-anchor="middle">작업량 단위</text>
  <text class="tiny" x="1039" y="356" text-anchor="middle">회의·휴가·교육 비용 반영</text>

  <path d="M 719 392 L 719 434 L 1039 434" fill="none" stroke="#c2410c" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <text class="tiny" x="880" y="424" text-anchor="middle">프로젝트 특성·품질 요구·환경 복잡도로 조정</text>

  <rect x="648" y="454" width="462" height="66" rx="18" fill="url(#costGlow)" opacity="0.92"/>
  <text class="label" x="672" y="482" fill="#ffffff">산정 시 추가 고려사항</text>
  <text class="body" x="672" y="504" fill="#fff7ed">요구사항 불확실성 · 재사용 수준 · 외부 인터페이스 복잡도 · 보안/감사 규제 · 테스트/인수인계 기간</text>

  <rect x="60" y="574" width="1080" height="92" rx="26" fill="#0f172a"/>
  <text class="section" x="88" y="608" fill="#f8fafc">현업·시험 포인트</text>
  <text class="body" x="88" y="634" fill="#cbd5e1">Brooks 법칙: 지연된 프로젝트에 인원만 추가하면 교육·의사소통 비용으로 오히려 더 늦어질 수 있다.</text>
  <text class="body" x="88" y="656" fill="#cbd5e1">금융권은 신뢰성·보안성·감사추적성을 중시하므로 형상관리 승인 이력과 롤백 계획이 비용산정과 함께 관리되어야 한다.</text>
</svg>
