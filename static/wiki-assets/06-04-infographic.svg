<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc">
  <title id="title">06-04 메모리와 가상메모리 운영 흐름</title>
  <desc id="desc">가상메모리에서 페이지 폴트, 페이지 교체, thrashing 대응 흐름을 정리한 SVG</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569" />
    </marker>
    <style>
      .title { font: 700 34px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .subtitle { font: 500 17px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
      .section { font: 700 22px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .label { font: 700 17px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .body { font: 500 15px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
      .small { font: 600 13px 'Pretendard','Noto Sans KR',sans-serif; fill: #475569; }
      .chip { font: 700 13px 'Pretendard','Noto Sans KR',sans-serif; fill: #1e293b; }
    </style>
  </defs>

  <rect width="1200" height="860" fill="#f8fafc" />
  <rect x="28" y="28" width="1144" height="804" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />

  <text class="title" x="72" y="92">가상메모리 운영 흐름 한 장 정리</text>
  <text class="subtitle" x="72" y="124">주소 변환 이후 실제 운영체제가 처리하는 page fault, 교체, thrashing 완화 흐름을 중심으로 본다.</text>

  <rect x="60" y="164" width="1080" height="190" rx="24" fill="#eff6ff" stroke="#93c5fd" />
  <text class="section" x="88" y="204">1) 필요한 페이지가 없으면 page fault</text>
  <rect x="92" y="230" width="280" height="94" rx="18" fill="#ffffff" stroke="#60a5fa" stroke-width="2" />
  <text class="label" x="232" y="264" text-anchor="middle">CPU가 가상주소 참조</text>
  <text class="body" x="232" y="292" text-anchor="middle">MMU가 페이지 테이블의 present bit 확인</text>
  <rect x="458" y="230" width="280" height="94" rx="18" fill="#ffffff" stroke="#60a5fa" stroke-width="2" />
  <text class="label" x="598" y="264" text-anchor="middle">present bit = 0</text>
  <text class="body" x="598" y="292" text-anchor="middle">메모리에 없는 페이지라 page fault 발생</text>
  <rect x="824" y="230" width="280" height="94" rx="18" fill="#ffffff" stroke="#60a5fa" stroke-width="2" />
  <text class="label" x="964" y="264" text-anchor="middle">운영체제가 디스크 접근</text>
  <text class="body" x="964" y="292" text-anchor="middle">필요한 페이지를 보조기억장치에서 읽어 온다</text>
  <line x1="372" y1="277" x2="458" y2="277" stroke="#475569" stroke-width="3" marker-end="url(#arrow)" />
  <line x1="738" y1="277" x2="824" y2="277" stroke="#475569" stroke-width="3" marker-end="url(#arrow)" />

  <rect x="60" y="388" width="1080" height="208" rx="24" fill="#fff7ed" stroke="#fdba74" />
  <text class="section" x="88" y="428">2) 빈 프레임이 없으면 페이지 교체</text>
  <rect x="92" y="454" width="312" height="110" rx="18" fill="#ffffff" stroke="#f59e0b" stroke-width="2" />
  <text class="label" x="248" y="488" text-anchor="middle">희생 페이지 선택</text>
  <text class="body" x="248" y="516" text-anchor="middle">FIFO: 가장 오래 있던 페이지</text>
  <text class="body" x="248" y="538" text-anchor="middle">LRU/Clock: 최근 사용성 반영</text>
  <rect x="444" y="454" width="312" height="110" rx="18" fill="#ffffff" stroke="#f59e0b" stroke-width="2" />
  <text class="label" x="600" y="488" text-anchor="middle">교체 후 갱신</text>
  <text class="body" x="600" y="516" text-anchor="middle">새 페이지 적재, 페이지 테이블 수정</text>
  <text class="body" x="600" y="538" text-anchor="middle">필요하면 TLB 엔트리도 함께 갱신</text>
  <rect x="796" y="454" width="308" height="110" rx="18" fill="#ffffff" stroke="#f59e0b" stroke-width="2" />
  <text class="label" x="950" y="488" text-anchor="middle">시험 포인트</text>
  <text class="body" x="950" y="516" text-anchor="middle">OPT는 이론상 최적이지만 미래 참조가 필요</text>
  <text class="body" x="950" y="538" text-anchor="middle">FIFO는 Belady anomaly 가능</text>
  <line x1="404" y1="509" x2="444" y2="509" stroke="#475569" stroke-width="3" marker-end="url(#arrow)" />
  <line x1="756" y1="509" x2="796" y2="509" stroke="#475569" stroke-width="3" marker-end="url(#arrow)" />

  <rect x="60" y="630" width="1080" height="170" rx="24" fill="#ecfccb" stroke="#84cc16" />
  <text class="section" x="88" y="670">3) 페이지 폴트가 너무 잦으면 thrashing</text>
  <rect x="92" y="696" width="312" height="72" rx="18" fill="#ffffff" stroke="#84cc16" stroke-width="2" />
  <text class="body" x="248" y="727" text-anchor="middle">CPU보다 페이지 교체에 시간을 더 쓰는 상태</text>
  <text class="small" x="248" y="749" text-anchor="middle">원인: 프레임 부족, 작업셋 과대</text>
  <rect x="444" y="696" width="312" height="72" rx="18" fill="#ffffff" stroke="#84cc16" stroke-width="2" />
  <text class="body" x="600" y="727" text-anchor="middle">Working Set을 수용할 프레임을 확보</text>
  <text class="small" x="600" y="749" text-anchor="middle">지역성을 살리고 불필요한 교체를 줄인다</text>
  <rect x="796" y="696" width="308" height="72" rx="18" fill="#ffffff" stroke="#84cc16" stroke-width="2" />
  <text class="body" x="950" y="727" text-anchor="middle">프레임 재분배·프로세스 수 조절로 완화</text>
  <text class="small" x="950" y="749" text-anchor="middle">폴트율과 TLB miss 비율을 함께 본다</text>
</svg>
