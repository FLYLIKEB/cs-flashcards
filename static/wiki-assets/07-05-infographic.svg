<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="960" viewBox="0 0 1200 960" role="img" aria-labelledby="title desc">
  <title id="title">07-05. 인덱스와 동시성 핵심 요약</title>
  <desc id="desc">인덱스의 읽기-쓰기 트레이드오프와 대표 인덱스 유형, 동시성 제어 핵심 방식을 큰 글자와 넉넉한 여백으로 나눠 정리한 SVG</desc>
  <defs>
    <style>
      text { font-family: "Noto Sans KR", "Apple SD Gothic Neo", sans-serif; fill: #0f172a; }
      .eyebrow { font-size: 20px; font-weight: 700; letter-spacing: 0.08em; fill: #0f766e; }
      .title { font-size: 44px; font-weight: 800; }
      .subtitle { font-size: 22px; font-weight: 500; fill: #334155; }
      .sectionTitle { font-size: 30px; font-weight: 800; }
      .sectionLead { font-size: 19px; font-weight: 500; fill: #334155; }
      .cardTitle { font-size: 25px; font-weight: 800; }
      .body { font-size: 19px; font-weight: 500; fill: #334155; }
      .small { font-size: 18px; font-weight: 600; fill: #475569; }
      .em { font-weight: 800; fill: #0f172a; }
    </style>
  </defs>

  <rect width="1200" height="960" fill="#f8fafc"/>
  <rect x="28" y="28" width="1144" height="904" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <text x="72" y="88" class="eyebrow">DATABASE · PAGE 07-05</text>
  <text x="72" y="140" class="title">인덱스와 동시성</text>
  <text x="72" y="178" class="subtitle">핵심 구조는 한 장에 요약하고, B+Tree 접근과 잠금/이상 현상은 아래 보조 SVG에서 따로 학습한다.</text>

  <rect x="64" y="220" width="504" height="632" rx="26" fill="#ecfdf5" stroke="#86efac" stroke-width="2"/>
  <rect x="632" y="220" width="504" height="632" rx="26" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>

  <text x="96" y="268" class="sectionTitle">① 인덱스: 읽기 속도를 얻고 쓰기 비용을 낸다</text>
  <text x="96" y="304" class="sectionLead">탐색 경로를 줄여 조회를 빠르게 하지만, 데이터가 바뀌면 인덱스도 함께 손봐야 한다.</text>

  <rect x="96" y="336" width="206" height="148" rx="18" fill="#ffffff" stroke="#22c55e" stroke-width="2"/>
  <text x="124" y="378" class="cardTitle">읽기 이득</text>
  <text x="124" y="414" class="body">• WHERE 범위 축소</text>
  <text x="124" y="446" class="body">• BETWEEN 최적화</text>
  <text x="124" y="478" class="body">• ORDER BY 도움</text>

  <rect x="330" y="336" width="206" height="148" rx="18" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  <text x="358" y="378" class="cardTitle">쓰기 부담</text>
  <text x="358" y="414" class="body">• INSERT 때 추가 갱신</text>
  <text x="358" y="446" class="body">• UPDATE·DELETE 반영</text>
  <text x="358" y="478" class="body">• 저장공간·유지비 증가</text>

  <text x="316" y="406" class="small" text-anchor="middle">trade-off</text>

  <rect x="96" y="516" width="440" height="300" rx="20" fill="#ffffff" stroke="#86efac" stroke-width="2"/>
  <text x="124" y="558" class="cardTitle">대표 인덱스 구분</text>

  <rect x="122" y="582" width="120" height="200" rx="16" fill="#f0fdf4" stroke="#65a30d" stroke-width="2"/>
  <text x="146" y="616" class="small" style="font-size:21px; font-weight:800; fill:#365314;">B+Tree</text>
  <text x="146" y="652" class="body">• 순차 리프</text>
  <text x="146" y="684" class="body">• 범위 검색</text>
  <text x="146" y="716" class="body">• 정렬 처리</text>

  <rect x="256" y="582" width="120" height="200" rx="16" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="286" y="616" class="small" style="font-size:21px; font-weight:800; fill:#92400e;">Hash</text>
  <text x="278" y="652" class="body">• = 조건 빠름</text>
  <text x="278" y="684" class="body">• 범위 약함</text>
  <text x="278" y="716" class="body">• 정렬 부적합</text>

  <rect x="390" y="582" width="120" height="200" rx="16" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="404" y="616" class="small" style="font-size:21px; font-weight:800; fill:#1d4ed8;">Clustered</text>
  <text x="404" y="652" class="body">• 물리 순서 근접</text>
  <text x="404" y="684" class="body">• 범위 조회 빠름</text>
  <text x="404" y="716" class="body">• 재배치 비용</text>

  <text x="664" y="268" class="sectionTitle">② 동시성: 동시에 실행돼도 결과를 지킨다</text>
  <text x="664" y="304" class="sectionLead">여러 트랜잭션이 같은 데이터를 건드릴 때 갱신 손실과 충돌 쓰기를 줄여 일관성을 지킨다.</text>

  <rect x="664" y="336" width="440" height="132" rx="18" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
  <text x="692" y="378" class="cardTitle">대표 문제 상황</text>
  <text x="692" y="414" class="body">같은 계좌를 동시에 갱신하면</text>
  <text x="692" y="446" class="body">마지막 쓰기만 남아 <tspan class="em">갱신 손실</tspan>이 생길 수 있다.</text>

  <rect x="664" y="504" width="132" height="282" rx="18" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="692" y="546" class="cardTitle">2PL</text>
  <text x="692" y="582" class="body">• lock 획득</text>
  <text x="692" y="614" class="body">• lock 해제</text>
  <text x="692" y="646" class="body">• 직렬화 보장</text>
  <text x="692" y="678" class="body">• strict는</text>
  <text x="692" y="710" class="body">  롤백 전파 방지</text>

  <rect x="818" y="504" width="132" height="282" rx="18" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="840" y="546" class="cardTitle">Timestamp</text>
  <text x="840" y="582" class="body">• 시작 시각</text>
  <text x="840" y="614" class="body">• 순서 강제</text>
  <text x="840" y="646" class="body">• deadlock 없음</text>
  <text x="840" y="678" class="body">• 충돌 시 롤백</text>

  <rect x="972" y="504" width="132" height="282" rx="18" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
  <text x="998" y="546" class="cardTitle">MVCC</text>
  <text x="998" y="582" class="body">• 버전 유지</text>
  <text x="998" y="614" class="body">• 과거 버전 읽기</text>
  <text x="998" y="646" class="body">• 읽기 비차단</text>
  <text x="998" y="678" class="body">• 읽기 많은 환경</text>

  <rect x="64" y="880" width="1072" height="32" rx="16" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="88" y="902" class="small">시험 한 줄: <tspan class="em">B+Tree는 범위 검색·정렬</tspan>, <tspan class="em">2PL은 직렬화</tspan>, <tspan class="em">MVCC는 읽기 비차단</tspan>에 강하다.</text>
</svg>
