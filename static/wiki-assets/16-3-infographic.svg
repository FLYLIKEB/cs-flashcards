<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">16-3. 평가 지표와 혼동행렬 SVG 인포그래픽</title>
  <desc id="desc">평가 지표와 혼동행렬</desc>
  <defs>
    <linearGradient id="grad-16-3-infographic.svg" x1="0" y1="0" x2="1" y2="1">
