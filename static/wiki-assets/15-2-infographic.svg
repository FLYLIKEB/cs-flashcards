  <text class="title" x="84" y="118" text-anchor="start"><tspan x="84" dy="0">15-2. 결제 인프라</tspan></text>
  <text class="subtitle" x="84" y="180" text-anchor="start"><tspan x="84" dy="0">BOK-Wire+는 한국은행이 운영하는 거액결제 시스템입니다. 금융기관 간 대규모</tspan><tspan x="84" dy="24">자금 이체를 실시간 총액결제(RTGS) 방식으로 처리해 시스템 리스크를 줄입니다.</tspan></text>
