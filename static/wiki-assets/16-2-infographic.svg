<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc">
  <title id="title">16-2. 학습·검증·전처리 인포그래픽</title>
  <desc id="desc">전처리 설계, 데이터 누수 차단, 검증 원칙을 분리된 카드와 순서도로 설명하는 SVG</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#eef6ff"/>
    </linearGradient>
    <style>
      text { font-family: 'Pretendard', 'Noto Sans KR', sans-serif; fill: #0f172a; }
      .eyebrow { font-size: 15px; font-weight: 700; letter-spacing: 0.12em; fill: #475569; }
      .title { font-size: 34px; font-weight: 800; }
      .subtitle { font-size: 18px; font-weight: 500; fill: #334155; }
      .section { font-size: 22px; font-weight: 800; }
      .label { font-size: 18px; font-weight: 700; }
      .body { font-size: 15px; font-weight: 500; fill: #334155; }
      .small { font-size: 13px; font-weight: 700; fill: #475569; }
      .danger { font-size: 16px; font-weight: 700; fill: #991b1b; }
      .pill { font-size: 14px; font-weight: 800; }
      .mono { font-size: 15px; font-weight: 700; fill: #1e293b; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#0f172a"/>
    </marker>
  </defs>

  <rect width="1200" height="860" fill="url(#bg)"/>
  <rect x="28" y="28" width="1144" height="804" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <text class="eyebrow" x="72" y="82">ML PIPELINE · PREPROCESSING · VALIDATION</text>
  <text class="title" x="72" y="124">16-2. 학습·검증·전처리</text>
  <text class="subtitle" x="72" y="158">전처리 규칙은 먼저 설계하고, 통계는 train에서만 학습하며, validation으로 선택하고 test는 마지막에 한 번만 확인한다.</text>

  <rect x="60" y="196" width="1080" height="210" rx="24" fill="#f8fafc" stroke="#cbd5e1"/>
  <text class="section" x="88" y="236">1) 재현 가능한 전처리 파이프라인</text>

  <rect x="92" y="268" width="210" height="104" rx="20" fill="#e0f2fe" stroke="#38bdf8" stroke-width="2"/>
  <text class="label" x="197" y="300" text-anchor="middle">원천 데이터</text>
  <text class="body" x="197" y="327" text-anchor="middle">거래 · 고객 · 로그 · 라벨 후보</text>
  <text class="small" x="197" y="349" text-anchor="middle">업무 문맥과 시점 정보를 함께 보관</text>

  <line x1="302" y1="320" x2="368" y2="320" stroke="#0f172a" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="368" y="250" width="286" height="140" rx="20" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  <text class="label" x="511" y="284" text-anchor="middle">전처리 규칙 정의</text>
  <text class="body" x="392" y="314">• 결측치 · 이상치 · 중복 처리 기준</text>
  <text class="body" x="392" y="338">• 범주형 인코딩과 파생 변수 생성 규칙</text>
  <text class="body" x="392" y="362">• 정규화 · 표준화 절차를 코드로 고정</text>

  <line x1="654" y1="320" x2="720" y2="320" stroke="#0f172a" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="720" y="250" width="386" height="140" rx="20" fill="#ecfeff" stroke="#06b6d4" stroke-width="2"/>
  <text class="label" x="913" y="284" text-anchor="middle">fit(train) → transform(all splits)</text>
  <text class="body" x="748" y="314">• 스케일링 평균·표준편차는 train에서만 계산</text>
  <text class="body" x="748" y="338">• validation / test에는 같은 규칙만 적용</text>
  <text class="body" x="748" y="362">• 파이프라인 코드화로 재현성과 배포 일관성 확보</text>

  <rect x="76" y="430" width="520" height="172" rx="24" fill="#fff7ed" stroke="#fdba74"/>
  <text class="section" x="104" y="470">2) 데이터 누수 차단</text>

  <rect x="104" y="496" width="214" height="72" rx="16" fill="#ffffff" stroke="#f59e0b"/>
  <text class="label" x="211" y="524" text-anchor="middle">안전한 피처</text>
  <text class="body" x="211" y="548" text-anchor="middle">예측 시점 이전 정보만 사용</text>

  <rect x="350" y="496" width="214" height="72" rx="16" fill="#fef2f2" stroke="#ef4444"/>
  <text class="label" x="457" y="524" text-anchor="middle">누수 위험 피처</text>
  <text class="body" x="457" y="548" text-anchor="middle">미래 거래 · 사후 확정값 · 전체 통계</text>

  <line x1="334" y1="532" x2="350" y2="532" stroke="#dc2626" stroke-width="3"/>
  <line x1="330" y1="500" x2="474" y2="564" stroke="#dc2626" stroke-width="5" stroke-linecap="round"/>
  <line x1="474" y1="500" x2="330" y2="564" stroke="#dc2626" stroke-width="5" stroke-linecap="round"/>

  <text class="danger" x="104" y="594">금융 데이터에서 자주 보는 누수</text>
  <text class="body" x="104" y="620">• 승인 후에만 확정되는 변수로 현재 승인 여부를 예측</text>
  <text class="body" x="104" y="644">• 미래 기간 거래 합계를 현재 시점 피처로 투입</text>
  <text class="body" x="104" y="668">• 전체 데이터로 평균을 계산해 train/validation/test 모두 스케일링</text>

  <rect x="620" y="430" width="520" height="172" rx="24" fill="#f0fdf4" stroke="#86efac"/>
  <text class="section" x="648" y="470">3) 검증 원칙</text>

  <rect x="648" y="496" width="128" height="76" rx="16" fill="#dbeafe" stroke="#60a5fa"/>
  <text class="label" x="712" y="525" text-anchor="middle">Train</text>
  <text class="body" x="712" y="549" text-anchor="middle">모델 학습</text>

  <rect x="816" y="496" width="128" height="76" rx="16" fill="#ede9fe" stroke="#a78bfa"/>
  <text class="label" x="880" y="525" text-anchor="middle">Validation</text>
  <text class="body" x="880" y="549" text-anchor="middle">모델 선택</text>

  <rect x="984" y="496" width="128" height="76" rx="16" fill="#dcfce7" stroke="#4ade80"/>
  <text class="label" x="1048" y="525" text-anchor="middle">Test</text>
  <text class="body" x="1048" y="549" text-anchor="middle">최종 확인</text>

  <line x1="776" y1="534" x2="816" y2="534" stroke="#0f172a" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="944" y1="534" x2="984" y2="534" stroke="#0f172a" stroke-width="3" marker-end="url(#arrow)"/>

  <text class="body" x="648" y="598">• test 성능을 반복 확인하면 사실상 validation처럼 오염된다.</text>
  <text class="body" x="648" y="622">• 데이터가 적다면 교차검증을 쓰되 fold별 분포와 시간 순서를 함께 본다.</text>

  <rect x="60" y="626" width="1080" height="168" rx="24" fill="#f8fafc" stroke="#cbd5e1"/>
  <text class="section" x="88" y="666">4) 실무 체크포인트</text>

  <rect x="92" y="690" width="218" height="74" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
  <text class="pill" x="201" y="718" text-anchor="middle">체크 1</text>
  <text class="body" x="201" y="742" text-anchor="middle">피처 생성 시점과 라벨 시점을 같이 기록</text>

  <rect x="328" y="690" width="218" height="74" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
  <text class="pill" x="437" y="718" text-anchor="middle">체크 2</text>
  <text class="body" x="437" y="742" text-anchor="middle">시드 고정과 데이터 버전 관리</text>

  <rect x="564" y="690" width="270" height="74" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
  <text class="pill" x="699" y="718" text-anchor="middle">체크 3</text>
  <text class="body" x="699" y="742" text-anchor="middle">라벨 확정 지연이 있으면 검증 구간을 뒤로 밀기</text>

  <rect x="852" y="690" width="256" height="74" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
  <text class="pill" x="980" y="718" text-anchor="middle">체크 4</text>
  <text class="body" x="980" y="742" text-anchor="middle">파이프라인 결과를 운영 환경에도 동일하게 적용</text>
</svg>
