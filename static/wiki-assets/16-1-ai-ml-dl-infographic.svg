<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980" role="img" aria-labelledby="title desc">
  <title id="title">16-1. AI·ML·DL 기본 인포그래픽</title>
  <desc id="desc">AI, ML, DL의 포함 관계와 학습 유형, 과적합과 과소적합을 여백 있게 정리한 인포그래픽.</desc>
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <style>
      text { font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; fill: #0f172a; }
      .eyebrow { font-size: 15px; font-weight: 700; letter-spacing: 1.6px; fill: #93c5fd; }
      .heroTitle { font-size: 34px; font-weight: 800; fill: #f8fafc; }
      .heroBody { font-size: 17px; font-weight: 500; fill: #dbeafe; }
      .section { font-size: 15px; font-weight: 800; letter-spacing: 1.4px; fill: #475569; }
      .h2 { font-size: 28px; font-weight: 800; }
      .h3 { font-size: 22px; font-weight: 800; }
      .label { font-size: 17px; font-weight: 700; }
      .body { font-size: 15px; font-weight: 500; fill: #334155; }
      .small { font-size: 13px; font-weight: 600; fill: #475569; }
      .badgeText { font-size: 15px; font-weight: 800; fill: #ffffff; }
      .note { font-size: 14px; font-weight: 600; fill: #e2e8f0; }
      .callout { font-size: 15px; font-weight: 600; fill: #cbd5e1; }
    </style>
  </defs>

  <rect width="1200" height="980" fill="#f8fafc" />
  <rect x="36" y="32" width="1128" height="916" rx="30" fill="#ffffff" stroke="#dbeafe" stroke-width="2" />

  <rect x="64" y="56" width="1072" height="132" rx="26" fill="url(#hero)" />
  <text class="eyebrow" x="92" y="94">AI · ML · DL BASICS</text>
  <text class="heroTitle" x="92" y="132">AI ⊃ ML ⊃ DL 구조와 학습 유형</text>
  <text class="heroBody" x="92" y="162">면접에서는 먼저 포함 관계를 짚고, 이어 지도·비지도·강화학습을 금융 예시와 함께 설명하면 구조가 또렷하다.</text>

  <g transform="translate(78 226)">
    <text class="section" x="0" y="0">CONCEPT HIERARCHY</text>
    <text class="h2" x="0" y="38">포함 관계: AI 안에 ML, ML 안에 DL</text>

    <rect x="0" y="62" width="494" height="404" rx="34" fill="#dbeafe" stroke="#60a5fa" stroke-width="3" />
    <rect x="42" y="126" width="410" height="278" rx="30" fill="#ede9fe" stroke="#8b5cf6" stroke-width="3" />
    <rect x="96" y="198" width="302" height="134" rx="26" fill="#ffedd5" stroke="#f97316" stroke-width="3" />

    <text class="h3" x="30" y="108">AI</text>
    <text class="body" x="30" y="136">규칙 기반 추론, 탐색, 최적화, 기계학습을 모두 포함하는 가장 넓은 개념</text>
    <text class="small" x="30" y="164">예: 상담 자동화, 추천, 의사결정 지원, 운영 최적화</text>

    <text class="h3" x="74" y="174">ML</text>
    <text class="body" x="74" y="202">데이터에서 입력과 출력의 관계를 학습해 예측 함수를 만든다</text>
    <text class="small" x="74" y="230">대표 과업: 분류, 회귀, 군집화, 이상 탐지</text>

    <text class="h3" x="126" y="244">DL</text>
    <text class="body" x="126" y="272">다층 신경망이 중간 표현을 자동 추출하며 복잡한 패턴을 학습한다</text>
    <text class="small" x="126" y="300">장점: 높은 표현력 · 주의점: 설명가능성, 데이터·연산 요구</text>

    <g transform="translate(28 350)">
      <rect x="0" y="0" width="132" height="70" rx="18" fill="#ffffff" stroke="#93c5fd" stroke-width="2" />
      <text class="label" x="66" y="29" text-anchor="middle">Feature</text>
      <text class="small" x="66" y="50" text-anchor="middle">소득 · 연체 이력</text>

      <path d="M132 35 H174" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" />
      <circle cx="174" cy="35" r="4" fill="#2563eb" />

      <rect x="188" y="0" width="124" height="70" rx="18" fill="#ffffff" stroke="#8b5cf6" stroke-width="2" />
      <text class="label" x="250" y="29" text-anchor="middle">Model</text>
      <text class="small" x="250" y="50" text-anchor="middle">학습된 함수</text>

      <path d="M312 35 H354" fill="none" stroke="#7c3aed" stroke-width="3" stroke-linecap="round" />
      <circle cx="354" cy="35" r="4" fill="#7c3aed" />

      <rect x="368" y="0" width="98" height="70" rx="18" fill="#ffffff" stroke="#f97316" stroke-width="2" />
      <text class="label" x="417" y="29" text-anchor="middle">Output</text>
      <text class="small" x="417" y="50" text-anchor="middle">등급 · 확률</text>
    </g>
  </g>

  <g transform="translate(618 226)">
    <text class="section" x="0" y="0">LEARNING TYPES</text>
    <text class="h2" x="0" y="38">대표 학습 유형과 금융 예시</text>

    <rect x="0" y="62" width="504" height="118" rx="24" fill="#eff6ff" stroke="#93c5fd" stroke-width="2" />
    <circle cx="50" cy="121" r="24" fill="#2563eb" />
    <text class="badgeText" x="50" y="126" text-anchor="middle">지도</text>
    <text class="h3" x="90" y="108">지도학습</text>
    <text class="body" x="90" y="136">라벨이 있는 데이터로 분류와 회귀 문제를 푼다.</text>
    <text class="small" x="90" y="162">금융: 신용평가, 민원 분류, 부도 확률 추정</text>

    <rect x="0" y="198" width="504" height="118" rx="24" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2" />
    <circle cx="50" cy="257" r="24" fill="#7c3aed" />
    <text class="badgeText" x="50" y="262" text-anchor="middle">비지도</text>
    <text class="h3" x="90" y="244">비지도학습</text>
    <text class="body" x="90" y="272">라벨 없이 구조를 찾으며 군집화, 차원 축소, 이상 탐지를 수행한다.</text>
    <text class="small" x="90" y="298">금융: 고객 세분화, 거래 패턴 탐색, 이상 거래 후보 찾기</text>

    <rect x="0" y="334" width="504" height="118" rx="24" fill="#fff7ed" stroke="#fdba74" stroke-width="2" />
    <circle cx="50" cy="393" r="24" fill="#ea580c" />
    <text class="badgeText" x="50" y="398" text-anchor="middle">강화</text>
    <text class="h3" x="90" y="380">강화학습</text>
    <text class="body" x="90" y="408">정답 라벨 대신 상태, 행동, 보상으로 정책을 학습한다.</text>
    <text class="small" x="90" y="434">금융: 트레이딩 연구, 자원 배분 시뮬레이션</text>
  </g>

  <g transform="translate(78 736)">
    <text class="section" x="0" y="0">MODEL FITNESS</text>
    <text class="h2" x="0" y="38">과소적합 ↔ 적정 ↔ 과적합</text>

    <rect x="0" y="60" width="636" height="136" rx="26" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" />
    <path d="M44 154 C146 88, 226 78, 316 104 S502 204, 592 92" fill="none" stroke="#2563eb" stroke-width="5" stroke-linecap="round" />
    <path d="M44 172 C144 150, 230 126, 314 134 S502 164, 592 182" fill="none" stroke="#ef4444" stroke-width="5" stroke-linecap="round" />
    <text class="small" x="44" y="94">모델 복잡도 낮음</text>
    <text class="small" x="498" y="94">모델 복잡도 높음</text>
    <text class="small" x="120" y="186">과소적합</text>
    <text class="small" x="286" y="88">적정</text>
    <text class="small" x="520" y="206">과적합</text>
    <text class="label" x="392" y="120" fill="#2563eb">훈련 성능</text>
    <text class="label" x="364" y="176" fill="#ef4444">검증 성능</text>
  </g>

  <g transform="translate(744 736)">
    <rect x="0" y="0" width="378" height="196" rx="26" fill="#0f172a" />
    <text class="eyebrow" x="28" y="34">INTERVIEW POINT</text>
    <text class="note" x="28" y="66">1) AI는 넓은 개념, ML은 데이터 학습, DL은 신경망 기반 학습이라고 층위를 나눈다.</text>
    <text class="note" x="28" y="102">2) 지도·비지도·강화학습을 각 한 문장과 금융 예시로 연결한다.</text>
    <text class="note" x="28" y="138">3) 금융권 답변에서는 설명가능성, 승인 절차, 개인정보 보호를 함께 언급한다.</text>
    <text class="callout" x="28" y="172">핵심 문장: “AI ⊃ ML ⊃ DL, 그리고 ML 안에서 학습 방식이 갈린다.”</text>
  </g>
</svg>
