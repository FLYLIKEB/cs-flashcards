<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">16-1. AI·ML·DL 기본 인포그래픽</title>
  <desc id="desc">AI, ML, DL의 포함 관계와 학습 유형, 예측 과업, 과적합과 과소적합을 한 화면에 정리한 인포그래픽.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="aiRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#dbeafe" />
      <stop offset="100%" stop-color="#bfdbfe" />
    </linearGradient>
    <linearGradient id="mlRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e9d5ff" />
      <stop offset="100%" stop-color="#ddd6fe" />
    </linearGradient>
    <linearGradient id="dlRing" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="100%" stop-color="#fca5a5" />
    </linearGradient>
    <style>
      text { font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
      .title { font-size: 34px; font-weight: 800; fill: #f8fafc; }
      .subtitle { font-size: 16px; font-weight: 500; fill: #dbeafe; }
      .section { font-size: 14px; font-weight: 700; letter-spacing: 1.4px; fill: #475569; }
      .h2 { font-size: 22px; font-weight: 800; fill: #0f172a; }
      .h3 { font-size: 18px; font-weight: 800; fill: #0f172a; }
      .label { font-size: 15px; font-weight: 700; fill: #0f172a; }
      .body { font-size: 14px; font-weight: 500; fill: #334155; }
      .small { font-size: 12px; font-weight: 600; fill: #64748b; }
      .whiteLabel { font-size: 14px; font-weight: 700; fill: #eff6ff; }
      .whiteBody { font-size: 12px; font-weight: 500; fill: #dbeafe; }
    </style>
  </defs>

  <rect width="1200" height="720" fill="url(#bg)" />
  <rect x="36" y="32" width="1128" height="656" rx="28" fill="#ffffff" stroke="#dbeafe" stroke-width="2" />

  <rect x="64" y="56" width="1072" height="120" rx="24" fill="url(#hero)" />
  <text class="section" x="94" y="92" fill="#93c5fd">AI · ML · DL BASICS</text>
  <text class="title" x="94" y="126">AI ⊃ ML ⊃ DL 구조와 학습 방식 한눈에 보기</text>
  <text class="subtitle" x="94" y="154">AI는 전체 지능 시스템, ML은 데이터로 관계를 학습하는 방법, DL은 다층 신경망으로 표현을 자동 학습하는 ML의 하위 분야다.</text>

  <g transform="translate(78 206)">
    <text class="section" x="0" y="0">CONCEPT HIERARCHY</text>
    <text class="h2" x="0" y="34">포함 관계: AI 안에 ML, ML 안에 DL</text>

    <rect x="0" y="58" width="460" height="390" rx="34" fill="url(#aiRing)" stroke="#60a5fa" stroke-width="3" />
    <rect x="44" y="112" width="372" height="282" rx="28" fill="url(#mlRing)" stroke="#8b5cf6" stroke-width="3" />
    <rect x="104" y="174" width="252" height="158" rx="24" fill="url(#dlRing)" stroke="#f97316" stroke-width="3" />

    <text class="h3" x="32" y="102">AI</text>
    <text class="body" x="32" y="128">규칙 기반 추론, 탐색, 기계학습까지 포함하는 가장 넓은 개념</text>
    <text class="small" x="32" y="150">예: 상담 자동화, 의사결정 지원, 추천, 최적화</text>

    <text class="h3" x="72" y="154">ML</text>
    <text class="body" x="72" y="180">입력(feature)과 출력(label)의 관계를 데이터에서 학습해 예측 함수를 만든다</text>
    <text class="small" x="72" y="202">회귀: 연속값 예측 · 분류: 범주 예측</text>

    <text class="h3" x="132" y="216">DL</text>
    <text class="body" x="132" y="242">다층 신경망이 중간 표현을 자동 추출하며 복잡한 패턴을 학습한다</text>
    <text class="small" x="132" y="264">파라미터 수가 많고 성능이 높지만 설명가능성 이슈가 크다</text>

    <g transform="translate(22 302)">
      <rect x="0" y="0" width="112" height="62" rx="16" fill="#ffffff" stroke="#93c5fd" />
      <text class="label" x="56" y="24" text-anchor="middle">Feature</text>
      <text class="small" x="56" y="44" text-anchor="middle">소득 · 연체이력</text>

      <path d="M112 31 H154" fill="none" stroke="#2563eb" stroke-width="3" stroke-linecap="round" />
      <circle cx="154" cy="31" r="4" fill="#2563eb" />

      <rect x="166" y="0" width="112" height="62" rx="16" fill="#ffffff" stroke="#8b5cf6" />
      <text class="label" x="222" y="24" text-anchor="middle">Model</text>
      <text class="small" x="222" y="44" text-anchor="middle">학습된 함수</text>

      <path d="M278 31 H320" fill="none" stroke="#7c3aed" stroke-width="3" stroke-linecap="round" />
      <circle cx="320" cy="31" r="4" fill="#7c3aed" />

      <rect x="332" y="0" width="112" height="62" rx="16" fill="#ffffff" stroke="#f97316" />
      <text class="label" x="388" y="24" text-anchor="middle">Output</text>
      <text class="small" x="388" y="44" text-anchor="middle">승인확률 · 등급</text>
    </g>
  </g>

  <g transform="translate(574 206)">
    <text class="section" x="0" y="0">LEARNING TYPES</text>
    <text class="h2" x="0" y="34">대표 학습 유형과 금융 예시</text>

    <rect x="0" y="58" width="548" height="118" rx="24" fill="#eff6ff" stroke="#93c5fd" stroke-width="2" />
    <circle cx="48" cy="117" r="23" fill="#2563eb" />
    <text class="whiteLabel" x="48" y="122" text-anchor="middle">지도</text>
    <text class="h3" x="86" y="102">지도학습</text>
    <text class="body" x="86" y="126">라벨이 있는 데이터를 학습해 분류·회귀 문제를 푼다.</text>
    <text class="small" x="86" y="150">금융: 신용평가, 민원 분류, 부도 확률 추정</text>

    <rect x="0" y="192" width="548" height="118" rx="24" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2" />
    <circle cx="48" cy="251" r="23" fill="#7c3aed" />
    <text class="whiteLabel" x="48" y="256" text-anchor="middle">비지</text>
    <text class="h3" x="86" y="236">비지도학습</text>
    <text class="body" x="86" y="260">라벨 없이 구조를 찾으며 군집화·차원 축소·이상 탐지를 수행한다.</text>
    <text class="small" x="86" y="284">금융: 고객 세분화, 거래 패턴 탐색, 이상 거래 후보 찾기</text>

    <rect x="0" y="326" width="548" height="118" rx="24" fill="#fff7ed" stroke="#fdba74" stroke-width="2" />
    <circle cx="48" cy="385" r="23" fill="#ea580c" />
    <text class="whiteLabel" x="48" y="390" text-anchor="middle">강화</text>
    <text class="h3" x="86" y="370">강화학습</text>
    <text class="body" x="86" y="394">정답 라벨 대신 상태·행동·보상으로 정책을 학습한다.</text>
    <text class="small" x="86" y="418">금융: 트레이딩 연구, 자원 배분 시뮬레이션</text>
  </g>

  <g transform="translate(78 584)">
    <text class="section" x="0" y="0">MODEL FITNESS</text>
    <text class="h2" x="0" y="30">과소적합 ↔ 적정 ↔ 과적합</text>

    <rect x="0" y="46" width="490" height="84" rx="22" fill="#f8fafc" stroke="#cbd5e1" />
    <path d="M38 100 C118 58, 180 54, 244 78 S380 138, 452 66" fill="none" stroke="#2563eb" stroke-width="4" stroke-linecap="round" />
    <path d="M38 114 C114 92, 180 80, 242 90 S378 118, 452 124" fill="none" stroke="#ef4444" stroke-width="4" stroke-linecap="round" />
    <text class="small" x="38" y="74">복잡도 낮음</text>
    <text class="small" x="388" y="74">복잡도 높음</text>
    <text class="small" x="130" y="124">과소적합</text>
    <text class="small" x="234" y="66">적정</text>
    <text class="small" x="390" y="146">과적합</text>
    <text class="small" x="320" y="96" fill="#2563eb">훈련 성능</text>
    <text class="small" x="290" y="124" fill="#ef4444">검증 성능</text>
  </g>

  <g transform="translate(610 584)">
    <rect x="0" y="0" width="512" height="100" rx="22" fill="#0f172a" />
    <text class="section" x="28" y="28" fill="#93c5fd">INTERVIEW POINT</text>
    <text class="whiteBody" x="28" y="52">1) 먼저 AI ⊃ ML ⊃ DL 구조를 말한다.</text>
    <text class="whiteBody" x="28" y="72">2) 이어 지도·비지도·강화학습과 금융 예시를 붙인다.</text>
    <text class="whiteBody" x="28" y="92">3) 성능 외에 설명가능성·승인 절차·개인정보 보호를 함께 언급한다.</text>
  </g>
</svg>
