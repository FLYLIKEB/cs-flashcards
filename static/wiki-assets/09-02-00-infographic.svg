<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">09-02. 트리와 그래프 개요</title>
  <desc id="desc">트리의 계층 구조와 그래프의 일반 연결 구조, 핵심 용어, 시험 포인트를 대비해서 보여주는 인포그래픽</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <style>
      .title { font: 700 34px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .subtitle { font: 500 17px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
      .section { font: 700 24px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .label { font: 700 16px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .body { font: 500 15px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
      .small { font: 600 13px 'Pretendard','Noto Sans KR',sans-serif; fill: #475569; }
      .white { fill: #ffffff; }
      .treeLine { stroke: #15803d; stroke-width: 4; stroke-linecap: round; }
      .graphLine { stroke: #7c3aed; stroke-width: 4; stroke-linecap: round; }
    </style>
  </defs>

  <rect width="1200" height="760" fill="url(#bg)"/>
  <rect x="28" y="28" width="1144" height="704" rx="28" fill="#ffffff" stroke="#cbd5e1"/>

  <text x="72" y="84" class="small">자료구조 핵심 대비</text>
  <text x="72" y="126" class="title">09-02. 트리와 그래프</text>
  <text x="72" y="156" class="subtitle">트리는 루트에서 아래로 펼쳐지는 계층 구조이고, 그래프는 정점과 간선이 자유롭게 연결되는 일반 네트워크다.</text>

  <rect x="60" y="190" width="500" height="310" rx="24" fill="#f0fdf4" stroke="#86efac"/>
  <rect x="640" y="190" width="500" height="310" rx="24" fill="#f5f3ff" stroke="#c4b5fd"/>

  <text x="88" y="228" class="section">트리: 부모-자식 관계가 보이는 구조</text>
  <text x="88" y="255" class="body">루트에서 시작해 아래로 갈수록 레벨이 늘어난다. 연결되어 있지만 되돌아오는 사이클은 없다.</text>

  <line x1="208" y1="300" x2="138" y2="368" class="treeLine"/>
  <line x1="208" y1="300" x2="278" y2="368" class="treeLine"/>
  <line x1="138" y1="368" x2="98" y2="432" class="treeLine"/>
  <line x1="138" y1="368" x2="178" y2="432" class="treeLine"/>
  <line x1="278" y1="368" x2="238" y2="432" class="treeLine"/>
  <line x1="278" y1="368" x2="318" y2="432" class="treeLine"/>

  <circle cx="208" cy="300" r="28" fill="#166534"/>
  <circle cx="138" cy="368" r="24" fill="#16a34a"/>
  <circle cx="278" cy="368" r="24" fill="#16a34a"/>
  <circle cx="98" cy="432" r="20" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <circle cx="178" cy="432" r="20" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <circle cx="238" cy="432" r="20" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>
  <circle cx="318" cy="432" r="20" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/>

  <text x="208" y="306" text-anchor="middle" class="label white">Root</text>
  <text x="138" y="373" text-anchor="middle" class="label white">L</text>
  <text x="278" y="373" text-anchor="middle" class="label white">R</text>
  <text x="98" y="437" text-anchor="middle" class="small">A</text>
  <text x="178" y="437" text-anchor="middle" class="small">B</text>
  <text x="238" y="437" text-anchor="middle" class="small">C</text>
  <text x="318" y="437" text-anchor="middle" class="small">D</text>

  <rect x="354" y="286" width="178" height="144" rx="16" fill="#ffffff" stroke="#bbf7d0"/>
  <text x="374" y="317" class="label">시험 답안 키워드</text>
  <text x="374" y="345" class="body">• 루트, 부모, 자식, 리프</text>
  <text x="374" y="371" class="body">• 연결되어 있고 사이클 없음</text>
  <text x="374" y="397" class="body">• 정점 n개면 간선은 n-1개</text>
  <text x="88" y="474" class="small">예: 조직도, 폴더 구조, 의사결정 트리</text>

  <text x="668" y="228" class="section">그래프: 연결 방식이 더 자유로운 구조</text>
  <text x="668" y="255" class="body">같은 정점 집합이라도 방향, 가중치, 연결성, 사이클 여부를 함께 봐야 한다.</text>

  <line x1="760" y1="306" x2="862" y2="278" class="graphLine"/>
  <line x1="862" y1="278" x2="956" y2="332" class="graphLine"/>
  <line x1="956" y1="332" x2="918" y2="426" class="graphLine"/>
  <line x1="918" y1="426" x2="802" y2="430" class="graphLine"/>
  <line x1="802" y1="430" x2="760" y2="306" class="graphLine"/>
  <line x1="862" y1="278" x2="802" y2="430" class="graphLine" stroke="#8b5cf6"/>
  <line x1="760" y1="306" x2="918" y2="426" class="graphLine" stroke="#8b5cf6"/>

  <circle cx="760" cy="306" r="24" fill="#6d28d9"/>
  <circle cx="862" cy="278" r="24" fill="#7c3aed"/>
  <circle cx="956" cy="332" r="24" fill="#7c3aed"/>
  <circle cx="918" cy="426" r="24" fill="#7c3aed"/>
  <circle cx="802" cy="430" r="24" fill="#7c3aed"/>

  <text x="760" y="311" text-anchor="middle" class="label white">A</text>
  <text x="862" y="283" text-anchor="middle" class="label white">B</text>
  <text x="956" y="337" text-anchor="middle" class="label white">C</text>
  <text x="918" y="431" text-anchor="middle" class="label white">D</text>
  <text x="802" y="435" text-anchor="middle" class="label white">E</text>

  <rect x="1000" y="286" width="118" height="164" rx="16" fill="#ffffff" stroke="#ddd6fe"/>
  <text x="1018" y="317" class="label">그래프 체크포인트</text>
  <text x="1018" y="345" class="body">• cycle 가능</text>
  <text x="1018" y="371" class="body">• directed / undirected</text>
  <text x="1018" y="397" class="body">• 가중치 부여 가능</text>
  <text x="1018" y="423" class="body">• 최단 경로 문제로 확장</text>
  <text x="668" y="474" class="small">예: 도로망, SNS, 컴퓨터 네트워크</text>

  <rect x="60" y="532" width="1080" height="164" rx="24" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="88" y="570" class="section">한 줄 비교</text>

  <rect x="88" y="590" width="318" height="80" rx="18" fill="#ffffff" stroke="#bbf7d0"/>
  <text x="108" y="621" class="label">트리를 보면</text>
  <text x="108" y="648" class="body">루트가 있는지, 부모-자식 레벨이 보이는지,</text>
  <text x="108" y="669" class="body">사이클 없이 연결되었는지를 먼저 본다.</text>

  <rect x="440" y="590" width="318" height="80" rx="18" fill="#ffffff" stroke="#ddd6fe"/>
  <text x="460" y="621" class="label">그래프를 보면</text>
  <text x="460" y="648" class="body">정점과 간선의 연결 방식, 방향성, 가중치,</text>
  <text x="460" y="669" class="body">연결성·사이클 여부를 함께 확인한다.</text>

  <rect x="792" y="590" width="320" height="80" rx="18" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="812" y="621" class="label">시험장에서 바로 쓰는 문장</text>
  <text x="812" y="648" class="body">"트리는 그래프의 특수한 형태로, 연결되어 있고</text>
  <text x="812" y="669" class="body">사이클이 없으며 간선 수가 n-1이다."</text>
</svg>
