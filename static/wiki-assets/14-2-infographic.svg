<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1180" viewBox="0 0 1200 1180" role="img" aria-labelledby="title desc">
  <title id="title">14-2. 캐시와 메모리 계층 인포그래픽</title>
  <desc id="desc">메모리 계층의 속도와 용량 관계, 지역성, TLB와 평균 접근 시간 공식을 나누어 설명하는 인포그래픽</desc>
  <defs>
    <linearGradient id="pageBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .title { font: 700 34px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .subtitle { font: 500 18px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
      .section { font: 700 22px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .panelText { font: 500 16px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
      .caption { font: 600 14px 'Pretendard','Noto Sans KR',sans-serif; fill: #475569; }
      .layerLabel { font: 700 18px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .layerNote { font: 500 14px 'Pretendard','Noto Sans KR',sans-serif; fill: #1e293b; }
      .metric { font: 700 16px 'Pretendard','Noto Sans KR',sans-serif; fill: #ffffff; }
      .formula { font: 700 26px 'Pretendard','Noto Sans KR',sans-serif; fill: #1d4ed8; }
      .tiny { font: 600 13px 'Pretendard','Noto Sans KR',sans-serif; fill: #64748b; }
      .chip { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="1200" height="1180" fill="url(#pageBg)"/>
  <rect x="28" y="28" width="1144" height="1124" rx="30" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <text class="caption" x="68" y="82">컴퓨터구조 · 메모리 접근 성능 한눈에 보기</text>
  <text class="title" x="68" y="122">14-2. 캐시와 메모리 계층</text>
  <text class="subtitle" x="68" y="156">빠른 계층은 작고 비싸며, 평균 성능은 지역성·캐시 미스·주소 변환 비용이 함께 결정합니다.</text>

  <rect x="56" y="188" width="1088" height="530" rx="26" fill="#f8fafc" stroke="#cbd5e1"/>
  <text class="section" x="84" y="228">1. 메모리 계층: CPU에 가까울수록 빠르고 작다</text>
  <text class="panelText" x="84" y="258">자주 쓰는 데이터를 위쪽 계층에 남겨서 hit time은 낮추고, 아래 계층 접근은 가능한 줄이는 것이 목표입니다.</text>

  <rect x="104" y="286" width="340" height="42" rx="16" fill="url(#hero)"/>
  <text class="metric" x="274" y="313" text-anchor="middle">더 빠름 · 더 작음 · 비용/비트 더 큼</text>

  <rect x="122" y="350" width="304" height="44" rx="16" fill="#dbeafe" stroke="#60a5fa"/>
  <text class="layerLabel" x="274" y="378" text-anchor="middle">레지스터</text>
  <text class="layerNote" x="466" y="378">명령 직전 값 저장 · CPU와 가장 가까움</text>

  <rect x="108" y="406" width="332" height="48" rx="16" fill="#bfdbfe" stroke="#60a5fa"/>
  <text class="layerLabel" x="274" y="436" text-anchor="middle">L1 캐시</text>
  <text class="layerNote" x="466" y="425">가장 짧은 지연시간</text>
  <text class="tiny" x="466" y="444">보통 명령어/데이터 캐시로 분리</text>

  <rect x="94" y="466" width="360" height="48" rx="16" fill="#93c5fd" stroke="#3b82f6"/>
  <text class="layerLabel" x="274" y="496" text-anchor="middle">L2 캐시</text>
  <text class="layerNote" x="466" y="485">L1보다 크고 느림</text>
  <text class="tiny" x="466" y="504">미스를 줄이는 중간 완충 계층</text>

  <rect x="80" y="526" width="388" height="48" rx="16" fill="#60a5fa" stroke="#2563eb"/>
  <text x="274" y="556" text-anchor="middle" style="font:700 18px 'Pretendard','Noto Sans KR',sans-serif; fill:#ffffff;">L3 캐시</text>
  <text class="layerNote" x="466" y="545">여러 코어가 공유하는 마지막 레벨 캐시</text>
  <text class="tiny" x="466" y="564">멀티코어에서는 일관성과 함께 고려</text>

  <rect x="66" y="586" width="416" height="48" rx="16" fill="#e2e8f0" stroke="#94a3b8"/>
  <text class="layerLabel" x="274" y="616" text-anchor="middle">메인 메모리</text>
  <text class="layerNote" x="496" y="616">용량이 크지만 지연시간 증가</text>

  <rect x="52" y="646" width="444" height="50" rx="16" fill="#cbd5e1" stroke="#94a3b8"/>
  <text class="layerLabel" x="274" y="677" text-anchor="middle">보조기억장치</text>
  <text class="layerNote" x="510" y="677">가장 크고 가장 느린 저장 계층</text>

  <line x1="540" y1="654" x2="540" y2="312" stroke="#2563eb" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <text class="caption" x="554" y="324">위로 갈수록 접근 지연 감소</text>
  <line x1="566" y1="312" x2="566" y2="654" stroke="#475569" stroke-width="3" marker-end="url(#arrowGray)"/>
  <text class="caption" x="580" y="674">아래로 갈수록 용량 증가</text>

  <rect x="660" y="298" width="434" height="120" rx="20" fill="#ffffff" stroke="#cbd5e1"/>
  <text class="section" x="688" y="334" font-size="18">성능 해석 포인트</text>
  <text class="panelText" x="688" y="364">• Hit time: 캐시가 바로 응답하는 시간</text>
  <text class="panelText" x="688" y="392">• Miss rate: 상위 계층에서 못 찾는 비율</text>
  <text class="panelText" x="688" y="420">• Miss penalty: 하위 계층까지 내려가는 추가 비용</text>

  <rect x="660" y="446" width="434" height="120" rx="20" fill="#dbeafe" stroke="#93c5fd"/>
  <text class="panelText" x="688" y="482">핵심 메시지</text>
  <text class="section" x="688" y="515" font-size="19">빠른 CPU만으로는 부족하고,</text>
  <text class="section" x="688" y="542" font-size="19">자주 쓰는 데이터가 얼마나 위 계층에 남는지가 성능을 좌우합니다.</text>

  <rect x="56" y="746" width="1088" height="166" rx="26" fill="#f8fafc" stroke="#cbd5e1"/>
  <text class="section" x="84" y="786">2. 지역성(Locality): 반복과 연속이 캐시를 살린다</text>

  <rect x="100" y="814" width="474" height="74" rx="18" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
  <text class="layerLabel" x="126" y="843">시간 지역성</text>
  <text class="panelText" x="126" y="869">최근에 읽거나 쓴 블록은 곧 다시 사용할 가능성이 높습니다.</text>
  <circle cx="455" cy="851" r="15" fill="#1d4ed8"/>
  <circle cx="497" cy="851" r="15" fill="#60a5fa"/>
  <circle cx="539" cy="851" r="15" fill="#bfdbfe"/>
  <line x1="470" y1="851" x2="482" y2="851" stroke="#2563eb" stroke-width="3" marker-end="url(#arrowBlue)"/>

  <rect x="626" y="814" width="474" height="74" rx="18" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
  <text class="layerLabel" x="652" y="843">공간 지역성</text>
  <text class="panelText" x="652" y="869">한 주소를 쓰면 주변 주소도 이어서 사용할 가능성이 높습니다.</text>
  <g transform="translate(941 830)">
    <rect x="0" y="0" width="28" height="28" rx="6" fill="#1d4ed8"/>
    <rect x="34" y="0" width="28" height="28" rx="6" fill="#3b82f6"/>
    <rect x="68" y="0" width="28" height="28" rx="6" fill="#60a5fa"/>
    <rect x="102" y="0" width="28" height="28" rx="6" fill="#93c5fd"/>
  </g>

  <rect x="56" y="940" width="1088" height="174" rx="26" fill="#f8fafc" stroke="#cbd5e1"/>
  <text class="section" x="84" y="980">3. TLB + AMAT: 주소 변환 비용도 평균 접근 시간에 포함된다</text>

  <rect x="112" y="1008" width="170" height="54" rx="16" fill="#dbeafe" stroke="#60a5fa"/>
  <text class="layerLabel" x="197" y="1042" text-anchor="middle">가상주소 요청</text>

  <rect x="344" y="996" width="170" height="78" rx="16" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
  <text class="layerLabel" x="429" y="1029" text-anchor="middle">TLB 조회</text>
  <text class="tiny" x="429" y="1052" text-anchor="middle">페이지 테이블 항목 캐시</text>

  <rect x="576" y="1008" width="200" height="54" rx="16" fill="#dbeafe" stroke="#60a5fa"/>
  <text class="layerLabel" x="676" y="1042" text-anchor="middle">물리주소 확정</text>

  <line x1="282" y1="1035" x2="344" y2="1035" stroke="#2563eb" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <line x1="514" y1="1035" x2="576" y2="1035" stroke="#2563eb" stroke-width="3" marker-end="url(#arrowBlue)"/>

  <rect class="chip" x="824" y="994" width="268" height="82" rx="18"/>
  <text class="panelText" x="850" y="1025">TLB miss가 나면 페이지 테이블 탐색이 추가되어</text>
  <text class="panelText" x="850" y="1050">단순 캐시 miss보다 비용이 더 커질 수 있습니다.</text>

  <text class="formula" x="112" y="1102">AMAT = Hit Time + Miss Rate × Miss Penalty</text>
  <text class="caption" x="112" y="1126">예: 1ns + 0.05 × 100ns = 6ns</text>
</svg>