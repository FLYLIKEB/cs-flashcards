<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">14-2. 캐시와 메모리 계층 인포그래픽</title>
  <desc id="desc">메모리 계층 구조, 지역성, TLB, AMAT 공식을 함께 설명하는 캐시와 메모리 계층 인포그래픽</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="hierTop" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="hierMid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="hierLow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <style>
      .title { font: 700 34px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .subtitle { font: 500 17px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
      .section { font: 700 18px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .label { font: 700 16px 'Pretendard','Noto Sans KR',sans-serif; fill: #eff6ff; }
      .body { font: 500 15px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
      .small { font: 600 13px 'Pretendard','Noto Sans KR',sans-serif; fill: #475569; }
      .mini { font: 700 12px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .formula { font: 700 26px 'Pretendard','Noto Sans KR',sans-serif; fill: #1d4ed8; }
    </style>
  </defs>

  <rect width="1200" height="720" fill="url(#bg)"/>
  <rect x="30" y="30" width="1140" height="660" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <text class="small" x="70" y="82">컴퓨터구조 · 메모리 접근 성능의 핵심 흐름</text>
  <text class="title" x="70" y="122">14-2. 캐시와 메모리 계층</text>
  <text class="subtitle" x="70" y="156">자주 쓰는 데이터는 CPU 가까이에 두고, 지역성과 주소 변환 비용까지 함께 관리해야 평균 접근 시간이 줄어듭니다.</text>

  <rect x="60" y="190" width="500" height="470" rx="24" fill="#f8fafc" stroke="#cbd5e1"/>
  <text class="section" x="88" y="226">메모리 계층: 가까울수록 빠르고 작고 비쌈</text>

  <polygon points="310,252 420,300 200,300" fill="url(#hierTop)"/>
  <polygon points="200,312 420,312 470,352 150,352" fill="url(#hierMid)"/>
  <polygon points="150,364 470,364 500,404 120,404" fill="#3b82f6"/>
  <polygon points="120,416 500,416 525,456 95,456" fill="#60a5fa"/>
  <polygon points="95,468 525,468 545,513 75,513" fill="#93c5fd"/>
  <polygon points="75,525 545,525 565,580 55,580" fill="url(#hierLow)"/>

  <text class="label" x="310" y="286" text-anchor="middle">레지스터</text>
  <text class="label" x="310" y="340" text-anchor="middle">L1 캐시</text>
  <text class="label" x="310" y="392" text-anchor="middle">L2 캐시</text>
  <text class="label" x="310" y="444" text-anchor="middle">L3 캐시</text>
  <text class="mini" x="310" y="497" text-anchor="middle">메인 메모리</text>
  <text class="mini" x="310" y="555" text-anchor="middle">보조기억장치</text>

  <text class="small" x="450" y="280">최소 지연</text>
  <text class="small" x="486" y="555">최대 용량</text>
  <line x1="454" y1="290" x2="525" y2="535" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <text class="small" x="102" y="280">비용/비트 ↑</text>
  <line x1="165" y1="286" x2="225" y2="260" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="84" y="606" width="450" height="40" rx="12" fill="#dbeafe"/>
  <text class="body" x="102" y="632">핵심: hit time, miss rate, miss penalty를 함께 봐야 병목을 찾을 수 있다.</text>

  <rect x="585" y="190" width="585" height="220" rx="24" fill="#f8fafc" stroke="#cbd5e1"/>
  <text class="section" x="613" y="226">지역성(Locality): 캐시는 반복과 연속을 좋아한다</text>

  <rect x="615" y="248" width="250" height="140" rx="18" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
  <text class="section" x="635" y="278" font-size="16">시간 지역성</text>
  <circle cx="660" cy="326" r="26" fill="#2563eb" opacity="0.15"/>
  <circle cx="660" cy="326" r="16" fill="#2563eb"/>
  <circle cx="720" cy="326" r="16" fill="#60a5fa">
    <animate attributeName="opacity" values="0.35;1;0.35" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="780" cy="326" r="16" fill="#93c5fd"/>
  <line x1="676" y1="326" x2="704" y2="326" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
  <text class="body" x="635" y="370">최근 사용한 블록은 다시 참조될 가능성이 높다.</text>

  <rect x="885" y="248" width="255" height="140" rx="18" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
  <text class="section" x="905" y="278" font-size="16">공간 지역성</text>
  <g transform="translate(912 304)">
    <rect x="0" y="0" width="32" height="32" rx="6" fill="#1d4ed8"/>
    <rect x="36" y="0" width="32" height="32" rx="6" fill="#3b82f6"/>
    <rect x="72" y="0" width="32" height="32" rx="6" fill="#60a5fa"/>
    <rect x="108" y="0" width="32" height="32" rx="6" fill="#93c5fd"/>
    <rect x="144" y="0" width="32" height="32" rx="6" fill="#bfdbfe"/>
    <rect x="180" y="0" width="32" height="32" rx="6" fill="#dbeafe"/>
  </g>
  <path d="M 928 348 C 960 374, 1015 374, 1048 348" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <text class="body" x="905" y="370">배열 순차 접근처럼 인접 주소를 함께 활용한다.</text>

  <rect x="585" y="430" width="585" height="230" rx="24" fill="#f8fafc" stroke="#cbd5e1"/>
  <text class="section" x="613" y="466">TLB + AMAT: 주소 변환과 캐시 미스 비용까지 포함</text>

  <rect x="615" y="490" width="120" height="62" rx="14" fill="#dbeafe" stroke="#60a5fa"/>
  <text class="mini" x="675" y="518" text-anchor="middle">가상주소</text>
  <text class="small" x="675" y="537" text-anchor="middle">CPU가 요청</text>

  <rect x="770" y="478" width="120" height="86" rx="14" fill="#eff6ff" stroke="#60a5fa"/>
  <text class="mini" x="830" y="508" text-anchor="middle">TLB</text>
  <text class="small" x="830" y="528" text-anchor="middle">페이지 테이블</text>
  <text class="small" x="830" y="545" text-anchor="middle">항목 캐시</text>

  <rect x="925" y="490" width="140" height="62" rx="14" fill="#dbeafe" stroke="#60a5fa"/>
  <text class="mini" x="995" y="518" text-anchor="middle">물리주소</text>
  <text class="small" x="995" y="537" text-anchor="middle">캐시/메모리 접근</text>

  <line x1="735" y1="521" x2="770" y2="521" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="890" y1="521" x2="925" y2="521" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>

  <text class="body" x="615" y="590">TLB miss가 나면 페이지 테이블 탐색이 추가되어 단순 캐시 miss보다 더 비싸질 수 있다.</text>
  <text class="formula" x="615" y="632">AMAT = Hit Time + Miss Rate × Miss Penalty</text>
  <text class="small" x="617" y="650">예: 1ns + 0.05 × 100ns = 6ns</text>

  <text class="small" x="70" y="686">L1은 가장 짧은 지연, L2/L3는 miss rate 완화, TLB는 주소 변환 캐시</text>
</svg>
