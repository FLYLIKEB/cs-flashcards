<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-labelledby="title desc">
  <title id="title">07-02-01 1NF 2NF 3NF 정규화 단계 인포그래픽</title>
  <desc id="desc">수강신청 테이블이 1NF, 2NF, 3NF를 거치며 반복 그룹, 부분 함수 종속, 이행 함수 종속을 제거하는 과정을 세로 단계로 보여주는 SVG 인포그래픽.</desc>
  <defs>
    <style>
      text { font-family: 'Pretendard', 'Noto Sans KR', sans-serif; fill: #0f172a; }
      .eyebrow { font-size: 18px; font-weight: 700; letter-spacing: 0.08em; fill: #475569; }
      .title { font-size: 40px; font-weight: 800; }
      .subtitle { font-size: 20px; font-weight: 500; fill: #334155; }
      .section-title { font-size: 32px; font-weight: 800; }
      .section-sub { font-size: 18px; font-weight: 700; fill: #1e3a8a; }
      .table-title { font-size: 18px; font-weight: 800; }
      .header { font-size: 14px; font-weight: 700; fill: #334155; }
      .cell { font-size: 14px; font-weight: 600; }
      .label { font-size: 14px; font-weight: 800; fill: #ffffff; }
      .note { font-size: 18px; font-weight: 700; }
      .small { font-size: 15px; font-weight: 600; fill: #334155; }
      .foot { font-size: 15px; font-weight: 700; fill: #475569; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="1200" height="1500" fill="#f8fafc"/>
  <rect x="28" y="28" width="1144" height="1444" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <text class="eyebrow" x="72" y="92">DATABASE NORMALIZATION</text>
  <text class="title" x="72" y="142">1NF → 2NF → 3NF: 수강신청 테이블 분해 흐름</text>
  <text class="subtitle" x="72" y="182">한 장에서 모든 내용을 억지로 넣지 않고, 각 단계마다 무엇을 제거하는지와 결과 테이블만 선명하게 남겼다.</text>

  <rect x="64" y="230" width="1072" height="360" rx="28" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text class="section-title" x="96" y="286">1NF</text>
  <text class="section-sub" x="96" y="318">한 칸에 여러 값이 들어간 반복 그룹을 행 단위 기록으로 쪼갠다.</text>

  <rect x="96" y="350" width="440" height="176" rx="20" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
  <text class="table-title" x="118" y="380">위반 예시: 한 셀에 과목과 성적이 함께 들어감</text>
  <line x1="96" y1="402" x2="536" y2="402" stroke="#cbd5e1"/>
  <line x1="176" y1="350" x2="176" y2="526" stroke="#e2e8f0"/>
  <line x1="280" y1="350" x2="280" y2="526" stroke="#e2e8f0"/>
  <line x1="96" y1="446" x2="536" y2="446" stroke="#e2e8f0"/>
  <line x1="96" y1="486" x2="536" y2="486" stroke="#e2e8f0"/>
  <text class="header" x="116" y="388">학번</text>
  <text class="header" x="198" y="388">학생명</text>
  <text class="header" x="302" y="388">수강과목 / 성적</text>
  <text class="cell" x="116" y="432">S01</text>
  <text class="cell" x="198" y="432">김하나</text>
  <text class="cell" x="302" y="432">운영체제, DB / A, B+</text>
  <text class="cell" x="116" y="472">S02</text>
  <text class="cell" x="198" y="472">이두리</text>
  <text class="cell" x="302" y="472">운영체제 / B</text>
  <rect x="352" y="414" width="132" height="28" rx="14" fill="#dc2626"/>
  <text class="label" x="418" y="433" text-anchor="middle">반복 그룹</text>

  <line x1="568" y1="438" x2="632" y2="438" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="664" y="350" width="408" height="176" rx="20" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
  <text class="table-title" x="686" y="380">1NF 결과: 각 수강 기록을 한 행으로 분리</text>
  <line x1="664" y1="402" x2="1072" y2="402" stroke="#cbd5e1"/>
  <line x1="748" y1="350" x2="748" y2="526" stroke="#e2e8f0"/>
  <line x1="860" y1="350" x2="860" y2="526" stroke="#e2e8f0"/>
  <line x1="960" y1="350" x2="960" y2="526" stroke="#e2e8f0"/>
  <line x1="664" y1="446" x2="1072" y2="446" stroke="#e2e8f0"/>
  <line x1="664" y1="486" x2="1072" y2="486" stroke="#e2e8f0"/>
  <text class="header" x="686" y="388">학번</text>
  <text class="header" x="770" y="388">학생명</text>
  <text class="header" x="882" y="388">과목코드</text>
  <text class="header" x="982" y="388">성적</text>
  <text class="cell" x="686" y="432">S01</text>
  <text class="cell" x="770" y="432">김하나</text>
  <text class="cell" x="882" y="432">C101</text>
  <text class="cell" x="982" y="432">A</text>
  <text class="cell" x="686" y="472">S01</text>
  <text class="cell" x="770" y="472">김하나</text>
  <text class="cell" x="882" y="472">C102</text>
  <text class="cell" x="982" y="472">B+</text>
  <text class="cell" x="686" y="512">S02</text>
  <text class="cell" x="770" y="512">이두리</text>
  <text class="cell" x="882" y="512">C101</text>
  <text class="cell" x="982" y="512">B</text>

  <text class="note" x="96" y="560">핵심: “원자값인가?”만 본다. 한 셀의 리스트를 없애면 1NF다.</text>

  <line x1="600" y1="608" x2="600" y2="660" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="64" y="688" width="1072" height="334" rx="28" fill="#f0fdf4" stroke="#86efac" stroke-width="2"/>
  <text class="section-title" x="96" y="744">2NF</text>
  <text class="section-sub" x="96" y="776">복합키 (학번, 과목코드)의 일부만으로 정해지는 속성을 분리한다.</text>

  <rect x="96" y="808" width="360" height="156" rx="20" fill="#ffffff" stroke="#4ade80" stroke-width="2"/>
  <text class="table-title" x="118" y="840">부분 함수 종속 체크</text>
  <text class="cell" x="118" y="878">학번 → 학생명, 학과코드, 학과명</text>
  <text class="cell" x="118" y="914">과목코드 → 과목명, 담당교수, 교수연구실</text>
  <text class="cell" x="118" y="950">학번+과목코드 → 성적</text>
  <rect x="300" y="852" width="116" height="28" rx="14" fill="#d97706"/>
  <text class="label" x="358" y="871" text-anchor="middle">부분 종속</text>

  <line x1="486" y1="886" x2="538" y2="886" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="570" y="792" width="156" height="190" rx="20" fill="#ffffff" stroke="#4ade80" stroke-width="2"/>
  <text class="table-title" x="592" y="826">학생</text>
  <text class="small" x="592" y="864">PK 학번</text>
  <text class="small" x="592" y="900">학생명</text>
  <text class="small" x="592" y="936">학과코드</text>
  <text class="small" x="592" y="972">학과명</text>

  <rect x="752" y="792" width="156" height="190" rx="20" fill="#ffffff" stroke="#4ade80" stroke-width="2"/>
  <text class="table-title" x="774" y="826">수강</text>
  <text class="small" x="774" y="864">PK 학번</text>
  <text class="small" x="774" y="900">PK 과목코드</text>
  <text class="small" x="774" y="936">성적</text>

  <rect x="934" y="792" width="156" height="190" rx="20" fill="#ffffff" stroke="#4ade80" stroke-width="2"/>
  <text class="table-title" x="956" y="826">과목</text>
  <text class="small" x="956" y="864">PK 과목코드</text>
  <text class="small" x="956" y="900">과목명</text>
  <text class="small" x="956" y="936">담당교수</text>
  <text class="small" x="956" y="972">교수연구실</text>

  <text class="note" x="96" y="998">핵심: “복합키 전체에 의존하는가?”를 묻고, 일부 키에만 의존하면 테이블을 분리한다.</text>

  <line x1="600" y1="1042" x2="600" y2="1094" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="64" y="1122" width="1072" height="270" rx="28" fill="#faf5ff" stroke="#c4b5fd" stroke-width="2"/>
  <text class="section-title" x="96" y="1178">3NF</text>
  <text class="section-sub" x="96" y="1210">비키 속성이 다른 비키 속성을 다시 결정하면, 그 이행 종속을 따로 떼어낸다.</text>

  <rect x="96" y="1242" width="338" height="108" rx="20" fill="#ffffff" stroke="#a78bfa" stroke-width="2"/>
  <text class="table-title" x="118" y="1274">이행 함수 종속 체크</text>
  <text class="cell" x="118" y="1310">학번 → 학과코드 → 학과명</text>
  <text class="cell" x="118" y="1340">과목코드 → 담당교수 → 교수연구실</text>

  <line x1="462" y1="1298" x2="520" y2="1298" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="548" y="1240" width="122" height="118" rx="18" fill="#ffffff" stroke="#a78bfa" stroke-width="2"/>
  <text class="table-title" x="570" y="1270">학생</text>
  <text class="small" x="570" y="1302">학번</text>
  <text class="small" x="570" y="1334">학생명</text>
  <text class="small" x="570" y="1366">학과코드</text>

  <rect x="692" y="1240" width="122" height="118" rx="18" fill="#ffffff" stroke="#a78bfa" stroke-width="2"/>
  <text class="table-title" x="714" y="1270">학과</text>
  <text class="small" x="714" y="1302">학과코드</text>
  <text class="small" x="714" y="1334">학과명</text>

  <rect x="836" y="1240" width="122" height="118" rx="18" fill="#ffffff" stroke="#a78bfa" stroke-width="2"/>
  <text class="table-title" x="858" y="1270">과목</text>
  <text class="small" x="858" y="1302">과목코드</text>
  <text class="small" x="858" y="1334">과목명</text>
  <text class="small" x="858" y="1366">교수ID</text>

  <rect x="980" y="1240" width="122" height="118" rx="18" fill="#ffffff" stroke="#a78bfa" stroke-width="2"/>
  <text class="table-title" x="1002" y="1270">교수</text>
  <text class="small" x="1002" y="1302">교수ID</text>
  <text class="small" x="1002" y="1334">담당교수</text>
  <text class="small" x="1002" y="1366">연구실</text>

  <text class="note" x="96" y="1382">핵심: “비키 속성이 비키 속성을 결정하는가?”를 끊어 학과·교수 정보를 독립시킨다.</text>

  <rect x="72" y="1416" width="1056" height="32" rx="16" fill="#e2e8f0"/>
  <text class="foot" x="92" y="1438">검사 순서: 1NF 원자성 확인 → 2NF 부분 종속 확인 → 3NF 이행 종속 확인 → 마지막으로 무손실 조인과 종속성 보존 점검</text>
</svg>
