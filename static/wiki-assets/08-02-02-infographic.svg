  <text class="small" x="84" y="86">금융공기업 IT · 페이지 맞춤 SVG</text>
  <text class="title" x="84" y="118" text-anchor="start"><tspan x="84" dy="0">08-02-02. 혼잡제어와 흐름제어</tspan></text>
  <text class="subtitle" x="84" y="180" text-anchor="start"><tspan x="84" dy="0">흐름제어는 송신자와 수신자 속도 차이를 조절한다(end-to-end). 수신자는</tspan><tspan x="84" dy="24">자신이 처리 가능한 버퍼 크기를 광고하고 송신자는 이를 넘지 않도록 데이터를</tspan></text>
