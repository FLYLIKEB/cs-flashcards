<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">11-02-02 실제 프로젝트 테스트 흐름</title>
  <desc id="desc">기능 변경 이후 단위, 통합, 시스템, 인수 테스트가 프로젝트 흐름에서 어떻게 이어지고 회귀 테스트와 스모크 테스트가 어디에 놓이는지 보여주는 SVG</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      text { font-family: 'Pretendard', 'Noto Sans KR', sans-serif; fill: #0f172a; }
      .eyebrow { font-size: 16px; font-weight: 700; letter-spacing: 0.12em; fill: #475569; }
      .title { font-size: 34px; font-weight: 800; }
      .subtitle { font-size: 18px; font-weight: 500; fill: #334155; }
      .stage { font-size: 22px; font-weight: 800; }
      .body { font-size: 16px; font-weight: 500; fill: #1e293b; }
      .small { font-size: 14px; font-weight: 500; fill: #475569; }
      .tag { font-size: 13px; font-weight: 700; fill: #1e293b; }
      .lane { font-size: 18px; font-weight: 800; }
    </style>
  </defs>

  <rect width="1200" height="760" fill="url(#bg)"/>
  <rect x="28" y="28" width="1144" height="704" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <text x="72" y="86" class="eyebrow">REAL PROJECT FLOW</text>
  <text x="72" y="128" class="title">실무 테스트 흐름에서 각 레벨이 놓이는 위치</text>
  <text x="72" y="162" class="subtitle">테스트 레벨 사다리는 “범위 비교”, 아래 흐름도는 “프로젝트 진행 순서”를 보여준다.</text>

  <g transform="translate(72 214)">
    <text x="0" y="24" class="lane">개발·검증 흐름</text>
    <line x1="0" y1="58" x2="1020" y2="58" stroke="#cbd5e1" stroke-width="8" stroke-linecap="round"/>
    <line x1="80" y1="58" x2="960" y2="58" stroke="#475569" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)"/>

    <g transform="translate(16 92)">
      <rect x="0" y="0" width="176" height="116" rx="22" fill="#dbeafe" stroke="#60a5fa"/>
      <text x="20" y="34" class="stage">기능 변경</text>
      <text x="20" y="60" class="body">버그 수정, 기능 추가,</text>
      <text x="20" y="82" class="body">리팩터링이 시작점</text>
      <rect x="20" y="88" width="92" height="22" rx="11" fill="#ffffff"/>
      <text x="66" y="103" text-anchor="middle" class="tag">Change set</text>
    </g>

    <g transform="translate(224 92)">
      <rect x="0" y="0" width="188" height="116" rx="22" fill="#dbeafe" stroke="#60a5fa"/>
      <text x="20" y="34" class="stage">단위 테스트</text>
      <text x="20" y="60" class="body">함수·클래스 단위에서</text>
      <text x="20" y="82" class="body">즉시 로직 정확성 확인</text>
      <rect x="20" y="88" width="106" height="22" rx="11" fill="#ffffff"/>
      <text x="73" y="103" text-anchor="middle" class="tag">Fast feedback</text>
    </g>

    <g transform="translate(444 92)">
      <rect x="0" y="0" width="200" height="116" rx="22" fill="#e0e7ff" stroke="#818cf8"/>
      <text x="20" y="34" class="stage">통합 테스트</text>
      <text x="20" y="60" class="body">서비스·DB·외부 API 연결과</text>
      <text x="20" y="82" class="body">트랜잭션 흐름 검증</text>
      <rect x="20" y="88" width="118" height="22" rx="11" fill="#ffffff"/>
      <text x="79" y="103" text-anchor="middle" class="tag">Interface check</text>
    </g>

    <g transform="translate(676 92)">
      <rect x="0" y="0" width="188" height="116" rx="22" fill="#ede9fe" stroke="#a78bfa"/>
      <text x="20" y="34" class="stage">시스템 테스트</text>
      <text x="20" y="60" class="body">전체 서비스 시나리오와</text>
      <text x="20" y="82" class="body">성능·보안·복구 확인</text>
      <rect x="20" y="88" width="108" height="22" rx="11" fill="#ffffff"/>
      <text x="74" y="103" text-anchor="middle" class="tag">End-to-end</text>
    </g>

    <g transform="translate(896 92)">
      <rect x="0" y="0" width="148" height="116" rx="22" fill="#fae8ff" stroke="#e879f9"/>
      <text x="20" y="34" class="stage">인수 테스트</text>
      <text x="20" y="60" class="body">업무 담당자 승인,</text>
      <text x="20" y="82" class="body">운영 절차 최종 확인</text>
      <rect x="20" y="88" width="62" height="22" rx="11" fill="#ffffff"/>
      <text x="51" y="103" text-anchor="middle" class="tag">UAT</text>
    </g>
  </g>

  <g transform="translate(72 472)">
    <rect x="0" y="0" width="512" height="194" rx="26" fill="#f0fdf4" stroke="#86efac"/>
    <text x="28" y="42" class="lane">회귀 테스트가 걸치는 위치</text>
    <text x="28" y="72" class="body">변경이 생기면 기존 기능이 깨졌는지 다시 확인하므로,</text>
    <text x="28" y="96" class="body">단위 → 통합 → 시스템 구간을 가로질러 반복 수행된다.</text>
    <rect x="28" y="122" width="456" height="42" rx="21" fill="#dcfce7" stroke="#86efac"/>
    <text x="256" y="149" text-anchor="middle" class="stage" style="font-size:20px;">회귀 테스트 = 변경 영향 범위를 따라 다시 검증</text>
  </g>

  <g transform="translate(620 472)">
    <rect x="0" y="0" width="448" height="194" rx="26" fill="#fff7ed" stroke="#fdba74"/>
    <text x="28" y="42" class="lane">스모크 테스트가 놓이는 위치</text>
    <text x="28" y="72" class="body">빌드나 배포 직후 “핵심 기능이 일단 살아 있는가?”를</text>
    <text x="28" y="96" class="body">짧게 점검한 뒤 상세 테스트나 운영 전환으로 넘어간다.</text>
    <rect x="28" y="122" width="392" height="42" rx="21" fill="#ffedd5" stroke="#fdba74"/>
    <text x="224" y="149" text-anchor="middle" class="stage" style="font-size:20px;">스모크 테스트 = 배포 직후 대표 경로만 빠르게 확인</text>
  </g>
</svg>
