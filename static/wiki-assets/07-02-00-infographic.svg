  <text class="small" x="84" y="86">금융공기업 IT · 페이지 맞춤 SVG</text>
  <text class="title" x="84" y="118" text-anchor="start"><tspan x="84" dy="0">07-02. 정규화</tspan></text>
  <text class="subtitle" x="84" y="180" text-anchor="start"><tspan x="84" dy="0">정규화는 중복 데이터를 줄이고 삽입 삭제 갱신 이상을 막기 위해 릴레이션을 더 작은</tspan><tspan x="84" dy="24">릴레이션으로 분해하는 과정이다. 핵심 기준은 함수 종속이다. 어떤 속성 X를 알면</tspan></text>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#14b8a6"/></marker></defs><rect x="420" y="170" width="360" height="90" rx="22" fill="#ffffff" stroke="#14b8a6" stroke-width="2"/><text class="label" x="600" y="204" text-anchor="middle"><tspan x="600" dy="0">비정규형</tspan></text><text class="body" x="438" y="240" text-anchor="start"></text><rect x="210" y="350" width="120" height="82" rx="22" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/><text class="label" x="270" y="384" text-anchor="middle"><tspan x="270" dy="0">1NF</tspan></text><text class="body" x="228" y="420" text-anchor="start"></text><line x1="600" y1="260" x2="270" y2="350" stroke="#14b8a6" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="430" y="350" width="120" height="82" rx="22" fill="#ecfeff" stroke="#0f766e" stroke-width="2"/><text class="label" x="490" y="384" text-anchor="middle"><tspan x="490" dy="0">2NF</tspan></text><text class="body" x="448" y="420" text-anchor="start"></text><line x1="600" y1="260" x2="490" y2="350" stroke="#14b8a6" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="650" y="350" width="120" height="82" rx="22" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/><text class="label" x="710" y="384" text-anchor="middle"><tspan x="710" dy="0">3NF</tspan></text><text class="body" x="668" y="420" text-anchor="start"></text><line x1="600" y1="260" x2="710" y2="350" stroke="#14b8a6" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="870" y="350" width="120" height="82" rx="22" fill="#ecfeff" stroke="#0f766e" stroke-width="2"/><text class="label" x="930" y="384" text-anchor="middle"><tspan x="930" dy="0">BCNF</tspan></text><text class="body" x="888" y="420" text-anchor="start"></text><line x1="600" y1="260" x2="930" y2="350" stroke="#14b8a6" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><line x1="600" y1="516" x2="600" y2="612" stroke="#14b8a6" stroke-width="3" stroke-dasharray="8 8"><animate attributeName="stroke-dashoffset" from="0" to="-40" dur="4s" repeatCount="indefinite"/></line><rect x="390" y="612" width="420" height="60" rx="22" fill="#f8fafc" stroke="#0f766e" stroke-width="2"/><text class="label" x="600" y="646" text-anchor="middle"><tspan x="600" dy="0">분해 기준</tspan></text><text class="body" x="408" y="682" text-anchor="start"><tspan x="408" dy="0">1NF</tspan><tspan x="408" dy="18">2NF</tspan><tspan x="408" dy="18">3NF</tspan></text>
