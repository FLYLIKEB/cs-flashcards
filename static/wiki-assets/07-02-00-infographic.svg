<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="940" viewBox="0 0 1280 940" role="img" aria-labelledby="title desc">
  <title id="title">07-02. 정규화 개요 인포그래픽</title>
  <desc id="desc">정규화의 목적, 주문상세원본의 반복 정보, 핵심 함수 종속, 분해 후 점검 항목을 나눈 고가독성 요약 다이어그램</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <style>
      .title { font: 700 36px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .subtitle { font: 500 18px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
      .section { font: 700 22px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .label { font: 700 18px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .body { font: 500 16px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
      .small { font: 600 14px 'Pretendard','Noto Sans KR',sans-serif; fill: #475569; }
      .tiny { font: 600 13px 'Pretendard','Noto Sans KR',sans-serif; fill: #475569; }
      .mono { font: 700 17px 'SFMono-Regular','Menlo',monospace; fill: #0f766e; }
      .badge { font: 700 14px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f766e; }
    </style>
  </defs>

  <rect width="1280" height="940" fill="url(#bg)"/>
  <rect x="28" y="28" width="1224" height="884" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <text class="small" x="72" y="82">데이터베이스 · 정규화 핵심 요약</text>
  <text class="title" x="72" y="126">07-02. 정규화</text>
  <text class="subtitle" x="72" y="160">정규화는 반복 저장을 줄이고 이상현상을 막기 위해 함수 종속을 기준으로 릴레이션을 나누는 과정이다.</text>

  <rect x="64" y="202" width="1152" height="160" rx="24" fill="#f8fafc" stroke="#cbd5e1"/>
  <text class="section" x="92" y="240">왜 정규화하는가</text>

  <rect x="92" y="264" width="332" height="70" rx="18" fill="#fee2e2" stroke="#fca5a5"/>
  <text class="label" x="116" y="292">갱신 이상</text>
  <text class="body" x="116" y="316">김하나의 고객등급이 바뀌면</text>
  <text class="body" x="116" y="338">주문 행 여러 개를 함께 수정해야 한다.</text>

  <rect x="474" y="264" width="332" height="70" rx="18" fill="#fef3c7" stroke="#fcd34d"/>
  <text class="label" x="498" y="292">삽입 이상</text>
  <text class="body" x="498" y="316">아직 주문하지 않은 새 상품은</text>
  <text class="body" x="498" y="338">주문 행이 없으면 등록이 어색해진다.</text>

  <rect x="856" y="264" width="332" height="70" rx="18" fill="#dbeafe" stroke="#93c5fd"/>
  <text class="label" x="880" y="292">삭제 이상</text>
  <text class="body" x="880" y="316">주문 한 건을 지우는 순간</text>
  <text class="body" x="880" y="338">고객·상품 정보까지 함께 사라질 수 있다.</text>

  <rect x="64" y="390" width="560" height="370" rx="24" fill="#f8fafc" stroke="#bfdbfe"/>
  <text class="section" x="92" y="430">반복 저장되는 원본 테이블</text>
  <rect x="92" y="452" width="504" height="44" rx="12" fill="#dbeafe"/>
  <text class="label" x="112" y="480">주문상세원본</text>
  <text class="small" x="360" y="480">후보키 = (주문ID, 상품ID)</text>

  <rect x="92" y="516" width="504" height="40" rx="10" fill="#e2e8f0"/>
  <text class="tiny" x="108" y="541">주문ID</text>
  <text class="tiny" x="176" y="541">고객ID</text>
  <text class="tiny" x="244" y="541">고객명</text>
  <text class="tiny" x="322" y="541">고객등급</text>
  <text class="tiny" x="426" y="541">상품ID</text>
  <text class="tiny" x="500" y="541">수량</text>

  <rect x="92" y="566" width="504" height="42" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text class="tiny" x="108" y="592">O1001</text>
  <text class="tiny" x="176" y="592">C01</text>
  <text class="tiny" x="244" y="592">김하나</text>
  <text class="tiny" x="322" y="592">GOLD</text>
  <text class="tiny" x="426" y="592">P10</text>
  <text class="tiny" x="500" y="592">1</text>

  <rect x="92" y="618" width="504" height="42" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text class="tiny" x="108" y="644">O1001</text>
  <text class="tiny" x="176" y="644">C01</text>
  <text class="tiny" x="244" y="644">김하나</text>
  <text class="tiny" x="322" y="644">GOLD</text>
  <text class="tiny" x="426" y="644">P20</text>
  <text class="tiny" x="500" y="644">2</text>

  <rect x="92" y="670" width="504" height="42" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text class="tiny" x="108" y="696">O1002</text>
  <text class="tiny" x="176" y="696">C02</text>
  <text class="tiny" x="244" y="696">이두리</text>
  <text class="tiny" x="322" y="696">SILVER</text>
  <text class="tiny" x="426" y="696">P20</text>
  <text class="tiny" x="500" y="696">1</text>

  <text class="badge" x="108" y="734">반복 포인트</text>
  <text class="body" x="210" y="734">고객명·고객등급·상품 정보가 주문 행마다 다시 저장된다.</text>

  <rect x="656" y="390" width="560" height="370" rx="24" fill="#f8fafc" stroke="#99f6e4"/>
  <text class="section" x="684" y="430">핵심 함수 종속과 분해 기준</text>

  <rect x="684" y="454" width="504" height="64" rx="16" fill="#ecfeff" stroke="#99f6e4"/>
  <text class="mono" x="708" y="482">주문ID → 고객ID</text>
  <text class="body" x="708" y="506">주문 하나는 한 고객에 대응하므로 주문 정보와 고객 정보를 구분한다.</text>

  <rect x="684" y="534" width="504" height="64" rx="16" fill="#ecfeff" stroke="#99f6e4"/>
  <text class="mono" x="708" y="562">고객ID → 고객명, 고객등급</text>
  <text class="body" x="708" y="586">고객의 일반 속성은 고객ID가 정하므로 고객 테이블로 분리한다.</text>

  <rect x="684" y="614" width="504" height="64" rx="16" fill="#ecfeff" stroke="#99f6e4"/>
  <text class="mono" x="708" y="642">상품ID → 상품명, 단가</text>
  <text class="body" x="708" y="666">상품 속성도 상품ID에만 달려 있으므로 상품 테이블이 따로 필요하다.</text>

  <rect x="684" y="694" width="504" height="64" rx="16" fill="#dcfce7" stroke="#86efac"/>
  <text class="mono" x="708" y="722">주문ID, 상품ID → 수량</text>
  <text class="body" x="708" y="746">수량만 복합키 전체에 직접 의존하므로 주문상세에 남긴다.</text>

  <rect x="64" y="786" width="1152" height="94" rx="24" fill="#0f172a"/>
  <text class="section" x="92" y="826" fill="#f8fafc">분해 후 최종 점검</text>
  <circle cx="116" cy="850" r="6" fill="#5eead4"/>
  <text class="body" x="136" y="856" fill="#e2e8f0">무손실 분해: 공통 속성이 한쪽 릴레이션의 키와 연결되어 조인해도 원래 정보가 유지된다.</text>
  <circle cx="116" cy="880" r="6" fill="#5eead4"/>
  <text class="body" x="136" y="886" fill="#e2e8f0">종속성 보존: 원래 함수 종속을 분해된 각 테이블에서 조인 없이 점검할 수 있다.</text>
</svg>
