<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">08-04. 라우팅과 서브넷 개요</title>
  <desc id="desc">라우팅의 Longest Prefix Match 우선순위와 CIDR 서브넷 계산의 핵심 숫자를 한눈에 보여주는 개요 SVG</desc>
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .soft { fill: #eff6ff; stroke: #93c5fd; stroke-width: 2; }
      .green { fill: #ecfdf5; stroke: #34d399; stroke-width: 2; }
      .amber { fill: #fff7ed; stroke: #fb923c; stroke-width: 2; }
      .heroTitle { font: 700 36px 'Pretendard','Noto Sans KR',sans-serif; fill: #f8fafc; }
      .heroBody { font: 500 17px 'Pretendard','Noto Sans KR',sans-serif; fill: #dbeafe; }
      .eyebrow { font: 700 13px 'Pretendard','Noto Sans KR',sans-serif; fill: #93c5fd; letter-spacing: 0.08em; }
      .section { font: 700 26px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .label { font: 700 18px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .body { font: 500 16px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
      .small { font: 600 14px 'Pretendard','Noto Sans KR',sans-serif; fill: #475569; }
      .mono { font: 700 18px 'SFMono-Regular','Consolas','Menlo',monospace; fill: #0f172a; }
      .monoSmall { font: 700 15px 'SFMono-Regular','Consolas','Menlo',monospace; fill: #1e293b; }
      .accent { fill: #1d4ed8; }
      .accentText { font: 700 16px 'Pretendard','Noto Sans KR',sans-serif; fill: #ffffff; }
    </style>
  </defs>

  <rect class="bg" width="1200" height="760"/>
  <rect x="28" y="28" width="1144" height="704" rx="32" fill="#e2e8f0"/>
  <rect x="44" y="44" width="1112" height="176" rx="28" fill="url(#hero)"/>
  <text x="78" y="88" class="eyebrow">ROUTING · LONGEST PREFIX MATCH · CIDR · SUBNETTING</text>
  <text x="78" y="132" class="heroTitle">08-04. 라우팅과 서브넷</text>
  <text x="78" y="168" class="heroBody">라우터는 목적지 IP와 가장 구체적인 경로를 매칭하고, CIDR은 네트워크/호스트 비트를 나눠 주소 범위를 계산한다.</text>
  <text x="78" y="193" class="heroBody">면접에서는 “어떤 경로를 고르나?”와 “이 IP의 네트워크/브로드캐스트 주소는?”를 빠르게 설명하면 된다.</text>

  <rect x="78" y="102" width="308" height="84" rx="18" fill="#0b1220" stroke="#60a5fa" stroke-width="2"/>
  <text x="102" y="136" class="label" fill="#f8fafc">핵심 우선순위</text>
  <text x="102" y="160" class="heroBody">1) Longest Prefix Match</text>
  <text x="102" y="182" class="heroBody">2) 관리 거리(AD)  3) 메트릭</text>

  <rect x="68" y="252" width="514" height="430" rx="28" class="panel"/>
  <text x="96" y="296" class="section">라우팅: 가장 긴 프리픽스가 먼저</text>
  <text x="96" y="325" class="body">목적지 10.1.5.45는 /8, /16, /24 중에서 가장 구체적인 /24 엔트리와 매칭된다.</text>

  <rect x="96" y="354" width="168" height="74" rx="18" class="soft"/>
  <text x="180" y="386" text-anchor="middle" class="small">입력 패킷</text>
  <text x="180" y="412" text-anchor="middle" class="mono">DST 10.1.5.45</text>

  <rect x="292" y="344" width="258" height="150" rx="22" class="soft"/>
  <text x="316" y="378" class="label">라우팅 테이블</text>
  <text x="316" y="406" class="monoSmall">10.0.0.0/8   → eth0</text>
  <text x="316" y="432" class="monoSmall">10.1.0.0/16  → eth1</text>
  <rect x="308" y="444" width="226" height="34" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="324" y="466" class="monoSmall">10.1.5.0/24  → eth2</text>
  <text x="316" y="492" class="monoSmall">0.0.0.0/0    → default</text>

  <path d="M 264 391 H 292" fill="none" stroke="#2563eb" stroke-width="4"/>
  <polygon points="292,391 278,383 278,399" fill="#2563eb"/>

  <rect x="96" y="522" width="454" height="126" rx="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="120" y="555" class="label">선택 순서</text>
  <text x="120" y="584" class="body">① /24가 /16·/8보다 길어서 가장 구체적</text>
  <text x="120" y="611" class="body">② 같은 프리픽스면 관리 거리(AD)가 더 낮은 경로 선택</text>
  <text x="120" y="638" class="body">③ AD도 같으면 OSPF cost, RIP hop count 같은 메트릭 비교</text>

  <rect x="350" y="664" width="200" height="42" rx="21" class="accent"/>
  <text x="450" y="691" text-anchor="middle" class="accentText">선택 결과: eth2</text>

  <rect x="618" y="252" width="514" height="430" rx="28" class="panel"/>
  <text x="646" y="296" class="section">서브넷: /26이면 블록 크기 64</text>
  <text x="646" y="325" class="body">192.168.10.66/26은 호스트 비트가 6개이므로 64개 단위로 끊어 계산한다.</text>

  <rect x="646" y="354" width="458" height="90" rx="18" class="soft"/>
  <text x="670" y="387" class="label">CIDR 해석</text>
  <text x="670" y="414" class="monoSmall">mask = 255.255.255.192   host bits = 32 - 26 = 6</text>
  <text x="670" y="437" class="monoSmall">block size = 2^6 = 64   usable hosts = 64 - 2 = 62</text>

  <rect x="646" y="468" width="458" height="88" rx="18" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="670" y="500" class="label">서브넷 블록</text>
  <text x="670" y="527" class="monoSmall">192.168.10.0/26 | 192.168.10.64/26 | 192.168.10.128/26</text>
  <text x="670" y="549" class="body">10.66은 64~127 구간에 있으므로 192.168.10.64/26에 속한다.</text>

  <rect x="646" y="580" width="214" height="92" rx="18" class="green"/>
  <text x="670" y="613" class="label">네트워크 주소</text>
  <text x="670" y="642" class="mono">192.168.10.64</text>
  <text x="670" y="663" class="small">호스트 비트를 0으로 만든 값</text>

  <rect x="890" y="580" width="214" height="92" rx="18" class="amber"/>
  <text x="914" y="613" class="label">브로드캐스트 주소</text>
  <text x="914" y="642" class="mono">192.168.10.127</text>
  <text x="914" y="663" class="small">호스트 비트를 1로 만든 값</text>

  <rect x="716" y="694" width="314" height="24" rx="12" fill="#dbeafe"/>
  <rect x="732" y="700" width="266" height="12" rx="6" fill="#2563eb" opacity="0.22"/>
  <text x="873" y="713" text-anchor="middle" class="small">사용 가능한 호스트 범위: 192.168.10.65 ~ 192.168.10.126</text>
</svg>
