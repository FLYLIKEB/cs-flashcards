<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">15-5. 토큰증권 구조도</title>
  <desc id="desc">기초 권리, STO 토큰, 제도 연계, 기대효익과 검토 리스크를 분리해 보여주는 SVG</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#faf7ff"/>
      <stop offset="100%" stop-color="#eff6ff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M1,1 L11,6 L1,11 Z" fill="#7c3aed"/>
    </marker>
  </defs>
  <style>
    text { font-family: 'Pretendard', 'Noto Sans KR', sans-serif; fill: #0f172a; }
    .h1 { font-size: 30px; font-weight: 800; }
    .lead { font-size: 16px; font-weight: 500; fill: #334155; }
    .section { font-size: 20px; font-weight: 800; }
    .boxTitle { font-size: 18px; font-weight: 800; }
    .body { font-size: 14px; font-weight: 500; fill: #334155; }
    .noteTitle { font-size: 14px; font-weight: 800; }
    .note { font-size: 13px; font-weight: 500; fill: #475569; }
  </style>
  <rect width="1200" height="760" fill="url(#bg)"/>
  <rect x="40" y="34" width="1120" height="118" rx="28" fill="#ffffff" filter="url(#shadow)"/>
  <text class="h1" x="76" y="84">토큰증권(STO)은 “권리 표현”과 “제도 연계”를 함께 봐야 합니다.</text>
  <text class="lead" x="76" y="118">토큰 그 자체보다, 어떤 권리를 담는지와 기존 전자증권·예탁결제 체계와 어떻게 이어지는지가 핵심입니다.</text>

  <rect x="56" y="188" width="256" height="214" rx="24" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2" filter="url(#shadow)"/>
  <text class="section" x="84" y="228">1. 기초 권리</text>
  <text class="boxTitle" x="84" y="270">대표 예시</text>
  <text class="body" x="84" y="298">• 지분형 권리</text>
  <text class="body" x="84" y="324">• 채권형 권리</text>
  <text class="body" x="84" y="350">• 부동산 수익권</text>
  <text class="note" x="84" y="382">권리의 범위와 투자자 청구권이 문서로</text>
  <text class="note" x="84" y="404">명확해야 토큰이 법적으로 설명됩니다.</text>

  <rect x="362" y="188" width="256" height="214" rx="24" fill="#ede9fe" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)"/>
  <text class="section" x="390" y="228">2. STO 토큰</text>
  <text class="boxTitle" x="390" y="270">토큰에 담는 내용</text>
  <text class="body" x="390" y="298">• 권리·의무의 디지털 표현</text>
  <text class="body" x="390" y="324">• 배당·이자·의결권 실행 규칙</text>
  <text class="body" x="390" y="350">• 분산원장 기반 유통·정산 로직</text>
  <text class="note" x="390" y="382">토큰은 권리의 “포장”일 뿐이므로</text>
  <text class="note" x="390" y="404">법적 실체와 분리되면 안 됩니다.</text>

  <rect x="668" y="188" width="256" height="214" rx="24" fill="#dbeafe" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
  <text class="section" x="696" y="228">3. 제도 연계</text>
  <text class="boxTitle" x="696" y="270">실무 확인사항</text>
  <text class="body" x="696" y="298">• 증권성 판단과 공시 의무</text>
  <text class="body" x="696" y="324">• 투자자 보호 체계</text>
  <text class="body" x="696" y="350">• 전자증권·예탁결제 인터페이스</text>
  <text class="note" x="696" y="382">기술 설계보다 먼저 제도 적합성을</text>
  <text class="note" x="696" y="404">확인해야 운영 리스크가 줄어듭니다.</text>

  <rect x="974" y="188" width="170" height="214" rx="24" fill="#ecfeff" stroke="#0ea5e9" stroke-width="2" filter="url(#shadow)"/>
  <text class="section" x="1002" y="228">4. 유통 효과</text>
  <text class="body" x="1002" y="272">• 소액 분할 투자</text>
  <text class="body" x="1002" y="300">• 유동성 확대</text>
  <text class="body" x="1002" y="328">• 자동화된 권리 이행</text>
  <text class="body" x="1002" y="356">• 글로벌 접근성</text>

  <line x1="312" y1="295" x2="362" y2="295" stroke="#7c3aed" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="618" y1="295" x2="668" y2="295" stroke="#7c3aed" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="924" y1="295" x2="974" y2="295" stroke="#7c3aed" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>

  <rect x="56" y="456" width="520" height="236" rx="24" fill="#ffffff" stroke="#d8b4fe" stroke-width="2" filter="url(#shadow)"/>
  <text class="section" x="84" y="496">기대효익</text>
  <text class="body" x="84" y="532">• 투자 단위를 잘게 나눠 참여자 저변을 넓힐 수 있습니다.</text>
  <text class="body" x="84" y="562">• 권리 이행 규칙을 시스템화해 배당·이자 처리 효율을 높일 수 있습니다.</text>
  <text class="body" x="84" y="592">• 기존 비유동 자산의 거래 가능성을 높이는 수단이 될 수 있습니다.</text>
  <text class="note" x="84" y="632">단, 효익은 권리구조·유통시장·규제 허용 범위가 모두 맞아야 현실화됩니다.</text>

  <rect x="624" y="456" width="520" height="236" rx="24" fill="#ffffff" stroke="#93c5fd" stroke-width="2" filter="url(#shadow)"/>
  <text class="section" x="652" y="496">면접에서 꼭 말할 리스크</text>
  <text class="body" x="652" y="532">• 권리 귀속과 소유권 이전이 법적으로 확실한가</text>
  <text class="body" x="652" y="562">• 결제 최종성과 분쟁 처리 절차가 준비됐는가</text>
  <text class="body" x="652" y="592">• 투자자 보호, 공시, 민원 처리 체계가 기존 제도와 충돌하지 않는가</text>
  <text class="note" x="652" y="632">정리 문장: STO는 “새 토큰”이 아니라 기존 증권 권리를 새 유통 구조로 표현하는 문제입니다.</text>
</svg>
