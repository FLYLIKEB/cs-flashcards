<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">17-5. 마이크로서비스 핵심 구조</title>
  <desc id="desc">클라이언트 요청이 API Gateway를 거쳐 주문, 결제, 알림 서비스로 분산되고 각 서비스가 자체 데이터 저장소와 관측성 계층을 갖는 구조를 설명하는 SVG</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#eef6ff"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
    </marker>
    <style>
      text { font-family: 'Pretendard', 'Noto Sans KR', sans-serif; }
      .eyebrow { font-size: 14px; font-weight: 700; fill: #dbeafe; letter-spacing: 0.08em; }
      .title { font-size: 34px; font-weight: 800; fill: #ffffff; }
      .subtitle { font-size: 17px; font-weight: 500; fill: #dbeafe; }
      .section { font-size: 14px; font-weight: 800; fill: #475569; letter-spacing: 0.08em; }
      .h2 { font-size: 25px; font-weight: 800; fill: #0f172a; }
      .h3 { font-size: 18px; font-weight: 800; fill: #0f172a; }
      .body { font-size: 15px; font-weight: 500; fill: #334155; }
      .small { font-size: 13px; font-weight: 700; fill: #475569; }
      .tiny { font-size: 12px; font-weight: 700; fill: #475569; }
      .chip { font-size: 12px; font-weight: 800; fill: #0f172a; }
      .heroChip { font-size: 12px; font-weight: 700; fill: #dbeafe; }
    </style>
  </defs>

  <rect width="1200" height="820" fill="url(#bg)"/>
  <rect x="36" y="30" width="1128" height="760" rx="28" fill="#ffffff" stroke="#cbd5e1"/>

  <rect x="64" y="54" width="1072" height="132" rx="24" fill="url(#hero)"/>
  <text class="eyebrow" x="94" y="90">MICROSERVICE ARCHITECTURE</text>
  <text class="title" x="94" y="128">17-5. 마이크로서비스 핵심 구조</text>
  <text class="subtitle" x="94" y="160">API Gateway, 서비스별 DB, 동기·비동기 통신, 관측성 계층을 분리해 독립 배포와 장애 격리를 얻는다.</text>

  <rect x="86" y="214" width="232" height="126" rx="22" fill="#eff6ff" stroke="#93c5fd"/>
  <text class="section" x="110" y="244">ENTRY</text>
  <text class="h2" x="110" y="276">Client 요청</text>
  <text class="body" x="110" y="304">웹·앱·외부 채널이 한 진입점으로 요청을 보낸다.</text>
  <rect x="110" y="314" width="168" height="22" rx="11" fill="#dbeafe"/>
  <text class="chip" x="194" y="329" text-anchor="middle">단일 접근 경로 확보</text>

  <rect x="366" y="214" width="470" height="126" rx="22" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text class="section" x="392" y="244">CONTROL PLANE</text>
  <text class="h2" x="392" y="276">API Gateway</text>
  <text class="body" x="392" y="304">인증·인가, 라우팅, rate limiting, 요청 로깅을 중앙에서 처리한다.</text>
  <rect x="392" y="314" width="92" height="24" rx="12" fill="#bfdbfe"/>
  <text class="chip" x="438" y="330" text-anchor="middle">라우팅</text>
  <rect x="496" y="314" width="92" height="24" rx="12" fill="#bfdbfe"/>
  <text class="chip" x="542" y="330" text-anchor="middle">인증·인가</text>
  <rect x="600" y="314" width="98" height="24" rx="12" fill="#bfdbfe"/>
  <text class="chip" x="649" y="330" text-anchor="middle">Rate Limit</text>
  <rect x="710" y="314" width="84" height="24" rx="12" fill="#bfdbfe"/>
  <text class="chip" x="752" y="330" text-anchor="middle">로깅</text>

  <rect x="884" y="214" width="252" height="126" rx="22" fill="#f8fafc" stroke="#94a3b8"/>
  <text class="section" x="910" y="244">OBSERVABILITY</text>
  <text class="h2" x="910" y="276">공통 운영 계층</text>
  <text class="body" x="910" y="304">로그·지표·트레이스를 수집해 장애 원인을 빠르게 찾는다.</text>
  <rect x="910" y="314" width="182" height="22" rx="11" fill="#e2e8f0"/>
  <text class="chip" x="1001" y="329" text-anchor="middle">대시보드 + 경보 자동화</text>

  <line x1="318" y1="276" x2="366" y2="276" stroke="#2563eb" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <line x1="836" y1="276" x2="884" y2="276" stroke="#2563eb" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <text class="tiny" x="342" y="260" text-anchor="middle">모든 요청 집결</text>
  <text class="tiny" x="860" y="260" text-anchor="middle">관측 데이터 연계</text>

  <rect x="86" y="376" width="1050" height="278" rx="24" fill="#f8fafc" stroke="#cbd5e1"/>
  <text class="section" x="112" y="408">BUSINESS SERVICES</text>
  <text class="h2" x="112" y="440">서비스별 책임 분리</text>
  <text class="body" x="112" y="466">비즈니스 기능 단위로 나누고, 필요한 서비스만 독립 배포·확장한다.</text>

  <rect x="126" y="498" width="280" height="116" rx="22" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text class="h3" x="266" y="530" text-anchor="middle">주문 서비스</text>
  <text class="body" x="266" y="556" text-anchor="middle">주문 생성·상태 관리</text>
  <text class="small" x="266" y="580" text-anchor="middle">동기 호출로 사용자 응답 시작</text>
  <rect x="172" y="588" width="188" height="20" rx="10" fill="#dcfce7"/>
  <text class="chip" x="266" y="602" text-anchor="middle">Order DB + 독립 배포</text>

  <rect x="462" y="498" width="280" height="116" rx="22" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  <text class="h3" x="602" y="530" text-anchor="middle">결제 서비스</text>
  <text class="body" x="602" y="556" text-anchor="middle">핵심 원장과 강한 일관성 유지</text>
  <text class="small" x="602" y="580" text-anchor="middle">실패 시 보상 트랜잭션 설계 필요</text>
  <rect x="508" y="588" width="188" height="20" rx="10" fill="#ccfbf1"/>
  <text class="chip" x="602" y="602" text-anchor="middle">Payment DB + 독립 확장</text>

  <rect x="798" y="498" width="280" height="116" rx="22" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text class="h3" x="938" y="530" text-anchor="middle">알림 서비스</text>
  <text class="body" x="938" y="556" text-anchor="middle">이벤트 기반 후속 처리</text>
  <text class="small" x="938" y="580" text-anchor="middle">메일·푸시·리포트 작업 비동기화</text>
  <rect x="844" y="588" width="188" height="20" rx="10" fill="#ede9fe"/>
  <text class="chip" x="938" y="602" text-anchor="middle">Notify DB + 부분 배포</text>

  <line x1="602" y1="340" x2="266" y2="498" stroke="#2563eb" stroke-width="3.5" marker-end="url(#arrowBlue)"/>
  <line x1="602" y1="340" x2="602" y2="498" stroke="#2563eb" stroke-width="3.5" marker-end="url(#arrowBlue)"/>
  <line x1="602" y1="340" x2="938" y2="498" stroke="#2563eb" stroke-width="3.5" marker-end="url(#arrowBlue)"/>
  <text class="tiny" x="434" y="404" text-anchor="middle">동기 REST / gRPC</text>
  <text class="tiny" x="602" y="390" text-anchor="middle">서비스 라우팅</text>
  <text class="tiny" x="770" y="404" text-anchor="middle">필요 서비스만 호출</text>

  <line x1="406" y1="556" x2="462" y2="556" stroke="#0f766e" stroke-width="4" marker-end="url(#arrowTeal)"/>
  <line x1="742" y1="556" x2="798" y2="556" stroke="#0f766e" stroke-width="4" stroke-dasharray="8 8" marker-end="url(#arrowTeal)"/>
  <text class="tiny" x="434" y="538" text-anchor="middle">Saga 단계</text>
  <text class="tiny" x="770" y="538" text-anchor="middle">이벤트 발행</text>

  <rect x="86" y="682" width="1050" height="78" rx="22" fill="#0f172a"/>
  <text class="heroChip" x="116" y="714">핵심 메시지</text>
  <text class="subtitle" x="116" y="740">MSA는 기능 분리만으로 끝나지 않는다. 서비스별 데이터 소유권, 보상 처리, 관측성, 배포 자동화까지 함께 설계해야 읽기 쉬운 운영 구조가 된다.</text>
</svg>
