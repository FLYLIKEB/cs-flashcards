  <text class="subtitle" x="84" y="180" text-anchor="start"><tspan x="84" dy="0">MSA(마이크로서비스 아키텍처)는 시스템을 비즈니스 역량 단위로 작은 서비스들로</tspan><tspan x="84" dy="24">분리하여 각 서비스가 독립적으로 개발 배포 확장되도록 설계하는 아키텍처다. 서비스는</tspan></text>
