<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">17-5. 마이크로서비스 인포그래픽</title>
  <desc id="desc">모놀리식과 마이크로서비스를 비교하고 API Gateway, 서비스별 DB, 동기 및 비동기 통신, 서비스 메시, 관측성, 독립 배포를 설명하는 SVG</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="55%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#ecfeff"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="monoGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fee2e2"/>
      <stop offset="100%" stop-color="#fecaca"/>
    </linearGradient>
    <linearGradient id="msaGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dcfce7"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="meshGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
    </marker>
    <marker id="arrowGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <style>
      text { font-family: 'Pretendard','Noto Sans KR',sans-serif; }
      .eyebrow { font-size: 14px; font-weight: 700; fill: #cbd5e1; letter-spacing: 0.08em; }
      .title { font-size: 34px; font-weight: 800; fill: #f8fafc; }
      .subtitle { font-size: 16px; font-weight: 500; fill: #dbeafe; }
      .section { font-size: 13px; font-weight: 800; fill: #475569; letter-spacing: 0.06em; }
      .h2 { font-size: 24px; font-weight: 800; fill: #0f172a; }
      .h3 { font-size: 17px; font-weight: 800; fill: #0f172a; }
      .body { font-size: 14px; font-weight: 500; fill: #334155; }
      .small { font-size: 12px; font-weight: 600; fill: #475569; }
      .tiny { font-size: 11px; font-weight: 700; fill: #64748b; }
      .monoText { font-size: 14px; font-weight: 600; fill: #7f1d1d; }
      .good { font-size: 13px; font-weight: 700; fill: #065f46; }
      .capsule { font-size: 12px; font-weight: 800; fill: #0f172a; }
    </style>
  </defs>

  <rect width="1200" height="720" fill="url(#bg)"/>
  <rect x="34" y="28" width="1132" height="664" rx="28" fill="#ffffff" stroke="#cbd5e1"/>

  <rect x="58" y="48" width="1084" height="120" rx="24" fill="url(#hero)"/>
  <text class="eyebrow" x="88" y="82">MICROSERVICE ARCHITECTURE</text>
  <text class="title" x="88" y="118">17-5. 마이크로서비스</text>
  <text class="subtitle" x="88" y="146">비즈니스 기능별로 서비스를 나누고 API로 연결해 각 서비스가 독립 개발·배포·확장되는 구조</text>

  <rect x="80" y="196" width="300" height="260" rx="24" fill="url(#monoGrad)" stroke="#fca5a5"/>
  <text class="section" x="104" y="226">BEFORE</text>
  <text class="h2" x="104" y="256">모놀리식</text>
  <rect x="116" y="282" width="228" height="108" rx="20" fill="#fff7ed" stroke="#fb7185" stroke-width="2"/>
  <text class="h3" x="230" y="316" text-anchor="middle">하나의 큰 애플리케이션</text>
  <text class="monoText" x="230" y="344" text-anchor="middle">UI + 주문 + 결제 + 알림 + 리포트</text>
  <text class="monoText" x="230" y="366" text-anchor="middle">공유 코드 · 공유 배포</text>
  <ellipse cx="230" cy="416" rx="88" ry="24" fill="#7f1d1d" opacity="0.1"/>
  <ellipse cx="230" cy="422" rx="88" ry="24" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <ellipse cx="230" cy="410" rx="88" ry="24" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
  <text class="h3" x="230" y="417" text-anchor="middle">단일 DB / 단일 트랜잭션</text>
  <text class="body" x="104" y="484">• 전체를 함께 배포하므로 변경 영향 범위가 큼</text>
  <text class="body" x="104" y="508">• 초기 개발은 단순하지만 규모가 커질수록 충돌과 배포 위험 증가</text>

  <rect x="404" y="196" width="718" height="410" rx="24" fill="url(#msaGrad)" stroke="#93c5fd"/>
  <text class="section" x="428" y="226">AFTER</text>
  <text class="h2" x="428" y="256">MSA 핵심 구조</text>

  <rect x="452" y="278" width="118" height="56" rx="18" fill="#ffffff" stroke="#94a3b8"/>
  <text class="h3" x="511" y="312" text-anchor="middle">Client</text>

  <rect x="616" y="266" width="214" height="80" rx="22" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text class="h3" x="723" y="298" text-anchor="middle">API Gateway</text>
  <text class="body" x="723" y="320" text-anchor="middle">인증·인가 · 라우팅 · Rate Limit · 로깅</text>

  <line x1="570" y1="306" x2="616" y2="306" stroke="#2563eb" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <text class="tiny" x="592" y="292" text-anchor="middle">진입점</text>

  <rect x="458" y="386" width="152" height="104" rx="22" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>
  <text class="h3" x="534" y="418" text-anchor="middle">주문 서비스</text>
  <text class="body" x="534" y="440" text-anchor="middle">비즈니스 기능 분리</text>
  <rect x="492" y="454" width="84" height="22" rx="11" fill="#dcfce7"/>
  <text class="capsule" x="534" y="469" text-anchor="middle">독립 배포</text>

  <rect x="688" y="386" width="152" height="104" rx="22" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
  <text class="h3" x="764" y="418" text-anchor="middle">결제 서비스</text>
  <text class="body" x="764" y="440" text-anchor="middle">강한 일관성 구간</text>
  <rect x="722" y="454" width="84" height="22" rx="11" fill="#ccfbf1"/>
  <text class="capsule" x="764" y="469" text-anchor="middle">독립 확장</text>

  <rect x="918" y="386" width="152" height="104" rx="22" fill="#ffffff" stroke="#7c3aed" stroke-width="2"/>
  <text class="h3" x="994" y="418" text-anchor="middle">알림 서비스</text>
  <text class="body" x="994" y="440" text-anchor="middle">이벤트 기반 처리</text>
  <rect x="952" y="454" width="84" height="22" rx="11" fill="#ede9fe"/>
  <text class="capsule" x="994" y="469" text-anchor="middle">부분 배포</text>

  <line x1="723" y1="346" x2="534" y2="386" stroke="#2563eb" stroke-width="3.5" marker-end="url(#arrowBlue)"/>
  <line x1="723" y1="346" x2="764" y2="386" stroke="#2563eb" stroke-width="3.5" marker-end="url(#arrowBlue)"/>
  <line x1="723" y1="346" x2="994" y2="386" stroke="#2563eb" stroke-width="3.5" marker-end="url(#arrowBlue)"/>
  <text class="tiny" x="638" y="356">동기 REST / gRPC</text>
  <text class="tiny" x="1018" y="356" text-anchor="middle">라우팅</text>

  <line x1="610" y1="524" x2="688" y2="524" stroke="#0f766e" stroke-width="4" marker-end="url(#arrowTeal)"/>
  <line x1="840" y1="524" x2="918" y2="524" stroke="#0f766e" stroke-width="4" stroke-dasharray="8 8" marker-end="url(#arrowTeal)"/>
  <text class="tiny" x="649" y="510">Saga 단계</text>
  <text class="tiny" x="879" y="510">이벤트 발행</text>

  <ellipse cx="534" cy="550" rx="58" ry="17" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <ellipse cx="534" cy="541" rx="58" ry="17" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <text class="small" x="534" y="546" text-anchor="middle">Order DB</text>

  <ellipse cx="764" cy="550" rx="58" ry="17" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
  <ellipse cx="764" cy="541" rx="58" ry="17" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
  <text class="small" x="764" y="546" text-anchor="middle">Payment DB</text>

  <ellipse cx="994" cy="550" rx="58" ry="17" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <ellipse cx="994" cy="541" rx="58" ry="17" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text class="small" x="994" y="546" text-anchor="middle">Notify DB</text>

  <line x1="534" y1="490" x2="534" y2="524" stroke="#64748b" stroke-width="3" marker-end="url(#arrowGray)"/>
  <line x1="764" y1="490" x2="764" y2="524" stroke="#64748b" stroke-width="3" marker-end="url(#arrowGray)"/>
  <line x1="994" y1="490" x2="994" y2="524" stroke="#64748b" stroke-width="3" marker-end="url(#arrowGray)"/>

  <rect x="458" y="572" width="612" height="20" rx="10" fill="url(#meshGrad)" opacity="0.85"/>
  <text class="small" x="764" y="586" text-anchor="middle">Service Mesh: mTLS · Retry · Circuit Breaker · Load Balancing · Trace 수집</text>

  <rect x="80" y="482" width="300" height="170" rx="24" fill="#ffffff" stroke="#cbd5e1"/>
  <text class="section" x="104" y="512">WHY THIS MATTERS</text>
  <text class="h3" x="104" y="540">운영 포인트</text>
  <text class="body" x="104" y="568">• 서비스별 DB로 결합도를 낮추고 직접 공유를 피함</text>
  <text class="body" x="104" y="592">• 분산 트랜잭션 대신 Saga와 보상 처리로 최종적 일관성 확보</text>
  <text class="body" x="104" y="616">• 로그·메트릭·분산 추적이 장애 원인 파악의 핵심</text>

  <rect x="404" y="624" width="718" height="44" rx="18" fill="#0f172a"/>
  <text class="good" x="437" y="651">배포/운영:</text>
  <text class="subtitle" x="518" y="651">컨테이너 · Kubernetes · CI/CD · Blue/Green · Canary 로 서비스 단위 릴리스</text>
</svg>
