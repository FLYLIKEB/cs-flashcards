<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="940" viewBox="0 0 1280 940" role="img" aria-labelledby="title desc">
  <title id="title">12-04. 오답 기록 템플릿과 일일 복습 루틴</title>
  <desc id="desc">실전 오답노트에 기록할 항목과 당일, D+1, D+7, D+30으로 이어지는 복습 루틴을 분리해 보여주는 SVG</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <style>
      .title { font: 700 34px 'Pretendard','Noto Sans KR',sans-serif; fill: #ffffff; }
      .subtitle { font: 500 18px 'Pretendard','Noto Sans KR',sans-serif; fill: #dbeafe; }
      .section { font: 700 22px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .label { font: 700 18px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .body { font: 500 15px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
      .small { font: 600 14px 'Pretendard','Noto Sans KR',sans-serif; fill: #475569; }
      .tiny { font: 600 13px 'Pretendard','Noto Sans KR',sans-serif; fill: #64748b; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .accent-blue { fill: #eff6ff; stroke: #93c5fd; stroke-width: 2; }
      .accent-green { fill: #f0fdf4; stroke: #86efac; stroke-width: 2; }
      .accent-amber { fill: #fffbeb; stroke: #fcd34d; stroke-width: 2; }
      .line { stroke: #cbd5e1; stroke-width: 1.5; }
    </style>
  </defs>

  <rect width="1280" height="940" fill="url(#bg)"/>
  <rect x="28" y="24" width="1224" height="892" rx="30" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
  <rect x="52" y="46" width="1176" height="104" rx="24" fill="url(#header)"/>
  <text x="86" y="103" class="title">오답 기록 템플릿 + 일일 복습 루틴</text>
  <text x="86" y="131" class="subtitle">기록 칸과 복습 루틴을 분리해서 보면 무엇을 적고 언제 다시 볼지 한 번에 정리된다.</text>

  <rect x="72" y="186" width="680" height="682" rx="26" class="panel"/>
  <text x="102" y="226" class="section">A. 한 문제를 기록하는 기본 틀</text>
  <text x="102" y="254" class="small">오답 한 건당 아래 항목을 빠짐없이 채우면 원인 분석과 재방문이 쉬워진다.</text>

  <rect x="102" y="282" width="620" height="66" rx="18" class="accent-blue"/>
  <text x="126" y="308" class="label">문제 식별 정보</text>
  <text x="126" y="331" class="body">문제번호 · 주제 · 내가 고른 답 · 정답</text>

  <rect x="102" y="364" width="620" height="92" rx="18" class="accent-amber"/>
  <text x="126" y="390" class="label">원인 분석</text>
  <text x="126" y="413" class="body">틀린 유형: 개념 부족 / 계산·표기 실수 / 시간 부족 / 해석 오류</text>
  <text x="126" y="436" class="body">원인(자세히): 왜 그렇게 판단했는지 한 문장 + 구체적 근거</text>

  <rect x="102" y="472" width="620" height="92" rx="18" class="accent-green"/>
  <text x="126" y="498" class="label">재풀이 데이터</text>
  <text x="126" y="521" class="body">재풀이 날짜: YYYY-MM-DD</text>
  <text x="126" y="544" class="body">소요시간: 다시 푸는 데 몇 분 걸렸는지 기록</text>

  <rect x="102" y="580" width="620" height="112" rx="18" class="panel"/>
  <text x="126" y="606" class="label">재발 방지 액션</text>
  <text x="126" y="629" class="body">개선 조치: 정의 요약, 유사문항 추가, 검산 체크, 풀이 순서 변경</text>
  <text x="126" y="652" class="body">복습 주기: D+1 / D+3 / D+7 / D+30</text>
  <text x="126" y="675" class="body">관련 기출 링크: 다시 원문 문제로 돌아갈 수 있게 연결</text>

  <rect x="102" y="708" width="620" height="132" rx="18" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="126" y="734" class="label">빠른 작성 예시</text>
  <text x="126" y="757" class="body">문제번호: 모의고사_2025-03_15_Q12 / 주제: 정규화 / 정답: ② / 내가 고른 답: ③</text>
  <text x="126" y="780" class="body">원인: 제3정규형 정의와 부분함수종속을 혼동함. 예시 테이블을 직접 써보지 않음.</text>
  <text x="126" y="803" class="body">개선 조치: 정의와 예시 테이블 2개 재작성, 유사 문항 3제 추가 풀이, D+1·D+7 재확인</text>

  <rect x="780" y="186" width="428" height="682" rx="26" class="panel"/>
  <text x="810" y="226" class="section">B. 일일 복습 루틴</text>
  <text x="810" y="254" class="small">기록 후 끝내지 말고 복습 시점을 고정해야 오답노트가 실제 행동 지침이 된다.</text>

  <rect x="810" y="286" width="368" height="96" rx="20" class="accent-blue"/>
  <text x="836" y="314" class="label">당일</text>
  <text x="836" y="339" class="body">문제 직후 바로 기록</text>
  <text x="836" y="362" class="body">원인 한 줄 + 근거 + 개선 조치까지 작성</text>

  <line x1="994" y1="382" x2="994" y2="422" class="line"/>
  <polygon points="994,434 986,420 1002,420" fill="#94a3b8"/>

  <rect x="810" y="438" width="368" height="96" rx="20" class="accent-green"/>
  <text x="836" y="466" class="label">D+1</text>
  <text x="836" y="491" class="body">정답을 가리지 않고 다시 풀기</text>
  <text x="836" y="514" class="body">재풀이 시간 기록으로 개념형·실수형 구분</text>

  <line x1="994" y1="534" x2="994" y2="574" class="line"/>
  <polygon points="994,586 986,572 1002,572" fill="#94a3b8"/>

  <rect x="810" y="590" width="368" height="96" rx="20" class="accent-amber"/>
  <text x="836" y="618" class="label">D+7</text>
  <text x="836" y="643" class="body">유사 문항이나 같은 주제로 응용 확인</text>
  <text x="836" y="666" class="body">동일 실수 반복 여부 체크</text>

  <line x1="994" y1="686" x2="994" y2="726" class="line"/>
  <polygon points="994,738 986,724 1002,724" fill="#94a3b8"/>

  <rect x="810" y="742" width="368" height="96" rx="20" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <text x="836" y="770" class="label">D+30</text>
  <text x="836" y="795" class="body">장기 기억 확인용 재도전</text>
  <text x="836" y="818" class="body">여전히 틀리면 전략 수정: 순서·체크리스트·우선순위 재설계</text>

  <text x="810" y="856" class="small">핵심: 기록 템플릿은 “무엇을 적을지”, 복습 루틴은 “언제 다시 행동할지”를 책임진다.</text>
</svg>
