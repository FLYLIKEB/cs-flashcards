<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">07-04. WAL과 회복 절차 SVG</title>
  <desc id="desc">로그 선기록, 체크포인트, 장애 발생 후 커밋 여부에 따른 redo와 undo 판단을 단계적으로 설명하는 SVG</desc>
  <defs>
    <style>
      .title { font: 700 32px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .subtitle { font: 500 17px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
      .section { font: 700 21px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .label { font: 700 17px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .body { font: 500 15px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
      .small { font: 500 13px 'Pretendard','Noto Sans KR',sans-serif; fill: #475569; }
      .mono { font: 600 14px 'SFMono-Regular','Consolas',monospace; fill: #0f172a; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb" />
    </marker>
  </defs>

  <rect width="1200" height="780" fill="#f8fafc" />
  <rect x="24" y="24" width="1152" height="732" rx="28" fill="#ffffff" stroke="#cbd5e1" />

  <text class="small" x="56" y="66">금융공기업 IT · 데이터베이스</text>
  <text class="title" x="56" y="108">WAL과 장애 복구 절차</text>
  <text class="subtitle" x="56" y="140">핵심 문장: 데이터 페이지보다 로그를 먼저 기록하고, 장애 후에는 커밋 여부에 따라 redo 또는 undo를 선택한다.</text>

  <rect x="48" y="178" width="1104" height="264" rx="24" fill="#f8fafc" stroke="#bfdbfe" />
  <text class="section" x="72" y="216">1. Write-Ahead Logging(WAL)</text>
  <text class="small" x="72" y="240">데이터 페이지를 디스크에 쓰기 전에 변경 로그를 먼저 디스크에 남긴다.</text>

  <rect x="84" y="286" width="220" height="112" rx="18" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" />
  <text class="label" x="194" y="322" text-anchor="middle">로그 기록</text>
  <text class="mono" x="194" y="348" text-anchor="middle">L1: A -100</text>
  <text class="mono" x="194" y="370" text-anchor="middle">L2: B +100</text>
  <text class="body" x="194" y="392" text-anchor="middle">변경 내역을 먼저 남김</text>

  <rect x="354" y="286" width="220" height="112" rx="18" fill="#eff6ff" stroke="#2563eb" stroke-width="2" />
  <text class="label" x="464" y="322" text-anchor="middle">데이터 페이지 반영</text>
  <text class="body" x="464" y="348" text-anchor="middle">버퍼의 값이 나중에</text>
  <text class="body" x="464" y="370" text-anchor="middle">디스크 페이지로 기록됨</text>
  <text class="body" x="464" y="392" text-anchor="middle">로그보다 뒤에 와야 함</text>

  <rect x="624" y="286" width="220" height="112" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="2" />
  <text class="label" x="734" y="322" text-anchor="middle">체크포인트</text>
  <text class="body" x="734" y="348" text-anchor="middle">"여기까지는 상태를 기억"</text>
  <text class="body" x="734" y="370" text-anchor="middle">복구 시 뒤져야 할</text>
  <text class="body" x="734" y="392" text-anchor="middle">로그 범위를 줄임</text>

  <rect x="894" y="286" width="220" height="112" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="2" />
  <text class="label" x="1004" y="322" text-anchor="middle">장애 발생</text>
  <text class="body" x="1004" y="348" text-anchor="middle">전원이 꺼지거나</text>
  <text class="body" x="1004" y="370" text-anchor="middle">시스템이 비정상 종료돼도</text>
  <text class="body" x="1004" y="392" text-anchor="middle">로그를 기준으로 판단</text>

  <line x1="304" y1="342" x2="354" y2="342" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)" />
  <line x1="574" y1="342" x2="624" y2="342" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)" />
  <line x1="844" y1="342" x2="894" y2="342" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)" />

  <rect x="48" y="470" width="1104" height="244" rx="24" fill="#f8fafc" stroke="#a7f3d0" />
  <text class="section" x="72" y="508">2. 장애 후 복구 판단</text>
  <text class="small" x="72" y="532">복구 엔진은 체크포인트 이후 로그를 읽고 커밋 여부를 기준으로 분기한다.</text>

  <rect x="88" y="576" width="280" height="98" rx="18" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2" />
  <text class="label" x="112" y="610">분석 단계</text>
  <text class="body" x="112" y="634">체크포인트 이후 어떤 트랜잭션이</text>
  <text class="body" x="112" y="656">시작·완료·중단됐는지 식별한다.</text>

  <rect x="430" y="560" width="304" height="130" rx="18" fill="#fef3c7" stroke="#d97706" stroke-width="2" />
  <text class="label" x="454" y="594">질문: COMMIT 로그가 있는가?</text>
  <text class="body" x="454" y="620">있으면 "완료된 트랜잭션"으로 본다.</text>
  <text class="body" x="454" y="642">없으면 "미완료 트랜잭션"으로 본다.</text>
  <text class="small" x="454" y="668">이 한 줄이 redo/undo를 가르는 기준</text>

  <rect x="796" y="560" width="150" height="130" rx="18" fill="#dcfce7" stroke="#16a34a" stroke-width="2" />
  <text class="label" x="871" y="596" text-anchor="middle">YES → REDO</text>
  <text class="body" x="871" y="622" text-anchor="middle">커밋됐지만</text>
  <text class="body" x="871" y="644" text-anchor="middle">디스크 반영이</text>
  <text class="body" x="871" y="666" text-anchor="middle">누락됐을 수 있어 재실행</text>

  <rect x="978" y="560" width="150" height="130" rx="18" fill="#fee2e2" stroke="#dc2626" stroke-width="2" />
  <text class="label" x="1053" y="596" text-anchor="middle">NO → UNDO</text>
  <text class="body" x="1053" y="622" text-anchor="middle">끝나지 못한</text>
  <text class="body" x="1053" y="644" text-anchor="middle">변경을</text>
  <text class="body" x="1053" y="666" text-anchor="middle">이전 값으로 복구</text>

  <line x1="368" y1="625" x2="430" y2="625" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)" />
  <line x1="734" y1="616" x2="796" y2="616" stroke="#16a34a" stroke-width="4" marker-end="url(#arrow)" />
  <line x1="734" y1="650" x2="978" y2="650" stroke="#dc2626" stroke-width="4" marker-end="url(#arrow)" />

  <text class="small" x="56" y="738">자산: 07-04-wal-recovery-flow.svg · 핵심: 로그 선기록, 체크포인트, COMMIT 여부에 따른 REDO/UNDO</text>
</svg>
