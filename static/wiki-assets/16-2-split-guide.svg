<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">16-2. Train·Validation·Test 분할 가이드</title>
  <desc id="desc">일반 데이터와 시계열 데이터에서 train, validation, test를 어떻게 나누는지 설명하는 SVG</desc>
  <defs>
    <style>
      text { font-family: 'Pretendard', 'Noto Sans KR', sans-serif; fill: #0f172a; }
      .eyebrow { font-size: 15px; font-weight: 700; letter-spacing: 0.12em; fill: #475569; }
      .title { font-size: 32px; font-weight: 800; }
      .subtitle { font-size: 18px; font-weight: 500; fill: #334155; }
      .section { font-size: 22px; font-weight: 800; }
      .label { font-size: 18px; font-weight: 700; }
      .body { font-size: 15px; font-weight: 500; fill: #334155; }
      .small { font-size: 13px; font-weight: 700; fill: #475569; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#0f172a"/>
    </marker>
  </defs>

  <rect width="1200" height="700" fill="#f8fbff"/>
  <rect x="28" y="28" width="1144" height="644" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <text class="eyebrow" x="72" y="82">SPLIT STRATEGY · MODEL SELECTION · TIME ORDER</text>
  <text class="title" x="72" y="122">Train / Validation / Test를 왜 나눌까?</text>
  <text class="subtitle" x="72" y="156">validation은 선택을 위한 중간 점검, test는 마지막 성적표다. 시계열 데이터는 시간 순서를 지키는 것이 핵심이다.</text>

  <rect x="68" y="198" width="490" height="418" rx="24" fill="#f8fafc" stroke="#cbd5e1"/>
  <text class="section" x="96" y="238">1) 일반 데이터 분할</text>

  <rect x="98" y="278" width="112" height="188" rx="18" fill="#dbeafe" stroke="#60a5fa"/>
  <text class="label" x="154" y="512" text-anchor="middle">Train</text>
  <text class="body" x="154" y="536" text-anchor="middle">모델 파라미터 학습</text>

  <rect x="234" y="318" width="96" height="148" rx="18" fill="#ede9fe" stroke="#a78bfa"/>
  <text class="label" x="282" y="512" text-anchor="middle">Validation</text>
  <text class="body" x="282" y="536" text-anchor="middle">하이퍼파라미터 선택</text>

  <rect x="354" y="354" width="80" height="112" rx="18" fill="#dcfce7" stroke="#4ade80"/>
  <text class="label" x="394" y="512" text-anchor="middle">Test</text>
  <text class="body" x="394" y="536" text-anchor="middle">최종 일반화 확인</text>

  <line x1="210" y1="372" x2="234" y2="372" stroke="#0f172a" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="330" y1="392" x2="354" y2="392" stroke="#0f172a" stroke-width="3" marker-end="url(#arrow)"/>

  <text class="small" x="98" y="574">큰 데이터셋이면 hold-out 분할만으로도 충분할 수 있다.</text>
  <text class="body" x="98" y="600">• validation 점수를 보고 모델 구조와 임계값을 조정한다.</text>

  <rect x="296" y="568" width="224" height="34" rx="17" fill="#fee2e2" stroke="#ef4444"/>
  <text class="small" x="408" y="590" text-anchor="middle">test를 반복 확인하면 선택 편향이 생긴다.</text>

  <rect x="610" y="198" width="522" height="418" rx="24" fill="#f0fdf4" stroke="#86efac"/>
  <text class="section" x="638" y="238">2) 시계열 데이터 분할</text>

  <text class="label" x="638" y="286">시간 순서를 유지한 예시</text>
  <rect x="638" y="316" width="224" height="78" rx="18" fill="#dbeafe" stroke="#60a5fa"/>
  <text class="label" x="750" y="346" text-anchor="middle">Train Window</text>
  <text class="body" x="750" y="370" text-anchor="middle">과거 기간으로 학습</text>

  <rect x="884" y="316" width="116" height="78" rx="18" fill="#ede9fe" stroke="#a78bfa"/>
  <text class="label" x="942" y="346" text-anchor="middle">Validation</text>
  <text class="body" x="942" y="370" text-anchor="middle">다음 구간 점검</text>

  <rect x="1022" y="316" width="80" height="78" rx="18" fill="#dcfce7" stroke="#4ade80"/>
  <text class="label" x="1062" y="346" text-anchor="middle">Test</text>
  <text class="body" x="1062" y="370" text-anchor="middle">최종 구간</text>

  <line x1="862" y1="355" x2="884" y2="355" stroke="#0f172a" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1000" y1="355" x2="1022" y2="355" stroke="#0f172a" stroke-width="3" marker-end="url(#arrow)"/>

  <text class="body" x="638" y="438">• 금융 시계열은 미래 정보가 섞이면 성능이 쉽게 부풀려진다.</text>
  <text class="body" x="638" y="464">• fold를 만들 때도 과거 → 미래 방향을 유지해야 한다.</text>

  <rect x="638" y="498" width="462" height="82" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
  <text class="label" x="664" y="530">실무 메모</text>
  <text class="body" x="664" y="554">검증 구간은 라벨 확정 시점보다 뒤에 잡고, 휴일·이벤트로 분포가 달라지는지도 함께 본다.</text>
</svg>
