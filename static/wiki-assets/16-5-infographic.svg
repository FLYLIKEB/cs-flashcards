<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="980" viewBox="0 0 1280 980" role="img" aria-labelledby="title desc">
  <title id="title">16-5. 금융권 적용과 모델 리스크</title>
  <desc id="desc">금융권 AI 모델의 주요 적용 사례와 운영 배포를 위한 설명가능성, 공정성, 드리프트 감시, 승인 통제를 정리한 인포그래픽</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4f8ff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .title{font:700 38px 'Pretendard','Noto Sans KR',sans-serif;fill:#0f172a}
      .subtitle{font:500 18px 'Pretendard','Noto Sans KR',sans-serif;fill:#334155}
      .section{font:700 22px 'Pretendard','Noto Sans KR',sans-serif;fill:#0f172a}
      .cardTitle{font:700 18px 'Pretendard','Noto Sans KR',sans-serif;fill:#0f172a}
      .body{font:500 15px 'Pretendard','Noto Sans KR',sans-serif;fill:#334155}
      .small{font:600 14px 'Pretendard','Noto Sans KR',sans-serif;fill:#475569}
      .label{font:700 15px 'Pretendard','Noto Sans KR',sans-serif;fill:#1e293b}
      .gate{font:700 17px 'Pretendard','Noto Sans KR',sans-serif;fill:#ffffff}
    </style>
  </defs>

  <rect width="1280" height="980" fill="url(#bg)"/>
  <rect x="32" y="32" width="1216" height="916" rx="30" fill="#ffffff" stroke="#dbe4f0" stroke-width="2"/>

  <text class="small" x="74" y="82">금융권 AI 운영 답안: 성능만이 아니라 설명과 통제가 필요하다</text>
  <text class="title" x="74" y="128">16-5. 금융권 적용과 모델 리스크</text>
  <text class="subtitle" x="74" y="162">업무 적용은 넓어지지만, 데이터 품질·공정성·감독 대응·재학습 기준이 없으면 실제 운영 배포는 막힌다.</text>

  <rect x="68" y="206" width="352" height="320" rx="24" fill="#f8fbff" stroke="#93c5fd" stroke-width="2"/>
  <text class="section" x="96" y="244">주요 적용 사례</text>

  <rect x="96" y="266" width="296" height="54" rx="14" fill="#ffffff" stroke="#bfdbfe"/>
  <text class="cardTitle" x="116" y="289">신용평가</text>
  <text class="body" x="226" y="289">대출 승인·한도 산정 / 거절 사유 설명</text>
  <text class="small" x="116" y="310">핵심: 안정성, 설명가능성, 차별 방지</text>

  <rect x="96" y="336" width="296" height="54" rx="14" fill="#ffffff" stroke="#bfdbfe"/>
  <text class="cardTitle" x="116" y="359">FDS</text>
  <text class="body" x="226" y="359">실시간 이상거래 탐지 / 조사 비용 통제</text>
  <text class="small" x="116" y="380">핵심: 지연시간 관리, 오탐 축소, 운영 대응</text>

  <rect x="96" y="406" width="296" height="54" rx="14" fill="#ffffff" stroke="#c4b5fd"/>
  <text class="cardTitle" x="116" y="429">AML 모니터링</text>
  <text class="body" x="226" y="429">패턴·네트워크 분석 / 감독 대응 근거 확보</text>
  <text class="small" x="116" y="450">핵심: 탐지 근거, 문서화, 인간 검토 연계</text>

  <rect x="96" y="476" width="296" height="34" rx="14" fill="#eff6ff" stroke="#93c5fd"/>
  <text class="small" x="116" y="498">챗봇·문서분류도 가능하지만 개인정보·오답 관리가 전제다.</text>

  <rect x="462" y="206" width="352" height="320" rx="24" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <text class="section" x="490" y="244">설명가능성과 공정성</text>

  <rect x="490" y="266" width="296" height="78" rx="16" fill="#ffffff" stroke="#fed7aa"/>
  <text class="cardTitle" x="510" y="291">XAI가 필요한 이유</text>
  <text class="body" x="510" y="314">고객 거절 사유를 설명해야 민원 대응이 가능하다.</text>
  <text class="body" x="510" y="335">내부감사·감독기관 질의에도 같은 근거가 필요하다.</text>

  <rect x="490" y="362" width="296" height="132" rx="16" fill="#ffffff" stroke="#fed7aa"/>
  <text class="cardTitle" x="510" y="387">공정성 점검 축</text>
  <text class="label" x="510" y="415">집단별 지표</text>
  <text class="body" x="622" y="415">precision · recall · FPR 차이</text>
  <text class="label" x="510" y="445">변수 영향</text>
  <text class="body" x="622" y="445">민감 속성과 연관된 설명 변수 확인</text>
  <text class="label" x="510" y="475">보완 통제</text>
  <text class="body" x="622" y="475">인간 검토, 재심 절차, 기준 문서화</text>

  <rect x="856" y="206" width="356" height="320" rx="24" fill="#f7f7ff" stroke="#a5b4fc" stroke-width="2"/>
  <text class="section" x="884" y="244">모델 리스크 관리</text>

  <rect x="884" y="266" width="300" height="56" rx="16" fill="#ffffff" stroke="#c7d2fe"/>
  <text class="cardTitle" x="904" y="290">1. 입력 데이터 품질</text>
  <text class="body" x="904" y="311">결측·오류 점검, 민감정보 축소, 접근권한 통제</text>

  <line x1="1034" y1="322" x2="1034" y2="346" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="884" y="350" width="300" height="56" rx="16" fill="#ffffff" stroke="#c7d2fe"/>
  <text class="cardTitle" x="904" y="374">2. 성능 외 위험 점검</text>
  <text class="body" x="904" y="395">표본 편향, 데이터 누수, 설명 부족 여부 확인</text>

  <line x1="1034" y1="406" x2="1034" y2="430" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="884" y="434" width="300" height="60" rx="16" fill="#ecfeff" stroke="#14b8a6"/>
  <text class="cardTitle" x="904" y="459">3. 운영 모니터링</text>
  <text class="body" x="904" y="480">data drift · label drift · 성능 저하 감시</text>

  <rect x="68" y="560" width="1144" height="152" rx="26" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text class="section" x="96" y="600">배포 게이트: 통제를 모두 통과해야 운영 가능</text>

  <rect x="96" y="624" width="196" height="56" rx="16" fill="#ffffff" stroke="#94a3b8"/>
  <text class="cardTitle" x="116" y="648">독립 검증</text>
  <text class="body" x="116" y="669">모델·데이터·지표 재검토</text>

  <line x1="292" y1="652" x2="338" y2="652" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="344" y="624" width="196" height="56" rx="16" fill="#ffffff" stroke="#94a3b8"/>
  <text class="cardTitle" x="364" y="648">문서화</text>
  <text class="body" x="364" y="669">가정, 한계, 승인 근거 기록</text>

  <line x1="540" y1="652" x2="586" y2="652" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="592" y="614" width="244" height="76" rx="20" fill="#2563eb"/>
  <text class="gate" x="651" y="646">승인 후 배포</text>
  <text class="body" x="630" y="671" fill="#ffffff">배포 이력 · 키 관리 · 감사 로그</text>

  <line x1="836" y1="652" x2="882" y2="652" stroke="#475569" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="888" y="624" width="296" height="56" rx="16" fill="#ffffff" stroke="#94a3b8"/>
  <text class="cardTitle" x="908" y="648">재학습 정책</text>
  <text class="body" x="908" y="669">임계치, 인간 검토, 재승인 기준을 함께 둔다</text>

  <rect x="68" y="746" width="548" height="164" rx="24" fill="#fefce8" stroke="#facc15" stroke-width="2"/>
  <text class="section" x="96" y="784">개인정보·준수</text>
  <text class="body" x="96" y="814">• 최소 수집, 목적 제한, 가명처리·비식별화가 기본이다.</text>
  <text class="body" x="96" y="842">• 민감정보는 입력 자체를 줄이거나 별도 편향 점검과 승인을 거친다.</text>
  <text class="body" x="96" y="870">• 성능이 좋아도 규제와 내부통제를 못 맞추면 배포하지 못한다.</text>

  <rect x="644" y="746" width="568" height="164" rx="24" fill="#faf5ff" stroke="#d8b4fe" stroke-width="2"/>
  <text class="section" x="672" y="784">면접에서 바로 말할 포인트</text>
  <text class="body" x="672" y="814">• 배포를 막는 대표 리스크: 데이터 누수, 표본 편향, 설명가능성 부족, 승인 절차 미비</text>
  <text class="body" x="672" y="842">• 실시간 보장 답안: 경량 피처, 온라인 추론, 모니터링, 피드백 루프, 재학습 정책</text>
  <text class="body" x="672" y="870">• 공정성 답안: 집단별 지표 비교 + 변수 영향 분석 + 인간 검토 절차</text>
</svg>
