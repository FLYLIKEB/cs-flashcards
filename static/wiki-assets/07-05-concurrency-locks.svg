<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc">
  <title id="title">07-05. 동시성 이상과 잠금 방식</title>
  <desc id="desc">갱신 손실 같은 동시성 이상이 왜 생기는지와 2PL, Timestamp, MVCC가 이를 어떻게 다르게 제어하는지 정리한 SVG</desc>
  <defs>
    <style>
      text { font-family: "Noto Sans KR", "Apple SD Gothic Neo", sans-serif; fill: #0f172a; }
      .eyebrow { font-size: 20px; font-weight: 700; letter-spacing: 0.08em; fill: #1d4ed8; }
      .title { font-size: 40px; font-weight: 800; }
      .subtitle { font-size: 22px; font-weight: 500; fill: #334155; }
      .panelTitle { font-size: 27px; font-weight: 800; }
      .cardTitle { font-size: 23px; font-weight: 800; }
      .body { font-size: 19px; font-weight: 500; fill: #334155; }
      .small { font-size: 18px; font-weight: 600; fill: #475569; }
      .em { font-weight: 800; fill: #0f172a; }
    </style>
  </defs>

  <rect width="1200" height="860" fill="#f8fafc"/>
  <rect x="28" y="28" width="1144" height="804" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <text x="72" y="86" class="eyebrow">CONCURRENCY CONTROL · PAGE 07-05</text>
  <text x="72" y="136" class="title">갱신 손실은 어떻게 막는가</text>
  <text x="72" y="174" class="subtitle">두 트랜잭션이 같은 값을 동시에 읽고 덮어쓰면 마지막 쓰기만 남는다. 제어 기법은 이 충돌을 서로 다르게 막는다.</text>

  <rect x="64" y="216" width="468" height="272" rx="24" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="96" y="260" class="panelTitle">충돌 예시: 갱신 손실</text>
  <text x="96" y="304" class="body">초기 잔액 100을 두 트랜잭션이 동시에 읽는다.</text>

  <rect x="96" y="338" width="180" height="114" rx="18" fill="#ffffff" stroke="#3b82f6" stroke-width="2"/>
  <text x="124" y="376" class="cardTitle">T1</text>
  <text x="124" y="408" class="body">읽기 100 → +20</text>
  <text x="124" y="438" class="body">쓰기 120</text>

  <rect x="320" y="338" width="180" height="114" rx="18" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>
  <text x="348" y="376" class="cardTitle">T2</text>
  <text x="348" y="408" class="body">읽기 100 → -30</text>
  <text x="348" y="438" class="body">쓰기 70</text>

  <text x="96" y="478" class="body">제어가 없으면 나중에 쓴 70만 남고 T1의 결과가 사라질 수 있다.</text>

  <rect x="556" y="216" width="580" height="272" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="588" y="260" class="panelTitle">잠금 관점</text>
  <text x="588" y="304" class="body">• <tspan class="em">공유 잠금(S)</tspan>: 읽기는 함께 허용하지만 쓰기는 막는다.</text>
  <text x="588" y="340" class="body">• <tspan class="em">배타 잠금(X)</tspan>: 한 트랜잭션만 쓰게 해 충돌 갱신을 막는다.</text>
  <text x="588" y="376" class="body">• 시험 답안은 S lock, X lock, strict 2PL을 같이 묶어 설명하면 안정적이다.</text>

  <rect x="64" y="522" width="330" height="274" rx="24" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="96" y="566" class="panelTitle">2PL</text>
  <text x="96" y="604" class="body">1) growing phase에서 lock 획득</text>
  <text x="96" y="640" class="body">2) shrinking phase에서 lock 해제</text>
  <text x="96" y="676" class="body">3) strict 2PL은 X lock을 종료까지 유지</text>
  <text x="96" y="712" class="body">→ 직렬화 가능성 보장</text>
  <text x="96" y="748" class="body">→ 롤백 전파 방지</text>

  <rect x="434" y="522" width="330" height="274" rx="24" fill="#ffffff" stroke="#64748b" stroke-width="2"/>
  <text x="466" y="566" class="panelTitle">Timestamp Ordering</text>
  <text x="466" y="604" class="body">1) 트랜잭션에 시작 시각 부여</text>
  <text x="466" y="640" class="body">2) 늦은 요청이 순서를 깨면 거절</text>
  <text x="466" y="676" class="body">3) deadlock은 없지만 롤백은 가능</text>
  <text x="466" y="712" class="body">→ lock 대기 대신 시간 순서를 강제</text>

  <rect x="804" y="522" width="332" height="274" rx="24" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
  <text x="836" y="566" class="panelTitle">MVCC</text>
  <text x="836" y="604" class="body">1) 쓰기 때 새 버전 생성</text>
  <text x="836" y="640" class="body">2) 읽기는 이전의 안정 버전 참조</text>
  <text x="836" y="676" class="body">3) 읽기-쓰기 충돌을 크게 줄임</text>
  <text x="836" y="712" class="body">→ 읽기 많은 환경에서 높은 동시성</text>
</svg>
