<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1080" viewBox="0 0 1280 1080" role="img" aria-labelledby="title desc">
  <title id="title">07-02. 정규화 분해 흐름도</title>
  <desc id="desc">주문상세원본이 1NF 확인, 2NF 분해, 3NF 분해를 거쳐 주문, 고객, 상품, 주문상세 테이블로 나뉘는 과정과 근거 함수 종속을 단계별로 설명하는 흐름도</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <style>
      .title { font: 700 34px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .subtitle { font: 500 18px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
      .section { font: 700 22px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .label { font: 700 18px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .body { font: 500 16px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
      .small { font: 600 14px 'Pretendard','Noto Sans KR',sans-serif; fill: #475569; }
      .tiny { font: 600 13px 'Pretendard','Noto Sans KR',sans-serif; fill: #475569; }
      .mono { font: 700 16px 'SFMono-Regular','Menlo',monospace; fill: #0f766e; }
      .tableTitle { font: 700 17px 'Pretendard','Noto Sans KR',sans-serif; fill: #1e293b; }
    </style>
  </defs>

  <rect width="1280" height="1080" fill="#f8fafc"/>
  <rect x="28" y="28" width="1224" height="1024" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <text class="small" x="72" y="82">데이터베이스 · 단계별 분해 예시</text>
  <text class="title" x="72" y="124">정규화 분해 흐름</text>
  <text class="subtitle" x="72" y="156">원본 테이블에서 1NF를 확인한 뒤, 부분 함수 종속을 2NF에서 제거하고 이행 함수 종속을 3NF에서 제거한다.</text>

  <rect x="72" y="198" width="1136" height="156" rx="24" fill="#f8fafc" stroke="#cbd5e1"/>
  <text class="section" x="100" y="238">시작: 주문상세원본</text>
  <text class="small" x="100" y="268">속성: 주문ID, 고객ID, 고객명, 고객등급, 상품ID, 상품명, 단가, 수량</text>
  <text class="small" x="100" y="294">후보키: (주문ID, 상품ID)</text>
  <rect x="100" y="312" width="300" height="26" rx="8" fill="#dbeafe"/>
  <text class="tiny" x="114" y="330">반복 저장: 고객 정보와 상품 정보가 주문 행마다 중복된다.</text>

  <path d="M 640 354 L 640 402" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="72" y="412" width="1136" height="152" rx="24" fill="#eff6ff" stroke="#93c5fd"/>
  <text class="section" x="100" y="452">1단계: 1NF 확인</text>
  <text class="body" x="100" y="484">모든 칸이 원자값이면 1NF를 만족한다.</text>
  <text class="body" x="100" y="512">이 예시는 이미 1NF 상태이므로 구조를 유지한 채 다음 단계로 간다.</text>
  <rect x="750" y="438" width="404" height="92" rx="18" fill="#ffffff" stroke="#bfdbfe"/>
  <text class="label" x="774" y="470">체크 문장</text>
  <text class="body" x="774" y="498">"한 칸에 값이 하나만 있으므로 1NF를 만족한다."</text>
  <text class="body" x="774" y="520">시험 답안에서는 이 한 문장으로 충분하다.</text>

  <path d="M 640 564 L 640 612" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="72" y="622" width="1136" height="230" rx="24" fill="#ecfeff" stroke="#99f6e4"/>
  <text class="section" x="100" y="662">2단계: 2NF 분해</text>
  <text class="body" x="100" y="692">복합키의 일부만으로 정해지는 속성을 떼어낸다.</text>
  <text class="mono" x="100" y="724">주문ID → 고객ID</text>
  <text class="mono" x="352" y="724">상품ID → 상품명, 단가</text>

  <rect x="100" y="748" width="180" height="74" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
  <text class="tableTitle" x="190" y="776" text-anchor="middle">주문</text>
  <text class="tiny" x="122" y="802">PK 주문ID</text>
  <text class="body" x="122" y="820">주문ID, 고객ID</text>

  <rect x="314" y="748" width="220" height="74" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
  <text class="tableTitle" x="424" y="776" text-anchor="middle">상품</text>
  <text class="tiny" x="336" y="802">PK 상품ID</text>
  <text class="body" x="336" y="820">상품ID, 상품명, 단가</text>

  <rect x="568" y="748" width="246" height="74" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
  <text class="tableTitle" x="691" y="776" text-anchor="middle">주문상세</text>
  <text class="tiny" x="590" y="802">PK 주문ID + 상품ID</text>
  <text class="body" x="590" y="820">주문ID, 상품ID, 수량</text>

  <rect x="854" y="732" width="300" height="102" rx="18" fill="#dcfce7" stroke="#86efac"/>
  <text class="label" x="878" y="764">핵심 판단</text>
  <text class="body" x="878" y="792">수량만 복합키 전체에 의존하므로</text>
  <text class="body" x="878" y="814">주문상세 테이블에 남긴다.</text>

  <path d="M 640 852 L 640 900" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="72" y="910" width="1136" height="112" rx="24" fill="#eef2ff" stroke="#c4b5fd"/>
  <text class="section" x="100" y="950">3단계: 3NF 분해</text>
  <text class="mono" x="100" y="980">주문ID → 고객ID → 고객명, 고객등급</text>
  <text class="body" x="100" y="1004">이행 함수 종속을 없애기 위해 고객 테이블을 분리하면 주문, 고객, 상품, 주문상세의 4개 테이블이 된다.</text>

  <rect x="856" y="926" width="300" height="82" rx="18" fill="#ffffff" stroke="#93c5fd"/>
  <text class="tableTitle" x="1006" y="956" text-anchor="middle">추가 분리: 고객</text>
  <text class="tiny" x="878" y="980">PK 고객ID</text>
  <text class="body" x="878" y="1000">고객ID, 고객명, 고객등급</text>
</svg>
