<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" role="img" aria-labelledby="title desc">
  <title id="title">08-01. OSI와 TCP-IP 계층 대응 개요</title>
  <desc id="desc">OSI 7계층과 TCP/IP 4계층의 대응 관계, 각 계층의 역할과 주소 단위를 비교하는 고대비 SVG</desc>
  <style>
    .title { font: 700 36px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
    .subtitle { font: 500 18px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
    .section { font: 700 24px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
    .layer { font: 700 22px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
    .label { font: 700 16px 'Pretendard','Noto Sans KR',sans-serif; fill: #1d4ed8; }
    .body { font: 500 16px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
    .note { font: 600 15px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
    .chip { font: 700 14px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
  </style>

  <rect width="1280" height="900" fill="#f8fafc"/>
  <rect x="28" y="28" width="1224" height="844" rx="30" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <text class="subtitle" x="72" y="88">네트워크 계층 대응 · 주소 단위 · 대표 프로토콜</text>
  <text class="title" x="72" y="132">OSI 7계층 ↔ TCP/IP 4계층 한눈에 보기</text>
  <text class="subtitle" x="72" y="166">OSI는 기능을 세분화해 설명하고, TCP/IP는 실무 동작 기준으로 여러 계층을 묶어 본다.</text>

  <text class="section" x="90" y="220">OSI 7계층</text>
  <text class="section" x="856" y="220">TCP/IP 4계층</text>

  <g transform="translate(72 240)">
    <rect x="0" y="0" width="456" height="522" rx="28" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>

    <g>
      <rect x="24" y="24" width="408" height="56" rx="18" fill="#dbeafe" stroke="#3b82f6"/>
      <text class="layer" x="44" y="58">7 응용</text>
      <text class="body" x="168" y="58">HTTP, DNS, SMTP, TLS</text>
    </g>

    <g>
      <rect x="24" y="92" width="408" height="56" rx="18" fill="#dbeafe" stroke="#3b82f6"/>
      <text class="layer" x="44" y="126">6 표현</text>
      <text class="body" x="168" y="126">인코딩, 압축, 암호화</text>
    </g>

    <g>
      <rect x="24" y="160" width="408" height="56" rx="18" fill="#dbeafe" stroke="#3b82f6"/>
      <text class="layer" x="44" y="194">5 세션</text>
      <text class="body" x="168" y="194">대화 연결, 동기화</text>
    </g>

    <g>
      <rect x="24" y="232" width="408" height="68" rx="18" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
      <text class="layer" x="44" y="270">4 전송</text>
      <text class="body" x="168" y="258">TCP, UDP, 포트 기반 프로세스 전달</text>
      <text class="label" x="168" y="282">주소 단위: Port / segment</text>
    </g>

    <g>
      <rect x="24" y="314" width="408" height="68" rx="18" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
      <text class="layer" x="44" y="352">3 네트워크</text>
      <text class="body" x="168" y="340">IP, ICMP, router, TTL</text>
      <text class="label" x="168" y="364">주소 단위: IP / packet</text>
    </g>

    <g>
      <rect x="24" y="396" width="408" height="68" rx="18" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
      <text class="layer" x="44" y="434">2 데이터링크</text>
      <text class="body" x="168" y="422">Ethernet, switch, ARP, CRC</text>
      <text class="label" x="168" y="446">주소 단위: MAC / frame</text>
    </g>

    <g>
      <rect x="24" y="478" width="408" height="44" rx="18" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
      <text class="layer" x="44" y="507">1 물리</text>
      <text class="body" x="168" y="507">bit 전송, 케이블과 신호</text>
    </g>
  </g>

  <g transform="translate(752 240)">
    <rect x="0" y="0" width="456" height="522" rx="28" fill="#ecfeff" stroke="#14b8a6" stroke-width="2"/>

    <g>
      <rect x="24" y="24" width="408" height="132" rx="18" fill="#ccfbf1" stroke="#0f766e" stroke-width="2"/>
      <text class="layer" x="44" y="58">응용</text>
      <text class="body" x="44" y="88">OSI 7, 6, 5를 실무적으로 묶는다.</text>
      <text class="body" x="44" y="114">사용자 서비스, 이름 해석, 보안 처리</text>
      <text class="label" x="44" y="140">주소 단위: 메시지, URL, 도메인</text>
      <rect x="306" y="36" width="102" height="28" rx="14" fill="#ffffff" stroke="#0f766e"/>
      <text class="chip" x="357" y="55" text-anchor="middle">HTTP·DNS</text>
    </g>

    <g>
      <rect x="24" y="180" width="408" height="92" rx="18" fill="#99f6e4" stroke="#0f766e" stroke-width="2"/>
      <text class="layer" x="44" y="216">전송</text>
      <text class="body" x="44" y="242">종단 간 신뢰성, 포트 식별, 재전송</text>
      <text class="label" x="44" y="266">주소 단위: Port / segment</text>
      <rect x="318" y="198" width="90" height="28" rx="14" fill="#ffffff" stroke="#0f766e"/>
      <text class="chip" x="363" y="217" text-anchor="middle">TCP·UDP</text>
    </g>

    <g>
      <rect x="24" y="296" width="408" height="92" rx="18" fill="#99f6e4" stroke="#0f766e" stroke-width="2"/>
      <text class="layer" x="44" y="332">인터넷</text>
      <text class="body" x="44" y="358">IP 주소 기반 라우팅과 ICMP 진단</text>
      <text class="label" x="44" y="382">주소 단위: IP / packet</text>
      <rect x="330" y="314" width="78" height="28" rx="14" fill="#ffffff" stroke="#0f766e"/>
      <text class="chip" x="369" y="333" text-anchor="middle">IP·ICMP</text>
    </g>

    <g>
      <rect x="24" y="412" width="408" height="110" rx="18" fill="#99f6e4" stroke="#0f766e" stroke-width="2"/>
      <text class="layer" x="44" y="448">링크</text>
      <text class="body" x="44" y="474">OSI 2, 1을 묶어 프레임 전달과 신호 전송 담당</text>
      <text class="body" x="44" y="500">같은 네트워크에서 MAC 주소로 전달</text>
      <text class="label" x="44" y="526">주소 단위: frame, bit</text>
      <rect x="298" y="430" width="110" height="28" rx="14" fill="#ffffff" stroke="#0f766e"/>
      <text class="chip" x="353" y="449" text-anchor="middle">Ethernet</text>
    </g>
  </g>

  <g>
    <line x1="548" y1="330" x2="736" y2="330" stroke="#0f766e" stroke-width="4"/>
    <polygon points="736,330 718,322 718,338" fill="#0f766e"/>
    <text class="note" x="642" y="316" text-anchor="middle">OSI 7·6·5 → TCP/IP 응용</text>

    <line x1="548" y1="506" x2="736" y2="506" stroke="#0f766e" stroke-width="4"/>
    <polygon points="736,506 718,498 718,514" fill="#0f766e"/>
    <text class="note" x="642" y="492" text-anchor="middle">전송 계층은 1:1 대응</text>

    <line x1="548" y1="588" x2="736" y2="588" stroke="#0f766e" stroke-width="4"/>
    <polygon points="736,588 718,580 718,596" fill="#0f766e"/>
    <text class="note" x="642" y="574" text-anchor="middle">네트워크 = 인터넷</text>

    <line x1="548" y1="686" x2="736" y2="686" stroke="#0f766e" stroke-width="4"/>
    <polygon points="736,686 718,678 718,694" fill="#0f766e"/>
    <text class="note" x="642" y="672" text-anchor="middle">데이터링크 + 물리 = 링크</text>
  </g>

  <g transform="translate(72 790)">
    <rect x="0" y="0" width="1136" height="56" rx="20" fill="#f8fafc" stroke="#cbd5e1"/>
    <text class="note" x="24" y="35">시험 포인트: 링크는 ARP로 IP→MAC을 해석하고, 인터넷은 TTL·ICMP, 전송은 포트·신뢰성 제어를 중심으로 구분한다.</text>
  </g>
</svg>
