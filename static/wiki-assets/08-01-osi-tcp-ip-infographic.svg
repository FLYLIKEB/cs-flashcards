<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">08-01. OSI와 TCP-IP 계층 대응 인포그래픽</title>
  <desc id="desc">OSI 7계층과 TCP/IP 4계층의 대응 관계, 주소 단위, 대표 프로토콜과 캡슐화 흐름을 한눈에 보여주는 SVG</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#ecfeff"/>
    </linearGradient>
    <linearGradient id="osiGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="tcpGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ccfbf1"/>
      <stop offset="100%" stop-color="#99f6e4"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
    </marker>
    <style>
      .title { font: 700 34px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .subtitle { font: 500 17px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
      .section { font: 700 20px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .layer { font: 700 18px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .body { font: 500 15px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
      .small { font: 600 13px 'Pretendard','Noto Sans KR',sans-serif; fill: #475569; }
      .mini { font: 700 12px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .chip { font: 700 12px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
    </style>
  </defs>

  <rect width="1200" height="720" fill="#f8fafc"/>
  <rect x="26" y="26" width="1148" height="668" rx="28" fill="url(#bg)" stroke="#cbd5e1"/>

  <text class="small" x="70" y="76">네트워크 계층 암기 포인트 · 주소 단위 · 캡슐화</text>
  <text class="title" x="70" y="118">OSI 7계층 ↔ TCP/IP 4계층 대응</text>
  <text class="subtitle" x="70" y="150">OSI는 기능을 7단계로 세분화하고, TCP/IP는 실무적으로 이를 4개 층으로 묶어 본다.</text>

  <text class="section" x="96" y="198">OSI 7계층</text>
  <text class="section" x="825" y="198">TCP/IP 모델</text>

  <g transform="translate(80 210)">
    <rect x="0" y="0" width="340" height="392" rx="26" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
    <g>
      <rect x="22" y="22" width="296" height="44" rx="14" fill="#dbeafe" stroke="#60a5fa"/>
      <text class="layer" x="42" y="50">7 응용</text>
      <text class="body" x="140" y="50">HTTP · DNS · SMTP · TLS</text>

      <rect x="22" y="74" width="296" height="44" rx="14" fill="#dbeafe" stroke="#60a5fa"/>
      <text class="layer" x="42" y="102">6 표현</text>
      <text class="body" x="140" y="102">인코딩 · 압축 · 암호화</text>

      <rect x="22" y="126" width="296" height="44" rx="14" fill="#dbeafe" stroke="#60a5fa"/>
      <text class="layer" x="42" y="154">5 세션</text>
      <text class="body" x="140" y="154">대화 연결 · 동기화</text>

      <rect x="22" y="178" width="296" height="52" rx="14" fill="#bfdbfe" stroke="#3b82f6"/>
      <text class="layer" x="42" y="208">4 전송</text>
      <text class="body" x="140" y="208">TCP · UDP · 3-way handshake</text>
      <rect x="240" y="190" width="62" height="24" rx="12" fill="#eff6ff"/>
      <text class="chip" x="271" y="207" text-anchor="middle">Port</text>

      <rect x="22" y="238" width="296" height="52" rx="14" fill="#bfdbfe" stroke="#3b82f6"/>
      <text class="layer" x="42" y="268">3 네트워크</text>
      <text class="body" x="140" y="268">IP · ICMP · router · TTL</text>
      <rect x="246" y="250" width="56" height="24" rx="12" fill="#eff6ff"/>
      <text class="chip" x="274" y="267" text-anchor="middle">IP</text>

      <rect x="22" y="298" width="296" height="52" rx="14" fill="#bfdbfe" stroke="#3b82f6"/>
      <text class="layer" x="42" y="328">2 데이터링크</text>
      <text class="body" x="140" y="328">Ethernet · switch · ARP · CRC</text>
      <rect x="236" y="310" width="66" height="24" rx="12" fill="#eff6ff"/>
      <text class="chip" x="269" y="327" text-anchor="middle">MAC</text>

      <rect x="22" y="358" width="296" height="22" rx="11" fill="#bfdbfe" stroke="#3b82f6"/>
      <text class="layer" x="42" y="374">1 물리</text>
      <text class="body" x="140" y="374">bit 전송</text>
    </g>
  </g>

  <g transform="translate(780 210)">
    <rect x="0" y="0" width="340" height="392" rx="26" fill="#ffffff" stroke="#5eead4" stroke-width="2"/>
    <rect x="22" y="22" width="296" height="148" rx="18" fill="url(#tcpGrad)" stroke="#14b8a6" stroke-width="2"/>
    <text class="layer" x="44" y="54">응용</text>
    <text class="body" x="44" y="84">OSI 7·6·5를 통합</text>
    <text class="body" x="44" y="112">사용자 서비스와 이름 해석</text>
    <text class="body" x="44" y="140">HTTP · DNS · SMTP · TLS</text>
    <rect x="246" y="36" width="54" height="24" rx="12" fill="#f0fdfa"/>
    <text class="chip" x="273" y="53" text-anchor="middle">메시지</text>

    <rect x="22" y="186" width="296" height="64" rx="18" fill="url(#tcpGrad)" stroke="#14b8a6" stroke-width="2"/>
    <text class="layer" x="44" y="220">전송</text>
    <text class="body" x="44" y="242">종단 간 신뢰성 · 포트 식별</text>
    <rect x="246" y="200" width="54" height="24" rx="12" fill="#f0fdfa"/>
    <text class="chip" x="273" y="217" text-anchor="middle">세그먼트</text>

    <rect x="22" y="266" width="296" height="64" rx="18" fill="url(#tcpGrad)" stroke="#14b8a6" stroke-width="2"/>
    <text class="layer" x="44" y="300">인터넷</text>
    <text class="body" x="44" y="322">IP 주소 · 라우팅 · ICMP</text>
    <rect x="246" y="280" width="54" height="24" rx="12" fill="#f0fdfa"/>
    <text class="chip" x="273" y="297" text-anchor="middle">패킷</text>

    <rect x="22" y="346" width="296" height="34" rx="17" fill="url(#tcpGrad)" stroke="#14b8a6" stroke-width="2"/>
    <text class="layer" x="44" y="369">링크</text>
    <text class="body" x="118" y="369">OSI 2·1 통합, frame·bit</text>
  </g>

  <g>
    <path d="M 442 254 C 560 254, 640 254, 758 254" fill="none" stroke="#0f766e" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M 442 388 C 560 388, 640 388, 758 388" fill="none" stroke="#0f766e" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M 442 448 C 560 448, 640 468, 758 468" fill="none" stroke="#0f766e" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M 442 536 C 560 536, 640 548, 758 556" fill="none" stroke="#0f766e" stroke-width="4" marker-end="url(#arrow)"/>
    <text class="mini" x="598" y="245" text-anchor="middle">세션·표현·응용이 하나로</text>
    <text class="mini" x="598" y="378" text-anchor="middle">전송 계층은 1:1 대응</text>
    <text class="mini" x="598" y="458" text-anchor="middle">네트워크 = 인터넷</text>
    <text class="mini" x="598" y="548" text-anchor="middle">데이터링크+물리 = 링크</text>
  </g>

  <g transform="translate(72 620)">
    <rect x="0" y="0" width="1056" height="64" rx="20" fill="#ffffff" stroke="#cbd5e1"/>
    <text class="section" x="24" y="28">캡슐화 흐름</text>
    <rect x="160" y="16" width="132" height="32" rx="16" fill="#e0f2fe" stroke="#38bdf8"/>
    <text class="mini" x="226" y="37" text-anchor="middle">메시지</text>
    <path d="M 292 32 H 350" fill="none" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="350" y="16" width="164" height="32" rx="16" fill="#dcfce7" stroke="#22c55e"/>
    <text class="mini" x="432" y="37" text-anchor="middle">세그먼트 + Port</text>
    <path d="M 514 32 H 572" fill="none" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="572" y="16" width="154" height="32" rx="16" fill="#fef3c7" stroke="#f59e0b"/>
    <text class="mini" x="649" y="37" text-anchor="middle">패킷 + IP + TTL</text>
    <path d="M 726 32 H 784" fill="none" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="784" y="16" width="170" height="32" rx="16" fill="#fee2e2" stroke="#ef4444"/>
    <text class="mini" x="869" y="37" text-anchor="middle">프레임 + MAC + CRC</text>
    <path d="M 954 32 H 1012" fill="none" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow)"/>
    <text class="mini" x="1032" y="37">bit 전송</text>
    <circle cx="320" cy="32" r="6" fill="#14b8a6">
      <animate attributeName="cx" values="320;1002;320" dur="7s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g>
    <rect x="468" y="190" width="248" height="108" rx="18" fill="#ffffff" stroke="#99f6e4"/>
    <text class="section" x="490" y="220">시험 암기 포인트</text>
    <text class="body" x="490" y="248">• 링크: ARP로 IP→MAC 해석</text>
    <text class="body" x="490" y="272">• 인터넷: TTL 0이면 ICMP Time Exceeded</text>
  </g>
</svg>