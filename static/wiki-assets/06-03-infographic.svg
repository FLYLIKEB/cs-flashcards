<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">06-03 동기화와 교착상태 인포그래픽</title>
  <desc id="desc">임계구역 보호 방식, 교착상태의 네 가지 필요조건, 그리고 예방·회피·탐지 및 복구 전략을 한 장에 요약한 SVG</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="lockGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="warnGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f97316"/>
    </marker>
    <style>
      text { font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
      .title { font-size: 35px; font-weight: 800; fill: #0f172a; }
      .subtitle { font-size: 16px; font-weight: 500; fill: #334155; }
      .section { font-size: 20px; font-weight: 800; fill: #0f172a; }
      .cardTitle { font-size: 17px; font-weight: 800; fill: #0f172a; }
      .body { font-size: 14px; font-weight: 500; fill: #334155; }
      .tiny { font-size: 12px; font-weight: 600; fill: #475569; }
      .inv { fill: #ffffff; font-size: 15px; font-weight: 800; }
    </style>
  </defs>

  <rect width="1200" height="720" fill="url(#bg)"/>
  <rect x="28" y="28" width="1144" height="664" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <text x="70" y="88" class="title">06-03. 동기화와 교착상태</text>
  <text x="70" y="120" class="subtitle">공유 자원 보호 → 임계구역 통제 → 교착 네 조건 확인 → 예방·회피·복구 전략 선택</text>

  <rect x="60" y="150" width="500" height="228" rx="24" fill="#f8fafc" stroke="#bfdbfe" stroke-width="2"/>
  <text x="84" y="185" class="section">1) 임계구역과 동기화 도구</text>
  <text x="84" y="210" class="body">동시에 접근하면 데이터가 깨지는 공유 자원은 한 번에 통제된 수만 진입해야 한다.</text>

  <rect x="88" y="238" width="120" height="92" rx="18" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="148" y="272" text-anchor="middle" class="cardTitle">Race</text>
  <text x="148" y="292" text-anchor="middle" class="body">둘 이상이</text>
  <text x="148" y="311" text-anchor="middle" class="body">같이 수정</text>

  <rect x="248" y="226" width="132" height="116" rx="20" fill="url(#lockGrad)"/>
  <rect x="292" y="246" width="44" height="34" rx="8" fill="none" stroke="#ffffff" stroke-width="4"/>
  <path d="M303 246 v-10 a11 11 0 0 1 22 0 v10" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>
  <text x="314" y="304" text-anchor="middle" class="inv">Mutex</text>
  <text x="314" y="324" text-anchor="middle" class="inv">1개 스레드만</text>

  <rect x="420" y="238" width="116" height="92" rx="18" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="478" y="272" text-anchor="middle" class="cardTitle">Semaphore</text>
  <text x="478" y="292" text-anchor="middle" class="body">카운터 &gt; 0</text>
  <text x="478" y="311" text-anchor="middle" class="body">면 진입</text>

  <line x1="208" y1="284" x2="248" y2="284" stroke="#ef4444" stroke-width="4" marker-end="url(#arrowBlue)"/>
  <line x1="380" y1="284" x2="420" y2="284" stroke="#2563eb" stroke-width="4" marker-end="url(#arrowBlue)"/>

  <rect x="88" y="344" width="448" height="22" rx="11" fill="#e2e8f0"/>
  <rect x="88" y="344" width="120" height="22" rx="11" fill="#2563eb">
    <animate attributeName="x" values="88;248;416;248;88" dur="7s" repeatCount="indefinite"/>
  </rect>
  <text x="88" y="392" class="tiny">임계구역 직관: 잠금/카운터가 없으면 경쟁 상태, 있으면 진입 순서가 제어된다.</text>

  <rect x="590" y="150" width="550" height="390" rx="24" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <text x="614" y="185" class="section">2) 교착상태: 서로 쥔 채 서로 기다리는 원형 대기</text>
  <text x="614" y="210" class="body">네 조건이 동시에 만족되면 프로세스/스레드는 영원히 진행하지 못할 수 있다.</text>

  <circle cx="760" cy="305" r="58" fill="#ffffff" stroke="#f97316" stroke-width="4"/>
  <text x="760" y="300" text-anchor="middle" class="cardTitle">P1</text>
  <text x="760" y="320" text-anchor="middle" class="body">Printer 보유</text>

  <circle cx="970" cy="305" r="58" fill="#ffffff" stroke="#f97316" stroke-width="4"/>
  <text x="970" y="300" text-anchor="middle" class="cardTitle">P2</text>
  <text x="970" y="320" text-anchor="middle" class="body">Scanner 보유</text>

  <path d="M818 282 C865 245 915 245 912 282" fill="none" stroke="#f97316" stroke-width="5" marker-end="url(#arrowOrange)"/>
  <path d="M912 328 C865 365 815 365 818 328" fill="none" stroke="#ef4444" stroke-width="5" marker-end="url(#arrowOrange)"/>
  <text x="865" y="250" text-anchor="middle" class="tiny">P1은 Scanner를 기다림</text>
  <text x="865" y="392" text-anchor="middle" class="tiny">P2는 Printer를 기다림</text>

  <rect x="634" y="408" width="112" height="92" rx="18" fill="#ffffff" stroke="#fb923c" stroke-width="2"/>
  <text x="690" y="438" text-anchor="middle" class="cardTitle">상호배제</text>
  <text x="690" y="459" text-anchor="middle" class="body">동시 사용</text>
  <text x="690" y="478" text-anchor="middle" class="body">불가</text>

  <rect x="768" y="408" width="112" height="92" rx="18" fill="#ffffff" stroke="#fb923c" stroke-width="2"/>
  <text x="824" y="438" text-anchor="middle" class="cardTitle">점유-대기</text>
  <text x="824" y="459" text-anchor="middle" class="body">쥔 채</text>
  <text x="824" y="478" text-anchor="middle" class="body">추가 요청</text>

  <rect x="902" y="408" width="112" height="92" rx="18" fill="#ffffff" stroke="#fb923c" stroke-width="2"/>
  <text x="958" y="438" text-anchor="middle" class="cardTitle">비선점</text>
  <text x="958" y="459" text-anchor="middle" class="body">강제로</text>
  <text x="958" y="478" text-anchor="middle" class="body">뺏지 못함</text>

  <rect x="1036" y="408" width="82" height="92" rx="18" fill="#ffffff" stroke="#fb923c" stroke-width="2"/>
  <text x="1077" y="438" text-anchor="middle" class="cardTitle">순환</text>
  <text x="1077" y="459" text-anchor="middle" class="body">대기</text>
  <text x="1077" y="478" text-anchor="middle" class="body">고리</text>

  <rect x="60" y="404" width="500" height="250" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="84" y="439" class="section">3) 해결 전략 비교</text>

  <rect x="88" y="462" width="214" height="74" rx="16" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text x="108" y="490" class="cardTitle">예방 Prevention</text>
  <text x="108" y="511" class="body">점유-대기 제거, 자원 순서 고정처럼</text>
  <text x="108" y="530" class="body">네 조건 중 하나를 깨서 발생 자체를 막음</text>

  <rect x="316" y="462" width="216" height="74" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="336" y="490" class="cardTitle">회피 Avoidance</text>
  <text x="336" y="511" class="body">Banker: 할당 후에도 safe state인지</text>
  <text x="336" y="530" class="body">확인하고 unsafe 가능성이면 거부</text>

  <rect x="88" y="552" width="214" height="74" rx="16" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="108" y="580" class="cardTitle">탐지·복구</text>
  <text x="108" y="601" class="body">주기적으로 그래프/상태를 보고</text>
  <text x="108" y="620" class="body">프로세스 종료·롤백·자원 회수</text>

  <rect x="316" y="552" width="216" height="74" rx="16" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text x="336" y="580" class="cardTitle">무시 Ostrich</text>
  <text x="336" y="601" class="body">드물고 비용이 크면 감수하되</text>
  <text x="336" y="620" class="body">실무에선 설계 변경과 함께 검토</text>

  <line x1="560" y1="517" x2="590" y2="517" stroke="#94a3b8" stroke-width="3"/>
  <polygon points="590,517 580,511 580,523" fill="#94a3b8"/>
  <rect x="606" y="560" width="510" height="72" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="630" y="589" class="cardTitle">Safe vs Unsafe</text>
  <text x="630" y="611" class="body">Safe state는 어떤 완료 순서를 찾아 모두 끝낼 수 있는 상태, unsafe는 즉시 deadlock은 아니지만 위험해서 할당을 보수적으로 거부한다.</text>

  <text x="70" y="680" class="tiny">asset: static/wiki-assets/06-03-infographic.svg</text>
</svg>
