<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">06-03 교착상태 조건과 대응 전략</title>
  <desc id="desc">교착상태의 네 가지 필요조건, 원형 대기 예시, 그리고 예방·회피·탐지 및 복구 전략을 구분해 설명하는 SVG</desc>
  <defs>
    <style>
      text { font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; fill: #0f172a; }
      .title { font-size: 34px; font-weight: 800; }
      .subtitle { font-size: 17px; font-weight: 500; fill: #334155; }
      .section { font-size: 22px; font-weight: 800; }
      .cardTitle { font-size: 21px; font-weight: 800; }
      .body { font-size: 18px; font-weight: 500; fill: #334155; }
      .small { font-size: 16px; font-weight: 500; fill: #475569; }
      .tiny { font-size: 14px; font-weight: 500; fill: #64748b; }
      .white { fill: #ffffff; }
    </style>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ea580c"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#dc2626"/>
    </marker>
  </defs>

  <rect width="1200" height="900" fill="#f8fafc"/>
  <rect x="28" y="28" width="1144" height="844" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <text x="70" y="88" class="title">06-03. 교착상태: 네 조건이 겹치면 서로 기다리다 멈춘다</text>
  <text x="70" y="120" class="subtitle">핵심은 “어떤 조건을 끊으면 교착을 막을 수 있는가”다. 발생 조건과 대응 전략을 따로 외우면 문제 풀이가 쉬워진다.</text>

  <rect x="70" y="160" width="500" height="308" rx="24" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <text x="96" y="202" class="section">1) 원형 대기 직관</text>
  <text x="96" y="232" class="body">프로세스가 자원을 쥔 채 추가 자원을 기다리고,</text>
  <text x="96" y="258" class="body">상대도 같은 방식으로 기다리면 진행이 멈춘다.</text>

  <circle cx="220" cy="336" r="72" fill="#ffffff" stroke="#ea580c" stroke-width="4"/>
  <text x="220" y="328" text-anchor="middle" class="cardTitle">P1</text>
  <text x="220" y="354" text-anchor="middle" class="small">Printer 보유</text>

  <circle cx="420" cy="336" r="72" fill="#ffffff" stroke="#ea580c" stroke-width="4"/>
  <text x="420" y="328" text-anchor="middle" class="cardTitle">P2</text>
  <text x="420" y="354" text-anchor="middle" class="small">Scanner 보유</text>

  <path d="M289 300 C334 262 378 262 349 300" fill="none" stroke="#ea580c" stroke-width="5" marker-end="url(#arrowOrange)"/>
  <text x="318" y="266" text-anchor="middle" class="small">P1은 Scanner 요청</text>
  <path d="M351 372 C307 410 262 410 289 372" fill="none" stroke="#dc2626" stroke-width="5" marker-end="url(#arrowRed)"/>
  <text x="324" y="438" text-anchor="middle" class="small">P2는 Printer 요청</text>

  <rect x="96" y="390" width="448" height="52" rx="16" fill="#ffffff" stroke="#fed7aa" stroke-width="2"/>
  <text x="120" y="422" class="body">서로가 가진 자원을 놓지 않으면 두 프로세스 모두 완료 지점으로 가지 못한다.</text>

  <rect x="610" y="160" width="520" height="308" rx="24" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
  <text x="636" y="202" class="section">2) 교착상태의 4가지 필요조건</text>
  <text x="636" y="232" class="body">아래 네 조건이 모두 참일 때만 deadlock이 성립한다.</text>

  <rect x="636" y="264" width="224" height="74" rx="18" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="662" y="294" class="cardTitle">상호배제</text>
  <text x="662" y="320" class="small">한 자원을 동시에 함께 쓸 수 없다.</text>

  <rect x="882" y="264" width="224" height="74" rx="18" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="908" y="294" class="cardTitle">점유-대기</text>
  <text x="908" y="320" class="small">이미 쥔 채로 다른 자원을 더 기다린다.</text>

  <rect x="636" y="356" width="224" height="74" rx="18" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="662" y="386" class="cardTitle">비선점</text>
  <text x="662" y="412" class="small">강제로 빼앗지 못하고 자발적 반납만 가능하다.</text>

  <rect x="882" y="356" width="224" height="74" rx="18" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
  <text x="908" y="386" class="cardTitle">순환대기</text>
  <text x="908" y="412" class="small">프로세스들이 원형 고리로 서로를 기다린다.</text>

  <rect x="70" y="500" width="1060" height="302" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text x="96" y="542" class="section">3) 대응 전략 비교</text>
  <text x="96" y="572" class="body">문제 풀이 포인트는 “언제 막고, 언제 허용하고, 언제 사후 처리하는가”를 구분하는 것이다.</text>

  <rect x="96" y="606" width="238" height="138" rx="20" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="122" y="640" class="cardTitle">예방 Prevention</text>
  <text x="122" y="668" class="small">락 순서 고정, 일괄 요청처럼</text>
  <text x="122" y="692" class="small">네 조건 중 하나를 미리 깨서</text>
  <text x="122" y="716" class="small">발생 자체를 차단한다.</text>

  <rect x="356" y="606" width="238" height="138" rx="20" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="382" y="640" class="cardTitle">회피 Avoidance</text>
  <text x="382" y="668" class="small">Banker처럼 자원 할당 전후를 계산해</text>
  <text x="382" y="692" class="small">safe state면 허용, unsafe 위험이면</text>
  <text x="382" y="716" class="small">보수적으로 거부한다.</text>

  <rect x="616" y="606" width="238" height="138" rx="20" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <text x="642" y="640" class="cardTitle">탐지 + 복구</text>
  <text x="642" y="668" class="small">그래프/대기 상태를 주기적으로 검사하고</text>
  <text x="642" y="692" class="small">사이클이 보이면 종료, 롤백, 자원 선점으로</text>
  <text x="642" y="716" class="small">교착을 해소한다.</text>

  <rect x="876" y="606" width="230" height="138" rx="20" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
  <text x="902" y="640" class="cardTitle">무시 Ostrich</text>
  <text x="902" y="668" class="small">발생 빈도는 낮고 회피 비용이 너무 크면</text>
  <text x="902" y="692" class="small">감수하기도 하지만, 시험 답안에서는</text>
  <text x="902" y="716" class="small">한계와 위험을 함께 적는다.</text>

  <rect x="96" y="760" width="1010" height="24" rx="12" fill="#e2e8f0"/>
  <rect x="96" y="760" width="506" height="24" rx="12" fill="#2563eb"/>
  <text x="96" y="794" class="tiny">Safe state: 완료 가능한 순서를 찾을 수 있음 / Unsafe state: 즉시 deadlock은 아니지만 위험해 추가 할당을 거절할 수 있음</text>

  <text x="70" y="844" class="tiny">asset: static/wiki-assets/06-03-infographic.svg</text>
</svg>
