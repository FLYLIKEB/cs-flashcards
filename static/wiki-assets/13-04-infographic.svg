<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
  <title id="title">13-04. 빈출 코드 출력 문제 인포그래픽</title>
  <desc id="desc">코드 출력 문제에서 스코프, 값 복사, 추적표, 재귀 출력 순서, 시험장 체크 순서를 분리해서 읽기 쉽게 정리한 인포그래픽</desc>
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#134e4a" />
    </linearGradient>
    <style>
      text { font-family: "Noto Sans KR", "Apple SD Gothic Neo", sans-serif; }
      .title { font-size: 34px; font-weight: 800; fill: #f8fafc; }
      .subtitle { font-size: 17px; font-weight: 500; fill: #dbeafe; }
      .section { font-size: 23px; font-weight: 800; fill: #0f172a; }
      .label { font-size: 17px; font-weight: 700; fill: #0f172a; }
      .body { font-size: 15px; font-weight: 500; fill: #334155; }
      .tiny { font-size: 13px; font-weight: 700; fill: #475569; }
      .mono { font-family: "SFMono-Regular", Consolas, monospace; font-size: 16px; font-weight: 600; fill: #e2e8f0; }
      .monoDark { font-family: "SFMono-Regular", Consolas, monospace; font-size: 15px; font-weight: 600; fill: #0f172a; }
      .chip { font-size: 14px; font-weight: 700; fill: #134e4a; }
      .white { fill: #ffffff; }
    </style>
  </defs>

  <rect width="1200" height="900" fill="#f8fafc" />
  <rect x="32" y="28" width="1136" height="844" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" />
  <rect x="32" y="28" width="1136" height="116" rx="28" fill="url(#header)" />
  <rect x="32" y="108" width="1136" height="36" fill="url(#header)" />

  <text class="title" x="70" y="82">13-04. 빈출 코드 출력 문제</text>
  <text class="subtitle" x="70" y="114">정답은 감이 아니라 실행 추적에서 나온다: 스코프 구분, 값 복사 확인, 출력 시점 마킹</text>

  <rect x="66" y="170" width="310" height="240" rx="20" fill="#f8fafc" stroke="#cbd5e1" />
  <text class="section" x="90" y="208">1. 먼저 보는 핵심 신호</text>
  <rect x="90" y="226" width="262" height="42" rx="12" fill="#ccfbf1" />
  <text class="label" x="108" y="253">전역/지역 이름이 같으면 따로 적기</text>
  <rect x="90" y="278" width="262" height="42" rx="12" fill="#dbeafe" />
  <text class="label" x="108" y="305">함수 인자는 복사인지 참조인지 확인</text>
  <rect x="90" y="330" width="262" height="42" rx="12" fill="#fde68a" />
  <text class="label" x="108" y="357">++ 위치와 반복 경계를 먼저 표시</text>
  <text class="body" x="90" y="392">• 반복문은 변수표, 재귀는 호출 스택을 그린다.</text>
  <text class="body" x="90" y="416">• 출력문이 호출 전인지 후인지 따로 동그라미 친다.</text>

  <rect x="398" y="170" width="370" height="240" rx="20" fill="#f8fafc" stroke="#cbd5e1" />
  <text class="section" x="422" y="208">2. 스코프 + 값 복사 예제</text>
  <rect x="422" y="224" width="322" height="102" rx="14" fill="#0f172a" />
  <text class="tiny" x="442" y="248" fill="#93c5fd">C 코드</text>
  <text class="mono" x="442" y="274">int x = 1;</text>
  <text class="mono" x="442" y="296">void f(int a) { a++; x += a; }</text>
  <text class="mono" x="442" y="318">int main() { int x = 3; f(x); printf("%d", x); }</text>
  <text class="body" x="422" y="356">• main의 x=3은 지역 변수, 파일 위 x=1은 전역 변수</text>
  <text class="body" x="422" y="380">• a는 3의 복사본이라 a++이 main의 x를 바꾸지 못함</text>
  <text class="body" x="422" y="404">• 전역 x는 5가 되지만 printf는 지역 x를 읽어 3을 출력</text>

  <rect x="790" y="170" width="344" height="240" rx="20" fill="#f8fafc" stroke="#cbd5e1" />
  <text class="section" x="814" y="208">3. 재귀는 두 줄로 분리</text>
  <rect x="814" y="224" width="296" height="104" rx="14" fill="#082f49" />
  <text class="tiny" x="834" y="248" fill="#bae6fd">Python 코드</text>
  <text class="mono" x="834" y="274">def g(n):</text>
  <text class="mono" x="850" y="296">if n == 0: return 1</text>
  <text class="mono" x="850" y="318">print(n); return n * g(n-1)</text>
  <text class="body" x="814" y="356">호출하며 출력: 3 → 2 → 1</text>
  <text class="body" x="814" y="380">반환하며 계산: g(1)=1, g(2)=2, g(3)=6</text>
  <text class="body" x="814" y="404">마지막 출력: print(g(3)) = 6</text>

  <rect x="66" y="436" width="522" height="250" rx="20" fill="#f8fafc" stroke="#cbd5e1" />
  <text class="section" x="90" y="474">4. 손으로 적는 추적표</text>
  <rect x="90" y="494" width="474" height="38" rx="10" fill="#e2e8f0" />
  <text class="label" x="112" y="519">line</text>
  <text class="label" x="190" y="519">local x / a</text>
  <text class="label" x="334" y="519">global x</text>
  <text class="label" x="450" y="519">output</text>
  <rect x="90" y="538" width="474" height="36" fill="#ffffff" stroke="#dbe4ee" />
  <text class="monoDark" x="112" y="562">main</text>
  <text class="monoDark" x="190" y="562">x = 3</text>
  <text class="monoDark" x="334" y="562">1</text>
  <text class="monoDark" x="450" y="562">-</text>
  <rect x="90" y="574" width="474" height="36" fill="#f8fafc" stroke="#dbe4ee" />
  <text class="monoDark" x="112" y="598">f(x)</text>
  <text class="monoDark" x="190" y="598">a = 3</text>
  <text class="monoDark" x="334" y="598">1</text>
  <text class="monoDark" x="450" y="598">-</text>
  <rect x="90" y="610" width="474" height="36" fill="#ffffff" stroke="#dbe4ee" />
  <text class="monoDark" x="112" y="634">a++</text>
  <text class="monoDark" x="190" y="634">a = 4</text>
  <text class="monoDark" x="334" y="634">1</text>
  <text class="monoDark" x="450" y="634">-</text>
  <rect x="90" y="646" width="474" height="36" fill="#f8fafc" stroke="#dbe4ee" />
  <text class="monoDark" x="112" y="670">x += a</text>
  <text class="monoDark" x="190" y="670">a = 4</text>
  <text class="monoDark" x="334" y="670">5</text>
  <text class="monoDark" x="450" y="670">-</text>
  <text class="body" x="90" y="706">정답 포인트: 지역 x와 전역 x를 같은 칸에 쓰지 말고 분리한다.</text>

  <rect x="610" y="436" width="524" height="250" rx="20" fill="#f8fafc" stroke="#cbd5e1" />
  <text class="section" x="634" y="474">5. 재귀는 호출선과 출력선을 분리</text>
  <line x1="710" y1="520" x2="710" y2="642" stroke="#0f766e" stroke-width="5" stroke-linecap="round" />
  <rect x="662" y="506" width="96" height="34" rx="10" fill="#ccfbf1" stroke="#0f766e" />
  <text class="label" x="710" y="529" text-anchor="middle">g(3)</text>
  <rect x="662" y="550" width="96" height="34" rx="10" fill="#dbeafe" stroke="#2563eb" />
  <text class="label" x="710" y="573" text-anchor="middle">g(2)</text>
  <rect x="662" y="594" width="96" height="34" rx="10" fill="#e9d5ff" stroke="#8b5cf6" />
  <text class="label" x="710" y="617" text-anchor="middle">g(1)</text>
  <rect x="662" y="638" width="96" height="34" rx="10" fill="#fee2e2" stroke="#ef4444" />
  <text class="label" x="710" y="661" text-anchor="middle">g(0) → 1</text>
  <text class="tiny" x="802" y="520">호출하며 먼저 출력</text>
  <rect x="804" y="532" width="56" height="34" rx="17" fill="#0f172a" />
  <rect x="874" y="532" width="56" height="34" rx="17" fill="#0f172a" />
  <rect x="944" y="532" width="56" height="34" rx="17" fill="#0f172a" />
  <text x="832" y="555" text-anchor="middle" font-size="18" font-weight="800" fill="#f8fafc">3</text>
  <text x="902" y="555" text-anchor="middle" font-size="18" font-weight="800" fill="#f8fafc">2</text>
  <text x="972" y="555" text-anchor="middle" font-size="18" font-weight="800" fill="#f8fafc">1</text>
  <text class="tiny" x="802" y="610">반환하며 계산</text>
  <text class="body" x="804" y="636">g(1)=1 → g(2)=2 → g(3)=6</text>
  <rect x="804" y="648" width="228" height="28" rx="14" fill="#fef3c7" stroke="#d97706" />
  <text class="label" x="918" y="667" text-anchor="middle">마지막 출력은 6</text>

  <rect x="66" y="714" width="1068" height="126" rx="20" fill="#0f172a" />
  <text x="92" y="750" font-size="24" font-weight="800" fill="#f8fafc">시험장에서 바로 쓰는 체크 순서</text>
  <rect x="92" y="772" width="152" height="34" rx="17" fill="#ccfbf1" />
  <text class="chip" x="168" y="794" text-anchor="middle">① 스코프 표시</text>
  <rect x="258" y="772" width="184" height="34" rx="17" fill="#dbeafe" />
  <text class="chip" x="350" y="794" text-anchor="middle">② 값 복사/참조 확인</text>
  <rect x="456" y="772" width="156" height="34" rx="17" fill="#fde68a" />
  <text class="chip" x="534" y="794" text-anchor="middle">③ ++ 위치 체크</text>
  <rect x="626" y="772" width="152" height="34" rx="17" fill="#fecaca" />
  <text class="chip" x="702" y="794" text-anchor="middle">④ 반복 경계 확인</text>
  <rect x="792" y="772" width="152" height="34" rx="17" fill="#ddd6fe" />
  <text class="chip" x="868" y="794" text-anchor="middle">⑤ 출력 시점 표시</text>
  <rect x="958" y="772" width="150" height="34" rx="17" fill="#bbf7d0" />
  <text class="chip" x="1033" y="794" text-anchor="middle">⑥ 부작용 확인</text>
  <text class="body" x="92" y="826" fill="#cbd5e1">반복문은 line / 변수 상태 / output 표를 채우고, 재귀는 호출 순서와 반환값을 따로 적으면 실수를 크게 줄일 수 있다.</text>
</svg>
