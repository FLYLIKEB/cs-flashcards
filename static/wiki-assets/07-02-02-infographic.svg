<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="920" viewBox="0 0 1280 920" role="img" aria-labelledby="title desc">
  <title id="title">07-02-02 이상현상과 함수종속</title>
  <desc id="desc">주문 테이블의 반복 저장이 갱신, 삽입, 삭제 이상으로 이어지고 정규화 분해로 해결되는 과정을 보여주는 인포그래픽</desc>
  <defs>
    <style>
      .bg { fill: #f8fafc; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .hero { fill: #0f172a; }
      .tableHead { fill: #dbeafe; }
      .warn { fill: #fff7ed; stroke: #fdba74; stroke-width: 2; }
      .good { fill: #ecfdf5; stroke: #6ee7b7; stroke-width: 2; }
      .accentBlue { fill: #1d4ed8; }
      .accentTeal { fill: #0f766e; }
      .accentPurple { fill: #6d28d9; }
      .title { font: 700 36px 'Pretendard', 'Noto Sans KR', sans-serif; fill: #ffffff; }
      .subtitle { font: 500 18px 'Pretendard', 'Noto Sans KR', sans-serif; fill: #cbd5e1; }
      .section { font: 700 26px 'Pretendard', 'Noto Sans KR', sans-serif; fill: #0f172a; }
      .label { font: 700 20px 'Pretendard', 'Noto Sans KR', sans-serif; fill: #0f172a; }
      .body { font: 500 17px 'Pretendard', 'Noto Sans KR', sans-serif; fill: #334155; }
      .small { font: 500 15px 'Pretendard', 'Noto Sans KR', sans-serif; fill: #475569; }
      .mini { font: 600 14px 'Pretendard', 'Noto Sans KR', sans-serif; fill: #334155; }
      .code { font: 700 18px 'SFMono-Regular', Consolas, monospace; fill: #1e293b; }
      .whiteLabel { font: 700 19px 'Pretendard', 'Noto Sans KR', sans-serif; fill: #ffffff; }
      .whiteBody { font: 500 15px 'Pretendard', 'Noto Sans KR', sans-serif; fill: #e2e8f0; }
    </style>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#059669" />
    </marker>
  </defs>

  <rect class="bg" width="1280" height="920" rx="28" />
  <rect class="hero" x="36" y="32" width="1208" height="128" rx="28" />
  <text class="subtitle" x="76" y="74">Database Normalization · 07-02-02</text>
  <text class="title" x="76" y="116">이상현상과 함수종속</text>
  <text class="subtitle" x="76" y="146">반복 저장이 생기면 삽입·갱신·삭제 과정에서 부작용이 생기고, 함수 종속을 분석하면 분해 기준을 찾을 수 있다.</text>

  <rect class="panel" x="48" y="188" width="1184" height="690" rx="28" />

  <text class="section" x="84" y="236">1. 원본 주문 테이블: 주문·상품·고객 정보가 한 행에 함께 들어 있음</text>
  <rect x="84" y="264" width="520" height="236" rx="22" fill="#f8fafc" stroke="#93c5fd" stroke-width="2" />
  <rect class="tableHead" x="108" y="296" width="472" height="38" rx="12" />
  <g class="mini" text-anchor="middle">
    <text x="150" y="321">주문ID</text>
    <text x="220" y="321">상품ID</text>
    <text x="304" y="321">상품명</text>
    <text x="380" y="321">단가</text>
    <text x="456" y="321">고객ID</text>
    <text x="538" y="321">고객명</text>
  </g>
  <g stroke="#cbd5e1" stroke-width="1.5">
    <line x1="108" y1="334" x2="580" y2="334" />
    <line x1="182" y1="296" x2="182" y2="456" />
    <line x1="254" y1="296" x2="254" y2="456" />
    <line x1="344" y1="296" x2="344" y2="456" />
    <line x1="416" y1="296" x2="416" y2="456" />
    <line x1="494" y1="296" x2="494" y2="456" />
    <line x1="108" y1="374" x2="580" y2="374" />
    <line x1="108" y1="414" x2="580" y2="414" />
  </g>
  <rect x="258" y="338" width="150" height="116" rx="18" fill="#fef3c7" opacity="0.85" />
  <rect x="420" y="338" width="144" height="116" rx="18" fill="#ddd6fe" opacity="0.85" />
  <g class="body" text-anchor="middle">
    <text x="150" y="362">O1001</text>
    <text x="220" y="362">P10</text>
    <text x="304" y="362">노트북</text>
    <text x="380" y="362">150만</text>
    <text x="456" y="362">C01</text>
    <text x="538" y="362">김하나</text>

    <text x="150" y="402">O1001</text>
    <text x="220" y="402">P20</text>
    <text x="304" y="402">마우스</text>
    <text x="380" y="402">3만</text>
    <text x="456" y="402">C01</text>
    <text x="538" y="402">김하나</text>

    <text x="150" y="442">O1002</text>
    <text x="220" y="442">P20</text>
    <text x="304" y="442">마우스</text>
    <text x="380" y="442">3만</text>
    <text x="456" y="442">C02</text>
    <text x="538" y="442">이두리</text>
  </g>
  <text class="small" x="108" y="478">상품 정보와 고객 정보가 여러 행에서 반복 저장되므로 수정·삽입·삭제 때 같은 사실을 여러 번 관리해야 한다.</text>

  <text class="section" x="650" y="236">2. 반복 저장이 만드는 세 가지 이상현상</text>
  <rect class="warn" x="650" y="264" width="528" height="148" rx="22" />
  <circle cx="694" cy="310" r="24" class="accentBlue" />
  <text class="whiteLabel" x="694" y="317" text-anchor="middle">1</text>
  <text class="label" x="734" y="300">갱신 이상</text>
  <text class="body" x="734" y="328">상품 P20의 단가가 바뀌면 P20이 들어간 모든 주문 행을 함께 수정해야 한다.</text>
  <text class="body" x="734" y="354">일부 행만 수정하면 같은 상품의 가격이 서로 달라져 데이터 불일치가 생긴다.</text>
  <text class="code" x="734" y="387">상품ID → 상품명, 단가</text>

  <rect class="warn" x="650" y="430" width="528" height="148" rx="22" />
  <circle cx="694" cy="476" r="24" class="accentBlue" />
  <text class="whiteLabel" x="694" y="483" text-anchor="middle">2</text>
  <text class="label" x="734" y="466">삽입 이상</text>
  <text class="body" x="734" y="494">신상품 P30을 먼저 등록하고 싶어도 주문 행이 없으면 주문ID 같은 불필요한 값이 필요해진다.</text>
  <text class="body" x="734" y="520">즉, 상품 마스터가 주문 발생 여부에 묶여 있어 독립 삽입이 불가능하다.</text>
  <text class="code" x="734" y="553">상품ID → 상품명, 단가</text>

  <rect class="warn" x="650" y="596" width="528" height="148" rx="22" />
  <circle cx="694" cy="642" r="24" class="accentBlue" />
  <text class="whiteLabel" x="694" y="649" text-anchor="middle">3</text>
  <text class="label" x="734" y="632">삭제 이상</text>
  <text class="body" x="734" y="660">마지막 주문 한 행을 삭제했는데 그 행에만 남아 있던 고객명·상품명 정보까지 함께 사라질 수 있다.</text>
  <text class="body" x="734" y="686">주문 기록 삭제가 마스터 데이터 손실로 이어지면 운영상 큰 문제가 된다.</text>
  <text class="code" x="734" y="719">고객ID → 고객명, 상품ID → 상품명, 단가</text>

  <line x1="604" y1="382" x2="640" y2="338" stroke="#2563eb" stroke-width="4" marker-end="url(#arrowBlue)" />
  <line x1="604" y1="382" x2="640" y2="504" stroke="#2563eb" stroke-width="4" marker-end="url(#arrowBlue)" />
  <line x1="604" y1="382" x2="640" y2="670" stroke="#2563eb" stroke-width="4" marker-end="url(#arrowBlue)" />

  <text class="section" x="84" y="552">3. 정규화 후 분해: 반복의 원인을 따로 저장</text>
  <rect class="good" x="84" y="584" width="520" height="230" rx="22" />

  <rect x="112" y="620" width="132" height="74" rx="18" fill="#ffffff" stroke="#10b981" stroke-width="2" />
  <text class="label" x="178" y="650" text-anchor="middle">상품</text>
  <text class="small" x="130" y="676">상품ID</text>
  <text class="small" x="130" y="696">상품명, 단가</text>

  <rect x="264" y="620" width="132" height="74" rx="18" fill="#ffffff" stroke="#10b981" stroke-width="2" />
  <text class="label" x="330" y="650" text-anchor="middle">고객</text>
  <text class="small" x="282" y="676">고객ID</text>
  <text class="small" x="282" y="696">고객명</text>

  <rect x="416" y="620" width="132" height="74" rx="18" fill="#ffffff" stroke="#10b981" stroke-width="2" />
  <text class="label" x="482" y="650" text-anchor="middle">주문</text>
  <text class="small" x="434" y="676">주문ID</text>
  <text class="small" x="434" y="696">고객ID</text>

  <rect x="188" y="720" width="256" height="74" rx="18" fill="#ffffff" stroke="#10b981" stroke-width="2" />
  <text class="label" x="316" y="750" text-anchor="middle">주문상세</text>
  <text class="small" x="214" y="776">주문ID, 상품ID → 수량</text>

  <line x1="482" y1="694" x2="374" y2="720" stroke="#059669" stroke-width="4" marker-end="url(#arrowGreen)" />
  <line x1="178" y1="694" x2="258" y2="720" stroke="#059669" stroke-width="4" marker-end="url(#arrowGreen)" />
  <line x1="330" y1="694" x2="330" y2="720" stroke="#059669" stroke-width="4" marker-end="url(#arrowGreen)" />

  <text class="small" x="112" y="606">상품·고객 마스터와 주문 사실을 분리하면 중복 저장이 줄고, 각 사실을 필요한 위치에서만 관리할 수 있다.</text>
  <text class="small" x="112" y="835">효과: 상품은 독립 삽입 가능, 가격 변경은 1행만 수정, 주문 삭제가 고객/상품 마스터 삭제로 이어지지 않음.</text>

  <rect x="650" y="770" width="528" height="44" rx="16" fill="#eff6ff" stroke="#93c5fd" stroke-width="2" />
  <text class="small" x="674" y="798">핵심 연결: 이상현상은 반복 저장의 결과이고, 함수 종속은 반복의 원인을 설명하며, 정규화는 그 원인을 분리하는 절차다.</text>
</svg>
