<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">14-2. 캐시 미스와 AMAT 흐름도</title>
  <desc id="desc">캐시 hit와 miss 경로, miss penalty, AMAT 계산 관계를 단계적으로 설명하는 흐름도</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eff6ff"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <style>
      .title { font: 700 32px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .subtitle { font: 500 17px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
      .section { font: 700 21px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .body { font: 500 16px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
      .label { font: 700 18px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .note { font: 600 14px 'Pretendard','Noto Sans KR',sans-serif; fill: #475569; }
      .formula { font: 700 28px 'Pretendard','Noto Sans KR',sans-serif; fill: #1d4ed8; }
    </style>
  </defs>

  <rect width="1200" height="620" fill="url(#bg)"/>
  <rect x="28" y="28" width="1144" height="564" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <text class="title" x="68" y="92">캐시 hit / miss 흐름과 AMAT</text>
  <text class="subtitle" x="68" y="126">상위 계층에서 바로 찾으면 hit time만 들고, 못 찾으면 아래 계층까지 내려가며 miss penalty가 붙습니다.</text>

  <rect x="74" y="176" width="220" height="78" rx="20" fill="#dbeafe" stroke="#60a5fa"/>
  <text class="label" x="184" y="210" text-anchor="middle">CPU가 데이터 요청</text>
  <text class="note" x="184" y="232" text-anchor="middle">load / store 시작</text>

  <rect x="366" y="176" width="230" height="78" rx="20" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
  <text class="label" x="481" y="210" text-anchor="middle">L1 캐시 확인</text>
  <text class="note" x="481" y="232" text-anchor="middle">가장 먼저 검사하는 빠른 계층</text>

  <line x1="294" y1="215" x2="366" y2="215" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="680" y="114" width="420" height="126" rx="22" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text class="section" x="708" y="154">hit 경로</text>
  <text class="body" x="708" y="186">• 요청한 블록을 바로 찾음</text>
  <text class="body" x="708" y="214">• 응답 시간은 주로 hit time</text>
  <text class="body" x="708" y="242">• 파이프라인 정체가 가장 적음</text>

  <line x1="596" y1="185" x2="680" y2="168" stroke="#16a34a" stroke-width="4" marker-end="url(#arrow)"/>
  <text class="note" x="612" y="168">hit</text>

  <rect x="680" y="286" width="420" height="206" rx="22" fill="#fff7ed" stroke="#f97316" stroke-width="2"/>
  <text class="section" x="708" y="326">miss 경로</text>
  <text class="body" x="708" y="358">1. L2/L3/메인 메모리 등 더 아래 계층으로 내려감</text>
  <text class="body" x="708" y="390">2. 필요한 블록을 가져와 상위 캐시에 채움</text>
  <text class="body" x="708" y="422">3. 기다린 시간이 miss penalty로 누적됨</text>
  <text class="body" x="708" y="454">4. miss rate가 높을수록 평균 지연이 커짐</text>

  <line x1="596" y1="245" x2="680" y2="318" stroke="#ea580c" stroke-width="4" marker-end="url(#arrow)"/>
  <text class="note" x="608" y="284">miss</text>

  <rect x="74" y="320" width="520" height="172" rx="24" fill="#f8fafc" stroke="#cbd5e1"/>
  <text class="section" x="102" y="360">왜 미스를 줄이려 할까?</text>
  <text class="body" x="102" y="392">• L1 miss 한 번이 바로 메모리 접근 전체를 느리게 만들 수 있기 때문</text>
  <text class="body" x="102" y="424">• 지역성이 좋으면 같은 캐시 라인을 재사용해 miss rate를 낮출 수 있음</text>
  <text class="body" x="102" y="456">• 블로킹, 순차 접근, 연속 배치가 대표적인 개선 방법</text>

  <rect x="74" y="522" width="1026" height="50" rx="18" fill="#dbeafe" stroke="#93c5fd"/>
  <text class="formula" x="102" y="556">AMAT = Hit Time + Miss Rate × Miss Penalty</text>
  <text class="note" x="734" y="554">miss가 자주 나거나 아래 계층이 느릴수록 평균 접근 시간이 커집니다.</text>
</svg>