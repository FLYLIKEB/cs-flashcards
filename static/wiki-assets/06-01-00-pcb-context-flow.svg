<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">06-01 PCB와 문맥 전환 흐름</title>
  <desc id="desc">프로그램이 프로세스로 생성되고, PCB에 상태가 저장되며, CPU가 스레드를 실행하고 문맥 전환 때 PCB를 갱신하는 흐름을 설명하는 SVG</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#eef2ff" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb" />
    </marker>
    <style>
      .title { font: 700 34px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .subtitle { font: 500 17px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
      .section { font: 700 23px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .label { font: 700 18px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .body { font: 500 15px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
      .small { font: 600 13px 'Pretendard','Noto Sans KR',sans-serif; fill: #475569; }
      .tiny { font: 600 12px 'Pretendard','Noto Sans KR',sans-serif; fill: #64748b; }
      .light { fill: #ffffff; }
      .center { text-anchor: middle; }
    </style>
  </defs>

  <rect width="1200" height="720" fill="url(#bg)" />
  <rect x="28" y="28" width="1144" height="664" rx="30" fill="#ffffff" stroke="#dbeafe" stroke-width="2" />

  <text class="small" x="72" y="76">프로세스 실행 흐름 · PCB · context switch</text>
  <text class="title" x="72" y="118">PCB와 문맥 전환 한눈에 보기</text>
  <text class="subtitle" x="72" y="152">운영체제는 PCB에 문맥을 저장해 프로세스를 멈췄다가도 이어서 실행한다.</text>

  <rect x="72" y="206" width="240" height="134" rx="24" fill="#eff6ff" stroke="#60a5fa" stroke-width="2" />
  <text class="section" x="96" y="242">1. 프로그램 적재</text>
  <text class="body" x="96" y="274">디스크의 실행 파일이 메모리에 올라오면</text>
  <text class="body" x="96" y="298">운영체제가 프로세스를 만든다.</text>
  <rect x="96" y="308" width="110" height="22" rx="11" fill="#dbeafe" />
  <text class="tiny center" x="151" y="323">실행 파일</text>

  <rect x="366" y="206" width="240" height="134" rx="24" fill="#eef2ff" stroke="#818cf8" stroke-width="2" />
  <text class="section" x="390" y="242">2. PCB 생성</text>
  <text class="body" x="390" y="274">운영체제가 PID, 상태, PC, 레지스터,</text>
  <text class="body" x="390" y="298">스케줄링 정보를 PCB에 기록한다.</text>
  <rect x="390" y="308" width="160" height="22" rx="11" fill="#c7d2fe" />
  <text class="tiny center" x="470" y="323">실행 재개용 문맥 저장</text>

  <rect x="660" y="206" width="240" height="134" rx="24" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2" />
  <text class="section" x="684" y="242">3. 스레드 실행</text>
  <text class="body" x="684" y="274">CPU는 프로세스 안의 스레드를 잡아</text>
  <text class="body" x="684" y="298">명령을 순서대로 수행한다.</text>
  <rect x="684" y="308" width="168" height="22" rx="11" fill="#ddd6fe" />
  <text class="tiny center" x="768" y="323">각 스레드는 자기 스택 보유</text>

  <rect x="954" y="206" width="160" height="134" rx="24" fill="#ecfeff" stroke="#22c55e" stroke-width="2" />
  <text class="section" x="978" y="242">4. 재개</text>
  <text class="body" x="978" y="274">저장된 문맥으로</text>
  <text class="body" x="978" y="298">다시 이어 실행</text>

  <line x1="312" y1="273" x2="366" y2="273" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)" />
  <line x1="606" y1="273" x2="660" y2="273" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)" />
  <line x1="900" y1="273" x2="954" y2="273" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)" />

  <rect x="72" y="388" width="488" height="250" rx="26" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" />
  <text class="section" x="96" y="424">PCB 안에 들어가는 핵심 정보</text>
  <rect x="96" y="448" width="200" height="46" rx="16" fill="#dbeafe" />
  <text class="label center" x="196" y="476">프로세스 상태</text>
  <rect x="314" y="448" width="200" height="46" rx="16" fill="#bfdbfe" />
  <text class="label center" x="414" y="476">PID</text>
  <rect x="96" y="510" width="200" height="46" rx="16" fill="#c7d2fe" />
  <text class="label center" x="196" y="538">PC / 레지스터 값</text>
  <rect x="314" y="510" width="200" height="46" rx="16" fill="#ddd6fe" />
  <text class="label center" x="414" y="538">스케줄링 정보</text>
  <text class="body" x="96" y="590">CPU를 빼앗기거나 I/O를 기다릴 때도 PCB 덕분에</text>
  <text class="body" x="96" y="614">운영체제가 어디까지 실행했는지 기억할 수 있다.</text>

  <rect x="608" y="388" width="506" height="250" rx="26" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" />
  <text class="section" x="632" y="424">문맥 전환에서 실제로 일어나는 일</text>
  <rect x="632" y="452" width="212" height="60" rx="18" fill="#eff6ff" stroke="#60a5fa" stroke-width="2" />
  <text class="label center" x="738" y="480">실행 중인 프로세스 A</text>
  <text class="small center" x="738" y="503">PC=120, 레지스터 값 보유</text>
  <rect x="878" y="452" width="212" height="60" rx="18" fill="#eef2ff" stroke="#818cf8" stroke-width="2" />
  <text class="label center" x="984" y="480">PCB A에 저장</text>
  <text class="small center" x="984" y="503">멈춘 지점 기록</text>
  <rect x="632" y="538" width="212" height="60" rx="18" fill="#f5f3ff" stroke="#a78bfa" stroke-width="2" />
  <text class="label center" x="738" y="566">다음 프로세스 B 선택</text>
  <text class="small center" x="738" y="589">ready queue에서 선택</text>
  <rect x="878" y="538" width="212" height="60" rx="18" fill="#ecfeff" stroke="#22c55e" stroke-width="2" />
  <text class="label center" x="984" y="566">PCB B에서 복원</text>
  <text class="small center" x="984" y="589">저장된 PC부터 재시작</text>
  <line x1="844" y1="482" x2="878" y2="482" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)" />
  <line x1="984" y1="512" x2="984" y2="538" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)" />
  <line x1="878" y1="568" x2="844" y2="568" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)" />
</svg>
