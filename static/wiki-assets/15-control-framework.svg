<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">15. 금융 데이터·규제·보안 통제 프레임워크</title>
  <desc id="desc">금융공기업 IT 관점에서 데이터, 규제, 보안, 운영 통제가 어떤 질문을 던지고 어떤 구현 포인트로 이어지는지 정리한 SVG</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <style>
      text { font-family: 'Pretendard','Noto Sans KR',sans-serif; }
      .eyebrow { font-size: 13px; font-weight: 700; fill: #bfdbfe; letter-spacing: 0.05em; }
      .title { font-size: 34px; font-weight: 800; fill: #ffffff; }
      .subtitle { font-size: 16px; font-weight: 500; fill: #dbeafe; }
      .section { font-size: 22px; font-weight: 800; fill: #0f172a; }
      .label { font-size: 18px; font-weight: 800; fill: #0f172a; }
      .body { font-size: 15px; font-weight: 500; fill: #334155; }
      .small { font-size: 13px; font-weight: 700; fill: #475569; }
      .center { text-anchor: middle; }
    </style>
  </defs>

  <rect width="1200" height="760" fill="url(#bg)"/>
  <rect x="34" y="30" width="1132" height="700" rx="30" fill="#ffffff" filter="url(#shadow)"/>

  <rect x="34" y="30" width="1132" height="132" rx="30" fill="url(#hero)"/>
  <text class="eyebrow" x="78" y="72">CONTROL FRAMEWORK SUMMARY</text>
  <text class="title" x="78" y="110">금융데이터 · 규제 · 보안 · 운영</text>
  <text class="subtitle" x="78" y="138">금융 시스템은 “기능이 된다”보다 “통제 가능한 상태로 운영된다”가 중요하므로, 각 영역의 질문과 구현 포인트를 함께 기억해야 합니다.</text>

  <rect x="78" y="194" width="1044" height="74" rx="22" fill="#f8fafc" stroke="#cbd5e1"/>
  <text class="section" x="104" y="225">같은 거래라도 네 가지 질문으로 점검한다</text>
  <text class="body" x="104" y="250">무엇을 보관하는가 → 설명 가능한가 → 위·변조를 막는가 → 장애가 나도 복구 가능한가</text>

  <rect x="78" y="300" width="228" height="338" rx="26" fill="#ecfeff" stroke="#14b8a6" stroke-width="2"/>
  <text class="section" x="104" y="338">1. 데이터</text>
  <text class="label" x="104" y="374">중요 질문</text>
  <text class="body" x="104" y="402">어떤 데이터를 왜 보관하는가?</text>
  <text class="label" x="104" y="448">구현 포인트</text>
  <text class="body" x="104" y="476">• 최소수집과 목적 제한</text>
  <text class="body" x="104" y="502">• 보존주기와 파기 기준</text>
  <text class="body" x="104" y="528">• 마스킹과 비식별 처리</text>
  <text class="body" x="104" y="554">• 접근기록과 조회 추적</text>
  <rect x="104" y="582" width="176" height="34" rx="17" fill="#ccfbf1"/>
  <text class="small center" x="192" y="604">개인정보 + 거래 증빙</text>

  <rect x="332" y="300" width="228" height="338" rx="26" fill="#eff6ff" stroke="#3b82f6" stroke-width="2"/>
  <text class="section" x="358" y="338">2. 규제</text>
  <text class="label" x="358" y="374">중요 질문</text>
  <text class="body" x="358" y="402">누가 언제 무엇을 했는지 설명 가능한가?</text>
  <text class="label" x="358" y="448">구현 포인트</text>
  <text class="body" x="358" y="476">• 감사 로그와 승인 이력</text>
  <text class="body" x="358" y="502">• 변경관리와 배포 승인</text>
  <text class="body" x="358" y="528">• 보고 기준 데이터 정합성</text>
  <text class="body" x="358" y="554">• 증적 보존과 추적 가능성</text>
  <rect x="358" y="582" width="176" height="34" rx="17" fill="#dbeafe"/>
  <text class="small center" x="446" y="604">설명 가능한 서비스 운영</text>

  <rect x="586" y="300" width="228" height="338" rx="26" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="2"/>
  <text class="section" x="612" y="338">3. 보안</text>
  <text class="label" x="612" y="374">중요 질문</text>
  <text class="body" x="612" y="402">거래와 정보가 위·변조되지 않았는가?</text>
  <text class="label" x="612" y="448">구현 포인트</text>
  <text class="body" x="612" y="476">• 인증·인가와 권한 분리</text>
  <text class="body" x="612" y="502">• 전송·저장 구간 암호화</text>
  <text class="body" x="612" y="528">• 키 관리와 무결성 검증</text>
  <text class="body" x="612" y="554">• 이상 행위 탐지와 대응</text>
  <rect x="612" y="582" width="176" height="34" rx="17" fill="#ede9fe"/>
  <text class="small center" x="700" y="604">신뢰를 지키는 기술 통제</text>

  <rect x="840" y="300" width="282" height="338" rx="26" fill="#f0fdf4" stroke="#22c55e" stroke-width="2"/>
  <text class="section" x="866" y="338">4. 운영</text>
  <text class="label" x="866" y="374">중요 질문</text>
  <text class="body" x="866" y="402">장애가 나도 복구 가능한가?</text>
  <text class="label" x="866" y="448">구현 포인트</text>
  <text class="body" x="866" y="476">• 백업, 재처리 절차, 대사</text>
  <text class="body" x="866" y="502">• RTO·RPO와 DR 훈련</text>
  <text class="body" x="866" y="528">• 모니터링과 장애 보고 체계</text>
  <text class="body" x="866" y="554">• 접근권한 분리와 승인 체계</text>
  <rect x="866" y="582" width="206" height="34" rx="17" fill="#dcfce7"/>
  <text class="small center" x="969" y="604">통제 가능한 상태로 운영</text>

  <rect x="78" y="664" width="1044" height="42" rx="18" fill="#0f172a"/>
  <text class="subtitle" x="104" y="690">면접 연결: API, 데이터, 보안, 운영을 따로 말하지 말고 “감사 가능하고 복구 가능한 금융 서비스”라는 한 문장으로 묶어 설명합니다.</text>
</svg>
