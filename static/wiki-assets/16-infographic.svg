<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc">
  <title id="title">16. 인공지능·기계학습 개요 인포그래픽</title>
  <desc id="desc">AI, ML, DL의 포함 관계와 학습 유형, 금융권 답안 프레임을 읽기 쉽게 나눈 인포그래픽</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#94a3b8" flood-opacity="0.16"/>
    </filter>
    <style>
      .title { font: 700 34px 'Pretendard', 'Noto Sans KR', sans-serif; fill: #ffffff; }
      .subtitle { font: 500 17px 'Pretendard', 'Noto Sans KR', sans-serif; fill: #dbeafe; }
      .section { font: 700 24px 'Pretendard', 'Noto Sans KR', sans-serif; fill: #0f172a; }
      .label { font: 700 22px 'Pretendard', 'Noto Sans KR', sans-serif; fill: #0f172a; }
      .body { font: 500 16px 'Pretendard', 'Noto Sans KR', sans-serif; fill: #334155; }
      .small { font: 600 14px 'Pretendard', 'Noto Sans KR', sans-serif; fill: #475569; }
      .chip { font: 700 15px 'Pretendard', 'Noto Sans KR', sans-serif; fill: #1e293b; }
      .step { font: 700 18px 'Pretendard', 'Noto Sans KR', sans-serif; fill: #ffffff; }
    </style>
  </defs>

  <rect width="1200" height="860" fill="url(#bg)"/>
  <rect x="32" y="28" width="1136" height="804" rx="28" fill="#ffffff" filter="url(#shadow)"/>

  <rect x="64" y="56" width="1072" height="126" rx="24" fill="url(#hero)"/>
  <text class="small" x="96" y="92">금융공기업 IT · 16장 빠른 개요</text>
  <text class="title" x="96" y="128">AI 개념 구분과 답안 작성 축을 먼저 잡는 페이지</text>
  <text class="subtitle" x="96" y="158">한 장에서 꼭 기억할 것은 포함 관계, 학습 유형, 그리고 성능·통제·운영을 함께 말하는 답안 구조다.</text>

  <g transform="translate(72 214)">
    <rect width="474" height="580" rx="28" fill="#f8fafc" stroke="#cbd5e1"/>
    <text class="section" x="28" y="42">1) AI · ML · DL 포함 관계</text>
    <text class="body" x="28" y="72">용어를 넓은 개념부터 안쪽으로 설명하면 면접 답변이 깔끔해진다.</text>

    <rect x="28" y="106" width="418" height="250" rx="28" fill="#dbeafe" stroke="#60a5fa" stroke-width="2.5"/>
    <text class="label" x="56" y="144">AI</text>
    <text class="body" x="56" y="174">규칙 기반 시스템까지 포함하는 가장 넓은 개념</text>
    <text class="small" x="56" y="202">예: 전문가 시스템, 추천 엔진, 예측 모델</text>

    <rect x="76" y="196" width="320" height="118" rx="24" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2.5"/>
    <text class="label" x="104" y="234">ML</text>
    <text class="body" x="104" y="264">데이터에서 패턴과 규칙을 학습하는 방법론</text>
    <text class="small" x="104" y="292">예: 회귀, 분류, 군집화, 이상탐지</text>

    <rect x="136" y="244" width="184" height="54" rx="18" fill="#312e81"/>
    <text class="step" x="228" y="278" text-anchor="middle">DL = 다층 신경망</text>

    <text class="chip" x="28" y="406">핵심 비교</text>
    <rect x="28" y="424" width="418" height="124" rx="20" fill="#ffffff" stroke="#cbd5e1"/>
    <text class="body" x="48" y="454">• AI: 목표 전체를 가리키는 상위 개념</text>
    <text class="body" x="48" y="484">• ML: 데이터를 이용해 규칙을 스스로 학습</text>
    <text class="body" x="48" y="514">• DL: 복잡한 비선형 패턴을 신경망으로 학습</text>

    <text class="chip" x="28" y="584">답안 팁</text>
    <text class="body" x="28" y="612">"AI 안에 ML이 있고, ML 안에 DL이 있다"로 시작하면</text>
    <text class="body" x="28" y="638">포함 관계와 예시를 30초 안에 정리하기 쉽다.</text>
  </g>

  <g transform="translate(572 214)">
    <rect width="556" height="264" rx="28" fill="#f8fafc" stroke="#cbd5e1"/>
    <text class="section" x="28" y="42">2) 학습 유형 3가지</text>
    <text class="body" x="28" y="72">문제 유형과 금융 사례를 함께 외우면 하위 페이지 연결이 빨라진다.</text>

    <rect x="28" y="104" width="152" height="128" rx="22" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
    <text class="label" x="104" y="138" text-anchor="middle">지도학습</text>
    <text class="body" x="48" y="170">정답 라벨이 있는</text>
    <text class="body" x="48" y="194">데이터로 예측</text>
    <text class="small" x="48" y="220">금융 예: 대출 연체 예측</text>

    <rect x="202" y="104" width="152" height="128" rx="22" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
    <text class="label" x="278" y="138" text-anchor="middle">비지도학습</text>
    <text class="body" x="224" y="170">라벨 없이 군집·구조를</text>
    <text class="body" x="224" y="194">찾아내는 방식</text>
    <text class="small" x="224" y="220">금융 예: 고객 세분화</text>

    <rect x="376" y="104" width="152" height="128" rx="22" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
    <text class="label" x="452" y="138" text-anchor="middle">강화학습</text>
    <text class="body" x="398" y="170">행동 보상을 통해</text>
    <text class="body" x="398" y="194">정책을 개선</text>
    <text class="small" x="398" y="220">금융 예: 동적 의사결정</text>
  </g>

  <g transform="translate(572 506)">
    <rect width="556" height="288" rx="28" fill="#fff7ed" stroke="#fdba74"/>
    <text class="section" x="28" y="42">3) 금융권 답안 프레임</text>
    <text class="body" x="28" y="72">정확도만 말하면 약하다. 지표 해석과 통제를 함께 묶어야 설득력이 생긴다.</text>

    <rect x="28" y="102" width="238" height="74" rx="18" fill="#ffffff" stroke="#fed7aa"/>
    <text class="label" x="48" y="132">성능</text>
    <text class="body" x="48" y="156">accuracy만 보지 말고 precision·recall과 비용을 같이 설명</text>

    <rect x="290" y="102" width="238" height="74" rx="18" fill="#ffffff" stroke="#fed7aa"/>
    <text class="label" x="310" y="132">데이터</text>
    <text class="body" x="310" y="156">train/validation/test 분리와 데이터 누수 방지를 먼저 점검</text>

    <rect x="28" y="194" width="238" height="74" rx="18" fill="#ffffff" stroke="#fed7aa"/>
    <text class="label" x="48" y="224">통제</text>
    <text class="body" x="48" y="248">승인 절차, XAI, 감사 가능성까지 적어 실무성을 보강</text>

    <rect x="290" y="194" width="238" height="74" rx="18" fill="#ffffff" stroke="#fed7aa"/>
    <text class="label" x="310" y="224">운영</text>
    <text class="body" x="310" y="248">공정성, drift, 개인정보 보호를 운영 리스크와 연결</text>
  </g>
</svg>
