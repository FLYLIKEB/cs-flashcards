  <text class="small" x="88" y="92">금융공기업 IT · SVG 인포그래픽</text>
  <text class="title" x="88" y="116"><tspan x="88" dy="0">16. 인공지능 기계학습</tspan></text>
  <text class="subtitle" x="88" y="198"><tspan x="88" dy="0">한국은행 컴퓨터공학 전공학술에서는 인공지능과 기계학습이 전산학 기본 이론,</tspan><tspan x="88" dy="24">데이터 처리, 금융 실무 통제와 함께 출제된다. 이 장은 한 페이지에 몰려</tspan></text>
  <g class="float1"><rect x="90" y="126" width="170" height="42" rx="21" fill="#f3e8ff" stroke="#9333ea" stroke-opacity="0.18"/><text class="chip" x="175" y="152" text-anchor="middle">인공지능 기계학습</text></g><g class="float2"><rect x="300" y="126" width="170" height="42" rx="21" fill="#eff6ff" stroke="#9333ea" stroke-opacity="0.18"/><text class="chip" x="385" y="152" text-anchor="middle">AI 생성 시각 자료. 데이터 입력</text></g><g class="float3"><rect x="510" y="126" width="170" height="42" rx="21" fill="#f3e8ff" stroke="#9333ea" stroke-opacity="0.18"/><text class="chip" x="595" y="152" text-anchor="middle">모델 판단</text></g><g class="float1"><rect x="720" y="126" width="170" height="42" rx="21" fill="#eff6ff" stroke="#9333ea" stroke-opacity="0.18"/><text class="chip" x="805" y="152" text-anchor="middle">평가 지표</text></g>
