  <text class="body" x="108" y="546"><tspan x="108" dy="0">모델 판단</tspan></text>
  <circle cx="832" cy="545" r="6" fill="#3b82f6" class="pulse" style="animation-delay:0.0s"/><text class="focus" x="850" y="553"><tspan x="850" dy="0">AI, ML, DL의 관계와 학습 유형을</tspan><tspan x="850" dy="18">서로 구분해 설명할 수 있다.</tspan></text><circle cx="832" cy="603" r="6" fill="#3b82f6" class="pulse" style="animation-delay:0.45s"/><text class="focus" x="850" y="611"><tspan x="850" dy="0">학습 데이터 준비, 검증 절차, 데이터 누수</tspan><tspan x="850" dy="18">방지 원칙을 답안 형태로 정리할 수 있다.</tspan></text><circle cx="832" cy="661" r="6" fill="#3b82f6" class="pulse" style="animation-delay:0.9s"/><text class="focus" x="850" y="669"><tspan x="850" dy="0">평가 지표를 불균형 데이터와 금융권 비용</tspan><tspan x="850" dy="18">구조에 맞춰 선택할 수 있다.</tspan></text>
