<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">14-1. CPU 설계 인포그래픽</title>
  <desc id="desc">CPU 설계 핵심인 5단계 파이프라인, 해저드, 슈퍼스칼라, 분기 예측의 관계를 보여주는 SVG</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="pipe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <style>
      .title { font: 700 34px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .subtitle { font: 500 17px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
      .section { font: 700 20px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .label { font: 700 18px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .body { font: 500 15px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
      .small { font: 600 13px 'Pretendard','Noto Sans KR',sans-serif; fill: #475569; }
      .tiny { font: 600 12px 'Pretendard','Noto Sans KR',sans-serif; fill: #475569; }
      .mono { font: 600 13px 'SFMono-Regular',Consolas,monospace; fill: #0f172a; }
    </style>
  </defs>

  <rect width="1200" height="720" fill="url(#bg)"/>
  <rect x="28" y="28" width="1144" height="664" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <text x="72" y="88" class="small">컴퓨터구조 · CPU 설계</text>
  <text x="72" y="126" class="title">처리량은 파이프라인으로, 안정성은 해저드 제어로</text>
  <text x="72" y="160" class="subtitle">IF → ID → EX → MEM → WB의 5단계가 겹쳐 흐르며, 데이터·구조·제어 해저드를 줄일수록 CPU 효율이 올라간다.</text>

  <rect x="64" y="196" width="1072" height="154" rx="24" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="88" y="230" class="section">5단계 파이프라인</text>
  <text x="88" y="252" class="small">지연시간 단축보다 여러 명령어를 동시에 흘려 처리량을 높이는 구조</text>

  <rect x="92" y="274" width="190" height="54" rx="16" fill="url(#pipe)"/>
  <rect x="296" y="274" width="190" height="54" rx="16" fill="#60a5fa"/>
  <rect x="500" y="274" width="190" height="54" rx="16" fill="#38bdf8"/>
  <rect x="704" y="274" width="190" height="54" rx="16" fill="#22c55e"/>
  <rect x="908" y="274" width="190" height="54" rx="16" fill="#a78bfa"/>

  <text x="187" y="307" text-anchor="middle" class="label" fill="#ffffff">IF</text>
  <text x="391" y="307" text-anchor="middle" class="label" fill="#ffffff">ID</text>
  <text x="595" y="307" text-anchor="middle" class="label" fill="#ffffff">EX</text>
  <text x="799" y="307" text-anchor="middle" class="label" fill="#ffffff">MEM</text>
  <text x="1003" y="307" text-anchor="middle" class="label" fill="#ffffff">WB</text>

  <line x1="282" y1="301" x2="296" y2="301" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="486" y1="301" x2="500" y2="301" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="690" y1="301" x2="704" y2="301" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="894" y1="301" x2="908" y2="301" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow)"/>

  <text x="110" y="343" class="body">명령어 인출, PC 갱신</text>
  <text x="314" y="343" class="body">해독, 레지스터 읽기</text>
  <text x="518" y="343" class="body">연산, 주소 계산, 분기 판단</text>
  <text x="722" y="343" class="body">load/store 메모리 접근</text>
  <text x="926" y="343" class="body">결과를 레지스터에 기록</text>

  <rect x="64" y="378" width="528" height="274" rx="24" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <text x="88" y="414" class="section">해저드: 흐름을 깨는 세 가지 충돌</text>
  <text x="88" y="436" class="small">겹쳐 실행하려면 자원 충돌, 결과 의존성, 분기 불확실성을 제어해야 한다.</text>

  <rect x="92" y="460" width="148" height="74" rx="18" fill="#ffffff" stroke="#fb923c" stroke-width="2"/>
  <text x="166" y="490" text-anchor="middle" class="label">구조적</text>
  <text x="166" y="512" text-anchor="middle" class="tiny">같은 자원을 동시에 요구</text>
  <text x="166" y="526" text-anchor="middle" class="tiny">해결: 자원 분리, 스톨</text>

  <rect x="254" y="460" width="148" height="74" rx="18" fill="#ffffff" stroke="#ef4444" stroke-width="2"/>
  <text x="328" y="490" text-anchor="middle" class="label">데이터</text>
  <text x="328" y="512" text-anchor="middle" class="tiny">RAW: 이전 결과 미준비</text>
  <text x="328" y="526" text-anchor="middle" class="tiny">해결: 포워딩, 버블</text>

  <rect x="416" y="460" width="148" height="74" rx="18" fill="#ffffff" stroke="#8b5cf6" stroke-width="2"/>
  <text x="490" y="490" text-anchor="middle" class="label">제어</text>
  <text x="490" y="512" text-anchor="middle" class="tiny">분기 결과 전 인출</text>
  <text x="490" y="526" text-anchor="middle" class="tiny">해결: 예측, 플러시</text>

  <rect x="92" y="557" width="472" height="74" rx="18" fill="#111827"/>
  <text x="116" y="586" class="mono" fill="#e5e7eb">add r1, r2, r3</text>
  <text x="116" y="611" class="mono" fill="#fca5a5">sub r4, r1, r5  ← r1 준비 전이면 RAW 해저드</text>
  <line x1="336" y1="534" x2="336" y2="557" stroke="#ef4444" stroke-width="3" stroke-dasharray="6 6"/>

  <rect x="620" y="378" width="516" height="274" rx="24" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/>
  <text x="644" y="414" class="section">확장 설계: 슈퍼스칼라 + 분기 예측</text>
  <text x="644" y="436" class="small">발행 폭을 넓혀 동시에 더 많이 보내고, 분기 결과를 미리 맞혀 파이프라인 정지를 줄인다.</text>

  <text x="644" y="474" class="label">슈퍼스칼라</text>
  <rect x="644" y="490" width="212" height="110" rx="18" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
  <text x="664" y="520" class="small">1클럭에 여러 명령 발행</text>
  <rect x="666" y="538" width="48" height="34" rx="10" fill="#2563eb"/>
  <rect x="722" y="538" width="48" height="34" rx="10" fill="#0ea5e9"/>
  <rect x="778" y="538" width="48" height="34" rx="10" fill="#22c55e"/>
  <text x="690" y="560" text-anchor="middle" class="tiny" fill="#ffffff">I1</text>
  <text x="746" y="560" text-anchor="middle" class="tiny" fill="#ffffff">I2</text>
  <text x="802" y="560" text-anchor="middle" class="tiny" fill="#ffffff">I3</text>
  <text x="664" y="589" class="tiny">의존성·리네이밍·ROB 필요</text>

  <text x="884" y="474" class="label">분기 예측</text>
  <rect x="884" y="490" width="224" height="110" rx="18" fill="#ffffff" stroke="#a78bfa" stroke-width="2"/>
  <path d="M 918 548 C 958 500, 1008 500, 1044 548" fill="none" stroke="#8b5cf6" stroke-width="4"/>
  <path d="M 918 548 C 958 596, 1008 596, 1044 548" fill="none" stroke="#c084fc" stroke-width="4"/>
  <line x1="1044" y1="548" x2="1082" y2="548" stroke="#8b5cf6" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="916" y="520" class="tiny">taken / not taken을 미리 추정</text>
  <text x="916" y="584" class="tiny">실패 시 flush → 깊은 파이프라인일수록 손해 증가</text>

  <line x1="748" y1="196" x2="748" y2="350" stroke="#0ea5e9" stroke-width="4" stroke-dasharray="10 8">
    <animate attributeName="stroke-dashoffset" from="0" to="-36" dur="2.8s" repeatCount="indefinite"/>
  </line>
  <text x="762" y="218" class="tiny">겹쳐 흐르는 명령</text>

  <text x="72" y="682" class="small">핵심: 파이프라인은 처리량을 높이지만, 성능의 실제 승부는 해저드 완화와 분기 정확도에서 난다.</text>
</svg>
