<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">14-1. CPU 설계 개요 인포그래픽</title>
  <desc id="desc">CPU 설계의 핵심인 5단계 파이프라인, 해저드 대응, 슈퍼스칼라와 분기 예측의 관계를 읽기 쉽게 정리한 SVG</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <style>
      .title { font: 700 34px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .subtitle { font: 500 18px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
      .section { font: 700 23px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .label { font: 700 18px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .body { font: 500 15px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
      .small { font: 600 13px 'Pretendard','Noto Sans KR',sans-serif; fill: #475569; }
      .tiny { font: 600 12px 'Pretendard','Noto Sans KR',sans-serif; fill: #475569; }
      .stageText { font: 700 18px 'Pretendard','Noto Sans KR',sans-serif; fill: #ffffff; }
      .mono { font: 600 13px 'SFMono-Regular',Consolas,monospace; fill: #e2e8f0; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="1200" height="760" fill="url(#bg)"/>
  <rect x="26" y="26" width="1148" height="708" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <text x="72" y="86" class="small">컴퓨터구조 · CPU 설계</text>
  <text x="72" y="126" class="title">파이프라인으로 처리량을 올리고, 해저드 제어로 손실을 줄인다</text>
  <text x="72" y="158" class="subtitle">5단계 실행 흐름 위에 해저드 대응과 분기 예측이 얹히면서 실제 CPI가 결정된다.</text>

  <rect x="64" y="194" width="1072" height="174" rx="24" fill="#eff6ff" stroke="#bfdbfe" stroke-width="2"/>
  <text x="92" y="232" class="section">1. 5단계 파이프라인</text>
  <text x="92" y="256" class="small">한 명령어의 지연시간 자체보다 여러 명령어를 겹쳐 흘려 처리량을 높이는 구조</text>

  <rect x="96" y="286" width="180" height="56" rx="16" fill="#2563eb"/>
  <rect x="300" y="286" width="180" height="56" rx="16" fill="#3b82f6"/>
  <rect x="504" y="286" width="180" height="56" rx="16" fill="#0ea5e9"/>
  <rect x="708" y="286" width="180" height="56" rx="16" fill="#14b8a6"/>
  <rect x="912" y="286" width="180" height="56" rx="16" fill="#8b5cf6"/>

  <text x="186" y="321" text-anchor="middle" class="stageText">IF</text>
  <text x="390" y="321" text-anchor="middle" class="stageText">ID</text>
  <text x="594" y="321" text-anchor="middle" class="stageText">EX</text>
  <text x="798" y="321" text-anchor="middle" class="stageText">MEM</text>
  <text x="1002" y="321" text-anchor="middle" class="stageText">WB</text>

  <line x1="276" y1="314" x2="300" y2="314" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="480" y1="314" x2="504" y2="314" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="684" y1="314" x2="708" y2="314" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="888" y1="314" x2="912" y2="314" stroke="#2563eb" stroke-width="4" marker-end="url(#arrow)"/>

  <text x="110" y="356" class="body">명령어 인출, PC 갱신</text>
  <text x="314" y="356" class="body">명령 해독, 레지스터 읽기</text>
  <text x="518" y="356" class="body">연산, 주소 계산, 분기 판단</text>
  <text x="722" y="356" class="body">load/store 메모리 접근</text>
  <text x="926" y="356" class="body">결과를 레지스터 파일에 기록</text>

  <rect x="64" y="394" width="516" height="296" rx="24" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <text x="92" y="432" class="section">2. 해저드가 CPI를 밀어 올린다</text>
  <text x="92" y="456" class="small">겹쳐 실행하다 보니 자원 충돌, 결과 의존성, 분기 불확실성이 생긴다.</text>

  <rect x="96" y="482" width="452" height="60" rx="16" fill="#ffffff" stroke="#fed7aa" stroke-width="2"/>
  <rect x="96" y="554" width="452" height="60" rx="16" fill="#ffffff" stroke="#fecaca" stroke-width="2"/>
  <rect x="96" y="626" width="452" height="44" rx="16" fill="#ffffff" stroke="#ddd6fe" stroke-width="2"/>

  <text x="118" y="506" class="label">구조적 해저드</text>
  <text x="250" y="506" class="body">같은 하드웨어 자원을 동시에 요구</text>
  <text x="118" y="528" class="small">해결: 자원 분리, 포트 추가, 스톨</text>

  <text x="118" y="578" class="label">데이터 해저드</text>
  <text x="250" y="578" class="body">이전 결과가 아직 준비되지 않은 상태</text>
  <text x="118" y="600" class="small">해결: forwarding, stall, 리네이밍</text>

  <text x="118" y="652" class="label">제어 해저드</text>
  <text x="250" y="652" class="body">분기 결과를 알기 전 다음 명령을 가져옴</text>

  <rect x="96" y="646" width="452" height="24" rx="12" fill="none"/>
  <text x="118" y="673" class="small">해결: branch prediction, flush, 더 빠른 분기 판단</text>

  <rect x="608" y="394" width="528" height="296" rx="24" fill="#f5f3ff" stroke="#c4b5fd" stroke-width="2"/>
  <text x="636" y="432" class="section">3. 더 넓게 발행하고, 더 빨리 맞힌다</text>
  <text x="636" y="456" class="small">고성능 CPU는 한 클럭에 더 많이 보내고, 분기 실패 비용도 줄이려 한다.</text>

  <rect x="640" y="484" width="220" height="170" rx="20" fill="#ffffff" stroke="#93c5fd" stroke-width="2"/>
  <text x="664" y="516" class="label">슈퍼스칼라</text>
  <text x="664" y="540" class="body">한 클럭에 여러 명령 발행</text>
  <rect x="666" y="560" width="48" height="34" rx="10" fill="#2563eb"/>
  <rect x="724" y="560" width="48" height="34" rx="10" fill="#0ea5e9"/>
  <rect x="782" y="560" width="48" height="34" rx="10" fill="#22c55e"/>
  <text x="690" y="582" text-anchor="middle" class="tiny" fill="#ffffff">I1</text>
  <text x="748" y="582" text-anchor="middle" class="tiny" fill="#ffffff">I2</text>
  <text x="806" y="582" text-anchor="middle" class="tiny" fill="#ffffff">I3</text>
  <text x="664" y="620" class="small">의존성 검사, 리네이밍, ROB가 뒤따른다.</text>

  <rect x="884" y="484" width="220" height="170" rx="20" fill="#ffffff" stroke="#a78bfa" stroke-width="2"/>
  <text x="908" y="516" class="label">분기 예측</text>
  <text x="908" y="540" class="body">taken / not taken을 미리 추정</text>
  <path d="M 926 590 C 968 546, 1010 546, 1048 590" fill="none" stroke="#8b5cf6" stroke-width="4"/>
  <path d="M 926 590 C 968 634, 1010 634, 1048 590" fill="none" stroke="#c084fc" stroke-width="4"/>
  <line x1="1048" y1="590" x2="1084" y2="590" stroke="#8b5cf6" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="908" y="620" class="small">실패 시 flush가 필요하고 깊은 파이프라인일수록 손실이 커진다.</text>

  <rect x="640" y="666" width="464" height="42" rx="16" fill="#111827"/>
  <text x="660" y="692" class="mono">예시: 분기 실패율 × 분기 비율 × flush 비용이 CPI를 다시 키운다.</text>

  <text x="72" y="722" class="small">핵심: 파이프라인은 처리량을 높이지만, 실제 성능은 해저드 완화와 분기 정확도까지 관리해야 나온다.</text>
</svg>
