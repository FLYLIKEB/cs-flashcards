<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">07-01-02. 무결성 규칙 예시 SVG</title>
  <desc id="desc">엔터티 무결성, 참조 무결성, 도메인 무결성을 각각 정상 사례와 위반 사례로 비교하는 예시 인포그래픽</desc>
  <defs>
    <style>
      .title { font: 700 34px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .subtitle { font: 500 18px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
      .section { font: 700 22px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .label { font: 700 18px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .body { font: 500 16px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
      .small { font: 600 14px 'Pretendard','Noto Sans KR',sans-serif; fill: #475569; }
      .mono { font: 700 17px 'SFMono-Regular','Consolas',monospace; fill: #0f172a; }
      .good { fill: #166534; }
      .bad { fill: #b91c1c; }
      .center { text-anchor: middle; }
    </style>
  </defs>

  <rect width="1200" height="780" fill="#f8fafc"/>
  <rect x="24" y="24" width="1152" height="732" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <text class="title" x="72" y="96">무결성 규칙 예시</text>
  <text class="subtitle" x="72" y="132">정상 입력과 위반 입력을 나란히 보면 시험에서 어떤 값이 틀렸는지 빠르게 구분할 수 있다.</text>

  <g transform="translate(68 176)">
    <rect width="320" height="530" rx="24" fill="#fff7ed" stroke="#fdba74" stroke-width="2.5"/>
    <text class="section" x="28" y="42">엔터티 무결성</text>
    <text class="body" x="28" y="72">기본키는 NULL 도 안 되고 중복도 안 된다.</text>

    <rect x="28" y="102" width="264" height="150" rx="18" fill="#ffffff" stroke="#86efac" stroke-width="2"/>
    <text class="label" x="48" y="132">정상 사례</text>
    <text class="mono good" x="48" y="168">학생ID = S101</text>
    <text class="body" x="48" y="198">이름 = 김민수</text>
    <text class="body" x="48" y="226">→ 각 학생을 하나로 식별 가능</text>

    <rect x="28" y="280" width="264" height="198" rx="18" fill="#ffffff" stroke="#fca5a5" stroke-width="2"/>
    <text class="label" x="48" y="310">위반 사례</text>
    <text class="mono bad" x="48" y="346">학생ID = NULL</text>
    <text class="mono bad" x="48" y="376">학생ID = S101 (중복)</text>
    <text class="body" x="48" y="408">→ 어떤 행이 누구인지 확정 불가</text>
    <text class="small" x="48" y="442">기본키가 흔들리면 엔터티 자체를</text>
    <text class="small" x="48" y="462">식별할 수 없게 된다.</text>
  </g>

  <g transform="translate(440 176)">
    <rect width="320" height="530" rx="24" fill="#ecfeff" stroke="#67e8f9" stroke-width="2.5"/>
    <text class="section" x="28" y="42">참조 무결성</text>
    <text class="body" x="28" y="72">외래키는 존재하는 부모 키를 가리키거나 NULL 이어야 한다.</text>

    <rect x="28" y="102" width="264" height="150" rx="18" fill="#ffffff" stroke="#86efac" stroke-width="2"/>
    <text class="label" x="48" y="132">정상 사례</text>
    <text class="mono good" x="48" y="168">성적.학생ID = S101</text>
    <text class="body" x="48" y="198">학생 테이블에 S101 존재</text>
    <text class="body" x="48" y="226">→ 연결된 주문/성적 관계 유지</text>

    <rect x="28" y="280" width="264" height="198" rx="18" fill="#ffffff" stroke="#fca5a5" stroke-width="2"/>
    <text class="label" x="48" y="310">위반 사례</text>
    <text class="mono bad" x="48" y="346">성적.학생ID = S999</text>
    <text class="body" x="48" y="376">학생 테이블에 S999 없음</text>
    <text class="body" x="48" y="408">→ 존재하지 않는 학생의 성적이 됨</text>
    <text class="small" x="48" y="442">고아 데이터가 생기면 테이블 간</text>
    <text class="small" x="48" y="462">관계 의미가 무너진다.</text>
  </g>

  <g transform="translate(812 176)">
    <rect width="320" height="530" rx="24" fill="#f0fdf4" stroke="#86efac" stroke-width="2.5"/>
    <text class="section" x="28" y="42">도메인 무결성</text>
    <text class="body" x="28" y="72">속성값은 자료형, 범위, 형식을 지켜야 한다.</text>

    <rect x="28" y="102" width="264" height="150" rx="18" fill="#ffffff" stroke="#86efac" stroke-width="2"/>
    <text class="label" x="48" y="132">정상 사례</text>
    <text class="mono good" x="48" y="168">점수 = 95</text>
    <text class="body" x="48" y="198">정수형 · 0~100 범위 만족</text>
    <text class="body" x="48" y="226">→ 컬럼 규칙과 의미가 일치</text>

    <rect x="28" y="280" width="264" height="198" rx="18" fill="#ffffff" stroke="#fca5a5" stroke-width="2"/>
    <text class="label" x="48" y="310">위반 사례</text>
    <text class="mono bad" x="48" y="346">점수 = 105</text>
    <text class="mono bad" x="48" y="376">점수 = '결시'</text>
    <text class="body" x="48" y="408">→ 허용 범위·자료형을 벗어남</text>
    <text class="small" x="48" y="442">컬럼이 받기로 한 값의 약속을</text>
    <text class="small" x="48" y="462">지키는 규칙이 도메인 무결성이다.</text>
  </g>
</svg>
