<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc">
  <title id="title">07-01-01. 릴레이션-튜플-속성 인포그래픽</title>
  <desc id="desc">학생 테이블 예시를 이용해 릴레이션은 표 전체, 튜플은 행, 속성은 열이며 각 속성은 도메인을 가진다는 점과 중복 튜플 불허, 튜플 순서 무의미, 속성명 유일 규칙을 설명하는 SVG</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0f9ff"/>
      <stop offset="55%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#115e59"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#0f766e"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#b45309"/>
    </marker>
    <style>
      text { font-family: 'Pretendard', 'Noto Sans KR', sans-serif; }
      .eyebrow { font-size: 14px; font-weight: 700; fill: #475569; }
      .title { font-size: 34px; font-weight: 800; fill: #0f172a; }
      .subtitle { font-size: 18px; font-weight: 500; fill: #334155; }
      .section { font-size: 20px; font-weight: 800; fill: #0f172a; }
      .card-title { font-size: 18px; font-weight: 800; fill: #0f172a; }
      .label { font-size: 16px; font-weight: 700; fill: #0f172a; }
      .body { font-size: 15px; font-weight: 500; fill: #334155; }
      .small { font-size: 14px; font-weight: 600; fill: #475569; }
      .cell { font-size: 18px; font-weight: 700; fill: #0f172a; }
      .header-cell { font-size: 18px; font-weight: 800; fill: #ffffff; }
      .rule { font-size: 16px; font-weight: 700; fill: #0f172a; }
      .accent-blue { fill: #1d4ed8; }
      .accent-teal { fill: #0f766e; }
      .accent-amber { fill: #b45309; }
      .warn { font-size: 16px; font-weight: 800; fill: #991b1b; }
    </style>
  </defs>

  <rect width="1200" height="860" fill="url(#bg)"/>
  <rect x="28" y="28" width="1144" height="804" rx="32" fill="#ffffff" stroke="#cbd5e1"/>

  <text class="eyebrow" x="72" y="78">관계형 데이터베이스 기본 용어</text>
  <text class="title" x="72" y="120">07-01-01. 릴레이션 · 튜플 · 속성</text>
  <text class="subtitle" x="72" y="156">표 전체는 릴레이션, 행은 튜플, 열은 속성이다. 시험에서는 세 가지 규칙을 함께 묻는다.</text>

  <g transform="translate(70 200)">
    <rect width="660" height="470" rx="28" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
    <text class="section" x="28" y="38">예시 릴레이션: 학생</text>
    <text class="small" x="28" y="66">학생 정보 전체를 담는 하나의 테이블이 릴레이션이다.</text>

    <rect x="70" y="104" width="520" height="70" rx="18" fill="url(#header)"/>
    <rect x="70" y="174" width="520" height="84" fill="#ffffff"/>
    <rect x="70" y="258" width="520" height="84" fill="#ecfeff"/>
    <rect x="70" y="342" width="520" height="84" fill="#ffffff"/>
    <rect x="70" y="104" width="520" height="322" rx="18" fill="none" stroke="#0f172a" stroke-width="2.5"/>

    <line x1="190" y1="104" x2="190" y2="426" stroke="#0f172a" stroke-width="2"/>
    <line x1="380" y1="104" x2="380" y2="426" stroke="#0f172a" stroke-width="2"/>
    <line x1="70" y1="174" x2="590" y2="174" stroke="#0f172a" stroke-width="2"/>
    <line x1="70" y1="258" x2="590" y2="258" stroke="#0f172a" stroke-width="2"/>
    <line x1="70" y1="342" x2="590" y2="342" stroke="#0f172a" stroke-width="2"/>

    <text class="header-cell" x="130" y="147" text-anchor="middle">학번</text>
    <text class="header-cell" x="285" y="147" text-anchor="middle">이름</text>
    <text class="header-cell" x="485" y="147" text-anchor="middle">나이</text>

    <text class="cell" x="130" y="222" text-anchor="middle">1001</text>
    <text class="cell" x="285" y="222" text-anchor="middle">김철수</text>
    <text class="cell" x="485" y="222" text-anchor="middle">21</text>

    <text class="cell" x="130" y="306" text-anchor="middle">1002</text>
    <text class="cell" x="285" y="306" text-anchor="middle">이영희</text>
    <text class="cell" x="485" y="306" text-anchor="middle">22</text>

    <text class="cell" x="130" y="390" text-anchor="middle">1003</text>
    <text class="cell" x="285" y="390" text-anchor="middle">박민수</text>
    <text class="cell" x="485" y="390" text-anchor="middle">20</text>

    <rect x="56" y="90" width="548" height="350" rx="26" fill="none" stroke="#2563eb" stroke-width="4" stroke-dasharray="14 10"/>
    <text class="label accent-blue" x="330" y="460" text-anchor="middle">릴레이션 = 학생 정보를 담는 표 전체</text>

    <rect x="76" y="270" width="508" height="60" rx="14" fill="none" stroke="#0f766e" stroke-width="4"/>
    <line x1="584" y1="300" x2="646" y2="300" stroke="#0f766e" stroke-width="3" marker-end="url(#arrow-teal)"/>
    <text class="label accent-teal" x="654" y="305">튜플 = 한 행의 값 묶음</text>

    <rect x="78" y="84" width="104" height="110" rx="18" fill="none" stroke="#f59e0b" stroke-width="4"/>
    <rect x="198" y="84" width="180" height="110" rx="18" fill="none" stroke="#f59e0b" stroke-width="4"/>
    <rect x="388" y="84" width="194" height="110" rx="18" fill="none" stroke="#f59e0b" stroke-width="4"/>
    <line x1="582" y1="140" x2="646" y2="140" stroke="#b45309" stroke-width="3" marker-end="url(#arrow-amber)"/>
    <text class="label accent-amber" x="654" y="135">속성 = 열과 속성명</text>
    <text class="small accent-amber" x="654" y="158">학번 · 이름 · 나이처럼 열마다 의미가 다르다.</text>
  </g>

  <g transform="translate(760 200)">
    <rect width="360" height="222" rx="28" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
    <text class="card-title" x="24" y="38">도메인</text>
    <text class="body" x="24" y="66">각 속성이 가질 수 있는 값의 범위</text>

    <rect x="24" y="92" width="92" height="34" rx="17" fill="#dbeafe"/>
    <text class="label" x="70" y="114" text-anchor="middle">학번</text>
    <text class="body" x="132" y="114">정수, 정해진 학번 형식</text>

    <rect x="24" y="138" width="92" height="34" rx="17" fill="#dcfce7"/>
    <text class="label" x="70" y="160" text-anchor="middle">이름</text>
    <text class="body" x="132" y="160">문자 집합, 공백 규칙</text>

    <rect x="24" y="184" width="92" height="34" rx="17" fill="#fef3c7"/>
    <text class="label" x="70" y="206" text-anchor="middle">나이</text>
    <text class="body" x="132" y="206">0 이상 정수</text>
  </g>

  <g transform="translate(760 446)">
    <rect width="360" height="224" rx="28" fill="#fef2f2" stroke="#fca5a5" stroke-width="2"/>
    <text class="card-title" x="24" y="38">중복 튜플 불허</text>
    <text class="body" x="24" y="66">같은 학번 · 이름 · 나이를 가진 행을</text>
    <text class="body" x="24" y="88">다시 저장하면 릴레이션 성질을 깨뜨린다.</text>

    <g transform="translate(226 28)">
      <rect x="0" y="0" width="78" height="22" rx="6" fill="#fee2e2"/>
      <rect x="10" y="12" width="78" height="22" rx="6" fill="#fecaca"/>
      <line x1="-4" y1="42" x2="96" y2="-6" stroke="#dc2626" stroke-width="5" stroke-linecap="round"/>
    </g>

    <text class="warn" x="24" y="136">같은 행 복제 금지</text>
    <text class="small" x="24" y="168">예시: 1002 / 이영희 / 22를 또 넣으면 안 된다.</text>
  </g>

  <g transform="translate(70 690)">
    <rect width="1050" height="112" rx="26" fill="#ecfeff" stroke="#99f6e4"/>
    <text class="section" x="24" y="36">핵심 암기 3문장</text>
    <text class="rule" x="24" y="64">① 튜플 순서는 바뀌어도 같은 릴레이션이다.</text>
    <text class="rule" x="24" y="88">② 한 릴레이션 안에서 속성명은 유일하다.</text>
    <text class="rule" x="24" y="112">③ 각 속성은 자신만의 도메인을 가진다.</text>
  </g>
</svg>
