<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="860" viewBox="0 0 1280 860" role="img" aria-labelledby="title desc">
  <title id="title">12. NCS exam-day checklist and strategy</title>
  <desc id="desc">NCS 시험 당일 체크리스트와 시간 관리 전략, 오답 원인 분류 루틴을 단계별 카드로 보여주는 SVG</desc>
  <defs>
    <style>
      text { font-family: 'Pretendard','Noto Sans KR',sans-serif; }
      .eyebrow { font-size: 20px; font-weight: 700; letter-spacing: 0.08em; fill: #0f766e; }
      .title { font-size: 40px; font-weight: 800; fill: #0f172a; }
      .subtitle { font-size: 20px; font-weight: 500; fill: #334155; }
      .sectionTitle { font-size: 28px; font-weight: 800; fill: #0f172a; }
      .stepTitle { font-size: 22px; font-weight: 800; fill: #0f172a; }
      .body { font-size: 17px; font-weight: 500; fill: #334155; }
      .bullet { font-size: 16px; font-weight: 500; fill: #1f2937; }
      .small { font-size: 15px; font-weight: 600; fill: #475569; }
      .pillText { font-size: 16px; font-weight: 700; fill: #0f172a; }
    </style>
  </defs>

  <rect width="1280" height="860" fill="#f8fafc"/>
  <rect x="30" y="30" width="1220" height="800" rx="32" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <text class="eyebrow" x="88" y="90">EXAM-DAY ROUTINE</text>
  <text class="title" x="88" y="142">실전 체크리스트 + 전략 고정</text>
  <text class="subtitle" x="88" y="178">문제를 푸는 순서, 시간 배분, 오답 배제 방식, 마지막 재검토까지 한 장에서 점검하는 루틴</text>

  <text class="sectionTitle" x="88" y="246">1. 시험 당일 4단계 흐름</text>

  <g transform="translate(88 276)">
    <rect width="252" height="186" rx="24" fill="#ecfeff" stroke="#67e8f9" stroke-width="2"/>
    <circle cx="48" cy="46" r="24" fill="#0891b2"/>
    <text x="48" y="53" text-anchor="middle" style="font:700 20px 'Pretendard','Noto Sans KR',sans-serif; fill:#ffffff;">1</text>
    <text class="stepTitle" x="84" y="52">전체 훑기</text>
    <text class="bullet" x="28" y="102">• 문제지 난이도와 유형을 먼저 파악</text>
    <text class="bullet" x="28" y="132">• 쉬운 문제 우선, 막히면 표시 후 이동</text>
    <text class="bullet" x="28" y="162">• 첫 인상으로 시간 낭비 구간을 예측</text>
  </g>

  <g transform="translate(374 276)">
    <rect width="252" height="186" rx="24" fill="#eff6ff" stroke="#93c5fd" stroke-width="2"/>
    <circle cx="48" cy="46" r="24" fill="#2563eb"/>
    <text x="48" y="53" text-anchor="middle" style="font:700 20px 'Pretendard','Noto Sans KR',sans-serif; fill:#ffffff;">2</text>
    <text class="stepTitle" x="84" y="52">시간 배분</text>
    <text class="bullet" x="28" y="102">• 1문제당 목표 시간을 미리 정함</text>
    <text class="bullet" x="28" y="132">• 1/3 지점에서 실제 진도와 비교</text>
    <text class="bullet" x="28" y="162">• 느린 영역은 뒤로 미루고 점수 확보</text>
  </g>

  <g transform="translate(660 276)">
    <rect width="252" height="186" rx="24" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
    <circle cx="48" cy="46" r="24" fill="#ea580c"/>
    <text x="48" y="53" text-anchor="middle" style="font:700 20px 'Pretendard','Noto Sans KR',sans-serif; fill:#ffffff;">3</text>
    <text class="stepTitle" x="84" y="52">오답 배제</text>
    <text class="bullet" x="28" y="102">• 정답 찾기보다 틀린 선택지를 제거</text>
    <text class="bullet" x="28" y="132">• 계산이 길면 근사값으로 후보 축소</text>
    <text class="bullet" x="28" y="162">• 단위와 조건을 두 번 확인</text>
  </g>

  <g transform="translate(946 276)">
    <rect width="246" height="186" rx="24" fill="#fff1f2" stroke="#fda4af" stroke-width="2"/>
    <circle cx="48" cy="46" r="24" fill="#e11d48"/>
    <text x="48" y="53" text-anchor="middle" style="font:700 20px 'Pretendard','Noto Sans KR',sans-serif; fill:#ffffff;">4</text>
    <text class="stepTitle" x="84" y="52">재검토</text>
    <text class="bullet" x="28" y="102">• 표시한 문제를 우선 복기</text>
    <text class="bullet" x="28" y="132">• 선택지 오타와 숫자 자리수 재확인</text>
    <text class="bullet" x="28" y="162">• 마지막 2~3분은 답안지 검산에 사용</text>
  </g>

  <path d="M340 368H374M626 368H660M912 368H946" fill="none" stroke="#94a3b8" stroke-width="8" stroke-linecap="round"/>

  <text class="sectionTitle" x="88" y="546">2. 체크리스트와 오답 관리 연결</text>

  <rect x="88" y="578" width="516" height="186" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text class="stepTitle" x="120" y="624">시험 직전 확인</text>
  <rect x="120" y="648" width="128" height="36" rx="18" fill="#dcfce7"/>
  <text class="pillText" x="184" y="672" text-anchor="middle">풀이 순서 고정</text>
  <rect x="264" y="648" width="128" height="36" rx="18" fill="#dbeafe"/>
  <text class="pillText" x="328" y="672" text-anchor="middle">시간 기준 설정</text>
  <rect x="408" y="648" width="152" height="36" rx="18" fill="#fee2e2"/>
  <text class="pillText" x="484" y="672" text-anchor="middle">단위·조건 재확인</text>
  <text class="bullet" x="120" y="718">• 시험 전에 내 루틴을 한 줄로 말할 수 있어야 함</text>
  <text class="bullet" x="120" y="746">• 표시 규칙과 검토 순서를 미리 정하면 실수 감소</text>

  <rect x="652" y="578" width="540" height="186" rx="24" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <text class="stepTitle" x="684" y="624">오답 원인 분류</text>
  <text class="bullet" x="684" y="664">• 표현 착오: 지문·선택지의 강조/부정 표현을 놓침</text>
  <text class="bullet" x="684" y="694">• 계산 실수: 단위 환산, 비율 계산, 자리수 착오</text>
  <text class="bullet" x="684" y="724">• 개념 오류: 유형 분류 실패, 가정 설정 미흡</text>
  <text class="bullet" x="684" y="754">• 기록 기준: 문제번호 + 원인 + 재풀이 일자를 같이 남김</text>

  <text class="small" x="88" y="800">권장 사용법: 체크리스트로 실수 가능성을 줄이고, 남은 실수는 오답노트 템플릿으로 회수한다.</text>
</svg>
