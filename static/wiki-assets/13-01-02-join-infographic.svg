<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc">
  <title id="title">13-01-02. JOIN 유형 비교</title>
  <desc id="desc">customers와 orders 예시로 INNER JOIN, LEFT OUTER JOIN, FULL OUTER JOIN의 보존 행 차이와 1대N 중복 주의점을 비교하는 SVG</desc>
  <style>
    text { font-family: "Noto Sans KR", "Apple SD Gothic Neo", sans-serif; fill: #0f172a; }
    .eyebrow { font-size: 17px; font-weight: 700; fill: #475569; }
    .title { font-size: 34px; font-weight: 800; }
    .subtitle { font-size: 18px; font-weight: 500; fill: #334155; }
    .section { font-size: 22px; font-weight: 800; }
    .label { font-size: 18px; font-weight: 700; }
    .body { font-size: 16px; font-weight: 500; fill: #334155; }
    .small { font-size: 14px; font-weight: 600; fill: #475569; }
    .mono { font-size: 15px; font-weight: 700; fill: #1e293b; font-family: "SFMono-Regular", "Menlo", monospace; }
    .pill { font-size: 14px; font-weight: 800; fill: #ffffff; }
  </style>

  <rect width="1200" height="860" fill="#f8fafc"/>
  <rect x="28" y="28" width="1144" height="804" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <text x="72" y="82" class="eyebrow">데이터베이스 · JOIN</text>
  <text x="72" y="126" class="title">JOIN 유형 비교: 어떤 행이 결과에 남는가</text>
  <text x="72" y="160" class="subtitle">JOIN은 공통 키로 표를 결합한다. 시험에서는 “매칭만 남는지, 한쪽 미매칭도 보존하는지”를 먼저 구분한다.</text>

  <rect x="64" y="196" width="314" height="212" rx="22" fill="#f8fbff" stroke="#93c5fd" stroke-width="2"/>
  <rect x="410" y="196" width="314" height="212" rx="22" fill="#f8fbff" stroke="#67e8f9" stroke-width="2"/>
  <rect x="756" y="196" width="380" height="212" rx="22" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>

  <text x="88" y="234" class="section">입력 1: customers</text>
  <text x="434" y="234" class="section">입력 2: orders</text>
  <text x="780" y="234" class="section">핵심 해석</text>

  <line x1="88" y1="258" x2="354" y2="258" stroke="#2563eb" stroke-width="2"/>
  <line x1="434" y1="258" x2="700" y2="258" stroke="#0891b2" stroke-width="2"/>
  <text x="92" y="286" class="mono">customer_id | name</text>
  <text x="92" y="316" class="body">1 | Kim</text>
  <text x="92" y="344" class="body">2 | Lee</text>
  <text x="92" y="372" class="body">3 | Park</text>
  <text x="438" y="286" class="mono">customer_id | amount</text>
  <text x="438" y="316" class="body">1 | 80</text>
  <text x="438" y="344" class="body">1 | 120</text>
  <text x="438" y="372" class="body">2 | 60</text>

  <rect x="780" y="266" width="332" height="54" rx="14" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
  <text x="804" y="289" class="label">공통 키</text>
  <text x="804" y="310" class="body">customers.customer_id = orders.customer_id</text>
  <rect x="780" y="334" width="332" height="54" rx="14" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
  <text x="804" y="357" class="label">1:N 주의</text>
  <text x="804" y="378" class="body">Kim은 주문이 2건이라 JOIN 결과도 2행이 된다.</text>

  <rect x="64" y="438" width="1072" height="114" rx="24" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <rect x="88" y="462" width="148" height="34" rx="17" fill="#2563eb"/>
  <text x="162" y="485" text-anchor="middle" class="pill">INNER JOIN</text>
  <text x="264" y="480" class="label">매칭되는 행만 남는다</text>
  <text x="264" y="507" class="body">결과 예: (Kim,80), (Kim,120), (Lee,60)</text>
  <text x="264" y="533" class="small">Park는 주문이 없으므로 제외된다.</text>
  <rect x="894" y="458" width="214" height="72" rx="16" fill="#ffffff" stroke="#93c5fd" stroke-width="1.5"/>
  <text x="914" y="482" class="small">시험 포인트</text>
  <text x="914" y="505" class="body">“교집합만 남는다”로 기억.</text>

  <rect x="64" y="572" width="1072" height="114" rx="24" fill="#f0fdf4" stroke="#4ade80" stroke-width="2"/>
  <rect x="88" y="596" width="194" height="34" rx="17" fill="#15803d"/>
  <text x="185" y="619" text-anchor="middle" class="pill">LEFT OUTER JOIN</text>
  <text x="310" y="614" class="label">왼쪽 테이블 행은 모두 보존한다</text>
  <text x="310" y="641" class="body">결과 예: Kim 2행 + Lee 1행 + Park는 order 값이 NULL</text>
  <text x="310" y="667" class="small">FROM 왼쪽에 둔 표가 기준이다. RIGHT JOIN은 방향만 반대다.</text>
  <rect x="894" y="592" width="214" height="72" rx="16" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
  <text x="914" y="616" class="small">시험 포인트</text>
  <text x="914" y="639" class="body">“기준 표 보존 + 미매칭은 NULL”.</text>

  <rect x="64" y="706" width="1072" height="96" rx="24" fill="#fff7ed" stroke="#fb923c" stroke-width="2"/>
  <rect x="88" y="730" width="190" height="34" rx="17" fill="#c2410c"/>
  <text x="183" y="753" text-anchor="middle" class="pill">FULL OUTER JOIN</text>
  <text x="306" y="748" class="label">양쪽의 미매칭 행까지 모두 보존한다</text>
  <text x="306" y="775" class="body">Park도 남고, 반대로 주문만 있고 고객이 없는 행도 NULL과 함께 남는다.</text>
  <rect x="894" y="722" width="214" height="58" rx="16" fill="#ffffff" stroke="#fdba74" stroke-width="1.5"/>
  <text x="914" y="746" class="small">시험 포인트</text>
  <text x="914" y="769" class="body">합집합에 가장 가깝다.</text>
</svg>
