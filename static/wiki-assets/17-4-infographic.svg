<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">17-4. 메시지 큐 인포그래픽</title>
  <desc id="desc">생산자, 브로커, 큐, 소비자, Kafka와 RabbitMQ 비교, 전달 보장과 백프레셔를 설명하는 메시지 큐 인포그래픽</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#ecfeff"/>
    </linearGradient>
    <linearGradient id="brokerGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1d4ed8"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="flowGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/>
    </marker>
    <style>
      text { font-family: 'Pretendard','Noto Sans KR',sans-serif; }
      .kicker { font-size: 15px; font-weight: 700; fill: #0f766e; letter-spacing: 0.08em; }
      .title { font-size: 34px; font-weight: 800; fill: #0f172a; }
      .subtitle { font-size: 17px; font-weight: 500; fill: #334155; }
      .section { font-size: 18px; font-weight: 800; fill: #0f172a; }
      .label { font-size: 16px; font-weight: 700; fill: #0f172a; }
      .body { font-size: 14px; font-weight: 500; fill: #334155; }
      .small { font-size: 12px; font-weight: 600; fill: #475569; }
      .value { font-size: 13px; font-weight: 700; fill: #1e293b; }
      .chip { font-size: 12px; font-weight: 700; fill: #0f172a; }
    </style>
  </defs>

  <rect width="1200" height="720" fill="#f8fafc"/>
  <rect x="28" y="28" width="1144" height="664" rx="28" fill="url(#bg)" stroke="#cbd5e1"/>

  <text class="kicker" x="72" y="84">ASYNC · BUFFER · REPLAY</text>
  <text class="title" x="72" y="124">17-4. 메시지 큐</text>
  <text class="subtitle" x="72" y="156">생산자와 소비자를 분리해 비동기 처리, 부하 완충, 장애 격리를 만든다.</text>
  <text class="subtitle" x="72" y="180">핵심은 브로커, 오프셋, 전달 보장, 재처리 정책을 함께 설계하는 것이다.</text>

  <rect x="64" y="216" width="650" height="430" rx="24" fill="#ffffff" stroke="#bfdbfe" stroke-width="2"/>
  <text class="section" x="92" y="254">메시지 흐름: Producer → Broker/Queue → Consumer</text>

  <rect x="96" y="300" width="140" height="116" rx="20" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
  <text class="label" x="166" y="336" text-anchor="middle">Producer</text>
  <text class="body" x="166" y="362" text-anchor="middle">거래 이벤트</text>
  <text class="body" x="166" y="384" text-anchor="middle">로그 · 알림</text>
  <circle cx="128" cy="318" r="10" fill="#2563eb" opacity="0.18"/>
  <circle cx="166" cy="318" r="10" fill="#2563eb" opacity="0.3"/>
  <circle cx="204" cy="318" r="10" fill="#2563eb" opacity="0.45"/>

  <rect x="292" y="270" width="248" height="206" rx="24" fill="url(#brokerGrad)"/>
  <text class="label" x="416" y="308" text-anchor="middle" fill="#ffffff">Broker / Topic / Queue</text>
  <text class="body" x="416" y="332" text-anchor="middle" fill="#dbeafe">생산자와 소비자 분리</text>

  <rect x="324" y="352" width="60" height="88" rx="14" fill="#ffffff" opacity="0.95"/>
  <text class="small" x="354" y="378" text-anchor="middle">P0</text>
  <text class="body" x="354" y="402" text-anchor="middle">offset</text>
  <text class="small" x="354" y="422" text-anchor="middle">0..n</text>

  <rect x="386" y="352" width="60" height="88" rx="14" fill="#ffffff" opacity="0.95"/>
  <text class="small" x="416" y="378" text-anchor="middle">P1</text>
  <text class="body" x="416" y="402" text-anchor="middle">lag</text>
  <text class="small" x="416" y="422" text-anchor="middle">buffer</text>

  <rect x="448" y="352" width="60" height="88" rx="14" fill="#ffffff" opacity="0.95"/>
  <text class="small" x="478" y="378" text-anchor="middle">P2</text>
  <text class="body" x="478" y="402" text-anchor="middle">replay</text>
  <text class="small" x="478" y="422" text-anchor="middle">retain</text>

  <line x1="236" y1="358" x2="292" y2="358" stroke="url(#flowGrad)" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/>
  <line x1="540" y1="358" x2="616" y2="358" stroke="url(#flowGrad)" stroke-width="8" stroke-linecap="round" marker-end="url(#arrow)"/>

  <rect x="616" y="284" width="72" height="104" rx="18" fill="#dcfce7" stroke="#34d399" stroke-width="2"/>
  <text class="label" x="652" y="320" text-anchor="middle">C1</text>
  <text class="body" x="652" y="346" text-anchor="middle">group A</text>
  <text class="small" x="652" y="368" text-anchor="middle">partition</text>

  <rect x="616" y="400" width="72" height="104" rx="18" fill="#dcfce7" stroke="#34d399" stroke-width="2"/>
  <text class="label" x="652" y="436" text-anchor="middle">C2</text>
  <text class="body" x="652" y="462" text-anchor="middle">group A</text>
  <text class="small" x="652" y="484" text-anchor="middle">rebalance</text>

  <text class="body" x="94" y="466">• 파티션 단위 순서 보장, 전역 순서는 비용 증가</text>
  <text class="body" x="94" y="490">• 소비자 지연 시 큐가 백프레셔를 흡수하지만 무한 증가는 불가</text>
  <text class="body" x="94" y="514">• 로그 보존/TTL/컴팩션 + 오프셋 리셋이 재처리 전략의 핵심</text>

  <rect x="94" y="550" width="588" height="72" rx="16" fill="#eff6ff" stroke="#bfdbfe"/>
  <text class="label" x="116" y="578">전달 보장</text>
  <rect x="210" y="558" width="120" height="36" rx="18" fill="#fee2e2"/>
  <text class="chip" x="270" y="581" text-anchor="middle">at-most-once</text>
  <rect x="342" y="558" width="120" height="36" rx="18" fill="#fef3c7"/>
  <text class="chip" x="402" y="581" text-anchor="middle">at-least-once</text>
  <rect x="474" y="558" width="120" height="36" rx="18" fill="#dcfce7"/>
  <text class="chip" x="534" y="581" text-anchor="middle">exactly-once</text>
  <text class="small" x="210" y="610">손실 가능</text>
  <text class="small" x="342" y="610">중복 가능</text>
  <text class="small" x="474" y="610">복잡도·비용 큼</text>

  <rect x="742" y="216" width="394" height="196" rx="24" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
  <text class="section" x="770" y="254">Kafka vs RabbitMQ</text>
  <line x1="939" y1="272" x2="939" y2="388" stroke="#cbd5e1"/>
  <text class="label" x="820" y="286" text-anchor="middle">Kafka</text>
  <text class="label" x="1036" y="286" text-anchor="middle">RabbitMQ</text>

  <text class="small" x="770" y="320">중심 모델</text>
  <text class="value" x="820" y="320" text-anchor="middle">로그 기반 스트리밍</text>
  <text class="value" x="1036" y="320" text-anchor="middle">브로커 기반 라우팅</text>

  <text class="small" x="770" y="350">강점</text>
  <text class="value" x="820" y="350" text-anchor="middle">대용량 · 재처리 · 순서</text>
  <text class="value" x="1036" y="350" text-anchor="middle">복잡한 라우팅 · 작업 큐</text>

  <text class="small" x="770" y="380">사용 예</text>
  <text class="value" x="820" y="380" text-anchor="middle">이벤트 스트림 · 로그</text>
  <text class="value" x="1036" y="380" text-anchor="middle">업무 비동기 · 알림</text>

  <rect x="742" y="432" width="394" height="214" rx="24" fill="#ffffff" stroke="#99f6e4" stroke-width="2"/>
  <text class="section" x="770" y="470">운영 포인트와 금융권 주의점</text>

  <text class="body" x="770" y="506">• 필수 지표: consumer lag, msg/s, end-to-end 지연, DLQ 비율</text>
  <text class="body" x="770" y="532">• 중복 처리 방지를 위한 아이덤포턴시 키 설계</text>
  <text class="body" x="770" y="558">• 보존 정책, 감사 로그, 재처리 절차를 문서화</text>

  <rect x="770" y="582" width="314" height="20" rx="10" fill="#e2e8f0"/>
  <rect x="770" y="582" width="218" height="20" rx="10" fill="#14b8a6">
    <animate attributeName="width" values="150;245;218" dur="4.5s" repeatCount="indefinite"/>
  </rect>
  <text class="small" x="770" y="574">Queue backlog / consumer lag</text>
  <text class="small" x="1094" y="596" text-anchor="end">임계치 초과 시 확장·재처리</text>

  <rect x="1002" y="500" width="102" height="56" rx="14" fill="#fef2f2" stroke="#f87171"/>
  <text class="label" x="1053" y="524" text-anchor="middle">DLQ</text>
  <text class="small" x="1053" y="544" text-anchor="middle">실패 메시지 격리</text>

  <text class="small" x="72" y="675">페이지 요지: 비동기화·부하 완충·재처리 가능성은 메시지 큐의 장점이지만, 순서·중복·보존 정책을 함께 설계해야 한다.</text>
</svg>
