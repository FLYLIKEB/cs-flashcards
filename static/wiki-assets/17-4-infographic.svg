<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="980" viewBox="0 0 1280 980" role="img" aria-labelledby="title desc">
  <title id="title">17-4. 메시지 큐 흐름 인포그래픽</title>
  <desc id="desc">생산자, 브로커, 파티션과 큐, 소비자 그룹, 재처리와 백프레셔를 분리해 보여주는 메시지 큐 흐름 요약도</desc>
  <defs>
    <style>
      text { font-family: 'Pretendard', 'Noto Sans KR', sans-serif; fill: #0f172a; }
      .kicker { font-size: 18px; font-weight: 800; letter-spacing: 0.12em; fill: #0f766e; }
      .title { font-size: 38px; font-weight: 800; }
      .subtitle { font-size: 20px; font-weight: 500; fill: #334155; }
      .section { font-size: 23px; font-weight: 800; }
      .label { font-size: 21px; font-weight: 800; }
      .body { font-size: 18px; font-weight: 500; fill: #334155; }
      .small { font-size: 16px; font-weight: 600; fill: #475569; }
      .chip { font-size: 16px; font-weight: 700; }
    </style>
    <marker id="arrow" viewBox="0 0 14 14" refX="12" refY="7" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M0 0L14 7L0 14Z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="1280" height="980" fill="#f8fafc"/>
  <rect x="26" y="26" width="1228" height="928" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <text class="kicker" x="72" y="92">ASYNC · BUFFER · REPLAY</text>
  <text class="title" x="72" y="138">17-4. 메시지 큐</text>
  <text class="subtitle" x="72" y="176">생산자와 소비자를 분리해 응답성을 높이고, 부하를 완충하며, 장애 전파를 줄인다.</text>
  <text class="subtitle" x="72" y="204">핵심 설계 포인트는 브로커 구조, 오프셋/ACK, 재처리, consumer lag 관리다.</text>

  <rect x="64" y="246" width="1152" height="352" rx="26" fill="#f8fbff" stroke="#bfdbfe" stroke-width="2"/>
  <text class="section" x="96" y="286">1) 기본 흐름: Producer → Broker → Consumer Group</text>

  <rect x="96" y="336" width="214" height="188" rx="24" fill="#dbeafe" stroke="#60a5fa" stroke-width="2"/>
  <text class="label" x="203" y="378" text-anchor="middle">Producer</text>
  <text class="body" x="203" y="414" text-anchor="middle">거래 이벤트 발행</text>
  <text class="body" x="203" y="442" text-anchor="middle">로그 · 알림 · 업무 요청</text>
  <text class="small" x="203" y="478" text-anchor="middle">빠르게 밀어 넣고 직접 대기하지 않음</text>

  <line x1="310" y1="430" x2="398" y2="430" stroke="#2563eb" stroke-width="10" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text class="small" x="354" y="408" text-anchor="middle">burst traffic</text>

  <rect x="400" y="310" width="360" height="248" rx="26" fill="#1d4ed8" stroke="#1e3a8a" stroke-width="2"/>
  <text x="580" y="356" text-anchor="middle" font-size="24" font-weight="800" fill="#ffffff">Broker / Topic / Queue</text>
  <text x="580" y="388" text-anchor="middle" font-size="18" font-weight="500" fill="#dbeafe">생산자와 소비자 사이에 완충 계층을 둔다</text>

  <rect x="438" y="420" width="84" height="96" rx="18" fill="#ffffff"/>
  <text class="label" x="480" y="454" text-anchor="middle">P0</text>
  <text class="small" x="480" y="482" text-anchor="middle">offset</text>
  <text class="small" x="480" y="504" text-anchor="middle">0 → n</text>

  <rect x="538" y="420" width="84" height="96" rx="18" fill="#ffffff"/>
  <text class="label" x="580" y="454" text-anchor="middle">P1</text>
  <text class="small" x="580" y="482" text-anchor="middle">buffer</text>
  <text class="small" x="580" y="504" text-anchor="middle">lag 흡수</text>

  <rect x="638" y="420" width="84" height="96" rx="18" fill="#ffffff"/>
  <text class="label" x="680" y="454" text-anchor="middle">P2</text>
  <text class="small" x="680" y="482" text-anchor="middle">retain</text>
  <text class="small" x="680" y="504" text-anchor="middle">replay 가능</text>

  <line x1="760" y1="430" x2="848" y2="430" stroke="#2563eb" stroke-width="10" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text class="small" x="804" y="408" text-anchor="middle">fetch / ack</text>

  <rect x="850" y="322" width="154" height="90" rx="22" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text class="label" x="927" y="358" text-anchor="middle">Consumer C1</text>
  <text class="small" x="927" y="386" text-anchor="middle">group A, partition 할당</text>

  <rect x="850" y="436" width="154" height="90" rx="22" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
  <text class="label" x="927" y="472" text-anchor="middle">Consumer C2</text>
  <text class="small" x="927" y="500" text-anchor="middle">지연 시 rebalance 가능</text>

  <rect x="1032" y="322" width="150" height="204" rx="22" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <text class="label" x="1107" y="358" text-anchor="middle">왜 필요한가</text>
  <text class="body" x="1058" y="396">• 비동기 처리</text>
  <text class="body" x="1058" y="426">• 부하 완충</text>
  <text class="body" x="1058" y="456">• 장애 격리</text>
  <text class="body" x="1058" y="486">• 재처리 기반</text>

  <rect x="64" y="624" width="548" height="264" rx="26" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text class="section" x="96" y="666">2) 순서 · 재처리 · 백프레셔</text>
  <text class="body" x="96" y="710">• 순서 보장은 보통 partition 단위다.</text>
  <text class="body" x="96" y="742">• 전역 순서는 partition 축소, 단일 리더 등 비용이 커진다.</text>
  <text class="body" x="96" y="774">• retention, TTL, compaction, offset reset이 재처리의 핵심이다.</text>
  <text class="body" x="96" y="806">• consumer가 느려지면 backlog가 쌓여 producer 충격을 완화한다.</text>
  <text class="body" x="96" y="838">• backlog 무한 증가는 저장소 압박과 SLA 악화로 이어진다.</text>

  <rect x="636" y="624" width="580" height="264" rx="26" fill="#f8fbff" stroke="#bfdbfe" stroke-width="2"/>
  <text class="section" x="668" y="666">3) 운영자가 보는 신호</text>

  <rect x="668" y="700" width="514" height="26" rx="13" fill="#e2e8f0"/>
  <rect x="668" y="700" width="344" height="26" rx="13" fill="#0f766e"/>
  <text class="small" x="668" y="692">consumer lag / backlog</text>
  <text class="small" x="1116" y="692" text-anchor="end">임계치 접근</text>

  <rect x="668" y="754" width="166" height="96" rx="18" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text class="label" x="751" y="790" text-anchor="middle">필수 지표</text>
  <text class="small" x="751" y="818" text-anchor="middle">lag · msg/s</text>
  <text class="small" x="751" y="840" text-anchor="middle">end-to-end 지연</text>

  <rect x="852" y="754" width="166" height="96" rx="18" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text class="label" x="935" y="790" text-anchor="middle">재처리 준비</text>
  <text class="small" x="935" y="818" text-anchor="middle">DLQ · offset reset</text>
  <text class="small" x="935" y="840" text-anchor="middle">runbook 문서화</text>

  <rect x="1036" y="754" width="146" height="96" rx="18" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
  <text class="label" x="1109" y="790" text-anchor="middle">금융권 체크</text>
  <text class="small" x="1109" y="818" text-anchor="middle">감사 로그</text>
  <text class="small" x="1109" y="840" text-anchor="middle">중복 방지 키</text>

  <text class="small" x="72" y="926">요지: 메시지 큐는 비동기화 도구이지만, 순서 보장 범위와 중복/재처리 정책을 함께 설계해야 안전하다.</text>
</svg>
