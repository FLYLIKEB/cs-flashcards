<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">11-02-01. 블랙박스와 화이트박스 인포그래픽</title>
  <desc id="desc">요구사항과 입출력을 검증하는 블랙박스 테스트와 코드 구조와 커버리지를 확인하는 화이트박스 테스트를 대비한 인포그래픽</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="blackPanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="whitePanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="bridge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#475569"/>
    </marker>
    <style>
      text { font-family: 'Pretendard', 'Noto Sans KR', sans-serif; }
      .eyebrow { font-size: 14px; font-weight: 700; fill: #475569; letter-spacing: 0.08em; }
      .title { font-size: 34px; font-weight: 800; fill: #0f172a; }
      .subtitle { font-size: 17px; font-weight: 500; fill: #334155; }
      .panelTitleDark { font-size: 28px; font-weight: 800; fill: #f8fafc; }
      .panelTitleLight { font-size: 28px; font-weight: 800; fill: #0f172a; }
      .panelTextDark { font-size: 16px; font-weight: 500; fill: #e2e8f0; }
      .panelTextLight { font-size: 16px; font-weight: 500; fill: #334155; }
      .chipDark { font-size: 14px; font-weight: 700; fill: #0f172a; }
      .chipLight { font-size: 14px; font-weight: 700; fill: #f8fafc; }
      .label { font-size: 15px; font-weight: 700; fill: #0f172a; }
      .small { font-size: 13px; font-weight: 600; fill: #64748b; }
      .mono { font-family: 'SFMono-Regular', Consolas, monospace; font-size: 14px; font-weight: 700; fill: #e2e8f0; }
    </style>
  </defs>

  <rect width="1200" height="720" fill="url(#bg)"/>
  <rect x="24" y="24" width="1152" height="672" rx="28" fill="#ffffff" stroke="#cbd5e1"/>

  <text class="eyebrow" x="72" y="78">TEST DESIGN VIEWPOINT</text>
  <text class="title" x="72" y="120">11-02-01. 블랙박스와 화이트박스</text>
  <text class="subtitle" x="72" y="156">블랙박스는 “무엇을 검증할까”, 화이트박스는 “어떻게 실행되는가”에 초점을 둔다.</text>

  <rect x="60" y="190" width="500" height="400" rx="28" fill="url(#blackPanel)"/>
  <rect x="640" y="190" width="500" height="400" rx="28" fill="url(#whitePanel)" stroke="#cbd5e1"/>

  <text class="panelTitleDark" x="92" y="238">블랙박스 테스트</text>
  <text class="panelTextDark" x="92" y="266">요구사항·명세·입출력을 보고 기능이 맞는지 검증</text>

  <rect x="92" y="298" width="116" height="40" rx="20" fill="#fde68a"/>
  <text class="chipDark" x="150" y="323" text-anchor="middle">사용자 관점</text>
  <rect x="220" y="298" width="126" height="40" rx="20" fill="#bfdbfe"/>
  <text class="chipDark" x="283" y="323" text-anchor="middle">내부 코드 미확인</text>

  <rect x="110" y="372" width="110" height="76" rx="18" fill="#e2e8f0"/>
  <text class="label" x="165" y="404" text-anchor="middle">입력</text>
  <text class="small" x="165" y="428" text-anchor="middle">경계값·대표값</text>

  <rect x="255" y="352" width="110" height="116" rx="18" fill="#111827" stroke="#94a3b8" stroke-dasharray="8 7"/>
  <text class="panelTitleDark" x="310" y="400" text-anchor="middle" font-size="22">?</text>
  <text class="panelTextDark" x="310" y="430" text-anchor="middle">내부 로직</text>

  <rect x="400" y="372" width="110" height="76" rx="18" fill="#e2e8f0"/>
  <text class="label" x="455" y="404" text-anchor="middle">출력</text>
  <text class="small" x="455" y="428" text-anchor="middle">명세 일치 확인</text>

  <line x1="220" y1="410" x2="255" y2="410" stroke="#f8fafc" stroke-width="4" marker-end="url(#arrow)"/>
  <line x1="365" y1="410" x2="400" y2="410" stroke="#f8fafc" stroke-width="4" marker-end="url(#arrow)"/>

  <rect x="92" y="494" width="436" height="72" rx="20" fill="#1e293b" stroke="#475569"/>
  <text class="chipLight" x="120" y="521">대표 기법</text>
  <text class="panelTextDark" x="120" y="547">동치분할 · 경계값 분석 · 결정 테이블 · 상태 전이 · 유스케이스</text>

  <text class="panelTitleLight" x="672" y="238">화이트박스 테스트</text>
  <text class="panelTextLight" x="672" y="266">코드의 분기·조건·반복·경로를 분석해 구조적 결함을 찾음</text>

  <rect x="672" y="298" width="108" height="40" rx="20" fill="#dbeafe"/>
  <text class="chipDark" x="726" y="323" text-anchor="middle">개발자 관점</text>
  <rect x="792" y="298" width="144" height="40" rx="20" fill="#e9d5ff"/>
  <text class="chipDark" x="864" y="323" text-anchor="middle">코드 구조 직접 확인</text>

  <rect x="672" y="360" width="220" height="162" rx="20" fill="#0f172a"/>
  <text class="mono" x="692" y="392">if (amount &gt; limit) {</text>
  <text class="mono" x="712" y="418">alert();</text>
  <text class="mono" x="692" y="444">} else if (vip &amp;&amp; ok) {</text>
  <text class="mono" x="712" y="470">approve();</text>
  <text class="mono" x="692" y="496">}</text>
  <circle cx="862" cy="392" r="9" fill="#22c55e"/>
  <circle cx="846" cy="444" r="9" fill="#f59e0b"/>
  <circle cx="878" cy="444" r="9" fill="#38bdf8"/>
  <text class="small" x="782" y="544">조건과 분기 참·거짓을 모두 설계</text>

  <g transform="translate(924 360)">
    <rect width="180" height="34" rx="17" fill="#e2e8f0"/>
    <rect x="0" y="0" width="72" height="34" rx="17" fill="#bfdbfe"/>
    <text class="label" x="14" y="22">문장</text>
    <text class="small" x="92" y="22">모든 문장 1회 실행</text>

    <rect y="42" width="180" height="34" rx="17" fill="#e2e8f0"/>
    <rect y="42" width="108" height="34" rx="17" fill="#93c5fd"/>
    <text class="label" x="14" y="64">분기</text>
    <text class="small" x="92" y="64">참/거짓 모두 통과</text>

    <rect y="84" width="180" height="34" rx="17" fill="#e2e8f0"/>
    <rect y="84" width="136" height="34" rx="17" fill="#c4b5fd"/>
    <text class="label" x="14" y="106">조건</text>
    <text class="small" x="92" y="106">원자 조건 진리값 확인</text>

    <rect y="126" width="180" height="34" rx="17" fill="#e2e8f0"/>
    <rect y="126" width="168" height="34" rx="17" fill="#a5f3fc"/>
    <text class="label" x="14" y="148">경로</text>
    <text class="small" x="92" y="148">가능 경로 폭발로 비용 큼</text>
  </g>

  <path d="M560 390C600 390 600 390 640 390" fill="none" stroke="url(#bridge)" stroke-width="12" stroke-linecap="round"/>
  <circle cx="600" cy="390" r="42" fill="#ffffff" stroke="#cbd5e1" stroke-width="6"/>
  <text class="label" x="600" y="384" text-anchor="middle">프로그램</text>
  <text class="small" x="600" y="406" text-anchor="middle">동일 대상</text>

  <rect x="60" y="612" width="1080" height="56" rx="18" fill="#f8fafc" stroke="#cbd5e1"/>
  <text class="label" x="88" y="646">핵심 비교</text>
  <text class="small" x="196" y="646">블랙박스 = 기능·명세 검증</text>
  <text class="small" x="458" y="646">화이트박스 = 로직·커버리지 검증</text>
  <text class="small" x="756" y="646">실무에서는 두 방식을 함께 사용해야 누락 기능과 구조 결함을 모두 잡을 수 있다.</text>
</svg>
