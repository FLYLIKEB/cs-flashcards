<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc">
  <title id="title">11-02-01. 블랙박스와 화이트박스 비교 인포그래픽</title>
  <desc id="desc">블랙박스 테스트와 화이트박스 테스트의 관점, 확인 대상, 강점, 대표 기준을 여유 있게 비교한 인포그래픽</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fbff"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <style>
      text { font-family: 'Pretendard', 'Noto Sans KR', sans-serif; fill: #0f172a; }
      .eyebrow { font-size: 15px; font-weight: 800; letter-spacing: 0.08em; fill: #475569; }
      .title { font-size: 34px; font-weight: 800; }
      .subtitle { font-size: 18px; font-weight: 500; fill: #334155; }
      .panelTitle { font-size: 28px; font-weight: 800; }
      .panelIntro { font-size: 17px; font-weight: 600; fill: #1e293b; }
      .sectionLabel { font-size: 14px; font-weight: 800; letter-spacing: 0.06em; fill: #475569; }
      .body { font-size: 17px; font-weight: 500; fill: #1e293b; }
      .small { font-size: 15px; font-weight: 500; fill: #334155; }
      .chip { font-size: 15px; font-weight: 700; fill: #0f172a; }
      .bottomTitle { font-size: 16px; font-weight: 800; }
      .bottomText { font-size: 15px; font-weight: 500; fill: #334155; }
    </style>
  </defs>

  <rect width="1200" height="840" fill="url(#bg)"/>
  <rect x="28" y="28" width="1144" height="784" rx="30" fill="#ffffff" stroke="#cbd5e1"/>

  <text class="eyebrow" x="72" y="88">TEST DESIGN VIEWPOINT</text>
  <text class="title" x="72" y="132">11-02-01. 블랙박스와 화이트박스</text>
  <text class="subtitle" x="72" y="170">블랙박스는 기능과 결과를, 화이트박스는 내부 로직과 커버리지를 본다.</text>

  <rect x="72" y="214" width="500" height="474" rx="28" fill="#f8fafc" stroke="#94a3b8"/>
  <rect x="628" y="214" width="500" height="474" rx="28" fill="#f8fafc" stroke="#94a3b8"/>

  <rect x="72" y="214" width="500" height="74" rx="28" fill="#dbeafe"/>
  <rect x="628" y="214" width="500" height="74" rx="28" fill="#e9d5ff"/>

  <text class="panelTitle" x="104" y="260">블랙박스 테스트</text>
  <text class="panelTitle" x="660" y="260">화이트박스 테스트</text>

  <text class="panelIntro" x="104" y="320">요구사항·입출력·명세 기준으로 결과가 맞는지 확인</text>
  <text class="panelIntro" x="660" y="320">코드의 분기·조건·반복·경로를 분석해 구조 결함 확인</text>

  <text class="sectionLabel" x="104" y="374">관점</text>
  <rect x="104" y="392" width="112" height="40" rx="20" fill="#fde68a"/>
  <text class="chip" x="160" y="418" text-anchor="middle">사용자 중심</text>
  <rect x="228" y="392" width="150" height="40" rx="20" fill="#bfdbfe"/>
  <text class="chip" x="303" y="418" text-anchor="middle">내부 코드 미확인</text>

  <text class="sectionLabel" x="660" y="374">관점</text>
  <rect x="660" y="392" width="112" height="40" rx="20" fill="#dbeafe"/>
  <text class="chip" x="716" y="418" text-anchor="middle">개발자 중심</text>
  <rect x="784" y="392" width="160" height="40" rx="20" fill="#ddd6fe"/>
  <text class="chip" x="864" y="418" text-anchor="middle">코드 구조 직접 확인</text>

  <text class="sectionLabel" x="104" y="474">무엇을 확인하나</text>
  <text class="body" x="104" y="502">• 기능 누락, 명세 불일치, 경계 처리 오류</text>
  <text class="body" x="104" y="532">• 입력을 넣었을 때 기대한 출력이 나오는지</text>
  <text class="body" x="104" y="562">• 상태 변화와 사용자 시나리오가 요구사항대로 흐르는지</text>

  <text class="sectionLabel" x="660" y="474">무엇을 확인하나</text>
  <text class="body" x="660" y="502">• 분기 누락, 잘못된 조건식, 예외 처리 누락</text>
  <text class="body" x="660" y="532">• 모든 문장과 참·거짓 경로가 실행되는지</text>
  <text class="body" x="660" y="562">• 복합 조건의 각 원자 조건이 모두 검토됐는지</text>

  <text class="sectionLabel" x="104" y="604">대표 기법 / 기준</text>
  <text class="small" x="104" y="632">동치분할 · 경계값 분석 · 결정 테이블</text>
  <text class="small" x="104" y="658">상태 전이 테스트 · 유스케이스 테스트</text>

  <text class="sectionLabel" x="660" y="604">대표 기준</text>
  <text class="small" x="660" y="632">문장 커버리지 → 분기 커버리지</text>
  <text class="small" x="660" y="658">조건 커버리지 → 경로 커버리지</text>

  <rect x="72" y="724" width="1056" height="56" rx="18" fill="#f8fafc" stroke="#cbd5e1"/>
  <text class="bottomTitle" x="102" y="758">핵심 비교</text>
  <text class="bottomText" x="212" y="758">블랙박스 = 무엇이 보여야 하는가</text>
  <text class="bottomText" x="520" y="758">화이트박스 = 내부가 어떻게 실행되는가</text>
  <text class="bottomText" x="852" y="758">실무에서는 두 방식을 함께 써야 누락 기능과 구조 결함을 모두 잡는다.</text>
</svg>
