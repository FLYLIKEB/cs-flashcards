<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
  <title id="title">입출력 방식별 데이터 흐름</title>
  <desc id="desc">폴링, 인터럽트, DMA에서 CPU와 장치, 메모리가 어떤 순서로 상호작용하는지 단계별로 보여주는 SVG</desc>
  <defs>
    <style>
      .title { font: 700 34px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .subtitle { font: 500 18px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
      .section { font: 700 22px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .label { font: 700 18px 'Pretendard','Noto Sans KR',sans-serif; fill: #0f172a; }
      .body { font: 500 16px 'Pretendard','Noto Sans KR',sans-serif; fill: #334155; }
      .tiny { font: 600 13px 'Pretendard','Noto Sans KR',sans-serif; fill: #475569; }
      .white { fill: #ffffff; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#475569"/>
    </marker>
  </defs>

  <rect width="1280" height="820" fill="#f8fafc"/>
  <rect x="28" y="28" width="1224" height="764" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <text class="title" x="72" y="92">입출력 방식별 데이터 흐름</text>
  <text class="subtitle" x="72" y="126">세 방식 모두 CPU와 장치가 협력하지만, 누가 기다리고 누가 전송을 맡는지가 다르다.</text>

  <g transform="translate(72 178)">
    <rect x="0" y="0" width="360" height="548" rx="24" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5"/>
    <text class="section" x="28" y="42">폴링</text>
    <text class="tiny" x="28" y="70">CPU가 계속 상태를 확인하며 기다린다</text>
    <rect x="28" y="102" width="92" height="52" rx="16" fill="#1d4ed8"/>
    <text class="label white" x="74" y="134" text-anchor="middle">CPU</text>
    <rect x="240" y="102" width="92" height="52" rx="16" fill="#f97316"/>
    <text class="label white" x="286" y="134" text-anchor="middle">장치</text>
    <line x1="120" y1="118" x2="240" y2="118" stroke="#475569" stroke-width="3.5" marker-end="url(#arrow)"/>
    <line x1="240" y1="138" x2="120" y2="138" stroke="#94a3b8" stroke-width="3.5" marker-end="url(#arrow)"/>
    <text class="tiny" x="180" y="106" text-anchor="middle">준비됐나?</text>
    <rect x="28" y="194" width="304" height="70" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text class="body" x="46" y="226">1. CPU가 장치 상태 레지스터를 반복 읽는다.</text>
    <text class="body" x="46" y="250">2. 준비 전까지 같은 확인을 계속한다.</text>
    <rect x="28" y="286" width="304" height="70" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text class="body" x="46" y="318">3. 준비 완료를 보면 CPU가 직접 데이터를 처리한다.</text>
    <text class="body" x="46" y="342">4. 장치가 느릴수록 CPU 대기 시간이 길어진다.</text>
    <rect x="28" y="382" width="304" height="118" rx="18" fill="#dbeafe"/>
    <text class="label" x="46" y="418">읽는 포인트</text>
    <text class="body" x="46" y="450">• 반응은 단순하지만 CPU가 계속 붙잡힌다</text>
    <text class="body" x="46" y="478">• 작고 드문 I/O에는 비효율이 크게 보인다</text>

    <rect x="392" y="0" width="360" height="548" rx="24" fill="#ecfdf5" stroke="#bbf7d0" stroke-width="1.5"/>
    <text class="section" x="420" y="42">인터럽트</text>
    <text class="tiny" x="420" y="70">이벤트가 생길 때만 CPU를 깨운다</text>
    <rect x="420" y="102" width="92" height="52" rx="16" fill="#1d4ed8"/>
    <text class="label white" x="466" y="134" text-anchor="middle">CPU</text>
    <rect x="632" y="102" width="92" height="52" rx="16" fill="#16a34a"/>
    <text class="label white" x="678" y="134" text-anchor="middle">장치</text>
    <line x1="632" y1="128" x2="512" y2="128" stroke="#16a34a" stroke-width="4" marker-end="url(#arrow)"/>
    <text class="tiny" x="572" y="106" text-anchor="middle">이벤트 발생</text>
    <rect x="420" y="194" width="304" height="70" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text class="body" x="438" y="226">1. CPU는 다른 작업을 진행한다.</text>
    <text class="body" x="438" y="250">2. 장치가 준비되면 인터럽트를 보낸다.</text>
    <rect x="420" y="286" width="304" height="70" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text class="body" x="438" y="318">3. CPU가 ISR에 들어가 필요한 처리를 수행한다.</text>
    <text class="body" x="438" y="342">4. 완료 후 원래 작업으로 복귀한다.</text>
    <rect x="420" y="382" width="304" height="118" rx="18" fill="#dcfce7"/>
    <text class="label" x="438" y="418">읽는 포인트</text>
    <text class="body" x="438" y="450">• 이벤트 기반이라 평소 CPU 낭비가 적다</text>
    <text class="body" x="438" y="478">• 빈도가 너무 높으면 전환 비용이 부담된다</text>

    <rect x="784" y="0" width="352" height="548" rx="24" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5"/>
    <text class="section" x="812" y="42">DMA</text>
    <text class="tiny" x="812" y="70">큰 데이터 복사는 CPU 대신 DMA가 맡는다</text>
    <rect x="812" y="102" width="82" height="52" rx="16" fill="#1d4ed8"/>
    <text class="label white" x="853" y="134" text-anchor="middle">CPU</text>
    <rect x="922" y="102" width="82" height="52" rx="16" fill="#facc15"/>
    <text class="label" x="963" y="134" text-anchor="middle">DMA</text>
    <rect x="1032" y="102" width="82" height="52" rx="16" fill="#f97316"/>
    <text class="label white" x="1073" y="134" text-anchor="middle">장치</text>
    <rect x="922" y="178" width="82" height="44" rx="14" fill="#e2e8f0"/>
    <text class="tiny" x="963" y="205" text-anchor="middle">메모리</text>
    <line x1="894" y1="128" x2="922" y2="128" stroke="#475569" stroke-width="3.5" marker-end="url(#arrow)"/>
    <line x1="1032" y1="128" x2="1004" y2="128" stroke="#475569" stroke-width="3.5" marker-end="url(#arrow)"/>
    <line x1="963" y1="154" x2="963" y2="178" stroke="#475569" stroke-width="3.5" marker-end="url(#arrow)"/>
    <rect x="812" y="254" width="304" height="70" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text class="body" x="830" y="286">1. CPU가 버퍼 주소, 길이, 방향만 설정한다.</text>
    <text class="body" x="830" y="310">2. 실제 데이터 이동은 DMA와 메모리가 맡는다.</text>
    <rect x="812" y="346" width="304" height="70" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text class="body" x="830" y="378">3. CPU는 다른 작업을 계속 진행한다.</text>
    <text class="body" x="830" y="402">4. 전송 완료 시점만 다시 확인하거나 통지받는다.</text>
    <rect x="812" y="442" width="304" height="118" rx="18" fill="#fde68a"/>
    <text class="label" x="830" y="478">읽는 포인트</text>
    <text class="body" x="830" y="510">• 큰 전송일수록 CPU 부담 감소 효과가 커진다</text>
    <text class="body" x="830" y="538">• 캐시 일관성과 완료 동기화를 같이 설계해야 한다</text>
  </g>
</svg>