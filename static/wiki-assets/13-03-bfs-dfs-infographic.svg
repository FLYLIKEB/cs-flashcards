<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img" aria-labelledby="title desc">
  <title id="title">13-03. BFS와 DFS 비교 인포그래픽</title>
  <desc id="desc">같은 그래프에서 BFS는 레벨 순서로 퍼지고 DFS는 한 경로를 끝까지 내려간 뒤 되돌아오며, 두 탐색의 방문 순서와 핵심 사용처를 비교하는 SVG</desc>
  <defs>
    <style>
      text { font-family: 'Pretendard', 'Noto Sans KR', sans-serif; fill: #0f172a; }
      .eyebrow { font-size: 15px; font-weight: 800; letter-spacing: 0.08em; fill: #475569; }
      .title { font-size: 34px; font-weight: 800; }
      .subtitle { font-size: 18px; font-weight: 500; fill: #334155; }
      .sectionTitle { font-size: 26px; font-weight: 800; }
      .body { font-size: 16px; font-weight: 500; fill: #334155; }
      .strong { font-size: 17px; font-weight: 800; }
      .small { font-size: 14px; font-weight: 600; fill: #475569; }
      .label { font-size: 13px; font-weight: 800; fill: #1e293b; }
      .nodeText { font-size: 20px; font-weight: 800; }
      .orderText { font-size: 15px; font-weight: 700; fill: #0f172a; }
      .footerTitle { font-size: 18px; font-weight: 800; }
    </style>
    <marker id="bfsArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" viewBox="0 0 12 12">
      <path d="M0 0 L12 6 L0 12 Z" fill="#0284c7"/>
    </marker>
    <marker id="dfsArrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" viewBox="0 0 12 12">
      <path d="M0 0 L12 6 L0 12 Z" fill="#c2410c"/>
    </marker>
  </defs>

  <rect width="1200" height="840" fill="#f8fafc"/>
  <rect x="30" y="30" width="1140" height="780" rx="28" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <text x="72" y="82" class="eyebrow">GRAPH TRAVERSAL</text>
  <text x="72" y="126" class="title">13-03. BFS · DFS</text>
  <text x="72" y="160" class="subtitle">BFS는 같은 레벨을 넓게 훑고, DFS는 한 갈래를 깊게 내려간다. 시험에서는 방문 처리 시점까지 함께 기억해야 한다.</text>

  <rect x="62" y="198" width="512" height="466" rx="26" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="2"/>
  <rect x="626" y="198" width="512" height="466" rx="26" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>

  <text x="96" y="242" class="sectionTitle" fill="#075985">BFS = Queue + Level Order</text>
  <text x="96" y="270" class="body">같은 거리의 정점을 먼저 방문한다. 비가중치 최단 경로, 최소 간선 수 계산에 강하다.</text>

  <text x="660" y="242" class="sectionTitle" fill="#9a3412">DFS = Recursion / Stack + Depth First</text>
  <text x="660" y="270" class="body">한 방향으로 끝까지 내려간 뒤 막히면 되돌아온다. 경로 존재 확인, 사이클, 위상 정렬에 자주 쓰인다.</text>

  <g>
    <line x1="180" y1="402" x2="286" y2="318" stroke="#94a3b8" stroke-width="4"/>
    <line x1="180" y1="402" x2="286" y2="492" stroke="#94a3b8" stroke-width="4"/>
    <line x1="286" y1="318" x2="404" y2="276" stroke="#94a3b8" stroke-width="4"/>
    <line x1="286" y1="318" x2="404" y2="402" stroke="#94a3b8" stroke-width="4"/>
    <line x1="286" y1="492" x2="404" y2="402" stroke="#94a3b8" stroke-width="4"/>
    <line x1="286" y1="492" x2="404" y2="528" stroke="#94a3b8" stroke-width="4"/>
    <line x1="404" y1="276" x2="508" y2="402" stroke="#94a3b8" stroke-width="4"/>
    <line x1="404" y1="402" x2="508" y2="402" stroke="#94a3b8" stroke-width="4"/>
    <line x1="404" y1="528" x2="508" y2="402" stroke="#94a3b8" stroke-width="4"/>

    <path d="M180 402 L286 318" fill="none" stroke="#0284c7" stroke-width="8" stroke-linecap="round" marker-end="url(#bfsArrow)"/>
    <path d="M180 402 L286 492" fill="none" stroke="#0ea5e9" stroke-width="8" stroke-linecap="round" marker-end="url(#bfsArrow)"/>
    <path d="M286 318 L404 276" fill="none" stroke="#16a34a" stroke-width="8" stroke-linecap="round" marker-end="url(#bfsArrow)"/>
    <path d="M286 318 L404 402" fill="none" stroke="#16a34a" stroke-width="8" stroke-linecap="round" marker-end="url(#bfsArrow)"/>
    <path d="M286 492 L404 528" fill="none" stroke="#22c55e" stroke-width="8" stroke-linecap="round" marker-end="url(#bfsArrow)"/>
    <path d="M404 276 L508 402" fill="none" stroke="#6366f1" stroke-width="8" stroke-linecap="round" marker-end="url(#bfsArrow)"/>

    <circle cx="180" cy="402" r="34" fill="#ffffff" stroke="#0284c7" stroke-width="4"/>
    <circle cx="286" cy="318" r="34" fill="#ffffff" stroke="#0284c7" stroke-width="4"/>
    <circle cx="286" cy="492" r="34" fill="#ffffff" stroke="#0284c7" stroke-width="4"/>
    <circle cx="404" cy="276" r="34" fill="#ffffff" stroke="#0284c7" stroke-width="4"/>
    <circle cx="404" cy="402" r="34" fill="#ffffff" stroke="#0284c7" stroke-width="4"/>
    <circle cx="404" cy="528" r="34" fill="#ffffff" stroke="#0284c7" stroke-width="4"/>
    <circle cx="508" cy="402" r="34" fill="#ffffff" stroke="#0284c7" stroke-width="4"/>

    <text x="180" y="409" text-anchor="middle" class="nodeText">A</text>
    <text x="286" y="325" text-anchor="middle" class="nodeText">B</text>
    <text x="286" y="499" text-anchor="middle" class="nodeText">C</text>
    <text x="404" y="283" text-anchor="middle" class="nodeText">D</text>
    <text x="404" y="409" text-anchor="middle" class="nodeText">E</text>
    <text x="404" y="535" text-anchor="middle" class="nodeText">F</text>
    <text x="508" y="409" text-anchor="middle" class="nodeText">G</text>

    <rect x="114" y="298" width="70" height="28" rx="14" fill="#e0f2fe"/>
    <text x="149" y="317" text-anchor="middle" class="label">Level 0</text>
    <rect x="248" y="230" width="76" height="28" rx="14" fill="#dbeafe"/>
    <text x="286" y="249" text-anchor="middle" class="label">Level 1</text>
    <rect x="366" y="188" width="76" height="28" rx="14" fill="#dcfce7"/>
    <text x="404" y="207" text-anchor="middle" class="label">Level 2</text>
    <rect x="472" y="360" width="76" height="28" rx="14" fill="#ede9fe"/>
    <text x="510" y="379" text-anchor="middle" class="label">Level 3</text>
  </g>

  <g>
    <line x1="744" y1="402" x2="850" y2="318" stroke="#94a3b8" stroke-width="4"/>
    <line x1="744" y1="402" x2="850" y2="492" stroke="#94a3b8" stroke-width="4"/>
    <line x1="850" y1="318" x2="968" y2="276" stroke="#94a3b8" stroke-width="4"/>
    <line x1="850" y1="318" x2="968" y2="402" stroke="#94a3b8" stroke-width="4"/>
    <line x1="850" y1="492" x2="968" y2="402" stroke="#94a3b8" stroke-width="4"/>
    <line x1="850" y1="492" x2="968" y2="528" stroke="#94a3b8" stroke-width="4"/>
    <line x1="968" y1="276" x2="1072" y2="402" stroke="#94a3b8" stroke-width="4"/>
    <line x1="968" y1="402" x2="1072" y2="402" stroke="#94a3b8" stroke-width="4"/>
    <line x1="968" y1="528" x2="1072" y2="402" stroke="#94a3b8" stroke-width="4"/>

    <path d="M744 402 L850 318 L968 276 L1072 402 L968 528" fill="none" stroke="#ea580c" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#dfsArrow)"/>

    <circle cx="744" cy="402" r="34" fill="#ffffff" stroke="#c2410c" stroke-width="4"/>
    <circle cx="850" cy="318" r="34" fill="#ffffff" stroke="#c2410c" stroke-width="4"/>
    <circle cx="850" cy="492" r="34" fill="#ffffff" stroke="#c2410c" stroke-width="4"/>
    <circle cx="968" cy="276" r="34" fill="#ffffff" stroke="#c2410c" stroke-width="4"/>
    <circle cx="968" cy="402" r="34" fill="#ffffff" stroke="#c2410c" stroke-width="4"/>
    <circle cx="968" cy="528" r="34" fill="#ffffff" stroke="#c2410c" stroke-width="4"/>
    <circle cx="1072" cy="402" r="34" fill="#ffffff" stroke="#c2410c" stroke-width="4"/>

    <text x="744" y="409" text-anchor="middle" class="nodeText">A</text>
    <text x="850" y="325" text-anchor="middle" class="nodeText">B</text>
    <text x="850" y="499" text-anchor="middle" class="nodeText">C</text>
    <text x="968" y="283" text-anchor="middle" class="nodeText">D</text>
    <text x="968" y="409" text-anchor="middle" class="nodeText">E</text>
    <text x="968" y="535" text-anchor="middle" class="nodeText">F</text>
    <text x="1072" y="409" text-anchor="middle" class="nodeText">G</text>

    <rect x="1000" y="314" width="104" height="54" rx="16" fill="#ffffff" stroke="#fb923c" stroke-width="2"/>
    <text x="1052" y="337" text-anchor="middle" class="strong" fill="#9a3412">막히면</text>
    <text x="1052" y="357" text-anchor="middle" class="small">pop / return</text>
  </g>

  <rect x="94" y="582" width="448" height="58" rx="18" fill="#ffffff" stroke="#7dd3fc" stroke-width="2"/>
  <text x="118" y="606" class="strong" fill="#075985">방문 순서 예시</text>
  <text x="118" y="628" class="orderText">A → B → C → D → E → F → G</text>

  <rect x="658" y="582" width="448" height="58" rx="18" fill="#ffffff" stroke="#fdba74" stroke-width="2"/>
  <text x="682" y="606" class="strong" fill="#9a3412">방문 순서 예시</text>
  <text x="682" y="628" class="orderText">A → B → D → G → F → E → C</text>

  <rect x="62" y="690" width="1076" height="90" rx="24" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <rect x="88" y="712" width="252" height="46" rx="16" fill="#e0f2fe"/>
  <rect x="356" y="712" width="252" height="46" rx="16" fill="#dcfce7"/>
  <rect x="624" y="712" width="252" height="46" rx="16" fill="#ffedd5"/>
  <rect x="892" y="712" width="220" height="46" rx="16" fill="#ede9fe"/>

  <text x="106" y="733" class="footerTitle" fill="#075985">BFS 핵심</text>
  <text x="106" y="752" class="small">같은 레벨을 먼저 처리해 최단 거리 판단이 쉽다.</text>

  <text x="374" y="733" class="footerTitle" fill="#166534">자주 쓰는 문제</text>
  <text x="374" y="752" class="small">미로, 최소 이동 횟수, 연결 요소 탐색.</text>

  <text x="642" y="733" class="footerTitle" fill="#9a3412">DFS 핵심</text>
  <text x="642" y="752" class="small">한 경로를 깊게 확인한 뒤 되돌아오며 구조를 훑는다.</text>

  <text x="910" y="733" class="footerTitle" fill="#5b21b6">자주 쓰는 문제</text>
  <text x="910" y="752" class="small">경로 탐색, 사이클, 위상 정렬.</text>
</svg>
