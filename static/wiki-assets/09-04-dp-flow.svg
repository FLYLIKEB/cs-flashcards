<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">09-04 메모이제이션과 탭뷸레이션 비교</title>
  <desc id="desc">메모이제이션 캐시 재사용과 탭뷸레이션 테이블 채우기를 피보나치 예시로 비교하는 SVG</desc>
  <defs>
    <style>
      text { font-family: "Pretendard", "Noto Sans KR", sans-serif; fill: #0f172a; }
      .title { font-size: 36px; font-weight: 800; }
      .subtitle { font-size: 18px; font-weight: 500; fill: #334155; }
      .section { font-size: 24px; font-weight: 800; }
      .label { font-size: 18px; font-weight: 700; }
      .body { font-size: 16px; font-weight: 500; fill: #334155; }
      .small { font-size: 14px; font-weight: 600; fill: #475569; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .arrow { stroke: #64748b; stroke-width: 3; fill: none; }
      .memo { fill: #faf5ff; stroke: #8b5cf6; stroke-width: 2; }
      .tab { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2; }
      .code { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
    </style>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1200" height="760" fill="#f8fafc"/>
  <rect x="28" y="28" width="1144" height="704" rx="28" fill="#ffffff" stroke="#dbe4ee" stroke-width="2"/>

  <text class="title" x="72" y="96">메모이제이션과 탭뷸레이션은 무엇이 다른가</text>
  <text class="subtitle" x="72" y="134">둘 다 중복 계산을 없애서 O(n)으로 줄이지만, 하나는 재귀 호출을 유지하고 다른 하나는 표를 앞에서부터 채운다.</text>

  <rect class="panel" x="64" y="182" width="500" height="490" rx="24"/>
  <text class="section" x="92" y="226">1) 메모이제이션 (Top-down)</text>
  <text class="body" x="92" y="258">필요한 순간에만 내려가며, 계산이 끝난 값은 캐시에 저장한다.</text>

  <rect class="code" x="92" y="292" width="444" height="92" rx="16"/>
  <text class="label" x="116" y="324">기저 조건</text>
  <text class="body" x="116" y="354">if n &lt;= 1: return n</text>
  <text class="small" x="116" y="376">종료 조건이 없으면 재귀는 멈추지 않는다.</text>

  <rect class="memo" x="92" y="410" width="444" height="190" rx="20"/>
  <text class="label" x="116" y="442">캐시가 채워지는 순서 예시</text>
  <rect x="116" y="468" width="72" height="56" rx="14" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.5"/>
  <rect x="204" y="468" width="72" height="56" rx="14" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.5"/>
  <rect x="292" y="468" width="72" height="56" rx="14" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.5"/>
  <rect x="380" y="468" width="72" height="56" rx="14" fill="#ffffff" stroke="#8b5cf6" stroke-width="1.5"/>
  <text class="small" x="152" y="490" text-anchor="middle">n=2</text>
  <text class="label" x="152" y="512" text-anchor="middle">1</text>
  <text class="small" x="240" y="490" text-anchor="middle">n=3</text>
  <text class="label" x="240" y="512" text-anchor="middle">2</text>
  <text class="small" x="328" y="490" text-anchor="middle">n=4</text>
  <text class="label" x="328" y="512" text-anchor="middle">3</text>
  <text class="small" x="416" y="490" text-anchor="middle">n=5</text>
  <text class="label" x="416" y="512" text-anchor="middle">5</text>
  <text class="body" x="116" y="560">다음에 fib(3)을 다시 만나면 재귀를 더 내려가지 않고</text>
  <text class="body" x="116" y="586">캐시에 있던 값 2를 즉시 반환한다.</text>

  <rect class="panel" x="636" y="182" width="500" height="490" rx="24"/>
  <text class="section" x="664" y="226">2) 탭뷸레이션 (Bottom-up)</text>
  <text class="body" x="664" y="258">작은 상태부터 차례대로 채우므로 호출 스택 없이 반복문으로 구현한다.</text>

  <rect class="tab" x="664" y="292" width="444" height="220" rx="20"/>
  <text class="label" x="688" y="326">fib 테이블</text>
  <line x1="688" y1="350" x2="1084" y2="350" stroke="#86efac" stroke-width="2"/>
  <line x1="688" y1="400" x2="1084" y2="400" stroke="#86efac" stroke-width="2"/>
  <line x1="768" y1="326" x2="768" y2="488" stroke="#86efac" stroke-width="2"/>
  <line x1="836" y1="326" x2="836" y2="488" stroke="#86efac" stroke-width="2"/>
  <line x1="904" y1="326" x2="904" y2="488" stroke="#86efac" stroke-width="2"/>
  <line x1="972" y1="326" x2="972" y2="488" stroke="#86efac" stroke-width="2"/>
  <line x1="1040" y1="326" x2="1040" y2="488" stroke="#86efac" stroke-width="2"/>
  <text class="small" x="724" y="382" text-anchor="middle">i</text>
  <text class="small" x="802" y="382" text-anchor="middle">0</text>
  <text class="small" x="870" y="382" text-anchor="middle">1</text>
  <text class="small" x="938" y="382" text-anchor="middle">2</text>
  <text class="small" x="1006" y="382" text-anchor="middle">3</text>
  <text class="small" x="1074" y="382" text-anchor="middle">4</text>
  <text class="small" x="724" y="438" text-anchor="middle">dp[i]</text>
  <text class="label" x="802" y="438" text-anchor="middle">0</text>
  <text class="label" x="870" y="438" text-anchor="middle">1</text>
  <text class="label" x="938" y="438" text-anchor="middle">1</text>
  <text class="label" x="1006" y="438" text-anchor="middle">2</text>
  <text class="label" x="1074" y="438" text-anchor="middle">3</text>
  <text class="body" x="688" y="478">다음 칸은 dp[i] = dp[i-1] + dp[i-2]로 채운다.</text>

  <rect class="code" x="664" y="540" width="444" height="78" rx="16"/>
  <text class="label" x="688" y="572">핵심 차이</text>
  <text class="body" x="688" y="602">Memoization은 필요한 상태만 계산, Tabulation은 순서대로 전부 계산</text>

  <path class="arrow" d="M564 438 H620" marker-end="url(#arrowhead)"/>
  <text class="small" x="576" y="420">같은 문제를</text>
  <text class="small" x="576" y="438">저장/재사용</text>
</svg>
